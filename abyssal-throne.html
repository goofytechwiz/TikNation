<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030711">
<title>THE ABYSSAL THRONE · TikNation Legendary Gift</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030711;color:#eaf7ff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;padding:18px;overflow-x:hidden}
.shell{width:min(100%,1040px);text-align:center}.eyebrow{letter-spacing:.34em;font-size:11px;color:#8ddfff}.title{font-size:clamp(30px,6vw,64px);letter-spacing:.09em;margin:10px 0 5px;text-shadow:0 0 28px #35bce9}.sub{color:#9db7c9;font-size:13px;letter-spacing:.18em}
.stage{position:relative;margin:22px auto 14px;width:100%;aspect-ratio:16/9;min-height:260px;overflow:hidden;border:1px solid #32627a;border-radius:18px;background:linear-gradient(#061326 0%,#0a2840 48%,#03101d 100%);box-shadow:0 0 55px #087da533,inset 0 0 70px #000}
svg{width:100%;height:100%;display:block}.storm{animation:storm 7s infinite}.lightning{opacity:0;animation:flash 8s infinite}.lightning.two{animation-delay:3.7s}.sea{animation:sea 4s ease-in-out infinite alternate}.tower{transform-origin:50% 100%;animation:rise 3.8s cubic-bezier(.18,.7,.2,1) both}.glow{animation:pulse 2.5s ease-in-out infinite alternate}.rays{animation:ray 8s linear infinite;transform-origin:50% 50%}.mist{animation:drift 12s linear infinite alternate}.ripple{animation:ripple 4s ease-out infinite;transform-origin:50% 50%}
@keyframes rise{0%{transform:translateY(190px) scale(.94);opacity:.2}70%{opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes pulse{to{opacity:.45;filter:brightness(1.7)}}@keyframes flash{0%,94%,100%{opacity:0}95%{opacity:.85}96%{opacity:.08}97%{opacity:.65}98%{opacity:0}}
@keyframes storm{to{transform:translateX(-45px)}}@keyframes sea{to{transform:translateY(8px)}}@keyframes ray{to{transform:rotate(360deg)}}@keyframes drift{to{transform:translateX(80px);opacity:.3}}@keyframes ripple{0%{transform:scale(.2);opacity:.8}100%{transform:scale(2.2);opacity:0}}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.controls button{background:#0d2a3b;color:#eafaff;border:1px solid #56bde1;border-radius:999px;padding:12px 20px;font-weight:700;letter-spacing:.08em;cursor:pointer}.controls button:active{transform:scale(.97)}.note{font-size:11px;color:#7794a7;margin-top:14px}.price{color:#f5d58a;letter-spacing:.15em;font-size:12px;margin-top:16px}
</style></head>
<body><main class="shell">
<div class="eyebrow">TIKNATION · ORIGINAL LEGENDARY GIFT</div>
<h1 class="title">THE ABYSSAL THRONE</h1><div class="sub">WHEN THE DEEP REMEMBERS ITS KING</div>
<div class="stage" id="stage">
<svg viewBox="0 0 1200 675" role="img" aria-label="A colossal ancient ocean citadel rises from a stormy sea beneath lightning">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#030917"/><stop offset=".55" stop-color="#12334b"/><stop offset="1" stop-color="#071b2b"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#16445c"/><stop offset=".45" stop-color="#061d30"/><stop offset="1" stop-color="#020812"/></linearGradient>
 <linearGradient id="stone" x2="1" y2="1"><stop stop-color="#9ab2b9"/><stop offset=".25" stop-color="#425e6d"/><stop offset=".65" stop-color="#172c3b"/><stop offset="1" stop-color="#080f1b"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff2b0"/><stop offset=".45" stop-color="#e3b85c"/><stop offset="1" stop-color="#70451c"/></linearGradient>

 <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>

</defs>

<g class="lightning" fill="none" stroke="#b9edff" stroke-width="7"><path d="M230 80L200 170 245 160 210 265"/><path d="M930 60L900 150 944 140 915 240"/></g>
<ellipse cx="600" cy="365" rx="290" ry="210" fill="#39bfe8" opacity=".13" filter="url(#blur)"/>
<g class="rays" opacity=".18" stroke="#9deaff" stroke-width="3"><path d="M600 300L160 30M600 300L1040 30M600 300L20 300M600 300L1180 300M600 300L280 0M600 300L920 0"/></g>
<!-- distant cliffs -->
<path d="M0 350L100 280 190 345 290 300 390 355 490 320 600 350 710 310 820 350 930 295 1040 345 1120 280 1200 350V540H0Z" fill="#0a1a28"/>
<!-- colossal citadel -->
<g class="tower">
<path d="M390 475V265L445 215V160L485 200V120L530 185V95L570 175V80L610 175V105L650 185V135L700 205V170L755 225V475Z" fill="url(#stone)" stroke="#9bb5bd" stroke-width="4"/>
<path d="M420 270L600 125 735 270" fill="none" stroke="#d0e2df" stroke-width="8" opacity=".4"/>
<path d="M465 475V285L520 235V475M625 475V245L690 290V475" fill="#102331" stroke="#7897a4" stroke-width="7"/>
<path d="M555 475V300Q600 230 645 300V475Z" fill="#071522" stroke="url(#gold)" stroke-width="9"/>
<path d="M580 475V325Q600 290 620 325V475Z" fill="#4cd7ed" opacity=".65" class="glow"/>
<g fill="#b8f7ff" class="glow"><path d="M475 300h18v48h-18z"/><path d="M710 320h14v44h-14z"/><path d="M535 205h13v35h-13z"/><path d="M650 210h13v35h-13z"/></g>
<g fill="none" stroke="url(#gold)" stroke-width="10"><path d="M385 280L600 55 770 280"/><path d="M430 250L600 90 730 250"/></g>

<circle cx="600" cy="365" r="29" fill="#a9f7ff" opacity=".85" class="glow"/>

<path d="M390 475L810 475 850 530 350 530Z" fill="#0b1d2a" stroke="#7195a5" stroke-width="5"/>
</g>
<!-- ocean and spray -->
<path class="sea" d="M0 440Q100 405 210 445T430 440T650 440T870 440T1090 445T1300 430V675H0Z" fill="url(#water)"/>
<path d="M0 495Q140 460 270 500T520 495T770 500T1030 490T1250 500" fill="none" stroke="#72d7ec" stroke-width="5" opacity=".6"/>
<path d="M0 560Q160 530 320 565T640 555T960 560T1260 550" fill="none" stroke="#3e9dbb" stroke-width="4" opacity=".5"/>
<g fill="#b7f4ff" opacity=".65"><circle cx="350" cy="485" r="4"/><circle cx="830" cy="500" r="5"/><circle cx="460" cy="535" r="3"/><circle cx="740" cy="550" r="4"/></g>
<g class="mist" fill="#b7e9f5" opacity=".22" filter="url(#blur)"><ellipse cx="220" cy="475" rx="250" ry="28"/><ellipse cx="950" cy="470" rx="280" ry="30"/></g>
<g class="ripple" fill="none" stroke="#b5f5ff" stroke-width="5"><ellipse cx="600" cy="500" rx="100" ry="20"/></g>
</svg></div>
<div class="controls"><button id="replay">REPLAY ARRIVAL</button><button id="sound">ENABLE CINEMATIC SOUND</button></div>
<div class="price">LEGENDARY · 500 TEST COINS · PREVIEW ONLY</div>
<div class="note">Sound starts only when you press the sound button. No autoplay.</div>
</main>
<script>
const stage=document.getElementById('stage');
document.getElementById('replay').addEventListener('click',()=>{stage.querySelector('.tower').style.animation='none';void stage.offsetWidth;stage.querySelector('.tower').style.animation='';});
let ctx=null,osc=[],playing=false;
document.getElementById('sound').addEventListener('click',async()=>{const b=document.getElementById('sound');if(playing){osc.forEach(o=>{try{o.stop()}catch(e){}});osc=[];playing=false;b.textContent='ENABLE CINEMATIC SOUND';return;}const AC=window.AudioContext||window.webkitAudioContext;if(!AC){b.textContent='SOUND NOT SUPPORTED';return;}ctx=ctx||new AC();await ctx.resume();const now=ctx.currentTime;[55,82.4,110].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),filter=ctx.createBiquadFilter();o.type=i===0?'sawtooth':'sine';o.frequency.value=f;filter.type='lowpass';filter.frequency.value=180+i*90;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.055/(i+1),now+1.5);g.gain.exponentialRampToValueAtTime(.0001,now+8);o.connect(filter).connect(g).connect(ctx.destination);o.start(now);o.stop(now+8.1);osc.push(o);});playing=true;b.textContent='SOUND PLAYING · STOP';setTimeout(()=>{playing=false;osc=[];b.textContent='ENABLE CINEMATIC SOUND';},8200);});
</script></body></html>
