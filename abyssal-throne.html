const sprayGeo=new THREE.BufferGeometry();sprayGeo.setAttribute('position',new THREE.BufferAttribute(arr,3));const spray=new THREE.Points(sprayGeo,new THREE.PointsMaterial({color:0xa8e7f5,size:.38,transparent:true,opacity:.55}));scene.add(spray);

const ringMats=[
 new THREE.MeshBasicMaterial({color:0x24eaff,transparent:true,opacity:.72}),
 new THREE.MeshBasicMaterial({color:0xb45cff,transparent:true,opacity:.62}),
 new THREE.MeshBasicMaterial({color:0xffd477,transparent:true,opacity:.52})

[25,29,33].forEach((r,i)=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.16,8,180),ringMats[i]);ring.rotation.x=Math.PI/2+(i-1)*.18;ring.rotation.y=i*.55;arcaneGroup.add(ring);sigilRings.push(ring);});
const runeGeo=new THREE.BufferGeometry(),runePositions=new Float32Array(900*3),runePhases=[];
for(let i=0;i<900;i++){const a=Math.random()*Math.PI*2,r=18+Math.random()*28;runePositions[i*3]=Math.cos(a)*r;runePositions[i*3+1]=(Math.random()-.5)*46;runePositions[i*3+2]=Math.sin(a)*r;runePhases.push(Math.random()*Math.PI*2);}
runeGeo.setAttribute('position',new THREE.BufferAttribute(runePositions,3));
const runeField=new THREE.Points(runeGeo,new THREE.PointsMaterial({color:0x8defff,size:.7,transparent:true,opacity:.88,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(runeField);
const auroraMat=new THREE.MeshBasicMaterial({color:0x28bfff,transparent:true,opacity:.13,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});

const haloMats=[
 new THREE.MeshBasicMaterial({color:0x16eaff,transparent:true,opacity:.78,blending:THREE.AdditiveBlending,depthWrite:false}),
 new THREE.MeshBasicMaterial({color:0xb14cff,transparent:true,opacity:.62,blending:THREE.AdditiveBlending,depthWrite:false}),
 new THREE.MeshBasicMaterial({color:0xffd36a,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false})
];
const halo1=new THREE.Mesh(new THREE.TorusGeometry(43,.42,12,180),haloMats[0]);haloGroup.add(halo1);
const halo2=new THREE.Mesh(new THREE.TorusGeometry(37,.22,8,180),haloMats[1]);halo2.rotation.z=.22;haloGroup.add(halo2);
const halo3=new THREE.Mesh(new THREE.TorusGeometry(49,.13,8,180),haloMats[2]);halo3.rotation.z=-.16;haloGroup.add(halo3);

for(let i=0;i<16;i++){const a=i*Math.PI*2/16;const node=new THREE.Mesh(new THREE.OctahedronGeometry(i%4===0?1.35:.72,1),i%2?haloMats[0]:haloMats[2]);node.position.set(Math.cos(a)*43,Math.sin(a)*43,0);haloNodes.add(node);}
const waterfallGroup=new THREE.Group();scene.add(waterfallGroup);
for(let side of [-1,1])for(let j=0;j<3;j++){
 const x=side*(19+j*4),pts=[new THREE.Vector3(x,35,13),new THREE.Vector3(x+side*1.5,25,17),new THREE.Vector3(x-side*.8,12,21),new THREE.Vector3(x+side*2,-1,25)];
 const curve=new THREE.CatmullRomCurve3(pts);const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,36,.28,8,false),new THREE.MeshBasicMaterial({color:j===1?0x28eaff:0x8d55ff,transparent:true,opacity:.85,blending:THREE.AdditiveBlending}));waterfallGroup.add(tube);
}
const sparkCount=1800,sparkArray=new Float32Array(sparkCount*3),sparkSeed=[];
for(let i=0;i<sparkCount;i++){const a=Math.random()*Math.PI*2,r=22+Math.random()*42;sparkArray[i*3]=Math.cos(a)*r;sparkArray[i*3+1]=Math.random()*75-5;sparkArray[i*3+2]=Math.sin(a)*r;sparkSeed.push(Math.random()*Math.PI*2);}

const sparks=new THREE.Points(sparkGeo,new THREE.PointsMaterial({color:0xffd77b,size:.85,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(sparks);
// Lightning bolts, hidden until random flashes.

const bolts=[bolt(),bolt(),bolt()];let flashUntil=0,flashLight=new THREE.PointLight(0xb9e9ff,0,260);flashLight.position.set(0,65,-25);scene.add(flashLight);

function animate(t){requestAnimationFrame(animate);const s=(t-start)/1000;

const p=waterGeo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,base[i]+Math.sin(x*.055+s*1.5)*.34+Math.cos(z*.07+s*1.1)*.25);}p.needsUpdate=true;waterGeo.computeVertexNormals();

haloMats[0].opacity=.55+Math.sin(s*2.1)*.22;haloMats[1].opacity=.42+Math.sin(s*1.4+1)*.2;haloMats[2].opacity=.48+Math.sin(s*2.7)*.25;

let audio=null,osc=[],soundOn=false;document.getElementById('sound').onclick=async()=>{const b=document.getElementById('sound');if(soundOn){osc.forEach(o=>{try{o.stop()}catch(e){}});osc=[];soundOn=false;b.textContent='ENABLE CINEMATIC SOUND';return;}const AC=window.AudioContext||window.webkitAudioContext;if(!AC){b.textContent='SOUND NOT SUPPORTED';return;}audio=audio||new AC();await audio.resume();const now=audio.currentTime;[41.2,55,82.4].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();o.type=i===0?'triangle':'sine';o.frequency.value=f;filter.type='lowpass';filter.frequency.value=130+i*55;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.045/(i+1),now+1.8);g.gain.exponentialRampToValueAtTime(.0001,now+10);o.connect(filter).connect(g).connect(audio.destination);o.start(now);o.stop(now+10.1);osc.push(o);});soundOn=true;b.textContent='SOUND PLAYING · STOP';setTimeout(()=>{soundOn=false;osc=[];b.textContent='ENABLE CINEMATIC SOUND';},10200);};
