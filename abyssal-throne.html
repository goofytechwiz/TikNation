<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111b"><title>The Abyssal Throne · TikNation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050d15;color:#e9f8ff;font-family:Arial,Helvetica,sans-serif}
body{padding:14px;display:grid;place-items:center}.wrap{width:min(1120px,100%);text-align:center}.eyebrow{font-size:10px;letter-spacing:.34em;color:#8ccfe3}.title{font-size:clamp(29px,6vw,62px);letter-spacing:.09em;margin:9px 0 4px;text-shadow:0 0 24px #287c9d}.subtitle{font-size:11px;letter-spacing:.19em;color:#a8c0cb}
.frame{position:relative;margin:18px auto 12px;width:100%;aspect-ratio:16/9;min-height:270px;max-height:690px;overflow:hidden;border:1px solid #31566b;border-radius:14px;background:radial-gradient(ellipse at 50% 45%,#18384a,#07131e 68%,#02070c);box-shadow:0 20px 70px #000c,inset 0 0 45px #000}
#view{width:100%;height:100%;display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#c4edff;letter-spacing:.2em;font-size:12px;background:#07131e}.loading.hidden{display:none}
.hud{position:absolute;left:13px;bottom:11px;font-size:9px;letter-spacing:.16em;color:#b3cbd5;text-shadow:0 2px 6px #000}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.actions button{background:#0b2634;color:#eafaff;border:1px solid #5ba9c5;border-radius:999px;padding:12px 19px;font-weight:bold;letter-spacing:.07em;cursor:pointer}.actions button:active{transform:scale(.97)}.price{font-size:11px;color:#e8c982;letter-spacing:.17em;margin-top:14px}.note{font-size:11px;color:#829eac;margin-top:8px}
@media(max-width:600px){body{padding:9px}.frame{min-height:245px;aspect-ratio:4/3}.title{letter-spacing:.04em}.subtitle{font-size:9px}}
</style></head><body><main class="wrap">
<div class="eyebrow">TIKNATION · ORIGINAL LEGENDARY GIFT</div><h1 class="title">THE ABYSSAL THRONE</h1><div class="subtitle">THE DEEP HAS CHOSEN ITS KING</div>
<div class="frame"><canvas id="view"></canvas><div class="loading" id="loading">THE OCEAN IS WAKING…</div><div class="hud">CINEMATIC 3D · DRAG TO LOOK AROUND</div></div>
<div class="actions"><button id="replay">REPLAY THE AWAKENING</button><button id="sound">ENABLE CINEMATIC SOUND</button></div>
<div class="price">LEGENDARY · 500 TEST COINS · PREVIEW ONLY</div><div class="note">Sound is opt-in. Drag the scene to change your viewing angle.</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=> {
const canvas=document.getElementById('view'),loading=document.getElementById('loading');
if(!window.THREE){loading.textContent='3D ENGINE COULD NOT LOAD · CHECK YOUR CONNECTION';return;}
const T=window.THREE,scene=new T.Scene();scene.background=new T.Color(0x071522);scene.fog=new T.FogExp2(0x102533,.0085);
const camera=new T.PerspectiveCamera(38,1,.1,1000);camera.position.set(0,27,112);camera.lookAt(0,24,0);
const renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputEncoding=T.sRGBEncoding;
scene.add(new T.HemisphereLight(0xa6d7e8,0x081018,1.05));
const moon=new T.DirectionalLight(0xb5d8e8,2.1);moon.position.set(-45,85,55);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);scene.add(moon);
const warm=new T.PointLight(0xffbd68,2.4,58);warm.position.set(0,24,20);scene.add(warm);
const abyssLight=new T.PointLight(0x13cce9,3.2,100);abyssLight.position.set(0,18,18);scene.add(abyssLight);
function stoneTexture(){const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d');g.fillStyle='#39434a';g.fillRect(0,0,256,256);for(let i=0;i<5200;i++){const v=Math.random()*90;g.fillStyle='rgba('+Math.floor(v+65)+','+Math.floor(v+70)+','+Math.floor(v+72)+','+(Math.random()*.22)+')';g.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*5,1+Math.random()*4);}for(let y=0;y<256;y+=64){g.strokeStyle='rgba(5,12,16,.48)';g.lineWidth=2;g.beginPath();g.moveTo(0,y);g.lineTo(256,y);g.stroke();for(let x=(y/64%2)*32;x<256;x+=64){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+64);g.stroke();}}const tx=new T.CanvasTexture(c);tx.wrapS=tx.wrapT=T.RepeatWrapping;tx.repeat.set(2,2);return tx;}
const rockMat=new T.MeshStandardMaterial({map:stoneTexture(),color:0x9aa4a9,roughness:.96,metalness:.08}),trim=new T.MeshStandardMaterial({color:0x71828a,roughness:.78,metalness:.3}),black=new T.MeshStandardMaterial({color:0x111c24,roughness:.9,metalness:.18}),bronze=new T.MeshStandardMaterial({color:0x987343,roughness:.42,metalness:.72}),windowMat=new T.MeshStandardMaterial({color:0x45d8e8,emissive:0x087e9a,emissiveIntensity:2.4,roughness:.2,metalness:.25});
const world=new T.Group();scene.add(world);
function mesh(g,m,x,y,z,sx=1,sy=1,sz=1,parent=world){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;}
function block(x,y,z,w,h,d,m=rockMat){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z);}
function tower(x,z,h,r){mesh(new T.CylinderGeometry(r*.88,r,h,12),rockMat,x,h/2+5,z);mesh(new T.CylinderGeometry(r*1.06,r*.9,1.3,12),trim,x,h+5,z);mesh(new T.ConeGeometry(r*1.03,h*.32,12),black,x,h+5+h*.16,z);mesh(new T.ConeGeometry(.16,r*.34,8),bronze,x,h+5+h*.32,z);}
 // Rough volcanic island with a broad submerged rock shelf.
mesh(new T.IcosahedronGeometry(25,2),rockMat,0,4,0,1.65,.43,1.15).rotation.y=.3;
mesh(new T.CylinderGeometry(34,40,9,15,2),black,0,7,0,1,.7,1);
for(let i=0;i<22;i++){const a=i*Math.PI*2/22,r=26+(i%4)*2.5;const b=mesh(new T.DodecahedronGeometry(5+(i%3),1),i%3?rockMat:trim,Math.cos(a)*r,2+(i%5)*2,Math.sin(a)*r,1,.8,1);b.rotation.set(i*.6,i*.37,i*.29);}
 // Fortress: tall central keep, projecting wings, real layered tower silhouettes.
block(0,24,0,34,34,25);block(0,42,0,37,2.2,28,trim);
block(0,15,15,15,17,8,black);block(0,24,19.3,11,1,1.5,bronze);
tower(-18,-13,39,5.2);tower(18,-13,39,5.2);tower(-18,13,33,4.8);tower(18,13,33,4.8);tower(0,-1,67,7.2);
for(const s of [-1,1]){block(s*25,19,0,18,23,19);block(s*25,31,0,19,1.5,20,trim);tower(s*25,-1,47,4.5);for(let z of [-7,0,7])block(s*25,20,z,2.2,14,2.2,trim);}
 // Deep-set lancet windows with stone mullions.
for(let x=-12;x<=12;x+=8)for(let y of [17,29]){block(x,y,12.65,2.5,8,.7,black);mesh(new T.BoxGeometry(1.3,6,.35),windowMat,x,y,13.08);mesh(new T.ConeGeometry(.68,1.8,4),windowMat,x,y+3.8,13.08).rotation.z=Math.PI;block(x-1.55,y,13.2,.35,8,.5,trim);block(x+1.55,y,13.2,.35,8,.5,trim);}
 // Grand sea gate and front steps.
block(0,13,14,10,13,3,black);mesh(new T.TorusGeometry(5.1,.65,10,32,Math.PI),bronze,0,19,15).rotation.z=Math.PI;
for(let i=0;i<5;i++)block(0,5+i*1.4,20+i*1.6,16-i*1.8,1.2,3,trim);
 // The throne is foregrounded and unmistakable: carved seat, armrests, crown-like back.
const throne=new T.Group();world.add(throne);throne.position.set(0,14,27);
mesh(new T.BoxGeometry(12,3,8),bronze,0,3,0,1,1,1,throne);
mesh(new T.BoxGeometry(10,13,2.6),rockMat,0,10,-2.6,1,1,1,throne);
mesh(new T.BoxGeometry(8,2,5),black,0,5,1,1,1,1,throne);
for(const x of [-5.3,5.3]){mesh(new T.BoxGeometry(2,7,6),trim,x,6,1,1,1,1,throne);mesh(new T.ConeGeometry(1.3,3,5),bronze,x,11,1,1,1,1,throne);}
for(let i=-2;i<=2;i++){const spike=mesh(new T.ConeGeometry(.75,5+(2-Math.abs(i))*.8,5),bronze,i*1.8,18,-2.5,1,1,1,throne);spike.rotation.z=i*.13;}
 // Serpent: thick sinuous body curling around the keep, plated with ridges; head faces camera.
const serpent=new T.Group();scene.add(serpent);const pathPts=[];for(let i=0;i<=90;i++){const t=i/90*Math.PI*2;pathPts.push(new T.Vector3(-27+Math.cos(t)*18,18+Math.sin(t*2)*13,3+Math.sin(t)*15));}
const curve=new T.CatmullRomCurve3(pathPts,true,'catmullrom',.35);mesh(new T.TubeGeometry(curve,220,2.35,12,true),new T.MeshStandardMaterial({color:0x173f4b,roughness:.38,metalness:.65}),0,0,0,1,1,1,serpent);
for(let i=0;i<24;i++){const p=curve.getPoint(i/24);const plate=mesh(new T.SphereGeometry(1,8,6),i%2?bronze:trim,p.x,p.y+1.8,p.z,1.25,.38,.85,serpent);plate.rotation.z=i*.35;}
const head=mesh(new T.SphereGeometry(3.1,16,12),new T.MeshStandardMaterial({color:0x1b4b58,roughness:.3,metalness:.55}),-9,31,18,1.3,.8,1,serpent);
for(const s of [-1,1]){mesh(new T.ConeGeometry(.65,5,8),bronze,-12+s*1.2,35,17,s*.8,1,1,serpent);const eye=mesh(new T.SphereGeometry(.42,10,8),new T.MeshBasicMaterial({color:0xffc75c}),-11+s*1.8,31.5,20,1,1,1,serpent); }
 // Ocean surface with moving vertex waves and specular moonlight.
const waterGeo=new T.PlaneGeometry(700,700,100,100);waterGeo.rotateX(-Math.PI/2);const waterPos=waterGeo.attributes.position;const baseY=[];for(let i=0;i<waterPos.count;i++)baseY.push(waterPos.getY(i));
const waterMat=new T.MeshStandardMaterial({color:0x07384a,roughness:.22,metalness:.55});const water=new T.Mesh(waterGeo,waterMat);water.position.y=-1;scene.add(water);
 // Distant layered storm banks.
const cloudMat=new T.MeshStandardMaterial({color:0x1a303c,roughness:1,transparent:true,opacity:.72});for(let i=0;i<34;i++){const x=(Math.random()-.5)*260,y=35+Math.random()*30,z=-95-Math.random()*60;const c=mesh(new T.SphereGeometry(1,12,8),cloudMat,x,y,z,12+Math.random()*16,5+Math.random()*8,9+Math.random()*12,scene);c.castShadow=false;}
 // Visible magical energy is concentrated at the throne, not hidden behind the castle.
const haloMat=new T.MeshBasicMaterial({color:0x20dff4,transparent:true,opacity:.75,blending:T.AdditiveBlending,depthWrite:false});
const halo=new T.Mesh(new T.TorusGeometry(12,.24,10,100),haloMat);halo.position.set(0,28,24);scene.add(halo);halo.rotation.x=.18;
const haloGold=new T.Mesh(new T.TorusGeometry(15,.11,8,100),new T.MeshBasicMaterial({color:0xffc76b,transparent:true,opacity:.8,blending:T.AdditiveBlending,depthWrite:false}));haloGold.position.set(0,28,24);scene.add(haloGold);haloGold.rotation.x=.18;
const runeCount=650,runePos=new Float32Array(runeCount*3),runeSeed=[];for(let i=0;i<runeCount;i++){const a=Math.random()*Math.PI*2,r=7+Math.random()*27;runePos[i*3]=Math.cos(a)*r;runePos[i*3+1]=Math.random()*40+3;runePos[i*3+2]=Math.sin(a)*r+8;runeSeed.push(Math.random()*6.28);}
const runeGeo=new T.BufferGeometry();runeGeo.setAttribute('position',new T.BufferAttribute(runePos,3));const runes=new T.Points(runeGeo,new T.PointsMaterial({color:0xffd88a,size:.7,transparent:true,opacity:.9,blending:T.AdditiveBlending,depthWrite:false}));scene.add(runes);
 // Sea spray around the island.
const sprayN=500,sprayA=new Float32Array(sprayN*3);for(let i=0;i<sprayN;i++){const a=Math.random()*6.28,r=28+Math.random()*26;sprayA[i*3]=Math.cos(a)*r;sprayA[i*3+1]=Math.random()*12;sprayA[i*3+2]=Math.sin(a)*r;}
const sprayG=new T.BufferGeometry();sprayG.setAttribute('position',new T.BufferAttribute(sprayA,3));scene.add(new T.Points(sprayG,new T.PointsMaterial({color:0xa9e9f5,size:.42,transparent:true,opacity:.55})));
 // Lightning flash illumination.
const lightning=new T.PointLight(0xc8edff,0,300);lightning.position.set(-20,70,-45);scene.add(lightning);let nextFlash=0,flash=0;
let elapsed=0,drag=false,lastX=0,lastY=0,yaw=0,pitch=0,animStart=performance.now(),intro=true;
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(canvas);resize();
function animate(now){requestAnimationFrame(animate);const t=(now-animStart)/1000;elapsed=t;
const p=waterGeo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,baseY[i]+Math.sin(x*.045+t*1.3)*.48+Math.cos(z*.06+t*1.1)*.3);}p.needsUpdate=true;waterGeo.computeVertexNormals();
halo.rotation.z=t*.23;haloGold.rotation.z=-t*.16;haloMat.opacity=.48+Math.sin(t*2.4)*.2;
runes.rotation.y=t*.08;const rp=runeGeo.attributes.position;for(let i=0;i<rp.count;i++)rp.setY(i,runePos[i*3+1]+Math.sin(t*1.5+runeSeed[i])*1.5);rp.needsUpdate=true;
serpent.rotation.y=Math.sin(t*.3)*.06;head.position.y=31+Math.sin(t*1.5)*.7;
abyssLight.intensity=2.6+Math.sin(t*2.1)*.8;warm.intensity=1.8+Math.sin(t*1.7)*.3;
if(now>nextFlash){flash=1;nextFlash=now+4500+Math.random()*6500;}if(flash>0){lightning.intensity=flash*4.5;flash*=.78;if(flash<.03)flash=0;}else lightning.intensity=0;
if(intro){const k=Math.min(1,t/3.5);world.position.y=-8*(1-k)*(1-k);if(k>=1)intro=false;}
const radius=112;camera.position.set(Math.sin(yaw)*radius,27+pitch,Math.cos(yaw)*radius);camera.lookAt(0,23,4);
renderer.render(scene,camera);
}
requestAnimationFrame(animate);loading.classList.add('hidden');
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-= (e.clientX-lastX)*.004;pitch=Math.max(-12,Math.min(14,pitch+(e.clientY-lastY)*.06));lastX=e.clientX;lastY=e.clientY;});
document.getElementById('replay').onclick=()=>{animStart=performance.now();world.position.y=-8;intro=true;};
let audio=null,osc=[],soundOn=false;document.getElementById('sound').onclick=async()=>{const b=document.getElementById('sound');if(soundOn){osc.forEach(o=>{try{o.stop()}catch(e){}});osc=[];soundOn=false;b.textContent='ENABLE CINEMATIC SOUND';return;}const AC=window.AudioContext||window.webkitAudioContext;if(!AC){b.textContent='SOUND NOT SUPPORTED';return;}audio=audio||new AC();await audio.resume();const now=audio.currentTime;[38.9,51.9,77.8].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();o.type=i===0?'triangle':'sine';o.frequency.value=f;filter.type='lowpass';filter.frequency.value=115+i*45;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.04/(i+1),now+1.8);g.gain.exponentialRampToValueAtTime(.0001,now+9);o.connect(filter).connect(g).connect(audio.destination);o.start(now);o.stop(now+9.1);osc.push(o);});soundOn=true;b.textContent='SOUND PLAYING · STOP';setTimeout(()=>{soundOn=false;osc=[];b.textContent='ENABLE CINEMATIC SOUND';},9200);};
})();
</script></body></html>
