<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>Grim Reaper Gift Preview</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b12;color:#f4f5f8;font-family:system-ui,sans-serif}body{min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0,#202638,#080b12 65%)}main{width:min(100%,560px);text-align:center;padding:30px 20px;border:1px solid #394154;border-radius:24px;background:#101522;box-shadow:0 20px 70px #0009}h1{font-size:clamp(26px,7vw,38px);margin:0 0 8px}p{color:#b9c1d1;line-height:1.5;margin:0 auto 24px}.skull{font-size:54px;margin-bottom:12px;filter:drop-shadow(0 0 18px #a32b39)}button{border:0;border-radius:999px;padding:16px 28px;background:linear-gradient(110deg,#8f1d2c,#d44745);color:white;font-size:17px;font-weight:800;cursor:pointer}small{display:block;color:#8993a6;margin-top:18px}</style><script src="./gift-engine.js?v=reaper-preview-2" defer></script></head><body><main><div class="skull">☠️</div><h1>The Grim Reaper's Arrival</h1><p>A standalone gift preview. This page does not send you into TikNation Live or the old gift lab.</p><button id="summon" type="button">SUMMON THE REAPER</button><small>Tap the button to play the animation and sound.</small></main><script>document.getElementById("summon").addEventListener("click",()=>{if(!window.TikNationGiftEngine){alert("The gift animation file has not loaded yet. Refresh once.");return;}window.TikNationGiftEngine.show({id:"reaper_arrival",name:"THE GRIM REAPER'S ARRIVAL",style:"reaper",emoji:"☠️",message:"THE FINAL HOUR HAS ARRIVED."},{duration:11000,onSound:()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),t=ctx.currentTime+.04,master=ctx.createGain();master.gain.setValueAtTime(.0001,t);master.gain.exponentialRampToValueAtTime(.27,t+.4);master.gain.setValueAtTime(.2,t+2.1);master.gain.exponentialRampToValueAtTime(.0001,t+5.7);master.connect(ctx.destination);const low=ctx.createOscillator(),lg=ctx.createGain();low.type="sawtooth";low.frequency.setValueAtTime(64,t);low.frequency.exponentialRampToValueAtTime(31,t+5.5);lg.gain.value=.25;low.connect(lg);lg.connect(master);low.start(t);low.stop(t+5.8);const sweep=ctx.createOscillator(),sg=ctx.createGain();sweep.type="triangle";sweep.frequency.setValueAtTime(390,t+3);sweep.frequency.exponentialRampToValueAtTime(65,t+4.5);sg.gain.setValueAtTime(.0001,t+3);sg.gain.exponentialRampToValueAtTime(.7,t+3.2);sg.gain.exponentialRampToValueAtTime(.0001,t+4.8);sweep.connect(sg);sg.connect(master);sweep.start(t+3);sweep.stop(t+4.9);setTimeout(()=>ctx.close(),6500);}catch(e){console.warn(e);}}});});</script></body></html>
