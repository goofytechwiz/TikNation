<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b18"><title>Kaevoryn · Dragon Spirit 3D Lab</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b18;color:#f5f1df;font:15px/1.45 system-ui,sans-serif}
#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.hud{position:fixed;z-index:2;left:14px;right:14px;top:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.panel{pointer-events:auto;background:#10182bdc;border:1px solid #6e9c9b66;border-radius:16px;padding:12px 15px;backdrop-filter:blur(12px);box-shadow:0 12px 40px #0007}
.kicker{font-size:10px;letter-spacing:.2em;color:#86e5d2;font-weight:800}h1{font-size:clamp(19px,4vw,28px);margin:3px 0 2px}.sub{font-size:12px;color:#bdcbd1;max-width:380px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{border:1px solid #7de2d0;background:#173a40;color:#f4ffff;border-radius:12px;padding:10px 14px;font:700 13px system-ui;cursor:pointer}
button.secondary{background:#171d31;border-color:#59667f}button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.bottom{position:fixed;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);width:min(92vw,620px);text-align:center}
.hint{display:inline-block;background:#10182bdc;border:1px solid #6e9c9b55;border-radius:999px;padding:8px 14px;color:#c6d8da;font-size:12px;backdrop-filter:blur(10px)}
#status{margin-top:8px;color:#8fe9d6;font-size:11px;text-shadow:0 2px 8px #000}
@media(max-width:620px){.hud{flex-direction:column}.controls{justify-content:flex-start}.panel{max-width:100%}.sub{max-width:280px}.bottom{bottom:10px}}
</style></head><body>
<div id="scene"></div>
<div class="hud"><section class="panel"><div class="kicker">KAEVORYN STUDIOS · FRESH 3D BUILD</div><h1>DRAGON SPIRIT</h1><div class="sub">A traditional celestial Chinese dragon · continuous 3D body · no wings</div></section>
<section class="panel controls"><button id="pause">Pause motion</button><button id="reset" class="secondary">Reset view</button></section></div>
<div class="bottom"><div class="hint">Drag to orbit · pinch or scroll to zoom</div><div id="status">Building the dragon in real 3D…</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const host=document.getElementById('scene'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x080b18);scene.fog=new THREE.FogExp2(0x080b18,.025);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,8,18);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9efff,0x302018,2.0));
const key=new THREE.DirectionalLight(0xffd99a,3.2);key.position.set(5,10,8);key.castShadow=true;scene.add(key);
const rim=new THREE.PointLight(0x42d9d0,85,30);rim.position.set(-7,5,-5);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(12,80),new THREE.MeshStandardMaterial({color:0x101a29,metalness:.28,roughness:.75}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.2;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(5.2,.025,8,120),new THREE.MeshBasicMaterial({color:0x3a8f91,transparent:true,opacity:.45}));ring.rotation.x=Math.PI/2;ring.position.y=-2.12;scene.add(ring);
const gold=new THREE.MeshStandardMaterial({color:0xb58b42,metalness:.68,roughness:.3});
const jade=new THREE.MeshStandardMaterial({color:0x176c5d,metalness:.48,roughness:.29});
const bellyMat=new THREE.MeshStandardMaterial({color:0xd9b978,metalness:.34,roughness:.43});
const dark=new THREE.MeshStandardMaterial({color:0x102f2d,metalness:.42,roughness:.35});
const ivory=new THREE.MeshStandardMaterial({color:0xf5e4b7,metalness:.3,roughness:.25});
const red=new THREE.MeshStandardMaterial({color:0xb84328,metalness:.35,roughness:.35});
const eyeMat=new THREE.MeshStandardMaterial({color:0xffc94e,emissive:0x6c2600,emissiveIntensity:1.2,metalness:.2,roughness:.15});
const dragon=new THREE.Group();scene.add(dragon);
const N=150,R=12;
const positions=new Float32Array((N+1)*(R+1)*3),indices=[];
for(let i=0;i<=N;i++)for(let j=0;j<=R;j++){if(i<N&&j<R){const a=i*(R+1)+j,b=a+R+1;indices.push(a,b,a+1,b,b+1,a+1);}}
const bodyGeo=new THREE.BufferGeometry();bodyGeo.setIndex(indices);bodyGeo.setAttribute('position',new THREE.BufferAttribute(positions,3).setUsage(THREE.DynamicDrawUsage));
const bodyMat=new THREE.MeshStandardMaterial({color:0x2a9473,metalness:.48,roughness:.3,side:THREE.DoubleSide});
const body=new THREE.Mesh(bodyGeo,bodyMat);body.castShadow=true;body.receiveShadow=true;dragon.add(body);
const bellyGeo=new THREE.BufferGeometry();const bellyPos=new Float32Array((N+1)*3);bellyGeo.setAttribute('position',new THREE.BufferAttribute(bellyPos,3).setUsage(THREE.DynamicDrawUsage));const bellyLine=new THREE.Line(bellyGeo,new THREE.LineBasicMaterial({color:0xf1d49a,transparent:true,opacity:.95}));dragon.add(bellyLine);
const dorsal=new THREE.Group();dragon.add(dorsal);
const spikeGeo=new THREE.ConeGeometry(.12,.34,5);const spikes=[];
for(let i=5;i<N;i+=3){const m=new THREE.Mesh(spikeGeo,gold);m.castShadow=true;dorsal.add(m);spikes.push({mesh:m,t:i/N});}
const sphere=new THREE.SphereGeometry(1,24,18);
function ball(parent,mat,pos,scale){const m=new THREE.Mesh(sphere,mat);m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;parent.add(m);return m;}
const head=new THREE.Group();dragon.add(head);
ball(head,jade,[0,0,0],[.88,.62,.66]);ball(head,bellyMat,[.38,-.28,0],[.78,.29,.48]);ball(head,jade,[.72,-.02,0],[.66,.38,.46]);ball(head,bellyMat,[1.05,-.18,0],[.45,.2,.36]);
for(const s of [-1,1]){
 ball(head,eyeMat,[.2,.28,s*.53],[.15,.16,.11]);ball(head,dark,[.23,.29,s*.625],[.045,.12,.035]);
 const hornCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(-.28,.42,s*.28),new THREE.Vector3(-.45,.85,s*.34),new THREE.Vector3(-.25,1.16,s*.38),new THREE.Vector3(.04,1.32,s*.4)]);
 const horn=new THREE.Mesh(new THREE.TubeGeometry(hornCurve,18,.085,8,false),ivory);head.add(horn);
 const whiskerCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(.72,-.03,s*.35),new THREE.Vector3(1.18,.08,s*.7),new THREE.Vector3(1.58,.32,s*.9),new THREE.Vector3(1.92,.18,s*.92)]);
 head.add(new THREE.Mesh(new THREE.TubeGeometry(whiskerCurve,24,.025,6,false),ivory));
 const brow=ball(head,red,[.13,.48,s*.48],[.32,.09,.12]);brow.rotation.z=-.15;
}
const mane=new THREE.Group();head.add(mane);
for(let i=0;i<9;i++){const c=new THREE.CatmullRomCurve3([new THREE.Vector3(-.45,.2-i*.07,-.15+i*.04),new THREE.Vector3(-.82,.48-i*.1,-.18+i*.05),new THREE.Vector3(-1.12,.15-i*.12,-.2+i*.06)]);mane.add(new THREE.Mesh(new THREE.TubeGeometry(c,16,.075,7,false),i%2?red:gold));}
const muzzle=ball(head,bellyMat,[1.16,.02,0],[.35,.18,.43]);
for(const s of [-1,1])ball(head,dark,[1.26,.15,s*.28],[.055,.035,.045]);
// Four articulated-looking legs attached to the body at different points.
const legs=[];
function makeLeg(){const g=new THREE.Group();const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.48,4,8),jade);upper.position.y=-.28;upper.rotation.z=-.25;g.add(upper);const paw=ball(g,gold,[.1,-.62,0],[.25,.12,.2]);for(let k=-1;k<=1;k++)ball(g,ivory,[.27,-.67,k*.105],[.11,.045,.045]);return g;}
for(let i=0;i<4;i++){const l=makeLeg();dragon.add(l);legs.push({mesh:l,t:.24+i*.17,side:i%2?1:-1});}
function center(t,time){const a=t*Math.PI*2*1.27+.4;const radius=1.35+2.9*t;return new THREE.Vector3(Math.cos(a)*radius, -.05+0.7*Math.sin(a*1.45)+.22*Math.sin(t*18-time*2.1),Math.sin(a)*radius*.78);}
function updateBody(time){
 const pts=[];for(let i=0;i<=N;i++)pts.push(center(i/N,time));const curve=new THREE.CatmullRomCurve3(pts,false,'centripetal');
 const frames=curve.computeFrenetFrames(N,false);
 for(let i=0;i<=N;i++){const t=i/N,p=curve.getPointAt(t),n=frames.normals[i],b=frames.binormals[i],radius=.48*(.28+.72*Math.sin(Math.PI*(.08+.9*t)))+(.05*Math.sin(t*50-time*3));
  for(let j=0;j<=R;j++){const v=j/R*Math.PI*2;const q=p.clone().addScaledVector(n,Math.cos(v)*radius).addScaledVector(b,Math.sin(v)*radius);const k=(i*(R+1)+j)*3;positions[k]=q.x;positions[k+1]=q.y;positions[k+2]=q.z;}
  const bk=i*3;bellyPos[bk]=p.x+n.x*(-radius*.82);bellyPos[bk+1]=p.y+n.y*(-radius*.82);bellyPos[bk+2]=p.z+n.z*(-radius*.82);
 }
 bodyGeo.attributes.position.needsUpdate=true;bodyGeo.computeVertexNormals();bellyGeo.attributes.position.needsUpdate=true;bodyGeo.computeBoundingSphere();
 for(const s of spikes){const p=curve.getPointAt(s.t),tan=curve.getTangentAt(s.t);s.mesh.position.copy(p).add(new THREE.Vector3(0,.42,0));s.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(tan.x*.25,1,tan.z*.25).normalize());}
 const hp=curve.getPointAt(1),ht=curve.getTangentAt(1);head.position.copy(hp);head.position.y+=.08;head.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),ht);
 for(const l of legs){const p=curve.getPointAt(l.t),tan=curve.getTangentAt(l.t);l.mesh.position.copy(p);l.mesh.position.y-=.2;l.mesh.position.z+=l.side*.35;l.mesh.rotation.set(.1*Math.sin(time*2+l.t*9),0,-.18+Math.sin(time*2.5+l.t*8)*.12);l.mesh.quaternion.multiply(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),new THREE.Vector3(tan.x,0,tan.z).normalize()));}
}
let paused=false,clock=new THREE.Clock();let orbit={x:0,y:0};let dragging=false,last={x:0,y:0},distance=18;
function placeCamera(){camera.position.set(Math.sin(orbit.x)*distance,7+orbit.y,Math.cos(orbit.x)*distance);camera.lookAt(0,.1,0);}
placeCamera();
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;last={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;orbit.x-=(e.clientX-last.x)*.006;orbit.y=Math.max(-2,Math.min(5,orbit.y+(e.clientY-last.y)*.025));last={x:e.clientX,y:e.clientY};placeCamera();});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{distance=Math.max(11,Math.min(28,distance+e.deltaY*.012));placeCamera();},{passive:true});
document.getElementById('pause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume motion':'Pause motion';});
document.getElementById('reset').addEventListener('click',()=>{orbit={x:0,y:0};distance=18;placeCamera();});
function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(!paused)updateBody(clock.elapsedTime);renderer.render(scene,camera);}
animate();status.textContent='3D scene running · continuous tube body · drag to inspect';
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
