<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080706"><title>THE LAST BROADCAST — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#eee;font-family:Arial,sans-serif}
#screen{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#26221d 0,#11100e 44%,#030303 100%);transition:background .3s}
#grain{position:absolute;inset:-30%;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");animation:grain .18s steps(2) infinite}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#fff0 0 3px,#fff1 4px,#0000 5px 7px);opacity:.2}
#frame{position:absolute;left:50%;top:47%;width:min(88vw,900px);height:min(64vh,520px);transform:translate(-50%,-50%);border:12px solid #171614;border-radius:8px;background:linear-gradient(180deg,#1a1a18,#070807);box-shadow:0 0 0 2px #514a3e,0 25px 100px #000;overflow:hidden}
#glass{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#aaa18b22,transparent 55%),linear-gradient(90deg,#080a09,#25231d 50%,#080909);overflow:hidden}
#door{position:absolute;left:50%;bottom:0;width:28%;height:92%;transform:translateX(-50%);border:3px solid #403d35;background:linear-gradient(90deg,#080909,#292820 48%,#080909);box-shadow:inset 0 0 40px #000}
#door:before{content:"";position:absolute;inset:4%;border:1px solid #77705d55}
#figure{position:absolute;left:50%;bottom:-4%;width:26%;height:92%;transform:translateX(-50%) scaleX(.72);opacity:0;background:linear-gradient(90deg,#020303,#090a09 42%,#000 75%);clip-path:polygon(38% 0,62% 0,73% 9%,70% 23%,86% 40%,100% 100%,0 100%,14% 40%,30% 23%,27% 9%);filter:blur(1px);transition:opacity .18s}
#eyes{position:absolute;left:47%;top:19%;width:6%;height:2px;background:#c8b99a;box-shadow:0 0 12px 4px #d2c4a077;opacity:0}
#alert{position:absolute;inset:0;display:grid;place-content:center;text-align:center;opacity:0;transform:scale(.96);transition:opacity .25s,transform .25s;background:#100d0b99}
#alert strong{font-size:clamp(30px,7vw,76px);letter-spacing:.12em;color:#e6ded0;text-shadow:0 0 24px #c9b99b66}
#alert span{margin-top:18px;font-size:clamp(10px,2vw,15px);letter-spacing:.34em;color:#c6b9a3}
#red{position:absolute;inset:0;background:#8e0b08;opacity:0;mix-blend-mode:screen;pointer-events:none}
#screen.live #alert{opacity:1;transform:scale(1)}
#screen.live #red{animation:alarm 1.1s steps(1) infinite}
#screen.live #figure{opacity:1;animation:appear 5s ease-in-out forwards}
#screen.live #eyes{opacity:1;transition-delay:1s}
#screen.live #glass{animation:flicker .12s steps(2) infinite}
#screen.live #scan{opacity:.38}
#screen.live #grain{opacity:.24}
#screen.live #frame{animation:shake .14s linear 5}
#screen.end #figure{opacity:0}
#screen.end #alert{opacity:0}
#screen.end #glass{filter:brightness(.08)}
header{position:fixed;z-index:4;top:0;left:0;right:0;padding:17px 20px;display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:.2em;color:#c9c0ad}
.pill{padding:8px 12px;border:1px solid #b8a98b55;border-radius:30px;background:#090909cc}
.panel{position:fixed;z-index:5;left:50%;bottom:5%;transform:translateX(-50%);width:min(94%,620px);text-align:center;text-shadow:0 2px 18px #000}
.kicker{font-size:10px;letter-spacing:.38em;color:#d0bfa0;font-weight:900}
h1{font-size:clamp(38px,9vw,76px);letter-spacing:.08em;margin:10px 0;line-height:.95}
.desc{font-size:10px;letter-spacing:.2em;color:#c4b9a6}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
button{padding:14px 22px;border-radius:28px;border:1px solid #cbbd9e;background:linear-gradient(145deg,#5b5140,#171613);color:#fff;font-weight:900;letter-spacing:.13em;font-size:11px;cursor:pointer}
button.alt{background:#090909;border-color:#77705f}
.note{font-size:9px;color:#aaa18f;margin-top:9px;letter-spacing:.08em}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-1%)}}
@keyframes alarm{0%,48%{opacity:0}50%,72%{opacity:.24}74%,100%{opacity:0}}
@keyframes flicker{0%,100%{filter:brightness(1)}50%{filter:brightness(.55)}}
@keyframes appear{0%,12%{opacity:0;transform:translateX(-50%) scaleX(.72) translateY(8%)}24%,70%{opacity:1;transform:translateX(-50%) scaleX(.72) translateY(0)}100%{opacity:0;transform:translateX(-50%) scaleX(.72) translateY(-5%)}}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% + 2px),calc(-50% - 1px))}75%{transform:translate(calc(-50% - 2px),calc(-50% + 1px))}}
@media(max-width:600px){header{padding:12px;font-size:8px}#frame{height:48vh;border-width:7px}.panel{bottom:4%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style></head><body>
<div id="screen"><div id="grain"></div><div id="scan"></div><div id="frame"><div id="glass"><div id="door"></div><div id="figure"></div><div id="eyes"></div><div id="alert"><strong>DO NOT ADJUST</strong><span>THIS SIGNAL IS NOT FOR YOU</span></div></div></div><div id="red"></div></div>
<header><span>TIKNATION / GIFT PREVIEW</span><span class="pill" id="status">SIGNAL LOST</span></header>
<section class="panel"><div class="kicker">THE TRANSMISSION WAS NEVER MEANT TO AIR</div><h1>THE LAST BROADCAST</h1><div class="desc">SOMEONE IS STANDING BEHIND THE SIGNAL</div><div class="actions"><button id="trigger">Tune in</button><button class="alt" id="reset">Cut transmission</button></div><div class="note">Preview only · Tap to trigger · No autoplay audio</div></section>
<script>
(()=>{const s=document.getElementById('screen'),status=document.getElementById('status'),go=document.getElementById('trigger'),stop=document.getElementById('reset');let timer;
go.addEventListener('click',()=>{clearTimeout(timer);s.classList.remove('live','end');void s.offsetWidth;s.classList.add('live');status.textContent='LIVE TRANSMISSION';go.disabled=true;timer=setTimeout(()=>{s.classList.remove('live');s.classList.add('end');status.textContent='SIGNAL TERMINATED';go.disabled=false},6500)});
stop.addEventListener('click',()=>{clearTimeout(timer);s.classList.remove('live','end');status.textContent='SIGNAL LOST';go.disabled=false});
})();
</script></body></html>
