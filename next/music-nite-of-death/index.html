<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Music Nite of Death — TikNation Gift Preview</title>
<style>
:root{color-scheme:dark;--gold:#c6a56b;--bone:#d7d0bb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030507;color:#eee;font-family:Georgia,serif}
.stage{position:relative;width:100%;height:100%;min-height:520px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 78%,#25211b 0,#0b1012 34%,#020406 76%)}
.arch{position:absolute;inset:-12% 8% 0;border:clamp(12px,3vw,34px) solid #16191a;border-bottom:0;border-radius:50% 50% 0 0;box-shadow:inset 0 0 60px #000,0 0 35px #000;opacity:.9}
.arch:before{content:"";position:absolute;inset:7% 7% 0;border:2px solid #524633;border-bottom:0;border-radius:50% 50% 0 0;opacity:.5}
.window{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:min(43vw,370px);height:48%;background:linear-gradient(180deg,#1c2630,#080e14 70%);clip-path:polygon(50% 0,100% 28%,100% 100%,0 100%,0 28%);border:2px solid #6b5940;filter:drop-shadow(0 0 22px #4a5360)}
.moon{position:absolute;top:17%;left:50%;transform:translateX(-50%);width:clamp(55px,10vw,110px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e4dfc9,#aaa58e 55%,#56534b);box-shadow:0 0 38px #c7c3ad66}
.pillars{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#020405 0,transparent 14%,transparent 86%,#020405 100%)}
.floor{position:absolute;bottom:-15%;left:-10%;width:120%;height:45%;background:repeating-linear-gradient(90deg,#171716 0 2px,#24221d 3px 90px);transform:perspective(260px) rotateX(54deg);transform-origin:top;box-shadow:0 -15px 50px #000}
.organ{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);width:min(58vw,520px);height:35%;display:flex;align-items:end;justify-content:center;filter:drop-shadow(0 0 18px #000)}
.organ-body{position:absolute;bottom:0;width:100%;height:66%;background:linear-gradient(90deg,#17100d,#493522 48%,#140e0b);border:3px solid #796344;box-shadow:inset 0 0 25px #000}
.pipe{position:relative;z-index:1;width:8%;margin:0 1%;border:2px solid #887452;background:linear-gradient(90deg,#17191a,#b5a17b 48%,#28231c);box-shadow:inset 0 0 10px #000,0 0 10px #c4a66b22}
.pipe:nth-child(1),.pipe:nth-child(9){height:78%}.pipe:nth-child(2),.pipe:nth-child(8){height:92%}.pipe:nth-child(3),.pipe:nth-child(7){height:100%}.pipe:nth-child(4),.pipe:nth-child(6){height:85%}.pipe:nth-child(5){height:72%}
.keys{position:absolute;z-index:3;bottom:0;width:70%;height:15%;background:repeating-linear-gradient(90deg,#d7d0bb 0 7%,#171717 7.3% 8%,#d7d0bb 8.3% 15%);border:3px solid #080808}
.conductor{position:absolute;z-index:4;bottom:27%;left:50%;transform:translateX(-50%);width:clamp(110px,20vw,190px);height:clamp(170px,31vw,290px);opacity:0;transition:opacity 1.8s}
.conductor.show{opacity:1;animation:rise 3s ease-out both}
.skull{position:absolute;top:0;left:29%;width:42%;height:28%;border-radius:48% 48% 42% 42%;background:linear-gradient(110deg,#e4ddc7,#797467 62%,#292824);box-shadow:inset -12px -8px 12px #161616}
.skull:before{content:"";position:absolute;left:13%;top:47%;width:23%;height:22%;border-radius:50%;background:#08090a;box-shadow:38px 0 #08090a,19px 26px 0 -7px #111}
.skull:after{content:"";position:absolute;left:40%;bottom:-17%;width:20%;height:30%;background:repeating-linear-gradient(90deg,#c7c0ad 0 5px,#514e46 6px 8px)}
.coat{position:absolute;bottom:0;left:5%;width:90%;height:75%;background:linear-gradient(90deg,#080a0c,#202326 50%,#060809);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);border-top:3px solid #a58a5b}
.arm{position:absolute;top:43%;width:58%;height:8%;background:#17191b;border-top:3px solid #9b8259;transform-origin:90% 50%}
.arm.left{left:-17%;transform:rotate(-35deg);animation:conduct 2.4s ease-in-out infinite alternate}
.arm.right{right:-17%;transform:rotate(35deg);animation:conduct2 2.4s ease-in-out infinite alternate}
.baton{position:absolute;right:-30%;top:-3px;width:75px;height:3px;background:#d8c69a;box-shadow:0 0 9px #e4d4a8}
@keyframes conduct{to{transform:rotate(22deg)}}@keyframes conduct2{to{transform:rotate(-25deg)}}@keyframes rise{from{transform:translate(-50%,70px)}to{transform:translate(-50%,0)}}
.title{position:absolute;z-index:8;top:5%;left:0;width:100%;text-align:center;padding:0 12px;text-transform:uppercase;letter-spacing:.16em;font-size:clamp(19px,4vw,39px);color:#d8c9a9;text-shadow:0 2px 14px #000,0 0 20px #b89a6a55}
.sub{display:block;margin-top:10px;font:10px Arial,sans-serif;letter-spacing:.42em;color:#a69b86}
.note{position:absolute;z-index:6;color:#d9c79a;font-size:clamp(20px,4vw,40px);opacity:0;filter:drop-shadow(0 0 9px #bba16b);animation:floatNote 6s linear infinite}
@keyframes floatNote{0%{opacity:0;transform:translateY(40px) rotate(-15deg)}15%{opacity:.8}85%{opacity:.5}100%{opacity:0;transform:translateY(-230px) rotate(25deg)}}
.fog{position:absolute;z-index:5;bottom:7%;left:-20%;width:140%;height:30%;background:radial-gradient(ellipse,#a8a9a455,transparent 68%);filter:blur(22px);animation:fog 9s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(12%) scaleY(1.3);opacity:.5}}
.vignette{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse,transparent 35%,#000b 100%)}
.controls{position:absolute;z-index:10;bottom:4%;left:0;width:100%;display:flex;justify-content:center;gap:12px;padding:0 12px}
button{border:1px solid #9e8357;background:linear-gradient(#29251e,#090b0c);color:#e8dcc1;padding:14px 22px;letter-spacing:.18em;text-transform:uppercase;font:12px Arial,sans-serif;cursor:pointer;box-shadow:0 0 22px #0008}
button:active{transform:scale(.97)}button.secondary{background:#090b0ccc}
.status{position:absolute;z-index:9;bottom:14%;width:100%;text-align:center;color:#c3b18e;font:10px Arial,sans-serif;letter-spacing:.32em;text-transform:uppercase}
.flash{position:absolute;z-index:8;inset:0;background:#e5dfca;opacity:0;pointer-events:none}
.flash.hit{animation:flash .45s ease-out}@keyframes flash{0%{opacity:.75}100%{opacity:0}}
@media(max-height:600px){.title{top:2%}.organ{bottom:10%;height:38%}.conductor{bottom:22%}.controls{bottom:2%}.status{bottom:12%}}
</style>
</head>
<body>
<main class="stage" id="stage">
<div class="arch"></div><div class="window"><div class="moon"></div></div><div class="floor"></div>
<div class="organ" aria-hidden="true"><div class="organ-body"></div><i class="pipe"></i><i class="pipe"></i><i class="pipe"></i><i class="pipe"></i><i class="pipe"></i><i class="pipe"></i><i class="pipe"></i><i class="pipe"></i><i class="pipe"></i><div class="keys"></div></div>
<div class="conductor" id="conductor"><div class="coat"></div><div class="skull"></div><div class="arm left"></div><div class="arm right"><i class="baton"></i></div></div>
<div class="fog"></div><div class="pillars"></div><div class="vignette"></div><div class="flash" id="flash"></div>
<h1 class="title">The Music Nite of Death<span class="sub">A requiem for the living · TikNation gift preview</span></h1>
<div class="status" id="status">The hall is waiting for its conductor</div>
<div class="controls"><button id="play">Begin the requiem</button><button class="secondary" id="again">Replay</button></div>
</main>
<script>
(()=>{const stage=document.getElementById('stage'),conductor=document.getElementById('conductor'),status=document.getElementById('status'),flash=document.getElementById('flash'),play=document.getElementById('play'),again=document.getElementById('again');let ctx=null,master=null,active=false,timers=[];
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id)}
function tone(freq,start,duration,type='sawtooth',vol=.07,detune=0){if(!ctx||!master)return;const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,start);o.detune.value=detune;f.type='lowpass';f.frequency.value=type==='sawtooth'?850:2200;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+.12);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(f);f.connect(g);g.connect(master);o.start(start);o.stop(start+duration+.05)}
function rumble(start,duration,vol=.13){if(!ctx||!master)return;const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(42,start);o.frequency.exponentialRampToValueAtTime(25,start+duration);f.type='lowpass';f.frequency.value=100;g.gain.setValueAtTime(.0001,start);g.gain.linearRampToValueAtTime(vol,start+.8);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(f);f.connect(g);g.connect(master);o.start(start);o.stop(start+duration+.1)}
function playMusic(){const now=ctx.currentTime;rumble(now,18,.2);const chords=[[55,82.4,110],[49,73.4,98],[43.65,65.4,87],[41.2,61.7,82.4]];chords.forEach((ch,i)=>ch.forEach((n,j)=>tone(n,now+i*3.8,3.6,'sawtooth',.035,j*4)));const melody=[220,261.6,311.1,293.7,220,196,164.8,146.8,164.8,196,220,130.8];melody.forEach((n,i)=>{tone(n,now+i*1.25,1.1,'triangle',.045);tone(n*2,now+i*1.25+.04,.75,'sine',.018)});[0,3.8,7.6,11.4,15.2].forEach(t=>{tone(65.4,now+t,.55,'sine',.12);tone(49,now+t+.08,.7,'sine',.08)});for(let i=0;i<5;i++)tone(880+i*110,now+5+i*2.4,1.8,'sine',.012)}
function notes(){for(let i=0;i<18;i++)later(()=>{const n=document.createElement('span');n.className='note';n.textContent=['♩','♫','♬','𝄞'][i%4];n.style.left=(12+Math.random()*76)+'%';n.style.bottom=(12+Math.random()*18)+'%';n.style.animationDelay='0s';stage.appendChild(n);later(()=>n.remove(),6200)},i*650)}
async function start(){if(active)return;active=true;play.disabled=true;play.textContent='The requiem begins';status.textContent='The dead are taking their places';try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();master=ctx.createGain();master.gain.value=.8;master.connect(ctx.destination);playMusic()}catch(e){status.textContent='Visual performance · audio unavailable on this device'}conductor.classList.add('show');notes();later(()=>{status.textContent='The conductor raises his final baton';flash.classList.add('hit');later(()=>flash.classList.remove('hit'),500)},4300);later(()=>{status.textContent='A final chord. Then silence.';if(ctx&&master){const t=ctx.currentTime;master.gain.setTargetAtTime(.0001,t+13,2)}},12500);later(()=>{status.textContent='The hall remembers your name';play.disabled=false;play.textContent='Play again';active=false},19000)}
function reset(){timers.forEach(clearTimeout);timers=[];document.querySelectorAll('.note').forEach(n=>n.remove());conductor.classList.remove('show');if(ctx&&master){try{master.gain.setTargetAtTime(.0001,ctx.currentTime,.08)}catch(e){}}active=false;play.disabled=false;play.textContent='Begin the requiem';status.textContent='The hall is waiting for its conductor'}
play.addEventListener('click',start);again.addEventListener('click',()=>{reset();start()});
})();
</script>
</body></html>
