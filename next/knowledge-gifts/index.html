<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 42%,#25202d 0,#11121d 48%,#07080e 100%);color:#f7f3ff;font:16px/1.45 system-ui,sans-serif;text-align:center}.panel{width:min(100%,540px);padding:26px 18px 22px;border:1px solid #66536e;border-radius:24px;background:linear-gradient(160deg,#1a1725ee,#090b14f2);box-shadow:0 22px 75px #000b;overflow:hidden}h1{margin:0;font-size:clamp(27px,7vw,38px);letter-spacing:.04em}p{color:#c9c2d0;margin:7px 0 0}.stage{height:390px;position:relative;overflow:hidden;margin:12px auto 10px;max-width:440px;background:radial-gradient(ellipse at 50% 82%,#5b243d55,transparent 45%)}.sigil{position:absolute;width:230px;height:230px;left:50%;bottom:15px;transform:translateX(-50%);border:2px solid #b64c72;border-radius:50%;box-shadow:0 0 18px #e23d7766,inset 0 0 30px #e23d7722;opacity:0;animation:sigil 4.8s infinite}.sigil:before,.sigil:after{content:"";position:absolute;inset:17px;border:1px dashed #d77b9c;border-radius:50%}.sigil:after{inset:45px;border:1px solid #d77b9c;transform:rotate(45deg);border-radius:0}.finger{position:absolute;width:116px;height:300px;left:50%;bottom:24px;transform:translate(-50%,120%);filter:drop-shadow(0 0 18px #d53b65aa);animation:rise 4.8s infinite}.finger svg{width:100%;height:100%;overflow:visible}.skull{position:absolute;top:38px;left:50%;font-size:50px;transform:translateX(-50%) scale(.2);opacity:0;filter:drop-shadow(0 0 18px #ff477a);animation:skull 4.8s infinite}.shock{position:absolute;inset:15% 10%;border:3px solid #ff477a;border-radius:50%;opacity:0;animation:shock 4.8s infinite}.ember{position:absolute;width:5px;height:5px;border-radius:50%;background:#ff7b9f;box-shadow:0 0 12px #ff477a;left:var(--x);bottom:20px;animation:embers 2.3s infinite;animation-delay:var(--d)}button{border:0;border-radius:999px;padding:13px 25px;background:linear-gradient(90deg,#9c315a,#e04d75);color:white;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 5px 22px #d33e6744}button:active{transform:scale(.97)}.stage.play .finger,.stage.play .sigil,.stage.play .skull,.stage.play .shock{animation-play-state:running}@keyframes rise{0%,8%{transform:translate(-50%,120%)}35%,65%{transform:translate(-50%,0)}82%,100%{transform:translate(-50%,120%)}}@keyframes sigil{0%,12%,86%,100%{opacity:0;transform:translateX(-50%) scale(.5) rotate(0)}35%,70%{opacity:1;transform:translateX(-50%) scale(1) rotate(90deg)}}@keyframes skull{0%,55%,100%{opacity:0;transform:translateX(-50%) scale(.2)}68%,82%{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes shock{0%,62%,100%{opacity:0;transform:scale(.4)}72%{opacity:.9;transform:scale(1.2)}84%{opacity:0;transform:scale(1.5)}}@keyframes embers{0%{transform:translateY(0) scale(.2);opacity:0}25%{opacity:1}100%{transform:translateY(-280px) scale(0);opacity:0}}@media(prefers-reduced-motion:reduce){.finger,.sigil,.skull,.shock,.ember{animation:none}.finger{transform:translate(-50%,0)}.sigil{opacity:.8}.skull{opacity:1;transform:translateX(-50%)}}
