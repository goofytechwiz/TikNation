<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finger of Death · TikNation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#07090b;color:#eee;font:15px/1.45 system-ui,sans-serif;text-align:center}.panel{width:min(100%,580px);padding:20px 12px;border:1px solid #3b493c;border-radius:22px;background:linear-gradient(155deg,#151a17,#080a0b 72%);box-shadow:0 24px 90px #000}h1{margin:0;font-size:clamp(25px,7vw,36px);letter-spacing:.1em}p{color:#b9c3b9;margin:5px 0}.stage{height:min(68vh,520px);min-height:390px;position:relative;margin:12px auto;overflow:hidden;border-radius:14px;background:radial-gradient(ellipse at 50% 78%,#315c3a55,transparent 44%),linear-gradient(#090d0c,#111a13 70%,#080b09)}canvas{display:block;width:100%;height:100%;touch-action:pan-y}.caption{font-size:12px;letter-spacing:.13em;color:#8da18e}button{margin-top:8px;padding:12px 25px;border-radius:99px;border:1px solid #71915e;background:linear-gradient(110deg,#243c27,#52733c);color:white;font-weight:700;font-size:15px;cursor:pointer}button:active{transform:scale(.97)}.hint{font-size:12px;color:#8c978d}
</style></head><body><main class="panel"><h1>FINGER OF DEATH</h1><p>A skeletal curse rises from the stone.</p><div class="stage" id="stage"><canvas id="view" aria-label="Three-dimensional skeletal hand with one finger pointing upward"></canvas></div><div class="caption">THE CURSE HAS FOUND ITS TARGET</div><button id="replay">Replay gift</button><p class="hint">Drag to turn the hand · Pinch to zoom</p></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#view'),stage=document.querySelector('#stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x09100b,.055);
const camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(0,0,10.8);
scene.add(new THREE.HemisphereLight(0xb9d8c0,0x17120e,2.1));
const key=new THREE.DirectionalLight(0xffedcf,3.1);key.position.set(-4,6,7);scene.add(key);
const rim=new THREE.PointLight(0x76ff8c,24,12);rim.position.set(3,1,3);scene.add(rim);
const red=new THREE.PointLight(0x8d1e31,18,10);red.position.set(-2,-2,2);scene.add(red);
const root=new THREE.Group();scene.add(root);const hand=new THREE.Group();root.add(hand);
const boneMat=new THREE.MeshStandardMaterial({color:0xd8c9a8,roughness:.78,metalness:.02});
const darkMat=new THREE.MeshStandardMaterial({color:0x292c23,roughness:1});
const jointMat=new THREE.MeshStandardMaterial({color:0xc9b894,roughness:.86});
const sphereGeo=new THREE.SphereGeometry(1,18,14);
function ball(parent,p,r,mat=jointMat){const m=new THREE.Mesh(sphereGeo,mat);m.position.set(...p);m.scale.set(r*1.05,r,r*.86);parent.add(m);return m}
function segment(parent,a,b,r=.105){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=new THREE.Vector3().subVectors(B,A);const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r*.76,r,d.length(),12,1),boneMat);mesh.position.copy(A).add(B).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());parent.add(mesh);ball(parent,a,r*1.08);ball(parent,b,r*1.08);const n=new THREE.Mesh(new THREE.TorusGeometry(r*.88,.018,5,14),darkMat);n.position.copy(A).lerp(B,.5);n.quaternion.copy(mesh.quaternion);parent.add(n)}
// Wrist and the five metacarpals create a recognizable palm structure.
segment(hand,[-.12,-2.35,0],[0,-1.25,.02],.18);
segment(hand,[-.12,-1.45,.02],[-.72,-.55,.04],.115);
segment(hand,[-.05,-1.42,.03],[-.22,-.43,.04],.12);
segment(hand,[.08,-1.42,.03],[.28,-.48,.04],.12);
segment(hand,[.2,-1.45,.02],[.73,-.65,.02],.105);
segment(hand,[-.18,-1.5,.03],[-.82,-.92,.05],.11);
// Index finger: long, straight, and unmistakably raised.
const index=[[-.83,-.48,.08],[-1.08,.12,.12],[-1.25,.78,.14],[-1.34,1.34,.15],[-1.38,1.62,.15]];
for(let i=0;i<index.length-1;i++)segment(hand,index[i],index[i+1],i===2?.09:.105);
// Broad, unmistakable palm framework: a transverse knuckle bar and five fan-shaped metacarpals.
segment(hand,[-1.02,-.42,.12],[.92,-.48,.12],.14);
segment(hand,[-.83,-.55,.12],[-.92,-1.25,.16],.105);
segment(hand,[-.42,-.5,.13],[-.36,-1.32,.17],.11);
segment(hand,[.02,-.5,.13],[.18,-1.34,.17],.11);
segment(hand,[.46,-.51,.12],[.65,-1.2,.16],.105);
segment(hand,[.82,-.53,.1],[.98,-.95,.14],.09);
// Three remaining fingers curl down and inward, with separate phalanges.
function curled(points,r){for(let i=0;i<points.length-1;i++)segment(hand,points[i],points[i+1],r)}
curled([[-.28,-.42,.15],[-.12,.02,.22],[.2,.13,.28],[.43,-.08,.34],[.27,-.38,.38]],.105);
curled([[.18,-.46,.15],[.55,-.02,.22],[.86,-.05,.29],[1.02,-.31,.36],[.78,-.55,.4]],.10);
curled([[.58,-.58,.13],[.94,-.23,.2],[1.2,-.3,.27],[1.25,-.56,.34],[1.02,-.72,.38]],.09);
// Thumb crosses the lower palm; it is not another upright digit.
curled([[-.82,-.92,.05],[-1.18,-.55,.1],[-1.28,-.22,.14],[-1.02,-.08,.18],[-.7,-.32,.2]],.12);
// Carpal cluster and wrist cuff.
for(const [x,y,z] of [[-.48,-1.25,.12],[-.25,-1.3,.14],[0,-1.3,.15],[.25,-1.28,.12],[.48,-1.18,.1]])ball(hand,[x,y,z],.16);
const cuff=new THREE.Mesh(new THREE.CylinderGeometry(.43,.5,.45,12),new THREE.MeshStandardMaterial({color:0x171b17,roughness:1}));cuff.position.set(-.12,-2.48,0);hand.add(cuff);
for(let i=0;i<7;i++){const spike=new THREE.Mesh(new THREE.ConeGeometry(.09,.28,5),darkMat);spike.position.set(-.5+i*.13,-2.72+(i%2)*.08,.02);spike.rotation.z=(i-3)*.15;hand.add(spike)}
// Summoning sigil beneath the wrist.
const sigil=new THREE.Group();scene.add(sigil);sigil.position.y=-2.75;
for(const r of [1.35,1.12,.72]){const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.012,5,100),new THREE.MeshBasicMaterial({color:0x70bd68,transparent:true,opacity:.55}));sigil.add(ring)}
const rune=new THREE.Mesh(new THREE.OctahedronGeometry(.58,0),new THREE.MeshBasicMaterial({color:0x7df58a,wireframe:true,transparent:true,opacity:.38}));sigil.add(rune);
const particles=new THREE.Group();scene.add(particles);const particleMat=new THREE.MeshBasicMaterial({color:0x9dff9a});for(let i=0;i<65;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.018+Math.random()*.025,6,6),particleMat);p.position.set((Math.random()-.5)*4,-2.5+Math.random()*5,(Math.random()-.5)*1.2);p.userData.speed=.35+Math.random()*.8;particles.add(p)}
let start=performance.now(),drag=false,lastX=0,lastY=0,rotY=-.08,rotX=-.04;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
function animate(t){requestAnimationFrame(animate);const elapsed=(t-start)/1000;const cycle=elapsed%6;const rise=cycle<1.2?cycle/1.2:cycle<4.4?1:Math.max(0,1-(cycle-4.4)/1.6);hand.position.y=-2.3+rise*2.05;hand.rotation.y=rotY+Math.sin(t*.0005)*.035;hand.rotation.x=rotX+Math.sin(t*.0007)*.018;hand.rotation.z=Math.sin(t*.0008)*.018;sigil.rotation.y=t*.00016;sigil.children[0].material.opacity=.35+.2*Math.sin(t*.003);particles.children.forEach(p=>{p.position.y+=p.userData.speed*.008;if(p.position.y>2.7)p.position.y=-2.7});renderer.render(scene,camera)}requestAnimationFrame(animate);
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;rotY+=(e.clientX-lastX)*.009;rotX=Math.max(-.5,Math.min(.5,rotX+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
document.querySelector('#replay').addEventListener('click',()=>{start=performance.now()});
</script></body></html>
