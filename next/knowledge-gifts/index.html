<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finger of Death · TikNation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#07070b;color:#f3edf0;font:15px/1.45 system-ui,sans-serif;text-align:center}.panel{width:min(100%,560px);padding:22px 14px 20px;border:1px solid #49333d;border-radius:22px;background:linear-gradient(160deg,#1a141b,#08090e 70%);box-shadow:0 25px 90px #000;overflow:hidden}h1{font-size:clamp(26px,7vw,37px);letter-spacing:.08em;margin:0}p{margin:6px 0 0;color:#bdb0b9}.stage{height:430px;max-width:460px;margin:12px auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 78%,#62203266,transparent 48%),linear-gradient(#0b0b12,#101018 72%,#08080b);isolation:isolate}.mist{position:absolute;inset:45% -20% 0;background:radial-gradient(ellipse,#8d3a5540,transparent 65%);filter:blur(20px);animation:mist 5s ease-in-out infinite}.floor{position:absolute;left:-10%;right:-10%;bottom:-38px;height:150px;background:repeating-conic-gradient(from 10deg at 50% 0%,#29232b 0 8deg,#15141a 9deg 18deg);clip-path:polygon(0 20%,50% 0,100% 20%,100% 100%,0 100%);border-top:2px solid #5e3544}.crack{position:absolute;bottom:65px;left:50%;width:280px;height:105px;transform:translateX(-50%);background:radial-gradient(ellipse,#e54a7030,transparent 68%);filter:blur(5px)}.seal{position:absolute;left:50%;bottom:20px;width:235px;height:235px;transform:translateX(-50%) rotate(-8deg);border:1px solid #9c3e5b;border-radius:50%;box-shadow:0 0 22px #d52f5c44,inset 0 0 26px #d52f5c22;opacity:0;animation:seal 6s infinite}.seal:before,.seal:after{content:"";position:absolute;inset:15px;border:1px dashed #b76b80;border-radius:50%}.seal:after{inset:52px;border:1px solid #b76b80;border-radius:4px;transform:rotate(45deg)}.hand{position:absolute;z-index:3;width:235px;height:390px;left:50%;bottom:-4px;transform:translate(-50%,115%);filter:drop-shadow(0 18px 12px #000) drop-shadow(0 0 12px #8f263c66);animation:emerge 6s cubic-bezier(.22,.7,.2,1) infinite}.hand svg{width:100%;height:100%;overflow:visible}.flare{position:absolute;z-index:4;inset:12% 8%;border:2px solid #ef5475;border-radius:50%;opacity:0;transform:scale(.3);animation:flare 6s infinite}.embers i{position:absolute;z-index:2;left:var(--x);bottom:35px;width:3px;height:3px;border-radius:50%;background:#ff9aab;box-shadow:0 0 9px 2px #ef466e;animation:ember 2.8s linear infinite;animation-delay:var(--delay)}button{border:1px solid #b34a68;border-radius:999px;padding:12px 26px;background:linear-gradient(110deg,#481a2b,#a32e50);color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 5px 25px #b72b4c33}button:active{transform:scale(.97)}@keyframes emerge{0%,9%{transform:translate(-50%,115%)}32%,67%{transform:translate(-50%,0)}84%,100%{transform:translate(-50%,115%)}}@keyframes seal{0%,12%,90%,100%{opacity:0;transform:translateX(-50%) rotate(-8deg) scale(.65)}32%,72%{opacity:.95;transform:translateX(-50%) rotate(82deg) scale(1)}}@keyframes flare{0%,65%,100%{opacity:0;transform:scale(.3)}74%{opacity:.9;transform:scale(1.05)}86%{opacity:0;transform:scale(1.4)}}@keyframes ember{0%{transform:translateY(0) scale(.2);opacity:0}20%{opacity:.9}100%{transform:translateY(-340px) scale(0);opacity:0}}@keyframes mist{50%{transform:translateX(18px);opacity:.6}}@media(prefers-reduced-motion:reduce){.hand,.seal,.flare,.embers i,.mist{animation:none}.hand{transform:translate(-50%,0)}.seal{opacity:.8}}
</style></head><body><main class="panel"><h1>FINGER OF DEATH</h1><p>A skeletal hand breaks through the stone and points its curse.</p><div class="stage" id="stage"><div class="mist"></div><div class="floor"></div><div class="crack"></div><div class="seal"></div>
<div class="hand"><svg viewBox="0 0 240 400" role="img" aria-label="An unmistakable skeletal hand with one long index finger pointing upward">
<defs>
 <linearGradient id="bone" x1="0" y1="0" x2="1" y2=".15"><stop stop-color="#51464b"/><stop offset=".28" stop-color="#c8bba7"/><stop offset=".52" stop-color="#f0e4cc"/><stop offset=".78" stop-color="#a99a8c"/><stop offset="1" stop-color="#51464b"/></linearGradient>
 <radialGradient id="joint"><stop stop-color="#e8dcc6"/><stop offset=".7" stop-color="#aa9a88"/><stop offset="1" stop-color="#51444a"/></radialGradient>
 <filter id="boneGrain"><feTurbulence baseFrequency=".7" numOctaves="2" seed="8" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feBlend in="SourceGraphic" mode="soft-light"/></filter>
</defs>
<!-- dark gaps make every bone separate; no solid glove-shaped hand -->
<g fill="none" stroke="#211820" stroke-width="17" stroke-linecap="round">
 <path d="M116 322 L116 260 L116 214"/><path d="M116 214 L116 163 L116 113 L116 64 L116 25"/>
 <path d="M93 324 L78 276 L64 239 L52 211"/><path d="M138 324 L153 276 L165 241 L171 218"/><path d="M160 323 L184 286 L197 255 L198 236"/>
 <path d="M92 345 L70 365 L51 379"/>
</g>
<!-- long raised index finger: three unmistakable phalanges -->
<g filter="url(#boneGrain)" fill="url(#bone)" stroke="#30252c" stroke-width="2.5">
 <rect x="105" y="13" width="22" height="52" rx="10"/><ellipse cx="116" cy="66" rx="13" ry="10" fill="url(#joint)"/>
 <rect x="105" y="76" width="22" height="48" rx="10"/><ellipse cx="116" cy="127" rx="13" ry="10" fill="url(#joint)"/>
 <rect x="105" y="137" width="22" height="54" rx="10"/><ellipse cx="116" cy="198" rx="14" ry="11" fill="url(#joint)"/>
</g>
<!-- palm: five separate metacarpal bones radiating to wrist -->
<g fill="none" stroke="url(#bone)" stroke-width="15" stroke-linecap="round" filter="url(#boneGrain)">
 <path d="M116 210 L115 291"/><path d="M95 226 L87 292"/><path d="M139 226 L145 292"/><path d="M160 232 L169 294"/><path d="M76 236 L66 291"/>
</g>
<!-- curled middle finger, each phalanx separated by dark joint -->
<g fill="url(#bone)" stroke="#30252c" stroke-width="2.5">
 <rect x="132" y="203" width="19" height="39" rx="9" transform="rotate(18 141 222)"/>
 <ellipse cx="151" cy="246" rx="11" ry="10" fill="url(#joint)"/>
 <rect x="145" y="250" width="19" height="34" rx="9" transform="rotate(-34 154 267)"/>
 <ellipse cx="139" cy="286" rx="10" ry="9" fill="url(#joint)"/>
 <rect x="119" y="284" width="20" height="29" rx="9" transform="rotate(-58 129 298)"/>
 <!-- ring finger -->
 <rect x="158" y="218" width="18" height="35" rx="9" transform="rotate(29 167 235)"/>
 <ellipse cx="177" cy="256" rx="10" ry="9" fill="url(#joint)"/>
 <rect x="169" y="259" width="18" height="30" rx="9" transform="rotate(-28 178 274)"/>
 <ellipse cx="168" cy="291" rx="9" ry="8" fill="url(#joint)"/>
 <rect x="148" y="288" width="18" height="26" rx="8" transform="rotate(-55 157 301)"/>
 <!-- little finger -->
 <rect x="183" y="231" width="16" height="30" rx="8" transform="rotate(42 191 246)"/>
 <ellipse cx="199" cy="263" rx="9" ry="8" fill="url(#joint)"/>
 <rect x="190" y="265" width="16" height="25" rx="8" transform="rotate(-12 198 277)"/>
 <ellipse cx="190" cy="293" rx="8" ry="8" fill="url(#joint)"/>
 <rect x="170" y="291" width="16" height="22" rx="8" transform="rotate(-40 178 302)"/>
 <!-- thumb angled across palm -->
 <rect x="69" y="197" width="20" height="42" rx="10" transform="rotate(-42 79 218)"/>
 <ellipse cx="63" cy="245" rx="12" ry="10" fill="url(#joint)"/>
 <rect x="51" y="244" width="19" height="39" rx="9" transform="rotate(-25 60 263)"/>
 <ellipse cx="52" cy="287" rx="11" ry="10" fill="url(#joint)"/>
</g>
<!-- wrist bones -->
<g fill="url(#joint)" stroke="#30252c" stroke-width="2">
 <ellipse cx="91" cy="321" rx="12" ry="17"/><ellipse cx="113" cy="325" rx="12" ry="17"/><ellipse cx="136" cy="325" rx="12" ry="17"/><ellipse cx="158" cy="319" rx="12" ry="17"/>
</g>
<!-- fine cracks and aged bone markings -->
<g fill="none" stroke="#57464a" stroke-width="2" stroke-linecap="round">
 <path d="M110 35 l7 8 -5 8 M109 91 l8 6 -6 9 M122 151 l-7 8 6 7 M148 220 l-5 8 6 6 M180 271 l-7 6 3 7 M70 258 l7 5 -4 8"/>
</g>
<!-- torn dark shroud behind the exposed wrist -->
<path d="M83 334 L96 344 L109 336 L123 347 L138 336 L153 344 L169 333 L183 351 L173 400 L77 400Z" fill="#17131b" stroke="#49313b" stroke-width="4"/>
</svg></div><div class="flare"></div><div class="embers" id="embers"></div></div><button id="replay" type="button">Replay gift</button></main>
<script>const stage=document.getElementById('stage');const embers=document.getElementById('embers');for(let i=0;i<28;i++){const e=document.createElement('i');e.style.setProperty('--x',(4+Math.random()*92)+'%');e.style.setProperty('--delay',(-Math.random()*2.8)+'s');embers.appendChild(e)}document.getElementById('replay').addEventListener('click',()=>{for(const el of stage.querySelectorAll('.hand,.seal,.flare'))el.style.animation='none';void stage.offsetWidth;for(const el of stage.querySelectorAll('.hand,.seal,.flare'))el.style.animation=''})</script></body></html>
