<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 40%,#29202b 0,#11121b 48%,#06070c 100%);color:#f7f2f5;font:16px/1.45 system-ui,sans-serif;text-align:center}.panel{width:min(100%,540px);padding:25px 16px 22px;border:1px solid #59434e;border-radius:24px;background:linear-gradient(160deg,#1b1721f5,#090a11f5);box-shadow:0 24px 80px #000c;overflow:hidden}h1{margin:0;font-size:clamp(27px,7vw,38px);letter-spacing:.06em}p{color:#c9bdc8;margin:7px 0 0}.stage{height:410px;position:relative;overflow:hidden;margin:12px auto 10px;max-width:440px;background:radial-gradient(ellipse at 50% 87%,#8a294655,transparent 45%)}.ground{position:absolute;bottom:-35px;left:4%;width:92%;height:115px;background:radial-gradient(ellipse,#21141c 0,#100e15 58%,transparent 72%);border-top:2px solid #603044;border-radius:50%}.rune{position:absolute;width:240px;height:240px;left:50%;bottom:5px;transform:translateX(-50%);border:1px solid #a83b60;border-radius:50%;box-shadow:0 0 24px #e23d7744,inset 0 0 35px #e23d7722;opacity:0;animation:rune 5.4s infinite}.rune:before,.rune:after{content:"";position:absolute;inset:15px;border:1px dashed #c56b89;border-radius:50%}.rune:after{inset:54px;border:1px solid #c56b89;transform:rotate(45deg);border-radius:2px}.hand{position:absolute;width:185px;height:350px;left:50%;bottom:12px;transform:translate(-50%,120%);filter:drop-shadow(0 13px 8px #000) drop-shadow(0 0 12px #9c315355);animation:rise 5.4s cubic-bezier(.2,.75,.25,1) infinite}.hand svg{width:100%;height:100%;overflow:visible}.pulse{position:absolute;inset:15% 7%;border:2px solid #f14b77;border-radius:50%;opacity:0;animation:pulse 5.4s infinite}.embers i{position:absolute;width:4px;height:4px;border-radius:50%;background:#ff8ba9;box-shadow:0 0 10px #ff477a;left:var(--x);bottom:30px;animation:embers 2.6s infinite;animation-delay:var(--d)}button{border:0;border-radius:999px;padding:13px 26px;background:linear-gradient(90deg,#812744,#d7436c);color:#fff;font-weight:750;font-size:15px;cursor:pointer;box-shadow:0 5px 24px #d33e6744}button:active{transform:scale(.97)}@keyframes rise{0%,8%{transform:translate(-50%,120%)}34%,67%{transform:translate(-50%,0)}85%,100%{transform:translate(-50%,120%)}}@keyframes rune{0%,12%,90%,100%{opacity:0;transform:translateX(-50%) scale(.55) rotate(0)}34%,72%{opacity:1;transform:translateX(-50%) scale(1) rotate(90deg)}}@keyframes pulse{0%,63%,100%{opacity:0;transform:scale(.45)}73%{opacity:.85;transform:scale(1.15)}84%{opacity:0;transform:scale(1.45)}}@keyframes embers{0%{transform:translateY(0) scale(.2);opacity:0}25%{opacity:1}100%{transform:translateY(-300px) scale(0);opacity:0}}@media(prefers-reduced-motion:reduce){.hand,.rune,.pulse,.embers i{animation:none}.hand{transform:translate(-50%,0)}.rune{opacity:.8}}

<script>const stage=document.getElementById('stage');const embers=document.getElementById('embers');for(let i=0;i<24;i++){const e=document.createElement('i');e.style.setProperty('--x',(5+Math.random()*90)+'%');e.style.setProperty('--d',(-Math.random()*2.6)+'s');embers.appendChild(e)}document.getElementById('replay').addEventListener('click',()=>{for(const el of stage.querySelectorAll('.hand,.rune,.pulse')){el.style.animation='none'}void stage.offsetWidth;for(const el of stage.querySelectorAll('.hand,.rune,.pulse')){el.style.animation=''}});</script></body></html>
