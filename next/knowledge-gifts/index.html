<!doctype html>
<html lang="en"><head>

<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 45%,#29204b,#111126 55%,#070812);color:#f5f0ff;font-family:system-ui,sans-serif}
header{padding:16px 20px;border-bottom:1px solid #ffffff1c;background:#080914b8;font-size:13px;font-weight:950;letter-spacing:.15em}header span{color:#9cf8ee}header a{float:right;color:#c8bde5;text-decoration:none;font-size:12px;letter-spacing:0}
main{width:min(900px,100%);margin:auto;padding:28px 16px 45px}.eyebrow{text-align:center;color:#9cf8ee;font-size:10px;font-weight:900;letter-spacing:.28em}h1{text-align:center;font:clamp(32px,6vw,54px) Georgia,serif;margin:9px 0;text-shadow:0 0 24px #9c7aff66}.intro{text-align:center;color:#c9c2dc;max-width:600px;margin:0 auto 22px;font-size:13px;line-height:1.6}
.stage{position:relative;height:clamp(450px,65vw,610px);min-height:450px;overflow:hidden;border:1px solid #b99aff55;border-radius:24px;background:radial-gradient(ellipse at 50% 70%,#285d7088,transparent 52%),linear-gradient(#0c1327,#16132d 70%,#080a13);box-shadow:0 24px 80px #0009,inset 0 0 60px #9e7cff12}
.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 1.8px),radial-gradient(circle,#bda7ff 1px,transparent 2px);background-size:83px 91px,137px 121px;background-position:0 0,42px 30px;opacity:.32;animation:stars 14s linear infinite}
.moon{position:absolute;right:12%;top:10%;width:90px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b4dce8 45%,#5d76a7 75%);box-shadow:0 0 55px #9deeff88}
.smoke{position:absolute;left:50%;bottom:9%;width:min(76vw,500px);height:78%;transform:translateX(-50%);filter:blur(1px)}.smoke i{position:absolute;left:50%;bottom:0;width:42%;height:60%;border-radius:50%;background:radial-gradient(ellipse at 50% 75%,#b6f8eeaa,#5bbdcf66 40%,#9a7aff44 65%,transparent 74%);filter:blur(13px);transform:translateX(-50%);animation:smokeRise 4s ease-in-out infinite}.smoke i:nth-child(2){width:60%;height:66%;animation-delay:-1.2s;opacity:.65;transform:translateX(-70%) rotate(-18deg)}.smoke i:nth-child(3){width:58%;height:72%;animation-delay:-2.1s;opacity:.55;transform:translateX(-28%) rotate(16deg)}
.genie{position:absolute;left:50%;top:45%;width:min(56vw,310px);height:390px;transform:translate(-50%,-50%);opacity:0;filter:drop-shadow(0 0 28px #8cf4ff77);animation:genieRise 5.8s ease-in-out infinite}.torso{position:absolute;left:23%;top:30%;width:54%;height:48%;border-radius:45% 45% 32% 32%;background:linear-gradient(100deg,#155a6a,#5dd6d1 35%,#1b7384 65%,#12394f);clip-path:polygon(22% 0,78% 0,100% 38%,76% 70%,100% 100%,0 100%,24% 70%,0 38%);box-shadow:inset 0 0 25px #b5fff777}.head{position:absolute;left:37%;top:13%;width:26%;height:23%;border-radius:46% 46% 42% 42%;background:linear-gradient(100deg,#176174,#82e8d9 45%,#1a687a);box-shadow:inset -9px -4px 15px #062b48}.hood{position:absolute;left:30%;top:8%;width:40%;height:13%;border-radius:70% 70% 8% 8%;background:linear-gradient(#25213f,#70609c);clip-path:polygon(50% 0,100% 100%,0 100%)}.eye{position:absolute;top:23%;width:5%;height:3%;background:#f6f4ff;box-shadow:0 0 12px #a7ffff;border-radius:50%}.eye.left{left:43%}.eye.right{right:43%}.beard{position:absolute;left:42%;top:31%;width:16%;height:17%;background:linear-gradient(90deg,#161b34,#6d7291,#151b31);clip-path:polygon(0 0,100% 0,50% 100%)}.arm{position:absolute;top:37%;width:22%;height:13%;border-radius:50%;background:linear-gradient(#236f7d,#77e6d8,#164c64)}.arm.left{left:4%;transform:rotate(24deg);transform-origin:right center;animation:armLeft 2.8s ease-in-out infinite}.arm.right{right:4%;transform:rotate(-24deg);transform-origin:left center;animation:armRight 2.8s ease-in-out infinite}.tail{position:absolute;left:32%;bottom:0;width:36%;height:32%;border-radius:50%;background:radial-gradient(ellipse at 50% 10%,#61d5d0,#1b7187 65%,transparent 72%);filter:blur(3px);animation:tailSwirl 3s ease-in-out infinite}
.lamp{position:absolute;left:50%;bottom:8%;width:190px;height:86px;transform:translateX(-50%);filter:drop-shadow(0 0 18px #e4bb67aa);animation:lampHover 3s ease-in-out infinite}.lamp svg{width:100%;height:100%;overflow:visible}.label{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#c6faff;font-size:10px;font-weight:900;letter-spacing:.22em;text-shadow:0 0 12px #65efff}
.controls{display:flex;justify-content:center;gap:10px;margin:16px 0}.action{border:1px solid #d6b878;border-radius:999px;background:linear-gradient(120deg,#79543b,#4c376b);color:#fff2d0;padding:12px 18px;font-weight:850;font-size:12px;cursor:pointer}.caption{text-align:center;color:#aaa4c1;font-size:11px;line-height:1.6}
@keyframes stars{to{background-position:0 -190px,42px -240px}}@keyframes genieRise{0%,8%{opacity:0;transform:translate(-50%,-28%) scale(.72)}25%,78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-66%) scale(1.08)}}@keyframes smokeRise{0%,100%{transform:translate(-50%,12%) scale(.8);opacity:.3}50%{transform:translate(-50%,-8%) scale(1.18);opacity:.9}}@keyframes armLeft{50%{transform:rotate(-16deg)}}@keyframes armRight{50%{transform:rotate(16deg)}}@keyframes tailSwirl{50%{transform:scaleX(1.18) rotate(8deg);filter:blur(5px)}}@keyframes lampHover{50%{transform:translate(-50%,-8px) rotate(-2deg)}}
@media(max-width:560px){.stage{height:480px}.genie{top:43%;height:340px}.lamp{width:155px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important}}
</style></head><body>
<header>TIK<span>NATION</span> · GIFT PREVIEW<a href="../">← New TikNation</a></header>
<main><div class="eyebrow">SUPERNATURAL GIFT PREVIEW</div><h1>The Spooky Genie</h1><p class="intro">An ancient brass lamp awakens. Watch the smoke gather as a mysterious genie rises.</p>
<section class="stage" aria-label="Spooky Genie animation"><div class="stars"></div><div class="moon"></div><div class="smoke"><i></i><i></i><i></i></div>
<div class="genie" id="genie"><div class="hood"></div><div class="head"></div><div class="eye left"></div><div class="eye right"></div><div class="beard"></div><div class="torso"></div><div class="arm left"></div><div class="arm right"></div><div class="tail"></div></div>
<div class="lamp"><svg viewBox="0 0 220 100" role="img" aria-label="Ornate antique brass genie lamp"><defs><linearGradient id="brass" x2="0" y2="1"><stop stop-color="#fff0a8"/><stop offset=".24" stop-color="#c18a3e"/><stop offset=".55" stop-color="#70431f"/><stop offset=".78" stop-color="#e6b75c"/><stop offset="1" stop-color="#4b2b20"/></linearGradient></defs><path d="M34 52Q25 36 49 28Q83 8 135 31Q165 43 167 58Q143 84 72 81Q39 77 34 52Z" fill="url(#brass)" stroke="#f3d18b" stroke-width="3"/><path d="M132 36Q172 16 204 27Q182 38 166 51" fill="none" stroke="#d9a64e" stroke-width="9" stroke-linecap="round"/><path d="M38 47Q13 38 9 55Q20 66 38 62" fill="none" stroke="#e4b75d" stroke-width="8"/><path d="M62 30Q72 9 91 13Q107 15 112 31" fill="none" stroke="#f2d18a" stroke-width="7"/><path d="M53 83H151" stroke="#e7bb69" stroke-width="7" stroke-linecap="round"/><path d="M81 41Q108 28 138 44" stroke="#ffe3a0" stroke-width="3" fill="none" opacity=".75"/></svg></div>
<div class="label">THE SPOOKY GENIE · THE LAMP HAS AWAKENED</div></section>
<div class="controls"><button class="action" id="replay">↻ REPLAY ENTRANCE</button></div><p class="caption" id="status">The genie rises from the lamp. Tap replay to see the entrance again.</p></main>
<script>
const genie=document.getElementById("genie"),status=document.getElementById("status");
function replay(){genie.style.animation="none";void genie.offsetWidth;genie.style.animation="genieRise 5.8s ease-in-out infinite";status.textContent="The lamp releases its magic and the genie rises again."}
document.getElementById("replay").addEventListener("click",replay);
</script></body></html>
