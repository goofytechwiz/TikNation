<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finger of Death · TikNation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#07090b;color:#eee;font:15px/1.45 system-ui,sans-serif;text-align:center}.panel{width:min(100%,580px);padding:20px 12px;border:1px solid #3b493c;border-radius:22px;background:linear-gradient(155deg,#151a17,#080a0b 72%);box-shadow:0 24px 90px #000}h1{margin:0;font-size:clamp(25px,7vw,36px);letter-spacing:.1em}p{color:#b9c3b9;margin:5px 0}.stage{height:min(68vh,520px);min-height:390px;position:relative;margin:12px auto;overflow:hidden;border-radius:14px;background:radial-gradient(ellipse at 50% 78%,#315c3a55,transparent 44%),linear-gradient(#090d0c,#111a13 70%,#080b09)}canvas{display:block;width:100%;height:100%;touch-action:pan-y}.caption{font-size:12px;letter-spacing:.13em;color:#8da18e}button{margin-top:8px;padding:12px 25px;border-radius:99px;border:1px solid #71915e;background:linear-gradient(110deg,#243c27,#52733c);color:white;font-weight:700;font-size:15px;cursor:pointer}button:active{transform:scale(.97)}.hint{font-size:12px;color:#8c978d}
</style></head><body><main class="panel"><h1>FINGER OF DEATH</h1><p>Real anatomical hand bones rise from the summoning circle.</p><div class="stage" id="stage"><canvas id="view" aria-label="Three-dimensional skeletal hand with one finger pointing upward"></canvas></div><div class="caption">THE CURSE HAS FOUND ITS TARGET</div><button id="replay">Replay gift</button><p class="hint">Drag to turn the anatomical model</p></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const canvas=document.querySelector('#view'),stage=document.querySelector('#stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x080e09,.045);
const camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(0,0,7.8);
scene.add(new THREE.HemisphereLight(0xd9e7d1,0x17120e,2.4));
const key=new THREE.DirectionalLight(0xffe8c8,3.4);key.position.set(-4,6,6);scene.add(key);
const rim=new THREE.PointLight(0x72ff83,30,12);rim.position.set(3,1,3);scene.add(rim);
const under=new THREE.PointLight(0x8c1931,18,10);under.position.set(-2,-2,2);scene.add(under);
const root=new THREE.Group();scene.add(root);
let hand=null,rotY=-.22,rotX=.08,drag=false,lastX=0,lastY=0,start=performance.now(),zoom=1;
const loader=new GLTFLoader();
loader.load('https://files.innerscene.com/library/hand-bones-320214c6/c7790c111da2a383afd4/hand-bones.glb',gltf=>{
 hand=gltf.scene;root.add(hand);
 const box=new THREE.Box3().setFromObject(hand),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 hand.position.sub(center);
 const s=4.35/Math.max(size.x,size.y,size.z);hand.scale.setScalar(s);
 // Source mesh is a complete anatomical hand-bone assembly; orient its long axis upright.
 hand.rotation.set(-Math.PI/2,0,0);
 hand.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.roughness=Math.max(.62,o.material.roughness??.8);o.material.metalness=0;}}});
},undefined,error=>{console.error('3D hand model failed to load',error);document.querySelector('.caption').textContent='3D MODEL COULD NOT LOAD · CHECK CONNECTION';});
const sigil=new THREE.Group();scene.add(sigil);sigil.position.y=-2.35;
for(const r of [1.4,1.12,.72])sigil.add(new THREE.Mesh(new THREE.TorusGeometry(r,.012,5,100),new THREE.MeshBasicMaterial({color:0x7cf18a,transparent:true,opacity:.55})));
const rune=new THREE.Mesh(new THREE.OctahedronGeometry(.55,0),new THREE.MeshBasicMaterial({color:0x7df58a,wireframe:true,transparent:true,opacity:.36}));sigil.add(rune);
const dust=new THREE.Group();scene.add(dust);const dustMat=new THREE.MeshBasicMaterial({color:0xa7ff9b});
for(let i=0;i<70;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.014+Math.random()*.022,6,6),dustMat);p.position.set((Math.random()-.5)*4.5,-2.7+Math.random()*5.3,(Math.random()-.5)*1.3);p.userData.speed=.25+Math.random()*.7;dust.add(p)}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
function animate(t){requestAnimationFrame(animate);const cycle=((t-start)/1000)%6,rise=cycle<1.2?cycle/1.2:cycle<4.5?1:Math.max(0,1-(cycle-4.5)/1.5);if(hand){hand.position.y=-2.15+rise*1.45;hand.rotation.y=rotY+Math.sin(t*.00045)*.025;hand.rotation.x=-Math.PI/2+rotX+Math.sin(t*.0006)*.012;hand.rotation.z=Math.sin(t*.0007)*.015;}sigil.rotation.y=t*.00015;dust.children.forEach(p=>{p.position.y+=p.userData.speed*.007;if(p.position.y>2.7)p.position.y=-2.7});renderer.render(scene,camera)}requestAnimationFrame(animate);
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;rotY+=(e.clientX-lastX)*.008;rotX=Math.max(-.35,Math.min(.35,rotX+(e.clientY-lastY)*.005));lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
document.querySelector('#replay').addEventListener('click',()=>{start=performance.now()});
</script></body></html>
