<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hollow Signal — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080b;color:#e9e7df;font-family:Arial,sans-serif}
.scene{position:relative;height:100%;min-height:480px;overflow:hidden;isolation:isolate;background:linear-gradient(#070d16 0%,#18212a 48%,#090d11 78%,#020405 100%)}
.clouds{position:absolute;inset:-20%;background:radial-gradient(ellipse at 25% 34%,#65717a55,transparent 33%),radial-gradient(ellipse at 72% 25%,#65717a44,transparent 28%),radial-gradient(ellipse at 50% 57%,#313d48aa,transparent 43%);filter:blur(26px);animation:cloud 17s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translate(-5%,3%) scale(1.12)}}
.horizon{position:absolute;bottom:18%;left:-5%;width:110%;height:24%;background:linear-gradient(transparent,#080d11 75%);clip-path:polygon(0 72%,12% 65%,20% 74%,32% 53%,42% 70%,55% 45%,68% 72%,80% 58%,100% 73%,100% 100%,0 100%)}
.tower{position:absolute;z-index:3;bottom:15%;left:50%;width:min(40vw,310px);height:67%;transform:translateX(-50%);filter:drop-shadow(0 0 16px #000)}
.tower svg{width:100%;height:100%;overflow:visible}
.beacon{position:absolute;z-index:2;left:50%;top:13%;width:4px;height:4px;border-radius:50%;background:#f1e5c0;box-shadow:0 0 12px 7px #f5e5b077,0 0 55px 23px #e8d8a533;animation:pulse 2.6s ease-in-out infinite}
.beam{position:absolute;z-index:2;left:50%;top:13%;width:72vw;height:42vh;transform-origin:0 0;clip-path:polygon(0 0,100% 20%,100% 42%,0 0);background:linear-gradient(90deg,#f6e6b044,transparent);opacity:0;animation:sweep 8s linear infinite}
@keyframes pulse{50%{opacity:.45;box-shadow:0 0 5px 3px #f5e5b044,0 0 25px 12px #e8d8a522}}
@keyframes sweep{0%{transform:rotate(-26deg);opacity:0}8%,40%{opacity:.7}55%,100%{transform:rotate(26deg);opacity:0}}
.rain{position:absolute;inset:-20%;z-index:4;opacity:.28;background-image:repeating-linear-gradient(104deg,transparent 0 17px,#a9bac455 18px,#a9bac455 19px,transparent 20px 42px);animation:rain .32s linear infinite}
@keyframes rain{to{transform:translate(-12px,25px)}}
.groundfog{position:absolute;z-index:5;bottom:7%;left:-10%;width:120%;height:22%;background:radial-gradient(ellipse,#9daab033,transparent 67%);filter:blur(18px);animation:fog 9s ease-in-out infinite alternate}
@keyframes fog{to{transform:translateX(8%) scaleY(1.3)}}
.title{position:absolute;z-index:8;top:5%;width:100%;text-align:center;padding:0 10px;font-size:clamp(22px,5vw,43px);font-weight:300;letter-spacing:.3em;text-transform:uppercase;text-shadow:0 2px 15px #000}
.subtitle{display:block;margin-top:10px;font-size:10px;letter-spacing:.38em;color:#c2c4c1}
.message{position:absolute;z-index:8;bottom:17%;width:100%;text-align:center;color:#d9d4c3;font:11px monospace;letter-spacing:.28em;text-shadow:0 2px 8px #000}
.controls{position:absolute;z-index:10;bottom:4%;left:0;width:100%;display:flex;justify-content:center;gap:10px;padding:0 12px}
button{border:1px solid #9e9a83;background:#111820dd;color:#f0e8d2;padding:14px 20px;letter-spacing:.16em;text-transform:uppercase;font-size:11px;cursor:pointer}
button:disabled{opacity:.5}
.static{position:absolute;z-index:7;inset:0;opacity:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");mix-blend-mode:screen}
.static.on{animation:staticBurst .8s steps(3) both}
@keyframes staticBurst{0%,100%{opacity:0}20%,60%{opacity:.3}}
.blackout{position:absolute;z-index:9;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s}
.blackout.on{opacity:.94}
@media(max-height:560px){.title{top:2%}.tower{height:62%;bottom:14%}.message{bottom:14%}.controls{bottom:2%}}
</style></head>
<body><main class="scene" id="scene">
<div class="clouds"></div><div class="beam" id="beam"></div><div class="horizon"></div>
<div class="tower"><svg viewBox="0 0 300 620" role="img" aria-label="A towering abandoned radio mast">
<defs><linearGradient id="steel" x2="1"><stop stop-color="#141b20"/><stop offset=".48" stop-color="#68727a"/><stop offset=".56" stop-color="#202a31"/><stop offset="1" stop-color="#080d11"/></linearGradient></defs>
<path d="M150 34 L45 600 M150 34 L255 600 M90 600 L210 600 M72 455 L228 455 M95 330 L205 330 M119 190 L181 190" fill="none" stroke="url(#steel)" stroke-width="10"/>
<path d="M150 34 L150 600 M45 600 L205 330 L95 330 L255 600 M72 455 L228 455 L90 600 L210 600 M95 330 L181 190 L119 190 L205 330" fill="none" stroke="#859099" stroke-opacity=".65" stroke-width="3"/>
<path d="M45 600 L255 600 M72 455 L228 455 M95 330 L205 330 M119 190 L181 190" stroke="#080c10" stroke-width="7"/>
<path d="M110 190 Q150 135 190 190 M92 330 Q150 250 208 330 M65 455 Q150 350 235 455" fill="none" stroke="#aeb6b8" stroke-opacity=".4" stroke-width="2"/>
<rect x="129" y="8" width="42" height="30" fill="#242d32" stroke="#a3a9a5" stroke-width="3"/><path d="M150 8 V-15" stroke="#bfc3b9" stroke-width="4"/><circle cx="150" cy="0" r="9" fill="#f1e5c0"/>
</svg></div>
<div class="beacon"></div><div class="rain"></div><div class="groundfog"></div><div class="static" id="static"></div>
<h1 class="title">The Hollow Signal<span class="subtitle">Something is broadcasting from the dead tower</span></h1>
<div class="message" id="message">NO CARRIER · NO KNOWN SOURCE</div><div class="blackout" id="blackout"></div>
<div class="controls"><button id="start">Tune into the signal</button><button id="replay">Replay</button></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let ctx=null,master=null,busy=false,timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function noise(t,duration,volume){const n=ctx.createBufferSource(),buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*duration),ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(.6+Math.random()*.4);n.buffer=buf;const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.frequency.value=900;f.Q.value=.6;g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+duration)}
function tone(freq,t,dur,type='sine',vol=.04){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
async function begin(){if(busy)return;busy=true;$('start').disabled=true;$('message').textContent='SEARCHING FREQUENCIES…';try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();master=ctx.createGain();master.gain.value=.8;master.connect(ctx.destination);const t=ctx.currentTime;noise(t,3,.16);tone(48,t,12,'sine',.15);[0,1.1,2.2,4.4,5.5,7.7,8.8].forEach((s,i)=>tone([392,0,523,0,349,0,262][i]||196,t+s,.7,'sine',.035));noise(t+4,1.5,.2);tone(110,t+6,5,'triangle',.045);noise(t+9,2,.18)}catch(e){$('message').textContent='VISUAL SIGNAL · AUDIO UNAVAILABLE'}
$('beam').style.opacity='1';$('static').classList.add('on');$('message').textContent='…DO YOU COPY?';later(()=>$('message').textContent='WE CAN SEE YOU',3500);later(()=>{$('static').classList.remove('on');$('static').classList.add('on');$('message').textContent='DO NOT ANSWER THE VOICE';},6800);later(()=>{$('blackout').classList.add('on');$('message').textContent='SIGNAL LOST';},10500);later(()=>{$('blackout').classList.remove('on');$('message').textContent='THE TOWER IS STILL TRANSMITTING';$('start').disabled=false;$('start').textContent='Tune in again';busy=false},13300)}
function reset(){timers.forEach(clearTimeout);timers=[];$('blackout').classList.remove('on');$('static').classList.remove('on');$('beam').style.opacity='';$('message').textContent='NO CARRIER · NO KNOWN SOURCE';if(master&&ctx){master.gain.setTargetAtTime(.0001,ctx.currentTime,.04)}busy=false;$('start').disabled=false;$('start').textContent='Tune into the signal'}
$('start').addEventListener('click',begin);$('replay').addEventListener('click',()=>{reset();begin()});
})();
</script></body></html>
