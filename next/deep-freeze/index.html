<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06121b"><title>DEEP FREEZE — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02080e;color:#e9f8ff;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#26485a 0,#102633 35%,#06111b 72%,#02060b 100%);perspective:900px}
#horizon{position:absolute;left:-10%;right:-10%;bottom:17%;height:38%;background:linear-gradient(180deg,#8dc8df12,#02070d 78%);clip-path:polygon(0 40%,18% 10%,34% 34%,52% 0,70% 28%,87% 8%,100% 35%,100% 100%,0 100%);filter:blur(2px)}
#ground{position:absolute;left:-20%;right:-20%;bottom:-22%;height:55%;transform:rotateX(63deg);transform-origin:bottom;background:repeating-linear-gradient(0deg,#a9e7ff12 0 2px,transparent 2px 55px),linear-gradient(180deg,#142d3b,#03080d);box-shadow:0 -30px 80px #9ce5ff18}
#storm{position:absolute;inset:-20%;opacity:0;background:repeating-linear-gradient(105deg,transparent 0 18px,#d9f6ff55 19px 20px,transparent 21px 42px);filter:blur(1px);transform:translateX(-12%);transition:opacity 1s}
#ice{position:absolute;inset:0;opacity:0;transition:opacity 1s;background:radial-gradient(ellipse at 50% 50%,transparent 0 25%,#a8eaff22 50%,#c8f5ff88 100%)}
#fractures{position:absolute;inset:0;opacity:0;transition:opacity .7s;background:linear-gradient(32deg,transparent 47%,#e5fbff 47.2%,#8bd9f7 47.5%,transparent 48%),linear-gradient(112deg,transparent 55%,#e5fbff 55.2%,#8bd9f7 55.5%,transparent 56%),linear-gradient(166deg,transparent 38%,#e5fbff 38.2%,#8bd9f7 38.5%,transparent 39%),linear-gradient(72deg,transparent 68%,#e5fbff 68.2%,#8bd9f7 68.5%,transparent 69%);filter:drop-shadow(0 0 8px #8de5ff)}
#crystal{position:absolute;left:50%;top:48%;width:min(58vw,440px);height:min(65vw,480px);transform:translate(-50%,-50%) scale(.08) rotate(-12deg);opacity:0;transition:transform 1.4s cubic-bezier(.15,.8,.2,1),opacity .6s;filter:drop-shadow(0 0 35px #9beaff88)}
#crystal:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#efffffdd 0 5%,#6cc5e877 13%,#153b51aa 28%,#b6f4ffbb 35%,#27566c 48%,#d9fbffcc 56%,#19465c 70%,#9be9ff99 82%,#efffffcc);clip-path:polygon(50% 0,67% 12%,82% 10%,90% 31%,100% 48%,82% 65%,77% 88%,52% 100%,29% 85%,21% 68%,0 51%,16% 33%,22% 13%,39% 17%);border:2px solid #e8fcff;box-shadow:inset 0 0 45px #e4fbff}
#crystal:after{content:"";position:absolute;inset:10% 23%;background:linear-gradient(90deg,transparent,#efffff99,transparent);clip-path:polygon(48% 0,64% 45%,50% 100%,34% 44%);filter:blur(2px)}
#flash{position:absolute;inset:0;background:#e9fbff;opacity:0;pointer-events:none}
#vignette{position:absolute;inset:0;box-shadow:inset 0 0 150px 45px #000b;pointer-events:none}
header{position:fixed;z-index:5;top:0;left:0;right:0;padding:18px 20px;display:flex;justify-content:space-between;font:800 10px Arial;letter-spacing:.2em;color:#c7eaff}
.pill{border:1px solid #a7e6ff55;border-radius:30px;padding:8px 12px;background:#07141dcc}
.panel{position:fixed;z-index:6;bottom:6%;left:50%;transform:translateX(-50%);width:min(92%,580px);text-align:center;text-shadow:0 2px 20px #000}
.kicker{font-size:10px;font-weight:900;letter-spacing:.38em;color:#9ee9ff}
h1{font-size:clamp(42px,10vw,84px);letter-spacing:.08em;line-height:.9;margin:12px 0}
.desc{font-size:10px;letter-spacing:.2em;color:#c4e3ef;font-weight:700}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
button{border:1px solid #b6efff;border-radius:30px;padding:14px 23px;background:linear-gradient(145deg,#32718a,#102e40);color:white;font-weight:900;font-size:11px;letter-spacing:.14em;cursor:pointer;box-shadow:0 8px 30px #000a}
button.alt{background:#07131dcc;border-color:#8ab9cc88}button:disabled{opacity:.5}
.note{font-size:9px;color:#a7c6d5;margin-top:10px;letter-spacing:.08em}
#caption{position:fixed;z-index:4;top:37%;left:50%;transform:translate(-50%,-50%);font-size:clamp(24px,6vw,56px);font-weight:900;letter-spacing:.22em;white-space:nowrap;color:#e8fbff;text-shadow:0 0 30px #8ee8ff;opacity:0;transition:opacity .5s}
#scene.active #storm{opacity:.85;animation:blow .35s linear infinite}
#scene.active #ice{opacity:1}
#scene.active #crystal{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
#scene.cracked #fractures{opacity:.95}
@keyframes blow{to{transform:translateX(12%)}}
@media(max-width:600px){header{padding:13px;font-size:8px}.panel{bottom:7%}#crystal{width:74vw;height:78vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

#fullfreeze{position:fixed;z-index:20;inset:0;pointer-events:none;opacity:0;overflow:hidden;transition:opacity .45s;background:radial-gradient(ellipse at 50% 48%,#b9efff44,#7bc9e855 60%,#d9f8ffbb 100%);backdrop-filter:blur(0px)}
#fullfreeze .frost{position:absolute;inset:-3%;background: repeating-radial-gradient(ellipse at 8% 12%,#eaffff88 0 1px,transparent 2px 24px),repeating-radial-gradient(ellipse at 88% 82%,#d8f7ff99 0 2px,transparent 3px 31px),linear-gradient(135deg,#c9f5ff33,#e8fcff99 45%,#7fc7e866);filter:blur(1px);opacity:.95}
#fullfreeze .edge{position:absolute;inset:0;box-shadow:inset 0 0 90px 35px #d9f8ff,inset 0 0 24px 8px #fff}
#fullfreeze .web{position:absolute;inset:-5%;opacity:.8;background:linear-gradient(28deg,transparent 48.8%,#f1ffff 49%,#8bdcf5 49.3%,transparent 49.8%),linear-gradient(116deg,transparent 43%,#f1ffff 43.2%,#8bdcf5 43.5%,transparent 44%),linear-gradient(166deg,transparent 62%,#f1ffff 62.2%,#8bdcf5 62.5%,transparent 63%),linear-gradient(76deg,transparent 23%,#f1ffff 23.2%,#8bdcf5 23.5%,transparent 24%);filter:drop-shadow(0 0 7px #b9f4ff)}
#fullfreeze .shard{position:absolute;inset:-10%;opacity:0;background:conic-gradient(from 25deg at 50% 50%,transparent 0 8%,#eaffffbb 8.2% 8.5%,transparent 8.8% 19%,#b9edff99 19.2% 19.5%,transparent 19.8% 31%,#fff 31.2% 31.5%,transparent 31.8%);clip-path:polygon(50% 0,62% 34%,100% 50%,64% 63%,50% 100%,36% 63%,0 50%,37% 35%)}
#fullfreeze.active{opacity:1;backdrop-filter:blur(3px)}
#fullfreeze.shattering{opacity:0;transition:opacity .55s;backdrop-filter:blur(0)}
#fullfreeze.shattering .shard{opacity:1;animation:iceBurst .65s ease-out forwards}
@keyframes iceBurst{to{transform:scale(1.7) rotate(24deg);opacity:0}}
</style></head><body>
<div id="fullfreeze"><div class="frost"></div><div class="web"></div><div class="edge"></div><div class="shard"></div></div>
<div id="scene"><div id="horizon"></div><div id="ground"></div><div id="storm"></div><div id="ice"></div><div id="crystal"></div><div id="fractures"></div><div id="flash"></div><div id="vignette"></div></div>
<div id="caption">TEMPERATURE: ZERO</div>
<header><span>TIKNATION / GIFT PREVIEW</span><span class="pill" id="status">STANDBY</span></header>
<section class="panel"><div class="kicker">THE WORLD STOPS BREATHING</div><h1>DEEP FREEZE</h1><div class="desc">A CINEMATIC GLACIAL IMPACT</div><div class="actions"><button id="trigger">Release the freeze</button><button class="alt" id="sound">Test the ice sound</button></div><div class="note">Sound begins only after tapping · No autoplay · Preview only</div></section>
<script>
(()=>{const scene=document.getElementById('scene'),status=document.getElementById('status'),trigger=document.getElementById('trigger'),caption=document.getElementById('caption'),flash=document.getElementById('flash');let ac=null,busy=false;
function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();}if(ac.state==='suspended')ac.resume();return ac}
function noise(a,t,dur,vol,filterFreq,type='lowpass',q=.7){const n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),data=buf.getChannelData(0);let last=0;for(let i=0;i<n;i++){const white=Math.random()*2-1;last=last*.72+white*.28;data[i]=type==='highpass'?white-last*.65:white*.7+last*.3}const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=buf;f.type=type;f.frequency.value=filterFreq;f.Q.value=q;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(f).connect(g).connect(a.destination);src.start(t);src.stop(t+dur)}
function tone(a,t,f0,f1,dur,vol,wave='sine'){const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type=wave;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);f.type='lowpass';f.frequency.value=1100;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.035);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function crack(){try{const a=audio(),t=a.currentTime;
noise(a,t,.75,.7,1500,'lowpass',.8);noise(a,t+.015,.24,.55,5200,'highpass',.8);
tone(a,t,125,38,.95,.42,'triangle');tone(a,t+.04,880,145,.42,.14,'sawtooth');
for(let i=0;i<13;i++){const at=t+.09+i*.045+Math.random()*.07;noise(a,at,.09+Math.random()*.19,.12+Math.random()*.16,1800+Math.random()*4300,'highpass',1.1);tone(a,at,420+Math.random()*1500,90+Math.random()*180,.12+Math.random()*.16,.035,'triangle')}
noise(a,t+.28,.85,.22,650,'lowpass',.6);tone(a,t+.3,72,25,.8,.22,'sine');
}catch(e){status.textContent='AUDIO UNAVAILABLE'}}
function wind(){try{const a=audio(),t=a.currentTime;noise(a,t,2.8,.34,720,'lowpass',.55);noise(a,t+.25,2.3,.12,1900,'bandpass',.6);tone(a,t,48,31,2.5,.24,'sine');tone(a,t+.25,112,42,2.1,.09,'triangle');}catch(e){status.textContent='AUDIO UNAVAILABLE'}}
function run(){if(busy)return;busy=true;trigger.disabled=true;audio();const full=document.getElementById('fullfreeze');full.classList.remove('active','shattering');scene.classList.remove('active','cracked');caption.style.opacity=0;flash.style.opacity=0;status.textContent='FREEZING THE SCREEN';wind();setTimeout(()=>{full.classList.add('active');scene.classList.add('active');status.textContent='FULL SCREEN FROZEN';},350);setTimeout(()=>{caption.style.opacity=1;status.textContent='TEMPERATURE: ZERO';crack()},1450);setTimeout(()=>{scene.classList.add('cracked');status.textContent='ICE CRACKING';crack();flash.style.opacity=.65;setTimeout(()=>flash.style.opacity=0,130)},2800);setTimeout(()=>{status.textContent='SOLID ICE';},3600);setTimeout(()=>{status.textContent='SHATTERING';full.classList.add('shattering');crack();flash.style.opacity=.9;setTimeout(()=>flash.style.opacity=0,180)},4800);setTimeout(()=>{full.classList.remove('active','shattering');scene.classList.remove('active','cracked');caption.style.opacity=0;status.textContent='STANDBY';trigger.disabled=false;busy=false},5700)}
trigger.addEventListener('click',run);document.getElementById('sound').addEventListener('click',()=>{const a=audio();status.textContent='ICE SOUND TEST';wind();setTimeout(()=>crack(),850)})})();
</script></body></html>
