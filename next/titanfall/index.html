<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08070d"><title>TITANFALL — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;color:#fff;font-family:Arial,sans-serif}
#world{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 52% 42%,#54402f 0,#211d20 28%,#090a10 68%,#020308 100%)}
#sky{position:absolute;inset:0;background:linear-gradient(180deg,#080910 0%,#24202a 42%,#4d382c 66%,#090a10 100%)}
#moon{position:absolute;width:min(55vw,500px);aspect-ratio:1;border-radius:50%;left:50%;top:37%;transform:translate(-50%,-50%) scale(.08);opacity:0;background:radial-gradient(circle at 38% 34%,#d7c7a6 0,#8e7863 24%,#3c3434 53%,#17171d 70%);box-shadow:0 0 35px 12px #f5a65c44,0 0 110px 50px #d77a3d33;transition:transform 2s cubic-bezier(.12,.7,.2,1),opacity .5s}
#moon:before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 25% 30%,#fff3 0 3%,transparent 4%),radial-gradient(ellipse at 67% 65%,#09090b66 0 8%,transparent 9%),radial-gradient(ellipse at 45% 78%,#05050955 0 12%,transparent 13%),radial-gradient(ellipse at 75% 25%,#05050966 0 7%,transparent 8%);filter:blur(2px)}
#halo{position:absolute;left:50%;top:37%;width:min(75vw,700px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.05);opacity:0;border:2px solid #f4b16d88;box-shadow:0 0 35px 12px #ff9b4c55,inset 0 0 50px #ffb56b22;transition:all 2s}
#city{position:absolute;left:-5%;right:-5%;bottom:0;height:28%;background:linear-gradient(180deg,#17171b,#050509);clip-path:polygon(0 42%,5% 42%,5% 28%,9% 28%,9% 50%,13% 50%,13% 16%,17% 16%,17% 43%,21% 43%,21% 32%,25% 32%,25% 58%,30% 58%,30% 24%,34% 24%,34% 46%,39% 46%,39% 8%,43% 8%,43% 44%,49% 44%,49% 30%,54% 30%,54% 55%,59% 55%,59% 19%,64% 19%,64% 43%,69% 43%,69% 12%,73% 12%,73% 49%,78% 49%,78% 27%,83% 27%,83% 44%,88% 44%,88% 20%,92% 20%,92% 48%,100% 48%,100% 100%,0 100%)}
#dust{position:absolute;inset:0;opacity:0;background-image:radial-gradient(circle,#ffcb8c 0 1px,transparent 2px),radial-gradient(circle,#f7e4c5 0 1px,transparent 2px);background-size:97px 113px,151px 173px;background-position:0 0,50px 40px;transition:opacity 1s}
#titan{position:absolute;left:50%;bottom:8%;width:min(70vw,620px);height:76%;transform:translateX(-50%) translateY(115%) scale(.8);opacity:0;transition:transform 2.4s cubic-bezier(.12,.75,.2,1),opacity .8s;filter:drop-shadow(0 0 35px #000)}
#titan .body{position:absolute;left:23%;right:23%;bottom:0;height:78%;background:linear-gradient(100deg,#090a0e,#343034 22%,#14151b 47%,#514237 63%,#0a0b10 88%);clip-path:polygon(28% 0,43% 5%,57% 5%,73% 0,88% 19%,100% 52%,85% 67%,78% 100%,20% 100%,14% 67%,0 52%,12% 18%)}
#titan .head{position:absolute;left:30%;top:2%;width:40%;height:32%;background:linear-gradient(105deg,#111218,#71604e 42%,#1a1a20 75%);clip-path:polygon(20% 0,80% 0,100% 40%,78% 100%,22% 100%,0 40%)}
#titan .eye{position:absolute;left:42%;top:15%;width:16%;height:3%;background:#ffb25e;box-shadow:0 0 15px 6px #ff7d34;opacity:0;transition:opacity .4s}
#titan .arm{position:absolute;top:35%;width:22%;height:53%;background:linear-gradient(90deg,#090a0e,#55493e,#111219);border-radius:45% 45% 20% 20%;filter:drop-shadow(0 0 12px #000)}
#titan .left{left:5%;transform:rotate(18deg)}#titan .right{right:5%;transform:rotate(-18deg)}
#shock{position:absolute;left:50%;top:60%;width:8vmin;height:8vmin;border:3px solid #f5c28c;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0}
#flash{position:absolute;inset:0;background:#ffe0b5;opacity:0;pointer-events:none}
#shade{position:absolute;inset:0;box-shadow:inset 0 0 160px 45px #000b;pointer-events:none}
header{position:fixed;z-index:5;top:0;left:0;right:0;padding:18px 20px;display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:.2em;color:#f5d4b1}
.pill{border:1px solid #d8a77966;border-radius:30px;padding:8px 12px;background:#09090dcc}
.panel{position:fixed;z-index:6;bottom:6%;left:50%;transform:translateX(-50%);width:min(92%,580px);text-align:center;text-shadow:0 2px 20px #000}
.kicker{font-size:10px;font-weight:900;letter-spacing:.38em;color:#ffc28a}
h1{font-size:clamp(42px,10vw,84px);letter-spacing:.08em;line-height:.9;margin:12px 0}
.desc{font-size:10px;letter-spacing:.2em;color:#e3c9b0;font-weight:700}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
button{border:1px solid #ffd1a3;border-radius:30px;padding:14px 23px;background:linear-gradient(145deg,#925b39,#291c1b);color:white;font-weight:900;font-size:11px;letter-spacing:.14em;cursor:pointer;box-shadow:0 8px 30px #000a}
button.alt{background:#09090dcc;border-color:#bd987788}
.note{font-size:9px;color:#c7b4a3;margin-top:10px;letter-spacing:.08em}
#world.active #moon{opacity:1;transform:translate(-50%,-50%) scale(1)}
#world.active #halo{opacity:1;transform:translate(-50%,-50%) scale(1)}
#world.active #titan{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
#world.active #dust{opacity:.8;animation:drift 5s linear infinite}
#world.active #titan .eye{opacity:1;transition-delay:1.4s}
#world.hit #shock{animation:shock .9s ease-out}
#world.hit #flash{animation:flash .35s ease-out}
@keyframes shock{0%{transform:translate(-50%,-50%) scale(.1);opacity:1}100%{transform:translate(-50%,-50%) scale(20);opacity:0}}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
@keyframes drift{to{background-position:300px 80px,-200px 300px}}
@media(max-width:600px){header{padding:13px;font-size:8px}.panel{bottom:5%}#titan{width:100vw;height:70%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style></head><body>
<div id="world"><div id="sky"></div><div id="halo"></div><div id="moon"></div><div id="titan"><div class="body"></div><div class="head"></div><div class="eye"></div><div class="arm left"></div><div class="arm right"></div></div><div id="city"></div><div id="dust"></div><div id="shock"></div><div id="flash"></div><div id="shade"></div></div>
<header><span>TIKNATION / GIFT PREVIEW</span><span class="pill" id="status">DORMANT</span></header>
<section class="panel"><div class="kicker">SOMETHING ANCIENT HAS AWAKENED</div><h1>TITANFALL</h1><div class="desc">A COLOSSUS RISES ABOVE THE CITY</div><div class="actions"><button id="trigger">Awaken the titan</button><button class="alt" id="reset">Reset scene</button></div><div class="note">Preview only · Tap to trigger · No autoplay</div></section>
<script>
(()=>{const w=document.getElementById('world'),s=document.getElementById('status'),b=document.getElementById('trigger'),r=document.getElementById('reset');let started=false,timer;
function awaken(){clearTimeout(timer);w.classList.remove('hit');void w.offsetWidth;w.classList.add('active');s.textContent='AWAKENING';b.disabled=true;timer=setTimeout(()=>{w.classList.add('hit');s.textContent='TITANFALL';b.disabled=false},2600)}
b.addEventListener('click',awaken);r.addEventListener('click',()=>{clearTimeout(timer);w.classList.remove('active','hit');s.textContent='DORMANT';b.disabled=false});
})();
</script></body></html>
