<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>THE END IS NEAR — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b;color:#f5eee8;font-family:Arial,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:#090b0e}
#city{position:absolute;inset:-4%;background-image:linear-gradient(180deg,#05070a55 0%,transparent 25%,#07090dcc 100%),url("https://cdn.pixabay.com/photo/2017/06/30/19/52/apocalypse-2459465_1280.jpg");background-position:center center;background-size:cover;transform:scale(1.04);filter:contrast(1.08) saturate(.78);transition:transform 7s ease,filter 2s}
#smoke{position:absolute;inset:-20%;background:radial-gradient(ellipse at 15% 42%,#c4c5c222 0 9%,transparent 29%),radial-gradient(ellipse at 65% 25%,#c5c5c51e 0 12%,transparent 34%),radial-gradient(ellipse at 88% 56%,#777b8428 0 10%,transparent 30%);filter:blur(22px);animation:smoke 17s ease-in-out infinite alternate;pointer-events:none}
@keyframes smoke{to{transform:translate(-4%,3%) scale(1.1)}}
#embers{position:absolute;inset:-15%;pointer-events:none;background-image:radial-gradient(circle,#ffc38b 0 1px,transparent 2px),radial-gradient(circle,#e56a3c 0 1px,transparent 2px),radial-gradient(circle,#e3d9c9 0 1px,transparent 2px);background-size:89px 103px,137px 167px,211px 187px;background-position:0 0,40px 60px,90px 30px;opacity:.42;animation:fall 11s linear infinite}
@keyframes fall{to{background-position:0 430px,40px 600px,90px 350px}}
#redwash{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,#ff6a2c55,transparent 60%);opacity:0;pointer-events:none}
#lightning{position:absolute;inset:0;background:#e8efff;opacity:0;pointer-events:none}
#vignette{position:absolute;inset:0;box-shadow:inset 0 0 150px 28px #000b;pointer-events:none}
#stage.shaking #city{animation:quake .14s linear infinite}
@keyframes quake{0%{transform:scale(1.12) translate(0,0)}25%{transform:scale(1.12) translate(5px,-3px)}50%{transform:scale(1.12) translate(-4px,4px)}75%{transform:scale(1.12) translate(3px,2px)}100%{transform:scale(1.12) translate(-2px,-3px)}}
#stage.flash #lightning{animation:flash .75s ease-out}
#stage.flash #redwash{animation:glow 2.2s ease-out}
@keyframes flash{0%{opacity:.95}12%{opacity:.2}24%{opacity:.75}100%{opacity:0}}
@keyframes glow{0%{opacity:0}20%{opacity:1}100%{opacity:.18}}
#stage.after #city{transform:scale(1.18);filter:brightness(.58) contrast(1.2) saturate(.55)}
#stage.after #redwash{opacity:.5}
#blackout{position:absolute;inset:0;background:#020305;opacity:0;pointer-events:none;transition:opacity .7s}
#stage.blackout #blackout{opacity:1}
header{position:fixed;z-index:8;top:0;left:0;right:0;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;font-size:9px;font-weight:900;letter-spacing:.2em;color:#eee5dc;text-shadow:0 2px 12px #000}
.pill{border:1px solid #ffffff55;background:#080a0dbb;padding:8px 11px;border-radius:2px}
#count{position:fixed;z-index:7;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(72px,20vw,170px);font-weight:1000;letter-spacing:-.08em;color:#fff;text-shadow:0 0 35px #f78d56;opacity:0}
#count.show{opacity:1}
#message{position:fixed;z-index:7;left:50%;top:40%;transform:translate(-50%,-50%);width:100%;padding:0 10px;text-align:center;font-size:clamp(25px,7vw,70px);font-weight:1000;letter-spacing:.06em;line-height:.95;color:#fff1e5;text-shadow:0 3px 30px #000,0 0 24px #e65d36;opacity:0;transition:opacity .7s}
#stage.after #message{opacity:1}
.panel{position:fixed;z-index:8;left:50%;bottom:6%;transform:translateX(-50%);width:min(94%,650px);text-align:center;text-shadow:0 2px 18px #000}
.kicker{font-size:9px;font-weight:900;letter-spacing:.4em;color:#f3a579}
h1{font-size:clamp(42px,10vw,88px);line-height:.86;letter-spacing:-.055em;margin:11px 0;font-weight:1000}
.sub{font-size:9px;letter-spacing:.2em;font-weight:900;color:#e8ddd4}
.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:17px}
button{border:1px solid #df966c;border-radius:2px;padding:14px 20px;background:linear-gradient(135deg,#7d3929,#281719);color:#fff;font-size:10px;font-weight:900;letter-spacing:.13em;cursor:pointer;box-shadow:0 8px 30px #000b}
button.alt{background:#101319;border-color:#ffffff66}button:disabled{opacity:.5}
small{display:block;margin-top:9px;font-size:9px;letter-spacing:.07em;color:#d2c4b8}
@media(max-width:600px){#city{background-position:51% center}header{padding:12px;font-size:8px}.panel{bottom:6%}.kicker{font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<div id="stage"><div id="city"></div><div id="smoke"></div><div id="embers"></div><div id="redwash"></div><div id="lightning"></div><div id="vignette"></div><div id="blackout"></div></div>
<header><span>TIKNATION / GIFT PREVIEW</span><span class="pill" id="status">EVACUATION ALERT</span></header>
<div id="count"></div><div id="message">THERE IS NO<br>SAFE PLACE</div>
<section class="panel"><div class="kicker">THE FINAL WARNING</div><h1>THE END<br>IS NEAR</h1><div class="sub">WHEN THE LAST DAY ARRIVES</div><div class="actions"><button id="start">START THE FINAL HOUR</button><button class="alt" id="sound">TEST THE SIREN</button></div><small>Tap to begin · Sound only starts after tapping · Preview only</small></section>
<script>
(()=>{const stage=document.getElementById('stage'),status=document.getElementById('status'),start=document.getElementById('start'),count=document.getElementById('count');let ctx=null,busy=false;
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function rumble(){try{const c=audio(),t=c.currentTime,dur=4;const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,1.5);const n=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();n.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(130,t);f.frequency.exponentialRampToValueAtTime(32,t+3.8);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.78,t+.15);g.gain.exponentialRampToValueAtTime(.001,t+3.9);n.connect(f).connect(g).connect(c.destination);n.start(t);n.stop(t+4);const o=c.createOscillator(),og=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(430,t);o.frequency.linearRampToValueAtTime(620,t+1.2);o.frequency.linearRampToValueAtTime(390,t+2.7);og.gain.setValueAtTime(.001,t);og.gain.linearRampToValueAtTime(.12,t+.2);og.gain.linearRampToValueAtTime(.001,t+3.1);o.connect(og).connect(c.destination);o.start(t);o.stop(t+3.2)}catch(e){status.textContent='AUDIO UNAVAILABLE'}}
function run(){if(busy)return;busy=true;start.disabled=true;audio();stage.classList.remove('shaking','flash','after','blackout');let v=3;count.textContent=v;count.classList.add('show');status.textContent='FINAL WARNING';const tick=()=>{if(v>1){v--;count.textContent=v;setTimeout(tick,850)}else{count.classList.remove('show');status.textContent='IMPACT IMMINENT';setTimeout(()=>{stage.classList.add('shaking','flash');rumble();status.textContent='CITYWIDE IMPACT'},250)}};
tick();setTimeout(()=>{stage.classList.remove('shaking');stage.classList.add('after');status.textContent='COMMUNICATIONS LOST'},3900);setTimeout(()=>{stage.classList.add('blackout');status.textContent='SIGNAL LOST'},5900);setTimeout(()=>{stage.classList.remove('blackout','flash','after');status.textContent='EVACUATION ALERT';start.disabled=false;busy=false},7600)}
start.addEventListener('click',run);document.getElementById('sound').addEventListener('click',()=>{rumble();status.textContent='SIREN / IMPACT TEST'})})();
</script></body></html>
