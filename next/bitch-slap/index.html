<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090d"><title>BITCH SLAP — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:system-ui,Arial}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 18%,#0008 68%,#000e 100%),linear-gradient(180deg,#05060a66,transparent 35%,#05060add)}.ui{position:fixed;inset:0;padding:max(15px,env(safe-area-inset-top)) 15px max(15px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.top,.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;font-weight:800;letter-spacing:.2em;color:#e9e5e7}.tag{border:1px solid #ffffff40;background:#101116bb;border-radius:30px;padding:8px 11px}.panel{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);width:min(94%,600px);text-align:center;text-shadow:0 3px 25px #000}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.35em;color:#ffc3a7}h1{font-size:clamp(34px,8vw,68px);line-height:.95;letter-spacing:.02em;margin:9px 0;font-weight:1000}.sub{font-size:10px;letter-spacing:.18em;font-weight:700;color:#e4d6d5}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:17px;pointer-events:auto}button{border:1px solid #ffe0d2;border-radius:30px;padding:13px 20px;background:linear-gradient(#f27656,#a32d32);color:white;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 8px 30px #f04b3740;cursor:pointer}button.alt{background:#101116e8;border-color:#ffffff55;box-shadow:none}button:disabled{opacity:.5}.note{font-size:9px;color:#c5b5b5;margin-top:9px;letter-spacing:.08em}.foot{justify-content:center;color:#b8afb2;font-size:9px}.impact{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;font-size:clamp(42px,13vw,120px);font-weight:1000;font-style:italic;letter-spacing:-.08em;color:#fff;text-sh </style></head><body>
<canvas id="c"></canvas><div class="shade"></div><div class="flash" id="flash"></div><div class="impact" id="impact">SMACK.</div>
<div class="ui"><div class="top"><span>TIKNATION / GIFT PREVIEW</span><span class="tag" id="status">STANDING BY</span></div>
<div class="panel"><div class="eyebrow">THE ROOM GOES QUIET.</div><h1>BITCH SLAP</h1><div class="sub">A cinematic slapstick impact sequence</div><div class="actions"><button id="play">Deliver the slap</button><button class="alt" id="test">Test impact sound</button></div><div class="note">Audio requires a tap · No autoplay · Preview only</div></div>
<div class="foot">CONCEPT PREVIEW · NOT IN THE LIVE GIFT CATALOG</div></div>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),status=document.getElementById('status'),flash=document.getElementById('flash'),impact=document.getElementById('impact'),play=document.getElementById('play');let w,h,dpr,phase='idle',began=0,shake=0,ac=null,grain=[];
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);grain=Array.from({length:180},()=>[R(0,w),R(0,h),R(.2,1.3),R(.04,.17)])}
function path(points,fill){x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=fill;x.fill()}
function bg(){let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#25252d');g.addColorStop(.45,'#17171e');g.addColorStop(1,'#08090e');x.fillStyle=g;x.fillRect(0,0,w,h);
let l=x.createRadialGradient(w*.5,h*.36,0,w*.5,h*.36,Math.max(w,h)*.65);l.addColorStop(0,'#e9b99b25');l.addColorStop(.5,'#9a66731a');l.addColorStop(1,'#0000');x.fillStyle=l;x.fillRect(0,0,w,h);
for(let i=0;i<grain.length;i++){let p=grain[i];x.globalAlpha=p[3];x.fillStyle='#fff';x.fillRect(p[0],p[1],p[2],p[2]);}x.globalAlpha=1;
 // hard-edged studio light shafts
 for(let side of [0,1]){x.save();x.translate(side?w:0,0);x.scale(side?-1:1,1);let beam=x.createLinearGradient(0,0,w*.38,h*.8);beam.addColorStop(0,'#ffe2c51c');beam.addColorStop(1,'#ffe2c500');path([[0,0],[w*.19,0],[w*.62,h*.75],[w*.48,h*.8]],beam);x.restore()}
}
function bust(){let s=Math.min(w/850,h/600),cx=w*.55,cy=h*.46;x.save();x.translate(cx,cy);x.scale(s,s);
 // anonymous performer: backlit head and shoulders, intentionally no facial caricature
 let sh=x.createRadialGradient(0,15,12,0,20,190);sh.addColorStop(0,'#7b6261');sh.addColorStop(.55,'#30272d');sh.addColorStop(1,'#08090d');x.fillStyle=sh;x.beginPath();x.moveTo(-170,240);x.quadraticCurveTo(-150,100,-65,90);x.lineTo(-50,45);x.quadraticCurveTo(0,15,50,45);x.lineTo(65,90);x.quadraticCurveTo(150,100,170,240);x.closePath();x.fill();
 let skin=x.createLinearGradient(-75,-120,85,90);skin.addColorStop(0,'#e0b39c');skin.addColorStop(.35,'#9b716b');skin.addColorStop(.72,'#574248');skin.addColorStop(1,'#201a20');x.fillStyle=skin;x.beginPath();x.ellipse(0,-30,76,103,-.03,0,Math.PI*2);x.fill();
 // hair and shadowed profile detail, understated and human-shaped
 x.fillStyle='#111116';x.beginPath();x.moveTo(-78,-55);x.quadraticCurveTo(-88,-143,-8,-145);x.quadraticCurveTo(72,-150,79,-57);x.quadraticCurveTo(42,-91,5,-89);x.quadraticCurveTo(-32,-80,-78,-55);x.fill();
 let rim=x.createLinearGradient(-90,-30,-60,70);rim.addColorStop(0,'#ffd4b1aa');rim.addColorStop(1,'#ffd4b100');x.strokeStyle=rim;x.lineWidth=5;x.beginPath();x.ellipse(-65,-20,8,55,-.15,-1.2,1.2);x.stroke();x.restore()}
function hand(t){let s=Math.min(w/850,h/600),p=clamp(t,0,1),cx=w*.5+(1-p)*w*.9,cy=h*.48+(1-p)*h*.1,rot=-.48+(1-p)*.7;x.save();x.translate(cx,cy);x.rotate(rot);x.scale(s,s);
 // foreshortened arm, layered shadows create a sculpted CG-like read
 let arm=x.createLinearGradient(-230,-20,70,30);arm.addColorStop(0,'#573b3b');arm.addColorStop(.22,'#b17c70');arm.addColorStop(.55,'#e0ad94');arm.addColorStop(.82,'#b77b6d');arm.addColorStop(1,'#68403e');
 x.shadowColor='#000c';x.shadowBlur=36;x.fillStyle=arm;x.beginPath();x.moveTo(-250,-38);x.quadraticCurveTo(-170,-64,-90,-45);x.lineTo(-46,48);x.quadraticCurveTo(-150,76,-250,39);x.closePath();x.fill();
 let palm=x.createRadialGradient(-8,-30,4,0,0,130);palm.addColorStop(0,'#f0c2a8');palm.addColorStop(.48,'#d69b83');palm.addColorStop(.82,'#a86c61');palm.addColorStop(1,'#70443f');x.fillStyle=palm;x.beginPath();x.moveTo(-80,-40);x.quadraticCurveTo(-95,-76,-68,-94);x.quadraticCurveTo(-45,-108,-28,-82);x.lineTo(-19,-61);x.lineTo(-13,-142);x.quadraticCurveTo(-10,-165,11,-163);x.quadraticCurveTo(33,-160,31,-136);x.lineTo(27,-63);x.lineTo(48,-151);x.quadraticCurveTo(54,-171,73,-160);x.quadraticCurveTo(91,-150,82,-128);x.lineTo(60,-54);x.lineTo(96,-121);x.quadraticCurveTo(108,-138,124,-124);x.quadraticCurveTo(140,-110,125,-88);x.lineTo(83,-12);x.quadraticCurveTo(112,33,72,76);x.quadraticCurveTo(16,119,-43,77);x.quadraticCurveTo(-94,41,-80,-40);x.fill();
 // subtle tendons and palm folds
 x.strokeStyle='#75494288';x.lineWidth=3;x.beginPath();x.moveTo(-52,-10);x.quadraticCurveTo(-5,12,47,-8);x.moveTo(-43,29);x.quadraticCurveTo(0,54,47,30);x.stroke();
 x.strokeStyle='#ffddc288';x.lineWidth=4;x.beginPath();x.moveTo(-2,-135);x.quadraticCurveTo(0,-105,-1,-75);x.moveTo(59,-135);x.quadraticCurveTo(55,-100,49,-70);x.stroke();
 // soft specular highlights, not comic outlines
 let hi=x.createRadialGradient(-24,-54,0,-24,-54,68);hi.addColorStop(0,'#fff1dc55');hi.addColorStop(1,'#fff1dc00');x.fillStyle=hi;x.beginPath();x.ellipse(-24,-54,40,70,-.3,0,7);x.fill();x.restore()}
function draw(){let now=performance.now(),dt=phase==='idle'?0:(now-began)/1000,handP=0;
 if(phase==='windup')handP=0;if(phase==='swing')handP=clamp(dt/.34,0,1);if(phase==='impact'){handP=1;flash.style.opacity=String(Math.max(0,.8-dt*2.8));impact.style.opacity=dt<.38?String(1-dt*.6):'0';impact.style.transform='scale('+(1+dt*.6)+') rotate(-7deg)'}if(phase==='recoil')handP=1-clamp(dt/.3,0,1);
 if(phase!=='idle'&&((phase==='windup'&&dt>.42)||(phase==='swing'&&dt>.34)||(phase==='impact'&&dt>.45)||(phase==='recoil'&&dt>.3))){if(phase==='windup'){phase='swing';began=now}else if(phase==='swing'){phase='impact';began=now;shake=1;hitSound()}else if(phase==='impact'){phase='recoil';began=now}else{phase='idle';status.textContent='READY';play.disabled=false;flash.style.opacity='0'}}
 x.save();if(shake>.02)x.translate(R(-10,10)*shake,R(-8,8)*shake);shake*=.8;bg();bust();if(phase!=='idle')hand(handP);x.restore();requestAnimationFrame(draw)}
function ctx(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function hitSound(){try{let a=ctx(),n=a.currentTime,N=Math.floor(a.sampleRate*.2),b=a.createBuffer(1,N,a.sampleRate),v=b.getChannelData(0);for(let i=0;i<N;i++)v[i]=(Math.random()*2-1)*Math.pow(1-i/N,3);let s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=1250;g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(.9,n+.006);g.gain.exponentialRampToValueAtTime(.001,n+.19);s.connect(f).connect(g).connect(a.destination);s.start(n);let o=a.createOscillator(),og=a.createGain();o.type='sine';o.frequency.setValueAtTime(96,n);o.frequency.exponentialRampToValueAtTime(38,n+.16);og.gain.setValueAtTime(.001,n);og.gain.exponentialRampToValueAtTime(.42,n+.008);og.gain.exponentialRampToValueAtTime(.001,n+.17);o.connect(og).connect(a.destination);o.start(n);o.stop(n+.18)}catch(e){status.textContent='AUDIO UNAVAILABLE'}}
function run(){if(phase!=='idle')return;ctx();phase='windup';began=performance.now();status.textContent='WINDING UP';play.disabled=true;flash.style.opacity='0';impact.style.opacity='0'}
play.onclick=run;document.getElementById('test').onclick=()=>{hitSound();status.textContent='IMPACT SOUND'};addEventListener('resize',size);size();draw();
})();
</script></body></html>
