<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d"><title>BITCH SLAP — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#f8f4f1;font-family:Arial,Helvetica,sans-serif}
#scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#5c4140 0,#29242a 27%,#111217 66%,#050609 100%)}
#scene:before{content:"";position:absolute;inset:-10%;background:linear-gradient(112deg,transparent 30%,#f5c7a41a 42%,transparent 54%),radial-gradient(ellipse at 50% 80%,#0000 10%,#000b 76%);filter:blur(8px)}
#scene:after{content:"";position:absolute;inset:0;opacity:.17;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");mix-blend-mode:soft-light;pointer-events:none}
.light{position:absolute;width:48vw;height:100vh;top:-25vh;left:28%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,#f5d3b015,transparent);filter:blur(24px)}
.performer{position:absolute;width:min(62vw,520px);height:min(80vh,690px);left:50%;top:49%;transform:translate(-50%,-50%);filter:drop-shadow(0 25px 45px #000b)}
.torso{position:absolute;bottom:-9%;left:12%;width:76%;height:52%;border-radius:48% 48% 12% 12%;background:radial-gradient(ellipse at 50% 5%,#79605e 0,#403339 36%,#19171d 75%);box-shadow:inset 0 18px 35px #d4a18b24}
.neck{position:absolute;top:43%;left:42%;width:17%;height:20%;background:linear-gradient(90deg,#503a3b,#bd8b7b 48%,#4b3538);border-radius:20%}
.head{position:absolute;top:8%;left:32%;width:38%;height:47%;border-radius:48% 48% 44% 44%;background:radial-gradient(ellipse at 35% 34%,#e1b7a2 0,#b78678 32%,#755457 69%,#35272e 100%);box-shadow:inset -18px -6px 25px #100d14a8,inset 8px 5px 14px #f7d4b133}
.hair{position:absolute;top:5%;left:29%;width:44%;height:24%;border-radius:65% 55% 20% 15%;background:linear-gradient(125deg,#08090d,#252027 45%,#08090d 78%);transform:rotate(-3deg)}
.profile{position:absolute;top:27%;left:62%;width:12%;height:18%;border-right:4px solid #35252b;border-radius:0 60% 55% 0;transform:rotate(8deg);opacity:.8}
.ear{position:absolute;top:39%;left:65%;width:9%;height:12%;border:2px solid #9b7069;border-radius:50%;background:#855f5b}
.arm{position:absolute;z-index:4;width:min(68vw,560px);height:min(21vh,175px);left:-80%;top:42%;transform:rotate(-8deg);transform-origin:90% 50%;border-radius:100px;background:linear-gradient(180deg,#d5a08d 0%,#b77f72 23%,#8a5c59 76%,#4a3438 100%);box-shadow:inset 0 10px 18px #ffe0c344,inset 0 -15px 20px #25191d88,0 22px 40px #0009;transition:none}
.palm{position:absolute;right:-9%;top:-31%;width:31%;height:162%;border-radius:48% 46% 43% 52%;transform:rotate(8deg);background:radial-gradient(ellipse at 38% 28%,#e8b9a2,#bd8779 48%,#765052 100%);box-shadow:inset -12px -9px 18px #4d303b77,0 8px 18px #0008}
.finger{position:absolute;right:-12%;width:16%;height:64%;border-radius:30px;background:linear-gradient(90deg,#8c5e5c,#d9a18c 40%,#b47d72);box-shadow:inset -5px 0 7px #583a4088}
.f1{top:-22%;transform:rotate(-10deg)}.f2{top:-30%;right:2%;height:70%;transform:rotate(-3deg)}.f3{top:-25%;right:17%;height:66%;transform:rotate(5deg)}.f4{top:3%;right:31%;height:48%;transform:rotate(17deg)}
#impact{position:absolute;inset:0;z-index:8;opacity:0;pointer-events:none;background:radial-gradient(circle at 54% 43%,#fff8 0,#fff2 13%,transparent 48%);mix-blend-mode:screen}
#ring{position:absolute;z-index:7;left:53%;top:42%;width:10px;height:10px;border:2px solid #f8e6d7;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}
#caption{position:absolute;z-index:9;left:50%;top:48%;transform:translate(-50%,-50%) scale(.7) rotate(-9deg);font-size:clamp(52px,14vw,150px);font-weight:1000;letter-spacing:-.09em;color:#fff;text-shadow:0 5px 0 #65313a,0 15px 40px #000;opacity:0;white-space:nowrap}
header,footer{position:fixed;z-index:12;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;font-size:10px;font-weight:800;letter-spacing:.2em;color:#e9dfdc}
header{top:0}footer{bottom:0;justify-content:center;color:#b8a9a8;font-size:9px}
.pill{padding:8px 12px;border:1px solid #ffffff38;border-radius:30px;background:#08090d88}
.controls{position:fixed;z-index:13;left:50%;bottom:10%;transform:translateX(-50%);width:min(92%,520px);text-align:center}
.kicker{font-size:10px;letter-spacing:.35em;color:#e5b9a7;font-weight:800}
h1{margin:8px 0;font-size:clamp(38px,9vw,76px);letter-spacing:.015em;line-height:.9}
.desc{font-size:10px;letter-spacing:.18em;color:#d6c9c5;font-weight:700}
.actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
button{border:1px solid #f1c8b8;border-radius:30px;padding:14px 22px;background:linear-gradient(145deg,#c17a68,#733d43);color:white;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 32px #0008;cursor:pointer}
button.secondary{background:#111219dd;border-color:#ffffff55}button:disabled{opacity:.55}
.small{margin-top:9px;font-size:9px;letter-spacing:.08em;color:#c1b2b0}
#scene.hit .performer{animation:flinch .46s cubic-bezier(.12,.8,.2,1)}#scene.hit .arm{animation:swipe .75s cubic-bezier(.18,.7,.16,1) forwards}
@keyframes swipe{0%{left:-80%;transform:rotate(-8deg)}48%{left:25%;transform:rotate(-2deg)}62%{left:29%;transform:rotate(1deg)}100%{left:-80%;transform:rotate(-8deg)}}
@keyframes flinch{0%,43%{transform:translate(-50%,-50%)}55%{transform:translate(-45%,-51%) rotate(5deg)}72%{transform:translate(-53%,-49%) rotate(-3deg)}100%{transform:translate(-50%,-50%)}}
@media(max-width:600px){.performer{width:88vw;height:70vh;top:42%}.controls{bottom:9%}.light{width:80vw;left:10%}header{padding:14px;font-size:8px}footer{font-size:8px}}
@media(prefers-reduced-motion:reduce){#scene.hit .performer,#scene.hit .arm{animation-duration:.01ms}}
</style>
</head>
<body>
<div id="scene"><div class="light"></div><div class="performer"><div class="torso"></div><div class="neck"></div><div class="head"></div><div class="hair"></div><div class="profile"></div><div class="ear"></div><div class="arm"><div class="palm"><i class="finger f1"></i><i class="finger f2"></i><i class="finger f3"></i><i class="finger f4"></i></div></div></div><div id="impact"></div><div id="ring"></div><div id="caption">SMACK.</div></div>
<header><span>TIKNATION / GIFT PREVIEW</span><span class="pill" id="status">STANDING BY</span></header>
<section class="controls"><div class="kicker">ONE MOMENT. TOTAL SILENCE.</div><h1>BITCH SLAP</h1><div class="desc">A STAGED CINEMATIC IMPACT SEQUENCE</div><div class="actions"><button id="play">Trigger the scene</button><button class="secondary" id="sound">Test impact audio</button></div><div class="small">Tap to enable sound · No autoplay · Preview only</div></section>
<footer>NEW DESIGN · NOT IN THE LIVE GIFT CATALOG</footer>
<script>
(()=>{const scene=document.getElementById('scene'),status=document.getElementById('status'),play=document.getElementById('play'),impact=document.getElementById('impact'),ring=document.getElementById('ring'),caption=document.getElementById('caption');let audio;
function audioContext(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function hitSound(){try{const a=audioContext(),t=a.currentTime,n=Math.floor(a.sampleRate*.24),buf=a.createBuffer(1,n,a.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.7);const src=a.createBufferSource(),filter=a.createBiquadFilter(),gain=a.createGain();src.buffer=buf;filter.type='lowpass';filter.frequency.setValueAtTime(1450,t);filter.frequency.exponentialRampToValueAtTime(240,t+.2);gain.gain.setValueAtTime(.001,t);gain.gain.exponentialRampToValueAtTime(.82,t+.008);gain.gain.exponentialRampToValueAtTime(.001,t+.22);src.connect(filter).connect(gain).connect(a.destination);src.start(t);const thump=a.createOscillator(),tg=a.createGain();thump.type='sine';thump.frequency.setValueAtTime(105,t);thump.frequency.exponentialRampToValueAtTime(42,t+.18);tg.gain.setValueAtTime(.001,t);tg.gain.exponentialRampToValueAtTime(.55,t+.006);tg.gain.exponentialRampToValueAtTime(.001,t+.2);thump.connect(tg).connect(a.destination);thump.start(t);thump.stop(t+.21)}catch(e){status.textContent='AUDIO UNAVAILABLE'}}
function trigger(){if(play.disabled)return;audioContext();play.disabled=true;status.textContent='ACTION';scene.classList.remove('hit');void scene.offsetWidth;scene.classList.add('hit');setTimeout(()=>{hitSound();impact.style.transition='opacity .04s';impact.style.opacity='.9';ring.style.transition='none';ring.style.opacity='1';ring.style.width='10px';ring.style.height='10px';caption.style.transition='none';caption.style.opacity='1';caption.style.transform='translate(-50%,-50%) scale(1.05) rotate(-9deg)';requestAnimationFrame(()=>{ring.style.transition='all .5s ease-out';ring.style.width='70vw';ring.style.height='70vw';ring.style.opacity='0';impact.style.transition='opacity .5s';impact.style.opacity='0';caption.style.transition='all .48s ease-out';caption.style.opacity='0';caption.style.transform='translate(-50%,-50%) scale(1.35) rotate(-9deg)'})},430);setTimeout(()=>{scene.classList.remove('hit');status.textContent='READY';play.disabled=false},1350)}
play.addEventListener('click',trigger);document.getElementById('sound').addEventListener('click',()=>{hitSound();status.textContent='IMPACT AUDIO'});})();
</script>
</body></html>
