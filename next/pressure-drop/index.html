<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pressure Drop — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02090d;color:#e7f0ec;font-family:Arial,sans-serif}
.scene{position:relative;height:100%;min-height:480px;overflow:hidden;isolation:isolate;background:linear-gradient(#071923 0%,#0a2630 35%,#03131b 72%,#010609 100%)}
.water{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#6ca2a522,transparent 42%),linear-gradient(180deg,transparent 30%,#001018aa 100%)}
.caustics{position:absolute;inset:-30%;opacity:.22;filter:blur(10px);background:repeating-conic-gradient(from 10deg at 50% 30%,transparent 0deg 8deg,#8dc6c633 9deg 10deg,transparent 13deg 22deg);animation:caustic 16s ease-in-out infinite alternate}
@keyframes caustic{to{transform:translate(-4%,5%) rotate(8deg) scale(1.15)}}
.surface{position:absolute;top:-12%;left:-10%;width:120%;height:32%;background:radial-gradient(ellipse,#9bc6c533,transparent 65%);filter:blur(22px)}
.rays{position:absolute;top:0;left:15%;width:70%;height:78%;background:linear-gradient(110deg,transparent 0 20%,#b2dce014 25%,transparent 35% 55%,#b2dce012 61%,transparent 72%);filter:blur(14px)}
.debris{position:absolute;inset:0;opacity:.5;background-image:radial-gradient(circle,#c8e2dd 1px,transparent 2px),radial-gradient(circle,#c8e2dd 1px,transparent 2px);background-size:73px 91px,113px 137px;background-position:0 0,34px 42px;animation:drift 18s linear infinite}
@keyframes drift{to{background-position:0 260px,34px 390px}}
.sub{position:absolute;z-index:3;left:50%;bottom:22%;width:min(42vw,330px);height:100px;transform:translateX(-50%);filter:drop-shadow(0 16px 14px #000b)}
.hull{position:absolute;inset:18px 0 0;border-radius:48% 48% 35% 35%;background:linear-gradient(180deg,#75878a 0%,#263b42 35%,#0c1b21 75%,#030b0f 100%);border:2px solid #91a5a2;box-shadow:inset 0 8px 15px #d6e0d322,inset 0 -15px 20px #000b}
.hull:before{content:"";position:absolute;top:10px;left:35%;width:30%;height:23px;border-radius:50% 50% 15% 15%;background:linear-gradient(#c1d0c9,#34464a 55%,#101c20);border:2px solid #8d9b94}
.lamp{position:absolute;top:41px;width:17px;height:17px;border-radius:50%;background:#f6dca1;box-shadow:0 0 14px 8px #e6c17a77,0 0 55px 23px #e6c17a22}
.lamp.left{left:12%}.lamp.right{right:12%}
.fin{position:absolute;top:0;left:45%;width:10%;height:28px;background:linear-gradient(90deg,#17272b,#6b7d7e,#17272b);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
.creature{position:absolute;z-index:2;left:50%;top:23%;width:min(85vw,760px);height:45%;transform:translateX(-50%) scale(.68);opacity:0;transition:all 4s ease}
.creature.reveal{opacity:.9;transform:translateX(-50%) scale(1)}
.creature svg{width:100%;height:100%;filter:drop-shadow(0 0 30px #000)}
.eye{fill:#f0bb71;filter:drop-shadow(0 0 12px #ffbd70)}
.ripple{position:absolute;z-index:1;left:50%;top:46%;width:40px;height:40px;border:1px solid #a9d5d055;border-radius:50%;transform:translate(-50%,-50%);opacity:0}
.ripple.ping{animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{width:30px;height:30px;opacity:.7}100%{width:75vw;height:75vw;opacity:0}}
.title{position:absolute;z-index:8;top:5%;width:100%;text-align:center;padding:0 12px;font-size:clamp(24px,5vw,46px);font-weight:300;letter-spacing:.32em;text-transform:uppercase;text-shadow:0 2px 18px #000}
.subtitle{display:block;margin-top:10px;font-size:10px;letter-spacing:.34em;color:#b3c9c7}
.readout{position:absolute;z-index:8;bottom:14%;width:100%;text-align:center;color:#b6d0ca;font:11px monospace;letter-spacing:.25em;text-shadow:0 2px 9px #000}
.alarm{position:absolute;inset:0;z-index:7;pointer-events:none;background:#a21d12;opacity:0}
.alarm.on{animation:alarm .45s steps(2) 5}
@keyframes alarm{50%{opacity:.18}}
.controls{position:absolute;z-index:10;bottom:4%;left:0;width:100%;display:flex;justify-content:center;gap:10px;padding:0 12px}
button{border:1px solid #9ab4ad;background:#07171ddd;color:#e7f0ec;padding:14px 20px;letter-spacing:.15em;text-transform:uppercase;font-size:11px;cursor:pointer}
button:disabled{opacity:.5}
.vignette{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse,transparent 32%,#0009 100%)}
@media(max-height:560px){.title{top:2%}.sub{bottom:17%}.readout{bottom:11%}.controls{bottom:2%}}
</style></head>
<body><main class="scene">
<div class="water"></div><div class="caustics"></div><div class="surface"></div><div class="rays"></div><div class="debris"></div>
<div class="creature" id="creature"><svg viewBox="0 0 800 360" aria-hidden="true">
<defs><radialGradient id="skin"><stop stop-color="#52656a"/><stop offset=".5" stop-color="#17282e"/><stop offset="1" stop-color="#030b10"/></radialGradient></defs>
<path d="M65 188 C110 70 270 34 410 85 C535 38 690 92 750 182 C686 249 548 296 420 258 C270 322 119 275 65 188Z" fill="url(#skin)" stroke="#34484d" stroke-width="7"/>
<path d="M155 139 Q320 12 450 110 Q560 25 665 145 Q557 113 470 166 Q318 108 155 139Z" fill="#0a171d" stroke="#43565a" stroke-width="4"/>
<path d="M120 207 Q270 326 415 236 Q570 320 704 205 Q570 267 435 218 Q275 295 120 207Z" fill="#02080c"/>
<path d="M265 105 Q235 24 295 12 M490 105 Q525 12 574 26" fill="none" stroke="#263a40" stroke-width="17" stroke-linecap="round"/>
<ellipse cx="330" cy="158" rx="20" ry="12" class="eye"/><ellipse cx="510" cy="158" rx="20" ry="12" class="eye"/>
<path d="M350 218 Q420 238 490 215" fill="none" stroke="#607378" stroke-width="5" opacity=".5"/>
<path d="M95 178 L25 130 M100 210 L25 255 M705 178 L780 125 M700 210 L778 264" stroke="#1c3036" stroke-width="16" stroke-linecap="round"/>
</svg></div>
<div class="sub"><div class="fin"></div><div class="hull"></div><div class="lamp left"></div><div class="lamp right"></div></div>
<div class="ripple" id="ripple"></div><div class="alarm" id="alarm"></div><div class="vignette"></div>
<h1 class="title">Pressure Drop<span class="subtitle">Deep-sea contact · TikNation gift preview</span></h1>
<div class="readout" id="readout">DEPTH 4,800 M · SONAR STANDBY</div>
<div class="controls"><button id="start">Send sonar pulse</button><button id="replay">Replay</button></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let ctx=null,master=null,busy=false,timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function ping(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(180,t+1.6);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.12,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+1.7);o.connect(g);g.connect(master);o.start(t);o.stop(t+1.8)}
function rumble(t,d){const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(36,t);o.frequency.linearRampToValueAtTime(23,t+d);f.type='lowpass';f.frequency.value=90;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16,t+1);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1)}
async function begin(){if(busy)return;busy=true;$('start').disabled=true;$('readout').textContent='PING TRANSMITTED · WAITING FOR RETURN';try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();master=ctx.createGain();master.gain.value=.8;master.connect(ctx.destination);const t=ctx.currentTime;ping(t);ping(t+2.8);rumble(t+5,9)}catch(e){$('readout').textContent='VISUAL SEQUENCE · AUDIO UNAVAILABLE'}
$('ripple').classList.add('ping');later(()=>{$('readout').textContent='RETURN SIGNAL · TOO LARGE TO IDENTIFY';ping(ctx.currentTime)},3200);later(()=>{$('creature').classList.add('reveal');$('readout').textContent='CONTACT CONFIRMED · IT IS LOOKING UP';$('alarm').classList.add('on')},5700);later(()=>{$('alarm').classList.remove('on');$('readout').textContent='HULL PRESSURE CRITICAL · ASCENDING'},9800);later(()=>{$('readout').textContent='SIGNAL LOST BELOW 4,800 METERS';$('start').disabled=false;$('start').textContent='Send another pulse';busy=false},13200)}
function reset(){timers.forEach(clearTimeout);timers=[];$('creature').classList.remove('reveal');$('ripple').classList.remove('ping');$('alarm').classList.remove('on');$('readout').textContent='DEPTH 4,800 M · SONAR STANDBY';if(master&&ctx)master.gain.setTargetAtTime(.0001,ctx.currentTime,.05);busy=false;$('start').disabled=false;$('start').textContent='Send sonar pulse'}
$('start').addEventListener('click',begin);$('replay').addEventListener('click',()=>{reset();begin()})
})();
</script></body></html>
