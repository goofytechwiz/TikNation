<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050611">
<title>TikNation Gift · The Celestial Forge</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040b;font-family:Arial,sans-serif}body{touch-action:manipulation}.stage{position:relative;width:100%;height:100%;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#252047 0,#0b0d20 38%,#03040b 78%)}canvas{display:block;width:100%;height:100%}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.25) 72%,rgba(0,0,0,.8) 120%)}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 18px #000}.brand{font-size:10px;letter-spacing:.42em;color:#b7c9ff;opacity:.8}.name{margin-top:7px;font-size:clamp(20px,4vw,34px);font-weight:800;letter-spacing:.17em;color:#fff1d0}.name span{color:#ffbd65}.sound{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #ffc97888;border-radius:30px;background:#111321cc;color:#ffe2b0;padding:11px 19px;font-size:10px;letter-spacing:.18em;backdrop-filter:blur(12px)}.sound:active{transform:translateX(-50%) scale(.97)}.hint{position:absolute;bottom:max(70px,calc(env(safe-area-inset-bottom) + 55px));left:0;right:0;text-align:center;color:#c9c6dc88;font-size:9px;letter-spacing:.22em;pointer-events:none}.flash{position:absolute;inset:0;background:#fff5d8;opacity:0;pointer-events:none}.sound[hidden]{display:none}
</style>
</head>
<body>
<div class="stage"><canvas id="scene"></canvas><div class="vignette"></div><div class="top"><div class="brand">TIKNATION · LEGENDARY GIFT</div><div class="name">THE <span>CELESTIAL</span> FORGE</div></div><div class="hint">A NEW STAR IS BEING BORN</div><button class="sound" id="sound">ENABLE SOUND</button><div class="flash" id="flash"></div></div>
<script>
(()=>{
const c=document.getElementById('scene'),ctx=c.getContext('2d'),soundBtn=document.getElementById('sound'),flash=document.getElementById('flash');
let w=0,h=0,dpr=1,t0=performance.now(),soundOn=false,audio=null,lastBoom=-10;
const rand=(a,b)=>a+Math.random()*(b-a);
let stars=[],dust=[],sparks=[];
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.floor(w*h/6500)},()=>({x:Math.random()*w,y:Math.random()*h,r:rand(.3,1.5),p:rand(0,6.28)}));dust=Array.from({length:150},()=>({a:rand(0,6.28),r:rand(100,Math.min(w,h)*.65),s:rand(.2,1.1),p:rand(0,6.28)}))}
addEventListener('resize',resize);resize();
function glow(x,y,r,color,alpha=1){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1}
function ellipseRing(cx,cy,rx,ry,rot,color,width,alpha,phase){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.globalAlpha=alpha;ctx.shadowBlur=18;ctx.shadowColor=color;ctx.stroke();ctx.shadowBlur=0;for(let i=0;i<3;i++){let a=phase+i*2.094;let x=Math.cos(a)*rx,y=Math.sin(a)*ry;glow(x,y,13,color,.65);ctx.beginPath();ctx.arc(x,y,3+i*.6,0,Math.PI*2);ctx.fillStyle='#fff1c6';ctx.fill()}ctx.restore();ctx.globalAlpha=1}
function pathGlow(points,color,width,blur){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowBlur=blur;ctx.shadowColor=color;ctx.stroke();ctx.shadowBlur=0}
function drawForge(cx,cy,R,time){
 // giant dark orbital armature and industrial supports
 ctx.save();ctx.translate(cx,cy);
 for(let i=0;i<8;i++){let a=i*Math.PI/4+time*.035;let x=Math.cos(a),y=Math.sin(a);ctx.save();ctx.rotate(a);let grad=ctx.createLinearGradient(0,-R*.08,0,R*.08);grad.addColorStop(0,'#222b47');grad.addColorStop(.45,'#9b8b7b');grad.addColorStop(.6,'#31354c');grad.addColorStop(1,'#090d1c');ctx.fillStyle=grad;ctx.shadowBlur=20;ctx.shadowColor='#e98d43';ctx.fillRect(-R*.045,-R*.78,R*.09,R*1.56);ctx.shadowBlur=0;ctx.strokeStyle='#ffbd70';ctx.globalAlpha=.35;ctx.lineWidth=2;ctx.strokeRect(-R*.045,-R*.78,R*.09,R*1.56);ctx.restore()}
 for(let i=0;i<3;i++){let a=time*(i%2?-.13:.1)+i*2.1;ctx.save();ctx.rotate(a);ctx.strokeStyle=['#c28d5c','#6d8aa8','#d6a56c'][i];ctx.lineWidth=R*(.035-i*.005);ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(0,0,R*(.78-i*.12),-.7,2.45);ctx.stroke();ctx.strokeStyle='#fff0c2';ctx.lineWidth=1;ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(0,0,R*(.78-i*.12),2.6,5.5);ctx.stroke();ctx.restore()}
 // outer machine nodes
 for(let i=0;i<24;i++){let a=i*Math.PI/12+time*.08;let rr=R*.94;let x=Math.cos(a)*rr,y=Math.sin(a)*rr;ctx.fillStyle=i%3?'#5d718b':'#f6b66b';ctx.beginPath();ctx.arc(x,y,R*.014,0,Math.PI*2);ctx.fill();glow(x,y,R*.045,i%3?'#6f9dff':'#ff9b43',.38)}
 ctx.restore();
}
function drawCore(cx,cy,R,time,charge){
 const pulse=1+Math.sin(time*2.4)*.025;let r=R*.43*pulse;
 glow(cx,cy,r*2.8,'#ff6c25',.35+charge*.2);glow(cx,cy,r*1.8,'#ffb53d',.55);glow(cx,cy,r*1.2,'#fff0a4',.55);
 let g=ctx.createRadialGradient(cx-r*.2,cy-r*.25,r*.04,cx,cy,r);g.addColorStop(0,'#fffde0');g.addColorStop(.18,'#fff0a0');g.addColorStop(.42,'#ffc14e');g.addColorStop(.7,'#f16b27');g.addColorStop(1,'#6e1b2d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
 // turbulent solar surface
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,r*.98,0,Math.PI*2);ctx.clip();
 for(let i=0;i<34;i++){let a=i*2.399+time*.22,rr=r*randDummy(i);let x=cx+Math.cos(a+Math.sin(time+i)*.1)*rr,y=cy+Math.sin(a)*rr;ctx.beginPath();ctx.ellipse(x,y,r*.12,r*.035,a,0,Math.PI*2);ctx.fillStyle=i%2?'#fff0a0':'#ff8b36';ctx.globalAlpha=.18+charge*.25;ctx.fill()}ctx.globalAlpha=1;ctx.restore();
 // corona flares
 for(let i=0;i<13;i++){let a=i*Math.PI*2/13+time*.17;let len=r*(.18+.12*Math.sin(time*2+i));let x=cx+Math.cos(a)*r*.9,y=cy+Math.sin(a)*r*.9;pathGlow([[x,y],[cx+Math.cos(a)* (r+len),cy+Math.sin(a)*(r+len)]],i%2?'#ffd47a':'#fff1c1',2,12)}
}
function randDummy(i){return .18+((Math.sin(i*91.7)*.5+.5)*.7)}
function render(now){let time=(now-t0)/1000,cycle=time%18,charge=Math.min(1,Math.max(0,(cycle-4)/6)),burst=Math.max(0,1-Math.abs(cycle-12)/1.5);ctx.clearRect(0,0,w,h);
 let cx=w*.5,cy=h*.51,R=Math.min(w*.29,h*.31,210);R=Math.max(85,R);
 let bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.75);bg.addColorStop(0,'#252039');bg.addColorStop(.45,'#101426');bg.addColorStop(1,'#03040b');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 stars.forEach(s=>{ctx.globalAlpha=.25+.55*(.5+.5*Math.sin(time*1.4+s.p));ctx.fillStyle='#d8e4ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
 // cosmic dust spirals
 dust.forEach(p=>{let a=p.a+time*p.s*.12;let rr=p.r+Math.sin(time+p.p)*9;let x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.62;ctx.fillStyle='#b7caff';ctx.globalAlpha=.15+.22*Math.sin(time+p.p)**2;ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
 // energy streams feed the core
 for(let i=0;i<6;i++){let a=i*Math.PI/3+time*.19;let pts=[];for(let j=0;j<48;j++){let q=j/47,rr=R*(2.8-q*2.05),ang=a+q*2.5+time*.16;pts.push([cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr*.7])}pathGlow(pts,i%2?'#5b9bff':'#ff9c48',2.5,16);let q=(time*.18+i/6)%1,rr=R*(2.8-q*2.05),ang=a+q*2.5+time*.16;glow(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr*.7,10,'#fff0b2',.8)}
 drawForge(cx,cy,R,time);
 ellipseRing(cx,cy,R*1.25,R*.62,-.32,'#8ca9e8',2,.48,time*.8);
 ellipseRing(cx,cy,R*1.12,R*.54,.48,'#ffb66c',3,.58,-time*.65);
 drawCore(cx,cy,R,time,charge);
 // sparks and fragments
 if(Math.random()<.7){let a=rand(0,6.28),rr=R*rand(.48,1.25);sparks.push({x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr,vx:Math.cos(a)*rand(1,4),vy:Math.sin(a)*rand(1,4),life:rand(20,55)})}
 sparks=sparks.filter(p=>p.life-->0);sparks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.015;ctx.globalAlpha=Math.min(1,p.life/20);ctx.fillStyle='#ffd18a';ctx.fillRect(p.x,p.y,2,2)});ctx.globalAlpha=1;
 // star ignition and expanding shockwave
 if(burst>0){let br=R*(.5+(1-burst)*4.8);ctx.beginPath();ctx.arc(cx,cy,br,0,Math.PI*2);ctx.strokeStyle='#fff0c2';ctx.lineWidth=5*burst;ctx.globalAlpha=burst*.8;ctx.shadowBlur=35;ctx.shadowColor='#ffb34c';ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1;glow(cx,cy,R*3*burst,'#ffb84d',burst*.45);if(burst>.92&&time-lastBoom>3){lastBoom=time}}
 // star points flare after ignition
 if(cycle>11.8&&cycle<15.8){let k=Math.max(0,1-Math.abs(cycle-13.2)/2.6);for(let i=0;i<12;i++){let a=i*Math.PI/6+time*.02,len=R*(1.5+Math.sin(time*3+i)*.2)*k;pathGlow([[cx-Math.cos(a)*len,cy-Math.sin(a)*len],[cx+Math.cos(a)*len,cy+Math.sin(a)*len]],'#ffe5a0',1.5,16)}}
 requestAnimationFrame(render)}
requestAnimationFrame(render);
function tone(freq,dur,type='sine',gain=.04,delay=0){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime+delay);g.gain.setValueAtTime(.0001,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,audio.currentTime+delay+.04);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+delay+dur);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+dur+.05)}
function ambience(){if(!audio||!soundOn)return;tone(55,2.8,'sawtooth',.012);tone(110,2.2,'sine',.018,.1);tone(220,1.8,'triangle',.009,.2);setTimeout(ambience,2400)}
soundBtn.addEventListener('click',()=>{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)()}audio.resume();soundOn=!soundOn;soundBtn.textContent=soundOn?'SOUND ON · TAP TO MUTE':'ENABLE SOUND';if(soundOn){ambience();tone(392,.7,'sine',.05);tone(587,.9,'sine',.035,.18);tone(784,1.1,'triangle',.025,.38)}else{audio.suspend()}});
})();
</script>
</body>
</html>
