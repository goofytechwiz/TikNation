<script>
(()=>{const btn=document.getElementById('action'),hint=document.getElementById('hint'),sub=document.getElementById('sub');let ctx=null,active=false;
function tone(freq,delay,duration,volume,type='sine'){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.045);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+duration+.03)}
function play(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=ctx||new AC();ctx.resume();[261.6,329.6,392,523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.14,2,.045));tone(55,.5,1.8,.22);tone(110,.62,1.5,.1,'triangle');[1568,1318.5,1046.5,880,659.25,523.25].forEach((f,i)=>tone(f,1.7+i*.12,1.6,.03,'triangle'));tone(1760,1.3,1.1,.025);tone(46,2.25,1.7,.22);tone(92,2.3,1.3,.1,'triangle');}
btn.addEventListener('click',()=>{document.body.classList.remove('awake','prism-finale');void document.body.offsetWidth;document.body.classList.add('awake','prism-finale');play();launchBurst();setTimeout(()=>document.body.classList.remove('prism-finale'),5200);active=true;btn.textContent='UNLEASH ANOTHER WAVE';hint.textContent='RAINBOW CASCADE · BUTTERFLY FLIGHT · COLOR EXPLOSION';sub.textContent='A rainbow awakens. A thousand colors take flight.'});
})();

/* Draw real-looking water motion: irregular translucent sheets, broken rivulets,
   highlights, droplets and turbulent splash at the foot of each fall. */
(function(){
 const falls=[...document.querySelectorAll('.waterfall')];
 falls.forEach((host,fallIndex)=>{
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d');
  host.appendChild(cv);
  let w=0,h=0,dpr=1,raf=0,last=0;
  const drops=Array.from({length:115},(_,i)=>({x:Math.random(),y:Math.random(),v:.45+Math.random()*1.5,r:.45+Math.random()*1.6,a:.18+Math.random()*.7,drift:(Math.random()-.5)*.012}));
  const foam=Array.from({length:75},()=>({x:Math.random(),y:.84+Math.random()*.16,v:.25+Math.random()*1.2,r:.5+Math.random()*2}));
  function resize(){const b=host.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,1.7);w=Math.max(1,b.width);h=Math.max(1,b.height);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
  function ribbon(x,t,phase){return x+Math.sin(t*.009+phase)*w*.018+Math.sin(t*.021+phase*1.7)*w*.008}
  function draw(now){
   if(!w||!h)resize();const t=now*.001;ctx.clearRect(0,0,w,h);
   // Deep translucent body of the falling water.
   const body=ctx.createLinearGradient(0,0,w,0);body.addColorStop(0,'rgba(145,225,255,0)');body.addColorStop(.16,'rgba(155,235,255,.10)');body.addColorStop(.48,'rgba(218,250,255,.23)');body.addColorStop(.78,'rgba(120,215,255,.13)');body.addColorStop(1,'rgba(145,225,255,0)');
   ctx.fillStyle=body;ctx.fillRect(0,0,w,h);
   // Several irregular, overlapping sheets with soft edges and bright moving crests.
   for(let k=0;k<9;k++){
    const base=(k+.45)/9*w,phase=k*1.91+fallIndex*2.3;
    ctx.beginPath();
    for(let y=-8;y<=h+8;y+=8){const x=ribbon(base,y+t*115,phase);if(y===-8)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
    const width=w*(.035+(k%3)*.014);
    ctx.lineWidth=width;ctx.lineCap='round';
    const g=ctx.createLinearGradient(base-width,0,base+width,0);
    g.addColorStop(0,'rgba(110,215,255,0)');g.addColorStop(.32,'rgba(171,238,255,.18)');g.addColorStop(.5,'rgba(255,255,255,.62)');g.addColorStop(.68,'rgba(124,222,255,.22)');g.addColorStop(1,'rgba(110,215,255,0)');
    ctx.strokeStyle=g;ctx.stroke();
   }
   // Narrow rivulets: broken, changing paths that travel downward at varied speeds.
   for(let k=0;k<34;k++){
