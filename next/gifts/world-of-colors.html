<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08051c">
<title>TikNation · The World of Colors</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{position:relative;background:radial-gradient(ellipse at 50% 42%,#33206c 0%,#151037 43%,#050411 100%);color:#fff;font-family:Arial,Helvetica,sans-serif}
#sky{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#5b36a744,transparent 58%)}
.stars{position:absolute;inset:-15%;background-image:radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 28% 73%,#a9f7ff 50%,transparent 60%),radial-gradient(2px 2px at 81% 25%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 73% 81%,#ffc8f3 50%,transparent 60%),radial-gradient(2px 2px at 55% 12%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 92% 60%,#fff 50%,transparent 60%);background-size:300px 260px;animation:drift 28s linear infinite}
.aurora{position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,#21eaff30,#c43cff44,transparent,#ff4bc833,transparent);filter:blur(48px);animation:spin 22s linear infinite}
.rainbow{position:absolute;z-index:2;left:50%;top:8%;width:min(100vw,850px);height:min(68vw,560px);transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 100%,transparent 0 54%,#ff465b 54.5% 56%,#ffb13d 56.5% 58%,#fff36a 58.5% 60%,#57f59a 60.5% 62%,#45d9ff 62.5% 64%,#7e65ff 64.5% 66%,#dc6aff 66.5% 68%,transparent 68.5%);filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 25px #ff67dd);opacity:.85;pointer-events:none;animation:rainbowPulse 4s ease-in-out infinite}
.fall{position:absolute;z-index:3;top:8%;bottom:7%;width:clamp(65px,14vw,155px);overflow:hidden;pointer-events:none;filter:drop-shadow(0 0 17px #61dfff88)}
.fall.left{left:1%}.fall.right{right:1%;transform:scaleX(-1)}
.fall canvas{display:block;width:100%;height:100%}
.orbit{position:absolute;z-index:3;left:50%;top:43%;width:min(83vw,690px);aspect-ratio:1;border:2px solid #72faff99;border-radius:50%;transform:translate(-50%,-50%) rotateX(68deg);box-shadow:0 0 25px #54edff88,0 0 65px #d64aff55,inset 0 0 50px #a85bff55;animation:orbit 20s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;inset:9%;border:2px solid #ff75eaaa;border-radius:50%;box-shadow:0 0 18px #ff65df}
.orbit:after{inset:20%;border-color:#6affeeaa;transform:rotate(65deg)}
.gem-wrap{position:absolute;z-index:5;left:50%;top:42%;width:min(56vw,390px);height:min(67vw,465px);transform:translate(-50%,-50%);filter:drop-shadow(0 0 20px #fff) drop-shadow(0 0 42px #00eaff) drop-shadow(0 0 82px #bb28ff);animation:float 4.8s ease-in-out infinite}
.gem{position:absolute;inset:0;animation:gemTurn 11s ease-in-out infinite;transform-style:preserve-3d}
.gem-face{position:absolute;inset:0;clip-path:polygon(50% 0,94% 24%,84% 78%,50% 100%,16% 78%,6% 24%);background:conic-gradient(from 30deg at 50% 48%,#ff31cb,#ffb62e,#eaff45,#35ffd1,#19baff,#8a4dff,#ff31cb);box-shadow:inset 0 0 45px #fff;animation:hue 7s linear infinite}
.gem-face:before{content:"";position:absolute;inset:2%;clip-path:inherit;background:linear-gradient(130deg,#fff 0%,#ffffff12 16%,#ff43dbbb 28%,#42f7ffbb 43%,#faff72bb 58%,#814affcc 73%,#fff 100%);background-size:250% 250%;animation:facetFlow 4s ease-in-out infinite alternate}
.facet{position:absolute;inset:0;clip-path:polygon(50% 0,50% 100%,6% 24%);background:linear-gradient(145deg,#fff,#ff46d8 22%,#51efff 48%,#ffe66c 68%,#8e42ff);opacity:.75;mix-blend-mode:screen}
.facet.f2{clip-path:polygon(50% 0,94% 24%,50% 100%);background:linear-gradient(45deg,#ff26c9,#ffea66,#fff,#37eaff,#8d39ff)}
.facet.f3{clip-path:polygon(6% 24%,50% 100%,16% 78%);background:linear-gradient(135deg,#fff,#ff48c9,#a94aff)}
.facet.f4{clip-path:polygon(94% 24%,84% 78%,50% 100%);background:linear-gradient(135deg,#fff,#4affed,#347aff)}
.gem-core{position:absolute;left:34%;top:29%;width:32%;height:40%;border-radius:50%;background:radial-gradient(ellipse,#fff 0%,#fff 8%,#7affff 19%,#ff65e6 38%,#8b48ff99 60%,transparent 75%);filter:blur(3px);box-shadow:0 0 40px #fff}
.gem:after{content:"";position:absolute;inset:7% 10%;clip-path:polygon(50% 0,94% 24%,84% 78%,50% 100%,16% 78%,6% 24%);background:linear-gradient(115deg,transparent 20%,#fff 30%,transparent 37%,#fff9 52%,transparent 59%);background-size:230% 100%;mix-blend-mode:screen;animation:glint 2.8s ease-in-out infinite}
.shard{position:absolute;z-index:4;width:clamp(28px,6vw,62px);aspect-ratio:1;clip-path:polygon(50% 0,100% 35%,75% 100%,25% 100%,0 35%);background:conic-gradient(#fff,#45faff,#a348ff,#ff4fca,#ffe45c,#fff);filter:drop-shadow(0 0 18px #53efff);animation:shard 7s linear infinite}
.shard.a{left:9%;top:29%}.shard.b{right:9%;top:33%;animation-delay:-2s}.shard.c{left:18%;bottom:22%;animation-delay:-4s}
#burst{position:absolute;z-index:7;inset:0;width:100%;height:100%;pointer-events:none}
.laser{position:absolute;z-index:6;inset:0;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 43%,transparent 0 7deg,#fff 7.2deg 7.7deg,transparent 8deg 15deg);mask-image:radial-gradient(ellipse at center,transparent 0 8%,#000 15% 70%,transparent 82%);mix-blend-mode:screen}
.flash{position:absolute;z-index:8;inset:0;pointer-events:none;background:#fff;opacity:0}
body.awake .laser{animation:laser 2.6s ease-out}
body.awake .flash{animation:flash .7s ease-out}
body.awake .rainbow{opacity:1;filter:drop-shadow(0 0 22px #fff) drop-shadow(0 0 42px #ff67dd)}
body.awake .gem-wrap{filter:drop-shadow(0 0 30px #fff) drop-shadow(0 0 65px #ff4bdc)}
.ui{position:absolute;z-index:9;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 18px max(28px,env(safe-area-inset-bottom));text-align:center;pointer-events:none}
.hint{position:absolute;z-index:9;top:max(22px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:9px;letter-spacing:.2em;color:#e2d9ff;text-transform:uppercase;text-shadow:0 0 12px #b78aff}
.brand{font-size:9px;letter-spacing:.48em;color:#e6dfff;text-transform:uppercase;margin-bottom:12px}
.title{font-size:clamp(29px,7vw,58px);font-weight:900;letter-spacing:.09em;line-height:.98;background:linear-gradient(100deg,#fff,#ffb9ec,#ffe5a2,#a6ffe2,#a9caff,#dfb3ff,#fff);background-size:250% auto;color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 17px #b78aff);animation:titleGlow 6s linear infinite}
.sub{font-size:9px;letter-spacing:.2em;color:#e5dcff;margin-top:12px;text-transform:uppercase}
.action{pointer-events:auto;margin-top:19px;border:1px solid #f4e5ffcc;border-radius:99px;padding:15px 25px;background:linear-gradient(110deg,#8c3dffdd,#12cce9dd,#e64acadd);color:#fff;letter-spacing:.15em;font-size:10px;font-weight:900;box-shadow:0 0 35px #a47bff99,inset 0 0 18px #fff5}
.action:active{transform:scale(.96)}
@keyframes drift{to{transform:translateY(80px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rainbowPulse{50%{opacity:.58}}@keyframes orbit{to{transform:translate(-50%,-50%) rotateX(68deg) rotate(360deg)}}@keyframes float{50%{transform:translate(-50%,-53%) scale(1.04)}}@keyframes gemTurn{0%,100%{transform:rotateY(-9deg) rotateX(5deg)}50%{transform:rotateY(9deg) rotateX(-5deg)}}@keyframes hue{to{filter:hue-rotate(360deg) saturate(1.8)}}@keyframes facetFlow{to{background-position:100% 100%}}@keyframes glint{0%{background-position:-130% 0}100%{background-position:130% 0}}@keyframes shard{to{transform:rotateY(360deg) rotateX(360deg)}}@keyframes laser{0%,100%{opacity:0}12%,48%{opacity:.95}75%{opacity:.2}}@keyframes flash{0%{opacity:.9}100%{opacity:0}}@keyframes titleGlow{to{background-position:250% center}}
@media(max-width:520px){.fall.left{left:-2%}.fall.right{right:-2%}.fall{width:clamp(60px,16vw,105px)}.gem-wrap{width:58vw;height:70vw;top:41%}.orbit{width:91vw}.rainbow{top:15%;width:115vw;height:78vw}.ui{padding-bottom:max(27px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){.stars,.aurora,.rainbow,.orbit,.gem-wrap,.gem,.shard,.title{animation-duration:18s!important;animation-iteration-count:1!important}}

/* DIMENSION PORTAL + COLOR WAVES */
.portal{position:absolute;z-index:2;left:50%;top:36%;width:min(68vw,520px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(13,8,43,.96) 0 39%,rgba(29,14,76,.72) 47%,transparent 68%);box-shadow:0 0 25px #58eaff,0 0 65px #b43cff,0 0 125px #ff42c8;animation:portalPulse 3.5s ease-in-out infinite}
.portal:before{content:"";position:absolute;inset:0;border-radius:50%;padding:9px;background:conic-gradient(#fff,#ff43d5,#ffdc4c,#4affd7,#43bfff,#a04cff,#fff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(0 0 18px #8cfaff);animation:portalSpin 9s linear infinite}
.portal:after{content:"";position:absolute;inset:13%;border-radius:50%;border:2px solid #d6faffaa;box-shadow:inset 0 0 38px #7b4dff,0 0 34px #ff65dd;animation:portalInner 2.8s ease-in-out infinite alternate}
.orb{position:absolute;z-index:6;width:clamp(13px,2.2vw,25px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 10%,var(--orb) 35%,transparent 72%);box-shadow:0 0 18px 6px var(--orb),0 0 38px var(--orb);animation:orbFloat 5s ease-in-out infinite}
.orb.o1{--orb:#ff4bd8;left:17%;top:37%}.orb.o2{--orb:#49f5ff;right:16%;top:29%;animation-delay:-1.3s}.orb.o3{--orb:#ffe45c;left:25%;bottom:28%;animation-delay:-2.4s}.orb.o4{--orb:#8c65ff;right:23%;bottom:25%;animation-delay:-3.2s}.orb.o5{--orb:#56ffb8;left:50%;top:16%;animation-delay:-.8s}
.fall:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,#ff48d522 28%,#4af5ff55 54%,#ffe45c33 78%,transparent);mix-blend-mode:screen;animation:colorWave 3.2s ease-in-out infinite alternate}
.lightning{position:absolute;z-index:4;inset:0;pointer-events:none;opacity:0;background:linear-gradient(112deg,transparent 0 42%,#fff 42.2%,#b7faff 42.5%,transparent 43%),linear-gradient(68deg,transparent 0 61%,#fff 61.2%,#ffb7f2 61.5%,transparent 62%);filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 28px #58eaff);mix-blend-mode:screen}
body.awake .portal{filter:brightness(1.5);box-shadow:0 0 45px #fff,0 0 95px #58eaff,0 0 160px #ff42c8}
body.awake .lightning{animation:prismLightning 1.6s steps(1,end) 2}
@keyframes portalSpin{to{transform:rotate(360deg)}}@keyframes portalPulse{50%{opacity:.72;filter:brightness(1.35)}}@keyframes portalInner{to{transform:scale(.88);opacity:.45}}@keyframes orbFloat{50%{transform:translate3d(12px,-24px,0) scale(1.35)}}@keyframes colorWave{to{transform:translateY(28px);filter:hue-rotate(95deg);opacity:.9}}@keyframes prismLightning{0%,100%{opacity:0}8%,12%,43%,47%{opacity:1}10%,45%{opacity:.15}}
@media(max-width:520px){.portal{top:36%;width:78vw}}


/* RAINBOW PHOENIX FINALE */
#phoenix{position:absolute;z-index:6;inset:0;width:100%;height:100%;pointer-events:none;opacity:0}
body.phoenix-flight #phoenix{opacity:1}
body.phoenix-flight .gem-wrap{animation:phoenixGemPulse .65s ease-in-out 5}
body.phoenix-flight .portal{filter:brightness(1.8);box-shadow:0 0 55px #fff,0 0 120px #58eaff,0 0 190px #ff42c8}
@keyframes phoenixGemPulse{50%{filter:drop-shadow(0 0 55px #fff) drop-shadow(0 0 100px #ff4bdc) brightness(1.5)}}
</style>
</head>
<body>
<div id="sky"><div class="stars"></div><div class="aurora"></div></div>
<div class="rainbow" aria-hidden="true"></div>
<div class="portal" aria-hidden="true"></div>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div><div class="orb o5"></div>
<div class="lightning" aria-hidden="true"></div>
<div class="fall left"><canvas></canvas></div><div class="fall right"><canvas></canvas></div>
<div class="orbit"></div>
<div class="gem-wrap"><div class="gem"><div class="gem-face"></div><div class="facet"></div><div class="facet f2"></div><div class="facet f3"></div><div class="facet f4"></div><div class="gem-core"></div></div></div>
<div class="shard a"></div><div class="shard b"></div><div class="shard c"></div>
<canvas id="phoenix"></canvas><canvas id="burst"></canvas><div class="laser"></div><div class="flash"></div>
<div class="hint" id="hint">A universe of color is awakening</div>
<main class="ui"><div class="brand">TikNation · Premium Gift</div><div class="title">THE WORLD<br>OF COLORS</div><div class="sub" id="sub">A living crystal of infinite color</div><button class="action" id="action">AWAKEN THE PRISM</button></main>
<script>
(function(){
 const falls=document.querySelectorAll('.fall');
 falls.forEach((host,index)=>{
  const canvas=host.querySelector('canvas'),ctx=canvas.getContext('2d');
  let w=1,h=1,dpr=1;
  const drops=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),speed:.5+Math.random()*1.4,r:.5+Math.random()*1.5}));
  function resize(){const b=host.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,1.5);w=Math.max(1,b.width);h=Math.max(1,b.height);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
  function draw(ms){
   const t=ms*.001;ctx.clearRect(0,0,w,h);
   const wash=ctx.createLinearGradient(0,0,w,0);wash.addColorStop(0,'rgba(110,210,255,0)');wash.addColorStop(.2,'rgba(170,240,255,.17)');wash.addColorStop(.5,'rgba(245,255,255,.32)');wash.addColorStop(.8,'rgba(130,220,255,.16)');wash.addColorStop(1,'rgba(110,210,255,0)');ctx.fillStyle=wash;ctx.fillRect(0,0,w,h);
   for(let k=0;k<12;k++){
    const x=(k+.5)*w/12,phase=k*1.8+index*2;
    ctx.beginPath();for(let y=-5;y<h+10;y+=7){const xx=x+Math.sin(y*.018+t*2.4+phase)*w*.025;if(y===-5)ctx.moveTo(xx,y);else ctx.lineTo(xx,y)}
    const g=ctx.createLinearGradient(x-7,0,x+7,0);g.addColorStop(0,'rgba(120,220,255,0)');g.addColorStop(.5,k%3===0?'rgba(255,255,255,.8)':'rgba(180,240,255,.42)');g.addColorStop(1,'rgba(120,220,255,0)');ctx.strokeStyle=g;ctx.lineWidth=3+(k%3)*2;ctx.stroke();
   }
   for(let k=0;k<30;k++){const x0=(k+.5)*w/30,offset=(t*(85+(k%4)*24)*60+k*47)%(h+60)-30;ctx.beginPath();for(let j=0;j<8;j++){const y=offset+j*17,xx=x0+Math.sin(y*.022+t*3+k)*2.5;if(j===0)ctx.moveTo(xx,y);else ctx.lineTo(xx,y)}ctx.strokeStyle=k%4===0?'rgba(255,255,255,.85)':'rgba(170,238,255,.55)';ctx.lineWidth=k%5===0?1.5:.7;ctx.stroke()}
   drops.forEach(p=>{p.y+=p.speed*.008;if(p.y>1.03){p.y=-.03;p.x=Math.random()}const x=p.x*w+Math.sin(t*2+p.y*13)*2,y=p.y*h;ctx.beginPath();ctx.ellipse(x,y,p.r*.55,p.r*1.5,0,0,Math.PI*2);ctx.fillStyle='rgba(235,253,255,.72)';ctx.fill()});
   const pool=ctx.createRadialGradient(w*.5,h*.92,1,w*.5,h*.94,w*.62);pool.addColorStop(0,'rgba(255,255,255,.7)');pool.addColorStop(.2,'rgba(170,240,255,.38)');pool.addColorStop(1,'rgba(80,190,255,0)');ctx.fillStyle=pool;ctx.fillRect(0,h*.78,w,h*.22);
   requestAnimationFrame(draw);
  }
  resize();requestAnimationFrame(draw);if('ResizeObserver'in window)new ResizeObserver(resize).observe(host);else window.addEventListener('resize',resize);
 });
 const btn=document.getElementById('action'),hint=document.getElementById('hint'),sub=document.getElementById('sub'),burst=document.getElementById('burst'),bctx=burst.getContext('2d'),phoenix=document.getElementById('phoenix'),pctx=phoenix.getContext('2d');
 function phoenixFlight(){
  const dpr=Math.min(devicePixelRatio||1,1.5),w=innerWidth,h=innerHeight;
  phoenix.width=w*dpr;phoenix.height=h*dpr;phoenix.style.width=w+'px';phoenix.style.height=h+'px';pctx.setTransform(dpr,0,0,dpr,0,0);
  const start=performance.now(),duration=6500;
  const palette=['#fff5c8','#ffe27a','#ffad45','#ff654e','#ef4b9a','#a96bff','#54dfff'];
  function plume(ctx,ax,ay,bx,by,width,color,shine=true){
   const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;
   ctx.beginPath();ctx.moveTo(ax,ay);
   ctx.quadraticCurveTo(ax+dx*.28+nx*width,ay+dy*.28+ny*width,bx,by);
   ctx.quadraticCurveTo(ax+dx*.65-nx*width*.5,ay+dy*.65-ny*width*.5,ax,ay);
   ctx.closePath();ctx.fillStyle=color;ctx.fill();
   if(shine){ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(ax+dx*.5+nx*width*.12,ay+dy*.5+ny*width*.12,bx,by);ctx.stroke()}
  }
  function draw(now){
   const elapsed=now-start,p=Math.min(1,elapsed/duration),x=w*(.08+p*.84),y=h*(.36-Math.sin(p*Math.PI)*.19),scale=Math.min(1.25,Math.max(.72,w/430)),wing=Math.sin(elapsed*.008)*.42;
   pctx.clearRect(0,0,w,h);pctx.save();pctx.translate(x,y);pctx.scale(scale,scale);
   // Long, individually separated tail streamers, trailing behind the body.
   for(let i=0;i<9;i++){
    const c=palette[i%palette.length],offset=(i-4)*5;
    pctx.save();pctx.shadowColor=c;pctx.shadowBlur=13;pctx.strokeStyle=c;pctx.lineWidth=5.5-i*.28;pctx.lineCap='round';
    pctx.beginPath();pctx.moveTo(-34,12+offset*.18);pctx.bezierCurveTo(-82,offset-5,-126,offset+Math.sin(elapsed*.003+i)*18,-206,offset*1.9+Math.sin(elapsed*.004+i)*17);pctx.stroke();pctx.restore();
   }
   // Far wing, layered flight feathers and covert rows.
   function wingShape(side,far){
    pctx.save();pctx.translate(-9,-7);pctx.scale(1,side);pctx.rotate(-wing+(far?-.12:0));
    const grad=pctx.createLinearGradient(0,0,-25,-190);grad.addColorStop(0,far?'#d85a74':'#fff0bb');grad.addColorStop(.25,'#ffb34d');grad.addColorStop(.48,'#fa6859');grad.addColorStop(.68,'#c34caa');grad.addColorStop(.84,'#6a7de4');grad.addColorStop(1,'#54dfff');
    pctx.shadowColor=far?'#ff744e':'#ffb94d';pctx.shadowBlur=far?14:23;
    pctx.beginPath();pctx.moveTo(0,0);pctx.bezierCurveTo(-42,-42,-93,-104,-47,-191);pctx.bezierCurveTo(-8,-160,35,-112,33,-67);pctx.bezierCurveTo(36,-29,20,-8,0,0);pctx.closePath();pctx.fillStyle=grad;pctx.fill();
    // Long primary feathers fan from the wrist toward the wingtip.
    for(let i=0;i<11;i++){
     const a=i/10,ax=-8-a*28,ay=-18-a*24,bx=-45-a*6,by=-116-a*8;
     plume(pctx,ax,ay,bx,by,7.5,far?palette[(i+2)%7]:palette[(i+1)%7],!far);
    }
    // Secondary feathers overlap like real flight plumage.
    for(let row=0;row<3;row++)for(let i=0;i<8;i++){
     const ax=-4-i*3+row*5,ay=-17-i*5-row*12,bx=-26-i*4+row*7,by=-65-i*5-row*13;
     plume(pctx,ax,ay,bx,by,5.5,row===0?'#fff0c4':palette[(i+row+2)%7],!far);
    }
    // Warm feather shafts and subtle edge highlights.
    pctx.shadowBlur=0;pctx.strokeStyle='rgba(255,255,230,.55)';pctx.lineWidth=1;
    for(let i=0;i<7;i++){pctx.beginPath();pctx.moveTo(-5-i*3,-15-i*4);pctx.quadraticCurveTo(-20-i*3,-55-i*5,-40-i*2,-105-i*5);pctx.stroke()}
    pctx.restore();
   }
   wingShape(-1,true);wingShape(1,true);
   // Torso: tapered, muscular bird body with a luminous breast and back.
   const torso=pctx.createLinearGradient(-35,-12,43,24);torso.addColorStop(0,'#8f315e');torso.addColorStop(.25,'#f15b46');torso.addColorStop(.53,'#ffd16b');torso.addColorStop(.75,'#fff3c8');torso.addColorStop(1,'#e45c72');
   pctx.shadowColor='#ffb44e';pctx.shadowBlur=24;pctx.fillStyle=torso;
   pctx.beginPath();pctx.moveTo(-42,3);pctx.bezierCurveTo(-28,-21,10,-25,39,-7);pctx.quadraticCurveTo(52,8,25,24);pctx.quadraticCurveTo(-12,33,-42,3);pctx.fill();
   // Breast feather scales, individually layered down the chest.
   for(let row=0;row<4;row++)for(let i=0;i<5;i++){
    const xx=-8+i*8-row*2,yy=-7+row*7;
    plume(pctx,xx,yy,xx+5,yy+12,3.2,['#fff1bf','#ffcf72','#ff9b59','#f36b63'][row],false);
   }
   // Neck rises in a graceful S curve; the head is distinctly eagle-like.
   pctx.shadowBlur=18;pctx.shadowColor='#ffb44e';
   const neck=pctx.createLinearGradient(16,-5,54,-66);neck.addColorStop(0,'#e95d54');neck.addColorStop(.45,'#ffd36d');neck.addColorStop(1,'#fff4d2');
