<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b22">
<title>TikNation · World of Colors</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b22}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 34%,#03061555 100%),linear-gradient(0deg,#05091ddd 0%,transparent 38%,#05091d33 100%)}
.hud{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));text-align:center;pointer-events:none}
.kicker{font-size:9px;letter-spacing:.42em;color:#d9faff;text-shadow:0 0 15px #55dfff;margin-top:4px}
h1{font-size:clamp(29px,7vw,58px);line-height:.94;letter-spacing:.1em;margin:9px 0 0;font-weight:900;text-shadow:0 0 12px #fff,0 0 32px #a36cff,0 0 60px #27dfff}
.subtitle{font-size:9px;letter-spacing:.22em;color:#e4e9ff;margin-top:10px}
.bottom{display:flex;flex-direction:column;align-items:center;gap:12px}
button{pointer-events:auto;border:1px solid #d9faffaa;border-radius:99px;padding:14px 25px;background:linear-gradient(105deg,#7b42ffdd,#08b9d5dd,#e94fb5dd);color:white;font-size:10px;font-weight:900;letter-spacing:.16em;box-shadow:0 0 24px #63dfff66,inset 0 0 14px #ffffff22;backdrop-filter:blur(8px)}
.note{font-size:8px;letter-spacing:.15em;color:#d9e8ffbb;text-transform:uppercase}
@media(max-height:600px){.hud{padding-top:12px;padding-bottom:12px}h1{font-size:clamp(23px,5vw,38px)}.subtitle{margin-top:5px}button{padding:10px 20px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="world" aria-label="A luminous rainbow waterfall valley with a giant crystal"></canvas>
<div class="vignette"></div>
<div class="hud">
 <div><div class="kicker">TIKNATION PRESENTS</div><h1>WORLD OF COLORS</h1><div class="subtitle">ENTER THE PRISMATIC REALM</div></div>
 <div class="bottom"><button id="awaken">AWAKEN THE COLORS</button><div class="note" id="status">A living world of light · sound begins on tap</div></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false});
const button=document.getElementById('awaken'),status=document.getElementById('status');
let W=0,H=0,D=1,t=0,last=0,burst=0,particles=[],audio;
const colors=['#ff4b8b','#ff9b45','#ffe66b','#65f5c4','#55c9ff','#9a7bff','#ed7bff'];
function resize(){D=Math.min(devicePixelRatio||1,1.8);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}
function path(points){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath()}
function glow(x,y,r,color,a=1){ctx.save();ctx.globalAlpha=a;ctx.shadowBlur=r;ctx.shadowColor=color;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,Math.max(1,r*.12),0,Math.PI*2);ctx.fill();ctx.restore()}
function background(){
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080d2b');g.addColorStop(.48,'#20245c');g.addColorStop(1,'#081b35');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const aur=ctx.createRadialGradient(W*.52,H*.35,4,W*.52,H*.35,Math.max(W,H)*.75);aur.addColorStop(0,'#8c4eff44');aur.addColorStop(.4,'#26c9e522');aur.addColorStop(1,'transparent');ctx.fillStyle=aur;ctx.fillRect(0,0,W,H);
 for(let i=0;i<95;i++){let x=(i*7919%997)/997*W,y=(i*3571%991)/991*H*.66;ctx.globalAlpha=.25+.45*(.5+.5*Math.sin(t*1.5+i));ctx.fillStyle='#dffaff';ctx.fillRect(x,y,1.2,1.2)}ctx.globalAlpha=1;
}
function mountains(){
 path([[0,H*.56],[W*.1,H*.34],[W*.2,H*.48],[W*.34,H*.29],[W*.48,H*.5],[W*.63,H*.31],[W*.78,H*.49],[W*.9,H*.33],[W,H*.52],[W,H*.76],[0,H*.76]]);let g=ctx.createLinearGradient(0,H*.3,0,H*.75);g.addColorStop(0,'#27376d');g.addColorStop(1,'#101c40');ctx.fillStyle=g;ctx.fill();
 path([[0,H*.61],[W*.15,H*.45],[W*.3,H*.57],[W*.48,H*.4],[W*.67,H*.59],[W*.83,H*.43],[W,H*.6],[W,H*.8],[0,H*.8]]);ctx.fillStyle='#17294d';ctx.fill();
}
function rainbow(){
 const cx=W*.5,cy=H*.61,rx=Math.min(W*.36,H*.39),ry=Math.min(H*.37,W*.34);
 ctx.save();ctx.lineCap='round';
 for(let i=0;i<7;i++){ctx.beginPath();ctx.ellipse(cx,cy,rx-i*5,ry-i*5,0,Math.PI,Math.PI*2);ctx.strokeStyle=colors[i];ctx.lineWidth=Math.max(5,Math.min(10,W*.012));ctx.shadowBlur=22;ctx.shadowColor=colors[i];ctx.globalAlpha=.75;ctx.stroke()}
 ctx.globalAlpha=1;ctx.beginPath();ctx.ellipse(cx,cy,rx-39,ry-39,0,Math.PI,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.shadowBlur=20;ctx.shadowColor='#fff';ctx.stroke();ctx.restore();
 for(let i=0;i<24;i++){let a=Math.PI+(i/24)*Math.PI, x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;glow(x,y,14,colors[i%7],.65)}
}
function waterfall(x,top,width,bottom){
 ctx.save();let grad=ctx.createLinearGradient(x,top,x+width,top);grad.addColorStop(0,'#43cfff22');grad.addColorStop(.25,'#a4f8ffcc');grad.addColorStop(.52,'#4abdebaa');grad.addColorStop(.8,'#d8ffffbb');grad.addColorStop(1,'#37aeea22');
 ctx.beginPath();ctx.moveTo(x,top);ctx.bezierCurveTo(x-8,top+H*.13,x+width*.12,bottom-H*.12,x+width*.08,bottom);ctx.quadraticCurveTo(x+width*.52,bottom+8,x+width*.94,bottom);ctx.bezierCurveTo(x+width*.8,bottom-H*.2,x+width+10,top+H*.12,x+width,top);ctx.closePath();ctx.fillStyle=grad;ctx.shadowBlur=20;ctx.shadowColor='#55dfff';ctx.fill();
 for(let i=0;i<17;i++){let xx=x+width*(i/17),off=(t*90+i*37)%(H*.5);ctx.strokeStyle=i%3?'#d9ffff88':'#ffffffcc';ctx.lineWidth=i%4===0?2:1;ctx.beginPath();ctx.moveTo(xx,top+off*.12);ctx.bezierCurveTo(xx-5,top+off*.5,xx+5,top+off*.8,xx+Math.sin(t*2+i)*4,Math.min(bottom,top+off+24));ctx.stroke()}
 for(let i=0;i<18;i++){let px=x+Math.sin(i*8+t*1.5)*width*.48+width*.5,py=top+(i*47+t*95)%(bottom-top);ctx.fillStyle='#eaffffbb';ctx.fillRect(px,py,1.5,4+Math.sin(i+t)*3)}
 ctx.restore();
}
function crystal(){
 const cx=W*.5,base=H*.77,scale=Math.min(W*.18,H*.235,150),top=base-scale*2.05;
 ctx.save();ctx.translate(cx,top);
 let aura=ctx.createRadialGradient(0,scale,3,0,scale,scale*1.8);aura.addColorStop(0,'#fff9');aura.addColorStop(.25,'#77eaff55');aura.addColorStop(1,'transparent');ctx.fillStyle=aura;ctx.fillRect(-scale*2,-scale*.3,scale*4,scale*3);
 // Tall faceted gemstone silhouette
 path([[0,0],[scale*.62,scale*.48],[scale*.5,scale*1.58],[0,scale*2.05],[-scale*.5,scale*1.58],[-scale*.62,scale*.48]]);let body=ctx.createLinearGradient(-scale,0,scale,scale*1.8);body.addColorStop(0,'#e8ffff');body.addColorStop(.18,'#56dfff');body.addColorStop(.42,'#8d63ff');body.addColorStop(.68,'#ff70db');body.addColorStop(1,'#35f1d2');ctx.fillStyle=body;ctx.shadowBlur=35;ctx.shadowColor='#83eaff';ctx.fill();
 path([[0,0],[0,scale*2.05],[-scale*.5,scale*1.58],[-scale*.62,scale*.48]]);ctx.fillStyle='#d9ffff66';ctx.fill();
 path([[0,0],[scale*.62,scale*.48],[scale*.5,scale*1.58],[0,scale*2.05]]);ctx.fillStyle='#fff8';ctx.globalAlpha=.42;ctx.fill();ctx.globalAlpha=1;
 path([[0,0],[scale*.62,scale*.48],[0,scale*.72],[-scale*.62,scale*.48]]);ctx.fillStyle='#ffffffaa';ctx.fill();
 path([[0,scale*.72],[scale*.5,scale*1.58],[0,scale*2.05]]);ctx.fillStyle='#43bfff99';ctx.fill();
 path([[0,scale*.72],[-scale*.5,scale*1.58],[0,scale*2.05]]);ctx.fillStyle='#e65cff88';ctx.fill();
 ctx.strokeStyle='#f2ffff';ctx.lineWidth=1.5;ctx.shadowBlur=16;ctx.stroke();
 let shine=(t*scale*.8)%(scale*1.8)-scale*.5;ctx.save();ctx.beginPath();ctx.moveTo(-scale*.65,scale*.2);ctx.lineTo(scale*.65,scale*.2);ctx.lineTo(scale*.52,scale*1.6);ctx.lineTo(-scale*.52,scale*1.6);ctx.clip();let sg=ctx.createLinearGradient(shine,0,shine+scale*.25,scale*1.8);sg.addColorStop(0,'transparent');sg.addColorStop(.5,'#fff9');sg.addColorStop(1,'transparent');ctx.fillStyle=sg;ctx.fillRect(-scale,0,scale*2,scale*2);ctx.restore();
 ctx.restore();
 // floating orbiting crystal shards
 for(let i=0;i<6;i++){let a=t*.45+i*Math.PI/3,rr=scale*(1.05+.12*Math.sin(t+i)),x=cx+Math.cos(a)*rr,y=top+scale*.95+Math.sin(a)*scale*.7;ctx.save();ctx.translate(x,y);ctx.rotate(a+t*.4);path([[0,-9],[6,0],[0,11],[-6,0]]);ctx.fillStyle=colors[i];ctx.shadowBlur=18;ctx.shadowColor=colors[i];ctx.fill();ctx.restore()}
}
function pool(){
 const y=H*.79;let g=ctx.createLinearGradient(0,y,0,H);g.addColorStop(0,'#1acbe766');g.addColorStop(.25,'#123f7899');g.addColorStop(1,'#07152f');ctx.fillStyle=g;ctx.fillRect(0,y,W,H-y);
 for(let i=0;i<18;i++){let yy=y+12+i*8,ww=(i*31%Math.max(80,W*.5));ctx.globalAlpha=.08+.12*Math.sin(t*2+i);ctx.strokeStyle=colors[i%7];ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(W*.5,yy,ww*(.5+.5*Math.sin(t+i)),3+i%4,0,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;
}
function motes(dt){
 if(Math.random()<.32){particles.push({x:Math.random()*W,y:H*(.36+Math.random()*.58),vx:(Math.random()-.5)*12,vy:-12-Math.random()*26,life:2+Math.random()*2,r:1+Math.random()*2,c:colors[Math.floor(Math.random()*7)]})}
 if(burst>0&&Math.random()<.8){let a=Math.random()*Math.PI*2,s=25+Math.random()*120;particles.push({x:W*.5,y:H*.55,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1+Math.random(),r:1+Math.random()*3,c:colors[Math.floor(Math.random()*7)]})}
 particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vy-=2*dt;ctx.globalAlpha=Math.max(0,Math.min(1,p.life));glow(p.x,p.y,p.r*9,p.c,.8)}ctx.globalAlpha=1;
}
function draw(ts){let dt=Math.min(.04,(ts-last)/1000||.016);last=ts;t+=dt;if(burst>0)burst-=dt;background();mountains();rainbow();waterfall(W*.13,H*.49,W*.17,H*.84);waterfall(W*.70,H*.47,W*.17,H*.84);pool();crystal();motes(dt);requestAnimationFrame(draw)}
function sound(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime;[261.6,329.6,392,523.3,659.3].forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.11);g.gain.exponentialRampToValueAtTime(.055,now+i*.11+.04);g.gain.exponentialRampToValueAtTime(.0001,now+i*.11+1.4);o.connect(g);g.connect(audio.destination);o.start(now+i*.11);o.stop(now+i*.11+1.45)})}catch(e){}}
button.addEventListener('click',()=>{burst=2.4;for(let i=0;i<100;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*180;particles.push({x:W*.5,y:H*.56,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1+Math.random()*1.7,r:1+Math.random()*3,c:colors[i%7]})}sound();button.textContent='AWAKEN THE COLORS AGAIN';status.textContent='THE PRISM IS ALIVE · COLOR CASCADE RELEASED'});
addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
