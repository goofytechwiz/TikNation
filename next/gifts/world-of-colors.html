<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08051c">
<title>TikNation · The World of Colors</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{position:relative;background:radial-gradient(ellipse at 50% 42%,#33206c 0%,#151037 43%,#050411 100%);color:#fff;font-family:Arial,Helvetica,sans-serif}
#sky{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#5b36a744,transparent 58%)}
.stars{position:absolute;inset:-15%;background-image:radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 28% 73%,#a9f7ff 50%,transparent 60%),radial-gradient(2px 2px at 81% 25%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 73% 81%,#ffc8f3 50%,transparent 60%),radial-gradient(2px 2px at 55% 12%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 92% 60%,#fff 50%,transparent 60%);background-size:300px 260px;animation:drift 28s linear infinite}
.aurora{position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,#21eaff30,#c43cff44,transparent,#ff4bc833,transparent);filter:blur(48px);animation:spin 22s linear infinite}
.rainbow{position:absolute;z-index:2;left:50%;top:8%;width:min(100vw,850px);height:min(68vw,560px);transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 100%,transparent 0 54%,#ff465b 54.5% 56%,#ffb13d 56.5% 58%,#fff36a 58.5% 60%,#57f59a 60.5% 62%,#45d9ff 62.5% 64%,#7e65ff 64.5% 66%,#dc6aff 66.5% 68%,transparent 68.5%);filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 25px #ff67dd);opacity:.85;pointer-events:none;animation:rainbowPulse 4s ease-in-out infinite}
.fall{position:absolute;z-index:3;top:8%;bottom:7%;width:clamp(65px,14vw,155px);overflow:hidden;pointer-events:none;filter:drop-shadow(0 0 17px #61dfff88)}
.fall.left{left:1%}.fall.right{right:1%;transform:scaleX(-1)}
.fall canvas{display:block;width:100%;height:100%}
.orbit{position:absolute;z-index:3;left:50%;top:43%;width:min(83vw,690px);aspect-ratio:1;border:2px solid #72faff99;border-radius:50%;transform:translate(-50%,-50%) rotateX(68deg);box-shadow:0 0 25px #54edff88,0 0 65px #d64aff55,inset 0 0 50px #a85bff55;animation:orbit 20s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;inset:9%;border:2px solid #ff75eaaa;border-radius:50%;box-shadow:0 0 18px #ff65df}
.orbit:after{inset:20%;border-color:#6affeeaa;transform:rotate(65deg)}
.gem-wrap{position:absolute;z-index:5;left:50%;top:42%;width:min(56vw,390px);height:min(67vw,465px);transform:translate(-50%,-50%);filter:drop-shadow(0 0 20px #fff) drop-shadow(0 0 42px #00eaff) drop-shadow(0 0 82px #bb28ff);animation:float 4.8s ease-in-out infinite}
.gem{position:absolute;inset:0;animation:gemTurn 11s ease-in-out infinite;transform-style:preserve-3d}
.gem-face{position:absolute;inset:0;clip-path:polygon(50% 0,94% 24%,84% 78%,50% 100%,16% 78%,6% 24%);background:conic-gradient(from 30deg at 50% 48%,#ff31cb,#ffb62e,#eaff45,#35ffd1,#19baff,#8a4dff,#ff31cb);box-shadow:inset 0 0 45px #fff;animation:hue 7s linear infinite}
.gem-face:before{content:"";position:absolute;inset:2%;clip-path:inherit;background:linear-gradient(130deg,#fff 0%,#ffffff12 16%,#ff43dbbb 28%,#42f7ffbb 43%,#faff72bb 58%,#814affcc 73%,#fff 100%);background-size:250% 250%;animation:facetFlow 4s ease-in-out infinite alternate}
.facet{position:absolute;inset:0;clip-path:polygon(50% 0,50% 100%,6% 24%);background:linear-gradient(145deg,#fff,#ff46d8 22%,#51efff 48%,#ffe66c 68%,#8e42ff);opacity:.75;mix-blend-mode:screen}
.facet.f2{clip-path:polygon(50% 0,94% 24%,50% 100%);background:linear-gradient(45deg,#ff26c9,#ffea66,#fff,#37eaff,#8d39ff)}
.facet.f3{clip-path:polygon(6% 24%,50% 100%,16% 78%);background:linear-gradient(135deg,#fff,#ff48c9,#a94aff)}
.facet.f4{clip-path:polygon(94% 24%,84% 78%,50% 100%);background:linear-gradient(135deg,#fff,#4affed,#347aff)}
.gem-core{position:absolute;left:34%;top:29%;width:32%;height:40%;border-radius:50%;background:radial-gradient(ellipse,#fff 0%,#fff 8%,#7affff 19%,#ff65e6 38%,#8b48ff99 60%,transparent 75%);filter:blur(3px);box-shadow:0 0 40px #fff}
.gem:after{content:"";position:absolute;inset:7% 10%;clip-path:polygon(50% 0,94% 24%,84% 78%,50% 100%,16% 78%,6% 24%);background:linear-gradient(115deg,transparent 20%,#fff 30%,transparent 37%,#fff9 52%,transparent 59%);background-size:230% 100%;mix-blend-mode:screen;animation:glint 2.8s ease-in-out infinite}
.shard{position:absolute;z-index:4;width:clamp(28px,6vw,62px);aspect-ratio:1;clip-path:polygon(50% 0,100% 35%,75% 100%,25% 100%,0 35%);background:conic-gradient(#fff,#45faff,#a348ff,#ff4fca,#ffe45c,#fff);filter:drop-shadow(0 0 18px #53efff);animation:shard 7s linear infinite}
.shard.a{left:9%;top:29%}.shard.b{right:9%;top:33%;animation-delay:-2s}.shard.c{left:18%;bottom:22%;animation-delay:-4s}
#burst{position:absolute;z-index:7;inset:0;width:100%;height:100%;pointer-events:none}
.laser{position:absolute;z-index:6;inset:0;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 43%,transparent 0 7deg,#fff 7.2deg 7.7deg,transparent 8deg 15deg);mask-image:radial-gradient(ellipse at center,transparent 0 8%,#000 15% 70%,transparent 82%);mix-blend-mode:screen}
.flash{position:absolute;z-index:8;inset:0;pointer-events:none;background:#fff;opacity:0}
body.awake .laser{animation:laser 2.6s ease-out}
body.awake .flash{animation:flash .7s ease-out}
body.awake .rainbow{opacity:1;filter:drop-shadow(0 0 22px #fff) drop-shadow(0 0 42px #ff67dd)}
body.awake .gem-wrap{filter:drop-shadow(0 0 30px #fff) drop-shadow(0 0 65px #ff4bdc)}
.ui{position:absolute;z-index:9;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 18px max(28px,env(safe-area-inset-bottom));text-align:center;pointer-events:none}
.hint{position:absolute;z-index:9;top:max(22px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:9px;letter-spacing:.2em;color:#e2d9ff;text-transform:uppercase;text-shadow:0 0 12px #b78aff}
.brand{font-size:9px;letter-spacing:.48em;color:#e6dfff;text-transform:uppercase;margin-bottom:12px}
.title{font-size:clamp(29px,7vw,58px);font-weight:900;letter-spacing:.09em;line-height:.98;background:linear-gradient(100deg,#fff,#ffb9ec,#ffe5a2,#a6ffe2,#a9caff,#dfb3ff,#fff);background-size:250% auto;color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 17px #b78aff);animation:titleGlow 6s linear infinite}
.sub{font-size:9px;letter-spacing:.2em;color:#e5dcff;margin-top:12px;text-transform:uppercase}
.action{pointer-events:auto;margin-top:19px;border:1px solid #f4e5ffcc;border-radius:99px;padding:15px 25px;background:linear-gradient(110deg,#8c3dffdd,#12cce9dd,#e64acadd);color:#fff;letter-spacing:.15em;font-size:10px;font-weight:900;box-shadow:0 0 35px #a47bff99,inset 0 0 18px #fff5}
.action:active{transform:scale(.96)}
@keyframes drift{to{transform:translateY(80px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rainbowPulse{50%{opacity:.58}}@keyframes orbit{to{transform:translate(-50%,-50%) rotateX(68deg) rotate(360deg)}}@keyframes float{50%{transform:translate(-50%,-53%) scale(1.04)}}@keyframes gemTurn{0%,100%{transform:rotateY(-9deg) rotateX(5deg)}50%{transform:rotateY(9deg) rotateX(-5deg)}}@keyframes hue{to{filter:hue-rotate(360deg) saturate(1.8)}}@keyframes facetFlow{to{background-position:100% 100%}}@keyframes glint{0%{background-position:-130% 0}100%{background-position:130% 0}}@keyframes shard{to{transform:rotateY(360deg) rotateX(360deg)}}@keyframes laser{0%,100%{opacity:0}12%,48%{opacity:.95}75%{opacity:.2}}@keyframes flash{0%{opacity:.9}100%{opacity:0}}@keyframes titleGlow{to{background-position:250% center}}
@media(max-width:520px){.fall.left{left:-2%}.fall.right{right:-2%}.fall{width:clamp(60px,16vw,105px)}.gem-wrap{width:58vw;height:70vw;top:41%}.orbit{width:91vw}.rainbow{top:15%;width:115vw;height:78vw}.ui{padding-bottom:max(27px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){.stars,.aurora,.rainbow,.orbit,.gem-wrap,.gem,.shard,.title{animation-duration:18s!important;animation-iteration-count:1!important}}

/* DIMENSION PORTAL + COLOR WAVES */
.portal{position:absolute;z-index:2;left:50%;top:36%;width:min(68vw,520px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(13,8,43,.96) 0 39%,rgba(29,14,76,.72) 47%,transparent 68%);box-shadow:0 0 25px #58eaff,0 0 65px #b43cff,0 0 125px #ff42c8;animation:portalPulse 3.5s ease-in-out infinite}
.portal:before{content:"";position:absolute;inset:0;border-radius:50%;padding:9px;background:conic-gradient(#fff,#ff43d5,#ffdc4c,#4affd7,#43bfff,#a04cff,#fff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(0 0 18px #8cfaff);animation:portalSpin 9s linear infinite}
.portal:after{content:"";position:absolute;inset:13%;border-radius:50%;border:2px solid #d6faffaa;box-shadow:inset 0 0 38px #7b4dff,0 0 34px #ff65dd;animation:portalInner 2.8s ease-in-out infinite alternate}
.orb{position:absolute;z-index:6;width:clamp(13px,2.2vw,25px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 10%,var(--orb) 35%,transparent 72%);box-shadow:0 0 18px 6px var(--orb),0 0 38px var(--orb);animation:orbFloat 5s ease-in-out infinite}
.orb.o1{--orb:#ff4bd8;left:17%;top:37%}.orb.o2{--orb:#49f5ff;right:16%;top:29%;animation-delay:-1.3s}.orb.o3{--orb:#ffe45c;left:25%;bottom:28%;animation-delay:-2.4s}.orb.o4{--orb:#8c65ff;right:23%;bottom:25%;animation-delay:-3.2s}.orb.o5{--orb:#56ffb8;left:50%;top:16%;animation-delay:-.8s}
.fall:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,#ff48d522 28%,#4af5ff55 54%,#ffe45c33 78%,transparent);mix-blend-mode:screen;animation:colorWave 3.2s ease-in-out infinite alternate}
.lightning{position:absolute;z-index:4;inset:0;pointer-events:none;opacity:0;background:linear-gradient(112deg,transparent 0 42%,#fff 42.2%,#b7faff 42.5%,transparent 43%),linear-gradient(68deg,transparent 0 61%,#fff 61.2%,#ffb7f2 61.5%,transparent 62%);filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 28px #58eaff);mix-blend-mode:screen}
body.awake .portal{filter:brightness(1.5);box-shadow:0 0 45px #fff,0 0 95px #58eaff,0 0 160px #ff42c8}
body.awake .lightning{animation:prismLightning 1.6s steps(1,end) 2}
@keyframes portalSpin{to{transform:rotate(360deg)}}@keyframes portalPulse{50%{opacity:.72;filter:brightness(1.35)}}@keyframes portalInner{to{transform:scale(.88);opacity:.45}}@keyframes orbFloat{50%{transform:translate3d(12px,-24px,0) scale(1.35)}}@keyframes colorWave{to{transform:translateY(28px);filter:hue-rotate(95deg);opacity:.9}}@keyframes prismLightning{0%,100%{opacity:0}8%,12%,43%,47%{opacity:1}10%,45%{opacity:.15}}
@media(max-width:520px){.portal{top:36%;width:78vw}}



/* HIGH-VISIBILITY SUPERNOVA FINALE */
.supernova-screen{position:fixed;z-index:8;inset:0;pointer-events:none;opacity:0;overflow:hidden;background:radial-gradient(circle at 50% 43%,#fff 0%,#fff9 2%,#ffdbfbcc 5%,#a94bff99 15%,#23dcff55 31%,transparent 62%);mix-blend-mode:screen}
.supernova-screen:before{content:"";position:absolute;left:50%;top:43%;width:12vmax;height:12vmax;border:12px solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(.05);box-shadow:0 0 25px #fff,0 0 65px #ff43d8,0 0 110px #44eaff,inset 0 0 40px #fff}
.supernova-screen:after{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 43%,transparent 0deg 7deg,#fff9 7.3deg 7.8deg,#ff4bd855 8deg 8.5deg,transparent 9deg 15deg);mask-image:radial-gradient(ellipse at center,transparent 0 5%,#000 15% 70%,transparent 86%);transform:scale(.25);}
.nova-core{position:absolute;left:50%;top:43%;width:18px;height:18px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 20px 15px #fff,0 0 70px 42px #ff55dc,0 0 130px 75px #55eaff,0 0 190px 110px #9d4dff}
.nova-ring{position:absolute;left:50%;top:43%;width:10vmax;height:10vmax;border:7px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 25px #fff,0 0 55px #ff4bd8,0 0 90px #54eaff}
.nova-rays{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 43%,transparent 0 10%,#fff5 10.5%,transparent 11% 20%,#ff56dc44 20.5%,transparent 21% 34%,#54eaff33 34.5%,transparent 35%)}
body.awake .supernova-screen{animation:novaScreen 2.9s cubic-bezier(.12,.72,.16,1) both}
body.awake .supernova-screen:before{animation:novaRing 2.6s cubic-bezier(.08,.72,.15,1) both}
body.awake .supernova-screen:after{animation:novaRays 2.8s ease-out both}
body.awake .nova-ring{animation:novaRing 2.4s cubic-bezier(.08,.72,.15,1) .12s both}
body.awake .nova-core{animation:novaCore 1.1s ease-out both}
@keyframes novaScreen{0%{opacity:0}10%{opacity:1}35%{opacity:.92}100%{opacity:0}}
@keyframes novaRing{0%{transform:translate(-50%,-50%) scale(.05);opacity:1}75%{opacity:.9}100%{transform:translate(-50%,-50%) scale(13);opacity:0}}
@keyframes novaRays{0%{transform:scale(.2) rotate(0);opacity:0}18%{opacity:1}100%{transform:scale(1.6) rotate(18deg);opacity:0}}
@keyframes novaCore{0%{transform:translate(-50%,-50%) scale(.1);opacity:0}18%{transform:translate(-50%,-50%) scale(2.8);opacity:1}100%{transform:translate(-50%,-50%) scale(.01);opacity:0}}


/* PRISMATIC RAINBOW BRIDGE + BUTTERFLIES */
.rainbow-bridge{position:absolute;z-index:4;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;overflow:visible;filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 24px #56eaff)}
.rainbow-bridge path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.bridge-deck{stroke:url(#bridgeColors);stroke-width:15;stroke-dasharray:1200;stroke-dashoffset:1200}
.bridge-glow{stroke:#fff;stroke-width:3;stroke-dasharray:1200;stroke-dashoffset:1200}
.bridge-rail{stroke:url(#bridgeColors);stroke-width:5;stroke-dasharray:900;stroke-dashoffset:900}
.bridge-support{stroke:#d9fbff;stroke-width:2;stroke-dasharray:500;stroke-dashoffset:500;opacity:.8}
body.revealed .rainbow-bridge{opacity:1}
body.revealed .bridge-deck{animation:bridgeUnfold 2.2s cubic-bezier(.2,.8,.2,1) both}
body.revealed .bridge-glow{animation:bridgeUnfold 2.2s .12s cubic-bezier(.2,.8,.2,1) both}
body.revealed .bridge-rail{animation:bridgeUnfold 2s .55s ease-out both}
body.revealed .bridge-support{animation:bridgeUnfold 1.5s .75s ease-out both}
.butterfly{position:absolute;z-index:7;width:54px;height:43px;opacity:0;filter:drop-shadow(0 0 4px var(--wing))}
.butterfly svg{width:100%;height:100%;overflow:visible}
.butterfly .wing{transform-box:fill-box;transform-origin:100% 78%;animation:wingBeat .19s ease-in-out infinite alternate}
.butterfly .wing.right{transform-origin:0% 78%}
.butterfly .wing-shape{fill:var(--wing);stroke:#34234f;stroke-width:1.25;stroke-linejoin:round}
.butterfly .wing-light{fill:#fff;opacity:.28}
.butterfly .vein{fill:none;stroke:#fff;stroke-opacity:.62;stroke-width:.8;stroke-linecap:round}
.butterfly .spots{fill:#fff3;stroke:#fff9;stroke-width:.7}
.butterfly .body{fill:#211b36;stroke:#fff;stroke-width:.7}
.butterfly .antenna{fill:none;stroke:#29223d;stroke-width:1;stroke-linecap:round}
.butterfly.b1{--wing:#ff64df;left:50%;top:42%}
.butterfly.b2{--wing:#63f5ff;left:50%;top:42%}
.butterfly.b3{--wing:#ffe66b;left:50%;top:42%}
.butterfly.b4{--wing:#9d82ff;left:50%;top:42%}
body.revealed .butterfly{opacity:1}
body.revealed .b1{animation:butterflyFly1 5.8s 0s ease-in-out infinite}
body.revealed .b2{animation:butterflyFly2 6.4s .35s ease-in-out infinite}
body.revealed .b3{animation:butterflyFly3 5.5s .7s ease-in-out infinite}
body.revealed .b4{animation:butterflyFly4 6.1s 1s ease-in-out infinite}
body.revealed .fall:after{animation:colorWave 1.4s ease-in-out infinite alternate}
@keyframes bridgeUnfold{to{stroke-dashoffset:0}}
@keyframes wingBeat{to{transform:rotate(28deg) scaleY(.72)}}
@keyframes butterflyFly1{0%{transform:translate(0,0) scale(.45)}25%{transform:translate(-29vw,-13vh) scale(.85)}55%{transform:translate(-17vw,18vh) scale(.7)}100%{transform:translate(-42vw,-4vh) scale(.5)}}
@keyframes butterflyFly2{0%{transform:translate(0,0) scale(.4)}30%{transform:translate(30vw,-17vh) scale(.9)}65%{transform:translate(19vw,13vh) scale(.65)}100%{transform:translate(43vw,-12vh) scale(.5)}}
@keyframes butterflyFly3{0%{transform:translate(0,0) scale(.35)}35%{transform:translate(-23vw,22vh) scale(.8)}70%{transform:translate(27vw,18vh) scale(.7)}100%{transform:translate(6vw,-28vh) scale(.45)}}
@keyframes butterflyFly4{0%{transform:translate(0,0) scale(.4)}30%{transform:translate(22vw,-25vh) scale(.85)}65%{transform:translate(-31vw,-12vh) scale(.65)}100%{transform:translate(-5vw,25vh) scale(.45)}}
@media(prefers-reduced-motion:reduce){body.revealed .butterfly{animation:none!important;opacity:.8}.butterfly:before,.butterfly:after{animation:none}}


/* WATERFALL SPRAY, VOLUMETRIC MIST AND POOL RIPPLES */
.fall{isolation:isolate}
.mist-bank{position:absolute;z-index:2;left:-45%;right:-45%;bottom:2%;height:31%;pointer-events:none;background:radial-gradient(ellipse at 50% 75%,#eaffff99 0%,#a8efff55 24%,#8edfff22 48%,transparent 73%);filter:blur(9px);opacity:.55;animation:mistDrift 4.8s ease-in-out infinite alternate}
.mist-bank:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 65%,#fff8 0 3%,transparent 22%),radial-gradient(ellipse at 70% 42%,#d8fbff88 0 5%,transparent 26%),radial-gradient(ellipse at 48% 80%,#fff7 0 4%,transparent 25%);filter:blur(6px);animation:mistPuff 3.6s ease-in-out infinite alternate}
.spray-rainbow{position:absolute;z-index:3;left:-38%;right:-38%;bottom:9%;height:24%;border-radius:50% 50% 0 0;border-top:4px solid #ff6ee8;border-left:3px solid #ffe36c;border-right:3px solid #63eaff;filter:blur(1.3px) drop-shadow(0 0 8px #fff) drop-shadow(0 0 15px #7ceaff);opacity:.32;transform:scaleY(.68);pointer-events:none}
.spray-rainbow:after{content:"";position:absolute;inset:8px 9% 0;border-radius:50% 50% 0 0;border-top:3px solid #fff8;border-left:2px solid #a5ffec;border-right:2px solid #c9a1ff;opacity:.8}
.spray-glints{position:absolute;z-index:4;inset:42% -15% 5%;pointer-events:none;background-image:radial-gradient(2px 3px at 18% 44%,#fff 55%,transparent 75%),radial-gradient(1.5px 2px at 37% 72%,#bafaff 55%,transparent 75%),radial-gradient(2px 2px at 68% 35%,#fff 55%,transparent 75%),radial-gradient(1px 2px at 83% 65%,#e6caff 55%,transparent 75%);background-size:83px 71px;opacity:.5;animation:sprayDrift 5s linear infinite}
.pool-ripples{position:absolute;z-index:4;left:50%;top:85%;width:min(88vw,850px);height:15vh;transform:translateX(-50%);pointer-events:none;opacity:.65;background:radial-gradient(ellipse at center,#c7faff22 0 20%,transparent 67%);filter:blur(1px)}
.pool-ripples:before,.pool-ripples:after{content:"";position:absolute;left:50%;top:40%;width:25%;height:35%;border:2px solid #c8faff99;border-radius:50%;transform:translate(-50%,-50%) scale(.5);box-shadow:0 0 12px #63eaff,inset 0 0 8px #fff5;animation:rippleExpand 3s ease-out infinite}
.pool-ripples:after{animation-delay:1.5s;border-color:#ffddff99}
body.revealed .mist-bank{opacity:.95;filter:blur(7px) drop-shadow(0 0 12px #baf8ff)}
body.revealed .spray-rainbow{opacity:.9;animation:sprayRainbowPulse 2.6s ease-in-out infinite alternate}
body.revealed .spray-glints{opacity:.95}
body.revealed .pool-ripples{opacity:1}
@keyframes mistDrift{from{transform:translate3d(-5%,2%,0) scale(.9)}to{transform:translate3d(7%,-7%,0) scale(1.12)}}
@keyframes mistPuff{from{opacity:.45;transform:translateY(8px)}to{opacity:1;transform:translateY(-12px)}}
@keyframes sprayDrift{to{background-position:83px 71px;transform:translateY(-8px)}}
@keyframes sprayRainbowPulse{to{filter:blur(.5px) drop-shadow(0 0 14px #fff) drop-shadow(0 0 24px #ff72e8);transform:scaleY(.82) translateY(-5px)}}
@keyframes rippleExpand{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}18%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(3.8)}}
@media(prefers-reduced-motion:reduce){.mist-bank,.spray-glints,.pool-ripples:before,.pool-ripples:after{animation:none!important}.spray-rainbow{animation:none!important}}


/* BOLD, ALWAYS-VISIBLE WATERFALL ATMOSPHERE */
.waterfall-mist{position:absolute;z-index:4;left:-12%;right:-12%;bottom:10%;height:29%;pointer-events:none;opacity:.88;background:radial-gradient(ellipse at 14% 65%,#efffffbb 0%,#a8f4ff77 17%,transparent 42%),radial-gradient(ellipse at 86% 62%,#efffffbb 0%,#a8f4ff77 17%,transparent 42%),radial-gradient(ellipse at 50% 92%,#e9fdff99 0%,#8deaff55 27%,transparent 62%);filter:blur(13px);animation:bigMistMove 5s ease-in-out infinite alternate}
.waterfall-mist:before,.waterfall-mist:after{content:"";position:absolute;inset:10% 0 0;background:radial-gradient(ellipse at 18% 55%,#fff9 0 2%,transparent 24%),radial-gradient(ellipse at 38% 76%,#baf8ffbb 0 3%,transparent 25%),radial-gradient(ellipse at 67% 48%,#fff9 0 2%,transparent 23%),radial-gradient(ellipse at 84% 72%,#baf8ffbb 0 3%,transparent 25%);filter:blur(8px);animation:bigMistPuff 3s ease-in-out infinite alternate}
.waterfall-mist:after{transform:translateX(4%) scale(1.12);opacity:.65;animation-delay:-1.5s}
.waterfall-rainbow{position:absolute;z-index:4;left:50%;bottom:11%;width:min(112vw,1050px);height:min(37vw,330px);transform:translateX(-50%);border-radius:50% 50% 0 0;border-top:12px solid #ff526f;border-left:9px solid #ffbd4b;border-right:9px solid #ffbd4b;filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 13px #ff4fd8);opacity:.9;pointer-events:none}
.waterfall-rainbow:before{content:"";position:absolute;inset:10px 3% 0;border-radius:50% 50% 0 0;border-top:10px solid #fff36a;border-left:7px solid #fff36a;border-right:7px solid #fff36a;filter:drop-shadow(0 0 8px #ffe66d)}
.waterfall-rainbow:after{content:"";position:absolute;inset:22px 7% 0;border-radius:50% 50% 0 0;border-top:9px solid #55ffd0;border-left:6px solid #55ffd0;border-right:6px solid #55ffd0;filter:drop-shadow(0 0 9px #55ffd0)}
.waterfall-sparkles{position:absolute;z-index:5;left:0;right:0;bottom:12%;height:30%;pointer-events:none;background-image:radial-gradient(3px 4px at 8% 55%,#fff 60%,transparent 75%),radial-gradient(2px 3px at 19% 27%,#d5ffff 60%,transparent 75%),radial-gradient(3px 4px at 32% 70%,#fff 60%,transparent 75%),radial-gradient(2px 3px at 48% 35%,#fff 60%,transparent 75%),radial-gradient(3px 4px at 64% 62%,#d5ffff 60%,transparent 75%),radial-gradient(2px 3px at 78% 31%,#fff 60%,transparent 75%),radial-gradient(3px 4px at 92% 67%,#fff 60%,transparent 75%);background-size:190px 120px;filter:drop-shadow(0 0 7px #9ffaff);animation:sparkleFall 2.8s linear infinite;opacity:.95}
.pool-ripples{z-index:5;top:auto;bottom:2%;width:min(96vw,1100px);height:18vh;background:repeating-radial-gradient(ellipse at 50% 48%,transparent 0 16px,#bafaff77 18px 20px,transparent 22px 43px);mask-image:linear-gradient(transparent,#000 25%,#000 80%,transparent);animation:poolShimmer 3.5s ease-in-out infinite alternate}
@keyframes bigMistMove{from{transform:translate(-3%,4%) scale(.92)}to{transform:translate(3%,-5%) scale(1.08)}}
@keyframes bigMistPuff{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:translateY(-13px)}}
@keyframes sparkleFall{to{background-position:0 120px;transform:translateY(8px)}}
@keyframes poolShimmer{to{opacity:1;transform:translateX(-50%) scaleY(1.15);filter:brightness(1.5)}}
@media(max-width:520px){.waterfall-rainbow{width:128vw;height:45vw;bottom:12%;border-width:8px 6px 0}.waterfall-rainbow:before{border-width:7px 5px 0}.waterfall-rainbow:after{border-width:6px 4px 0}.waterfall-mist{height:26%;bottom:12%}}

<script>
(function(){
 const falls=document.querySelectorAll('.fall');
 falls.forEach((host,index)=>{
  const canvas=host.querySelector('canvas'),ctx=canvas.getContext('2d');
  let w=1,h=1,dpr=1;
  const drops=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),speed:.5+Math.random()*1.4,r:.5+Math.random()*1.5}));
  function resize(){const b=host.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,1.5);w=Math.max(1,b.width);h=Math.max(1,b.height);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
  function draw(ms){
   const t=ms*.001;ctx.clearRect(0,0,w,h);
   const wash=ctx.createLinearGradient(0,0,w,0);wash.addColorStop(0,'rgba(110,210,255,0)');wash.addColorStop(.2,'rgba(170,240,255,.17)');wash.addColorStop(.5,'rgba(245,255,255,.32)');wash.addColorStop(.8,'rgba(130,220,255,.16)');wash.addColorStop(1,'rgba(110,210,255,0)');ctx.fillStyle=wash;ctx.fillRect(0,0,w,h);
   for(let k=0;k<12;k++){
    const x=(k+.5)*w/12,phase=k*1.8+index*2;
    ctx.beginPath();for(let y=-5;y<h+10;y+=7){const xx=x+Math.sin(y*.018+t*2.4+phase)*w*.025;if(y===-5)ctx.moveTo(xx,y);else ctx.lineTo(xx,y)}
    const g=ctx.createLinearGradient(x-7,0,x+7,0);g.addColorStop(0,'rgba(120,220,255,0)');g.addColorStop(.5,k%3===0?'rgba(255,255,255,.8)':'rgba(180,240,255,.42)');g.addColorStop(1,'rgba(120,220,255,0)');ctx.strokeStyle=g;ctx.lineWidth=3+(k%3)*2;ctx.stroke();
   }
   for(let k=0;k<30;k++){const x0=(k+.5)*w/30,offset=(t*(85+(k%4)*24)*60+k*47)%(h+60)-30;ctx.beginPath();for(let j=0;j<8;j++){const y=offset+j*17,xx=x0+Math.sin(y*.022+t*3+k)*2.5;if(j===0)ctx.moveTo(xx,y);else ctx.lineTo(xx,y)}ctx.strokeStyle=k%4===0?'rgba(255,255,255,.85)':'rgba(170,238,255,.55)';ctx.lineWidth=k%5===0?1.5:.7;ctx.stroke()}
   drops.forEach(p=>{p.y+=p.speed*.008;if(p.y>1.03){p.y=-.03;p.x=Math.random()}const x=p.x*w+Math.sin(t*2+p.y*13)*2,y=p.y*h;ctx.beginPath();ctx.ellipse(x,y,p.r*.55,p.r*1.5,0,0,Math.PI*2);ctx.fillStyle='rgba(235,253,255,.72)';ctx.fill()});
   const pool=ctx.createRadialGradient(w*.5,h*.92,1,w*.5,h*.94,w*.62);pool.addColorStop(0,'rgba(255,255,255,.7)');pool.addColorStop(.2,'rgba(170,240,255,.38)');pool.addColorStop(1,'rgba(80,190,255,0)');ctx.fillStyle=pool;ctx.fillRect(0,h*.78,w,h*.22);
   requestAnimationFrame(draw);
  }
  resize();requestAnimationFrame(draw);if('ResizeObserver'in window)new ResizeObserver(resize).observe(host);else window.addEventListener('resize',resize);
 });
 const btn=document.getElementById('action'),hint=document.getElementById('hint'),sub=document.getElementById('sub'),burst=document.getElementById('burst'),bctx=burst.getContext('2d');

 let audio=null;
 function sound(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();audio.resume();const notes=[261.6,329.6,392,523.25,659.25,783.99,1046.5,1318.5];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+i*.13;o.type=i%2?'triangle':'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+1.7);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+1.75)});const bass=audio.createOscillator(),gain=audio.createGain();bass.type='sine';bass.frequency.value=48;gain.gain.setValueAtTime(.0001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.18,audio.currentTime+.08);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+2);bass.connect(gain);gain.connect(audio.destination);bass.start();bass.stop(audio.currentTime+2.1)}
 function burstEffect(){
  const dpr=Math.min(devicePixelRatio||1,1.5),w=innerWidth,h=innerHeight;
  burst.width=w*dpr;burst.height=h*dpr;burst.style.width=w+'px';burst.style.height=h+'px';bctx.setTransform(dpr,0,0,dpr,0,0);
  const palette=['#fff','#ff4fd8','#ffdb55','#65ffe1','#54caff','#a56bff'];
  const bits=Array.from({length:230},()=>{const a=Math.random()*Math.PI*2,s=2+Math.random()*8;return{x:w/2,y:h*.42,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:65+Math.random()*35,r:1+Math.random()*3.5,color:palette[Math.floor(Math.random()*palette.length)]}});
  const meteors=Array.from({length:9},(_,i)=>({sx:w*(.06+Math.random()*.88),sy:-40-Math.random()*h*.28,ex:w*(.12+Math.random()*.76),ey:h*(.22+Math.random()*.43),delay:i*8+Math.random()*10,duration:34+Math.random()*18,color:palette[i%palette.length],impact:false}));
  const supernovaStart=performance.now();
  const fireworks=Array.from({length:5},(_,i)=>({x:w*(.13+i*.185),y:h*(.17+(i%2)*.13),delay:48+i*10,color:palette[(i+1)%palette.length],sparks:Array.from({length:34},()=>({a:Math.random()*Math.PI*2,s:1.2+Math.random()*4.8,r:1+Math.random()*2.4}))}));
  let frame=0;
  function paint(){
   bctx.clearRect(0,0,w,h);
   bits.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.035;p.life--;bctx.globalAlpha=Math.max(0,p.life/90);bctx.fillStyle=p.color;bctx.shadowBlur=12;bctx.shadowColor=p.color;bctx.beginPath();bctx.arc(p.x,p.y,p.r,0,Math.PI*2);bctx.fill()});
   meteors.forEach(m=>{
    const age=frame-m.delay;if(age<0)return;
    const t=Math.min(1,age/m.duration),x=m.sx+(m.ex-m.sx)*t,y=m.sy+(m.ey-m.sy)*t;
    if(t<1){
     const tailX=x-(m.ex-m.sx)*.16,tailY=y-(m.ey-m.sy)*.16;
     const grad=bctx.createLinearGradient(tailX,tailY,x,y);grad.addColorStop(0,'rgba(255,255,255,0)');grad.addColorStop(.65,m.color);grad.addColorStop(1,'#fff');
     bctx.save();bctx.globalAlpha=1-t*.25;bctx.strokeStyle=grad;bctx.lineWidth=4;bctx.lineCap='round';bctx.shadowBlur=22;bctx.shadowColor=m.color;bctx.beginPath();bctx.moveTo(tailX,tailY);bctx.lineTo(x,y);bctx.stroke();bctx.fillStyle='#fff';bctx.beginPath();bctx.arc(x,y,4,0,Math.PI*2);bctx.fill();bctx.restore();
    }else{
     const impactAge=age-m.duration,fade=Math.max(0,1-impactAge/35),radius=impactAge*2.5;
     if(fade>0){bctx.save();bctx.globalAlpha=fade;bctx.strokeStyle=m.color;bctx.lineWidth=3;bctx.shadowBlur=18;bctx.shadowColor=m.color;bctx.beginPath();bctx.arc(m.ex,m.ey,radius,0,Math.PI*2);bctx.stroke();for(let k=0;k<8;k++){const ang=k*Math.PI/4+impactAge*.025,dist=radius*.8;bctx.fillStyle=k%2?'#fff':m.color;bctx.beginPath();bctx.arc(m.ex+Math.cos(ang)*dist,m.ey+Math.sin(ang)*dist,2.2,0,Math.PI*2);bctx.fill()}bctx.restore()}
    }
   });
   // Full-screen prismatic supernova: expanding shockwave and colorful aerial bursts.
   const age=frame-12;
   if(age>=0&&age<76){
    const t=age/76,rad=t*Math.max(w,h)*.82;
    bctx.save();bctx.globalAlpha=(1-t)*.9;bctx.lineWidth=10*(1-t)+2;bctx.shadowBlur=32;bctx.shadowColor='#fff';
    const ring=bctx.createLinearGradient(w*.12,h*.2,w*.88,h*.8);
    ring.addColorStop(0,'#ff4bd8');ring.addColorStop(.22,'#ffe45c');ring.addColorStop(.45,'#5bfff0');ring.addColorStop(.7,'#5ca8ff');ring.addColorStop(1,'#c56bff');
    bctx.strokeStyle=ring;bctx.beginPath();bctx.arc(w/2,h*.43,rad,0,Math.PI*2);bctx.stroke();
    bctx.lineWidth=3;bctx.globalAlpha*=.72;bctx.beginPath();bctx.arc(w/2,h*.43,rad*.82,0,Math.PI*2);bctx.stroke();bctx.restore();
   }
   fireworks.forEach(f=>{
    const ft=frame-f.delay;if(ft<0||ft>48)return;const fade=Math.max(0,1-ft/48);
    bctx.save();bctx.globalAlpha=fade;bctx.shadowBlur=18;bctx.shadowColor=f.color;
    f.sparks.forEach(p=>{const dist=p.s*ft,x=f.x+Math.cos(p.a)*dist,y=f.y+Math.sin(p.a)*dist+ft*ft*.018;bctx.fillStyle=(p.r>2?'#fff':f.color);bctx.beginPath();bctx.arc(x,y,p.r*fade,0,Math.PI*2);bctx.fill()});
    bctx.strokeStyle=f.color;bctx.lineWidth=2;bctx.beginPath();bctx.arc(f.x,f.y,ft*2.8,0,Math.PI*2);bctx.stroke();bctx.restore();
   });
   bctx.globalAlpha=1;bctx.shadowBlur=0;
   if(++frame<190)requestAnimationFrame(paint);else bctx.clearRect(0,0,w,h);
  }
  paint();
 }
 btn.addEventListener('click',()=>{document.body.classList.remove('awake');void document.body.offsetWidth;document.body.classList.add('awake','revealed');sound();burstEffect();hint.textContent='RAINBOW CASCADE · PRISMATIC LIGHT · COLOR EXPLOSION';sub.textContent='A thousand colors burst into light.';btn.textContent='UNLEASH ANOTHER WAVE';setTimeout(()=>document.body.classList.remove('awake'),3600)});
})();
