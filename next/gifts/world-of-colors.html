<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03040d"><title>TikNation · The World of Colors</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040d;color:#fff;font-family:Arial,Helvetica,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 8%,#03040d55 56%,#03040df2 100%)}.ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8vh 20px max(28px,env(safe-area-inset-bottom));text-align:center;pointer-events:none}.brand{font-size:10px;letter-spacing:.48em;color:#d9d5f5;text-transform:uppercase;text-shadow:0 0 20px #9c7dff;opacity:.85;margin-bottom:12px}.title{font-size:clamp(32px,7vw,66px);font-weight:900;letter-spacing:.08em;line-height:.98;text-transform:uppercase;background:linear-gradient(100deg,#fff 0%,#ffb8ef 18%,#ffe6a0 34%,#9fffe1 52%,#a9caff 70%,#e3b2ff 88%,#fff);background-size:250% auto;color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 18px #bd8aff88);animation:shine 7s linear infinite}.sub{margin-top:12px;font-size:10px;letter-spacing:.32em;color:#d8d3ed;text-transform:uppercase}.action{pointer-events:auto;margin-top:22px;border:1px solid #e9dcff88;border-radius:99px;padding:14px 23px;background:linear-gradient(120deg,#ffffff1c,#ffffff08);color:#fff;letter-spacing:.18em;font-size:10px;font-weight:800;box-shadow:0 0 32px #a47bff55,inset 0 0 18px #fff1;backdrop-filter:blur(14px)}.action:active{transform:scale(.97)}.hint{position:absolute;top:max(22px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:9px;letter-spacing:.25em;color:#bcb6d9aa;text-transform:uppercase}@keyframes shine{to{background-position:250% center}}@media(prefers-reduced-motion:reduce){.title{animation:none}}
</style></head><body><canvas id="scene"></canvas><div class="shade"></div><div class="hint" id="hint">A new spectrum is waiting</div><main class="ui"><div class="brand">TikNation · A premium gift</div><div class="title">The World<br>of Colors</div><div class="sub" id="sub">More than color. Pure wonder.</div><button class="action" id="action">AWAKEN THE CRYSTAL</button></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false}),button=document.getElementById('action'),sub=document.getElementById('sub'),hint=document.getElementById('hint');
let W=0,H=0,D=1,particles=[],sparks=[],active=false,start=0,last=0,audio=null,burstCount=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function emit(n,power,spread=1){const cx=W*.5,cy=H*.43;for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=rand(power*.2,power)*spread;particles.push({x:cx+rand(-5,5),y:cy+rand(-5,5),vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,max:rand(1.4,3.5),r:rand(.6,2.7),h:rand(0,360),tw:rand(-.05,.05)})}}
function audioStart(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();audio.resume();const master=audio.createGain();master.gain.value=.48;master.connect(audio.destination);
function note(f,t,d,v,type='sine'){let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.07);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.04)}
let t=audio.currentTime;[261.6,329.6,392,523.3,659.3,784].forEach((f,i)=>note(f,t+i*.19,2.4,.055,'sine'));note(78,t+.9,1.4,.22,'sine');note(1174,t+1.35,1.2,.035,'triangle');note(1568,t+1.55,1.4,.022,'sine');
const noise=audio.createBufferSource(),buf=audio.createBuffer(1,audio.sampleRate*1.6,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);noise.buffer=buf;let filter=audio.createBiquadFilter(),gain=audio.createGain();filter.type='lowpass';filter.frequency.setValueAtTime(450,t+.8);filter.frequency.exponentialRampToValueAtTime(8500,t+1.5);gain.gain.setValueAtTime(.0001,t+.7);gain.gain.exponentialRampToValueAtTime(.22,t+1.15);gain.gain.exponentialRampToValueAtTime(.0001,t+2.25);noise.connect(filter);filter.connect(gain);gain.connect(master);noise.start(t+.7);
}
function crystal(cx,cy,scale,time){ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.sin(time*.00035)*.09);ctx.scale(scale,scale);
const facets=[[0,-1],[.53,-.56],[.43,.42],[0,1],[-.48,.42],[-.58,-.5]];
// outer glass silhouette
ctx.beginPath();ctx.moveTo(0,-112);ctx.lineTo(66,-58);ctx.lineTo(54,58);ctx.lineTo(0,112);ctx.lineTo(-58,52);ctx.lineTo(-68,-58);ctx.closePath();
let glass=ctx.createLinearGradient(-70,-90,75,90);glass.addColorStop(0,'rgba(245,250,255,.28)');glass.addColorStop(.24,'rgba(112,211,255,.08)');glass.addColorStop(.55,'rgba(247,155,255,.2)');glass.addColorStop(1,'rgba(255,255,255,.04)');ctx.fillStyle=glass;ctx.shadowColor='#b9eaff';ctx.shadowBlur=34;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(235,247,255,.86)';ctx.lineWidth=1.6;ctx.stroke();
// internal prismatic facets
const colors=['#ff65b8','#ffcf70','#83ffe0','#75caff','#c39aff','#ff82dc'];
for(let i=0;i<6;i++){let a=facets[i],b=facets[(i+1)%6];ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(a[0]*68,a[1]*110);ctx.lineTo(b[0]*68,b[1]*110);ctx.closePath();let g=ctx.createLinearGradient(0,-100,a[0]*70,a[1]*110);g.addColorStop(0,'rgba(255,255,255,.45)');g.addColorStop(.5,colors[i]+'55');g.addColorStop(1,'rgba(255,255,255,.025)');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(255,255,255,.36)';ctx.lineWidth=.8;ctx.stroke()}
ctx.beginPath();ctx.moveTo(-40,-56);ctx.lineTo(0,-4);ctx.lineTo(42,-57);ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=2;ctx.stroke();
ctx.beginPath();ctx.ellipse(-19,-39,8,29,-.5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill();
let core=ctx.createRadialGradient(0,0,1,0,0,48);core.addColorStop(0,'#fff');core.addColorStop(.13,'#fff4d4');core.addColorStop(.35,'#ff8de5aa');core.addColorStop(.7,'#7fdcff44');core.addColorStop(1,'transparent');ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,48,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(now){requestAnimationFrame(draw);let dt=clamp((now-(last||now))/16.67,.2,2);last=now;let age=active?(now-start)/1000:0,cx=W/2,cy=H*.43;ctx.fillStyle='#03040d';ctx.fillRect(0,0,W,H);
// distant colored atmosphere
let haze=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.64);haze.addColorStop(0,active?'rgba(104,55,161,.26)':'rgba(54,38,105,.18)');haze.addColorStop(.48,'rgba(25,28,74,.13)');haze.addColorStop(1,'rgba(3,4,13,0)');ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);
// volumetric light shafts
for(let i=0;i<13;i++){let x=cx+Math.sin(now*.00017+i*2.4)*W*.46,spread=10+Math.sin(now*.0004+i)*8;let g=ctx.createLinearGradient(x,cy-230,x+spread,cy+H*.48);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.48,'hsla('+((i*41+now*.018)%360)+',100%,68%,'+(active?.045:.018)+')');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-2,cy-220);ctx.lineTo(x+spread-2,cy-220);ctx.lineTo(x+spread+W*.12,cy+H*.55);ctx.lineTo(x-W*.12,cy+H*.55);ctx.fill()}
// slow orbital spectral ribbons
for(let j=0;j<5;j++){ctx.beginPath();for(let k=0;k<=100;k++){let p=k/100,a=p*Math.PI*2+now*.00022*(j%2?1:-1)+j*1.25,rx=Math.min(W,H)*(.17+j*.037),ry=rx*(.38+j*.025),x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry+Math.sin(a*2+now*.0004)*12;if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.strokeStyle='hsla('+((j*64+now*.025)%360)+',100%,70%,'+(active?.52:.25)+')';ctx.lineWidth=active?2.6:1.3;ctx.shadowBlur=active?22:12;ctx.shadowColor=ctx.strokeStyle;ctx.stroke()}ctx.shadowBlur=0;
// crystal grows then dissolves into the spectrum
let scale=active?1+Math.min(age/1.2,1)*.24:1+Math.sin(now*.001)*.025;if(active&&age>1.2)scale*=Math.max(.04,1-(age-1.2)*.42);if(!active||age<3.5)crystal(cx,cy,scale,now);
// bright core flash
if(active&&age>1.12&&age<1.8){let intensity=Math.sin((age-1.12)/.68*Math.PI),r=Math.max(W,H)*.48;let g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,'+(.8*intensity)+')');g.addColorStop(.12,'rgba(255,239,255,'+(.3*intensity)+')');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
if(active&&age>1.25&&age<1.3)emit(520,17,1.35);
if(active&&age>2.8&&age<2.85)emit(260,10,1.1);
// color orbit rings after detonation
if(active&&age>1.2){for(let i=0;i<9;i++){ctx.beginPath();let rr=(Math.min(W,H)*(.12+i*.045))*(1+Math.sin(age*1.8+i)*.035);ctx.ellipse(cx,cy,rr,rr*.36,age*.12+i*.3,0,Math.PI*2);ctx.strokeStyle='hsla('+((i*39+age*88)%360)+',100%,70%,'+Math.max(0,.5-(age-1.2)*.035)+')';ctx.lineWidth=2.2;ctx.shadowBlur=18;ctx.shadowColor=ctx.strokeStyle;ctx.stroke()}ctx.shadowBlur=0}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.991;p.vy=p.vy*.991+.012*dt;p.life-=dt/(p.max*60);if(p.life<=0){particles.splice(i,1);continue}ctx.beginPath();ctx.fillStyle='hsla('+p.h+',100%,75%,'+p.life+')';ctx.shadowBlur=13*p.life;ctx.shadowColor=ctx.fillStyle;ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;
}
requestAnimationFrame(draw);
button.addEventListener('click',()=>{if(!active){active=true;start=performance.now();audioStart();button.textContent='RELEASE MORE COLOR';hint.textContent='Tap again · unleash another prismatic wave';sub.textContent='Watch the spectrum come alive';emit(180,9);setTimeout(()=>emit(400,16,1.3),650)}else{burstCount++;emit(260,13,1.2);if(audio&&audio.state==='running'){let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(980,t+.65);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.11,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+1);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+1.05)}}});
})();
</script></body></html>
