<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08051a"><title>TikNation Gift · The World of Colors</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08051a;color:white;font-family:Arial,Helvetica,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%}.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,#08051a99 75%,#08051a 120%);pointer-events:none}.ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.42em;color:#c9bfff;text-transform:uppercase;margin-bottom:18px;text-shadow:0 0 18px #b99aff}.title{font-size:clamp(35px,8vw,76px);font-weight:900;letter-spacing:.055em;line-height:.98;background:linear-gradient(90deg,#ff5eae,#ffcf58,#75ffcb,#66c8ff,#bd8aff,#ff5eae);background-size:250% auto;color:transparent;background-clip:text;-webkit-background-clip:text;filter:drop-shadow(0 0 22px #bb72ff88);animation:flow 5s linear infinite}.sub{margin-top:18px;font-size:12px;letter-spacing:.25em;color:#e8e1ff;text-transform:uppercase}.start{pointer-events:auto;margin-top:32px;border:1px solid #d8c7ff88;border-radius:99px;padding:14px 24px;background:#ffffff12;color:white;letter-spacing:.16em;font-weight:700;box-shadow:0 0 30px #a36cff44;backdrop-filter:blur(10px)}.start:active{transform:scale(.97)}.hint{position:absolute;bottom:18px;font-size:10px;letter-spacing:.14em;color:#c7bbdf99;text-transform:uppercase}@keyframes flow{to{background-position:250% center}}.hide{opacity:0;transition:opacity 1s}.title.pop{animation:pop 1.2s cubic-bezier(.2,.8,.2,1) both,flow 5s linear infinite}@keyframes pop{0%{transform:scale(.35);opacity:0;filter:blur(18px)}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);filter:drop-shadow(0 0 22px #bb72ff88)}}
</style></head><body><canvas id="fx"></canvas><div class="vignette"></div><main class="ui"><div class="eyebrow">TikNation · Premium Gift</div><div class="title" id="title">THE WORLD<br>OF COLORS</div><div class="sub" id="sub">One spark. A universe of color.</div><button class="start" id="start">UNLEASH THE COLORS</button></main><div class="hint" id="hint">Tap to begin the experience · sound starts with your tap</div>
<script>
(()=>{const c=document.getElementById('fx'),x=c.getContext('2d'),title=document.getElementById('title'),sub=document.getElementById('sub'),btn=document.getElementById('start'),hint=document.getElementById('hint');let w,h,dpr,parts=[],running=false,t0=0,audio=null;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function burst(cx,cy,n,power){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=(.5+Math.random())*power;parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,size:1+Math.random()*3.8,hue:Math.random()*360,drag:.982+Math.random()*.014})}}
function tone(f,d,type='sine',vol=.035,delay=0){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime+delay);g.gain.setValueAtTime(.0001,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(vol,audio.currentTime+delay+.04);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+delay+d);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+d+.05)}
function sound(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();if(audio.state==='suspended')audio.resume();[392,523,659,784,1047].forEach((f,i)=>tone(f,1.4,'sine',.025,i*.16));tone(130,.8,'sine',.07,.65);setTimeout(()=>{for(let i=0;i<18;i++)tone(900+Math.random()*1500,.35,'sine',.012,1.1+i*.045)},600)}
function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-(frame.last||now))/16.67,2);frame.last=now;x.clearRect(0,0,w,h);let cx=w/2,cy=h/2,age=running?(now-t0)/1000:0;
let bg=x.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.75);bg.addColorStop(0,'#241044');bg.addColorStop(.5,'#100a29');bg.addColorStop(1,'#08051a');x.fillStyle=bg;x.fillRect(0,0,w,h);
if(running){let radius=Math.min(w,h)*(.06+Math.min(age/2.2,1)*.68);for(let k=0;k<7;k++){x.beginPath();x.ellipse(cx,cy,radius*(1+k*.075),radius*(.35+k*.06),age*.22+k*.13,0,Math.PI*2);x.strokeStyle='hsla('+((age*85+k*48)%360)+',100%,68%,'+(0.48-k*.045)+')';x.lineWidth=2.5-k*.18;x.shadowBlur=22;x.shadowColor=x.strokeStyle;x.stroke()}x.shadowBlur=0;
if(age<2.7){let r=age*42;let grad=x.createRadialGradient(cx,cy,0,cx,cy,r+2);grad.addColorStop(0,'#fff');grad.addColorStop(.12,'#fff9c7');grad.addColorStop(.4,'#ff8de6');grad.addColorStop(1,'#7a4dff00');x.fillStyle=grad;x.beginPath();x.arc(cx,cy,r+2,0,Math.PI*2);x.fill()}
if(age>1.4&&age<1.5)burst(cx,cy,260,12);if(age>3.2&&age<3.3)burst(cx,cy,220,9);
}
for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=p.drag;p.vy*=p.drag;p.life-=.008*dt;if(p.life<=0){parts.splice(i,1);continue}x.beginPath();x.fillStyle='hsla('+p.hue+',100%,70%,'+p.life+')';x.shadowBlur=14;x.shadowColor=x.fillStyle;x.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);x.fill()}x.shadowBlur=0;
if(running&&age>1.3&&age<1.4){title.classList.add('pop');sub.textContent='A thousand colors. One unforgettable moment.'}
}
requestAnimationFrame(frame);
btn.addEventListener('click',()=>{if(running){burst(w/2,h/2,120,8);return}running=true;t0=performance.now();sound();btn.textContent='SEND A COLOR BURST';hint.textContent='Tap again to trigger another burst';burst(w/2,h/2,160,10);setTimeout(()=>burst(w/2,h/2,220,13),650);});
})();
</script></body></html>
