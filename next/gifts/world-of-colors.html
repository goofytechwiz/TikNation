<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08051c">
<title>TikNation · The World of Colors</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#08051c;color:#fff;font-family:Arial,Helvetica,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;z-index:2;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:20px 16px max(26px,env(safe-area-inset-bottom));pointer-events:none}
.hint{position:absolute;top:max(20px,env(safe-area-inset-top));left:12px;right:12px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#e5dcff;text-shadow:0 0 12px #a66bff}
.brand{font-size:9px;letter-spacing:.4em;color:#e8dfff;margin-bottom:10px}
.title{font-size:clamp(30px,7vw,58px);font-weight:900;line-height:.95;letter-spacing:.08em;color:#fff;text-shadow:0 0 14px #c58bff,0 0 32px #6a9dff}
.sub{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:#e8e1ff;margin-top:10px}
button{pointer-events:auto;margin-top:18px;border:1px solid #fff9;border-radius:99px;padding:15px 25px;background:linear-gradient(110deg,#833dff,#10bddd,#dc45cb);color:white;font-weight:900;font-size:10px;letter-spacing:.14em;box-shadow:0 0 25px #9d69ff99;cursor:pointer}
button:active{transform:scale(.97)}
@media(max-height:620px){.ui{padding-bottom:12px}.title{font-size:clamp(25px,6vw,42px)}button{margin-top:10px;padding:12px 20px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Animated rainbow crystal waterfall garden"></canvas>
<main class="ui">
<div class="hint" id="hint">A universe of color is awakening</div>
<div class="brand">TikNation · Premium Gift</div>
<div class="title">THE WORLD<br>OF COLORS</div>
<div class="sub" id="sub">A living crystal of infinite color</div>
<button id="action" type="button">AWAKEN THE PRISM</button>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const button=document.getElementById('action'),hint=document.getElementById('hint'),sub=document.getElementById('sub');
let w=0,h=0,dpr=1,last=0,elapsed=0,awakeUntil=0,particles=[],audio=null;
const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random()*.75,r:.4+Math.random()*1.4,p:Math.random()*6.28}));
function resize(){
 const b=canvas.getBoundingClientRect();w=Math.max(1,b.width);h=Math.max(1,b.height);
 dpr=Math.min(window.devicePixelRatio||1,1.35);
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
function path(points,fill,stroke,lineWidth=1){
 ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
 if(fill){ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lineWidth;ctx.stroke()}
}
function drawWaterfall(x,width,t,flip){
 const top=h*.13,bottom=h*.83,phase=flip?2.1:0;
 const grad=ctx.createLinearGradient(x,top,x+width,bottom);
 grad.addColorStop(0,'rgba(77,181,255,.08)');grad.addColorStop(.28,'rgba(116,225,255,.72)');
 grad.addColorStop(.58,'rgba(226,255,255,.82)');grad.addColorStop(1,'rgba(42,151,255,.18)');
 ctx.beginPath();ctx.moveTo(x,top);
 for(let y=top;y<=bottom;y+=12){const f=(y-top)/(bottom-top);ctx.lineTo(x+Math.sin(t*1.8+f*8+phase)*width*.12,y)}
 for(let y=bottom;y>=top;y-=12){const f=(y-top)/(bottom-top);ctx.lineTo(x+width+Math.sin(t*1.6+f*9+phase+1)*width*.1,y)}
 ctx.closePath();ctx.fillStyle=grad;ctx.fill();
 for(let i=0;i<15;i++){
  const xx=x+width*(i+.5)/15,off=(t*(65+(i%5)*18)+i*39+phase*30)%(bottom-top+45);
  const yy=top+off;
  ctx.beginPath();ctx.moveTo(xx,top);ctx.bezierCurveTo(xx+Math.sin(t*2+i)*width*.1,top+bottom*.25,xx+Math.cos(t*2.4+i)*width*.08,yy-30,xx+Math.sin(t*3+i)*width*.06,yy);
  ctx.strokeStyle=i%4===0?'rgba(255,255,255,.85)':'rgba(190,244,255,.48)';ctx.lineWidth=i%3===0?2.5:1;ctx.stroke();
 }
 // White turbulence at the foot of the cascade.
 for(let i=0;i<22;i++){
  const px=x+width*(i+.5)/22+Math.sin(t*2+i)*5,py=bottom+Math.sin(t*4+i*1.7)*7;
  ctx.beginPath();ctx.ellipse(px,py,2+((i*7)%5),1.5+((i*3)%3),0,0,Math.PI*2);
  ctx.fillStyle='rgba(240,255,255,.75)';ctx.fill();
 }
}
function drawFlower(x,y,size,color,t,delay){
 const pulse=.82+.18*Math.sin(t*1.8+delay);
 ctx.save();ctx.translate(x,y);ctx.scale(pulse,pulse);
 // stem and two leaves
 ctx.strokeStyle='#70e8c2';ctx.lineWidth=Math.max(2,size*.055);ctx.beginPath();ctx.moveTo(0,size*.15);ctx.quadraticCurveTo(-size*.1,size*.65,0,size*1.5);ctx.stroke();
 ctx.fillStyle='#48dba8';
 ctx.beginPath();ctx.ellipse(-size*.19,size*.85,size*.2,size*.08,-.5,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.ellipse(size*.17,size*1.12,size*.2,size*.08,.5,0,Math.PI*2);ctx.fill();
 for(let i=0;i<6;i++){
  ctx.save();ctx.rotate(i*Math.PI/3);
  const pg=ctx.createRadialGradient(0,-size*.08,1,0,-size*.2,size*.38);
  pg.addColorStop(0,'#fff');pg.addColorStop(.35,color);pg.addColorStop(1,'rgba(100,80,255,.2)');
  ctx.fillStyle=pg;ctx.shadowColor=color;ctx.shadowBlur=12;
  ctx.beginPath();ctx.ellipse(0,-size*.2,size*.13,size*.31,0,0,Math.PI*2);ctx.fill();ctx.restore();
 }
 ctx.shadowColor=color;ctx.shadowBlur=16;ctx.fillStyle='#fff5b5';ctx.beginPath();ctx.arc(0,0,size*.11,0,Math.PI*2);ctx.fill();
 // Rising pollen motes
 for(let i=0;i<4;i++){
  const rise=(t*19+i*23+delay*11)%58;
  ctx.globalAlpha=1-rise/65;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(Math.sin(t*2+i*4)*size*.35, -rise-size*.1,1.2,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function drawCrystal(cx,cy,size,t){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.sin(t*.55)*.035);
 const pts=[[0,-size],[size*.67,-size*.48],[size*.58,size*.55],[0,size],[-size*.58,size*.55],[-size*.67,-size*.48]];
 const glow=ctx.createRadialGradient(0,0,2,0,0,size*1.2);
 glow.addColorStop(0,'rgba(255,255,255,.42)');glow.addColorStop(.45,'rgba(89,224,255,.16)');glow.addColorStop(1,'rgba(170,65,255,0)');
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,size*1.2,0,Math.PI*2);ctx.fill();
 const g=ctx.createLinearGradient(-size,-size,size,size);
 g.addColorStop(0,'#ff58d9');g.addColorStop(.24,'#ffd96b');g.addColorStop(.48,'#56ffe0');g.addColorStop(.72,'#48aaff');g.addColorStop(1,'#a45cff');
 path(pts,g,'rgba(255,255,255,.9)',2);
 path([[0,-size],[0,size],[-size*.67,-size*.48]],'rgba(255,255,255,.22)');
 path([[0,-size],[size*.67,-size*.48],[0,size]],'rgba(255,255,255,.14)');
 path([[-size*.67,-size*.48],[0,0],[-size*.58,size*.55]],'rgba(255,85,220,.22)');
 path([[size*.67,-size*.48],[0,0],[size*.58,size*.55]],'rgba(80,240,255,.3)');
 const core=ctx.createRadialGradient(0,0,1,0,0,size*.42);
 core.addColorStop(0,'#fff');core.addColorStop(.22,'#baffff');core.addColorStop(.58,'#ff80ed');core.addColorStop(1,'rgba(145,76,255,0)');
 ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,size*.42,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function draw(now){
 if(!last)last=now;const dt=Math.min(.04,(now-last)/1000);last=now;elapsed+=dt;const t=elapsed;
 const awake=t<awakeUntil;
 const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#09051f');bg.addColorStop(.52,'#21104b');bg.addColorStop(1,'#071b3c');
 ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 const sky=ctx.createRadialGradient(w*.5,h*.35,0,w*.5,h*.35,w*.65);
 sky.addColorStop(0,'rgba(110,60,190,.36)');sky.addColorStop(1,'rgba(15,10,50,0)');
 ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
 stars.forEach(s=>{ctx.globalAlpha=.35+.55*(.5+.5*Math.sin(t*1.7+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
 // Soft aurora bands
 for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(0,h*(.2+i*.09));ctx.bezierCurveTo(w*.28,h*(.02+Math.sin(t*.3+i)*.09),w*.68,h*(.34+Math.cos(t*.4+i)*.08),w,h*(.12+i*.1));ctx.strokeStyle=['rgba(50,240,255,.11)','rgba(225,70,255,.1)','rgba(92,255,190,.08)'][i];ctx.lineWidth=30;ctx.stroke()}
 // Rainbow arch behind the prism
 ctx.save();ctx.lineWidth=Math.max(7,w*.012);const colors=['#ff526e','#ffb94e','#fff16b','#57efaa','#4bdfff','#8771ff','#e46bff'];
 colors.forEach((col,i)=>{ctx.beginPath();ctx.ellipse(w*.5,h*.49,w*(.24+i*.012),h*(.25+i*.012),0,Math.PI*1.08,Math.PI*1.92);ctx.strokeStyle=col;ctx.globalAlpha=.62;ctx.shadowColor=col;ctx.shadowBlur=12;ctx.stroke()});ctx.restore();ctx.globalAlpha=1;ctx.shadowBlur=0;
 const side=Math.max(46,Math.min(w*.105,145));
 drawWaterfall(w*.035,side,t,false);drawWaterfall(w*.93-side,side,t,true);
 // Pool and ripples
 const water=ctx.createLinearGradient(0,h*.79,0,h);
 water.addColorStop(0,'rgba(198,250,255,.7)');water.addColorStop(.16,'rgba(45,164,220,.76)');water.addColorStop(1,'rgba(5,20,65,.96)');
 ctx.fillStyle=water;ctx.beginPath();ctx.ellipse(w*.5,h*.94,w*.67,h*.14,0,0,Math.PI*2);ctx.fill();
 for(let i=0;i<10;i++){const rx=(.12+i*.065)*w,ry=4+i*1.8;ctx.beginPath();ctx.ellipse(w*.5,h*.88,rx,ry,0,0,Math.PI*2);ctx.strokeStyle='rgba(208,252,255,'+(.35-i*.025)+')';ctx.lineWidth=1.4;ctx.stroke()}
 // Crystal garden along the banks
 drawFlower(w*.13,h*.77,Math.min(35,w*.055),'#ff6cdb',t,1);
 drawFlower(w*.24,h*.82,Math.min(25,w*.04),'#5cf4ff',t,3);
 drawFlower(w*.78,h*.81,Math.min(26,w*.042),'#ffe778',t,2);
 drawFlower(w*.88,h*.76,Math.min(36,w*.055),'#b69aff',t,4);
 // Main crystal remains clear of the bottom UI.
 drawCrystal(w*.5,h*(h<620?.39:.43),Math.min(w*.145,h*.19,118),t);
 // Floating small crystals
 for(let i=0;i<4;i++){const a=t*.35+i*Math.PI/2,x=w*.5+Math.cos(a)*w*.27,y=h*.43+Math.sin(a*1.4)*h*.16;ctx.save();ctx.translate(x,y);ctx.rotate(t+i);ctx.fillStyle=['#ff79df','#6ffaff','#ffe77b','#a78aff'][i];ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=15;ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(7,0);ctx.lineTo(0,10);ctx.lineTo(-6,0);ctx.closePath();ctx.fill();ctx.restore()}
 // Awakening particles
 particles=particles.filter(p=>p.life>0);
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=18*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});
 ctx.globalAlpha=1;ctx.shadowBlur=0;
 if(awake){const k=1-(awakeUntil-t)/2.6;ctx.strokeStyle='rgba(255,255,255,'+Math.max(0,1-k)+')';ctx.lineWidth=5;ctx.beginPath();ctx.arc(w*.5,h*.43,k*Math.max(w,h)*.7,0,Math.PI*2);ctx.stroke()}
 requestAnimationFrame(draw);
}
function playSound(){
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{audio=audio||new AC();audio.resume();const notes=[261.6,329.6,392,523.25,659.25,783.99,1046.5];
 notes.forEach((f,i)=>{const osc=audio.createOscillator(),gain=audio.createGain(),at=audio.currentTime+i*.12;osc.type='sine';osc.frequency.setValueAtTime(f,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.035,at+.04);gain.gain.exponentialRampToValueAtTime(.0001,at+1.25);osc.connect(gain);gain.connect(audio.destination);osc.start(at);osc.stop(at+1.3)});
 }catch(e){/* Sound is optional; visuals continue. */}
}
button.addEventListener('click',()=>{
 const now=elapsed;awakeUntil=now+2.6;particles=[];
 const colors=['#fff','#ff62d9','#ffe36a','#5dfff0','#65baff','#b58aff'];
 for(let i=0;i<150;i++){const a=Math.random()*Math.PI*2,s=45+Math.random()*230;particles.push({x:w*.5,y:h*.43,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1.2+Math.random()*1.6,max:2.8,r:1+Math.random()*3,color:colors[i%colors.length]})}
 playSound();hint.textContent='PRISM AWAKENED · COLOR CASCADE';sub.textContent='A thousand colors burst into light';button.textContent='AWAKEN THE PRISM AGAIN';
});
window.addEventListener('resize',resize,{passive:true});
resize();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
