</style></head><body><canvas id="world"></canvas><div class="veil"></div><div class="hint" id="hint">A prism is forming in the dark</div><main class="ui"><div class="brand">TikNation · Premium Gift</div><div class="title">THE WORLD<br>OF COLORS</div><div class="sub" id="sub">A universe held inside a crystal</div><button class="action" id="action">AWAKEN THE PRISM</button></main>
