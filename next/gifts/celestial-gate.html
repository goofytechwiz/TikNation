<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070817"><title>TikNation · The Celestial Gate</title>
<style>
:root{color-scheme:dark;--cyan:#8df5ff;--gold:#ffe4a0;--violet:#b99aff}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#1a2453 0,#0a102a 34%,#050611 72%);color:#f8f7ff;font:15px/1.5 system-ui,sans-serif}.stars{position:fixed;inset:0;width:100%;height:100%;z-index:0}.scene{position:relative;z-index:1;min-height:100svh;display:grid;place-items:center;padding:24px}.portal-wrap{width:min(82vw,540px);aspect-ratio:1;position:relative;display:grid;place-items:center;filter:drop-shadow(0 0 24px #66dfff77)}.portal{position:absolute;width:58%;height:78%;border-radius:50%;border:5px solid #9cf7ff;box-shadow:0 0 12px #7beeff,0 0 34px #49aaff, inset 0 0 26px #83eaff,0 0 90px #725aff88;transform:rotate(24deg);animation:turn 16s linear infinite}.portal:before,.portal:after{content:"";position:absolute;inset:-17px;border-radius:50%;border:2px solid #d8c3ff;box-shadow:0 0 18px #a48aff;transform:rotate(55deg) scaleX(.82)}.portal:after{inset:-31px;border-color:#ffe8a8;transform:rotate(-35deg) scaleX(.72);opacity:.75}.core{position:absolute;width:48%;height:67%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#fff 0,#c5faff 5%,#73d9ff 16%,#7d65e9 38%,#171d52 68%,#070817 100%);box-shadow:0 0 38px #74eaff,0 0 100px #7062ff;animation:breathe 3s ease-in-out infinite alternate}.core:after{content:"";position:absolute;inset:10%;border-radius:50%;background:repeating-conic-gradient(from 0deg,transparent 0 8deg,#d9faff55 9deg 10deg,transparent 11deg 22deg);animation:turn 22s linear infinite}.orbit{position:absolute;width:100%;height:36%;border:2px solid #b6faffaa;border-radius:50%;transform:rotate(-28deg);box-shadow:0 0 20px #78eaff;animation:turn 12s linear infinite}.orbit.two{width:110%;height:25%;transform:rotate(42deg);border-color:#ffd994aa;animation-direction:reverse;animation-duration:18s}.beam{position:absolute;width:3px;height:115%;background:linear-gradient(transparent,#b9faff,transparent);filter:blur(3px);animation:flash 2.8s infinite}.beam.b2{transform:rotate(60deg);animation-delay:.8s}.beam.b3{transform:rotate(-60deg);animation-delay:1.5s}.copy{position:absolute;bottom:7%;text-align:center;width:100%;text-shadow:0 2px 18px #000}.eyebrow{letter-spacing:.28em;color:var(--cyan);font-size:.72rem;font-weight:800}.copy h1{font-size:clamp(2.2rem,8vw,4.5rem);line-height:.95;letter-spacing:-.06em;margin:10px 0}.copy p{color:#c5c5e7;margin:12px auto;max-width:520px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button,.back{border:1px solid #82eaff88;background:#101b3b;color:white;border-radius:999px;padding:12px 18px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none}.actions button.primary{background:linear-gradient(100deg,#2478a9,#6652b9);border-color:#c0f8ff}.actions button:active{transform:scale(.97)}.note{position:absolute;top:18px;left:18px;color:#a9a8c8;font-size:.75rem}@keyframes turn{to{transform:rotate(384deg)}}@keyframes breathe{to{transform:scale(1.07);filter:brightness(1.3)}}@keyframes flash{0%,100%{opacity:.15}45%{opacity:.85}}@media(max-width:600px){.portal-wrap{width:96vw}.copy{bottom:5%}.copy p{max-width:310px;font-size:.9rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:20s!important;transition:none!important}}
</style></head><body><canvas class="stars" id="stars"></canvas><main class="scene"><a class="back" style="position:absolute;top:18px;left:18px" href="./">← Gift Gallery</a><div class="portal-wrap" aria-label="Animated celestial gateway"><div class="beam"></div><div class="beam b2"></div><div class="beam b3"></div><div class="core"></div><div class="portal"></div><div class="orbit"></div><div class="orbit two"></div></div><section class="copy"><div class="eyebrow">TIKNATION LIVE · MYTHIC PREVIEW</div><h1>THE CELESTIAL GATE</h1><p>A gateway between worlds. A storm of stars. One brilliant arrival.</p><div class="actions"><button class="primary" id="awaken">✦ AWAKEN THE GATE</button><button id="sound">♫ SOUND: OFF</button></div></section><div class="note">GIFT EXPERIENCE · PREVIEW ONLY</div></main>
<script>
const c=document.getElementById('stars'),ctx=c.getContext('2d');let w,h,stars=[],bursts=[],raf;function resize(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;stars=Array.from({length:150},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.3,a:Math.random()*.8+.2,s:Math.random()*.35+.08}))}addEventListener('resize',resize);resize();function draw(){ctx.clearRect(0,0,w,h);for(const s of stars){s.y+=s.s*devicePixelRatio;if(s.y>h)s.y=0;ctx.globalAlpha=s.a;ctx.fillStyle='#d8f8ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r*devicePixelRatio,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;bursts=bursts.filter(b=>b.life>0);for(const b of bursts){b.life--;for(let i=0;i<34;i++){const a=i*Math.PI*2/34+b.rot,rr=(1-b.life/50)*b.max;ctx.globalAlpha=b.life/50;ctx.fillStyle=i%3?'#9df6ff':'#ffe2a1';ctx.beginPath();ctx.arc(b.x+Math.cos(a)*rr,b.y+Math.sin(a)*rr,2.2*devicePixelRatio,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;raf=requestAnimationFrame(draw)}draw();function burst(){bursts.push({x:w/2,y:h*.46,life:50,max:Math.min(w,h)*.46,rot:Math.random()});document.querySelector('.core').animate([{filter:'brightness(2.5)',transform:'scale(1.18)'},{filter:'brightness(1)',transform:'scale(1)'}],{duration:900,easing:'ease-out'})}document.getElementById('awaken').onclick=burst;let audio=null,osc=[];document.getElementById('sound').onclick=()=>{const btn=document.getElementById('sound');if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();[110,165,220].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.018/(i+1);o.connect(g).connect(audio.destination);o.start();osc.push({o,g})});btn.textContent='♫ SOUND: ON'}else{osc.forEach(x=>{x.o.stop();x.g.disconnect()});osc=[];audio.close();audio=null;btn.textContent='♫ SOUND: OFF'}};setTimeout(burst,700);
</script></body></html>
