<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070912">
<title>TikNation · The Celestial Gate</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070912;color:#f5f2eb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#scene{position:fixed;inset:0;width:100%;height:100%}.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(0deg,#05070d 0%,#05070d00 34%,#05070d22 70%,#05070d99 100%),radial-gradient(ellipse at 50% 43%,transparent 25%,#02040bd9 100%)}.top{position:fixed;z-index:3;top:max(14px,env(safe-area-inset-top));left:14px}.back,.actions button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 17px;border-radius:999px;border:1px solid #b9c7d65c;background:#0a111dcc;color:#f4f3ef;text-decoration:none;font-weight:750;font-size:12px;letter-spacing:.04em;backdrop-filter:blur(14px);cursor:pointer}.status{position:fixed;right:16px;top:max(25px,env(safe-area-inset-top));z-index:3;font-size:9px;letter-spacing:.22em;color:#c2b48c;text-align:right}.panel{position:fixed;z-index:2;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;padding:0 16px;text-shadow:0 2px 20px #000}.kicker{font-size:10px;letter-spacing:.32em;color:#d5c18c;font-weight:800}.panel h1{font-family:Georgia,serif;font-weight:500;letter-spacing:.045em;font-size:clamp(30px,7vw,58px);line-height:1.02;margin:8px 0 7px}.panel p{color:#c4c6ce;font-size:13px;margin:0 auto 14px;max-width:480px}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.actions .awaken{background:linear-gradient(115deg,#8c6630,#c5a96a 48%,#72512e);border-color:#ead49a;color:#100e0a;box-shadow:0 0 25px #d5b16b44}.actions button:active{transform:scale(.97)}.hint{font-size:9px;color:#9da5b5;margin-top:9px;letter-spacing:.08em}@media(max-height:650px){.panel{bottom:9px}.panel h1{font-size:clamp(25px,5vw,40px)}.panel p{margin-bottom:8px}.hint{display:none}}@media(prefers-reduced-motion:reduce){.status:after{content:" · REDUCED MOTION"}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A monumental ancient gateway standing in a cosmic desert"></canvas><div class="shade"></div>
<div class="top"><a class="back" href="./">← GIFT GALLERY</a></div><div class="status">TIKNATION LIVE<br>MYTHIC RELIC · PREVIEW</div>
<section class="panel"><div class="kicker">AN ANCIENT POWER STIRS</div><h1>THE CELESTIAL GATE</h1><p>Beyond the last horizon, a forgotten world is waiting.</p><div class="actions"><button class="awaken" id="awaken">✦ OPEN THE GATE</button><button id="sound">♫ SOUND OFF</button></div><div class="hint" id="hint">ENABLE SOUND FOR THE FULL CINEMATIC EXPERIENCE</div></section>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let w=0,h=0,dpr=1,time=0,opening=0,flash=0,stars=[],embers=[],audio=null,master=null,ambience=[],soundOn=false;
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:210},()=>({x:Math.random()*w,y:Math.random()*h*.72,r:rand(.35,1.5),p:rand(0,6.28)}));embers=Array.from({length:100},()=>({x:rand(0,w),y:rand(h*.38,h),v:rand(.12,.65),s:rand(.6,2),p:rand(0,6.28)}))}
addEventListener('resize',resize);resize();
function polygon(points,fill,stroke,line=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function stoneBlock(x,y,bw,bh,light='#5c5c60'){const g=ctx.createLinearGradient(x,y,x+bw,y+bh);g.addColorStop(0,'#8d8980');g.addColorStop(.24,light);g.addColorStop(.7,'#353a43');g.addColorStop(1,'#171e2b');ctx.fillStyle=g;ctx.fillRect(x,y,bw,bh);ctx.strokeStyle='#c4b99866';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,bw-1,bh-1);ctx.strokeStyle='#0a0e18aa';ctx.beginPath();ctx.moveTo(x+4,y+bh*.72);ctx.lineTo(x+bw*.36,y+bh*.68);ctx.moveTo(x+bw*.68,y+bh*.25);ctx.lineTo(x+bw-4,y+bh*.3);ctx.stroke()}
function draw(){time+=reduced?.0025:.009;ctx.clearRect(0,0,w,h);
const horizon=h*.57,cx=w*.5,unit=Math.min(w/760,h/700),gw=Math.min(w*.42,290)*Math.min(1,unit*1.5),gh=Math.min(h*.48,350)*Math.min(1,unit*1.5),top=horizon-gh;
const sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#080c1b');sky.addColorStop(.52,'#172039');sky.addColorStop(1,'#685344');ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon);
// distant moon and layered mountains
const moonX=w*.77,moonY=h*.2,moonR=Math.min(w,h)*.075;const mg=ctx.createRadialGradient(moonX-moonR*.25,moonY-moonR*.3,1,moonX,moonY,moonR*1.6);mg.addColorStop(0,'#f1e5c9');mg.addColorStop(.48,'#b9b4aa');mg.addColorStop(1,'#7b829655');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(moonX,moonY,moonR,0,6.283);ctx.fill();
polygon([[0,horizon],[w*.13,h*.39],[w*.24,h*.52],[w*.37,h*.36],[w*.52,horizon]],'#20283b');polygon([[w*.42,horizon],[w*.59,h*.4],[w*.7,h*.51],[w*.86,h*.34],[w,h*.52],[w,horizon]],'#293043');polygon([[0,horizon],[w*.2,h*.48],[w*.34,horizon]],'#303342');polygon([[w*.69,horizon],[w*.83,h*.46],[w,horizon]],'#252b3a');
// warm horizon haze
const haze=ctx.createRadialGradient(cx,horizon,1,cx,horizon,w*.65);haze.addColorStop(0,'#c38c5b3c');haze.addColorStop(1,'transparent');ctx.fillStyle=haze;ctx.fillRect(0,h*.25,w,h*.55);
for(const s of stars){ctx.globalAlpha=.25+.7*(.5+.5*Math.sin(time*2+s.p));ctx.fillStyle='#e9e3d5';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;
// desert floor with perspective tracks
const ground=ctx.createLinearGradient(0,horizon,0,h);ground.addColorStop(0,'#514237');ground.addColorStop(.35,'#28262b');ground.addColorStop(1,'#0b101a');ctx.fillStyle=ground;ctx.fillRect(0,horizon,w,h-horizon);
for(let i=0;i<13;i++){const yy=horizon+Math.pow(i/13,1.7)*(h-horizon);ctx.strokeStyle='#c3a17b'+(i<4?'20':'12');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w,yy);ctx.stroke()}
for(let i=-8;i<=8;i++){ctx.strokeStyle='#c2a17b18';ctx.beginPath();ctx.moveTo(cx+i*gw*.12,horizon);ctx.lineTo(cx+i*w*.18,h);ctx.stroke()}
// gate silhouette and deep inner aperture
const left=cx-gw*.5,right=cx+gw*.5;
ctx.save();ctx.shadowColor='#8bd9e8';ctx.shadowBlur=opening>0?24+opening*22:8;
const portal=ctx.createRadialGradient(cx,top+gh*.48,4,cx,top+gh*.48,gw*.55);portal.addColorStop(0,'#f5d9a8');portal.addColorStop(.18,'#8bd5e9');portal.addColorStop(.48,'#315b83');portal.addColorStop(.78,'#121c38');portal.addColorStop(1,'#070b17');
ctx.fillStyle=portal;ctx.beginPath();ctx.ellipse(cx,top+gh*.49,gw*.34,gh*.42,0,0,6.283);ctx.fill();ctx.restore();
// portal spirals emerge as gate wakes
ctx.save();ctx.translate(cx,top+gh*.49);ctx.beginPath();ctx.ellipse(0,0,gw*.34,gh*.42,0,0,6.283);ctx.clip();for(let i=0;i<11;i++){ctx.save();ctx.rotate(time*(i%2?1:-.7)+i*.58);ctx.beginPath();ctx.ellipse(0,0,gw*(.09+i*.028),gh*(.1+i*.034),0,-1.1,2.5);ctx.strokeStyle=i%2?'#c5e8e9a0':'#e4c58c88';ctx.lineWidth=1+i%3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=13;ctx.stroke();ctx.restore()}const core=ctx.createRadialGradient(0,0,2,0,0,gh*.35);core.addColorStop(0,'#fff4dc88');core.addColorStop(.25,'#c0e9ed55');core.addColorStop(1,'transparent');ctx.fillStyle=core;ctx.fillRect(-gw,-gh,gw*2,gh*2);ctx.restore();
// monumental flanking columns with block masonry
const colW=Math.max(25,gw*.16),colY=top+gh*.1,colH=gh*.9;
stoneBlock(left-colW*.8,colY,colW,colH,'#6b6b69');stoneBlock(right-colW*.2,colY,colW,colH,'#6b6b69');
for(let side=0;side<2;side++){const x=side?right-colW*.2:left-colW*.8;for(let k=0;k<5;k++){const by=colY+k*colH/5;stoneBlock(x,by,colW,colH/5,'#65666a');ctx.fillStyle='#c9b98d55';ctx.fillRect(x+3,by+2,colW-6,2)}}
// massive lintel, layered carved arch crown
stoneBlock(left-colW*.88,top,colW*2.76,gh*.12,'#77746d');
ctx.fillStyle='#9d9076';ctx.fillRect(left-colW*.9,top+gh*.095,gw+colW*1.8,gh*.035);
ctx.strokeStyle='#d9c79a';ctx.lineWidth=Math.max(2,gw*.012);ctx.beginPath();ctx.moveTo(left+colW*.1,top+gh*.16);ctx.quadraticCurveTo(cx,top-gh*.1,right-colW*.1,top+gh*.16);ctx.stroke();
ctx.strokeStyle='#c8b98e77';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(left+colW*.12,top+gh*.19);ctx.quadraticCurveTo(cx,top-gh*.045,right-colW*.12,top+gh*.19);ctx.stroke();
// engraved circular crest
ctx.save();ctx.translate(cx,top+gh*.035);ctx.strokeStyle='#d6c49a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,gw*.085,0,6.283);ctx.stroke();ctx.beginPath();ctx.arc(0,0,gw*.055,0,6.283);ctx.stroke();for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(0,-gw*.055);ctx.lineTo(0,-gw*.08);ctx.stroke()}ctx.restore();
// side buttresses and glowing runic seams
for(let side=0;side<2;side++){const x=side?right:left;ctx.fillStyle='#202a37';ctx.fillRect(side?x-colW*.18:x-colW*.3,colY+colH*.2,colW*.3,colH*.72);for(let j=0;j<4;j++){const yy=colY+colH*(.25+j*.17);ctx.fillStyle='#d9c28a';ctx.globalAlpha=.35+.35*Math.sin(time*2+j);ctx.fillRect(side?x-colW*.12:x-colW*.18,yy,4,gh*.035)}ctx.globalAlpha=1}
// stairway into the portal, trapezoid perspective
for(let i=0;i<6;i++){const y=horizon+gh*.045+i*gh*.037,spread=gw*(.22+i*.075);polygon([[cx-spread,y],[cx+spread,y],[cx+spread+gw*.035,y+gh*.035],[cx-spread-gw*.035,y+gh*.035]],i%2?'#48464a':'#625a50','#bba98a66',1);ctx.strokeStyle='#d4c3a155';ctx.beginPath();ctx.moveTo(cx-spread,y);ctx.lineTo(cx+spread,y);ctx.stroke()}
// ground cracks and scattered ancient stones
for(let i=0;i<28;i++){const x=(i*97%w),y=horizon+((i*43%100)/100)*(h-horizon);ctx.fillStyle=i%2?'#777064':'#272b33';ctx.beginPath();ctx.ellipse(x,y,randStatic(i,4,13),randStatic(i,2,5),.2,0,6.283);ctx.fill()}
// animated sparks drifting across the foreground
for(const e of embers){e.y-=e.v*(reduced?.2:1);e.x+=Math.sin(time+e.p)*.18;if(e.y<horizon-gh*.12){e.y=h+rand(0,80);e.x=rand(0,w)}ctx.globalAlpha=.18+.5*(.5+.5*Math.sin(time*3+e.p));ctx.fillStyle=e.p>3?'#e7c17b':'#9ee9ed';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(e.x,e.y,e.s,0,6.283);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;
// active gate energy crawls around the stone frame
if(opening>0){for(let i=0;i<8;i++){const a=time*1.3+i*Math.PI/4,x=cx+Math.cos(a)*gw*.48,y=top+gh*.48+Math.sin(a)*gh*.47;ctx.fillStyle=i%2?'#c3f5f2':'#f0d49a';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(x,y,2+opening*2,0,6.283);ctx.fill()}ctx.shadowBlur=0}
if(flash>0){ctx.fillStyle='#fff0d9';ctx.globalAlpha=flash*.55;ctx.fillRect(0,0,w,h);ctx.globalAlpha=1;flash=Math.max(0,flash-.025)}
opening=Math.max(0,opening-(reduced?.001:.0018));requestAnimationFrame(draw)}
function randStatic(n,a,b){return a+((n*7919)%997)/997*(b-a)}
draw();
// Hand-built sound design: textured low drone, stone grind, rising air, portal rush and sub-bass bloom.
function noiseBuffer(seconds){const b=audio.createBuffer(1,Math.ceil(audio.sampleRate*seconds),audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,.18);return b}
function initSound(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.82;const comp=audio.createDynamicsCompressor();comp.threshold.value=-22;comp.knee.value=20;comp.ratio.value=5;comp.attack.value=.01;comp.release.value=.65;const low=audio.createBiquadFilter();low.type='lowpass';low.frequency.value=950;master.connect(low).connect(comp).connect(audio.destination)}
function drone(){if(!audio||ambience.length)return;[36.7,55,73.4].forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=i?'triangle':'sine';o.frequency.value=hz;o.detune.value=i*4-5;f.type='lowpass';f.frequency.value=130;g.gain.value=[.12,.035,.02][i];o.connect(f).connect(g).connect(master);o.start();ambience.push(o)});const n=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();n.buffer=noiseBuffer(4);n.loop=true;f.type='lowpass';f.frequency.value=85;g.gain.value=.035;n.connect(f).connect(g).connect(master);n.start();ambience.push(n)}
function stopDrone(){ambience.forEach(n=>{try{n.stop()}catch(e){}});ambience=[]}
function sweep(at,dur,from,to,vol){const n=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();n.buffer=noiseBuffer(dur+.1);f.type='lowpass';f.frequency.setValueAtTime(from,at);f.frequency.exponentialRampToValueAtTime(to,at+dur);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.22);g.gain.exponentialRampToValueAtTime(.0001,at+dur);n.connect(f).connect(g).connect(master);n.start(at);n.stop(at+dur+.02)}
function impact(at){const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(68,at);o.frequency.exponentialRampToValueAtTime(27,at+2.1);f.type='lowpass';f.frequency.value=115;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.8,at+.12);g.gain.exponentialRampToValueAtTime(.0001,at+3.1);o.connect(f).connect(g).connect(master);o.start(at);o.stop(at+3.2)}
function playSequence(){if(!soundOn||!audio)return;const t=audio.currentTime;
const grind=audio.createOscillator(),gg=audio.createGain(),gf=audio.createBiquadFilter();grind.type='sawtooth';grind.frequency.setValueAtTime(43,t);grind.frequency.exponentialRampToValueAtTime(24,t+2.4);gf.type='lowpass';gf.frequency.value=145;gg.gain.setValueAtTime(.0001,t);gg.gain.exponentialRampToValueAtTime(.22,t+.3);gg.gain.exponentialRampToValueAtTime(.0001,t+2.7);grind.connect(gf).connect(gg).connect(master);grind.start(t);grind.stop(t+2.8);
sweep(t+.25,3.1,100,1500,.16);
[82.4,110,164.8,220].forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(hz*.7,t+.5);o.frequency.exponentialRampToValueAtTime(hz*2.2,t+3.5);g.gain.setValueAtTime(.0001,t+.5);g.gain.linearRampToValueAtTime(.035/(i+1),t+2.8);g.gain.exponentialRampToValueAtTime(.0001,t+4.2);o.connect(g).connect(master);o.start(t+.5);o.stop(t+4.3)});
sweep(t+3,2.7,2100,75,.27);impact(t+4.1);sweep(t+4.15,1.2,1200,65,.24);
}
document.getElementById('sound').addEventListener('click',async()=>{soundOn=!soundOn;const b=document.getElementById('sound');if(soundOn){initSound();await audio.resume();drone();b.textContent='♫ SOUND ON';document.getElementById('hint').textContent='SOUND ENABLED · TAP OPEN THE GATE'}else{stopDrone();b.textContent='♫ SOUND OFF';document.getElementById('hint').textContent='ENABLE SOUND FOR THE FULL CINEMATIC EXPERIENCE'}});
document.getElementById('awaken').addEventListener('click',async()=>{opening=1;flash=.85;if(soundOn){await audio.resume();playSequence()}else{document.getElementById('hint').textContent='TURN SOUND ON, THEN OPEN THE GATE AGAIN'}});
})();
</script></body></html>
