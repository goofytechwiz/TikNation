<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050711"><title>TikNation · The Celestial Gate</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050c;color:#fff;font:15px/1.45 system-ui,sans-serif}#world{position:fixed;inset:0;width:100%;height:100%}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 43%,transparent 30%,#02040bb8 100%),linear-gradient(0deg,#03050c 0%,transparent 35%,#02040a55 100%)}.top{position:fixed;top:16px;left:16px;z-index:2}.back,.actions button{border:1px solid #a8c5d866;background:#07101dcc;color:#f6f7ff;border-radius:999px;padding:11px 16px;text-decoration:none;font:700 13px system-ui;backdrop-filter:blur(12px);cursor:pointer}.caption{position:fixed;z-index:2;bottom:24px;left:0;right:0;text-align:center;padding:0 18px;text-shadow:0 2px 15px #000}.eyebrow{font-size:10px;letter-spacing:.28em;color:#a8eaff;font-weight:800}.caption h1{font-size:clamp(30px,7vw,58px);letter-spacing:-.055em;line-height:1;margin:8px 0}.caption p{color:#c1ccdb;margin:8px auto 14px;max-width:500px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions .primary{background:linear-gradient(110deg,#176b91,#55478d);border-color:#a7edff}.tag{position:fixed;right:16px;top:22px;color:#9eacc2;font-size:10px;letter-spacing:.15em;z-index:2}@media(max-height:650px){.caption{bottom:10px}.caption p{margin:4px auto 8px}.caption h1{font-size:clamp(25px,5vw,42px)}}@media(prefers-reduced-motion:reduce){.tag:after{content:' · REDUCED MOTION'}} 
</style></head><body><canvas id="world"></canvas><div class="vignette"></div><div class="top"><a class="back" href="./">← Gift Gallery</a></div><div class="tag">MYTHIC GIFT · PREVIEW ONLY</div><section class="caption"><div class="eyebrow">TIKNATION LIVE · CELESTIAL SERIES</div><h1>THE CELESTIAL GATE</h1><p>An ancient stellar gateway tears open between worlds.</p><div class="actions"><button class="primary" id="awaken">✦ AWAKEN THE GATE</button><button id="sound">♫ SOUND: OFF</button></div></section>
<script>
(()=>{const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');let W=0,H=0,D=1,t=0,burst=0,stars=[],dust=[],audio=null,osc=[];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);stars=Array.from({length:240},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*1.5+.25,p:Math.random()*6.28}));dust=Array.from({length:170},()=>({a:Math.random()*6.28,r:.35+Math.random()*.65,s:.1+Math.random()*.35}))}addEventListener('resize',resize);resize();
function pathRing(x,y,rx,ry,thick,colors,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);const g=ctx.createLinearGradient(-rx,-ry,rx,ry);colors.forEach((c,i)=>g.addColorStop(i/(colors.length-1),c));ctx.strokeStyle=g;ctx.lineWidth=thick;ctx.shadowColor=colors[1]||colors[0];ctx.shadowBlur=22;ctx.stroke();ctx.shadowBlur=0;ctx.beginPath();ctx.ellipse(0,0,rx-thick*.58,ry-thick*.58,0,0,Math.PI*2);ctx.strokeStyle='#d7efff55';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function draw(){t+=reduced?.003:.012;ctx.clearRect(0,0,W,H);const cx=W*.5,cy=H*.43,scale=Math.min(W/900,H/720),rx=Math.min(W*.245,220)*Math.min(1,scale*1.5),ry=Math.min(H*.34,300)*Math.min(1,scale*1.5);const bg=ctx.createRadialGradient(cx,cy,5,cx,cy,Math.max(W,H)*.8);bg.addColorStop(0,'#172342');bg.addColorStop(.36,'#091426');bg.addColorStop(1,'#02040a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
const neb=ctx.createRadialGradient(cx-rx*.8,cy-ry*.6,1,cx-rx*.8,cy-ry*.6,rx*2.8);neb.addColorStop(0,'#6a568d44');neb.addColorStop(1,'transparent');ctx.fillStyle=neb;ctx.fillRect(0,0,W,H);
for(const s of stars){const tw=.35+.65*(.5+.5*Math.sin(t*2+s.p));ctx.globalAlpha=tw*.8;ctx.fillStyle='#dcecff';ctx.beginPath();ctx.arc(s.x,s.y,s.z,0,6.283);ctx.fill()}ctx.globalAlpha=1;
// distant planetary body
ctx.save();ctx.translate(cx+rx*2.35,cy-ry*.85);const pr=ry*.32;const pg=ctx.createRadialGradient(-pr*.35,-pr*.4,pr*.05,0,0,pr);pg.addColorStop(0,'#e4d6c6');pg.addColorStop(.45,'#6f7791');pg.addColorStop(1,'#111a31');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(0,0,pr,0,6.283);ctx.fill();ctx.strokeStyle='#9cbbe455';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,pr*1.45,pr*.3,-.35,0,6.283);ctx.stroke();ctx.restore();
// portal interior and vortex
ctx.save();ctx.translate(cx,cy);ctx.beginPath();ctx.ellipse(0,0,rx*.87,ry*.87,0,0,6.283);ctx.clip();const core=ctx.createRadialGradient(-rx*.18,-ry*.25,2,0,0,ry*1.2);core.addColorStop(0,'#f6f6e8');core.addColorStop(.12,'#9fe9ff');core.addColorStop(.34,'#426eaa');core.addColorStop(.67,'#17234c');core.addColorStop(1,'#050916');ctx.fillStyle=core;ctx.fillRect(-rx,-ry,rx*2,ry*2);
for(let i=0;i<13;i++){ctx.save();ctx.rotate(t*(i%2?1:-.72)+i*.49);ctx.beginPath();ctx.ellipse(0,0,rx*(.18+i*.055),ry*(.16+i*.055),0,-.95,2.65);ctx.strokeStyle=i%3===0?'#f7dca866':i%3===1?'#a4efff77':'#a89bff55';ctx.lineWidth=1+i%3;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=12;ctx.stroke();ctx.restore()}
for(const p of dust){const a=p.a+t*p.s,rr=p.r*rx*.8;ctx.globalAlpha=.25+.65*(.5+.5*Math.sin(t*3+p.a));ctx.fillStyle=p.r>.8?'#fff0c9':'#9ceaff';ctx.beginPath();ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr*1.4,1.1+p.r*1.3,0,6.283);ctx.fill()}ctx.globalAlpha=1;ctx.restore();
// heavy ancient alloy frame
pathRing(cx,cy,rx,ry,Math.max(15,rx*.095),['#172334','#a9c6d4','#34465a','#101a2c','#e2c994','#34445a','#111a2a'],0);
pathRing(cx,cy,rx*.91,ry*.91,Math.max(3,rx*.018),['#1b3447','#9deeff','#d7f4ff','#516a91'],0);
pathRing(cx,cy,rx*1.1,ry*1.1,Math.max(2,rx*.012),['#4e526e','#d6c69b','#4a5572'],Math.sin(t*.25)*.025);
// segmented metal plates, rivets, glyph lights
for(let i=0;i<32;i++){const a=i*Math.PI*2/32;const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);ctx.fillStyle=i%4===0?'#d5c49a':'#71879a';ctx.strokeStyle='#e5f3ff88';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(-rx*.045,-Math.max(9,rx*.035),rx*.09,Math.max(18,rx*.07),4);ctx.fill();ctx.stroke();ctx.fillStyle=i%4===0?'#ffe4a1':'#9ceeff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(0,0,2.1,0,6.283);ctx.fill();ctx.restore()}
// energy arcs around frame
for(let j=0;j<5;j++){ctx.beginPath();ctx.ellipse(cx,cy,rx*(1.08+j*.025),ry*(1.08+j*.025),0,t*1.1+j*1.8,t*1.1+j*1.8+1.05);ctx.strokeStyle=j%2?'#b6a4ff99':'#91edffbb';ctx.lineWidth=j===0?3:1.4;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=12;ctx.stroke()}ctx.shadowBlur=0;
// light rays spill from gate
const rays=ctx.createRadialGradient(cx,cy,ry*.2,cx,cy,ry*1.9);rays.addColorStop(0,'#9eeaff25');rays.addColorStop(1,'transparent');ctx.fillStyle=rays;ctx.fillRect(0,0,W,H);
if(burst>0){burst=Math.max(0,burst-.018);ctx.globalAlpha=burst;ctx.fillStyle='#e8faff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;for(let i=0;i<70;i++){const a=i*6.283/70+t*2,rr=(1-burst)*Math.max(W,H)*.65;ctx.fillStyle=i%2?'#a8efff':'#ffe6b2';ctx.globalAlpha=burst;ctx.beginPath();ctx.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,2.4,0,6.283);ctx.fill()}ctx.globalAlpha=1}
requestAnimationFrame(draw)}draw();
document.getElementById('awaken').onclick=()=>{burst=1;};
document.getElementById('sound').onclick=()=>{const b=document.getElementById('sound');if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();[55,82.4,110,164.8].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.025/(i+1);o.connect(g).connect(audio.destination);o.start();osc.push(o)});b.textContent='♫ SOUND: ON'}else{osc.forEach(o=>o.stop());osc=[];audio.close();audio=null;b.textContent='♫ SOUND: OFF'}};
})();</script></body></html>
