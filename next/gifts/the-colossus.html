<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b16">
<title>TikNation · The Colossus</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b16;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 22%,rgba(2,5,13,.28) 68%,rgba(1,3,9,.9) 120%)}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));pointer-events:none;text-align:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#d8d5e8;font-size:9px;letter-spacing:.24em;text-transform:uppercase;text-shadow:0 2px 12px #000}
.brand{font-weight:800;color:#d4e5ff}.signal{color:#ffcf86}
.bottom{width:min(620px,100%);display:flex;flex-direction:column;align-items:center;gap:12px}
.eyebrow{font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:#ffc77d;text-shadow:0 0 16px #ff9e4a}
h1{margin:0;font-size:clamp(34px,8vw,72px);line-height:.92;letter-spacing:.055em;text-transform:uppercase;font-weight:950;text-shadow:0 5px 28px #000,0 0 32px rgba(255,142,62,.24)}
.sub{max-width:440px;margin:0;color:#d6d8e2;font-size:12px;line-height:1.55;text-shadow:0 2px 10px #000}
button{pointer-events:auto;border:1px solid rgba(255,202,133,.8);border-radius:999px;padding:15px 28px;background:linear-gradient(110deg,#ffd49b,#ff9d58 48%,#bd563f);color:#1a1010;font-weight:950;letter-spacing:.17em;font-size:10px;box-shadow:0 0 28px rgba(255,132,65,.28),inset 0 1px 0 #fff8;cursor:pointer;min-width:220px}
button:active{transform:scale(.97)}button:disabled{opacity:.7}
.hint{font-size:9px;letter-spacing:.16em;color:#aeb4c8;text-transform:uppercase;text-shadow:0 2px 8px #000}
@media(max-height:620px){.ui{padding-top:12px;padding-bottom:12px}.sub{display:none}h1{font-size:clamp(28px,7vh,52px)}button{padding:11px 24px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="scene" aria-label="A colossal ancient stone guardian awakens in a ruined city"></canvas>
<div class="vignette"></div>
<div class="ui">
  <div class="top"><span class="brand">TIKNATION · LIVE GIFT</span><span class="signal" id="status">ANCIENT SIGNAL DETECTED</span></div>
  <div class="bottom">
    <div class="eyebrow">THE EARTH REMEMBERS</div>
    <h1>THE COLOSSUS</h1>
    <p class="sub" id="subtitle">Beneath the ruins, something impossibly old is beginning to move.</p>
    <button id="awaken">AWAKEN THE COLOSSUS</button>
    <div class="hint">Tap to awaken · Sound begins after interaction</div>
  </div>
</div>
<script>
(()=>{
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
const button=document.getElementById('awaken'),status=document.getElementById('status'),subtitle=document.getElementById('subtitle');
let w=0,h=0,dpr=1,progress=0,target=0,last=0,shake=0,flash=0,particles=[],audio=null,started=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){dpr=Math.min(devicePixelRatio||1,1.7);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function polygon(points,fill,stroke=null,lw=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function drawSky(t){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#080d1b');g.addColorStop(.48,'#202437');g.addColorStop(1,'#15151c');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
glow(w*.52,h*.39,Math.max(w,h)*.52,'rgba(255,142,72,.13)');
for(let i=0;i<90;i++){let x=(i*197.31%w),y=(i*83.7%(h*.57));ctx.fillStyle='rgba(210,222,255,'+(.12+(i%5)*.035)+')';ctx.fillRect(x,y,1,1)}
// ruined skyline
const base=h*.75,scale=w/900;
for(let i=0;i<25;i++){let bw=(24+(i*17%42))*scale,x=(i/25)*w;let bh=(.12+(i*37%30)/100)*h;ctx.fillStyle=i%3?'#101724':'#171a26';ctx.fillRect(x,base-bh,bw,bh);ctx.fillStyle='rgba(255,177,103,.17)';for(let yy=base-bh+12;yy<base-10;yy+=17)for(let xx=x+7;xx<x+bw-5;xx+=12)if((Math.floor(xx+yy+i)%4)===0)ctx.fillRect(xx,yy,3,5)}
// broken towers
polygon([[0,base-70],[w*.08,base-90],[w*.1,base-40],[w*.19,base-55],[w*.2,base],[0,base]],'#0b111c');
polygon([[w*.8,base-30],[w*.85,base-100],[w*.9,base-72],[w*.94,base-120],[w,base-85],[w,base]],'#0b111c');
}
function drawGround(t){let y=h*.77;let g=ctx.createLinearGradient(0,y,0,h);g.addColorStop(0,'#34313a');g.addColorStop(.35,'#171a23');g.addColorStop(1,'#080b12');ctx.fillStyle=g;ctx.fillRect(0,y,w,h-y);
for(let i=0;i<42;i++){let x=(i*137.7%w),yy=y+(i*47.3%(h-y));ctx.strokeStyle='rgba(171,172,185,.12)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+rand(8,35),yy+rand(-3,3));ctx.stroke()}
let crack=progress;ctx.save();ctx.translate(w*.5,y+10);ctx.scale(Math.min(w/650,1.4),1);
ctx.strokeStyle='rgba(255,139,67,'+(.16+.6*crack)+')';ctx.lineWidth=2+crack*4;ctx.shadowColor='#ff783c';ctx.shadowBlur=12+crack*22;
for(let i=0;i<9;i++){ctx.beginPath();ctx.moveTo(0,0);let a=i*Math.PI*2/9;ctx.lineTo(Math.cos(a)*rand(35,65),Math.sin(a)*rand(12,28));ctx.lineTo(Math.cos(a)*rand(85,155),Math.sin(a)*rand(35,75));ctx.stroke()}ctx.restore();
}
function drawTitan(t){const p=progress,cx=w*.5,ground=h*.81,unit=Math.min(w/720,h/650);ctx.save();ctx.translate(cx,ground+(1-p)*h*.24);ctx.scale(unit,unit);let bob=Math.sin(t*.0014)*1.8*(.3+p);
ctx.translate(0,bob);
let stone=ctx.createLinearGradient(-220,-500,230,80);stone.addColorStop(0,'#85817a');stone.addColorStop(.35,'#555760');stone.addColorStop(.7,'#343943');stone.addColorStop(1,'#171e29');
// back shoulders and upper body
polygon([[-190,-335],[-250,-295],[-266,-195],[-218,-115],[-155,-96],[-125,-250]],stone,'#9a9287',3);
polygon([[190,-335],[250,-295],[266,-195],[218,-115],[155,-96],[125,-250]],stone,'#9a9287',3);
polygon([[-160,-355],[-105,-405],[0,-425],[105,-405],[160,-355],[145,-145],[100,-52],[-100,-52],[-145,-145]],stone,'#a29a8d',3);
 // chest stone plates
for(let i=0;i<5;i++){let yy=-330+i*48;ctx.strokeStyle='rgba(10,15,24,.42)';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-125+i*3,yy);ctx.quadraticCurveTo(0,yy+20,125-i*3,yy);ctx.stroke();ctx.strokeStyle='rgba(198,183,157,.16)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-115,yy-5);ctx.quadraticCurveTo(0,yy+13,115,yy-5);ctx.stroke()}
 // neck and head
polygon([[-78,-433],[-65,-492],[65,-492],[78,-433],[60,-375],[-60,-375]],stone,'#aaa08e',3);
polygon([[-105,-525],[-72,-590],[-20,-620],[38,-612],[94,-565],[104,-500],[70,-444],[-62,-444],[-102,-483]],stone,'#aaa08e',3);
polygon([[-100,-540],[-80,-601],[-37,-632],[-13,-610],[-40,-560]],'rgba(205,194,173,.16)');
 // face planes
polygon([[-77,-540],[-42,-568],[0,-552],[0,-468],[-65,-470]],'rgba(12,18,28,.36)');
polygon([[77,-540],[42,-568],[0,-552],[0,-468],[65,-470]],'rgba(12,18,28,.3)');
 // eyes
for(const x of [-43,43]){glow(x,-533,35,'rgba(255,126,49,'+(.45+p*.5)+')');ctx.fillStyle='#ffbd70';ctx.shadowColor='#ff682e';ctx.shadowBlur=22;ctx.beginPath();ctx.ellipse(x,-533,13,5,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
 // brow ridge, nose, mouth
polygon([[-77,-552],[-39,-565],[0,-551],[39,-565],[77,-552],[55,-535],[0,-544],[-55,-535]],'#343943');
polygon([[-14,-520],[0,-486],[14,-520],[5,-474],[-5,-474]],'#77756e');
ctx.strokeStyle='#111923';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(-48,-470);ctx.lineTo(-18,-458);ctx.lineTo(0,-463);ctx.lineTo(20,-458);ctx.lineTo(48,-470);ctx.stroke();
 // arm hanging, massive fists
polygon([[-202,-320],[-267,-285],[-286,-190],[-276,-96],[-236,-40],[-196,-61],[-185,-135],[-188,-220],[-150,-286]],stone,'#a09787',4);
polygon([[202,-320],[267,-285],[286,-190],[276,-96],[236,-40],[196,-61],[185,-135],[188,-220],[150,-286]],stone,'#a09787',4);
for(const x of [-237,237]){for(let i=0;i<4;i++){ctx.strokeStyle='rgba(15,20,28,.7)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+(i-1.5)*10,-93);ctx.lineTo(x+(i-1.5)*11,-42);ctx.stroke()}}
 // stone fractures
const cracks=[[-82,-578,-60,-553,-73,-528],[-18,-603,-5,-575,-17,-548],[87,-566,64,-542,79,-515],[-140,-337,-108,-302,-122,-265],[140,-332,111,-304,130,-276],[-72,-390,-44,-354,-57,-321],[72,-392,45,-359,60,-328],[-250,-234,-223,-211,-240,-182],[252,-230,225,-206,240,-180],[-35,-260,-5,-235,-18,-205],[70,-188,43,-159,57,-126]];
ctx.lineCap='round';for(let i=0;i<cracks.length;i++){let a=cracks[i];ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[2],a[3]);ctx.lineTo(a[4],a[5]);ctx.strokeStyle='rgba(255,112,49,'+(p*(.3+(i%3)*.16))+')';ctx.lineWidth=2+p*2;ctx.shadowColor='#ff7839';ctx.shadowBlur=8*p;ctx.stroke();ctx.shadowBlur=0}
 // rock chips and highlights
for(let i=0;i<45;i++){let x=Math.sin(i*92.3)*190,y=-580+(i*29%480);ctx.fillStyle=i%2?'rgba(5,10,18,.25)':'rgba(228,212,184,.12)';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+rand(3,10),y+rand(2,9));ctx.lineTo(x-rand(2,8),y+rand(4,10));ctx.fill()}
ctx.restore();
}
function burst(){for(let i=0;i<100;i++){let a=rand(0,Math.PI*2),s=rand(2,12);particles.push({x:w*.5+rand(-35,35),y:h*.78+rand(-15,10),vx:Math.cos(a)*s,vy:Math.sin(a)*s-rand(1,8),life:rand(40,100),max:100,size:rand(1,5),rock:Math.random()>.55})}}
function drawParticles(){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.vx*=.99;p.life--;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.rock?'#77716b':'#ffad68';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1}
function sound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();audio.resume();const now=audio.currentTime;function tone(freq,dur,type,vol,delay=0,end=freq*.55){const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,now+delay);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),now+delay+dur);g.gain.setValueAtTime(.0001,now+delay);g.gain.exponentialRampToValueAtTime(vol,now+delay+.06);g.gain.exponentialRampToValueAtTime(.0001,now+delay+dur);o.connect(g);g.connect(audio.destination);o.start(now+delay);o.stop(now+delay+dur+.03)}
tone(58,3.2,'sawtooth',.18,0,29);tone(42,2.8,'triangle',.2,.08,25);tone(110,1.5,'sine',.12,.5,38);tone(880,.9,'sine',.025,1.1,220);
const len=audio.sampleRate*1.4,buf=audio.createBuffer(1,len,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++){let env=Math.pow(1-i/len,2);data[i]=(Math.random()*2-1)*env*.7}
const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();src.buffer=buf;filter.type='lowpass';filter.frequency.value=180;gain.gain.value=.24;src.connect(filter);filter.connect(gain);gain.connect(audio.destination);src.start(now+.15);
}catch(e){}}
function frame(t){if(!last)last=t;let dt=Math.min(40,t-last);last=t;if(!reduced)progress+=(target-progress)*Math.min(1,dt/950);else progress=target?1:0;
ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.9;if(shake<.3)shake=0}
drawSky(t);drawGround(t);drawTitan(t);drawParticles();
if(progress>.3)glow(w*.5,h*.42,Math.min(w,h)*.42,'rgba(255,113,52,'+(.12*progress)+')');
if(flash>0){ctx.fillStyle='rgba(255,205,145,'+flash+')';ctx.fillRect(0,0,w,h);flash*=.88}
ctx.restore();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
button.addEventListener('click',()=>{if(started){progress=0;target=0;particles=[];started=false;button.textContent='AWAKEN THE COLOSSUS';status.textContent='ANCIENT SIGNAL DETECTED';subtitle.textContent='Beneath the ruins, something impossibly old is beginning to move.';return}
started=true;target=1;button.disabled=true;button.textContent='THE EARTH IS SHAKING…';status.textContent='CONTAINMENT BREACHED';subtitle.textContent='THE COLOSSUS HAS AWAKENED';sound();setTimeout(()=>{burst();shake=18;flash=.6},650);setTimeout(()=>{burst();shake=12},2100);setTimeout(()=>{button.disabled=false;button.textContent='RESET THE AWAKENING'},6500)});
})();
</script>
</body>
</html>
