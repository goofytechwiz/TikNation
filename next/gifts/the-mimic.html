<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060a"><title>TikNation Gift · The Mimic</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050408;color:#fff;font-family:Inter,system-ui,Arial}
.stage{position:fixed;inset:0;overflow:hidden;background:#08060a}
.art{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;object-position:center 47%;filter:brightness(.76) saturate(.88);transform:scale(1.04);transition:filter 1.4s,transform 7s cubic-bezier(.2,.7,.2,1)}
.stage.awake .art{filter:brightness(1.04) saturate(1.25) contrast(1.08);transform:scale(1.15) translateY(1.5%)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#05040ac9 0%,transparent 23%,transparent 62%,#050308d9 100%),radial-gradient(ellipse at center,transparent 35%,#000b 100%);pointer-events:none}
.fog{position:absolute;left:-20%;right:-20%;bottom:-5%;height:32%;opacity:.48;filter:blur(20px);background:radial-gradient(ellipse at 20% 70%,#a7d9ef70,transparent 42%),radial-gradient(ellipse at 75% 55%,#a9d8ec55,transparent 45%);animation:fog 9s ease-in-out infinite alternate;pointer-events:none}
.cracks{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s;pointer-events:none;mix-blend-mode:screen}
.awake .cracks{opacity:.95}
.cracks path{fill:none;stroke:#d7f4ff;stroke-width:1.25;stroke-linecap:round;stroke-dasharray:500;stroke-dashoffset:500;filter:drop-shadow(0 0 5px #9feaff);animation:fracture 1.2s ease-out forwards}
.flash{position:absolute;inset:0;background:#d7f7ff;opacity:0;pointer-events:none}.awake .flash{animation:flash .55s ease-out}
.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;text-shadow:0 2px 18px #000}
.kicker{font-size:10px;letter-spacing:.42em;color:#c4d4dc;text-transform:uppercase}
h1{margin:7px 0 0;font-size:clamp(28px,7vw,52px);letter-spacing:.2em;font-weight:850}
.sub{margin-top:6px;font-size:10px;letter-spacing:.3em;color:#e3b8c1}
.warning{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:clamp(9px,2.2vw,12px);letter-spacing:.32em;color:#ff9aaa;white-space:nowrap;text-shadow:0 0 16px #ff174e;opacity:0;transition:opacity .6s}.awake .warning{opacity:1}
.panel{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 18px}
#status{font-size:10px;letter-spacing:.2em;color:#d7dfe5;text-align:center;text-transform:uppercase;text-shadow:0 1px 8px #000;min-height:14px}
button{border:1px solid #ffb6c5aa;border-radius:999px;padding:15px 30px;background:linear-gradient(110deg,#170e17ed,#42101fed);color:#fff;font-weight:850;letter-spacing:.22em;font-size:11px;box-shadow:0 0 32px #ff315b55,inset 0 0 20px #ff9aaa16;cursor:pointer;backdrop-filter:blur(10px)}
button:active{transform:scale(.97)}.note{font-size:9px;color:#b7b0b9;letter-spacing:.1em;text-align:center;text-shadow:0 1px 6px #000}
@keyframes fog{from{transform:translateX(-5%) scale(1)}to{transform:translateX(7%) scale(1.18)}}
@keyframes fracture{to{stroke-dashoffset:0}}@keyframes flash{0%{opacity:.48}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="stage" id="stage">
<img class="art" src="assets/the-mimic.jpg" alt="A terrifying pale apparition crawling out of a shattered gothic mirror">
<div class="shade"></div><div class="fog"></div><div class="flash"></div>
<svg class="cracks" viewBox="0 0 1000 1600" preserveAspectRatio="none" aria-hidden="true">
<path d="M505 790 L560 710 L535 650 L600 570 L575 490 L645 420 M560 710 L630 735 L690 680 L760 690 M535 650 L465 600 L420 520 L360 500 M600 570 L670 520 L710 440 L790 390 M505 790 L450 860 L390 900 L350 1000 M560 710 L610 820 L690 870 L730 970 M420 520 L390 440 L330 400"/>
<path d="M505 790 L480 700 L430 650 L440 560 M600 570 L550 500 L530 420 L555 350 M610 820 L580 900 L600 1000 L560 1080 M450 860 L400 820 L330 830 L280 780"/>
</svg>
<header class="top"><div class="kicker">TikNation · Nightmare Collection</div><h1>THE MIMIC</h1><div class="sub">IT LEARNED YOUR SHAPE</div></header>
<div class="warning">DO NOT TRUST THE REFLECTION</div>
<div class="panel"><div id="status">A presence waits behind the glass</div><button id="wake">WAKE THE MIMIC</button><div class="note">Sound starts after your tap · Headphones recommended</div></div>
</main>
<script>
(()=>{const stage=document.getElementById('stage'),btn=document.getElementById('wake'),status=document.getElementById('status');let awake=false,ctx=null;
function sound(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const now=ctx.currentTime;[43,48,52].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),filter=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*.72,now+3.4);filter.type='lowpass';filter.frequency.value=220+i*75;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.055/(i+1),now+.35);g.gain.exponentialRampToValueAtTime(.0001,now+3.5);o.connect(filter);filter.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+3.6)});
const n=ctx.createBufferSource(),b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.22;n.buffer=b;const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='lowpass';f.frequency.value=430;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.2);g.gain.exponentialRampToValueAtTime(.0001,now+2);n.connect(f);f.connect(g);g.connect(ctx.destination);n.start(now);n.stop(now+2)}catch(e){}}
btn.addEventListener('click',()=>{awake=!awake;stage.classList.toggle('awake',awake);btn.textContent=awake?'SEAL THE MIRROR':'WAKE THE MIMIC';status.textContent=awake?'It is reaching through the glass…':'The reflection has gone still';if(awake)sound();else if(ctx){try{ctx.suspend()}catch(e){}}});
})();
</script></body></html>
