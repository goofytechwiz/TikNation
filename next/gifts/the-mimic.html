<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090a"><title>TikNation Gift · The Mimic</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050708;color:#edf5f2;font-family:system-ui,Arial}
.scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#34403e 0,#18201f 28%,#090e10 65%,#020405 100%)}
.floor{position:absolute;left:-20%;right:-20%;bottom:-10%;height:48%;background:repeating-linear-gradient(0deg,#84918d18 0 2px,transparent 3px 48px),repeating-linear-gradient(90deg,#84918d14 0 2px,transparent 3px 75px),linear-gradient(#202827,#050809);transform:perspective(340px) rotateX(57deg);transform-origin:top}
.ceiling{position:absolute;left:0;right:0;top:0;height:30%;background:linear-gradient(#030506,#18201f);clip-path:polygon(0 0,100% 0,82% 100%,18% 100%)}
.wall{position:absolute;top:17%;bottom:25%;width:22%;background:repeating-linear-gradient(0deg,transparent 0 70px,#8b9a9420 71px 73px),linear-gradient(90deg,#070b0c,#34403d 50%,#090d0e);border:1px solid #a3b0aa24}
.wall.left{left:0;clip-path:polygon(0 0,100% 13%,100% 100%,0 100%)}.wall.right{right:0;clip-path:polygon(0 13%,100% 0,100% 100%,0 100%)}
.pipe{position:absolute;top:20%;height:9px;width:42%;background:linear-gradient(#aab5ae,#27302e 40%,#080b0c);box-shadow:0 6px 12px #000;opacity:.8}.pipe.one{left:-2%;transform:rotate(8deg)}.pipe.two{right:-2%;transform:rotate(-8deg)}
.door{position:absolute;left:50%;top:22%;width:min(50vw,350px);height:54%;transform:translateX(-50%);background:linear-gradient(90deg,#080c0d,#303b38 12%,#131a19 50%,#303a37 88%,#070b0c);border:9px solid #080d0e;box-shadow:0 0 0 2px #87938c66,0 0 45px #000,inset 0 0 28px #000;border-radius:3px}
.door:before{content:"";position:absolute;inset:10px;border:2px solid #86938c55;background:repeating-linear-gradient(90deg,transparent 0 32%,#0004 33% 34%);box-shadow:inset 0 0 35px #000}
.door:after{content:"";position:absolute;right:8%;top:44%;height:55px;width:9px;background:#8b9a91;box-shadow:0 0 8px #d8f4e1}
.warning{position:absolute;top:35%;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.24em;color:#d6e4dc;background:#581c18;padding:6px 10px;box-shadow:0 0 15px #e54a3033;white-space:nowrap}
.creature{position:absolute;left:50%;top:27%;width:min(57vw,390px);height:54%;transform:translateX(-50%);filter:drop-shadow(0 15px 20px #000);animation:wait 5s ease-in-out infinite}
.skull{position:absolute;z-index:3;left:50%;top:3%;width:34%;height:30%;transform:translateX(-50%) rotate(-5deg);border-radius:48% 48% 42% 42%;background:radial-gradient(ellipse at 35% 25%,#a6aaa0,#65716a 32%,#303a37 66%,#111716 100%);box-shadow:inset -13px -8px 18px #000a,inset 5px 4px 12px #e4f0e322}
.jaw{position:absolute;z-index:4;left:50%;top:23%;width:25%;height:13%;transform:translateX(-50%);background:linear-gradient(#202725,#050808);clip-path:polygon(0 0,100% 0,85% 100%,50% 72%,15% 100%)}
.eye{position:absolute;z-index:5;top:15%;width:7%;height:3%;border-radius:50%;background:#d7f8dd;box-shadow:0 0 8px 4px #c5ffd2,0 0 24px 9px #8effae88}.eye.a{left:42%}.eye.b{right:42%}
.neck{position:absolute;z-index:2;left:41%;top:25%;width:18%;height:20%;background:linear-gradient(90deg,#101716,#68736b,#151c1a);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.torso{position:absolute;z-index:2;left:30%;top:37%;width:40%;height:49%;background:linear-gradient(90deg,#101615,#657069 35%,#303a36 62%,#090e0e);clip-path:polygon(25% 0,75% 0,100% 28%,82% 100%,18% 100%,0 28%);box-shadow:inset 0 0 18px #000}
.limb{position:absolute;z-index:1;top:39%;width:14%;height:52%;border-radius:48%;background:linear-gradient(90deg,#090e0e,#768078 45%,#17201e);transform-origin:top center}
.limb.l{left:24%;transform:rotate(29deg);animation:leftreach 4.8s ease-in-out infinite}.limb.r{right:24%;transform:rotate(-29deg);animation:rightreach 5.2s ease-in-out infinite}
.hand{position:absolute;bottom:-4%;left:5%;width:95%;height:23%;background:linear-gradient(90deg,#17201d,#78837a,#151c1a);clip-path:polygon(20% 0,80% 0,100% 100%,76% 75%,61% 100%,50% 63%,36% 100%,22% 70%,0 100%)}
.rib{position:absolute;z-index:3;left:38%;top:51%;width:24%;height:18%;border-top:3px solid #aab5a65c;border-bottom:3px solid #080c0c;transform:rotate(-7deg);border-radius:50%}
.haze{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 75%,#b8d1c21c,transparent 48%);filter:blur(18px);animation:haze 6s ease-in-out infinite alternate}
.lamp{position:absolute;top:10%;left:50%;width:25%;height:5px;transform:translateX(-50%);background:#d8f6d4;box-shadow:0 0 8px 3px #c7ffd2,0 25px 70px 25px #baffc022;animation:flicker 5s infinite}
.vignette{position:absolute;inset:0;background:linear-gradient(180deg,#0008,transparent 25%,transparent 70%,#000d),radial-gradient(ellipse,transparent 30%,#000c 100%);pointer-events:none}
.scan{position:absolute;inset:0;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#d5f1df 4px);pointer-events:none}
.top{position:absolute;top:max(17px,env(safe-area-inset-top));left:0;right:0;text-align:center;text-shadow:0 2px 16px #000;z-index:8}.kicker{font-size:9px;letter-spacing:.45em;color:#bdcbc2}h1{font-size:clamp(30px,8vw,54px);letter-spacing:.22em;margin:7px 0;font-weight:900}.sub{font-size:9px;letter-spacing:.3em;color:#c0d3c5}
.alert{position:absolute;top:21%;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.24em;color:#ffb3a2;text-shadow:0 0 12px #ff4933;opacity:0;z-index:8}.active .alert{opacity:1}
.controls{position:absolute;z-index:9;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;flex-direction:column;gap:10px;padding:0 14px}#status{font-size:10px;letter-spacing:.13em;text-align:center;color:#d8e3db;min-height:14px;text-shadow:0 2px 8px #000}
button{padding:15px 30px;border:1px solid #d2e5d299;border-radius:2px;background:linear-gradient(110deg,#101817,#33443c);color:#f4fff5;font-weight:850;font-size:11px;letter-spacing:.22em;box-shadow:0 0 25px #b8f4cb22,inset 0 0 15px #d8ffe511;cursor:pointer}button:active{transform:scale(.97)}.hint{font-size:9px;letter-spacing:.1em;color:#b4c1b8;text-align:center;text-shadow:0 2px 8px #000}
@keyframes wait{0%,100%{transform:translate(-50%,8px) scale(.94)}50%{transform:translate(-50%,-3px) scale(1)}}@keyframes leftreach{50%{transform:rotate(8deg) translateY(10px)}}@keyframes rightreach{50%{transform:rotate(-8deg) translateY(14px)}}@keyframes haze{to{transform:translateX(12%) scale(1.3)}}@keyframes flicker{0%,90%,94%,100%{opacity:1}92%{opacity:.2}}
.active .creature{animation:attack 2.2s cubic-bezier(.15,.8,.2,1) forwards,wait 5s 2.2s ease-in-out infinite}.active .lamp{animation:flicker .2s infinite}.active .door{box-shadow:0 0 0 2px #e1ffdf99,0 0 65px #b7ffbf66,inset 0 0 35px #000}
@keyframes attack{from{transform:translate(-50%,12%) scale(.72)}to{transform:translate(-50%,-4%) scale(1.23)}}
@media(max-width:600px){.door{width:62vw}.creature{width:70vw;top:29%;height:51%}.wall{width:18%}.warning{top:38%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body><main class="scene" id="scene">
<div class="ceiling"></div><div class="lamp"></div><div class="wall left"></div><div class="wall right"></div><div class="pipe one"></div><div class="pipe two"></div><div class="door"><div class="warning">LEVEL 09 · DO NOT OPEN</div></div><div class="floor"></div>
<div class="creature"><div class="neck"></div><div class="torso"></div><div class="rib"></div><div class="limb l"><div class="hand"></div></div><div class="limb r"><div class="hand"></div></div><div class="skull"></div><div class="jaw"></div><i class="eye a"></i><i class="eye b"></i></div>
<div class="haze"></div><div class="scan"></div><div class="vignette"></div>
<header class="top"><div class="kicker">TIKNATION · AFTER HOURS</div><h1>THE MIMIC</h1><div class="sub">LEVEL 09 · SUBJECT 001</div></header><div class="alert">WARNING · THE CONTAINMENT DOOR IS FAILING</div>
<div class="controls"><div id="status">A shape is moving behind the blast door</div><button id="trigger">UNSEAL THE CHAMBER</button><div class="hint">Tap to trigger the breach · Sound begins after interaction</div></div></main>
<script>(()=>{const scene=document.getElementById('scene'),button=document.getElementById('trigger'),status=document.getElementById('status');let open=false,ctx;function sound(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const t=ctx.currentTime;[42,58,73].forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(hz,t);o.frequency.exponentialRampToValueAtTime(hz*.55,t+2.7);f.type='lowpass';f.frequency.value=130+i*45;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045/(i+1),t+.2);g.gain.exponentialRampToValueAtTime(.0001,t+2.8);o.connect(f);f.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+2.9)})}catch(e){}}button.addEventListener('click',()=>{open=!open;scene.classList.toggle('active',open);button.textContent=open?'LOCK THE CHAMBER':'UNSEAL THE CHAMBER';status.textContent=open?'IT HAS ESCAPED · DO NOT LET IT REACH YOU':'A shape is moving behind the blast door';if(open)sound();else if(ctx)ctx.suspend()})})();</script></body></html>
