<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05090b"><title>TikNation Gift · The Mimic</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030608;color:#edf7f6;font-family:system-ui,Arial}
.scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#24383a 0,#10191c 35%,#05090c 72%,#010203 100%)}
.tiles{position:absolute;inset:0;opacity:.25;background:repeating-linear-gradient(90deg,transparent 0 11%,#9cb6b322 11.1% 11.25%),repeating-linear-gradient(0deg,transparent 0 16%,#9cb6b322 16.1% 16.25%);transform:perspective(500px) rotateX(7deg) scale(1.2)}
.tunnel{position:absolute;inset:9% 8% 8%;border:2px solid #71858966;box-shadow:inset 0 0 70px #000,0 0 30px #9ad7d522;border-radius:48% 48% 7% 7% / 24% 24% 5% 5%;background:linear-gradient(90deg,#0009,transparent 20% 80%,#0009)}
.portal{position:absolute;left:50%;top:48%;width:min(65vw,460px);height:min(75vh,680px);transform:translate(-50%,-50%);border-radius:48% 48% 44% 44%;border:13px solid #101a1d;box-shadow:0 0 0 3px #8aa6a755,0 0 25px #8de6e255,inset 0 0 45px #000;background:radial-gradient(ellipse at 50% 40%,#8aa6a822,#10191c 55%,#020405 78%);overflow:hidden}
.portal:before{content:"";position:absolute;inset:4%;border-radius:50%;border:2px solid #d1eff033;box-shadow:0 0 25px #83d5dc33,inset 0 0 45px #9adce322;animation:throb 4s ease-in-out infinite}
.water{position:absolute;left:-10%;right:-10%;bottom:-2%;height:20%;background:repeating-linear-gradient(0deg,#a2d5d51c 0 1px,transparent 2px 13px);transform:perspective(150px) rotateX(16deg);filter:blur(1px);animation:water 5s linear infinite}
.creature{position:absolute;inset:0;filter:drop-shadow(0 0 14px #b4d6d633);animation:creep 5s ease-in-out infinite}
.head{position:absolute;left:50%;top:18%;width:34%;height:29%;transform:translateX(-50%);border-radius:48% 48% 43% 43%;background:radial-gradient(ellipse at 40% 30%,#8e9b99 0,#465453 28%,#182124 65%,#070b0d 100%);box-shadow:inset -18px -8px 22px #000a, inset 7px 2px 12px #d6eeee33}
.face{position:absolute;left:50%;top:34%;width:29%;height:15%;transform:translateX(-50%);background:linear-gradient(180deg,#0b1113,#020405);clip-path:polygon(0 0,38% 16%,50% 0,65% 17%,100% 0,85% 100%,52% 75%,16% 100%);filter:drop-shadow(0 0 8px #b5eeee)}
.eye{position:absolute;top:39%;width:7%;height:2.3%;background:#d6faff;box-shadow:0 0 9px 4px #a9f5ff,0 0 28px 10px #a4edff77;border-radius:50%;animation:blink 6s infinite}.eye.l{left:39%}.eye.r{right:39%}
.body{position:absolute;left:50%;top:43%;width:55%;height:56%;transform:translateX(-50%);background:linear-gradient(90deg,#080d0f,#354241 38%,#172022 62%,#05090b);clip-path:polygon(31% 0,69% 0,86% 14%,100% 100%,72% 87%,59% 44%,50% 100%,38% 44%,25% 90%,0 100%,14% 14%);filter:drop-shadow(0 0 12px #000)}
.arm{position:absolute;top:48%;height:46%;width:13%;background:linear-gradient(90deg,#080c0d,#667573 48%,#101719);border-radius:50%;transform-origin:top center}
.arm.l{left:24%;transform:rotate(22deg);animation:reachL 4s ease-in-out infinite}.arm.r{right:24%;transform:rotate(-22deg);animation:reachR 4.7s ease-in-out infinite}
.finger{position:absolute;bottom:0;width:18%;height:23%;background:linear-gradient(90deg,#101719,#71817e);border-radius:60%;transform-origin:top center}
.finger:nth-child(1){left:4%;transform:rotate(15deg)}.finger:nth-child(2){left:25%;height:28%}.finger:nth-child(3){left:48%;height:25%;transform:rotate(-8deg)}.finger:nth-child(4){left:69%;height:19%;transform:rotate(-18deg)}
.drips{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 95%,#b8faff18,transparent 50%);mix-blend-mode:screen}
.vignette{position:absolute;inset:0;background:linear-gradient(180deg,#020506b8,transparent 22%,transparent 70%,#020405e8),radial-gradient(ellipse,transparent 30%,#000c 100%);pointer-events:none}
.mist{position:absolute;left:-30%;right:-30%;bottom:8%;height:25%;background:radial-gradient(ellipse,#c1f5f22a,transparent 65%);filter:blur(22px);animation:mist 8s ease-in-out infinite alternate}
.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;text-shadow:0 2px 15px #000}
.kicker{font-size:9px;letter-spacing:.45em;color:#b3c8c8}h1{font-size:clamp(30px,8vw,54px);letter-spacing:.22em;margin:7px 0;font-weight:900}.sub{font-size:9px;letter-spacing:.32em;color:#9ed3d2}
.alert{position:absolute;top:24%;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.28em;color:#d4ffff;text-shadow:0 0 15px #a6ffff;opacity:0;transition:opacity .5s}.active .alert{opacity:1}
.controls{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:center;flex-direction:column;gap:11px;padding:0 16px}
#status{font-size:10px;letter-spacing:.16em;text-align:center;color:#d4e3e1;min-height:14px;text-shadow:0 2px 8px #000}
button{padding:15px 30px;border:1px solid #b5eeee99;border-radius:3px;background:linear-gradient(110deg,#0b181b,#203b3d);color:#f1ffff;font-weight:850;font-size:11px;letter-spacing:.22em;box-shadow:0 0 26px #8ce5e533,inset 0 0 18px #c8ffff12;cursor:pointer}
button:active{transform:scale(.97)}.hint{font-size:9px;letter-spacing:.1em;color:#a8baba;text-align:center;text-shadow:0 2px 8px #000}
@keyframes throb{50%{transform:scale(.96);opacity:.55}}@keyframes creep{0%,100%{transform:translateY(5px) scale(.96)}50%{transform:translateY(-10px) scale(1.04)}}@keyframes blink{0%,43%,47%,100%{opacity:.85}45%{opacity:.08}}@keyframes reachL{50%{transform:rotate(4deg) translateY(8px)}}@keyframes reachR{50%{transform:rotate(-4deg) translateY(12px)}}@keyframes mist{to{transform:translateX(14%) scale(1.3)}}@keyframes water{to{background-position:0 26px}}
.active .portal{box-shadow:0 0 0 3px #e1ffffaa,0 0 55px #b8ffffaa,inset 0 0 65px #d2ffff55}
.active .creature{animation:emerge 2.8s cubic-bezier(.2,.8,.2,1) forwards,creep 5s 2.8s ease-in-out infinite}
@keyframes emerge{from{transform:translateY(20%) scale(.78)}to{transform:translateY(-3%) scale(1.13)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="scene" id="scene"><div class="tiles"></div><div class="tunnel"></div><section class="portal"><div class="water"></div><div class="creature"><div class="body"></div><div class="arm l"><i class="finger"></i><i class="finger"></i><i class="finger"></i><i class="finger"></i></div><div class="arm r"><i class="finger"></i><i class="finger"></i><i class="finger"></i><i class="finger"></i></div><div class="head"></div><div class="face"></div><i class="eye l"></i><i class="eye r"></i></div></section><div class="mist"></div><div class="drips"></div><div class="vignette"></div><header class="top"><div class="kicker">TIKNATION · AFTER HOURS</div><h1>THE MIMIC</h1><div class="sub">IT IS NOT YOUR REFLECTION</div></header><div class="alert">CONTAINMENT BREACH · SUBJECT APPROACHING</div><div class="controls"><div id="status">Something is moving beneath the surface</div><button id="trigger">BREAK THE SURFACE</button><div class="hint">Tap to release the presence · Sound begins after interaction</div></div></main>
<script>
(()=>{const scene=document.getElementById('scene'),button=document.getElementById('trigger'),status=document.getElementById('status');let released=false,audio;function sound(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let t=audio.currentTime;[38,51,57].forEach((hz,i)=>{let o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(hz,t);o.frequency.exponentialRampToValueAtTime(hz*.62,t+3);f.type='lowpass';f.frequency.value=170+i*60;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.065/(i+1),t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+3.1);o.connect(f);f.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+3.2)})}catch(e){}}
button.addEventListener('click',()=>{released=!released;scene.classList.toggle('active',released);button.textContent=released?'PUSH IT BACK':'BREAK THE SURFACE';status.textContent=released?'It has your face… and it is coming closer':'Something is moving beneath the surface';if(released)sound();else if(audio)audio.suspend()})})();
</script></body></html>
