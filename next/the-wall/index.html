<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03141c"><title>THE WALL — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020a10;color:#effaff;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#071b28 0%,#153847 43%,#07151e 100%);perspective:900px}
#clouds{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 28%,#a3bbc044,transparent 35%),radial-gradient(ellipse at 78% 20%,#d4e5e522,transparent 30%),linear-gradient(180deg,#07111caa,#06131c33);filter:blur(14px)}
#coast{position:absolute;left:-5%;right:-5%;bottom:18%;height:30%;background:linear-gradient(180deg,#354a49,#172a2c 65%,#071115);clip-path:polygon(0 48%,9% 39%,18% 47%,28% 33%,38% 46%,49% 37%,61% 49%,72% 31%,82% 42%,91% 34%,100% 43%,100% 100%,0 100%)}
#waterline{position:absolute;left:-15%;right:-15%;bottom:-15%;height:48%;background:linear-gradient(180deg,#1c7184,#0b3447 45%,#03131e);transform:rotateX(58deg);transform-origin:bottom;box-shadow:0 -20px 80px #65d6e933}
#wave{position:absolute;left:-15%;right:-15%;bottom:8%;height:78%;opacity:0;transform:translateY(75%) scale(1.12);transform-origin:bottom;transition:transform 2.2s cubic-bezier(.12,.65,.2,1),opacity .4s;background:radial-gradient(ellipse at 50% 100%,#e8ffff 0 2%,#8de7ef 4%,#248da3 14%,#0b536d 37%,#063246 67%,#02131e 100%);clip-path:polygon(0 100%,0 74%,5% 66%,11% 57%,17% 50%,24% 43%,31% 37%,39% 29%,47% 20%,55% 14%,63% 19%,70% 27%,78% 38%,86% 49%,93% 60%,100% 69%,100% 100%)}
#wave:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(168deg,transparent 0 24px,#c9ffff33 25px 28px,transparent 29px 48px),radial-gradient(ellipse at 52% 25%,#eaffff99,transparent 32%);filter:blur(3px);mix-blend-mode:screen}
#wave:after{content:"";position:absolute;left:0;right:0;top:16%;height:24%;background:linear-gradient(180deg,#f5ffffdd,#b8f7f5aa 28%,transparent);filter:blur(18px);clip-path:polygon(0 100%,12% 70%,25% 40%,39% 15%,53% 0,67% 20%,80% 45%,100% 100%)}
#spray{position:absolute;inset:0;opacity:0;background-image:radial-gradient(circle,#f0ffff 0 1px,transparent 2px),radial-gradient(circle,#a9edf2 0 2px,transparent 3px);background-size:31px 37px,67px 83px;background-position:0 0,19px 22px;filter:blur(.4px)}
#foam{position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,transparent 30%,#e8ffffaa 67%,#b8f7ffdd 100%);filter:blur(20px);transform:translateY(70%)}
#flash{position:absolute;inset:0;background:#eaffff;opacity:0;pointer-events:none}
#vignette{position:absolute;inset:0;box-shadow:inset 0 0 150px 45px #000b;pointer-events:none}
#scene.rising #wave{opacity:1;transform:translateY(0) scale(1)}
#scene.rising #spray{opacity:.7;animation:spray 1.1s linear infinite}
#scene.impact #foam{opacity:1;transform:translateY(0);transition:transform .5s ease-out}
#scene.impact #flash{animation:flash .35s ease-out}
#scene.impact #wave{transform:translateY(-10%) scale(1.15);filter:brightness(1.4)}
@keyframes spray{to{background-position:120px 180px,-90px 130px}}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
header{position:fixed;z-index:5;top:0;left:0;right:0;padding:18px 20px;display:flex;justify-content:space-between;font:900 10px Arial;letter-spacing:.2em;color:#d9faff}
.pill{border:1px solid #a7e6ff55;border-radius:30px;padding:8px 12px;background:#06131dcc}
.panel{position:fixed;z-index:6;bottom:6%;left:50%;transform:translateX(-50%);width:min(92%,580px);text-align:center;text-shadow:0 2px 20px #000}
.kicker{font-size:10px;font-weight:900;letter-spacing:.38em;color:#a8f2ff}
h1{font-size:clamp(42px,10vw,84px);letter-spacing:.08em;line-height:.9;margin:12px 0}
.desc{font-size:10px;letter-spacing:.2em;color:#d2edf1;font-weight:700}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
button{border:1px solid #b6efff;border-radius:30px;padding:14px 23px;background:linear-gradient(145deg,#287b8e,#102e40);color:white;font-weight:900;font-size:11px;letter-spacing:.14em;cursor:pointer;box-shadow:0 8px 30px #000a}
button.alt{background:#07131dcc;border-color:#8ab9cc88}
.note{font-size:9px;color:#b5d5dc;margin-top:10px;letter-spacing:.08em}
@media(max-width:600px){header{padding:13px;font-size:8px}.panel{bottom:7%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style></head><body>
<div id="scene"><div id="clouds"></div><div id="coast"></div><div id="waterline"></div><div id="wave"></div><div id="spray"></div><div id="foam"></div><div id="flash"></div><div id="vignette"></div></div>
<header><span>TIKNATION / GIFT PREVIEW</span><span class="pill" id="status">CALM WATER</span></header>
<section class="panel"><div class="kicker">THE HORIZON JUST DISAPPEARED</div><h1>THE WALL</h1><div class="desc">A MOUNTAIN OF WATER. NOWHERE TO RUN.</div><div class="actions"><button id="trigger">Unleash the wave</button><button class="alt" id="reset">Reset scene</button></div><div class="note">Preview only · Full-screen visual sequence · Tap to trigger</div></section>
<script>
(()=>{const s=document.getElementById('scene'),status=document.getElementById('status'),trigger=document.getElementById('trigger'),reset=document.getElementById('reset');let timer;
trigger.addEventListener('click',()=>{clearTimeout(timer);s.classList.remove('rising','impact');void s.offsetWidth;s.classList.add('rising');status.textContent='WAVE APPROACHING';trigger.disabled=true;timer=setTimeout(()=>{s.classList.add('impact');status.textContent='THE WALL HAS HIT';trigger.disabled=false},2300)});
reset.addEventListener('click',()=>{clearTimeout(timer);s.classList.remove('rising','impact');status.textContent='CALM WATER';trigger.disabled=false});
})();
</script></body></html>
