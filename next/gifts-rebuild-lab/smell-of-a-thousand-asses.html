<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10140b">
<title>The Smell of a Thousand Asses · TikNation Gift Lab</title>
<style>
:root{color-scheme:dark;--acid:#b7df38;--lime:#d7ff57;--ink:#080b06}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b06;color:#f3f1d9;font-family:system-ui,Arial,sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:12px;overflow-x:hidden}
.stage{position:relative;isolation:isolate;width:min(100%,900px);height:min(94svh,760px);min-height:620px;overflow:hidden;border:1px solid #687b2b;border-radius:22px;background:radial-gradient(ellipse at 50% 75%,#34352a 0,#1b2019 38%,#090d0b 82%);box-shadow:0 0 70px #9ac52b22}
.backdrop{position:absolute;inset:0;background:linear-gradient(180deg,#080d08bb 0%,transparent 34%,#080a08 78%),repeating-linear-gradient(90deg,transparent 0 79px,#d6d6c008 80px 82px),radial-gradient(ellipse at 12% 65%,#59604a33,transparent 34%),radial-gradient(ellipse at 88% 52%,#4b514433,transparent 30%)}
.moon{position:absolute;right:11%;top:8%;width:100px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4f0bf,#b9c47c 55%,#4d6132);box-shadow:0 0 55px 18px #c3ed6a22}
.title{position:absolute;z-index:10;top:22px;left:16px;right:16px;text-align:center;text-transform:uppercase;font-weight:1000;letter-spacing:.09em;font-size:clamp(19px,4vw,34px);text-shadow:0 3px 0 #17200c,0 0 20px #b7df3888}
.subtitle{display:block;margin-top:6px;font-size:10px;letter-spacing:.28em;color:#d1e98b}
bin{display:none}
.dumpster{position:absolute;z-index:2;left:50%;bottom:12%;transform:translateX(-50%);width:min(58%,470px);height:31%;border:7px solid #303a2b;border-top:16px solid #59634a;border-radius:5px 5px 16px 16px;background:repeating-linear-gradient(90deg,#30392e 0 34px,#4a5543 36px 39px,#252e26 43px 71px);box-shadow:inset 0 15px 22px #000b,inset 0 -12px 16px #080a08,0 27px 30px #000d;filter:drop-shadow(0 0 2px #89907844)}
.ground-shadow{position:absolute;z-index:1;left:50%;bottom:7%;transform:translateX(-50%);width:76%;height:9%;border-radius:50%;background:radial-gradient(ellipse,#000d 0%,#0009 42%,transparent 74%);filter:blur(7px)}\n.dumpster:before{content:"WASTE MANAGEMENT";position:absolute;top:19%;left:0;right:0;text-align:center;font-weight:800;font-size:clamp(9px,1.6vw,13px);letter-spacing:.18em;color:#c0c6a8;text-shadow:0 2px 3px #10140d}
.dumpster:after{content:"BIOHAZARD";position:absolute;top:48%;left:0;right:0;text-align:center;font-size:clamp(11px,2vw,17px);font-weight:900;letter-spacing:.2em;color:#b5bd9d;text-shadow:0 2px 3px #10140d}
.lid{position:absolute;z-index:3;left:50%;bottom:43%;transform:translateX(-50%) rotate(-3deg);width:min(64%,510px);height:35px;border:5px solid #414b37;border-radius:4px;background:repeating-linear-gradient(90deg,#515b49 0 48px,#323b30 50px 53px),linear-gradient(#7d8970,#343d30 45%,#1d251d);box-shadow:inset 0 4px 5px #c4cbb455,0 10px 15px #000b;transform-origin:15% 90%;transition:transform .8s}
.stink{position:absolute;z-index:4;left:50%;bottom:33%;width:70%;height:53%;transform:translateX(-50%);opacity:0;pointer-events:none;filter:blur(8px) saturate(.55)}
.puff{position:absolute;bottom:0;width:42%;height:58%;border-radius:48%;background:radial-gradient(ellipse at 48% 72%,#8d927c99 0,#747b6a77 28%,#a0a18b44 57%,transparent 76%);filter:blur(13px);animation:rise 5.8s ease-in-out infinite}
.puff:nth-child(1){left:8%;animation-delay:-1s}.puff:nth-child(2){left:31%;width:48%;animation-delay:-2.5s}.puff:nth-child(3){right:5%;animation-delay:-.4s}
.puff:nth-child(4){left:20%;bottom:30%;width:32%;animation-delay:-3s}.puff:nth-child(5){right:18%;bottom:35%;width:34%;animation-delay:-1.8s}
@keyframes rise{0%{transform:translateY(24px) scale(.72);opacity:0}22%{opacity:.55}100%{transform:translateY(-170px) scale(1.4);opacity:0}}
.fly{position:absolute;z-index:6;width:13px;height:8px;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 2px #000);transform-origin:center}
.fly:before{content:"";position:absolute;left:4px;top:3px;width:7px;height:3px;border-radius:50%;background:#080b08;box-shadow:0 0 0 1px #56604a}.fly:after{content:"";position:absolute;left:1px;top:0;width:5px;height:4px;border-radius:100% 100% 30% 30%;background:#b6c0ad99;transform:rotate(-28deg);box-shadow:5px 1px 0 -1px #b6c0ad99}.fly.one{left:43%;top:57%}.fly.two{left:55%;top:56%}.fly.three{left:49%;top:59%}
.stage.released .stink{opacity:1}.stage.released .lid{transform:translateX(-50%) rotate(-28deg) translateY(-18px)}
.stage.released .fly{opacity:1;animation:orbit 3s linear infinite}.fly.two{animation-duration:4.2s;animation-direction:reverse}.fly.three{animation-duration:2.6s}
@keyframes orbit{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(18px,-8px) rotate(12deg)}50%{transform:translate(8px,-19px) rotate(-8deg)}75%{transform:translate(-15px,-7px) rotate(10deg)}100%{transform:translate(0,0) rotate(0)}}
.shock{position:absolute;z-index:5;left:50%;bottom:27%;width:15px;height:15px;border:4px solid #dfff8b;border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}
.stage.released .shock{animation:shock 1.2s ease-out 1}
@keyframes shock{0%{transform:translate(-50%,-50%) scale(.1);opacity:1}100%{transform:translate(-50%,-50%) scale(32);opacity:0}}
.gauge{position:absolute;z-index:8;top:110px;left:50%;transform:translateX(-50%);width:min(75%,420px);text-align:center}
.gauge-label{font-size:11px;letter-spacing:.24em;color:#cde68b;font-weight:900}
.meter{height:12px;margin-top:9px;border:1px solid #a5c85b;border-radius:20px;background:#11190b;overflow:hidden;box-shadow:0 0 12px #b7df3822}
.fill{height:100%;width:0;background:linear-gradient(90deg,#648a22,#b6df38,#f2ff9b);transition:width 1s ease;box-shadow:0 0 16px #dfff65}
.readout{margin-top:8px;color:#efffb6;font-size:12px;font-weight:900;letter-spacing:.12em}
.controls{position:absolute;z-index:12;left:12px;right:12px;bottom:18px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
button{border:1px solid #b7df38;border-radius:999px;background:linear-gradient(#40551e,#1b2810);color:#f5ffd8;padding:13px 19px;font-size:12px;font-weight:1000;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #10170a,0 0 18px #b7df3822}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #10170a}
button:focus-visible{outline:3px solid white;outline-offset:3px}
button.primary{background:linear-gradient(#c1e94a,#648b25);color:#101606;border-color:#e6ff92}
.status{position:absolute;z-index:9;bottom:94px;left:10px;right:10px;text-align:center;min-height:22px;color:#e7f6b4;font-size:12px;font-weight:800;text-shadow:0 2px 5px #000}
.warning{position:absolute;z-index:9;top:164px;left:0;right:0;text-align:center;color:#b7c88e;font-size:10px;letter-spacing:.18em}
@media(max-width:560px){.stage{min-height:620px;height:94svh;border-radius:14px}.dumpster{width:72%;height:28%;bottom:15%}.lid{bottom:43%;width:78%}.stink{width:90%;bottom:34%}.gauge{top:112px}.warning{top:165px;font-size:9px}.controls{bottom:15px;gap:8px}button{padding:12px 14px;font-size:10px}.status{bottom:94px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="stage" id="stage">
<div class="backdrop"></div><div class="moon"></div>
<header class="title">THE SMELL OF A THOUSAND ASSES<span class="subtitle">A LEGENDARY TIKNATION GIFT · BIOHAZARD CLASS: OH NO</span></header>
<section class="gauge" aria-label="Stench meter"><div class="gauge-label">CONCENTRATED STENCH LEVEL</div><div class="meter"><div class="fill" id="fill"></div></div><div class="readout" id="readout">0 / 1,000,000 NOSE HAIRS DESTROYED</div></section>
<div class="warning">WARNING: DO NOT OPEN IN A CLOSED ROOM</div>
<div class="ground-shadow"></div><div class="dumpster"></div><div class="lid"></div>
<div class="stink" aria-hidden="true"><i class="puff"></i><i class="puff"></i><i class="puff"></i><i class="puff"></i><i class="puff"></i></div>
<div class="fly one" aria-hidden="true"></div><div class="fly two" aria-hidden="true"></div><div class="fly three" aria-hidden="true"></div><div class="shock"></div>
<audio id="stenchAudio" preload="auto" src="https://sfxmint.com/dl/natural-fart-02.mp3"></audio><div class="status" id="status" aria-live="polite">THE CONTAINER IS SEALED. FOR NOW.</div>
<div class="controls"><button class="primary" id="release">RELEASE THE STENCH 💨</button><button id="fan">ACTIVATE INDUSTRIAL FAN</button><button id="sound">SOUND: OFF</button><button id="reset">CONTAIN IT</button></div>
</main>
<script>
(()=> {
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),readout=document.getElementById('readout'),status=document.getElementById('status');
const release=document.getElementById('release'),fan=document.getElementById('fan'),sound=document.getElementById('sound'),reset=document.getElementById('reset');
let audioOn=false,fanOn=false;const stenchAudio=document.getElementById('stenchAudio');
async function playStench(){try{stenchAudio.pause();stenchAudio.currentTime=0;stenchAudio.volume=1;await stenchAudio.play();return true}catch(e){status.textContent='SOUND COULD NOT PLAY: '+e.message;return false}}
release.addEventListener('click',async()=>{stage.classList.add('released');fill.style.width='100%';readout.textContent='1,000,000 / 1,000,000 NOSE HAIRS DESTROYED';status.textContent='BIOHAZARD BREACH! THE FLIES HAVE CALLED THEIR LAWYER.';if(audioOn){playStench()}});
fan.addEventListener('click',()=>{fanOn=!fanOn;fan.textContent=fanOn?'STOP THE FAN':'ACTIVATE INDUSTRIAL FAN';if(fanOn&&stage.classList.contains('released'))status.textContent='THE FAN HAS MADE IT EVERYONE’S PROBLEM.';else if(fanOn)status.textContent='FAN READY. THIS MAY BE A TERRIBLE IDEA.';else status.textContent='FAN SHUT DOWN. THE AIR IS STILL SUSPICIOUS.'});
sound.addEventListener('click',async()=>{if(audioOn){audioOn=false;sound.textContent='SOUND: OFF';stenchAudio.pause();status.textContent='SOUND MUTED.';return}audioOn=true;sound.textContent='SOUND: ON';status.textContent='PLAYING A REAL RECORDED SOUND EFFECT';await playStench()});
reset.addEventListener('click',()=>{stage.classList.remove('released');fill.style.width='0%';readout.textContent='0 / 1,000,000 NOSE HAIRS DESTROYED';status.textContent='CONTAINMENT RESTORED. THE SMELL WILL REMAIN IN YOUR MEMORIES.';fanOn=false;fan.textContent='ACTIVATE INDUSTRIAL FAN';stenchAudio.pause();stenchAudio.currentTime=0});
})();
</script>
</body></html>
