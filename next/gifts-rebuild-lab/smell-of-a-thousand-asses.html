<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b08">
<title>The Smell of a Thousand Asses · TikNation</title>
<style>
:root{color-scheme:dark;--acid:#c8e879;--rust:#8d6840}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050705;color:#f5f3e9;font-family:system-ui,Arial,sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:10px}
.stage{position:relative;isolation:isolate;width:min(100%,1000px);height:min(96svh,900px);min-height:720px;overflow:hidden;border:1px solid #66705a;border-radius:20px;background:#151a13;box-shadow:0 24px 90px #000}
.environment{position:absolute;inset:0;z-index:-4;background:radial-gradient(ellipse at 50% 65%,#596047 0,#252d22 40%,#0a100c 80%)}
.swarm-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;opacity:0;filter:brightness(.48) saturate(.72) contrast(1.15);transition:opacity .7s}
.stage.flies .swarm-video,.stage.release .swarm-video{opacity:.8}
.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,#050806d9 0%,#05080635 40%,#05080688 70%,#030503 100%)}
.moon{position:absolute;right:12%;top:10%;width:clamp(48px,9vw,92px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fffde2,#c2c9a2 55%,#68745c);box-shadow:0 0 70px 20px #d9e8b42a}
.fence{position:absolute;left:0;right:0;bottom:24%;height:28%;opacity:.25;background:repeating-linear-gradient(90deg,transparent 0 35px,#aeb59c 36px 39px,transparent 40px 67px);mask-image:linear-gradient(transparent,#000)}
.ground{position:absolute;left:-5%;right:-5%;bottom:0;height:30%;background:linear-gradient(#343b2d,#111710 45%,#050805);clip-path:polygon(0 12%,100% 0,100% 100%,0 100%)}
.bin-shadow{position:absolute;left:50%;bottom:20%;width:82%;height:10%;transform:translateX(-50%);border-radius:50%;background:#000d;filter:blur(17px)}
.bin{position:absolute;left:50%;bottom:27%;width:min(70%,640px);height:35%;transform:translateX(-50%) perspective(900px) rotateY(-4deg);border:7px solid #1b241d;border-top:14px solid #66715e;border-radius:13px 13px 9px 9px;background:repeating-linear-gradient(90deg,#263329 0 28px,#53604d 30px 34px,#303b30 37px 62px);box-shadow:inset 0 15px 25px #d8e0c51a,inset 0 -30px 35px #000b,24px 22px 35px #000c}
.bin:before{content:"";position:absolute;inset:10% 6% 12%;border:1px solid #c2c9a044;background:linear-gradient(115deg,#fff2,transparent 32%,#0007 75%);box-shadow:inset 0 0 30px #000b}
.bin:after{content:"BIOHAZARD · MUNICIPAL WASTE";position:absolute;left:4%;right:4%;top:45%;text-align:center;color:#d4d9c5;font-size:clamp(9px,1.6vw,14px);font-weight:1000;letter-spacing:.18em;text-shadow:0 2px 5px #000}
.rib{position:absolute;top:0;bottom:0;width:5px;background:#101710;box-shadow:1px 0 #a7b39655}.r1{left:19%}.r2{left:40%}.r3{left:61%}.r4{left:82%}
.wheel{position:absolute;z-index:2;bottom:-10%;width:13%;height:19%;border-radius:50%;background:radial-gradient(circle,#79816c 0 13%,#101510 15% 58%,#4b5647 60% 68%,#070a07 70%);box-shadow:0 7px 12px #000}.wheel.left{left:11%}.wheel.right{right:11%}
.lid{position:absolute;z-index:5;left:50%;bottom:61%;width:min(75%,675px);height:35px;transform:translateX(-50%) rotate(-2deg);transform-origin:10% 90%;border:5px solid #273128;border-radius:7px;background:repeating-linear-gradient(90deg,#69745f 0 46px,#303b31 48px 53px);box-shadow:inset 0 5px 7px #dbe3c944,0 10px 20px #000d;transition:transform .8s}
.lid:after{content:"";position:absolute;right:12%;top:6px;width:15%;height:8px;border-radius:8px;background:#202820}
.trash{position:absolute;z-index:4;left:50%;bottom:59%;width:min(43%,350px);height:12%;transform:translateX(-50%);opacity:0;transition:opacity .5s}
.stage.stench .trash,.stage.release .trash{opacity:1}
.bag{position:absolute;bottom:0;width:31%;height:100%;border-radius:45% 42% 20% 20%;background:radial-gradient(ellipse at 30% 20%,#6a7251,#252d20 52%,#090e0a 85%);box-shadow:inset -12px -5px 15px #0009,0 4px 10px #0009}
.bag.one{left:10%;transform:rotate(-13deg)}.bag.two{left:38%;height:125%;transform:rotate(7deg)}.bag.three{right:5%;height:88%;transform:rotate(16deg)}
.stink{position:absolute;z-index:6;left:50%;bottom:48%;width:90%;height:45%;transform:translateX(-50%);opacity:0;pointer-events:none;mix-blend-mode:screen;transition:opacity .5s}
.stink:before,.stink:after{content:"";position:absolute;bottom:0;width:35%;height:100%;border-radius:50%;background:radial-gradient(ellipse at 50% 80%,#b7bd6c55,transparent 68%);filter:blur(13px);animation:stink-rise 4s ease-in-out infinite}
.stink:before{left:18%}.stink:after{right:16%;animation-delay:-2s}
@keyframes stink-rise{0%{transform:translateY(20px) scale(.7);opacity:0}35%{opacity:.8}100%{transform:translateY(-55px) scale(1.3);opacity:0}}
.stage.stench .stink,.stage.release .stink{opacity:1}
.fly-macro{position:absolute;z-index:8;right:3%;top:31%;width:min(32%,260px);aspect-ratio:16/9;overflow:hidden;border:2px solid #aab28c;border-radius:12px;box-shadow:0 12px 30px #000c;opacity:0;transform:translateX(20px) rotate(2deg);transition:opacity .5s,transform .5s}
.fly-macro video{width:100%;height:100%;object-fit:cover;display:block}
.stage.flies .fly-macro,.stage.release .fly-macro{opacity:1;transform:translateX(0) rotate(2deg)}
.macro-label{position:absolute;left:5px;bottom:5px;padding:3px 6px;background:#050805dd;border-radius:4px;font-size:8px;font-weight:900;letter-spacing:.1em}
.title{position:absolute;z-index:12;top:20px;left:12px;right:12px;text-align:center;font-size:clamp(19px,4vw,38px);font-weight:1000;line-height:1.04;letter-spacing:.045em;text-shadow:0 3px 5px #000,0 0 24px #d0e99a55}
.title small{display:block;margin-top:8px;font-size:10px;letter-spacing:.28em;color:#d8e8b0}
.warning{position:absolute;z-index:12;top:112px;left:0;right:0;text-align:center;font-size:10px;font-weight:900;letter-spacing:.2em;color:#e0e9bc}
.meter{position:absolute;z-index:12;top:138px;left:50%;transform:translateX(-50%);width:min(68%,440px);text-align:center}
.meter label{font-size:9px;letter-spacing:.2em;font-weight:950}
.track{height:9px;margin-top:6px;border:1px solid #a6b77a;border-radius:20px;background:#11170f;overflow:hidden}
.fill{height:100%;width:100%;background:linear-gradient(90deg,#8ea94b,#d8ef8b);transition:width .6s}
.meter strong{display:block;margin-top:5px;font-size:10px;color:#e7efcf;letter-spacing:.1em}
.status{position:absolute;z-index:15;left:10px;right:10px;bottom:195px;min-height:20px;text-align:center;font-size:11px;font-weight:900;color:#edf3d9;text-shadow:0 2px 6px #000}
.panel{position:absolute;z-index:20;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:10px;border:1px solid #7f9162;border-radius:15px;background:#080e0beF;box-shadow:0 10px 30px #000d}
.panel-title{grid-column:1/-1;text-align:center;font-size:11px;font-weight:1000;letter-spacing:.22em;color:#e6f0cd}
button{min-height:42px;border:1px solid #9aaf6d;border-radius:999px;background:linear-gradient(#43513b,#18231b);color:#f5f7ed;padding:9px 7px;font-size:10px;font-weight:950;letter-spacing:.04em;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(2px)}button.primary{background:linear-gradient(#d8ef9c,#829d49);color:#10170c;border-color:#efffc9}
button:focus-visible{outline:3px solid white;outline-offset:3px}
.audio-label{grid-column:1/-1;text-align:center;color:#e4edce;font-size:9px;font-weight:900;letter-spacing:.12em}
.fly-audio{grid-column:1/-1;width:100%;height:52px;display:block}
#reset{grid-column:1/-1}
@media(max-width:560px){body{padding:4px}.stage{height:98svh;min-height:720px;border-radius:12px}.bin{width:83%;height:31%;bottom:29%}.lid{width:88%;bottom:58%}.fly-macro{top:33%;width:40%;right:3%}.warning{top:104px}.meter{top:128px}.status{bottom:196px}.panel{left:6px;right:6px;bottom:6px;padding:8px;gap:6px}button{min-height:40px;font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage" id="stage">
<div class="environment"></div>
<video class="swarm-video" id="swarmVideo" muted autoplay loop playsinline preload="auto" src="https://videos.pexels.com/video-files/39825342/16986270_1920_1080_100fps.mp4"></video>
<div class="shade"></div><div class="moon"></div><div class="fence"></div><div class="ground"></div>
<header class="title">THE SMELL OF A THOUSAND ASSES<small>THE LEGENDARY BIOHAZARD GIFT</small></header>
<div class="warning">BIOHAZARD WARNING · OPEN AT YOUR OWN RISK</div>
<div class="meter"><label>NOSE-HAIR SURVIVAL METER</label><div class="track"><div class="fill" id="fill"></div></div><strong id="meterText">100% · AIR QUALITY: QUESTIONABLE</strong></div>
<div class="bin-shadow"></div>
<div class="bin"><i class="rib r1"></i><i class="rib r2"></i><i class="rib r3"></i><i class="rib r4"></i><i class="wheel left"></i><i class="wheel right"></i></div>
<div class="trash"><i class="bag one"></i><i class="bag two"></i><i class="bag three"></i></div>
<div class="lid"></div><div class="stink"></div>
<div class="fly-macro"><video muted autoplay loop playsinline preload="metadata" src="https://videos.pexels.com/video-files/29625617/12748542_3840_2160_30fps.mp4"></video><span class="macro-label">HOUSEFLY · MACRO FOOTAGE</span></div>
<div class="status" id="status" aria-live="polite">CONTAINMENT SEALED. NOTHING IS BUZZING… YET.</div>
<section class="panel" aria-label="Gift controls">
<div class="panel-title">BIOHAZARD RELEASE CONTROLS</div>
<button id="flies">🪰 RELEASE FLY SWARM</button><button id="stench">☣ OPEN THE DUMPSTER</button>
<div class="audio-label">REAL HOUSEFLY FIELD RECORDING · TAP PLAY TO HEAR THE BUZZ</div>
<iframe class="fly-audio" title="Real recorded housefly buzzing sound" src="https://freesound.org/embed/sound/iframe/717567/simple/medium/" loading="eager" allow="autoplay"></iframe>
<button class="primary" id="release">💨 RELEASE EVERYTHING</button><button id="fart">💥 TEST STENCH SOUND</button>
<button id="reset">↺ RESET / RECONTAIN</button>
</section>
</main>
<script>
(()=> {
const stage=document.getElementById('stage');
const status=document.getElementById('status');
const video=document.getElementById('swarmVideo');
const fill=document.getElementById('fill');
const meter=document.getElementById('meterText');
const fart=new Audio('https://sfxmint.com/dl/natural-fart-02.mp3');
fart.preload='auto';fart.volume=.85;
const say=t=>status.textContent=t;
function startVideos(){
 document.querySelectorAll('video').forEach(v=>{v.muted=true;v.loop=true;v.playsInline=true;const p=v.play();if(p&&p.catch)p.catch(()=>say('VIDEO DID NOT AUTOPLAY. TAP THE VIDEO TO START IT.'))});
}
document.getElementById('flies').addEventListener('click',()=>{
 const on=stage.classList.toggle('flies');
 if(on){startVideos();say('FLY SWARM RELEASED — REAL INSECT FOOTAGE IS MOVING.')}
 else say('FLY SWARM CONTAINED.');
});
document.getElementById('stench').addEventListener('click',()=>{
 const on=stage.classList.toggle('stench');
 fill.style.width=on?'18%':'100%';
 meter.textContent=on?'18% · AIR QUALITY: CATASTROPHIC':'100% · AIR QUALITY: QUESTIONABLE';
 say(on?'DUMPSTER OPEN. THE STENCH CLOUD IS RISING.':'DUMPSTER SEALED.');
});
document.getElementById('release').addEventListener('click',()=>{
 stage.classList.add('flies','stench','release');
 startVideos();fill.style.width='0%';
 meter.textContent='0% · AIR QUALITY: EXTINCTION EVENT';
 fart.currentTime=0;fart.play().then(()=>say('FULL BIOHAZARD RELEASE. FLY FOOTAGE AND STENCH EFFECT ACTIVE.')).catch(()=>say('VISUAL RELEASE ACTIVE. STENCH AUDIO WAS BLOCKED BY THE BROWSER.'));
});
document.getElementById('fart').addEventListener('click',()=>{
 fart.currentTime=0;fart.play().then(()=>say('STENCH SOUND EFFECT PLAYING.')).catch(()=>say('STENCH SOUND COULD NOT PLAY. CHECK MEDIA VOLUME.'));
});
document.getElementById('reset').addEventListener('click',()=>{
 stage.classList.remove('flies','stench','release');fill.style.width='100%';
 meter.textContent='100% · AIR QUALITY: QUESTIONABLE';fart.pause();fart.currentTime=0;
 say('CONTAINMENT RESTORED. YOUR NOSE IS SAFE… FOR NOW.');
});
})();
</script>
</body>
</html>
