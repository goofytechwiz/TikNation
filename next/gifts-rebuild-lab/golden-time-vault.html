<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Time Vault — TikNation Next</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 30%,#292016,#090a0c 68%);color:#fff0d0;font-family:system-ui,Arial,sans-serif}main{width:min(900px,100%);text-align:center}.tag{font-size:11px;letter-spacing:.28em;color:#c9aa73}h1{font-size:clamp(27px,5vw,46px);letter-spacing:.1em;margin:9px 0;text-shadow:0 0 24px #dca84c}.sub{color:#c7b99b;margin:0 0 17px;font-size:14px}.stage{position:relative;aspect-ratio:16/10;max-height:560px;min-height:270px;border:1px solid #90754d88;border-radius:18px;overflow:hidden;box-shadow:0 20px 70px #000;background:#080807}canvas{display:block;width:100%;height:100%}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}button{padding:12px 19px;border-radius:30px;border:1px solid #d8b66b;background:linear-gradient(#49371b,#21190d);color:#fff3d3;font-weight:750;letter-spacing:.06em;cursor:pointer}button.primary{background:linear-gradient(135deg,#a7792c,#594016)}.hint,.foot{font-size:12px;color:#a99773}.foot{font-size:10px;letter-spacing:.12em;margin-top:16px}
</style></head><body><main><div class="tag">TIKNATION NEXT · GIFT REBUILD LAB</div><h1>THE GOLDEN TIME VAULT</h1><p class="sub">A massive steel vault door unlocks to reveal a forgotten fortune.</p><div class="stage"><canvas id="v"></canvas></div><div class="controls"><button class="primary" id="again">↻ OPEN THE VAULT</button><button id="audio">♫ SOUND: OFF</button></div><div class="hint">Sound is optional. Tap to replay the vault opening.</div><div class="foot">STANDALONE PREVIEW · NOT YET IN THE LIVE GIFT CATALOG</div></main>
<script>
(()=>{const c=document.getElementById('v'),g=c.getContext('2d');let W,H,start=performance.now(),coins=[],sound=false,ac,seed=41;
function size(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}new ResizeObserver(size).observe(c);size();
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function tone(f,d,type='sine',vol=.07){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(vol,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(a);a.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function replay(){start=performance.now();coins=[];tone(62,.9,'sawtooth',.11);setTimeout(()=>tone(135,.8,'triangle',.09),500);setTimeout(()=>tone(720,.32,'sine',.05),1500)}
function coin(){return{x:W*.61+(Math.random()-.5)*W*.23,y:H*.65,vx:(Math.random()-.5)*3,vy:-2-Math.random()*4,rot:Math.random()*6,spin:(Math.random()-.5)*.22,r:3+Math.random()*5}}
function ellipse(x,y,rx,ry,fill,stroke,lw=1){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function draw(now){const t=(now-start)/1000;g.clearRect(0,0,W,H);
let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#16191b');bg.addColorStop(.58,'#24201a');bg.addColorStop(1,'#08090b');g.fillStyle=bg;g.fillRect(0,0,W,H);
// rough stone wall and visible masonry
for(let row=0;row<6;row++){let yy=H*.06+row*H*.115;for(let col=0;col<9;col++){let xx=col*W*.13+(row%2)*W*.065;g.fillStyle=['#34312b','#292923','#3a352c'][(row*7+col)%3];g.fillRect(xx,yy,W*.125,H*.105);g.strokeStyle='#111310';g.lineWidth=2;g.strokeRect(xx,yy,W*.125,H*.105);}}
for(let i=0;i<360;i++){let xx=(i*83)%W,yy=(i*47)%H;g.fillStyle='rgba(0,0,0,'+(.08+(i%4)*.025)+')';g.fillRect(xx,yy,1.5,1.5)}
// floor perspective
g.fillStyle='#171512';g.beginPath();g.moveTo(W*.08,H);g.lineTo(W*.26,H*.65);g.lineTo(W*.78,H*.65);g.lineTo(W*.96,H);g.closePath();g.fill();g.strokeStyle='#4a3b27';g.lineWidth=1;for(let i=0;i<9;i++){g.beginPath();g.moveTo(W*(.26+i*.065),H*.66);g.lineTo(W*(.05+i*.115),H);g.stroke()}for(let i=0;i<4;i++){g.beginPath();g.moveTo(W*.1,H*(.72+i*.07));g.lineTo(W*.9,H*(.72+i*.07));g.stroke()}
// round reinforced vault recess
const cx=W*.49,cy=H*.43,R=Math.min(W*.31,H*.38);
ellipse(cx,cy,R*1.13,R*1.13,'#0b0d0e','#6f6048',10);ellipse(cx,cy,R*1.04,R*1.04,'#292b2a','#b39a6b',5);ellipse(cx,cy,R*.98,R*.98,'#101517','#090a0a',8);
// chamber interior dark tunnel
g.save();g.beginPath();g.ellipse(cx+R*.38,cy,R*.77,R*.83,0,0,7);g.clip();let inside=g.createRadialGradient(cx+R*.35,cy,5,cx+R*.35,cy,R);inside.addColorStop(0,'#fff0a0');inside.addColorStop(.25,'#a76c24');inside.addColorStop(.58,'#39230e');inside.addColorStop(1,'#090a0b');g.fillStyle=inside;g.fillRect(cx-R,cy-R,R*2.2,R*2);
if(t>1.5){g.globalAlpha=.8;g.fillStyle='#dca13a';for(let row=0;row<4;row++)for(let j=0;j<6-row;j++){let xx=cx+R*.02+j*R*.17+(row%2)*5,yy=cy+R*.48-row*R*.18;g.save();g.translate(xx,yy);g.rotate(-.08);g.fillStyle='#b77a24';g.fillRect(-R*.075,-R*.035,R*.15,R*.07);g.strokeStyle='#ffe18a';g.lineWidth=1;g.strokeRect(-R*.075,-R*.035,R*.15,R*.07);g.restore()}}
g.restore();
// vault door: circular steel slab swings on left hinge, with perspective ellipse
const open=Math.max(0,Math.min(1,(t-.55)/2));g.save();g.translate(cx-R*.92,cy);g.rotate(-open*1.48);g.transform(1,0,0,.96,0,0);
ellipse(0,0,R*.92,R*.92,'#20282c','#a8a18c',7);let steel=g.createRadialGradient(-R*.25,-R*.28,R*.08,0,0,R);steel.addColorStop(0,'#b9c0bd');steel.addColorStop(.22,'#626d70');steel.addColorStop(.55,'#303b40');steel.addColorStop(.82,'#151c20');steel.addColorStop(1,'#7f8179');ellipse(0,0,R*.84,R*.84,steel,'#c5b68f',4);ellipse(0,0,R*.69,R*.69,'rgba(0,0,0,0)','#aeb3a9',3);ellipse(0,0,R*.49,R*.49,'rgba(0,0,0,0)','#626f73',5);
for(let i=0;i<12;i++){let a=i*Math.PI/6,px=Math.cos(a)*R*.75,py=Math.sin(a)*R*.75;ellipse(px,py,R*.035,R*.035,'#c3b58f','#252a2a',2);g.strokeStyle='#252a2a';g.lineWidth=1;g.beginPath();g.moveTo(px-R*.014,py);g.lineTo(px+R*.014,py);g.stroke()}
for(let i=0;i<8;i++){let a=i*Math.PI/4;g.strokeStyle='#b2b5aa';g.lineWidth=R*.035;g.beginPath();g.moveTo(Math.cos(a)*R*.13,Math.sin(a)*R*.13);g.lineTo(Math.cos(a)*R*.42,Math.sin(a)*R*.42);g.stroke()}
ellipse(0,0,R*.16,R*.16,'#a18a57','#272a28',4);ellipse(0,0,R*.075,R*.075,'#303b3e','#c5b783',3);g.restore();
// treasure glow spills onto floor
if(open>.2){let glow=g.createRadialGradient(cx+R*.45,cy,5,cx+R*.45,cy,R*1.5);glow.addColorStop(0,'rgba(255,192,69,.35)');glow.addColorStop(1,'transparent');g.fillStyle=glow;g.fillRect(0,0,W,H)}
if(t>2.2&&coins.length<100&&Math.random()<.55)coins.push(coin());
for(let p of coins){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.rot+=p.spin;g.save();g.translate(p.x,p.y);g.rotate(p.rot);ellipse(0,0,p.r,p.r*.55,'#e9b943','#fff0a3',1);g.restore()}coins=coins.filter(p=>p.y<H+20);
// floating dust in gold light
for(let i=0;i<26;i++){let px=(i*79+now*.01)%W,py=(i*41+Math.sin(now*.001+i)*13)%H;g.fillStyle='rgba(255,218,144,.55)';g.fillRect(px,py,1.8,1.8)}
requestAnimationFrame(draw)}requestAnimationFrame(draw);
document.getElementById('again').onclick=replay;document.getElementById('audio').onclick=()=>{sound=!sound;document.getElementById('audio').textContent='♫ SOUND: '+(sound?'ON':'OFF');if(sound){tone(410,.16);setTimeout(()=>tone(620,.22),120)}};replay();
})();
</script></body></html>
