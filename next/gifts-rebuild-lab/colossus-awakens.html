<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Colossus Awakens · 3D Model Preview</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d15;color:#edf7ff;font-family:system-ui,Arial}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#263544 0,#111c29 38%,#05080e 78%);z-index:0}
.ruin{position:fixed;inset:auto 0 0;height:36vh;z-index:0;opacity:.8;background:linear-gradient(transparent,#05070b 70%),repeating-linear-gradient(90deg,transparent 0 11%,#111923 11.2% 12%,transparent 12.3% 22%);clip-path:polygon(0 20%,8% 20%,8% 0,13% 0,13% 32%,22% 32%,22% 9%,28% 9%,28% 40%,39% 40%,39% 12%,44% 12%,44% 38%,55% 38%,55% 0,61% 0,61% 24%,72% 24%,72% 8%,78% 8%,78% 33%,88% 33%,88% 0,94% 0,94% 21%,100% 21%,100% 100%,0 100%)}
header{position:fixed;z-index:3;top:18px;left:0;right:0;text-align:center;text-shadow:0 3px 18px #000}.eyebrow{font-size:10px;letter-spacing:.38em;color:#a4c4d4}.title{font-weight:900;font-size:clamp(23px,6vw,44px);letter-spacing:.09em;margin:4px 0}.sub{font-size:10px;letter-spacing:.18em;color:#b6c8d1}
model-viewer{position:fixed;z-index:1;inset:0;width:100%;height:100%;--poster-color:transparent;background:transparent}
.panel{position:fixed;z-index:4;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:12px 15px;border:1px solid #a4d9e644;border-radius:14px;background:#08131de8;backdrop-filter:blur(12px);text-align:center}.state{font-size:11px;letter-spacing:.12em;color:#c5e5f1}.detail{font-size:10px;color:#9db4c1;margin-top:5px}.actions{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}button{border:1px solid #8bc5d6;background:#15354a;color:#eafaff;border-radius:24px;padding:10px 16px;font-weight:800;font-size:10px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="ruin"></div>
<header><div class="eyebrow">AN ANCIENT POWER STIRS</div><div class="title">THE COLOSSUS AWAKENS</div><div class="sub">A REAL 3D CHARACTER MODEL · NOT PRIMITIVE SHAPES</div></header>
<model-viewer id="model" camera-controls auto-rotate rotation-per-second="12deg" shadow-intensity="1.2" exposure="1.1" environment-image="neutral" interaction-prompt="none" ar-status="not-presenting" autoplay>
</model-viewer>
<section class="panel"><div class="state" id="state">SEARCHING THE PUBLIC CC0 3D MODEL LIBRARY…</div><div class="detail" id="detail">Looking for a real stone golem or giant model. No upload required.</div><div class="actions"><button id="retry">SEARCH AGAIN</button><button id="sound">SOUND: OFF</button></div></section>
<script>
const model=document.querySelector('#model'),state=document.querySelector('#state'),detail=document.querySelector('#detail');
const API='https://3dassets.dev/api/v1';
function listFrom(data){if(Array.isArray(data))return data;return data.assets||data.results||data.items||data.data||[]}
function score(a){const s=((a.title||a.name||'')+' '+(a.summary||a.description||'')+' '+(a.tags||[]).join(' ')).toLowerCase();let n=0;for(const [w,v] of [['golem',12],['stone',9],['rock',5],['giant',7],['titan',6],['monster',3],['creature',2],['character',1]])if(s.includes(w))n+=v;return n}
async function search(){state.textContent='SEARCHING THE PUBLIC 3D MODEL LIBRARY…';detail.textContent='Finding a proper sculpted creature model.';model.removeAttribute('src');
try{
 const res=await fetch(API+'/assets?q=stone%20golem&sort=relevance&limit=40');if(!res.ok)throw new Error('Asset search returned '+res.status);const raw=await res.json();const items=listFrom(raw).sort((a,b)=>score(b)-score(a));
 if(!items.length)throw new Error('The asset library returned no matching models.');
 let chosen=null,full=null;
 for(const item of items.slice(0,12)){const slug=item.slug||item.id;if(!slug)continue;const dres=await fetch(API+'/assets/'+encodeURIComponent(slug));if(!dres.ok)continue;const d=await dres.json();const asset=d.asset||d.data||d;const url=asset.cdnUrl||asset.cdn_url||asset.modelUrl||asset.model_url;if(url){chosen=asset;full=url;break}}
 if(!chosen)throw new Error('No matching result included a usable public GLB model.');
 model.src=full;model.alt=chosen.title||chosen.name||'3D stone creature';state.textContent='3D MODEL LOADING';detail.textContent=(chosen.title||chosen.name||'Stone creature')+' · Public CC0 model';model.addEventListener('load',()=>{state.textContent='MODEL LOADED · DRAG TO INSPECT';detail.textContent=(chosen.title||chosen.name||'3D creature')+' · Real mesh and materials · Live gifts untouched'},{once:true});model.addEventListener('error',()=>{state.textContent='MODEL COULD NOT LOAD';detail.textContent='The public model host did not return a compatible GLB.'},{once:true});
}catch(e){state.textContent='NO VERIFIED MODEL FOUND';detail.textContent=e.message+' The preview will not substitute another homemade rock figure.'}
}
document.querySelector('#retry').onclick=search;let audio=null,on=false;document.querySelector('#sound').onclick=()=>{on=!on;document.querySelector('#sound').textContent='SOUND: '+(on?'ON':'OFF');if(on){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=42;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+1.4)}catch(e){}}};search();
</script>
</body></html>
