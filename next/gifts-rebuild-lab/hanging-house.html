<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>THE HANGING HOUSE · TikNation Gift Rebuild Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#eee;font-family:Arial,Helvetica,sans-serif}
#scene{position:absolute;inset:0;background:#090909}canvas{display:block;width:100%;height:100%}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 30%,#000c 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#label{position:absolute;top:14px;left:14px;z-index:3;padding:8px 10px;background:#050505c9;border:1px solid #766047;color:#d1b68d;font-size:9px;letter-spacing:.2em}
#hud{position:absolute;z-index:4;bottom:0;left:0;right:0;padding:30px 16px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#030405f5 42%)}
.eyebrow{font-size:10px;letter-spacing:.32em;color:#c9a16b}h1{font-size:clamp(24px,5vw,40px);letter-spacing:.13em;margin:7px 0 5px}
#desc{font-size:13px;line-height:1.4;color:#c9c0b4;max-width:560px;margin:0 0 13px}
button{min-width:215px;padding:14px 22px;border:1px solid #a17b4e;background:linear-gradient(#553923,#21160f);color:#fff;font-weight:800;letter-spacing:.17em;font-size:11px;border-radius:2px}
button:disabled{opacity:.5}#status{margin-left:12px;color:#c9a579;font-size:10px;letter-spacing:.15em}
body.event #flash{animation:flash .55s steps(1) 7}
@keyframes flash{0%,100%{opacity:0}30%{opacity:.7}}
@media(max-width:600px){#hud{padding-left:13px;padding-right:13px}#desc{max-width:330px}}
</style></head><body>
<div id="scene"><canvas id="view"></canvas></div><div id="vignette"></div><div id="flash"></div>
<div id="label">TIKNATION · GIFT REBUILD LAB · SELF-CONTAINED PREVIEW</div>
<section id="hud"><div class="eyebrow">A house with no gravity</div><h1>THE HANGING HOUSE</h1><p id="desc">The mansion groans. The chandelier swings. The furniture tears loose as the room shifts above you.</p><button id="trigger">TRIGGER THE INCIDENT</button><span id="status">STANDBY</span></section>
<script>
(()=>{
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),btn=document.getElementById('trigger'),status=document.getElementById('status');
let w=0,h=0,dpr=1,active=false,start=0,raf=0;
function resize(){dpr=Math.min(devicePixelRatio||1,1.6);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a);
function poly(points,fill,stroke,line=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function gradient(x,y,x2,y2,stops){const g=ctx.createLinearGradient(x,y,x2,y2);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function rounded(x,y,ww,hh,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
function drawPortrait(x,y,s){ctx.fillStyle='#17110b';ctx.fillRect(x-4*s,y-4*s,48*s,66*s);ctx.strokeStyle='#94764c';ctx.lineWidth=4*s;ctx.strokeRect(x,y,40*s,58*s);const g=ctx.createRadialGradient(x+20*s,y+18*s,2,x+20*s,y+28*s,24*s);g.addColorStop(0,'#6c5941');g.addColorStop(1,'#080706');ctx.fillStyle=g;ctx.fillRect(x+4*s,y+4*s,32*s,50*s);ctx.fillStyle='#090807';ctx.beginPath();ctx.ellipse(x+20*s,y+22*s,7*s,10*s,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x+7*s,y+51*s);ctx.quadraticCurveTo(x+20*s,y+26*s,x+33*s,y+51*s);ctx.fill()}
function drawRoom(t,e){
ctx.clearRect(0,0,w,h);const shake=active?Math.sin(e*31)*Math.min(7,e*2):0;ctx.save();ctx.translate(shake,Math.sin(t*.8)*1.5);
const cx=w*.5,top=h*.07,roomW=Math.min(w*.94,1100),left=cx-roomW/2,right=cx+roomW/2,backY=h*.17,floorY=h*.76;
// outside darkness
ctx.fillStyle=gradient(0,0,0,h,[[0,'#080a0d'],[.65,'#17130e'],[1,'#020202']]);ctx.fillRect(0,0,w,h);
// ceiling plane
poly([[left,top],[right,top],[right- roomW*.12,backY],[left+roomW*.12,backY]],gradient(0,top,0,backY,[[0,'#40382e'],[1,'#171411']]),'#0b0907',8);
for(let i=0;i<7;i++){const x=left+roomW*i/6;ctx.strokeStyle='#17120d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(cx+(x-cx)*.78,backY);ctx.stroke()}
for(let j=0;j<4;j++){const y=top+(backY-top)*j/4;ctx.strokeStyle='#292219';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(left+(right-left)*j*.015,y);ctx.lineTo(right-(right-left)*j*.015,y);ctx.stroke()}
// back wall
poly([[left+roomW*.12,backY],[right-roomW*.12,backY],[right-roomW*.12,floorY],[left+roomW*.12,floorY]],gradient(left,backY,right,floorY,[[0,'#292219'],[.5,'#51402d'],[1,'#201a13']]),'#0a0908',8);
const wallL=left+roomW*.12,wallR=right-roomW*.12,wallW=wallR-wallL;
for(let i=0;i<6;i++){const x=wallL+wallW*i/5;ctx.strokeStyle='#17120e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,backY);ctx.lineTo(x,floorY);ctx.stroke()}
for(let i=0;i<4;i++){const y=backY+(floorY-backY)*i/4;ctx.strokeStyle='#211910';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(wallL,y);ctx.lineTo(wallR,y);ctx.stroke()}
// floorboards with perspective
poly([[left+roomW*.12,floorY],[right-roomW*.12,floorY],[right,h],[left,h]],gradient(0,floorY,0,h,[[0,'#4a3423'],[1,'#100c08']]),'#070605',6);
for(let i=0;i<11;i++){const y=floorY+(h-floorY)*i/11;ctx.strokeStyle='rgba(9,6,4,.65)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(left+roomW*.12-(i*5),y);ctx.lineTo(right-roomW*.12+(i*5),y);ctx.stroke()}
for(let i=0;i<12;i++){const x=left+roomW*.12+wallW*i/12;ctx.strokeStyle='rgba(8,6,4,.55)';ctx.beginPath();ctx.moveTo(x,floorY);ctx.lineTo(cx+(x-cx)*1.8,h);ctx.stroke()}
// window with deep frame, moon and bars
const wx=cx-roomW*.105,wy=backY+(floorY-backY)*.12,ww=roomW*.21,wh=(floorY-backY)*.65;
rounded(wx-12,wy-12,ww+24,wh+24,3,'#100d09','#9b784b');ctx.fillStyle=gradient(wx,wy,wx,wy+wh,[[0,'#09111a'],[.55,'#17222b'],[1,'#050708']]);ctx.fillRect(wx,wy,ww,wh);
const moonX=wx+ww*.74,moonY=wy+wh*.22;ctx.fillStyle='#c4bda5';ctx.shadowColor='#c4bda5';ctx.shadowBlur=25;ctx.beginPath();ctx.arc(moonX,moonY,Math.min(ww,wh)*.075,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
ctx.strokeStyle='#a48a5d';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(wx+ww/2,wy);ctx.lineTo(wx+ww/2,wy+wh);ctx.moveTo(wx,wy+wh/2);ctx.lineTo(wx+ww,wy+wh/2);ctx.stroke();
// portraits
drawPortrait(wallL+wallW*.11,backY+(floorY-backY)*.19,Math.min(1,roomW/850));drawPortrait(wallR-wallW*.19,backY+(floorY-backY)*.19,Math.min(1,roomW/850));
// wall sconces with pools of warm light
for(const x of [wallL+wallW*.035,wallR-wallW*.035]){ctx.fillStyle='#ad8955';ctx.fillRect(x-5,backY+(floorY-backY)*.4,10,32);ctx.fillStyle='#ffc879';ctx.shadowColor='#e5a95e';ctx.shadowBlur=35;ctx.beginPath();ctx.ellipse(x,backY+(floorY-backY)*.39,8,17,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
// chandelier hanging on a swaying chain
const sway=active?Math.sin(e*4)*.25:Math.sin(t*1.1)*.035;ctx.save();ctx.translate(cx,h*.08);ctx.rotate(sway);ctx.strokeStyle='#9c835c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,h*.22);ctx.stroke();ctx.translate(0,h*.22);ctx.strokeStyle='#a58a60';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(0,0,roomW*.075,12,0,0,Math.PI*2);ctx.stroke();for(let i=0;i<6;i++){const a=i*Math.PI/3,x=Math.cos(a)*roomW*.07,y=Math.sin(a)*10;ctx.strokeStyle='#94764b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle='#ffbf6a';ctx.shadowColor='#ffb04c';ctx.shadowBlur=18;ctx.beginPath();ctx.ellipse(x,y-13,4,9,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}ctx.restore();
// sofa: arms, upholstered body, seams, cushions
const scale=Math.min(1,roomW/900),sofaX=left+roomW*.17,sofaY=floorY-12+(active?Math.sin(e*4)*15:0),sofaW=roomW*.27;
ctx.save();ctx.translate(sofaX,sofaY);ctx.rotate(active?Math.sin(e*3)*.08:0);
rounded(-8,-sofaW*.32,sofaW*.95,sofaW*.32,18*scale,'#21140f','#100b08');rounded(0,-sofaW*.48,sofaW*.82,sofaW*.27,22*scale,gradient(0,-sofaW*.48,0,0,[[0,'#684536'],[1,'#2b1b15']]),'#170e0b');
for(let i=0;i<3;i++){rounded(sofaW*(.05+i*.255),-sofaW*.28,sofaW*.23,sofaW*.19,10*scale,gradient(0,-sofaW*.28,0,0,[[0,'#74503e'],[1,'#39251d']]),'#261711')}
ctx.strokeStyle='#9a7254';ctx.globalAlpha=.3;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sofaW*.1,-sofaW*.45);ctx.lineTo(sofaW*.75,-sofaW*.45);ctx.stroke();ctx.restore();
// table and carved legs
const tx=cx,ty=floorY+25;ctx.save();ctx.translate(tx,ty);ctx.rotate(active?Math.sin(e*4.4)*.08:0);poly([[-roomW*.13,-20],[roomW*.13,-20],[roomW*.105,18],[-roomW*.105,18]],gradient(0,-20,0,18,[[0,'#956d43'],[1,'#2c1b10']]),'#120c08',5);for(let x of [-roomW*.105,roomW*.105]){ctx.fillStyle='#24160e';ctx.fillRect(x-5,5,10,roomW*.09)}ctx.restore();
// chair right
const chx=right-roomW*.2,chy=floorY+5;ctx.save();ctx.translate(chx,chy);ctx.rotate(active?Math.sin(e*4+1)*.17:0);rounded(-roomW*.055,-roomW*.19,roomW*.11,roomW*.18,10,'#332015','#120c08');rounded(-roomW*.065,-roomW*.06,roomW*.13,roomW*.07,8,'#63432c','#1a100a');ctx.fillStyle='#1d130d';ctx.fillRect(-roomW*.05,0,8,roomW*.1);ctx.fillRect(roomW*.04,0,8,roomW*.1);ctx.restore();
// shadow figure outside window
if(active&&e>1){const fx=wx+ww*Math.min(1.1,(e-1)*.42);ctx.fillStyle='rgba(0,0,0,.9)';ctx.beginPath();ctx.ellipse(fx,wy+wh*.48,ww*.075,wh*.22,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(fx,wy+wh*.22,ww*.055,0,Math.PI*2);ctx.fill()}
// dust particles
for(let i=0;i<45;i++){const x=(i*97+t*13)%w,y=(i*47+t*7)%Math.max(1,floorY);ctx.fillStyle='rgba(220,195,150,.23)';ctx.fillRect(x,y,2,2)}
// active furniture debris and room tilting cues
if(active&&e>1){for(let i=0;i<20;i++){const q=(e*170+i*83)%(h*.72),x=(i*137+Math.sin(e*5+i)*90)%w;ctx.save();ctx.translate(x,q);ctx.rotate(e*5+i);ctx.fillStyle=i%2?'#8b765b':'#33251a';ctx.fillRect(-5,-10,10+ i%4*3,18);ctx.restore()}}
ctx.restore();
}
function loop(now){const t=now/1000,e=active?t-start:0;drawRoom(t,e);if(active&&e>6.3){active=false;status.textContent='STANDBY';btn.disabled=false;document.body.classList.remove('event')}raf=requestAnimationFrame(loop)}
function sound(){try{const ac=new(window.AudioContext||window.webkitAudioContext)(),master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);const burst=(freq,dur,vol)=>{const n=ac.sampleRate*dur,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,.8);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start()};const boom=(freq,dur,vol)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(25,ac.currentTime+dur);g.gain.setValueAtTime(vol,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(master);o.start();o.stop(ac.currentTime+dur)};boom(55,4,.18);burst(280,4,.17);setTimeout(()=>{boom(90,1,.14);burst(1300,1,.12)},900);setTimeout(()=>{boom(38,3,.22);burst(190,3,.2)},2600);setTimeout(()=>{boom(30,2,.2);burst(500,2,.18)},4200)}catch(e){}}
btn.addEventListener('click',()=>{if(active)return;active=true;start=performance.now()/1000;btn.disabled=true;status.textContent='STRUCTURAL FAILURE';document.body.classList.add('event');sound()});
loop(0);
})();
</script></body></html>
