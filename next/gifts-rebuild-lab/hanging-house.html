<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE HANGING HOUSE · TikNation Gift Rebuild Lab</title>
<style>
:root{color-scheme:dark;--amber:#d89b50;--red:#9d2925}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#eee;font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(ellipse at 50% 45%,#20201e 0,#090a0b 55%,#020303 100%)}
#stage{position:absolute;inset:0;perspective:900px;overflow:hidden;background:linear-gradient(#101214 0%,#080909 70%,#020303 100%)}
#room{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(0deg) rotateZ(0deg) scale(1);transition:transform 1s ease}
#ceiling{position:absolute;width:130vw;height:120vh;left:-15vw;top:-48vh;transform:rotateX(72deg) translateZ(220px);transform-origin:center bottom;background:repeating-linear-gradient(90deg,#282725 0 2px,#171716 2px 100px),linear-gradient(#37342e,#121212);border:14px solid #080808;box-shadow:inset 0 0 90px #000,0 20px 60px #000}
#backwall{position:absolute;left:12%;top:10%;width:76%;height:70%;transform:translateZ(-300px);background:linear-gradient(90deg,#171717,#37332c 48%,#191817);border:10px solid #090909;box-shadow:inset 0 0 100px #000}
#wallpaper{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 95px,#0b0b0b 97px 100px),repeating-linear-gradient(0deg,transparent 0 115px,#0b0b0b 117px 120px);opacity:.7}
#window{position:absolute;left:36%;top:15%;width:28%;height:58%;border:13px solid #080909;background:linear-gradient(140deg,#07090a,#111515 55%,#030404);box-shadow:0 0 35px #000,inset 0 0 35px #000}
#window:before,#window:after{content:"";position:absolute;background:#090a0a}
#window:before{width:8px;height:100%;left:50%}#window:after{height:8px;width:100%;top:50%}
#moon{position:absolute;right:12%;top:14%;width:54px;height:54px;border-radius:50%;background:#b6a58a;box-shadow:0 0 35px #b9a27a;opacity:.45}
#floor{position:absolute;left:-15%;top:58%;width:130%;height:90%;transform:rotateX(78deg) translateZ(-80px);transform-origin:top;background:repeating-linear-gradient(90deg,#161514 0 95px,#24211d 96px 100px),repeating-linear-gradient(0deg,transparent 0 95px,#080808 97px 100px);box-shadow:inset 0 0 130px #000}
#chandelier{position:absolute;left:50%;top:2%;width:5px;height:24%;background:#171717;transform:translateX(-50%)}
#chandelier:after{content:"";position:absolute;left:-58px;bottom:-14px;width:120px;height:22px;border-radius:50%;background:radial-gradient(ellipse,#d5a65e 0,#80603c 18%,#1b1711 55%,transparent 72%);filter:drop-shadow(0 0 18px #b27a37)}
.furniture{position:absolute;transform-style:preserve-3d;filter:drop-shadow(0 16px 13px #000)}
#sofa{width:280px;height:100px;left:13%;top:55%;background:linear-gradient(#3b2922,#201713);border:8px solid #120e0c;border-radius:15px;transform:rotateX(10deg) rotateY(-8deg) translateZ(60px)}
#sofa:before{content:"";position:absolute;left:12px;right:12px;top:-50px;height:54px;background:linear-gradient(100deg,#4b342b,#211815);border:7px solid #120e0c;border-radius:14px}
#table{width:230px;height:18px;left:55%;top:61%;background:linear-gradient(#6b5942,#211a13);transform:rotateY(-18deg) translateZ(90px);box-shadow:0 14px 0 -5px #15110d}
#table:before,#table:after{content:"";position:absolute;top:12px;width:12px;height:100px;background:#18130f}#table:before{left:22px}#table:after{right:22px}
#chair{width:90px;height:80px;left:73%;top:48%;background:linear-gradient(90deg,#201711,#493322);border:7px solid #120e0a;transform:rotateY(25deg) translateZ(130px)}
#chair:before{content:"";position:absolute;left:-6px;top:-68px;width:88px;height:70px;background:linear-gradient(90deg,#241911,#503a2a);border:7px solid #120e0a}
.chain{position:absolute;top:-10%;height:70%;width:4px;background:repeating-linear-gradient(0deg,#6b6254 0 5px,#171615 5px 9px);transform-origin:top;filter:drop-shadow(0 0 3px #000)}
#chain1{left:29%}#chain2{left:68%}
.swing{animation:swing 1.1s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(17deg)}to{transform:rotate(-18deg)}}
#debris{position:absolute;inset:0;pointer-events:none}
.shard{position:absolute;width:30px;height:55px;background:linear-gradient(120deg,#8e8a7d,#272522 45%,#aaa08a);clip-path:polygon(50% 0,100% 80%,22% 100%,0 35%);opacity:0;filter:drop-shadow(0 0 6px #000)}
#shadow{position:absolute;width:90px;height:220px;left:46%;top:23%;opacity:0;background:radial-gradient(ellipse at 50% 20%,#000 0 22%,transparent 24%),linear-gradient(90deg,transparent,#020202 25% 75%,transparent);filter:blur(7px);transform:scale(1.5)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#dust{position:absolute;inset:0;opacity:.15;background-image:radial-gradient(#d1c5a9 1px,transparent 1.5px);background-size:37px 43px;mix-blend-mode:screen}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse,transparent 25%,#000 100%);pointer-events:none}
#hud{position:absolute;z-index:10;left:0;right:0;bottom:0;padding:22px 18px max(20px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.94) 35%)}
.eyebrow{font-size:10px;letter-spacing:.32em;color:#c49b69;text-transform:uppercase}
h1{font-size:clamp(24px,5vw,42px);letter-spacing:.13em;margin:7px 0 5px;font-weight:800}
#desc{font-size:13px;color:#bdb7ae;max-width:580px;line-height:1.45;margin-bottom:14px}
#trigger{border:1px solid #9c7144;background:linear-gradient(#4b3020,#211710);color:#fff;padding:14px 24px;font-weight:800;letter-spacing:.18em;font-size:12px;border-radius:2px;min-width:210px;box-shadow:0 0 24px #6e3c1d55}
#trigger:disabled{opacity:.5}
#status{display:inline-block;margin-left:12px;font-size:10px;letter-spacing:.15em;color:#c9a579}
#label{position:absolute;z-index:9;top:18px;left:18px;font-size:9px;letter-spacing:.22em;color:#b8a58c;background:#07070799;padding:8px 10px;border:1px solid #52412e}
body.event #room{animation:roomDrop 5s cubic-bezier(.2,.7,.2,1) both}
body.event #stage{animation:violent 5s linear both}
body.event #shadow{animation:shadowReveal 4.6s 1.8s both}
body.event #chandelier{animation:lampFlicker 5s both}
body.event #flash{animation:flashBurst 5s both}
body.event #chain1{animation:swing .34s infinite alternate}
body.event #chain2{animation:swing .28s infinite alternate-reverse}
body.event #sofa{animation:sofaFall 4.4s .7s both}
body.event #table{animation:tableFlip 4.1s 1s both}
body.event #chair{animation:chairFly 3.2s 1.3s both}
body.event .shard{animation:shardFly 2.2s 2s both}
@keyframes roomDrop{0%{transform:rotateZ(0) rotateX(0) scale(1)}20%{transform:rotateZ(8deg) rotateX(8deg) scale(1.03)}55%{transform:rotateZ(178deg) rotateX(15deg) scale(1.08)}100%{transform:rotateZ(180deg) rotateX(0) scale(1.12)}}
@keyframes violent{0%,100%{transform:translate(0,0)}10%,30%,55%,75%{transform:translate(-9px,5px)}20%,45%,65%,85%{transform:translate(8px,-5px)}}
@keyframes shadowReveal{0%{opacity:0;transform:scale(.4)}35%{opacity:.85;transform:scale(1.6)}70%{opacity:1;transform:scale(2.4) translateY(18px)}100%{opacity:0;transform:scale(3.5) translateY(60px)}}
@keyframes lampFlicker{0%,8%,14%,22%,27%,39%,44%,100%{opacity:1}10%,12%,24%,25%,41%,42%,70%{opacity:.08}}
@keyframes flashBurst{0%,8%,15%,23%,33%,44%,100%{opacity:0}9%,11%,24%,25%{opacity:.9}34%{opacity:.25}45%{opacity:1}47%{opacity:0}}
@keyframes sofaFall{0%,20%{transform:rotateX(10deg) rotateY(-8deg) translateZ(60px)}55%{transform:rotate(65deg) translate(40px,-90px) translateZ(140px)}100%{transform:rotate(145deg) translate(170px,-220px) translateZ(200px);opacity:.1}}
@keyframes tableFlip{0%,20%{transform:rotateY(-18deg) translateZ(90px)}60%{transform:rotate(65deg) translate(70px,-100px) translateZ(170px)}100%{transform:rotate(170deg) translate(160px,-260px) translateZ(230px);opacity:0}}
@keyframes chairFly{0%,20%{transform:rotateY(25deg) translateZ(130px)}100%{transform:translate(240px,-360px) rotate(440deg) translateZ(250px);opacity:0}}
@keyframes shardFly{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(700deg)}}
@media(max-width:600px){#backwall{left:3%;width:94%;top:12%;height:63%}#sofa{width:180px;left:3%;top:56%}#table{width:150px;left:48%;top:62%}#chair{left:73%;top:48%;transform:scale(.7)}#window{left:33%;width:34%}#hud{padding-left:14px;padding-right:14px}#desc{max-width:340px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style></head>
<body>
<div id="stage"><div id="room">
<div id="ceiling"></div><div id="backwall"><div id="wallpaper"></div><div id="window"><div id="moon"></div></div></div><div id="floor"></div>
<div id="chandelier"></div><div class="chain" id="chain1"></div><div class="chain" id="chain2"></div>
<div class="furniture" id="sofa"></div><div class="furniture" id="table"></div><div class="furniture" id="chair"></div>
<div id="shadow"></div></div><div id="debris"></div><div id="dust"></div><div id="flash"></div><div id="vignette"></div></div>
<div id="label">TIKNATION · GIFT REBUILD LAB · PREVIEW</div>
<section id="hud"><div class="eyebrow">A house with no gravity</div><h1>THE HANGING HOUSE</h1><div id="desc">The room turns. The chains snap tight. Something is moving above you.</div><button id="trigger">TRIGGER THE INCIDENT</button><span id="status">STANDBY</span></section>
<script>
const debris=document.getElementById('debris');
for(let i=0;i<18;i++){const s=document.createElement('i');s.className='shard';s.style.left=(8+Math.random()*84)+'%';s.style.top=(15+Math.random()*65)+'%';s.style.setProperty('--dx',((Math.random()-.5)*innerWidth*1.2)+'px');s.style.setProperty('--dy',((-120-Math.random()*innerHeight*.8))+'px');s.style.animationDelay=(1.7+Math.random()*.8)+'s';debris.appendChild(s)}
let audioCtx,master;
function tone(freq,dur,type='sawtooth',gain=.05,slide=0){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,freq+slide),audioCtx.currentTime+dur);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+dur+.03)}
function noise(dur,gain,filterFreq){if(!audioCtx)return;const n=audioCtx.sampleRate*dur,b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.8);const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=b;f.type='lowpass';f.frequency.value=filterFreq;g.gain.value=gain;src.connect(f);f.connect(g);g.connect(master);src.start()}
function playSound(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.75;master.connect(audioCtx.destination);audioCtx.resume();
tone(48,4.8,'sawtooth',.22,-18);noise(4.8,.18,280);setTimeout(()=>{tone(92,1.1,'square',.12,-60);noise(1.2,.25,1200)},700);setTimeout(()=>{tone(680,.16,'sine',.035,-500);tone(54,3.5,'sawtooth',.2,-28);noise(3.4,.24,750)},1450);setTimeout(()=>{tone(38,3,'sawtooth',.3,-12);noise(2.8,.3,180)},3100);setTimeout(()=>{tone(30,2,'triangle',.2,-8)},4200)
}catch(e){}}
const btn=document.getElementById('trigger'),status=document.getElementById('status');
btn.addEventListener('click',()=>{if(document.body.classList.contains('event'))return;document.body.classList.add('event');btn.disabled=true;status.textContent='STRUCTURAL FAILURE';playSound();setTimeout(()=>{status.textContent='SIGNAL LOST';},4100);setTimeout(()=>{document.body.classList.remove('event');btn.disabled=false;status.textContent='STANDBY';},7200)});
</script></body></html>
