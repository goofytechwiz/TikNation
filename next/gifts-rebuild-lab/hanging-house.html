<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>THE HANGING HOUSE · TikNation Gift Rebuild Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030405;color:#eee;font-family:Arial,Helvetica,sans-serif}
#scene{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#34302a,#08090a 72%)}canvas{display:block;width:100%;height:100%}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,#000b 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#label{position:absolute;top:15px;left:15px;z-index:3;padding:8px 10px;background:#050505b8;border:1px solid #766047;color:#c7ae89;font-size:9px;letter-spacing:.22em}
#hud{position:absolute;z-index:4;bottom:0;left:0;right:0;padding:35px 18px max(20px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#030405f2 42%)}
.eyebrow{font-size:10px;letter-spacing:.32em;color:#c9a16b}h1{font-size:clamp(25px,5vw,43px);letter-spacing:.14em;margin:7px 0 5px}
#desc{font-size:13px;line-height:1.45;color:#c2bbb0;max-width:560px;margin:0 0 14px}
button{min-width:215px;padding:14px 22px;border:1px solid #a17b4e;background:linear-gradient(#553923,#21160f);color:#fff;font-weight:800;letter-spacing:.17em;font-size:11px;border-radius:2px}
button:disabled{opacity:.5}#status{margin-left:12px;color:#c9a579;font-size:10px;letter-spacing:.15em}
body.event #flash{animation:flash 5.8s both}
@keyframes flash{0%,9%,17%,29%,44%,100%{opacity:0}10%,11%{opacity:.75}18%,19%{opacity:.18}30%{opacity:.95}31%{opacity:0}45%{opacity:.5}46%{opacity:0}}
@media(max-width:600px){#hud{padding-left:14px;padding-right:14px}#desc{max-width:340px}}
@media(prefers-reduced-motion:reduce){#flash{display:none}}
</style></head><body>
<div id="scene"></div><div id="vignette"></div><div id="flash"></div>
<div id="label">TIKNATION · GIFT REBUILD LAB · 3D PREVIEW</div>
<section id="hud"><div class="eyebrow">A house with no gravity</div><h1>THE HANGING HOUSE</h1><p id="desc">An old mansion groans under impossible pressure. Something is pulling the room out of place.</p><button id="trigger">TRIGGER THE INCIDENT</button><span id="status">STANDBY</span></section>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.getElementById('scene'),status=document.getElementById('status'),button=document.getElementById('trigger');
let renderer,scene,camera,room,clock,active=false,start=0,audioCtx,master;
try{
renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;host.appendChild(renderer.domElement);
scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x090a0b,.035);camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,4.0,16.5);camera.lookAt(0,3.2,-1);
clock=new THREE.Clock();room=new THREE.Group();scene.add(room);
const mats={wall:new THREE.MeshStandardMaterial({color:0x554431,roughness:.96}),dark:new THREE.MeshStandardMaterial({color:0x17130f,roughness:.9}),wood:new THREE.MeshStandardMaterial({color:0x51351f,roughness:.72}),gold:new THREE.MeshStandardMaterial({color:0x98764a,metalness:.68,roughness:.35}),glass:new THREE.MeshPhysicalMaterial({color:0x19222a,metalness:.35,roughness:.12,transparent:true,opacity:.55}),fabric:new THREE.MeshStandardMaterial({color:0x432b24,roughness:1}),black:new THREE.MeshStandardMaterial({color:0x050505,roughness:1})};
function matTexture(base,kind='wood'){const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,512,512);for(let i=0;i<9000;i++){const a=Math.random()*.13;x.fillStyle=Math.random()>.5?'rgba(230,210,170,'+a+')':'rgba(0,0,0,'+a+')';if(kind==='wood')x.fillRect(Math.random()*512,Math.random()*512,Math.random()*65+2,Math.random()*2+1);else{x.beginPath();x.arc(Math.random()*512,Math.random()*512,Math.random()*2+.2,0,Math.PI*2);x.fill()}}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);t.colorSpace=THREE.SRGBColorSpace;return t}
const woodTex=matTexture('#49301d'),fabricTex=matTexture('#39231e','fabric');const woodMat=new THREE.MeshStandardMaterial({map:woodTex,roughness:.78}),fabricMat=new THREE.MeshStandardMaterial({map:fabricTex,roughness:1});
function box(parent,name,pos,size,material,bevel=0){const g=new THREE.BoxGeometry(...size);const m=new THREE.Mesh(g,material);m.name=name;m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function cyl(parent,pos,r1,r2,h,material,segments=12){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);m.position.set(...pos);m.castShadow=true;parent.add(m);return m}
function sphere(parent,pos,scale,material){const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),material);m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;parent.add(m);return m}
scene.add(new THREE.HemisphereLight(0x9b9ba2,0x17100a,1.15));
const warm=new THREE.PointLight(0xffc47a,100,26,2);warm.position.set(0,6.8,1);scene.add(warm);
const moonLight=new THREE.PointLight(0x7892aa,34,20,2);moonLight.position.set(0,4,-5.3);scene.add(moonLight);
const fill=new THREE.DirectionalLight(0xb8a58b,1.1);fill.position.set(-5,8,7);scene.add(fill);
// Architecture: floor, ceiling, three walls, skirting and carved wall panels.
box(room,'floor',[0,-.18,-1],[14,.35,13],woodMat);box(room,'ceiling',[0,8,-1],[14,.3,13],mats.dark);
box(room,'back wall',[0,4,-7.5],[14,8,.35],mats.wall);box(room,'left wall',[-7,4,-1],[.35,8,13],mats.wall);box(room,'right wall',[7,4,-1],[.35,8,13],mats.wall);
for(let z of [-7,5])box(room,'crown moulding',[0,7.65,z],[14,.28,.3],mats.gold);
for(let x of [-6.7,6.7])box(room,'side moulding',[x,4,-1],[.28,8,13],mats.gold);
for(let x=-5.8;x<=5.9;x+=2.9){box(room,'panel frame',[x,4,-7.25],[2.35,5.9,.16],mats.dark);box(room,'panel inset',[x,4,-7.14],[2.05,5.55,.09],woodMat);box(room,'panel inner',[x,4,-7.07],[1.83,5.25,.04],mats.wall)}
// Tall mullioned window, cold moonlight and moving silhouette beyond the glass.
box(room,'window recess',[0,4.2,-7.22],[3.5,5.2,.18],mats.dark);box(room,'window glass',[0,4.2,-7.08],[3.15,4.85,.05],mats.glass);
for(let x of [-1.62,0,1.62])box(room,'window mullion',[x,4.2,-6.98],[.11,4.95,.13],mats.gold);
for(let y of [1.8,4.2,6.6])box(room,'window crossbar',[0,y,-6.97],[3.3,.12,.13],mats.gold);
const moon=sphere(room,[2.6,6.1,-6.85],[.42,.42,.08],new THREE.MeshBasicMaterial({color:0xc9c2a6}));moon.material.transparent=true;moon.material.opacity=.55;
// Sofa with separate upholstered cushions, rolled arms, carved feet and back.
const sofa=new THREE.Group();sofa.position.set(-4,.1,-1.4);room.add(sofa);
box(sofa,'sofa plinth',[0,.62,0],[3.35,.55,1.25],woodMat);box(sofa,'sofa seat',[0,1.02,.02],[2.9,.42,1.08],fabricMat);
box(sofa,'sofa back',[0,1.8,-.45],[3.05,1.35,.34],fabricMat);
for(let x of [-1.48,1.48]){box(sofa,'sofa arm',[x,1.38,.04],[.48,.9,1.15],woodMat);sphere(sofa,[x,1.82,.04],[.28,.2,.58],fabricMat);cyl(sofa,[x,.32,.42],.1,.14,.62,woodMat)}
for(let x of [-.92,0,.92]){box(sofa,'seat cushion',[x,1.29,.12],[.84,.18,.82],fabricMat);sphere(sofa,[x,1.91,-.23],[.39,.48,.15],fabricMat)}
// Coffee table with thick top and four turned legs.
const table=new THREE.Group();table.position.set(.1,0,-.2);room.add(table);
box(table,'table top',[0,1.15,0],[2.5,.18,1.35],woodMat);
for(let x of [-1.05,1.05])for(let z of [-.48,.48]){cyl(table,[x,.58,z],.09,.14,1.05,woodMat);sphere(table,[x,.98,z],[.13,.09,.13],mats.gold)}
// High-backed chair.
const chair=new THREE.Group();chair.position.set(4,.1,-1.4);room.add(chair);
box(chair,'chair seat',[0,1,0],[1.2,.22,1.05],woodMat);box(chair,'chair cushion',[0,1.16,.05],[1.05,.16,.9],fabricMat);box(chair,'chair back',[0,2,-.42],[1.2,1.8,.2],woodMat);box(chair,'chair back upholstery',[0,2,-.29],[.92,1.5,.08],fabricMat);
for(let x of [-.48,.48])for(let z of [-.42,.42])cyl(chair,[x,.48,z],.055,.09,.95,woodMat);
for(let x of [-.4,0,.4])sphere(chair,[x,2.25,-.22],[.08,.12,.06],mats.gold);
// Chandelier: chain, iron ring, curved arms, candles and flames.
const lamp=new THREE.Group();lamp.position.set(0,7.65,-.2);room.add(lamp);
for(let i=0;i<15;i++){const link=cyl(lamp,[0,-i*.17,0],.035,.035,.12,mats.gold,8);link.rotation.x=Math.PI/2}
cyl(lamp,[0,-2.55,0],.08,.08,.18,mats.gold);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.95,.07,10,48),mats.gold);ring.position.y=-2.65;ring.rotation.x=Math.PI/2;lamp.add(ring);
for(let i=0;i<6;i++){const a=i*Math.PI/3,x=Math.cos(a)*.88,z=Math.sin(a)*.88;const arm=cyl(lamp,[x*.52,-2.63,z*.52],.035,.045,1.0,mats.gold);arm.rotation.z=Math.cos(a)*.9;arm.rotation.x=Math.sin(a)*.9;cyl(lamp,[x,-2.38,z],.07,.07,.34,mats.gold);const flame=sphere(lamp,[x,-2.12,z],[.075,.17,.075],new THREE.MeshBasicMaterial({color:0xffbd65}));flame.userData.flame=true}
const chandelierLight=new THREE.PointLight(0xffb765,48,13,2);chandelierLight.position.set(0,-2.15,0);lamp.add(chandelierLight);
// Hanging chains at the ceiling edges with weighted iron hooks.
const chains=[];for(let x of [-4.7,4.7]){const chain=new THREE.Group();chain.position.set(x,7.8,-1);room.add(chain);for(let i=0;i<25;i++){const link=new THREE.Mesh(new THREE.TorusGeometry(.055,.018,6,10),mats.gold);link.position.y=-i*.18;link.rotation.x=Math.PI/2+(i%2)*.45;chain.add(link)}const hook=cyl(chain,[0,-4.55,0],.11,.08,.24,mats.gold);chains.push(chain)}
// Wall portraits: carved frames and shadowy painted figures.
for(let x of [-5.4,5.4]){box(room,'portrait frame',[x,4.7,-7.0],[1.15,1.75,.18],mats.gold);box(room,'portrait canvas',[x,4.7,-6.88],[.92,1.5,.05],mats.black);sphere(room,[x,5.05,-6.82],[.19,.25,.06],new THREE.MeshStandardMaterial({color:0x65513a,roughness:1}));box(room,'portrait torso',[x,4.48,-6.81],[.48,.58,.07],mats.dark)}
// Dust motes suspended in the light.
const dustGeo=new THREE.BufferGeometry(),dustN=420,dustPos=new Float32Array(dustN*3);for(let i=0;i<dustN;i++){dustPos[i*3]=(Math.random()-.5)*13;dustPos[i*3+1]=Math.random()*7;dustPos[i*3+2]=(Math.random()-.5)*11-1}dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xc9b58e,size:.035,transparent:true,opacity:.45}));room.add(dust);
// A dark figure passes behind the window during the event.
const figure=new THREE.Group();figure.position.set(-5,3.8,-6.78);room.add(figure);sphere(figure,[0,1.1,0],[.35,.48,.08],mats.black);box(figure,'figure body',[0,.15,0],[.8,1.8,.16],mats.black);figure.visible=false;
// Flying plaster, glass and splinter debris, with actual 3D bodies.
const debris=[];const shardMat=new THREE.MeshStandardMaterial({color:0xaaa08d,metalness:.25,roughness:.42});for(let i=0;i<45;i++){const g=new THREE.Mesh(new THREE.TetrahedronGeometry(.08+Math.random()*.16),i%3?shardMat:mats.wood);g.visible=false;room.add(g);debris.push(g)}
const moving=[sofa,table,chair];const base=moving.map(o=>({p:o.position.clone(),r:o.rotation.clone()}));
}catch(e){host.innerHTML='<div style="padding:40px;color:#fff">3D preview could not initialize in this browser. Please check the connection and reload.</div>';console.error(e)}
function startAudio(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.72;master.connect(audioCtx.destination);audioCtx.resume();const noise=(freq,dur,vol)=>{const n=audioCtx.sampleRate*dur,b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,.7);const s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start()};const boom=(f,d,v)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(28,audioCtx.currentTime+d);g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+d)};boom(58,4,.2);noise(360,4,.18);setTimeout(()=>{boom(95,1.3,.15);noise(1500,1.2,.15)},850);setTimeout(()=>{boom(43,3,.24);noise(220,3,.22)},2500);setTimeout(()=>{boom(32,2.5,.2);noise(500,2,.2)},3900)}catch(e){}}
if(renderer){function reset(){active=false;document.body.classList.remove('event');button.disabled=false;status.textContent='STANDBY';room.rotation.set(0,0,0);moving.forEach((o,i)=>{o.position.copy(base[i].p);o.rotation.copy(base[i].r)});lamp.rotation.set(0,0,0);chains.forEach(c=>c.rotation.z=0);figure.visible=false;debris.forEach(d=>d.visible=false);warm.intensity=100;chandelierLight.intensity=48}
button.addEventListener('click',()=>{if(active)return;active=true;start=clock.elapsedTime;button.disabled=true;status.textContent='STRUCTURAL FAILURE';document.body.classList.add('event');figure.visible=true;figure.position.x=-5;startAudio()});
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();if(active){const e=t-start;const envelope=Math.min(1,e/1.1);room.rotation.z=(Math.sin(e*3.4)*.035+Math.sin(e*1.15)*.11)*envelope;room.rotation.x=Math.sin(e*2.3)*.025*envelope;room.position.y=Math.sin(e*5.5)*.07*envelope;lamp.rotation.z=Math.sin(e*4.2)*.24*envelope;lamp.rotation.x=Math.cos(e*3.1)*.13*envelope;chains.forEach((c,i)=>c.rotation.z=Math.sin(e*5+i*2)*.28*envelope);sofa.rotation.z=Math.sin(e*3.8)*.17*envelope;sofa.position.y=base[0].p.y+Math.max(0,Math.sin(e*3.8))*.32*envelope;table.position.x=base[1].p.x+Math.sin(e*4.7)*.55*envelope;table.rotation.z=Math.sin(e*4.7)*.09*envelope;chair.rotation.z=Math.sin(e*4.1+1)*.3*envelope;figure.position.x=-5+Math.min(10,e*3.1);figure.position.y=3.8+Math.sin(e*5)*.12;warm.intensity=(Math.random()>.78?18:95)*(e>4.5?.1:1);chandelierLight.intensity=Math.random()>.72?4:48;
if(e>1.3){debris.forEach((d,i)=>{if(!d.visible){d.visible=true;d.position.set((Math.random()-.5)*8,2+Math.random()*4,-1+Math.random()*2);d.userData.v=new THREE.Vector3((Math.random()-.5)*.18,.12+Math.random()*.2,(Math.random()-.5)*.12);d.userData.spin=new THREE.Vector3(Math.random()*.2,Math.random()*.2,Math.random()*.2)}d.position.add(d.userData.v);d.rotation.x+=d.userData.spin.x;d.rotation.y+=d.userData.spin.y;d.rotation.z+=d.userData.spin.z})}
if(e>5.9){status.textContent='SIGNAL LOST';setTimeout(reset,1800);active=false}}
dust.rotation.y=t*.012;renderer.render(scene,camera)}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
}
</script></body></html>
