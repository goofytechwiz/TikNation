<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>The Last Elevator · TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#e7e5df;font-family:Arial,sans-serif}.scene{position:relative;width:100%;height:100%;min-height:540px;background:radial-gradient(ellipse at 50% 35%,#33302b 0,#151719 45%,#050607 100%);perspective:900px;overflow:hidden}.ceiling{position:absolute;top:0;left:0;width:100%;height:19%;background:linear-gradient(#090b0d,#252729 65%,#111416);clip-path:polygon(8% 0,92% 0,78% 100%,22% 100%)}.floor{position:absolute;bottom:0;left:0;width:100%;height:24%;background:repeating-linear-gradient(90deg,#101314 0 2px,#242526 3px 70px),linear-gradient(#262729,#070809);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}.shaft{position:absolute;inset:12% 12% 12%;background:linear-gradient(90deg,#080a0b,#272a2b 12%,#111416 50%,#292c2d 88%,#080a0b);border:8px solid #090b0c;box-shadow:inset 0 0 55px #000,0 0 60px #000}.elevator{position:absolute;left:50%;top:50%;width:min(62vw,420px);height:min(66vh,530px);min-height:350px;transform:translate(-50%,-50%);background:linear-gradient(90deg,#090b0d,#50504b 8%,#17191a 18%,#3b3d3b 50%,#17191a 82%,#4b4b46 92%,#090b0d);border:8px solid #090b0c;box-shadow:0 22px 70px #000,inset 0 0 0 3px #6d6b62}.door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#141718,#565650 30%,#282a29 65%,#111415);border:2px solid #090b0b;transition:transform 2.4s cubic-bezier(.7,0,.2,1);box-shadow:inset 0 0 25px #0008}.door.left{left:0;border-right:1px solid #77766e}.door.right{right:0;border-left:1px solid #77766e}.elevator.open .door.left{transform:translateX(-97%)}.elevator.open .door.right{transform:translateX(97%)}.seam{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#090b0c;box-shadow:0 0 8px #000;z-index:2}.panel{position:absolute;right:calc(50% - min(31vw,210px) - 58px);top:43%;width:34px;padding:8px 4px;background:linear-gradient(90deg,#101314,#464744,#111314);border:2px solid #090b0b;box-shadow:0 5px 14px #000}.btn{width:13px;height:13px;margin:7px auto;border-radius:50%;background:#272b2b;border:1px solid #8b8a7f;box-shadow:inset 0 0 4px #000}.btn.lit{background:#9e2b21;box-shadow:0 0 13px #f43d25}.indicator{position:absolute;top:8%;left:50%;transform:translateX(-50%);font:700 17px monospace;color:#c54b39;text-shadow:0 0 12px #d22;letter-spacing:.25em}.lamp{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:45%;height:8px;background:#c8c2a3;box-shadow:0 0 30px 12px #e1d8ad55;animation:flicker 5s infinite}.shadow{position:absolute;left:50%;bottom:9%;width:23%;height:55%;transform:translateX(-50%);opacity:0;transition:opacity 1.5s;background:radial-gradient(ellipse at 50% 12%,#050606 0 18%,transparent 19%),linear-gradient(90deg,transparent 8%,#050606 25% 75%,transparent 92%);filter:blur(3px)}.elevator.reveal .shadow{opacity:.95;animation:breath 3.4s infinite ease-in-out}.mist{position:absolute;inset:auto -20% 7%;height:27%;background:radial-gradient(ellipse,#9ba09b22,transparent 65%);filter:blur(15px);animation:mist 8s infinite alternate}.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}.title{margin-top:max(18px,env(safe-area-inset-top));font-size:10px;letter-spacing:.3em;color:#c5c1b6;text-shadow:0 2px 9px #000}.caption{margin-top:auto;margin-bottom:calc(112px + env(safe-area-inset-bottom));font:italic 14px Georgia,serif;letter-spacing:.13em;text-align:center;text-shadow:0 2px 10px #000;padding:0 18px}.status{position:absolute;bottom:calc(82px + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:9px;letter-spacing:.18em;color:#c3bdb0;text-shadow:0 2px 8px #000}.controls{position:absolute;bottom:calc(15px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:9px;padding:0 8px}button{border:1px solid #bdb7a477;background:#171a1b;color:#eee9df;padding:13px 14px;font-size:9px;font-weight:bold;letter-spacing:.13em;border-radius:3px}button.primary{background:#d6d0bd;color:#111;border-color:#fff}@keyframes flicker{0%,18%,20%,54%,56%,100%{opacity:.9}19%,55%{opacity:.18}}@keyframes breath{0%,100%{transform:translateX(-50%) scaleX(1)}50%{transform:translateX(-50%) scaleX(1.08)}}@keyframes mist{from{transform:translateX(-4%)}to{transform:translateX(7%)}}@media(max-width:560px){.caption{font-size:12px}.controls{gap:6px}button{padding:12px 9px;font-size:8px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="scene"><div class="ceiling"></div><div class="floor"></div><div class="shaft"></div><section class="elevator" id="lift"><div class="lamp"></div><div class="indicator" id="floorNum">− 3</div><div class="door left"></div><div class="door right"></div><div class="seam"></div><div class="shadow"></div></section><div class="panel"><div class="btn" id="callLight"></div><div class="btn"></div><div class="btn"></div></div><div class="mist"></div><div class="hud"><div class="title">TIKNATION · HORROR GIFT LAB · RESTRICTED LEVEL</div><div class="caption" id="caption">THE ELEVATOR HAS BEEN OUT OF SERVICE FOR YEARS</div></div><div class="status" id="status" role="status" aria-live="polite">PREVIEW READY · NO GIFT SENT · NO AUDIO CLAIMED</div><div class="controls"><button class="primary" id="call">CALL ELEVATOR</button><button id="enter">ENTER THE LIFT</button><button id="reset">RESET</button></div></main>
<script>
(()=>{const lift=document.getElementById('lift'),caption=document.getElementById('caption'),status=document.getElementById('status'),floorNum=document.getElementById('floorNum'),callLight=document.getElementById('callLight');let state=0,timers=[];const clear=()=>{timers.forEach(clearTimeout);timers=[]};document.getElementById('call').onclick=()=>{if(state!==0)return;state=1;callLight.classList.add('lit');status.textContent='CALL BUTTON PRESSED · WAITING';caption.textContent='SOMETHING IS COMING UP';floorNum.textContent='− 2';timers.push(setTimeout(()=>floorNum.textContent='− 1',950));timers.push(setTimeout(()=>{floorNum.textContent='0';lift.classList.add('open');status.textContent='DOORS OPENING · LEVEL 0';caption.textContent='NOBODY CALLED THIS ELEVATOR';state=2},2100));};document.getElementById('enter').onclick=()=>{if(state!==2)return;state=3;lift.classList.add('reveal');status.textContent='MOVEMENT DETECTED INSIDE THE SHAFT';caption.textContent='THERE IS SOMEONE STANDING BEHIND YOU';timers.push(setTimeout(()=>{floorNum.textContent='− 3';lift.classList.remove('open');status.textContent='DESCENDING · LEVEL −3';},2600));timers.push(setTimeout(()=>{status.textContent='LEVEL −3 · DO NOT EXIT';caption.textContent='THE DOORS WILL NOT OPEN AGAIN';},5200));};document.getElementById('reset').onclick=()=>{clear();state=0;lift.classList.remove('open','reveal');callLight.classList.remove('lit');floorNum.textContent='− 3';caption.textContent='THE ELEVATOR HAS BEEN OUT OF SERVICE FOR YEARS';status.textContent='PREVIEW READY · NO GIFT SENT · NO AUDIO CLAIMED'};})();
</script></body></html>
