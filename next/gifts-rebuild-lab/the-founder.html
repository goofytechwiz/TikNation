<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><title>TikNation · The Founder</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030711;color:#f4f8ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{overflow-x:hidden}.stage{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:25px 16px 36px;background:radial-gradient(ellipse at 50% 38%,#173b61 0,#0b1b30 38%,#050b17 72%,#02050c 100%)}.sky{position:absolute;inset:0;z-index:-4;background:repeating-linear-gradient(90deg,transparent 0 11%,#6bcfff08 11.1% 11.3%,transparent 11.4% 22%),radial-gradient(ellipse at 50% 12%,#6adfff30,transparent 45%)}.hall{position:absolute;z-index:-3;inset:0;perspective:900px;overflow:hidden}.floor{position:absolute;bottom:-13%;left:-25%;width:150%;height:48%;transform:rotateX(66deg);transform-origin:top;background:repeating-linear-gradient(90deg,#8edfff13 0 1px,transparent 1px 12%),repeating-linear-gradient(0deg,#8edfff12 0 1px,transparent 1px 12%),linear-gradient(#102a45,#030711);box-shadow:0 -20px 90px #35bfff20}.arch{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:min(84vw,720px);height:72%;border:13px solid #263d57;border-bottom:0;border-radius:50% 50% 0 0/30% 30% 0 0;box-shadow:inset 0 0 40px #38bfff20,0 0 30px #36cfff30,0 0 0 5px #0b1727,0 0 0 8px #526a83}.arch:before{content:"";position:absolute;inset:3% 3% 0;border:2px solid #9beaff55;border-bottom:0;border-radius:50% 50% 0 0/30% 30% 0 0}.column{position:absolute;top:18%;height:65%;width:8%;background:linear-gradient(90deg,#0a1424,#71849a 18%,#1d334c 34%,#a3b4c2 48%,#1a2c41 68%,#050b15);box-shadow:0 0 30px #48cfff20}.column:before,.column:after{content:"";position:absolute;left:-24%;width:148%;height:4%;background:linear-gradient(#b7c9d7,#263c55,#879bad);box-shadow:0 0 18px #5cdcff44}.column:before{top:0}.column:after{bottom:0}.c1{left:8%}.c2{right:8%}.c3{left:25%;top:24%;height:55%;opacity:.55}.c4{right:25%;top:24%;height:55%;opacity:.55}.beam{position:absolute;top:-5%;height:85%;width:20%;background:linear-gradient(180deg,#9cefff2b,transparent 75%);filter:blur(18px);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}.b1{left:17%}.b2{right:17%}.emblem{position:absolute;top:13%;left:50%;transform:translateX(-50%);width:clamp(100px,22vw,190px);aspect-ratio:1;border:3px solid #a6efff;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#67ddff38,#071629 67%);box-shadow:0 0 18px #42d8ff,0 0 60px #168aff88,inset 0 0 30px #5bdfff66;color:#e5fbff;font-size:clamp(40px,10vw,88px);font-weight:1000;text-shadow:0 0 22px #43dfff;animation:float 5s ease-in-out infinite}.emblem:after{content:"";position:absolute;inset:-13px;border:1px solid #83eaff88;border-radius:50%;box-shadow:0 0 20px #49cfff55}.throne-wrap{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:min(68vw,480px);height:min(54vh,460px);min-height:320px;display:flex;justify-content:center;align-items:flex-end;filter:drop-shadow(0 0 32px #35bfff44)}.throne-back{position:absolute;bottom:16%;width:70%;height:80%;background:linear-gradient(90deg,#080d17,#263d55 12%,#101c2d 28%,#667b8d 50%,#142238 70%,#070c15);clip-path:polygon(50% 0,88% 8%,100% 100%,0 100%,12% 8%);border:2px solid #92d9ed}.throne-back:before{content:"";position:absolute;inset:8% 14% 10%;border:3px solid #9ab5c9;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(140deg,#5c7286aa,#0a1525 60%)}.throne-back:after{content:"";position:absolute;left:50%;top:22%;height:50%;width:2px;background:#b7f2ff;box-shadow:0 0 18px 5px #38cfff}.seat{position:absolute;bottom:13%;width:86%;height:16%;background:linear-gradient(#b5c5d0,#253a50 28%,#080f1b 65%,#8295a5);border:3px solid #718ba0;border-radius:8px;box-shadow:0 10px 20px #000}.arm{position:absolute;bottom:17%;width:17%;height:38%;background:linear-gradient(90deg,#09111e,#73899b 35%,#15283e 70%,#050a12);border:2px solid #607b92;border-radius:12px 12px 3px 3px}.arm.left{left:2%;transform:skewY(-7deg)}.arm.right{right:2%;transform:skewY(7deg)}.base{position:absolute;bottom:0;width:96%;height:15%;background:linear-gradient(#8299ab,#1d3047 22%,#070d18 75%,#50657a);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);border-top:4px solid #b5d2df}.figure{position:absolute;z-index:2;bottom:25%;left:50%;transform:translateX(-50%);width:36%;height:48%;display:flex;align-items:center;flex-direction:column}.head{width:25%;aspect-ratio:.88;border-radius:45% 45% 42% 42%;background:radial-gradient(ellipse at 35% 28%,#d2b49b,#806b62 42%,#202b38 80%);box-shadow:0 0 18px #a4dfff33}.bodyshape{margin-top:-2%;width:76%;height:68%;background:linear-gradient(90deg,#050a12,#182b42 25%,#263f58 50%,#111e30 76%,#04080f);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);border-top:2px solid #b1eaff}.bodyshape:after{content:"";display:block;width:22%;height:75%;margin:9% auto;background:linear-gradient(90deg,#e4c17c,#fff1b9,#8e6331);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 0 8px #ffd98b)}.orb{position:absolute;z-index:4;right:8%;top:48%;width:clamp(34px,7vw,68px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8df3ff 18%,#208aff 42%,#081d50 70%);box-shadow:0 0 18px #5ce6ff,0 0 48px #237dff;animation:orb 2.4s ease-in-out infinite}.guardian{position:absolute;bottom:12%;width:18%;height:19%;z-index:1;filter:drop-shadow(0 0 14px #42cfff55)}.guardian.left{left:4%}.guardian.right{right:4%;transform:scaleX(-1)}.panther{position:absolute;bottom:0;left:0;width:100%;height:55%;background:linear-gradient(180deg,#253d55,#050a12 70%);clip-path:polygon(0 45%,12% 26%,24% 30%,32% 0,42% 23%,57% 18%,68% 30%,83% 27%,100% 52%,90% 100%,12% 100%)}.panther:before{content:"";position:absolute;top:23%;left:35%;width:8px;height:4px;background:#aaf6ff;box-shadow:14px 0 #aaf6ff,0 0 12px 4px #2bdfff,14px 0 12px 4px #2bdfff}.sparks{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#b6f6ff 1px,transparent 2px),radial-gradient(#45bfff 1px,transparent 2px);background-size:113px 127px,173px 191px;background-position:20px 30px,80px 90px;opacity:.32;animation:drift 16s linear infinite}.copy{position:relative;z-index:5;text-align:center}.eyebrow{font-size:.65rem;letter-spacing:.38em;font-weight:900;color:#8cecff;text-shadow:0 0 15px #2bbfff}.headline{font-size:clamp(2rem,7vw,4.3rem);letter-spacing:.13em;margin:8px 0 0;text-shadow:0 0 24px #43cfff99}.subtitle{font-size:.67rem;letter-spacing:.28em;color:#c2d9e9;margin-top:8px}.lower{position:relative;z-index:5;margin-top:auto;padding-top:18px;text-align:center}.reveal{opacity:0;transform:translateY(18px);transition:.8s ease}.awake .reveal{opacity:1;transform:none}.name{font-size:clamp(2rem,8vw,4rem);font-weight:1000;letter-spacing:.22em;text-shadow:0 0 22px #3bcfff}.role{color:#f0d18d;letter-spacing:.42em;font-weight:900}.tag{margin-top:12px;color:#a9eaff;letter-spacing:.18em;font-size:.8rem}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:19px}button{border:1px solid #8beaff;background:linear-gradient(120deg,#10466a,#172d54);color:white;border-radius:999px;padding:12px 20px;font-weight:900;letter-spacing:.1em;cursor:pointer;box-shadow:0 0 24px #29bfff44}button.secondary{background:#0a1423;border-color:#536b82}.note{max-width:520px;margin:14px auto 0;color:#7e96ac;font-size:.68rem;line-height:1.5}.pulse{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 60%,transparent 15%,#28cfff30 75%,transparent 76%);opacity:0}.awake .pulse{animation:pulse 2.8s ease-out infinite}@keyframes pulse{0%{opacity:0;transform:scale(.7)}35%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}@keyframes float{50%{transform:translate(-50%,-10px)}}@keyframes orb{50%{transform:translateY(-15px) scale(1.08)}}@keyframes drift{to{background-position:20px -250px,80px -310px}}@media(max-width:560px){.column{width:10%}.c3,.c4{display:none}.throne-wrap{width:88vw;height:42vh;min-height:285px;bottom:16%}.guardian{width:24%;bottom:15%}.emblem{top:17%}.arch{top:14%;height:65%}.lower{padding-top:10px}.headline{letter-spacing:.09em}.subtitle{font-size:.58rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage" id="stage"><div class="sky"></div><div class="hall"><div class="arch"></div><div class="column c1"></div><div class="column c2"></div><div class="column c3"></div><div class="column c4"></div><div class="beam b1"></div><div class="beam b2"></div><div class="emblem">T</div><div class="floor"></div><div class="throne-wrap"><div class="throne-back"></div><div class="arm left"></div><div class="arm right"></div><div class="seat"></div><div class="base"></div><div class="figure"><div class="head"></div><div class="bodyshape"></div></div><div class="orb"></div></div><div class="guardian left"><div class="panther"></div></div><div class="guardian right"><div class="panther"></div></div><div class="sparks"></div></div><div class="pulse"></div><header class="copy"><div class="eyebrow">TIKNATION · A CREATOR'S LEGACY</div><h1 class="headline">THE FOUNDER</h1><div class="subtitle">VISION BECOMES REALITY</div></header><section class="lower"><div class="reveal"><div class="name">MATT</div><div class="role">FOUNDER</div><div class="tag">YOUR VOICE. YOUR WORLD.</div></div><div class="actions"><button id="enter">AWAKEN THE FOUNDER</button><button class="secondary" id="replay">REPLAY</button></div><p class="note">An original, CSS-built cinematic scene. No personal photographs or stock images. Gift sending and coin charging are not connected.</p></section></main><script>
const stage=document.getElementById('stage');let audio;function sound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio?.close();audio=new C();[55,82.4,110,164.8,220].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=i===0?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.055,audio.currentTime+.18+i*.07);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+2.4);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+2.5)});setTimeout(()=>audio?.close(),2800)}catch(e){}}function awaken(){stage.classList.add('awake');sound()}document.getElementById('enter').addEventListener('click',awaken);document.getElementById('replay').addEventListener('click',()=>{stage.classList.remove('awake');setTimeout(awaken,180)});
</script></body></html>
