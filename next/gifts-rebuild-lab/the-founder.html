<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914">
<title>TikNation · The Founder</title>
<style>
:root{color-scheme:dark;--cyan:#70eaff;--blue:#2b83d5;--silver:#e6f4ff;--gold:#d7b878}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050914;color:#f5f8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow-x:hidden;background:radial-gradient(ellipse at 50% 43%,#132e4b 0,#091629 34%,#050914 72%)}
.stage{min-height:100svh;position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px 34px}
.stars,.stars:before,.stars:after{position:absolute;inset:0;content:"";pointer-events:none;background-image:radial-gradient(1px 1px at 12% 18%,#c9f5ff 98%,transparent),radial-gradient(1px 1px at 80% 15%,#9ddfff 98%,transparent),radial-gradient(2px 2px at 73% 62%,#d4eaff 98%,transparent),radial-gradient(1px 1px at 22% 74%,#fff 98%,transparent),radial-gradient(1px 1px at 91% 83%,#9ddfff 98%,transparent);opacity:.65}.stars:before{transform:translate(35px,70px) scale(1.2);opacity:.35}
.beam{position:absolute;z-index:-1;top:5%;left:50%;width:min(85vw,700px);height:80%;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 0 32%,#59d9ff0b 40%,#8adfff20 50%,#59d9ff0b 60%,transparent 68%);filter:blur(15px)}
.floor{position:absolute;z-index:-1;bottom:-15%;left:50%;width:min(105vw,900px);height:42%;transform:translateX(-50%) perspective(420px) rotateX(67deg);border-radius:50%;background:repeating-radial-gradient(ellipse at center,transparent 0 34px,#5bdfff22 35px 36px,transparent 37px 70px);box-shadow:0 -20px 80px #1a9dd322}
.topline{letter-spacing:.28em;font-size:.68rem;font-weight:800;color:var(--cyan);text-align:center;text-transform:uppercase}
.title{font-size:clamp(2.4rem,8vw,5.6rem);letter-spacing:.12em;line-height:1;margin:12px 0 0;text-align:center;text-shadow:0 0 28px #69dfff55}
.subtitle{color:#9bb4c9;letter-spacing:.22em;font-size:.75rem;text-align:center;margin:10px 0 0}
figure{height:clamp(290px,48vh,440px);width:min(90vw,390px);position:relative;margin:4px 0 0;display:flex;justify-content:center;align-items:flex-end;perspective:900px}
.halo{position:absolute;bottom:9%;width:80%;height:76%;border-radius:50%;background:radial-gradient(ellipse,#51cfff30 0,#308bd51b 35%,transparent 70%);filter:blur(12px)}
.person{position:relative;width:210px;height:350px;transform-style:preserve-3d;filter:drop-shadow(0 22px 28px #000b);animation:arrive 1.8s cubic-bezier(.18,.78,.25,1) both}
@keyframes arrive{from{transform:translateY(90px) scale(.82);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.head{position:absolute;z-index:4;top:12px;left:79px;width:54px;height:72px;border-radius:46% 46% 42% 42%;background:linear-gradient(105deg,#172536 0,#b0c4d1 23%,#45596a 47%,#101d2b 78%);box-shadow:inset -8px -5px 12px #020812,inset 5px 4px 9px #d8efff55}
.hair{position:absolute;z-index:5;top:5px;left:77px;width:58px;height:32px;border-radius:55% 50% 18% 25%;background:linear-gradient(120deg,#080d17,#293c4d 48%,#080e18);box-shadow:0 3px 8px #000}
.neck{position:absolute;z-index:2;top:75px;left:94px;width:27px;height:35px;background:linear-gradient(90deg,#152333,#738899,#172635)}
.torso{position:absolute;top:96px;left:35px;width:140px;height:178px;clip-path:polygon(26% 0,43% 0,50% 8%,58% 0,75% 0,100% 22%,83% 100%,17% 100%,0 22%);background:linear-gradient(90deg,#050b14,#182b3c 18%,#0c1725 40%,#253b4e 52%,#0b1523 76%,#030812);box-shadow:inset 0 0 24px #6bdfff33}
.lapel{position:absolute;z-index:3;top:100px;left:77px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:96px solid #b7d8e8;filter:drop-shadow(0 0 5px #66dfff55)}
.lapel:after{content:"";position:absolute;left:-9px;top:-92px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:85px solid #071321}
.shirt{position:absolute;z-index:2;top:99px;left:89px;width:32px;height:134px;background:linear-gradient(90deg,#e6f5ff,#829db1,#d8efff);clip-path:polygon(0 0,100% 0,66% 100%,34% 100%)}
.tie{position:absolute;z-index:4;top:111px;left:99px;width:13px;height:91px;background:linear-gradient(90deg,#6edfff,#e8fbff,#2478a7);clip-path:polygon(50% 0,100% 15%,70% 100%,30% 100%,0 15%)}
.arm{position:absolute;z-index:1;top:111px;width:40px;height:155px;border-radius:22px;background:linear-gradient(90deg,#050b13,#23394b 45%,#080f1a);transform-origin:top center}
.arm.left{left:31px;transform:rotate(8deg)}.arm.right{right:27px;transform:rotate(-8deg)}
.hand{position:absolute;top:250px;width:25px;height:34px;border-radius:45%;background:linear-gradient(90deg,#14283a,#8095a5,#1a2c3b)}.hand.left{left:28px}.hand.right{right:23px}
.coat-tail{position:absolute;z-index:-1;top:240px;left:48px;width:114px;height:92px;background:linear-gradient(90deg,#050b14,#1d3041 50%,#060c15);clip-path:polygon(0 0,100% 0,84% 100%,50% 82%,16% 100%)}
.pin{position:absolute;z-index:6;top:139px;left:132px;width:19px;height:19px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8deaff 30%,#146a9c 70%);box-shadow:0 0 13px #70eaff}
.legs{position:absolute;z-index:-1;top:252px;left:56px;width:100px;height:95px;background:linear-gradient(90deg,#050a12,#1a2a39 45%,#070d17);clip-path:polygon(0 0,100% 0,90% 100%,55% 100%,49% 27%,39% 100%,4% 100%)}
.base{position:absolute;bottom:2%;width:170px;height:26px;border-radius:50%;background:radial-gradient(ellipse,#6ceaff77,transparent 70%);filter:blur(6px)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .9s,transform .9s}.stage.awake .reveal{opacity:1;transform:none}
.name{font-size:clamp(1.1rem,4vw,1.8rem);letter-spacing:.32em;text-align:center;color:#dcefff;text-transform:uppercase;text-shadow:0 0 20px #6ceaff66;margin:12px 0 0}
.founder{font-size:.8rem;letter-spacing:.35em;text-align:center;color:var(--gold);font-weight:800;margin:6px 0 0}
.rule{width:130px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);margin:16px auto}
.tag{color:#a7bfd1;text-align:center;font-size:.82rem;letter-spacing:.08em}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
button{border:1px solid #5dc9eb88;border-radius:999px;padding:12px 20px;background:linear-gradient(110deg,#164568,#162b4a);color:white;font-weight:800;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 24px #41cfff22}
button.secondary{background:#0c1422;border-color:#344a60;color:#c4d5e5}button:focus-visible{outline:2px solid white;outline-offset:3px}
.note{max-width:520px;text-align:center;color:#71899f;font-size:.72rem;margin:18px auto 0}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><main class="stage" id="stage"><div class="stars"></div><div class="beam"></div><div class="floor"></div>
<div class="topline">TIKNATION PRESENTS</div><h1 class="title">THE FOUNDER</h1><div class="subtitle">THE ONE WHO STARTED IT ALL</div>
<figure aria-label="Original cinematic founder character, designed without a photograph"><div class="halo"></div><div class="person"><div class="hair"></div><div class="head"></div><div class="neck"></div><div class="legs"></div><div class="coat-tail"></div><div class="torso"></div><div class="shirt"></div><div class="lapel"></div><div class="tie"></div><div class="arm left"></div><div class="arm right"></div><div class="hand left"></div><div class="hand right"></div><div class="pin"></div></div><div class="base"></div></figure>
<div class="reveal"><div class="name">Matt</div><div class="founder">FOUNDER · TIKNATION</div><div class="rule"></div><div class="tag">YOUR VOICE. YOUR WORLD.</div></div>
<div class="actions"><button id="enter" type="button">REVEAL THE FOUNDER</button><button class="secondary" id="replay" type="button">REPLAY</button></div>
<p class="note">Original CSS-rendered character concept · no personal photos used. Preview only; live gifting and coin charging are not connected.</p></main>
<script>
const stage=document.getElementById('stage'),enter=document.getElementById('enter'),replay=document.getElementById('replay');
function reveal(){stage.classList.add('awake');try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();const now=c.currentTime;[110,164.81,220].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.09,now+.12+i*.1);g.gain.exponentialRampToValueAtTime(.0001,now+1.5);o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+1.55)});setTimeout(()=>c.close(),1900)}catch(e){}}
enter.addEventListener('click',reveal);replay.addEventListener('click',()=>{stage.classList.remove('awake');const p=document.querySelector('.person');p.style.animation='none';void p.offsetWidth;p.style.animation='';setTimeout(reveal,250)});
</script></body></html>
