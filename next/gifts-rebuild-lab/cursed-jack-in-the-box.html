nd:radial-gradient(circle at 30% 25%,#f0d5a0,#76502d 65%,#21140e);box-shadow:0 1px 4px #000}.clown{position:absolute;width:220px;height:290px;left:85px;bottom:140px;transform:translateY(300px) scale(.7);opacity:0;transform-style:preserve-3d;transition:none;filter:drop-shadow(0 12px 18px #000)}.head{position:absolute;width:154px;height:190px;left:33px;top:8px;border-radius:48% 48% 45% 45%;background:radial-gradient(ellipse at 34% 23%,#f4e7d6 0,#c9b9a8 37%,#82726c 72%,#34252a 100%);box-shadow:inset -15px -10px 24px #20151b,inset 8px 8px 16px #fff5e2,0 5px 20px #000;border:2px solid #4b3836;overflow:hidden}.head:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(17deg,transparent 0 18px,rgba(65,39,34,.07) 19px 20px),radial-gradient(ellipse at 50% 90%,rgba(45,20,25,.45),transparent 55%);mix-blend-mode:multiply}.hair{position:absolute;z-index:3;left:28px;top:-2px;width:164px;height:68px;border-radius:50% 50% 12% 12%;background:radial-gradient(ellipse at 50% 90%,#302329,#09090d 65%);clip-path:polygon(0 0,100% 0,92% 52%,80% 35%,72% 65%,62% 39%,52% 68%,42% 40%,30% 65%,20% 35%,8% 65%)}.eye{position:absolute;z-index:4;top:69px;width:42px;height:37px;border-radius:50%;background:radial-gradient(ellipse,#050407 35%,#342128 70%,transparent 72%);box-shadow:0 0 12px #170c11}.eye.left{left:27px}.eye.right{right:27px}.iris{position:absolute;left:15px;top:12px;width:10px;height:15px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#eee0c8 0 12%,#8b4b3c 22%,#080609 60%);box-shadow:0 0 5px #fff}.brow{position:absolute;z-index:5;top:57px;width:48px;height:12px;border-top:5px solid #4c2529;border-radius:50%}.brow.left{left:24px;transform:rotate(12deg)}.brow.right{right:24px;transform:rotate(-12deg)}.nose{position:absolute;z-index:5;left:69px;top:91px;width:24px;height:37px;border-radius:48% 48% 60% 60%;background:linear-gradient(90deg,#805d59,#d9b6a7 45%,#684447);box-shadow:inset -5px 0 8px #503337}.cheek{position:absolute;z-index:3;top:112px;width:39px;height:27px;border-radius:50%;background:radial-gradient(ellipse,rgba(119,26,35,.78),rgba(119,26,35,0) 72%);filter:blur(2px)}.cheek.left{left:8px}.cheek.right{right:8px}.mouth{position:absolute;z-index:5;left:32px;top:137px;width:91px;height:39px;border-radius:10% 10% 55% 55%;background:linear-gradient(#260c12,#080609 75%);clip-path:polygon(0 0,100% 0,86% 75%,50% 100%,14% 75%);border-top:5px solid #6e242a}.teeth{position:absolute;z-index:6;left:44px;top:139px;width:69px;height:13px;background:repeating-linear-gradient(90deg,#e2d4bd 0 8px,#796b60 9px 10px);clip-path:polygon(0 0,100% 0,90% 100%,10% 100%)}.crack{position:absolute;z-index:6;left:103px;top:25px;width:2px;height:32px;background:#67514c;transform:rotate(28deg);box-shadow:0 12px 0 -0.3px #67514c}.ruff{position:absolute;z-index:1;left:16px;top:177px;width:188px;height:72px;border-radius:50%;background:repeating-conic-gradient(from 0deg at 50% 0%,#b9a58d 0deg 8deg,#39252a 9deg 15deg,#8d7770 16deg 22deg);filter:drop-shadow(0 4px 4px #000)}.torso{position:absolute;left:47px;top:220px;width:126px;height:90px;border-radius:50% 50% 10% 10%;background:linear-gradient(90deg,#130c12,#541b25 48%,#170d13);border:2px solid #3a2024}.spring{position:absolute;left:100px;bottom:90px;width:20px;height:115px;background:repeating-linear-gradient(0deg,transparent 0 8px,#aaa 9px 12px,transparent 13px 17px);filter:drop-shadow(0 0 3px #ddd);opacity:0}.smoke{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 54%,rgba(196,193,189,.7),transparent 20%),radial-gradient(ellipse at 43% 60%,rgba(125,124,132,.7),transparent 28%),radial-gradient(ellipse at 59% 61%,rgba(160,151,148,.65),transparent 30%);filter:blur(14px)}.stage.open .lid{transform:rotateX(90deg) rotateX(-118deg) translateZ(90px)}.stage.pop .clown{opacity:1;transform:translateY(-10px) scale(1);transition:transform 1.15s cubic-bezier(.12,.9,.18,1),opacity .2s}.stage.pop .spring{opacity:1}.stage.lunge .clown{transform:translateY(-20px) translateZ(210px) scale(1.48);transition:transform .48s cubic-bezier(.1,.8,.2,1)}.stage.vanish .clown{opacity:0;transform:translateY(-120px) translateZ(250px) scale(.25);filter:blur(12px);transition:all .75s}.stage.vanish .smoke{opacity:.9;animation:smoke .9s ease-out forwards}@keyframes smoke{to{opacity:0;transform:scale(1.8)}}.stage.blackout:after{content:"";position:absolute;inset:0;background:#000;animation:fade .8s forwards}@keyframes fade{to{opacity:.9}}.controls{display:flex;gap:10px;justify-content:center;margin:15px 0 9px;flex-wrap:wrap}button{border:1px solid #b18b56;background:linear-gradient(#4a2525,#1b1115);color:#f7e6cb;border-radius:999px;padding:13px 23px;font:12px system-ui;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.4}#status{min-height:20px;font:11px system-ui;letter-spacing:.12em;color:#c9a878}.note{font:10px system-ui;color:#777;margin-top:9px}

</style></head><body><main><div class="eyebrow">TIKNATION · EPIC GIFTS · PREVIEW</div><h1 class="title">THE CURSED JACK-IN-THE-BOX</h1><div class="sub">WIND IT. LISTEN. DON'T LOOK AWAY.</div>
<div class="stage" id="stage"><div class="backdrop"></div><div class="moonlight"></div><div class="dust"></div><div class="floor"></div><div class="platform"><div class="clown" id="clown"><div class="torso"></div><div class="ruff"></div><div class="head"><div class="hair"></div><div class="brow left"></div><div class="brow right"></div><div class="eye left"><div class="iris"></div></div><div class="eye right"><div class="iris"></div></div><div class="cheek left"></div><div class="cheek right"></div><div class="nose"></div><div class="mouth"></div><div class="teeth"></div><div class="crack"></div></div></div><div class="spring"></div><div class="box"><div class="boxback"></div><div class="boxside"></div><div class="boxfront"><div class="front-label">JOLLY JESTER</div></div><div class="boxbase"></div><div class="top"></div><div class="lid"></div><i class="rivet" style="left:12px;bottom:12px"></i><i class="rivet" style="right:12px;bottom:12px"></i></div></div><div class="smoke"></div><div class="spot"></div></div>
<div class="controls"><button id="play">▶ Wind it up</button><button id="stop" disabled>■ Stop</button></div><div id="status" role="status">THE MUSIC HAS STOPPED… FOR NOW.</div><div class="note">Sound starts after tapping Wind it up · Headphones recommended</div></main>
<script>
(()=>{const stage=document.getElementById('stage'),play=document.getElementById('play'),stop=document.getElementById('stop'),status=document.getElementById('status');let ctx=null,timers=[],osc=[],active=false;
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id)}
function tone(f,d,at,type='sine',vol=.04,end=f){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,at);o.frequency.exponentialRampToValueAtTime(Math.max(1,end),at+d);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+.025);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g).connect(ctx.destination);o.start(at);o.stop(at+d+.03);osc.push(o)}
function noise(d,at,vol,cut){const b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length)**.6;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.001,at+d);s.connect(f).connect(g).connect(ctx.destination);s.start(at)}
function stopAll(){active=false;timers.forEach(clearTimeout);timers=[];osc.forEach(o=>{try{o.stop()}catch(e){}});osc=[];if(ctx){ctx.close();ctx=null}stage.className='stage';play.disabled=false;stop.disabled=true;status.textContent='THE MUSIC HAS STOPPED… FOR NOW.'}
function playShow(){stopAll();ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();active=true;play.disabled=true;stop.disabled=false;const n=ctx.currentTime;status.textContent='THE MECHANISM IS TURNING…';// metallic winding ratchet
for(let i=0;i<17;i++){let a=n+i*.14;tone(2100-(i%4)*170,.035,a,'square',.018,1500)}
// eerie music box, accelerating phrases
const melody=[659,784,988,784,659,523,659,784,1047,988,784,659,784,988,1175,1047,988,784,659,784,988,1175,1318,1175,988,784,880,1047,1318,1568];
melody.forEach((f,i)=>{let a=n+1.1+i*(i<12?.29:.19);tone(f,.36,a,'sine',.035);tone(f*2,.18,a,'triangle',.009)});
for(let i=0;i<25;i++){let a=n+1.5+i*(.22-i*.005);tone(1300,.022,a,'square',.008)}
// reveal, impact, spring recoil, approach
later(()=>{stage.classList.add('open');status.textContent='THE LID IS OPENING…'},3900);
later(()=>{stage.classList.add('pop');status.textContent='SOMETHING IS INSIDE!';noise(.8,ctx.currentTime,.55,1600);tone(58,.8,ctx.currentTime,'sawtooth',.2,35);for(let i=0;i<6;i++)tone(220-i*22,.22,ctx.currentTime+i*.17,'triangle',.08,100)},4700);
later(()=>{status.textContent='IT SEES YOU.';tone(880,.8,ctx.currentTime,'sawtooth',.035,180);tone(92,1.8,ctx.currentTime,'sine',.14,38);noise(1.5,ctx.currentTime,.1,500)},6500);
later(()=>{stage.classList.add('lunge');status.textContent='GET BACK!';noise(.45,ctx.currentTime,.75,2400);tone(48,.7,ctx.currentTime,'sawtooth',.25,25);tone(1200,.4,ctx.currentTime,'square',.05,160)},8200);
later(()=>{stage.classList.add('vanish');status.textContent='IT HAS DISAPPEARED…';noise(1.4,ctx.currentTime,.35,650);tone(180,.9,ctx.currentTime,'sine',.09,32)},9000);
later(()=>{stage.classList.add('blackout');status.textContent='THE BOX HAS GONE QUIET.'},10300);
later(()=>{stopAll()},11600)}
play.addEventListener('click',playShow);stop.addEventListener('click',stopAll);
})();
</script></body></html>
