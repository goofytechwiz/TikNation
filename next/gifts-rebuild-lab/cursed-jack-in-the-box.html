<script>
(()=>{const canvas=document.querySelector('#scene'),stage=document.querySelector('#stage'),play=document.querySelector('#play'),stop=document.querySelector('#stop'),status=document.querySelector('#status');

const box=new THREE.Group();scene.add(box);

const lid=mesh(new THREE.BoxGeometry(2.9,.22,2.35),wood,lidPivot,0,0,1.08);mesh(new THREE.BoxGeometry(2.68,.045,2.12),gold,lidPivot,0,.13,1.08);

const nose=mesh(new THREE.SphereGeometry(.19,24,20),redmat,head,0,-.16,.79);nose.scale.set(.75,1.25,.72);
const mouth=mesh(new THREE.SphereGeometry(1,32,20),black,head,0,-.47,.66);mouth.scale.set(.48,.2,.11);
for(let i=0;i<7;i++){const tooth=mesh(new THREE.BoxGeometry(.105,.12,.045),ivory,head,-.28+i*.093,-.39,.77);tooth.rotation.z=(i-3)*-.025}
for(let x of [-.52,.52]){const cheek=mesh(new THREE.SphereGeometry(.2,20,16),redmat,head,x,-.25,.58);cheek.scale.set(1,.55,.22)}

const dust=new THREE.Group();scene.add(dust);const dustGeo=new THREE.BufferGeometry(),positions=[];for(let i=0;i<300;i++)positions.push((Math.random()-.5)*10,Math.random()*6,(Math.random()-.5)*5);dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));const particles=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xc9b69a,size:.025,transparent:true,opacity:.55}));scene.add(particles);
let phase='idle',start=0,ctx=null,timers=[],raf=0,clownY=2.3,clownZ=0;
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
function render(){raf=requestAnimationFrame(render);const t=performance.now()*.001;particles.rotation.y=t*.012;if(phase==='idle'){box.rotation.y=Math.sin(t*.35)*.025}else{const e=(performance.now()-start)/1000;if(e>3.9)lidPivot.rotation.x=-Math.min(1.9,(e-3.9)*1.25);if(e>4.7){clown.visible=true;const p=Math.min(1,(e-4.7)/1.1);clown.position.y=2.3+1.75*(1-Math.pow(1-p,3));clown.rotation.z=Math.sin(e*8)*.035}if(e>8.2){const p=Math.min(1,(e-8.2)/.45);clown.position.z=p*2.2;clown.scale.setScalar(.88+p*.5)}if(e>9){clown.visible=false;red.intensity=2.8}if(e>10.3){red.intensity=0}}renderer.render(scene,camera)}render();
function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id)}
function sound(){ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const n=ctx.currentTime;function tone(f,d,at,type='sine',v=.035,end=f){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,at);o.frequency.exponentialRampToValueAtTime(Math.max(1,end),at+d);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(v,at+.02);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g).connect(ctx.destination);o.start(at);o.stop(at+d+.03)}function hit(d,at,v,cut){const b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;g.gain.value=v;s.connect(f).connect(g).connect(ctx.destination);s.start(at);g.gain.exponentialRampToValueAtTime(.001,at+d)}const notes=[659,784,988,784,659,523,659,784,1047,988,784,659,784,988,1175,1047,988,784,659,784,988,1175,1318,1175,988,784,880,1047,1318,1568];notes.forEach((f,i)=>tone(f,.32,n+1+i*(i<12?.29:.19),'sine',.035));for(let i=0;i<20;i++)tone(1800-(i%4)*140,.03,n+i*.15,'square',.014,1200);later(()=>{hit(.8,ctx.currentTime,.6,1300);tone(55,.8,ctx.currentTime,'sawtooth',.2,30)},4700);later(()=>{hit(.5,ctx.currentTime,.8,2300);tone(48,.7,ctx.currentTime,'sawtooth',.23,22)},8200);later(()=>{hit(1.2,ctx.currentTime,.35,600);tone(170,.9,ctx.currentTime,'sine',.1,30)},9000)}
