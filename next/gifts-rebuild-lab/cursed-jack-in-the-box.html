 const suit=mat('#391124',.34,.08),ruff=mat('#d8cbbb',.7),skin=mat('#d4bca8',.54),hair=mat('#151116',.8),eye=mat('#eee6d7',.28),pupil=mat('#09080c',.15);

function resize(){if(!renderer)return;const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
function audioStart(){
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 audio=new AC();master=audio.createGain();master.gain.value=.36;master.connect(audio.destination);
 const notes=[659,587,523,587,659,659,659,587,587,587,659,784,784,659,587,523,587,659,659,659,659,587,587,659,587,523];
 let at=audio.currentTime+.05;
 notes.forEach((f,i)=>{const d=.31-i*.004,o=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();o.type='triangle';o.frequency.value=f;filter.type='lowpass';filter.frequency.value=1800;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.14,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+d*.9);o.connect(filter).connect(g).connect(master);o.start(at);o.stop(at+d);at+=d});
 const impact=audio.createOscillator(),ig=audio.createGain();impact.type='sawtooth';impact.frequency.setValueAtTime(95,at+4.85);impact.frequency.exponentialRampToValueAtTime(32,at+5.3);ig.gain.setValueAtTime(.0001,at+4.85);ig.gain.exponentialRampToValueAtTime(.45,at+4.9);ig.gain.exponentialRampToValueAtTime(.0001,at+5.5);impact.connect(ig).connect(master);impact.start(at+4.85);impact.stop(at+5.55);

function stopSound(){if(audio){audio.close().catch(()=>{});audio=null}}
function start(){if(phase!=='idle')return;phase='show';started=clock.getElapsedTime();wind.disabled=true;reset.disabled=false;status.textContent='THE HANDLE TURNS… THE MUSIC BEGINS.';const d=audioStart();setTimeout(()=>{if(phase==='show')status.textContent='THE LID BURSTS OPEN!'},4900);setTimeout(()=>{if(phase==='show')status.textContent='HE FOUND YOU.'},9500);setTimeout(()=>{if(phase==='show')status.textContent='A CRACK… THEN SILENCE.'},11600);setTimeout(()=>{if(phase==='show')resetShow()},14500)}
