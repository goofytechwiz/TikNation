<!doctype html>
<html lang="en"><head>

<style>

</style></head><body><main>
<div class="eyebrow">TIKNATION · EPIC GIFTS · PRIVATE PREVIEW</div>
<h1>THE CURSED JACK-IN-THE-BOX</h1><div class="sub">TURN THE HANDLE. HEAR THE TUNE. FACE WHAT'S INSIDE.</div>
<div class="stage"><canvas id="art" aria-label="An antique purple and crimson jack-in-the-box with a winding crank and a sinister clown"></canvas><div class="vignette"></div></div>
<div class="controls"><button id="wind">✧ Wind it up</button><button id="reset" disabled>Stop / reset</button></div>
<div id="status" role="status">THE BOX IS WAITING IN THE DARK.</div>
<div class="note">Original synthesized toy music-box rendition of “Pop Goes the Weasel”. Sound begins after tapping Wind it up.</div>
</main>
<script>
(()=>{
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),wind=document.getElementById('wind'),reset=document.getElementById('reset'),status=document.getElementById('status');
let W=0,H=0,dpr=1,raf=0,start=0,phase='idle',audio=null,master=null,oscillators=[],endTimer=0,particles=[];
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw(0)}
new ResizeObserver(resize).observe(canvas);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),ease=t=>1-Math.pow(1-t,3);
function rr(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function gradient(x,y,r,c1,c2){const g=ctx.createRadialGradient(x-r*.3,y-r*.4,1,x,y,r);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}
function line(x1,y1,x2,y2,color,width=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function draw(t){
 const w=W,h=H;if(!w||!h)return;ctx.clearRect(0,0,w,h);
 const cx=w*.5,base=h*.83,scale=Math.min(w/640,h/470);ctx.save();ctx.translate(cx,base);ctx.scale(scale,scale);
 // theatre floor and soft pool of light
 const pool=ctx.createRadialGradient(0,8,5,0,8,290);pool.addColorStop(0,'#75617c66');pool.addColorStop(1,'#08091200');ctx.fillStyle=pool;ctx.fillRect(-330,-390,660,450);
 ctx.fillStyle='#090a12';ctx.beginPath();ctx.ellipse(0,12,255,25,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8b718c55';ctx.lineWidth=2;ctx.stroke();
 // floating dust motes
 for(const p of particles){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x, p.y, p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 const lidOpen=phase==='idle'?0:clamp((t-4.2)/1.05,0,1)*1.5;
 const pop=phase==='idle'?0:clamp((t-5.0)/1.4,0,1);
 const lunge=phase==='idle'?0:clamp((t-9.5)/.6,0,1);
 const vanish=phase==='idle'?0:clamp((t-11.4)/.65,0,1);
 // shadow behind the box
 ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,-5,166,19,0,0,Math.PI*2);ctx.fill();
 // box body: front, side and top bevel
 const bx=-150,by=-155,bw=300,bh=155,depth=34;
 ctx.beginPath();ctx.moveTo(bx+bw,by);ctx.lineTo(bx+bw+depth,by-22);ctx.lineTo(bx+bw+depth,by+bh-18);ctx.lineTo(bx+bw,by+bh);ctx.closePath();ctx.fillStyle='#25112a';ctx.fill();ctx.strokeStyle='#d5a75b';ctx.lineWidth=3;ctx.stroke();
 const body=ctx.createLinearGradient(0,by,0,by+bh);body.addColorStop(0,'#8a2449');body.addColorStop(.45,'#42152f');body.addColorStop(1,'#170e20');rr(bx,by,bw,bh,8,body,'#e2b96e',4);
 // inset panels
 rr(-133,-139,266,123,4,'#291b36','#bd9256',2);rr(-124,-130,248,105,3,'#173d4b','#8d6ba0',1);
 // ornate diamond quilting
 for(let x=-112;x<=112;x+=28){line(x,-124,x+14,-25,'#a9d8d455',1);line(x+14,-124,x,-25,'#e8bd7850',1)}
 // plaque and corner studs
 rr(-61,-91,122,42,6,'#24111f','#d7ae67',2);ctx.textAlign='center';ctx.fillStyle='#f3d69b';ctx.font='bold 10px Georgia';ctx.fillText('POP  •  GOES',0,-73);ctx.font='8px Georgia';ctx.fillText('THE WEASEL',0,-59);
 for(const x of [-137,137])for(const y of [-141,-15]){ctx.fillStyle=gradient(x,y,6,'#fff1b7','#9a5b25');ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()}
 // top rim and hollow interior
 ctx.beginPath();ctx.moveTo(-150,-155);ctx.lineTo(-130,-180);ctx.lineTo(130,-180);ctx.lineTo(150,-155);ctx.closePath();ctx.fillStyle='#170f20';ctx.fill();ctx.strokeStyle='#e4bd77';ctx.lineWidth=4;ctx.stroke();
 ctx.beginPath();ctx.ellipse(0,-164,126,18,0,0,Math.PI*2);ctx.fillStyle='#08080f';ctx.fill();ctx.strokeStyle='#9d6b4e';ctx.lineWidth=2;ctx.stroke();
 // spring rising from fixed floor inside
 const springTop=-180-pop*94;ctx.strokeStyle='#d8b56d';ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<=36;i++){const q=i/36,y=-165+(springTop+165)*q,x=Math.sin(q*Math.PI*18)*12;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();
 ctx.fillStyle='#c5a16b';ctx.beginPath();ctx.ellipse(0,-164,15,5,0,0,Math.PI*2);ctx.fill();
 // lid swings backward on hinge, with perspective trapezoid
 ctx.save();ctx.translate(0,-177);ctx.rotate(-lidOpen);ctx.translate(0,0);
 ctx.beginPath();ctx.moveTo(-150,0);ctx.lineTo(-126,-24);ctx.lineTo(-112,-143);ctx.lineTo(112,-143);ctx.lineTo(126,-24);ctx.lineTo(150,0);ctx.closePath();
 const lidg=ctx.createLinearGradient(-130,-100,130,-20);lidg.addColorStop(0,'#a32d50');lidg.addColorStop(.5,'#4a1d43');lidg.addColorStop(1,'#17152e');ctx.fillStyle=lidg;ctx.fill();ctx.strokeStyle='#e3bd79';ctx.lineWidth=5;ctx.stroke();
 ctx.beginPath();ctx.moveTo(-105,-125);ctx.lineTo(105,-125);ctx.lineTo(119,-25);ctx.lineTo(-119,-25);ctx.closePath();ctx.strokeStyle='#b9e7e8';ctx.lineWidth=2;ctx.stroke();
 for(let x of [-86,86]){ctx.fillStyle='#e6c47f';ctx.beginPath();ctx.arc(x,-76,5,0,Math.PI*2);ctx.fill()}
 ctx.restore();
 // clown rises out of the cavity: shaded head, hair, collar, ruff and suit
 if(pop>0&&vanish<1){
 ctx.save();ctx.translate(0,-175-pop*91+lunge*38,0);ctx.scale(1+lunge*.52,1+lunge*.52);
 ctx.globalAlpha=1-vanish;
 // shoulders and costume
 const suit=ctx.createLinearGradient(-70,0,70,0);suit.addColorStop(0,'#170f20');suit.addColorStop(.5,'#a51f42');suit.addColorStop(1,'#210d22');
 ctx.fillStyle=suit;ctx.beginPath();ctx.moveTo(-61,70);ctx.quadraticCurveTo(-74,8,-40,-4);ctx.lineTo(40,-4);ctx.quadraticCurveTo(74,8,61,70);ctx.closePath();ctx.fill();ctx.strokeStyle='#d3a75d';ctx.lineWidth=3;ctx.stroke();
 // pleated ruff
 for(let i=0;i<19;i++){const a=Math.PI*2*i/19;ctx.save();ctx.translate(Math.cos(a)*36,5+Math.sin(a)*12);ctx.rotate(a);ctx.fillStyle=i%2?'#ded0bd':'#a99791';ctx.beginPath();ctx.ellipse(0,0,10,25,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#66525a';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
 // head shape with natural shaded volume
 ctx.fillStyle=gradient(0,-49,66,'#f1d9c7','#76605d');ctx.beginPath();ctx.ellipse(0,-49,53,66,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#39252a';ctx.lineWidth=2;ctx.stroke();
 // dark cap and wild hair tufts
 ctx.fillStyle='#171019';ctx.beginPath();ctx.ellipse(0,-92,55,30,-.08,Math.PI,Math.PI*2);ctx.fill();for(let i=0;i<11;i++){const x=-48+i*9.5;ctx.beginPath();ctx.moveTo(x,-95);ctx.quadraticCurveTo(x-12,-121-Math.sin(i*2)*9,x+4,-133+Math.cos(i)*5);ctx.quadraticCurveTo(x+13,-114,x+8,-91);ctx.fill()}
 // eyes, sockets and cold highlights
 for(const x of [-21,21]){ctx.fillStyle='#302129';ctx.beginPath();ctx.ellipse(x,-54,14,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eee1d1';ctx.beginPath();ctx.ellipse(x,-54,9,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9c493b';ctx.beginPath();ctx.arc(x+2,-54,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#08070b';ctx.beginPath();ctx.arc(x+2,-54,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,-58,1.7,0,Math.PI*2);ctx.fill()}
 // arched brows and red clown nose
 ctx.strokeStyle='#26151b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-37,-78);ctx.quadraticCurveTo(-21,-91,-8,-77);ctx.moveTo(8,-77);ctx.quadraticCurveTo(23,-91,38,-78);ctx.stroke();
 ctx.fillStyle=gradient(0,-34,13,'#ff7c76','#8c102b');ctx.beginPath();ctx.ellipse(0,-34,10,13,0,0,Math.PI*2);ctx.fill();
 // unsettling grin, dark mouth and teeth
 ctx.fillStyle='#260b18';ctx.beginPath();ctx.moveTo(-30,-16);ctx.quadraticCurveTo(0,3,30,-16);ctx.quadraticCurveTo(21,13,0,14);ctx.quadraticCurveTo(-22,10,-30,-16);ctx.fill();ctx.strokeStyle='#7b142b';ctx.lineWidth=3;ctx.stroke();
 for(let i=0;i<7;i++){ctx.fillStyle='#f1dfc9';ctx.beginPath();ctx.moveTo(-23+i*7,-13);ctx.lineTo(-18+i*7,-12);ctx.lineTo(-19+i*7,-4);ctx.closePath();ctx.fill()}
 // cheek paint streaks
 ctx.strokeStyle='#8f163b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-39,-38);ctx.quadraticCurveTo(-34,-22,-28,-21);ctx.moveTo(39,-38);ctx.quadraticCurveTo(34,-22,28,-21);ctx.stroke();
 ctx.restore();ctx.globalAlpha=1;
 }
 // right-side winding axle and turning handle, visible even on idle
 ctx.fillStyle='#151018';ctx.beginPath();ctx.ellipse(157,-82,13,20,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e0b66c';ctx.lineWidth=5;ctx.stroke();
 ctx.save();ctx.translate(166,-82);const spin=phase==='idle'?0:t* Math.PI*2*1.35;ctx.rotate(spin);ctx.strokeStyle='#d9b46d';ctx.lineWidth=9;ctx.lineCap='round';line(0,0,42,-48,'#d9b46d',9);ctx.fillStyle=gradient(42,-48,9,'#fff0b1','#805125');ctx.beginPath();ctx.arc(42,-48,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#392025';ctx.beginPath();ctx.roundRect(29,-59,28,12,6);ctx.fill();ctx.restore();
 // Rolling smoke puffs after the jump-scare; each cloud expands and drifts.
 if(phase!=='idle'&&t>5.05){
   const smokeAge=t-5.05,fade=clamp(1-smokeAge/6,0,1);
   for(let i=0;i<22;i++){
     const seed=i*2.399,age=(smokeAge+i*.075)%2.7,drift=age*18;
     const sx=Math.cos(seed)* (24+age*17),sy=-205+Math.sin(seed)*16-drift;
     const radius=8+age*12+(i%4)*3;
     const cloud=ctx.createRadialGradient(sx-radius*.25,sy-radius*.25,1,sx,sy,radius);
     cloud.addColorStop(0,'rgba(218,220,225,'+(fade*.22)+')');
     cloud.addColorStop(.55,'rgba(125,132,151,'+(fade*.13)+')');
     cloud.addColorStop(1,'rgba(65,70,90,0)');
     ctx.fillStyle=cloud;ctx.beginPath();ctx.arc(sx,sy,radius,0,Math.PI*2);ctx.fill();
   }
 }
 // magic flare when clown springs out
 if(pop>0&&vanish<1){const a=(1-vanish)*(.3+.25*Math.sin(t*12));ctx.globalAlpha=a;const g=ctx.createRadialGradient(0,-235,8,0,-235,180);g.addColorStop(0,'#8af5ff88');g.addColorStop(.5,'#a84bff22');g.addColorStop(1,'#a84bff00');ctx.fillStyle=g;ctx.fillRect(-210,-420,420,360);ctx.globalAlpha=1;
 for(let i=0;i<24;i++){const ang=i/24*Math.PI*2+t*.7,rad=100+Math.sin(t*4+i)*16;ctx.fillStyle=i%2?'#7ef3ff':'#d48bff';ctx.globalAlpha=a;ctx.beginPath();ctx.arc(Math.cos(ang)*rad, -225+Math.sin(ang)*rad*.55,2.2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
 // lid slam shake at jump
 if(phase!=='idle'&&t>4.8&&t<5.4){const j=Math.sin((t-4.8)*42)*3;ctx.translate(j,0)}
 ctx.restore();
}
function frame(){if(phase!=='idle'){const t=(performance.now()-start)/1000;draw(t)}else draw(0);raf=requestAnimationFrame(frame)}
function makeParticles(){particles=[];for(let i=0;i<65;i++)particles.push({x:(Math.random()-.5)*W*.8,y:-Math.random()*H*.85,r:.5+Math.random()*1.5,a:.15+Math.random()*.5,c:Math.random()>.5?'#e8c58c':'#9beeff'})}
function playTune(){
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC){status.textContent='THIS BROWSER DOES NOT SUPPORT AUDIO';return}
 audio=new AC();master=audio.createGain();master.gain.value=.22;master.connect(audio.destination);
 const notes=[659,587,523,587,659,659,659,587,587,587,659,784,784,659,587,523,587,659,659,659,659,587,587,659,587,523];
 const durations=[.23,.23,.23,.23,.23,.23,.46,.23,.23,.46,.23,.23,.46,.23,.23,.23,.23,.23,.23,.23,.23,.23,.23,.23,.23,.55];
 let at=audio.currentTime+.08;
 notes.forEach((freq,i)=>{const d=durations[i]*(1.7-i/notes.length*.18),o=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();o.type='sine';o.frequency.value=freq;filter.type='lowpass';filter.frequency.value=2400;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.19,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+d*.92);o.connect(filter).connect(g).connect(master);o.start(at);o.stop(at+d);oscillators.push(o);
 const overtone=audio.createOscillator(),og=audio.createGain();overtone.type='triangle';overtone.frequency.value=freq*2.01;og.gain.setValueAtTime(.0001,at);og.gain.exponentialRampToValueAtTime(.035,at+.008);og.gain.exponentialRampToValueAtTime(.0001,at+d*.65);overtone.connect(og).connect(master);overtone.start(at);overtone.stop(at+d);oscillators.push(overtone);
 at+=d;
 });
 const duration=at-audio.currentTime+.05;
 // Mechanical ticking accelerates with the tune.
 for(let tt=0;tt<duration;){const when=audio.currentTime+tt;const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=1900;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.025,when+.002);g.gain.exponentialRampToValueAtTime(.0001,when+.018);o.connect(g).connect(master);o.start(when);o.stop(when+.02);oscillators.push(o);tt+=Math.max(.12,.32-tt/duration*.19)}
 return duration;
}
function addMechanicalFX(){
 if(!audio||!master)return;
 const now=audio.currentTime;
 // Hinge groan as the lid releases.
 const creak=audio.createOscillator(),cg=audio.createGain(),cf=audio.createBiquadFilter();
 creak.type='sawtooth';creak.frequency.setValueAtTime(115,now+4.05);creak.frequency.exponentialRampToValueAtTime(330,now+4.85);creak.frequency.exponentialRampToValueAtTime(82,now+5.15);
 cf.type='lowpass';cf.frequency.value=720;cg.gain.setValueAtTime(.0001,now+4.05);cg.gain.exponentialRampToValueAtTime(.12,now+4.18);cg.gain.exponentialRampToValueAtTime(.0001,now+5.2);
 creak.connect(cf).connect(cg).connect(master);creak.start(now+4.05);creak.stop(now+5.22);oscillators.push(creak);
 // A short, filtered broadband impact.
 const bangAt=now+5.02,buffer=audio.createBuffer(1,Math.floor(audio.sampleRate*.55),audio.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,3);
 const noise=audio.createBufferSource(),ng=audio.createGain(),nf=audio.createBiquadFilter();
 noise.buffer=buffer;nf.type='lowpass';nf.frequency.setValueAtTime(1700,bangAt);nf.frequency.exponentialRampToValueAtTime(180,bangAt+.42);
 ng.gain.setValueAtTime(.0001,bangAt);ng.gain.exponentialRampToValueAtTime(.48,bangAt+.008);ng.gain.exponentialRampToValueAtTime(.0001,bangAt+.52);
 noise.connect(nf).connect(ng).connect(master);noise.start(bangAt);oscillators.push(noise);
 // Air rush when the clown lunges.
 const rush=audio.createOscillator(),rg=audio.createGain(),rf=audio.createBiquadFilter();
 rush.type='triangle';rush.frequency.setValueAtTime(480,now+9.35);rush.frequency.exponentialRampToValueAtTime(75,now+10.05);
 rf.type='lowpass';rf.frequency.value=900;rg.gain.setValueAtTime(.0001,now+9.35);rg.gain.exponentialRampToValueAtTime(.15,now+9.48);rg.gain.exponentialRampToValueAtTime(.0001,now+10.1);
 rush.connect(rf).connect(rg).connect(master);rush.start(now+9.35);rush.stop(now+10.12);oscillators.push(rush);
}
function stopAudio(){if(audio){try{audio.close()}catch(e){}audio=null}oscillators=[]}
function begin(){if(phase!=='idle')return;makeParticles();phase='show';start=performance.now();wind.disabled=true;reset.disabled=false;status.textContent='THE HANDLE TURNS… THE LITTLE TUNE BEGINS.';const duration=playTune();addMechanicalFX();const total=Math.max(duration+1.7,13.2);setTimeout(()=>{if(phase!=='show')return;status.textContent='THE LID BURSTS OPEN!'},4300);setTimeout(()=>{if(phase!=='show')return;status.textContent='HE FOUND YOU.'},6200);setTimeout(()=>{if(phase!=='show')return;status.textContent='A SHARP CRACK — THEN NOTHING.'},11200);endTimer=setTimeout(()=>{if(phase!=='show')return;phase='idle';stopAudio();wind.disabled=false;reset.disabled=true;status.textContent='THE MUSIC HAS ENDED. THE HANDLE IS STILL.';draw(0)},total*1000)}
function stop(){phase='idle';clearTimeout(endTimer);stopAudio();wind.disabled=false;reset.disabled=true;status.textContent='THE BOX HAS BEEN RESET.';draw(0)}
wind.addEventListener('click',begin);reset.addEventListener('click',stop);
makeParticles();resize();frame();
})();
</script></body></html>
