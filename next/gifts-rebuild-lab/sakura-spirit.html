</style></head><body><div class="veil"></div><div class="hud"><div><div class="tag">A little wonder, blooming forever</div><div class="title">SAKURA SPIRIT</div><div class="sub">The ancient tree awakens</div></div><div><div class="actions"><button id="bloom">✿ AWAKEN THE TREE</button><button id="sound">♫ SOUND OFF</button></div><div class="hint">DRAG TO ORBIT · WATCH THE PETALS DANCE</div></div><div class="foot">TIKNATION · YOUR VOICE. YOUR WORLD.</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090713);scene.fog=new THREE.FogExp2(0x100b20,.027);

scene.add(new THREE.HemisphereLight(0xd9c6ff,0x241327,2));const moon=new THREE.DirectionalLight(0xc6caff,2.1);moon.position.set(-4,8,5);scene.add(moon);
const pink=new THREE.PointLight(0xff72bd,85,18);pink.position.set(0,4,2);scene.add(pink);const aqua=new THREE.PointLight(0x63cfff,55,16);aqua.position.set(4,1,-3);scene.add(aqua);

const bark=new THREE.MeshStandardMaterial({color:0x493044,roughness:.94}),barkLight=new THREE.MeshStandardMaterial({color:0x76506b,roughness:.85});

branch(V(0,-2.5,0),V(-.18,.2,0),.52,.34);branch(V(-.18,.2,0),V(.18,2.5,0),.34,.19,barkLight);branch(V(.18,2.5,0),V(-.3,4.1,0),.19,.09);
const limbs=[[[-.1,.1,0],[-1.5,1.1,.2],[-2.7,2.7,.1]],[[-1.5,1.1,.2],[-2.4,1.6,.4],[-3.3,2.2,.4]],[[.05,.6,0],[1.5,1.4,.1],[2.8,2.9,.1]],[[1.5,1.4,.1],[2.5,1.7,.2],[3.5,2.3,.2]],[[.1,1.9,0],[-.8,2.8,-.1],[-1.1,3.8,0]],[[.18,2.4,0],[1.2,3.1,-.2],[1.5,4,0]],[[-.3,3.5,0],[-1.5,3.9,0],[-2.3,4.4,.1]]];
for(const path of limbs){for(let i=0;i<path.length-1;i++){const p=path[i],q=path[i+1];branch(V(...p),V(...q),.16-i*.045,.09-i*.025,i%2?barkLight:bark)}}
const blossomMats=[0xff9dcc,0xffc3df,0xf6a9ff,0xffe1ee].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.7,emissive:c,emissiveIntensity:.12}));
const petalGeo=new THREE.SphereGeometry(.105,8,6);const crowns=[[-2.7,2.8,0,1.25],[-3.3,2.3,.3,.85],[-1.2,3.9,0,1.1],[-2.2,4.4,0,.8],[0,4.3,0,1.05],[1.5,4.1,0,1.05],[2.8,3,0,1.2],[3.5,2.4,.2,.85],[.2,3.3,.1,1.35],[-.3,2.4,.1,1.15]];

// Glowing hanging spirit lanterns.

// Floating petals and luminous motes.
const petalParticles=[];const petalGeo2=new THREE.SphereGeometry(.045,6,5);for(let i=0;i<260;i++){const m=new THREE.Mesh(petalGeo2,blossomMats[i%blossomMats.length]);m.position.set((Math.random()-.5)*12,Math.random()*9-2,(Math.random()-.5)*7);m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);world.add(m);petalParticles.push({m,v:.25+Math.random()*.8,w:Math.random()*6})}
const moteGeo=new THREE.BufferGeometry(),N=900,arr=new Float32Array(N*3);for(let i=0;i<N;i++){arr[i*3]=(Math.random()-.5)*16;arr[i*3+1]=Math.random()*10-2;arr[i*3+2]=(Math.random()-.5)*10}moteGeo.setAttribute('position',new THREE.BufferAttribute(arr,3));const motes=new THREE.Points(moteGeo,new THREE.PointsMaterial({color:0xffd4ed,size:.035,transparent:true,opacity:.8}));scene.add(motes);

let audio=null;function sound(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)();const master=audio.createGain();master.gain.value=.12;master.connect(audio.destination);[174.61,261.63,349.23,523.25].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.022/(i+1);o.connect(g);g.connect(master);o.start()});}
function chime(){if(!audio)return;[659.25,783.99,987.77,1174.66].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.17,audio.currentTime+i*.12+.05);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+i*.12+2);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+i*.12);o.stop(audio.currentTime+i*.12+2.1)})}

let awakened=false;document.getElementById('bloom').onclick=()=>{awakened=true;sound();audio.resume();chime();document.getElementById('bloom').textContent='✿ BLOOM AGAIN'};
let down=false,lx=0,ly=0,ry=0,rx=0;renderer.domElement.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>down=false);addEventListener('pointermove',e=>{if(!down)return;ry+=(e.clientX-lx)*.006;rx=Math.max(-.35,Math.min(.35,rx+(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();world.rotation.y=ry+Math.sin(t*.16)*.08;world.rotation.x=rx;world.position.y=Math.sin(t*.55)*.045;lanterns.forEach((l,i)=>{l.g.position.y=l.y+Math.sin(t*1.1+i)*.12;l.g.position.x=Math.cos(l.a+t*.12)*l.r});petalParticles.forEach((p,i)=>{p.m.position.y-=p.v*.009*(awakened?1.8:1);p.m.position.x+=Math.sin(t*.7+p.w)*.004;p.m.rotation.z+=.012;if(p.m.position.y< -2.8){p.m.position.y=6.5+Math.random()*2;p.m.position.x=(Math.random()-.5)*12}});motes.rotation.y=t*.012;pink.intensity=awakened?110+Math.sin(t*2)*20:70+Math.sin(t)*8;aqua.intensity=awakened?75:45;renderer.render(scene,camera)}animate();
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
</script></body></html>
