</style></head><body><main class="stage"><canvas id="scene"></canvas><div class="hud"><div class="eyebrow">TIKNATION · GIFT REBUILD LAB</div><div><div class="hint">DRAG TO LOOK AROUND THE THEATER</div><div class="controls"><button id="trigger">TRIGGER GIFT</button><button id="sound">SOUND: OFF</button></div><div class="status" id="status">A FIGURE WAITS BEHIND THE CURTAIN</div></div></div><div class="error" id="error">The real-time 3D renderer could not start in this browser. Please try a browser with WebGL enabled.</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{const canvas=document.getElementById('scene'),status=document.getElementById('status'),trigger=document.getElementById('trigger'),sound=document.getElementById('sound'),error=document.getElementById('error');if(!window.THREE){error.style.display='flex';status.textContent='3D ENGINE COULD NOT LOAD';return}
const THREE=window.THREE;let renderer,scene,camera,puppet,head,arms=[],legs=[],strings=[],busy=false,audioOn=false,ctx=null,lookX=0,lookY=0,targetX=0,targetY=0;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;scene=new THREE.Scene();scene.background=new THREE.Color(0x09090c);scene.fog=new THREE.FogExp2(0x09090c,.035);camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,3.4,10.5);
const mat=(color,rough=.8,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});const wood=mat(0x705039,.48),darkWood=mat(0x2a1a15,.56),skin=mat(0xb49a78,.68),aged=mat(0x8b745b,.7),cloth=mat(0x21171c,.96),coat=mat(0x49343a,.9),gold=mat(0x9b7950,.38,.55),black=mat(0x08090b,.2),eye=mat(0xd8c8a5,.22),red=mat(0x541d21,.95);
scene.add(new THREE.HemisphereLight(0xb9c1d0,0x1b100d,1.15));const key=new THREE.SpotLight(0xffdfb5,150,22,Math.PI/5,.55,1.4);key.position.set(0,9,3);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const rim=new THREE.PointLight(0x8c9cbb,22,12);rim.position.set(-4,4,-2);scene.add(rim);const practical=new THREE.PointLight(0xffa65c,9,8);practical.position.set(4,2,1);scene.add(practical);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(22,22),mat(0x241b18,.86));floor.rotation.x=-Math.PI/2;floor.position.y=-.05;floor.receiveShadow=true;scene.add(floor);
function box(parent,w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cyl(parent,r1,r2,h,m,x,y,z,seg=16){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function ball(parent,x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const wall=box(scene,18,9,.5,mat(0x211817),0,4,-4);wall.receiveShadow=true;for(let x=-7;x<=7;x+=2.3){box(scene,.11,7,.16,darkWood,x,4,-3.68);box(scene,1.95,.12,.18,wood,x,1,-3.65);box(scene,1.95,.12,.18,wood,x,7,-3.65)}
// Heavy side curtains and upper valance
for(const x of [-8.2,8.2]){const c=box(scene,2.1,8,.5,red,x,4,-2.8);c.rotation.z=x<0?-.05:.05;for(let i=0;i<6;i++)box(scene,.16,7.8,.53,mat(i%2?0x351217:0x651f27),x-0.85+i*.34,4,-2.5)}
box(scene,17,1.1,.6,red,0,8,-2.7);
// old theater boards, scattered dust-like low haze
for(let i=0;i<9;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(1.9,.08,7),mat(i%2?0x30221b:0x3a2920),);p.position.set(-7.6+i*1.9,.02,0);p.receiveShadow=true;scene.add(p)}
// Puppet rig with separate articulated wooden limbs
puppet=new THREE.Group();puppet.position.set(0,.1,0);scene.add(puppet);
const torso=ball(puppet,0,2.65,0,.57,.88,.34,coat);ball(puppet,0,3.35,.02,.59,.16,.36,darkWood);
const neck=cyl(puppet,.14,.16,.28,wood,0,3.58,0);head=new THREE.Group();head.position.set(0,4.13,0);puppet.add(head);
ball(head,0,0,0,.48,.58,.42,skin);ball(head,0,.42,-.015,.51,.27,.44,darkWood);
for(const x of [-.19,.19]){ball(head,x,.04,.365,.115,.075,.06,black);ball(head,x,.055,.418,.045,.045,.022,eye);ball(head,x,.055,.438,.018,.028,.012,black)}
ball(head,0,-.17,.39,.075,.12,.045,aged);const mouth=box(head,.2,.035,.045,black,0,-.34,.38);mouth.rotation.z=.02;
for(let i=0;i<4;i++){const crack=box(head,.012,.18,.008,darkWood,-.27+i*.17,.2,.405);crack.rotation.z=(i%2?-.6:.5)}
// Coat panels and buttons
for(const y of [2.95,2.68,2.41])ball(puppet,0,y,.34,.045,.045,.025,gold);
const limb=(x,y,z,len,r,m)=>{const g=new THREE.Group();g.position.set(x,y,z);puppet.add(g);cyl(g,r*.8,r,len,m,0,-len/2,0);ball(g,0,-len,0,r*1.12,r*1.12,r*1.12,wood);return g};
for(const side of [-1,1]){const upper=limb(side*.53,3.25,0,.72,.14,aged);const lower=limb(0,-.72,0,.65,.105,wood);upper.add(lower);ball(lower,0,-.64,.03,.13,.19,.13,skin);arms.push({upper,lower,side});const thigh=limb(side*.23,2.02,0,.77,.17,coat);const shin=limb(0,-.77,0,.7,.12,aged);thigh.add(shin);ball(shin,0,-.7,.13,.23,.12,.36,darkWood);legs.push({upper:thigh,lower:shin,side})}
// Fine strings from wooden crossbar to joints, visible against stage
const bar=box(scene,1.65,.1,.12,wood,0,7.15,0);bar.rotation.z=.02;
function thread(a,b){const d=new THREE.Vector3().subVectors(b,a);const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.009,.009,d.length(),6),mat(0xc1a77b,.45,.15));mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());scene.add(mesh);strings.push({mesh,a:a.clone(),b:b.clone()})}
const anchor=(x,y,z)=>new THREE.Vector3(x,y,z);thread(anchor(-.68,7.1,0),anchor(-.53,3.25,0));thread(anchor(-.2,7.1,0),anchor(0,4.65,0));thread(anchor(.2,7.1,0),anchor(0,3.2,0));thread(anchor(.68,7.1,0),anchor(.53,3.25,0));thread(anchor(-.38,7.1,0),anchor(-.23,2,0));thread(anchor(.38,7.1,0),anchor(.23,2,0));
// Antique chair behind puppet
const chair=new THREE.Group();chair.position.set(0,0,-1.25);scene.add(chair);box(chair,1.55,1.7,.18,darkWood,0,1.65,0);box(chair,1.32,1.4,.12,red,0,1.72,.12);for(const x of [-.72,.72]){cyl(chair,.07,.1,1.6,wood,x,.82,0);ball(chair,x,2.55,0,.12,.18,.12,gold)}box(chair,1.8,.2,.8,wood,0,.9,.12);for(const x of [-.72,.72])cyl(chair,.06,.09,.9,wood,x,.43,.35);
}catch(e){error.style.display='flex';status.textContent='3D SCENE INITIALIZATION FAILED';return}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<600?49:42;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let down=false,px=0,py=0;canvas.addEventListener('pointerdown',e=>{down=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!down)return;targetX=Math.max(-1.1,Math.min(1.1,targetX+(e.clientX-px)*.004));targetY=Math.max(-.35,Math.min(.45,targetY+(e.clientY-py)*.002));px=e.clientX;py=e.clientY});canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointercancel',()=>down=false);
function tick(){requestAnimationFrame(tick);lookX+=(targetX-lookX)*.04;lookY+=(targetY-lookY)*.04;camera.position.x=Math.sin(lookX)*1.5;camera.position.y=3.4+lookY;camera.lookAt(0,3,0);if(!busy){puppet.rotation.z=Math.sin(performance.now()*.0007)*.012;head.rotation.y=Math.sin(performance.now()*.0005)*.035}renderer.render(scene,camera)}tick();
function noise(dur,vol,cut,delay=0){if(!audioOn||!ctx)return;const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(ctx.destination);s.start(ctx.currentTime+delay)}
function groan(freq,delay,dur,vol){if(!audioOn||!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(freq,ctx.currentTime+delay);o.frequency.exponentialRampToValueAtTime(freq*.62,ctx.currentTime+delay+dur);f.type='lowpass';f.frequency.value=420;g.gain.setValueAtTime(.0001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(vol,ctx.currentTime+delay+.15);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+dur);o.connect(f);f.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+dur+.03)}
sound.onclick=async()=>{audioOn=!audioOn;if(audioOn){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){audioOn=false;status.textContent='AUDIO NOT AVAILABLE';}else{ctx=ctx||new AC();if(ctx.state==='suspended')await ctx.resume();groan(105,0,.2,.018)}}sound.textContent='SOUND: '+(audioOn?'ON':'OFF')};
trigger.onclick=()=>{if(busy)return;busy=true;trigger.disabled=true;status.textContent='THE STRINGS ARE PULLING…';if(audioOn){if(ctx.state==='suspended')ctx.resume();noise(5,.15,220);groan(78,.15,2.4,.085);groan(185,1.25,.8,.035);noise(.4,.08,1800,2.5);groan(125,2.4,1.4,.075);noise(1,.11,480,4)}
const start=performance.now();function act(now){const t=Math.min(1,(now-start)/5200),ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;const p=ease(t);head.rotation.y=.55*Math.sin(Math.min(1,t*1.45)*Math.PI/2);head.rotation.z=.13*Math.sin(t*10);arms[0].upper.rotation.z=-.1-.9*p;arms[0].lower.rotation.z=-.2-.55*p;arms[1].upper.rotation.z=.1+.82*p;arms[1].lower.rotation.z=.1+.5*p;legs[0].upper.rotation.z=.09*Math.sin(t*8);legs[1].upper.rotation.z=-.09*Math.sin(t*8);puppet.position.y=.1+.12*Math.sin(t*9)*(1-t);puppet.rotation.z=.04*Math.sin(t*11);bar.rotation.z=.02+.09*Math.sin(t*13)*(1-t);if(t<1)requestAnimationFrame(act)}requestAnimationFrame(act);setTimeout(()=>status.textContent='ITS GLASS EYES ARE FOLLOWING YOU',2600);setTimeout(()=>{busy=false;trigger.disabled=false;status.textContent='PREVIEW COMPLETE · 3D SCENE · SYNTHESIZED SOUND'},5600)};
})();</script></body></html>
