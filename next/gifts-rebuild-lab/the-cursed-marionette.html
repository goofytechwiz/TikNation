<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090c"><title>The Cursed Marionette · TikNation Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090c;color:#eee;font-family:Arial,sans-serif}.stage{position:relative;width:100%;height:100%;background:#09090c}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 14px calc(14px + env(safe-area-inset-bottom));text-align:center}.eyebrow{font-size:10px;letter-spacing:.32em;color:#c4a77c;text-shadow:0 2px 8px #000}.controls{display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;justify-content:center}button{background:linear-gradient(#403027,#171316);border:1px solid #a88a63;color:#f5e8d1;padding:13px 18px;font-size:11px;font-weight:bold;letter-spacing:.15em;cursor:pointer;min-width:132px}.status,.hint{font-size:10px;letter-spacing:.12em;color:#d0c1aa;text-shadow:0 2px 6px #000;margin-top:9px}
</style></head><body><main class="stage"><canvas id="scene"></canvas><div class="hud"><div class="eyebrow">TIKNATION · GIFT REBUILD LAB</div><div><div class="hint">THE PUPPET IS ALREADY MOVING · DRAG TO LOOK</div><div class="controls"><button id="trigger">TRIGGER GIFT</button><button id="sound">SOUND: OFF</button></div><div class="status" id="status">A FIGURE WAITS BEHIND THE CURTAIN</div></div></div></main>
<script>
(()=>{const c=document.getElementById('scene'),ctx=c.getContext('2d'),status=document.getElementById('status'),trigger=document.getElementById('trigger'),sound=document.getElementById('sound');let W=0,H=0,dpr=1,audio=null,audioOn=false,busy=false,started=performance.now(),look=0,drag=false,lastX=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
c.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){look=Math.max(-.25,Math.min(.25,look+(e.clientX-lastX)*.001));lastX=e.clientX}});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
function grad(x,y,r,stops){const g=ctx.createRadialGradient(x-r*.2,y-r*.3,2,x,y,r);for(const [p,col] of stops)g.addColorStop(p,col);return g}
function line(x1,y1,x2,y2,w,color){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=w;ctx.lineCap='round';ctx.strokeStyle=color;ctx.stroke()}
function ellipse(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.stroke()}}
function limb(x,y,len,angle,width,wood){const ex=x+Math.sin(angle)*len,ey=y+Math.cos(angle)*len;line(x+2,y+2,ex+2,ey+2,width+4,'#080708');line(x,y,ex,ey,width,wood);ellipse(ex,ey,width*.72,width*.72,grad(ex,ey,width,[ [0,'#c2a17b'],[.55,'#76563e'],[1,'#241815'] ]),'#241713');return [ex,ey]}
function draw(t){const s=Math.min(W/900,H/650),cx=W/2+look*W*.45,base=H*.78;ctx.clearRect(0,0,W,H);ctx.save();ctx.scale(s,s);const w=W/s,h=H/s,ox=(w-900)/2,oy=(h-650)/2;ctx.translate(ox,oy);
const bg=ctx.createLinearGradient(0,0,0,650);bg.addColorStop(0,'#161519');bg.addColorStop(.48,'#3b2b27');bg.addColorStop(1,'#08090c');ctx.fillStyle=bg;ctx.fillRect(0,0,900,650);
const glow=ctx.createRadialGradient(450,180,10,450,260,390);glow.addColorStop(0,'#b59a7540');glow.addColorStop(1,'#00000000');ctx.fillStyle=glow;ctx.fillRect(0,0,900,650);
// paneled rear wall
ctx.fillStyle='#291e1b';ctx.fillRect(65,70,770,430);for(let x=80;x<840;x+=95){ctx.fillStyle='#120f10';ctx.fillRect(x,85,5,390);ctx.strokeStyle='#80664b66';ctx.lineWidth=2;ctx.strokeRect(x+8,100,78,340)}
// curtains and valance
for(let side=0;side<2;side++){const x=side?770:0;const g=ctx.createLinearGradient(x,0,x+130,0);g.addColorStop(0,'#09070a');g.addColorStop(.5,'#551a22');g.addColorStop(1,'#16090d');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+130,0);ctx.lineTo(x+95,510);ctx.lineTo(x+20,510);ctx.closePath();ctx.fill();for(let j=0;j<5;j++)line(x+j*23+15,0,x+j*18+18,500,5,'#12080b88')}
ctx.fillStyle='#45151d';ctx.fillRect(0,0,900,42);
// stage light beam
ctx.save();ctx.globalAlpha=.2;ctx.fillStyle='#e9d2a8';ctx.beginPath();ctx.moveTo(390,0);ctx.lineTo(510,0);ctx.lineTo(730,540);ctx.lineTo(170,540);ctx.closePath();ctx.fill();ctx.restore();
// floorboards
ctx.fillStyle='#211714';ctx.fillRect(0,500,900,150);for(let x=0;x<900;x+=95)line(x,505,x-30,650,3,'#5a4030');
// chair
ctx.fillStyle='#171012';ctx.fillRect(345,330,210,170);ctx.fillStyle='#50262a';ctx.fillRect(365,350,170,125);ctx.strokeStyle='#9b7651';ctx.lineWidth=9;ctx.strokeRect(345,330,210,170);ctx.fillStyle='#3b281e';ctx.fillRect(325,475,250,28);for(const x of [345,555]){ctx.fillRect(x,495,15,85);ellipse(x+7,330,12,18,'#8b6746')}
// puppet coordinates and animation
const idle=t*.001,phase=busy?Math.min(1,(t-started)/5100):0,sw=busy?Math.sin(phase*19)*.14:Math.sin(idle*1.5)*.025,turn=busy?Math.sin(phase*8)*.55:Math.sin(idle*.7)*.08;const px=450+Math.sin(idle*.8)*3,py=busy?Math.sin(phase*19)*8:Math.sin(idle*1.3)*2;
// strings and crossbar
ctx.save();ctx.translate(px,py);ctx.rotate(busy?Math.sin(phase*14)*.04:Math.sin(idle)*.006);line(-92,82,92,82,12,'#503923');line(-92,82,92,82,5,'#a18057');const headX=turn*18;
const anchors=[[-75,85,-45,245],[-28,85,headX,150],[28,85,45,245],[75,85,75,430]];for(const [x1,y1,x2,y2] of anchors){line(x1,y1,x2,y2,1.5,'#c9b38b99')}
// body
ellipse(0,325,58,93,grad(0,325,95,[[0,'#80604b'],[.5,'#39262b'],[1,'#100e11']]),'#1a1113');ctx.fillStyle='#1c1519';ctx.beginPath();ctx.moveTo(-45,255);ctx.lineTo(45,255);ctx.lineTo(62,390);ctx.lineTo(-62,390);ctx.closePath();ctx.fill();line(0,270,0,375,3,'#b18d61');
// head pivot
ctx.save();ctx.translate(headX,200);ctx.rotate(turn*.42);ellipse(0,0,48,57,grad(0,0,62,[[0,'#e0c9a4'],[.5,'#9b8064'],[1,'#423128']]),'#30221b');ellipse(0,-39,52,27,'#201719');for(const x of [-19,19]){ellipse(x,5,10,7,'#09090b');ellipse(x,5,3,3,'#d9c9a5')}line(-7,27,7,27,3,'#3a2520');line(-24,-18,-12,-30,2,'#57402f');line(10,18,22,30,2,'#57402f');ctx.restore();
// arms with clearly articulated motion
const leftA=busy?-.9*Math.sin(phase*Math.PI/2):Math.sin(idle*1.1)*.06,rightA=busy?.85*Math.sin(phase*Math.PI/2):-Math.sin(idle*1.1)*.06;
const l=limb(-48,275,85,leftA,.20*35,'#a48665'),r=limb(48,275,85,-rightA,.20*35,'#987957');limb(l[0],l[1],67,leftA-.25,.13*35,'#76583f');limb(r[0],r[1],67,-rightA+.25,.13*35,'#76583f');
// legs
const legSwing=busy?Math.sin(phase*15)*.18:Math.sin(idle*1.2)*.025;const ll=limb(-24,405,91,legSwing,.34*27,'#503a36'),rr=limb(24,405,91,-legSwing,.34*27,'#503a36');limb(ll[0],ll[1],62,-legSwing*.5,.22*27,'#74553d');limb(rr[0],rr[1],62,legSwing*.5,.22*27,'#74553d');ctx.restore();
// vignette
const v=ctx.createRadialGradient(450,310,180,450,310,550);v.addColorStop(0,'#00000000');v.addColorStop(1,'#000000b8');ctx.fillStyle=v;ctx.fillRect(0,0,900,650);
ctx.restore();requestAnimationFrame(draw)}
function creak(freq,delay,dur,vol){if(!audioOn||!audio)return;const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(freq,audio.currentTime+delay);o.frequency.exponentialRampToValueAtTime(freq*.6,audio.currentTime+delay+dur);f.type='lowpass';f.frequency.value=380;g.gain.setValueAtTime(.0001,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(vol,audio.currentTime+delay+.12);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+delay+dur);o.connect(f);f.connect(g);g.connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+dur+.04)}
sound.onclick=async()=>{audioOn=!audioOn;if(audioOn){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){audioOn=false;status.textContent='AUDIO NOT SUPPORTED'}else{audio=audio||new AC();if(audio.state==='suspended')await audio.resume();creak(130,0,.25,.025)}}sound.textContent='SOUND: '+(audioOn?'ON':'OFF')};
trigger.onclick=()=>{if(busy)return;busy=true;started=performance.now();status.textContent='THE STRINGS SNAP TAUT…';if(audioOn){if(audio.state==='suspended')audio.resume();creak(82,0,2,.07);creak(190,1.1,.8,.04);creak(125,2.3,1.2,.07);creak(68,3.8,1.4,.08)}setTimeout(()=>status.textContent='IT TURNS ITS HEAD TOWARD YOU',2100);setTimeout(()=>{busy=false;status.textContent='PREVIEW COMPLETE · LIVE ANIMATION · SYNTH SOUND'},5300)};
requestAnimationFrame(draw);
})();</script></body></html>
