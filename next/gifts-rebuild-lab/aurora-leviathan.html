<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurora Leviathan · TikNation Gift Lab</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030814;color:#effaff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}body{overflow-x:hidden}.wrap{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 38%,#102b4b 0,#071326 42%,#020611 100%)}header{padding:18px 20px 8px;text-align:center;position:relative;z-index:2}header small{letter-spacing:.28em;color:#83eaff;font-size:10px;font-weight:800}h1{font-size:clamp(26px,6vw,44px);letter-spacing:.09em;margin:8px 0 4px;text-shadow:0 0 24px #36cfff88}.sub{font-size:13px;color:#a8c9dc}.stage{width:100%;height:min(66svh,650px);min-height:360px;position:relative;touch-action:pan-y}.stage canvas{display:block;width:100%;height:100%;outline:none}.overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding:24px;text-align:center;background:linear-gradient(180deg,transparent 62%,#020611aa)}.message{font-size:clamp(12px,2.7vw,16px);letter-spacing:.22em;font-weight:800;color:#d9faff;text-shadow:0 0 18px #35dfff}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 16px 24px;position:relative;z-index:2}button{border:1px solid #4fcdf888;border-radius:999px;background:linear-gradient(135deg,#123d5b,#101b3b);color:#eafaff;padding:12px 20px;font-weight:750;letter-spacing:.04em;box-shadow:0 0 22px #1aa9e522;cursor:pointer}button:active{transform:scale(.97)}.note{text-align:center;color:#7394a9;font-size:11px;padding:0 20px 22px}.glow{position:absolute;width:48vw;height:48vw;max-width:520px;max-height:520px;left:50%;top:48%;transform:translate(-50%,-50%);border-radius:50%;background:#1bbde91a;filter:blur(50px);pointer-events:none}
</style>
</head>
<body><main class="wrap"><header><small>TIKNATION · GIFT PREVIEW</small><h1>AURORA LEVIATHAN</h1><div class="sub">A legendary visitor from the northern lights</div></header>
<section class="stage" id="stage"><div class="glow"></div><div class="overlay"><div class="message" id="message">A LIGHT STIRS BENEATH THE STARS</div></div></section>
<div class="controls"><button id="replay">↻ Replay gift</button><button id="sound">♫ Sound: Off</button></div><div class="note">Interactive 3D preview · Drag to look around · Turn sound on for whale calls, ocean rush and aurora chimes</div></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const stage=document.querySelector('#stage'), msg=document.querySelector('#message');
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x061225,.035);
const camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,2.3,11.8);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9cecff,0x061026,2.1));
const key=new THREE.DirectionalLight(0xb5efff,3.1);key.position.set(3,7,6);scene.add(key);
const rim=new THREE.PointLight(0x26d9ff,35,18);rim.position.set(-4,1,-3);scene.add(rim);
const violet=new THREE.PointLight(0x9b71ff,18,14);violet.position.set(4,-2,-2);scene.add(violet);
const whale=new THREE.Group();scene.add(whale);
const blue=new THREE.MeshStandardMaterial({color:0x286b91,roughness:.36,metalness:.12});
const belly=new THREE.MeshStandardMaterial({color:0xb9dce0,roughness:.72});
const dark=new THREE.MeshStandardMaterial({color:0x092b43,roughness:.42});
const glowMat=new THREE.MeshBasicMaterial({color:0x69eaff});
function bodyMesh(){
 const rings=[[-3.25,.12,.15],[-2.8,.48,.42],[-2.1,.78,.67],[-1.1,1.02,.82],[0,1.13,.88],[1.1,1.02,.82],[2,.78,.68],[2.65,.52,.5],[3.05,.25,.28],[3.18,.06,.08]];
 const verts=[],inds=[],uv=[];const seg=48;
 rings.forEach((r,i)=>{for(let j=0;j<=seg;j++){const a=j/seg*Math.PI*2;const y=Math.cos(a)*r[1],z=Math.sin(a)*r[2];verts.push(r[0],y,z);uv.push(i/(rings.length-1),j/seg)}});
 for(let i=0;i<rings.length-1;i++)for(let j=0;j<seg;j++){let a=i*(seg+1)+j,b=a+seg+1;inds.push(a,b,a+1,b,b+1,a+1)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(inds);g.computeVertexNormals();return new THREE.Mesh(g,blue);
}
whale.add(bodyMesh());
const under=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),belly);under.scale.set(2.35,.43,.69);under.position.set(.05,-.72,0);whale.add(under);
function fin(points,mat){const s=new THREE.Shape();s.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)s.lineTo(points[i][0],points[i][1]);s.closePath();const g=new THREE.ShapeGeometry(s,16);const m=new THREE.Mesh(g,mat);return m}
const fins=new THREE.Group();whale.add(fins);
const pectoral=fin([[.9,-.45],[2.25,-.9],[1.2,-1.38],[.45,-.82]],dark);pectoral.rotation.x=Math.PI/2;pectoral.position.set(0,-.1,.48);fins.add(pectoral);
const pectoral2=pectoral.clone();pectoral2.position.z=-.48;pectoral2.rotation.x=-Math.PI/2;fins.add(pectoral2);
const tail=new THREE.Group();tail.position.x=-3.05;whale.add(tail);
const lobe=fin([[0,0],[-.65,.18],[-1.55,.72],[-1.18,.05],[-.55,-.13]],blue);lobe.position.z=.04;tail.add(lobe);
const lobe2=fin([[0,0],[-.65,.18],[-1.55,.72],[-1.18,.05],[-.55,-.13]],blue);lobe2.scale.y=-1;lobe2.position.z=-.04;tail.add(lobe2);
const dorsal=fin([[-.65,0],[-.15,.05],[.1,.6],[-.05,.68],[-.28,.25]],dark);dorsal.position.set(-.6,.95,0);whale.add(dorsal);
const eyeGeo=new THREE.SphereGeometry(.075,16,12);for(const z of [-.78,.78]){const e=new THREE.Mesh(eyeGeo,new THREE.MeshBasicMaterial({color:0x020b15}));e.position.set(2.5,.18,z);whale.add(e);const shine=new THREE.Mesh(new THREE.SphereGeometry(.022,8,8),glowMat);shine.position.set(2.52,.21,z*1.02);whale.add(shine)}
// Subtle baleen grooves and throat pleats
for(let i=0;i<8;i++){const curve=new THREE.Mesh(new THREE.TorusGeometry(.48+i*.055,.012,5,48,Math.PI),new THREE.MeshBasicMaterial({color:0x6dabb8,transparent:true,opacity:.35}));curve.position.set(1.55-i*.13,-.55,.05);curve.rotation.y=Math.PI/2;curve.rotation.z=.1;whale.add(curve)}
// flowing luminous water ribbons
const ribbons=[];for(let k=0;k<3;k++){const pts=[];for(let i=0;i<=80;i++){const t=i/80*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(t)*(3.2+k*.34),Math.sin(t)*(.85+k*.22)+.1,Math.sin(t*2+k)*.55))}const curve=new THREE.CatmullRomCurve3(pts);const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,160,.018+k*.006,8,false),new THREE.MeshBasicMaterial({color:[0x42eaff,0x9c8aff,0x67cfff][k],transparent:true,opacity:.55}));scene.add(mesh);ribbons.push(mesh)}
// star field
const starGeo=new THREE.BufferGeometry(),starPos=[];for(let i=0;i<950;i++)starPos.push((Math.random()-.5)*30,(Math.random()-.5)*16,-3-Math.random()*24);starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xc9f6ff,size:.035,transparent:true,opacity:.8}));scene.add(stars);
const aurora=[];for(let j=0;j<4;j++){const pts=[];for(let i=0;i<=100;i++){const x=-12+i*.24;pts.push(new THREE.Vector3(x,3.4+j*.38+Math.sin(i*.12+j)*.48,-5-j*.3))}const line=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),180,.035,8,false),new THREE.MeshBasicMaterial({color:j%2?0x8c78ff:0x4ae7d9,transparent:true,opacity:.3}));scene.add(line);aurora.push(line)}
const particles=new THREE.Group();scene.add(particles);for(let i=0;i<90;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.025+Math.random()*.035,8,8),new THREE.MeshBasicMaterial({color:i%3?0x7deeff:0xc3aaff,transparent:true,opacity:.8}));m.position.set((Math.random()-.5)*12,(Math.random()-.5)*7,(Math.random()-.5)*5);particles.add(m)}
let start=performance.now(),soundOn=false,audio=null,drag=false,lastX=0,lastY=0,targetX=0,targetY=0,lastCue=-1;\nconst cueTimes=[.35,2.1,6.7,9.7,11.2];
function replay(){start=performance.now();lastCue=0;msg.textContent='A LIGHT STIRS BENEATH THE STARS';whale.position.set(-.5,-.1,0);whale.scale.setScalar(.78);if(soundOn)playCue(0)}
document.querySelector('#replay').addEventListener('click',replay);
document.querySelector('#sound').addEventListener('click',()=>{soundOn=!soundOn;document.querySelector('#sound').textContent='♫ Sound: '+(soundOn?'On':'Off');if(soundOn){audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();tone(220,.45)}});
function tone(freq,dur){if(!soundOn||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.45,audio.currentTime+dur);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.045,audio.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
stage.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;targetY+=(e.clientX-lastX)*.006;targetX+=(e.clientY-lastY)*.004;lastX=e.clientX;lastY=e.clientY});stage.addEventListener('pointerup',()=>drag=false);stage.addEventListener('pointercancel',()=>drag=false);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
function animate(now){requestAnimationFrame(animate);const t=(now-start)/1000;for(let i=0;i<cueTimes.length;i++){if(t>=cueTimes[i]&&lastCue<i){lastCue=i;playCue(i)}}const rise=Math.min(1,t/2.2),dive=Math.max(0,Math.min(1,(t-8)/3));whale.position.x=-.45+Math.min(1,t/3)*.45-dive*1.4;whale.position.y=Math.sin(t*1.25)*.16+Math.sin(t*.38)*.16;whale.position.z=Math.sin(t*.7)*.2;whale.scale.setScalar(.78+rise*.22-dive*.2);whale.rotation.y=Math.sin(t*.5)*.08+targetY;whale.rotation.x=Math.sin(t*.65)*.035+targetX;tail.rotation.z=Math.sin(t*2.2)*.22;fins.rotation.x=Math.sin(t*1.3)*.06;ribbons.forEach((r,i)=>{r.rotation.y=t*.16*(i%2?1:-1);r.rotation.z=Math.sin(t*.5+i)*.12});particles.rotation.y=t*.035;stars.rotation.z=t*.002;aurora.forEach((a,i)=>a.position.y=Math.sin(t*.4+i)*.12);if(t>1.8&&t<7)msg.textContent='THE AURORA LEVIATHAN EMERGES';else if(t>=7&&t<10)msg.textContent='A RIVER OF LIGHT FOLLOWS ITS PASSAGE';else if(t>=10)msg.textContent='TIKNATION · A GIFT FROM THE DEEP';renderer.render(scene,camera)}requestAnimationFrame(animate);
</script></body></html>
