play.addEventListener('click',()=>{p.classList.remove('play');void p.offsetWidth;p.classList.add('play');status.textContent='The queen sends her crimson kiss…';setTimeout(()=>{p.classList.remove('play');status.textContent='The kiss has faded. Play again?';},6200);if(on){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();tone(58,0,2.8,.06);tone(220,1.3,.7,.025,'triangle');tone(660,2.1,.5,.02);tone(92,3.2,1.1,.06,'sawtooth')}});
sound.addEventListener('click',()=>{on=!on;sound.textContent=on?'♫ SOUND: ON':'♫ SOUND: OFF';sound.setAttribute('aria-pressed',String(on));if(on){ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();status.textContent='Sound enabled. Tap play for the full effect.'}else if(ctx){ctx.suspend();status.textContent='Sound off. Visual preview remains available.'}});
</script></body></html>
