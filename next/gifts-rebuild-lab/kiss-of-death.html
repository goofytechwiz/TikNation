<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10060d">
<title>TikNation · The Kiss of Death</title>
<style>
:root{color-scheme:dark;--red:#ff3158;--pink:#ff7898;--ink:#09060c;--gold:#d9a56c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 42%,#42101f 0,#1b0914 35%,#09060c 75%)}
.scene{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:28px 16px 44px;isolation:isolate}
.scene:before,.scene:after{content:"";position:absolute;inset:-20%;pointer-events:none;z-index:-1;background:conic-gradient(from 0deg at 50% 50%,transparent 0 20%,#8b102b22 28%,transparent 38% 60%,#ff315822 70%,transparent 80%);animation:turn 34s linear infinite}
.scene:after{filter:blur(45px);opacity:.65;animation-direction:reverse}
@keyframes turn{to{transform:rotate(360deg)}}
.eyebrow{font-size:.7rem;letter-spacing:.25em;color:#ff9aad;font-weight:800;text-align:center}.title{text-align:center;font-size:clamp(2.5rem,9vw,6rem);line-height:.9;letter-spacing:-.06em;margin:12px 0 8px;text-shadow:0 0 25px #ff315866}.title span{color:#ff5477}.sub{text-align:center;color:#d6b9c2;max-width:560px;margin:0 auto 22px}
.stage{position:relative;width:min(100%,780px);height:min(58vh,510px);min-height:340px;border:1px solid #a83a584d;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 50% 72%,#7e1835 0,transparent 35%),linear-gradient(180deg,#170b16,#09070d 80%);box-shadow:0 25px 90px #000a,inset 0 0 65px #ff315812}
.moon{position:absolute;width:170px;height:170px;border-radius:50%;top:35px;left:50%;transform:translateX(-50%);background:radial-gradient(circle at 38% 35%,#ffe1e4,#f58ba0 42%,#a51e43 72%,#4a0b21);box-shadow:0 0 45px #ff315866,0 0 110px #ff315833;opacity:.72}
.haze{position:absolute;inset:auto -10% 0;height:55%;background:radial-gradient(ellipse at 50% 100%,#c3264b55,transparent 65%);filter:blur(22px);animation:haze 6s ease-in-out infinite alternate}@keyframes haze{to{transform:translateX(5%) scale(1.12);opacity:.6}}
.queen{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:240px;height:82%;filter:drop-shadow(0 0 22px #e62a5544)}
.crown{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:94px;height:65px;background:linear-gradient(135deg,#2a101c,#0b080e 55%,#8f2441);clip-path:polygon(0 100%,8% 15%,30% 62%,48% 0,68% 62%,92% 12%,100% 100%);border:1px solid #d68a9a}
.head{position:absolute;top:17%;left:50%;transform:translateX(-50%);width:78px;height:108px;border-radius:48% 48% 44% 44%;background:linear-gradient(100deg,#160d15,#6e3543 48%,#1b0b14);box-shadow:inset 8px 0 14px #0008}
.hair{position:absolute;top:13%;left:50%;transform:translateX(-50%);width:140px;height:220px;border-radius:48% 48% 30% 30%;background:linear-gradient(90deg,#050408,#21101b 35%,#08060b 72%);clip-path:polygon(18% 0,82% 0,100% 100%,72% 76%,50% 100%,26% 75%,0 100%)}
.eye{position:absolute;top:48%;width:19px;height:4px;background:#ff4168;box-shadow:0 0 12px #ff3158;z-index:2}.eye.left{left:28%}.eye.right{right:28%}
.body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:230px;height:62%;background:linear-gradient(90deg,#07060b,#2a0d1a 40%,#100811 68%,#050408);clip-path:polygon(42% 0,58% 0,69% 14%,100% 100%,0 100%,31% 14%);border-top:2px solid #9e294a}
.rose{position:absolute;z-index:4;left:calc(50% + 65px);top:56%;font-size:52px;filter:drop-shadow(0 0 15px #ff3158);transform:rotate(-18deg);animation:rose 3s ease-in-out infinite}@keyframes rose{50%{transform:translateY(-10px) rotate(-8deg)}}
.petal{position:absolute;left:50%;top:52%;width:14px;height:23px;border-radius:80% 10% 80% 10%;background:linear-gradient(135deg,#ff8299,#7d0b2d);box-shadow:0 0 12px #ff315866;opacity:0;animation:fall 7s linear infinite}
.petal:nth-child(2){--x:-220px;animation-delay:-1s}.petal:nth-child(3){--x:190px;animation-delay:-3s}.petal:nth-child(4){--x:-130px;animation-delay:-5s}.petal:nth-child(5){--x:250px;animation-delay:-2s}.petal:nth-child(6){--x:80px;animation-delay:-4s}
@keyframes fall{0%{opacity:0;transform:translate(0,-70px) rotate(0)}12%{opacity:.9}100%{opacity:0;transform:translate(var(--x,140px),300px) rotate(540deg)}}
.kiss{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.1);font-size:clamp(4rem,14vw,8rem);opacity:0;filter:drop-shadow(0 0 25px #ff3158)}
.stage.play .kiss{animation:kiss 3.4s ease-out 1.4s both}@keyframes kiss{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}65%{opacity:1;transform:translate(-50%,-50%) scale(1.7)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.3)}}
.burst{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,#ff426655,transparent 55%)}.stage.play .burst{animation:burst 3s ease-out 3.3s both}@keyframes burst{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(2.5)}}
.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px auto 0}.btn{border:1px solid #ff6683;background:linear-gradient(135deg,#b51c43,#4b1027);color:white;border-radius:999px;padding:13px 22px;font:700 .9rem system-ui;cursor:pointer;box-shadow:0 8px 28px #8b153744}.btn.secondary{background:#1a111a;border-color:#704052;color:#f6dce3}.note{text-align:center;color:#a995a0;font-size:.78rem;margin:14px auto 0}.back{position:absolute;top:18px;left:18px;color:#f5c4d0;text-decoration:none;font-size:.85rem}
@media(max-width:480px){.stage{min-height:330px;height:48vh}.queen{transform:translateX(-50%) scale(.86);transform-origin:bottom center}.moon{width:135px;height:135px}.rose{left:calc(50% + 48px);font-size:42px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="scene">
<a class="back" href="../gifts/">← Gift Gallery</a>
<div style="width:min(100%,820px)">
<div class="eyebrow">TIKNATION LIVE · DARK &amp; MYSTERY</div>
<h1 class="title">THE KISS <span>OF DEATH</span></h1>
<p class="sub">One rose. One kiss. A beautiful omen you won't forget.</p>
<section class="stage" id="stage" aria-label="Animated dark queen and crimson rose gift preview">
<div class="moon"></div><div class="haze"></div>
<div class="queen"><div class="hair"></div><div class="crown"></div><div class="head"></div><i class="eye left"></i><i class="eye right"></i><div class="body"></div></div>
<div class="rose" aria-hidden="true">🌹</div>
<div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="kiss" aria-hidden="true">💋</div><div class="burst"></div>
</section>
<div class="controls"><button class="btn" id="play" type="button">▶ PLAY THE EXPERIENCE</button><button class="btn secondary" id="sound" type="button" aria-pressed="false">♫ SOUND: OFF</button></div>
<p class="note" id="status" aria-live="polite">Preview experience · Tap play to release the crimson kiss.</p>
<p class="note">Concept preview only. This does not send a gift, charge coins, or connect to the live wallet.</p>
</div></main>
<script>
const stage=document.getElementById('stage'),play=document.getElementById('play'),sound=document.getElementById('sound'),status=document.getElementById('status');let audio=null,enabled=false;
function tone(freq,duration,when,volume=.035,type='sine'){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime+when);g.gain.setValueAtTime(.0001,audio.currentTime+when);g.gain.exponentialRampToValueAtTime(volume,audio.currentTime+when+.06);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+when+duration);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+when);o.stop(audio.currentTime+when+duration+.03)}
play.addEventListener('click',()=>{stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play');status.textContent='The queen sends her crimson kiss…';setTimeout(()=>{stage.classList.remove('play');status.textContent='The kiss has faded. Play again?';},6900);if(enabled){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();tone(58,2.8,0,.06,'sine');tone(220,.7,1.2,.025,'triangle');tone(660,.5,2.1,.02,'sine');tone(92,1.1,3.3,.07,'sawtooth');}});
sound.addEventListener('click',()=>{enabled=!enabled;sound.textContent=enabled?'♫ SOUND: ON':'♫ SOUND: OFF';sound.setAttribute('aria-pressed',String(enabled));if(enabled){audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();status.textContent='Sound enabled. Tap play for the full effect.'}else{if(audio)audio.suspend();status.textContent='Sound off. The visual preview is still available.'}});
</script></body></html>
