<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THE MIRROR ROOM · TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050609;color:#e8edf0;font-family:system-ui,sans-serif}.app{height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#20252b,#050609 75%)}header{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#aebbc3;font-size:10px;letter-spacing:.17em}header b{color:#d9e5e9;font-weight:600}.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#090c10}canvas{display:block;width:100%;height:100%}.caption{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#d4e0e4;font-size:10px;letter-spacing:.2em;text-shadow:0 2px 8px #000;padding:0 12px;pointer-events:none}.flash{position:absolute;inset:0;background:#eaf4fa;opacity:0;pointer-events:none}.controls{flex:none;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px;background:#080b0e;border-top:1px solid #27313a}button{border:1px solid #9aabb4;background:linear-gradient(#35434b,#12191e);color:#f2f6f7;padding:12px 18px;border-radius:4px;font-weight:700;font-size:11px;letter-spacing:.13em}button.secondary{background:#13191d;border-color:#52616a;color:#c2cdd2}button:disabled{opacity:.5}.note{width:100%;text-align:center;color:#76858e;font-size:9px;letter-spacing:.08em}.shake{animation:shake .09s infinite}@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(3px,-2px)}50%{transform:translate(-2px,2px)}75%{transform:translate(1px,2px)}100%{transform:translate(0,0)}}@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style></head><body><main class="app"><header><span>TIKNATION · GIFT REBUILD LAB</span><b>THE MIRROR ROOM</b></header><section class="stage" id="stage"><canvas id="cv" aria-label="A dark mirrored chamber with distorted reflections"></canvas><div class="flash" id="flash"></div><div class="caption" id="caption">DON'T TRUST YOUR REFLECTION</div></section><section class="controls"><button id="trigger">▶ ENTER THE MIRROR ROOM</button><button class="secondary" id="reset">RESET</button><div class="note">STANDALONE PREVIEW · SOUND STARTS AFTER TAP · NOT CONNECTED TO LIVE GIFT CATALOG</div></section></main>
<script>
(()=>{const cv=document.getElementById('cv'),c=cv.getContext('2d'),stage=document.getElementById('stage'),caption=document.getElementById('caption'),flash=document.getElementById('flash'),trigger=document.getElementById('trigger');let W=0,H=0,D=1,tick=0,mode=0,crack=0,burst=0,glitch=0,shake=0,ctx=null,active=false,timers=[],raf=0,shards=[];
function resize(){D=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0)}new ResizeObserver(resize).observe(stage);resize();
function path(points,fill,stroke,line=1){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=line;c.stroke()}}
function glow(x,y,r,col){let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r)}
function mirror(x,y,w,h,side,t){let g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#111a20');g.addColorStop(.25,'#73818a');g.addColorStop(.48,'#172129');g.addColorStop(.72,'#9aa8ad');g.addColorStop(1,'#10171c');c.fillStyle=g;c.fillRect(x,y,w,h);c.strokeStyle='#b1bfc1';c.lineWidth=5;c.strokeRect(x,y,w,h);c.strokeStyle='#303d43';c.lineWidth=2;c.strokeRect(x+7,y+7,w-14,h-14);c.save();c.beginPath();c.rect(x+9,y+9,w-18,h-18);c.clip();let sx=x+w*.5,sy=y+h*.55;glow(sx,sy,w*.7,'rgba(170,210,220,.12)');if(mode>=1){let lag=side===0?Math.sin(t*.8)*w*.05:Math.cos(t*.7)*w*.05;let px=sx+lag,py=sy+h*.08; c.fillStyle='rgba(2,4,6,.92)';c.beginPath();c.ellipse(px,py-h*.2,w*.105,h*.12,0,0,Math.PI*2);c.fill();path([[px-w*.12,py-h*.1],[px+w*.12,py-h*.1],[px+w*.2,py+h*.32],[px-w*.2,py+h*.32]],'rgba(3,5,7,.94)');if(mode>=2){c.fillStyle='rgba(220,236,239,.8)';c.beginPath();c.arc(px-w*.035,py-h*.21,2.2,0,Math.PI*2);c.arc(px+w*.04,py-h*.21,2.2,0,Math.PI*2);c.fill()}}if(glitch>0&&Math.random()<glitch){c.fillStyle='rgba(205,230,238,.35)';c.fillRect(x+Math.random()*w,y+Math.random()*h,w*.3,2+Math.random()*5)}c.restore();if(crack>0){c.save();c.translate(sx,sy);c.strokeStyle='rgba(220,235,238,'+Math.min(.95,crack)+')';c.lineWidth=1.4;for(let k=0;k<7;k++){let a=k*Math.PI*2/7+side*.17;c.beginPath();c.moveTo(0,0);let r=Math.max(w,h)*.8;c.lineTo(Math.cos(a)*r*.35,Math.sin(a)*r*.35);c.lineTo(Math.cos(a+.12)*r*.55,Math.sin(a+.12)*r*.55);c.lineTo(Math.cos(a-.05)*r*.8,Math.sin(a-.05)*r*.8);c.stroke()}c.restore()}}
function draw(t){if(!W||!H)return;tick=t/1000;let w=W,h=H;c.save();if(shake)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let bg=c.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#11181d');bg.addColorStop(.55,'#202a30');bg.addColorStop(1,'#05080b');c.fillStyle=bg;c.fillRect(0,0,w,h);
// perspective chamber
path([[0,0],[w,0],[w*.82,h*.76],[w*.18,h*.76]],'#10171c','#66747a',2);path([[0,h],[w,h],[w*.82,h*.76],[w*.18,h*.76]],'#171d21','#59656a',2);path([[0,0],[w*.18,h*.76],[w*.18,h],[0,h]],'#0b1014','#46545a',2);path([[w,0],[w*.82,h*.76],[w*.82,h],[w,h]],'#0b1014','#46545a',2);
let mw=w*.22,mh=h*.58,top=h*.12;mirror(w*.045,top,mw,mh,0,tick);mirror(w*.39,top*.8,w*.22,h*.62,1,tick);mirror(w*.735,top,mw,mh,2,tick);
// floor reflections
let floor=c.createLinearGradient(0,h*.72,0,h);floor.addColorStop(0,'#29343a');floor.addColorStop(1,'#080c10');path([[w*.18,h*.76],[w*.82,h*.76],[w,h],[0,h]],floor,'#7b898d',2);for(let i=0;i<10;i++){let y=h*.78+i*i*h*.002;c.strokeStyle='rgba(165,190,196,.18)';c.lineWidth=1;c.beginPath();c.moveTo(w*.18-i*w*.018,y);c.lineTo(w*.82+i*w*.018,y);c.stroke()}
// ceiling lights
for(let i=0;i<3;i++){let x=w*(.22+i*.28);glow(x,h*.08,w*.13,'rgba(183,218,225,'+(.12+Math.sin(tick*2+i)*.035)+')');c.fillStyle='#a9b8bd';c.fillRect(x-w*.045,h*.065,w*.09,4)}
// center silhouette/reflection, stays still while room shifts
if(mode>=1){let x=w*.5+Math.sin(tick*.6)*w*.006,y=h*.48;c.fillStyle='#030507';c.beginPath();c.ellipse(x,y-h*.12,w*.04,h*.055,0,0,Math.PI*2);c.fill();path([[x-w*.045,y-h*.07],[x+w*.045,y-h*.07],[x+w*.07,y+h*.16],[x-w*.07,y+h*.16]],'#030507')}
if(mode>=2){c.strokeStyle='rgba(220,239,242,.8)';c.lineWidth=1.5;for(let j=0;j<5;j++){let x=w*(.2+j*.15);c.beginPath();c.moveTo(x,h*.2);c.lineTo(x+(Math.random()-.5)*20,h*.7);c.stroke()}}
if(burst>0){for(let i=0;i<shards.length;i++){let s=shards[i];s.x+=s.vx;s.y+=s.vy;s.vy+=.14;s.rot+=s.vr;s.life-=.012;c.save();c.globalAlpha=Math.max(0,s.life);c.translate(s.x,s.y);c.rotate(s.rot);path([[0,-s.r],[s.r*.5,0],[0,s.r],[ -s.r*.35,0]],'rgba(193,222,230,.55)','#d7e9ed',1);c.restore()}shards=shards.filter(s=>s.life>0)}
let vign=c.createRadialGradient(w/2,h*.45,w*.12,w/2,h*.45,w*.75);vign.addColorStop(0,'transparent');vign.addColorStop(1,'rgba(0,0,0,.75)');c.fillStyle=vign;c.fillRect(0,0,w,h);c.restore();raf=requestAnimationFrame(draw)}
raf=requestAnimationFrame(draw);
function later(fn,ms){let id=setTimeout(fn,ms);timers.push(id)}
function tone(f,d,g,type='sine',end=f){if(!ctx)return;let o=ctx.createOscillator(),a=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(1,end),ctx.currentTime+d);a.gain.setValueAtTime(g,ctx.currentTime);a.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(a);a.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}
function noise(d,gain,cut=900){if(!ctx)return;let b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),v=b.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=Math.random()*2-1;let s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),a=ctx.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;a.gain.setValueAtTime(gain,ctx.currentTime);a.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);s.connect(f);f.connect(a);a.connect(ctx.destination);s.start();s.stop(ctx.currentTime+d)}
function reset(){timers.forEach(clearTimeout);timers=[];active=false;mode=0;crack=0;burst=0;glitch=0;shake=0;shards=[];flash.style.opacity=0;stage.classList.remove('shake');caption.textContent="DON'T TRUST YOUR REFLECTION";trigger.disabled=false}
function run(){if(active)return;active=true;trigger.disabled=true;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}caption.textContent='THE REFLECTION IS A LITTLE SLOW';tone(58,3,.2,'sine',40);noise(2,.08,180);later(()=>{mode=1;glitch=.2;caption.textContent='IT IS NOT FOLLOWING YOUR MOVEMENTS';tone(210,1.8,.12,'triangle',80)},2400);later(()=>{mode=2;glitch=.55;caption.textContent='SOMETHING IS STANDING BEHIND YOU';tone(420,.4,.1,'sine',170);noise(.5,.12,1500)},4800);later(()=>{crack=.65;caption.textContent='THE GLASS IS BREAKING';noise(1.2,.28,2300);tone(900,.7,.08,'sawtooth',160)},6800);later(()=>{crack=1;glitch=.8;caption.textContent='';noise(.5,.3,3000);tone(1200,.3,.1,'square',90)},8100);later(()=>{burst=1;shake=7;stage.classList.add('shake');flash.style.opacity=.85;noise(1.4,.45,4000);tone(42,1.5,.45,'sawtooth',24);shards=[];for(let i=0;i<95;i++)shards.push({x:W/2+(Math.random()-.5)*W*.7,y:H*.45+(Math.random()-.5)*H*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*12-2,rot:Math.random()*6,vr:(Math.random()-.5)*.3,r:3+Math.random()*15,life:1});},9000);later(()=>{flash.style.opacity=0;shake=0;stage.classList.remove('shake');caption.textContent='THE MIRRORS ARE GONE. THE REFLECTION IS STILL HERE.';tone(70,2,.16,'triangle',28)},10300);later(()=>{active=false;trigger.disabled=false},12800)}
trigger.addEventListener('click',run);document.getElementById('reset').addEventListener('click',reset);window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));
})();
</script></body></html>
