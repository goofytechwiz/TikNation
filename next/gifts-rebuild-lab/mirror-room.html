<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THE MIRROR ROOM · TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030507;color:#edf3f4;font-family:system-ui,sans-serif}.app{height:100svh;display:flex;flex-direction:column;background:#080c0f}header{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:#080c0f;color:#aebbc1;font-size:10px;letter-spacing:.16em}header b{color:#e4edef}.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#080d11}canvas{width:100%;height:100%;display:block}.caption{position:absolute;bottom:15px;left:10px;right:10px;text-align:center;font-size:10px;letter-spacing:.2em;color:#e8f0f2;text-shadow:0 2px 9px #000;pointer-events:none}.flash{position:absolute;inset:0;background:#e9f7ff;opacity:0;pointer-events:none}.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;padding:11px;background:#070a0d;border-top:1px solid #263239}button{border:1px solid #b2c1c5;background:linear-gradient(#59666b,#182126 48%,#0c1115);color:white;padding:12px 17px;border-radius:3px;font-weight:750;font-size:10px;letter-spacing:.14em}button.secondary{background:#11181d;border-color:#53636a;color:#c8d3d6}.note{width:100%;text-align:center;color:#77868c;font-size:9px;letter-spacing:.08em}.shake{animation:shake .075s infinite}@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(4px,-2px)}50%{transform:translate(-3px,3px)}75%{transform:translate(2px,2px)}100%{transform:translate(0,0)}}@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style></head><body><main class="app"><header><span>TIKNATION · GIFT REBUILD LAB</span><b>THE MIRROR ROOM</b></header><section class="stage" id="stage"><canvas id="cv"></canvas><div class="flash" id="flash"></div><div class="caption" id="caption">DON'T LOOK AWAY FROM THE GLASS</div></section><section class="controls"><button id="trigger">▶ TRIGGER THE MIRROR ROOM</button><button class="secondary" id="reset">RESET</button><div class="note">STANDALONE PREVIEW · SOUND STARTS AFTER TAP · NOT CONNECTED TO LIVE GIFT CATALOG</div></section></main>
<script>
(()=>{const cv=document.getElementById('cv'),c=cv.getContext('2d'),stage=document.getElementById('stage'),caption=document.getElementById('caption'),flash=document.getElementById('flash'),trigger=document.getElementById('trigger');let W=0,H=0,D=1,time=0,phase=0,crack=0,fracture=0,shake=0,ctx=null,playing=false,timers=[],raf=0,glass=[],dust=[];const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){D=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0);dust=Array.from({length:90},()=>({x:rand(0,W),y:rand(0,H),r:rand(.3,1.6),v:rand(.08,.35)}))}new ResizeObserver(resize).observe(stage);resize();
function gradient(x,y,w,h,stops){let g=c.createLinearGradient(x,y,x+w,y+h);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function glow(x,y,r,color){let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function poly(p,fill,stroke,width=1){c.beginPath();p.forEach((v,i)=>i?c.lineTo(v[0],v[1]):c.moveTo(v[0],v[1]));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function figure(x,y,s,offset,eyes){c.save();c.translate(x+offset,y);c.scale(s,s);c.fillStyle='rgba(0,0,0,.97)';c.shadowColor='#000';c.shadowBlur=16;c.beginPath();c.ellipse(0,-47,12,17,0,0,Math.PI*2);c.fill();poly([[-10,-34],[10,-34],[21,23],[13,62],[-14,62],[-21,23]],'#010203');poly([[-9,-31],[-20,-14],[-28,29],[-18,31],[-5,-4]],'#010203');poly([[9,-31],[20,-14],[28,29],[18,31],[5,-4]],'#010203');if(eyes){glow(-4,-49,8,'rgba(215,232,226,.22)');glow(4,-49,8,'rgba(215,232,226,.22)');c.fillStyle='#e6eee7';c.fillRect(-5,-50,2,2);c.fillRect(3,-50,2,2)}c.restore()}
function mirror(x,y,w,h,index){c.save();c.shadowColor='#000';c.shadowBlur=25;c.shadowOffsetY=10;c.fillStyle=gradient(x,y,w,h,[[0,'#090e11'],[.12,'#b4b5a9'],[.2,'#313b3f'],[.48,'#d0d0c4'],[.62,'#343d41'],[.9,'#9aa6a7'],[1,'#080d10']]);c.fillRect(x-7,y-7,w+14,h+14);c.restore();c.strokeStyle='#c3c5b8';c.lineWidth=2.5;c.strokeRect(x-4,y-4,w+8,h+8);c.strokeStyle='#657176';c.lineWidth=5;c.strokeRect(x,y,w,h);c.strokeStyle='rgba(238,241,228,.62)';c.lineWidth=1;c.strokeRect(x+5,y+5,w-10,h-10);
let gx=x+8,gy=y+8,gw=w-16,gh=h-16;c.save();c.beginPath();c.rect(gx,gy,gw,gh);c.clip();c.fillStyle=gradient(gx,gy,gw,gh,[[0,'#0b151b'],[.22,'#52636a'],[.38,'#18262d'],[.57,'#9ba9a7'],[.73,'#24343a'],[1,'#050b0f']]);c.fillRect(gx,gy,gw,gh);
for(let k=0;k<7;k++){let xx=gx+gw*(k/7)+Math.sin(time*.35+k)*gw*.018;c.fillStyle='rgba(218,232,229,'+(k%2?.035:.07)+')';c.beginPath();c.moveTo(xx,gy);c.lineTo(xx+gw*.09,gy);c.lineTo(xx+gw*.3,gy+gh);c.lineTo(xx+gw*.18,gy+gh);c.fill()}
let moving=phase>=1?Math.sin(time*.55+index*2.1)*gw*.1:0;let wrong=phase>=2?Math.sin(time*.3+index*3)*gw*.045:0;glow(gx+gw*.52,gy+gh*.35,gw*.65,'rgba(177,207,210,.12)');if(phase>=1){figure(gx+gw*.52,gy+gh*.68,.65+index*.06,moving+wrong,phase>=2)}else{c.fillStyle='rgba(205,221,220,.1)';c.fillRect(gx+gw*.15,gy+gh*.18,gw*.7,1)}
// smudges and tiny surface scratches
for(let k=0;k<12;k++){let xx=gx+((k*73+index*29)%97)/97*gw,yy=gy+((k*37+index*13)%91)/91*gh;c.strokeStyle='rgba(220,232,231,.08)';c.lineWidth=.6;c.beginPath();c.moveTo(xx,yy);c.lineTo(xx+rand(2,12),yy+rand(-2,3));c.stroke()}
if(phase>=2){c.fillStyle='rgba(4,8,10,.17)';c.fillRect(gx,gy,gw,gh);if(Math.sin(time*7+index)>-.65){c.fillStyle='rgba(216,232,232,.3)';c.fillRect(gx+gw*.1,gy+gh*.4,gw*.8,1)}}
c.restore();if(crack>0){c.save();c.translate(x+w*(.48+index*.015),y+h*.53);c.strokeStyle='rgba(231,245,245,'+crack+')';c.lineWidth=1;c.shadowColor='#eafaff';c.shadowBlur=6;for(let n=0;n<11;n++){let a=n*Math.PI*2/11+index*.2,r=Math.max(w,h)*.78;c.beginPath();c.moveTo(0,0);let px=0,py=0;for(let z=1;z<=5;z++){let rr=r*z/5,aa=a+(z%2?.09:-.06);px=Math.cos(aa)*rr;py=Math.sin(aa)*rr;c.lineTo(px,py)}c.stroke()}c.restore()}c.restore()}
function draw(ms){time=ms/1000;if(!W||!H){raf=requestAnimationFrame(draw);return}c.save();if(shake)c.translate(rand(-shake,shake),rand(-shake,shake));let bg=gradient(0,0,0,H,[[0,'#10191e'],[.5,'#172228'],[1,'#030608']]);c.fillStyle=bg;c.fillRect(0,0,W,H);
// deep corridor and tiled floor
poly([[0,0],[W,0],[W*.82,H*.75],[W*.18,H*.75]],'#10191e','#59686c',2);poly([[0,H],[W,H],[W*.82,H*.75],[W*.18,H*.75]],gradient(0,H*.75,0,H*.25,[[0,'#344248'],[1,'#080d10']]),'#78878a',1.5);poly([[0,0],[W*.18,H*.75],[W*.18,H],[0,H]],'#080e12','#435157',1);poly([[W,0],[W*.82,H*.75],[W*.82,H],[W,H]],'#080e12','#435157',1);
let sideW=W*.205,top=H*.105,mh=H*.59;mirror(W*.035,top,sideW,mh,0);mirror(W*.397,H*.075,W*.206,H*.64,1);mirror(W*.76,top,sideW,mh,2);
for(let i=1;i<9;i++){let y=H*.75+Math.pow(i/8,1.8)*H*.25;c.strokeStyle='rgba(176,197,199,.13)';c.lineWidth=1;c.beginPath();c.moveTo(W*.18-(y-H*.75)*.7,y);c.lineTo(W*.82+(y-H*.75)*.7,y);c.stroke()}for(let i=-4;i<=4;i++){c.strokeStyle='rgba(177,197,199,.09)';c.beginPath();c.moveTo(W*.5+i*W*.025,H*.75);c.lineTo(W*.5+i*W*.11,H);c.stroke()}
for(let i=0;i<4;i++){let x=W*(.14+i*.24);glow(x,H*.06,W*.13,'rgba(190,218,220,.16)');c.fillStyle='#aab9b9';c.fillRect(x-W*.035,H*.055,W*.07,2)}
if(phase>=1){glow(W*.5,H*.48,W*.19,'rgba(0,0,0,.8)');figure(W*.5,H*.57,1.3,Math.sin(time*.14)*W*.004,phase>=2)}
dust.forEach(p=>{p.y-=p.v;if(p.y<0)p.y=H;c.fillStyle='rgba(210,229,230,.2)';c.fillRect(p.x,p.y,p.r,p.r)});
if(fracture>0){glass.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.17;s.rot+=s.vr;s.life-=.009;c.save();c.globalAlpha=Math.max(0,s.life);c.translate(s.x,s.y);c.rotate(s.rot);poly([[0,-s.r],[s.r*.45,-s.r*.12],[s.r*.18,s.r],[ -s.r*.3,s.r*.24]],'rgba(174,212,220,.38)','#d8e9eb',.8);c.restore()});glass=glass.filter(s=>s.life>0)}
let vign=c.createRadialGradient(W/2,H*.45,W*.12,W/2,H*.45,W*.78);vign.addColorStop(0,'rgba(0,0,0,0)');vign.addColorStop(1,'rgba(0,0,0,.72)');c.fillStyle=vign;c.fillRect(0,0,W,H);c.restore();raf=requestAnimationFrame(draw)}
raf=requestAnimationFrame(draw);
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function tone(freq,dur,vol,type='sine',end=freq){if(!ctx)return;let o=ctx.createOscillator(),a=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(1,end),ctx.currentTime+dur);a.gain.setValueAtTime(vol,ctx.currentTime);a.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(a);a.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}
function noise(dur,vol,cut=1000){if(!ctx)return;let b=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),v=b.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=Math.random()*2-1;let s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),a=ctx.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;a.gain.setValueAtTime(vol,ctx.currentTime);a.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);s.connect(f);f.connect(a);a.connect(ctx.destination);s.start();s.stop(ctx.currentTime+dur)}
function reset(){timers.forEach(clearTimeout);timers=[];playing=false;phase=0;crack=0;fracture=0;shake=0;glass=[];flash.style.opacity=0;stage.classList.remove('shake');caption.textContent="DON'T LOOK AWAY FROM THE GLASS";trigger.disabled=false}
function run(){if(playing)return;playing=true;trigger.disabled=true;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}tone(43,4,.24,'sine',25);noise(3,.09,170);later(()=>{phase=1;caption.textContent='YOUR REFLECTION IS STILL MOVING';tone(118,2,.13,'triangle',42)},2200);later(()=>{phase=2;caption.textContent='IT IS LOOKING AT YOU';tone(480,.7,.1,'sine',75);noise(.6,.1,1800)},4700);later(()=>{crack=.72;caption.textContent='GET AWAY FROM THE MIRRORS';noise(1.2,.28,2600);tone(820,.7,.1,'sawtooth',130)},6500);later(()=>{crack=1;noise(.6,.3,3600);tone(1450,.28,.08,'square',170)},7900);later(()=>{fracture=1;shake=6;stage.classList.add('shake');flash.style.opacity=.72;noise(2,.5,5200);tone(38,2,.42,'sawtooth',18);glass=[];for(let i=0;i<130;i++)glass.push({x:W/2+rand(-W*.42,W*.42),y:H*.46+rand(-H*.34,H*.3),vx:rand(-12,12),vy:rand(-14,1),rot:rand(0,6),vr:rand(-.35,.35),r:rand(3,17),life:1})},9000);later(()=>{flash.style.opacity=0;shake=0;stage.classList.remove('shake');caption.textContent='THE GLASS IS GONE. IT IS STILL WATCHING.';tone(62,2.2,.17,'triangle',24)},10400);later(()=>{playing=false;trigger.disabled=false},13300)}
trigger.addEventListener('click',run);document.getElementById('reset').addEventListener('click',reset);window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));
})();
</script></body></html>
