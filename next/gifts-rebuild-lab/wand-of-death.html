<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Wand of Death — TikNation Gift Lab</title>
<style>
:root{color-scheme:dark;--green:#a7ff5a;--gold:#c69b55}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#080b0b;color:#f2f0e9;font-family:Georgia,serif}
body{min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#253321 0,#101711 36%,#080b0b 76%)}
.scene{position:relative;min-height:100vh;display:grid;place-items:center;overflow:hidden}
h1{position:absolute;top:5vh;left:0;width:100%;text-align:center;letter-spacing:.22em;font:600 clamp(17px,3vw,28px) Georgia,serif;color:#e8e1ce;text-shadow:0 0 18px #8fcf52}
.sub{position:absolute;top:calc(5vh + 38px);letter-spacing:.3em;font:10px Arial,sans-serif;color:#9ba88e}
.stage{position:relative;width:min(94vw,760px);height:min(68vh,560px);display:grid;place-items:center}
.aura{position:absolute;width:250px;height:250px;border:1px solid #9cff4c33;border-radius:50%;box-shadow:0 0 90px #8aff3820,inset 0 0 70px #8aff3814;animation:pulse 3s ease-in-out infinite}
.aura:before,.aura:after{content:"";position:absolute;inset:24px;border:1px dashed #c6e89b55;border-radius:50%;animation:spin 24s linear infinite}.aura:after{inset:-35px;border-color:#a4e56b22;animation-direction:reverse;animation-duration:36s}
.wand{position:relative;width:330px;height:100px;transform:rotate(-28deg);filter:drop-shadow(0 12px 18px #000)}
.handle{position:absolute;left:15px;top:39px;width:98px;height:23px;border-radius:7px 3px 3px 7px;background:linear-gradient(180deg,#755034,#28170f 40%,#5c3823 65%,#1a100c);border:1px solid #9d7749;box-shadow:inset 0 2px 3px #d5a36c55}
.handle:before{content:"";position:absolute;left:9px;right:9px;top:3px;height:3px;background:#c49a5b;border-radius:5px;box-shadow:0 13px #c49a5b77}
.grip{position:absolute;left:22px;top:33px;width:45px;height:35px;border:2px solid #b58a50;border-radius:7px;background:linear-gradient(90deg,#21140f,#76502e,#21140f);box-shadow:0 0 8px #c69b5544}
.shaft{position:absolute;left:105px;top:45px;width:205px;height:11px;border-radius:8px 2px 2px 8px;background:linear-gradient(180deg,#c6a06a,#392319 45%,#170e0a 75%,#8e6840);clip-path:polygon(0 0,100% 45%,100% 55%,0 100%);border-top:1px solid #d5b47d}
.tip{position:absolute;left:299px;top:41px;width:32px;height:19px;background:linear-gradient(90deg,#8d633c,#e0c38a,#7a4d2c);clip-path:polygon(0 0,100% 50%,0 100%);filter:drop-shadow(0 0 8px #b6ff5c)}
.gem{position:absolute;left:306px;top:42px;width:13px;height:13px;border-radius:50%;background:#b8ff63;box-shadow:0 0 8px 4px #9dff42,0 0 25px 12px #85ff3766;animation:gem 1.4s ease-in-out infinite}
.rune{position:absolute;left:127px;top:42px;color:#e4c68d;font:12px Georgia;transform:rotate(90deg);text-shadow:0 0 7px #ffe2a4}
.energy{position:absolute;left:315px;top:50px;width:10px;height:10px;border-radius:50%;background:#c9ff8b;opacity:0}
.cast .energy{animation:burst 1.2s ease-out}
.cast .aura{animation:surge .9s ease-out}
.spark{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#c5ff80;box-shadow:0 0 12px #baff75;opacity:0}
.cast .spark{animation:fly 1s ease-out}
.controls{position:absolute;bottom:8vh;display:flex;gap:12px}
button{border:1px solid #93bb6a88;background:#111a12;color:#e9f3df;padding:13px 23px;border-radius:3px;letter-spacing:.15em;font-size:11px;cursor:pointer}
button:hover{background:#25371e;box-shadow:0 0 20px #9bff4833}button:active{transform:scale(.97)}
.caption{position:absolute;bottom:4vh;color:#82917a;font:10px Arial,sans-serif;letter-spacing:.2em}
@keyframes pulse{50%{transform:scale(1.08);opacity:.55}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes gem{50%{box-shadow:0 0 14px 7px #9dff42,0 0 38px 20px #85ff3766;transform:scale(1.2)}}@keyframes burst{0%{opacity:1;box-shadow:0 0 0 0 #baff75}100%{opacity:0;box-shadow:0 0 0 180px #baff7500}}@keyframes surge{50%{transform:scale(1.3);border-color:#caff8c99}}@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.1)}}
@media(max-width:520px){.wand{transform:rotate(-28deg) scale(.78)}.stage{height:60vh}.controls{bottom:10vh}button{padding:12px 16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="scene" id="scene">
<h1>THE WAND OF DEATH</h1><div class="sub">A CURSED RELIC · TIKNATION GIFT LAB</div>
<div class="stage">
<div class="aura"></div>
<div class="wand" aria-label="A slender wooden magic wand with a gold grip and glowing green tip">
<div class="handle"></div><div class="grip"></div><div class="shaft"></div><div class="tip"></div><div class="gem"></div><div class="rune">✧</div><div class="energy"></div>
</div>
<i class="spark" style="--x:230px;--y:0px"></i><i class="spark" style="--x:212.49229247759595px;--y:65.05618350206527px"></i><i class="spark" style="--x:162.63455967290594px;--y:120.20815280171307px"></i><i class="spark" style="--x:88.01718944397066px;--y:157.05952052691873px"></i><i class="spark" style="--x:1.4083438190194563e-14px;--y:170px"></i><i class="spark" style="--x:-88.01718944397064px;--y:157.05952052691873px"></i><i class="spark" style="--x:-162.6345596729059px;--y:120.20815280171308px"></i><i class="spark" style="--x:-212.49229247759595px;--y:65.05618350206528px"></i><i class="spark" style="--x:-230px;--y:2.0818995585505004e-14px"></i><i class="spark" style="--x:-212.49229247759598px;--y:-65.05618350206524px"></i><i class="spark" style="--x:-162.63455967290597px;--y:-120.20815280171307px"></i><i class="spark" style="--x:-88.01718944397078px;--y:-157.0595205269187px"></i><i class="spark" style="--x:-4.225031457058368e-14px;--y:-170px"></i><i class="spark" style="--x:88.01718944397071px;--y:-157.05952052691873px"></i><i class="spark" style="--x:162.63455967290588px;--y:-120.20815280171311px"></i><i class="spark" style="--x:212.4922924775959px;--y:-65.05618350206537px"></i>
</div>
<div class="controls"><button id="cast">CAST THE CURSE</button><button id="sound">SOUND: OFF</button></div>
<div class="caption">POINT THE WAND · UNLEASH THE CURSE</div>
</main>
<script>
const scene=document.getElementById('scene'),cast=document.getElementById('cast'),sound=document.getElementById('sound');let audioOn=false,ctx;
cast.addEventListener('click',()=>{scene.classList.remove('cast');void scene.offsetWidth;scene.classList.add('cast');if(audioOn){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(170,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(38,ctx.currentTime+.75);g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.8);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.8)}catch(e){}}setTimeout(()=>scene.classList.remove('cast'),1300)});
sound.addEventListener('click',()=>{audioOn=!audioOn;sound.textContent='SOUND: '+(audioOn?'ON':'OFF')});
</script>
</body></html>
