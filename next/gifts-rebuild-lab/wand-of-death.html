<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE WAND OF DEATH — Rebuild</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030605;color:#eaf3df;font-family:Arial,sans-serif}body{overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#263821 0,#10180f 33%,#050806 72%,#010302 100%)}
#stage{height:100svh;min-height:540px;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;isolation:isolate;overflow:hidden}
#stage:before{content:"";position:absolute;inset:-30%;z-index:-2;background:repeating-conic-gradient(from 0deg at 50% 48%,#a7ff5900 0deg,#a7ff5908 3deg,#a7ff5900 6deg 15deg);animation:turn 50s linear infinite}
#stage:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse,transparent 35%,#000a 100%)}
header{position:absolute;top:5%;z-index:8;text-align:center}.title{font-size:clamp(24px,4vw,42px);font-weight:900;letter-spacing:.24em;text-shadow:0 0 24px #9cff62a0}.tag{margin-top:9px;font-size:10px;letter-spacing:.36em;color:#a9ba9b}
.scene{position:relative;width:min(760px,100vw);height:min(660px,76svh);min-height:430px;display:grid;place-items:center}
.rift{position:absolute;width:min(62vw,450px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#b7ff741e 0 10%,#92ed4320 25%,#9eff5010 48%,transparent 70%);filter:blur(7px);animation:rift 4s ease-in-out infinite}
.halo{position:absolute;width:280px;height:280px;border:1px solid #b5e88a55;border-radius:50%;box-shadow:0 0 40px #a5ff4220,inset 0 0 35px #a5ff4216;transform:rotateX(68deg);animation:halo 6s linear infinite}
.halo:before,.halo:after{content:"";position:absolute;inset:18px;border:1px dashed #b7e28b66;border-radius:50%}.halo:after{inset:45px;border-style:solid;opacity:.55}
.wandAssembly{position:relative;width:330px;height:460px;z-index:3;filter:drop-shadow(0 20px 30px #000)}
.wand{position:absolute;left:50%;top:16%;height:72%;width:27px;transform:translateX(-50%) rotate(7deg);border-radius:12px 12px 9px 9px;background:linear-gradient(90deg,#100b08 0%,#3b281b 12%,#98734a 24%,#d0a56d 29%,#47301f 40%,#160e0a 56%,#805b38 74%,#24160e 100%);box-shadow:inset 3px 0 3px #f0c58c80,inset -5px 0 6px #000,0 0 16px #b4ff6c20}
.wand:before{content:"";position:absolute;inset:5% 4px 8%;background:repeating-linear-gradient(180deg,transparent 0 38px,#d5b17b 39px,#26180f 42px,transparent 45px);opacity:.7}
.wand:after{content:"";position:absolute;left:50%;bottom:4%;width:8px;height:45%;transform:translateX(-50%);background:linear-gradient(#b9ef75,#29401d);filter:blur(1px);opacity:.65}
.handle{position:absolute;left:50%;top:59%;height:23%;width:43px;transform:translateX(-50%) rotate(7deg);border-radius:8px;background:repeating-linear-gradient(0deg,#110c09 0 7px,#76502b 8px 10px,#24170e 11px 15px);border:2px solid #9a7548;box-shadow:0 0 12px #a7ff4930}
.pommel{position:absolute;left:50%;top:79%;width:37px;height:34px;transform:translateX(-50%);border-radius:50% 50% 44% 44%;background:radial-gradient(circle at 30% 25%,#b58a58,#3b2617 55%,#0a0806 85%);border:1px solid #a67b4b}
.guard{position:absolute;z-index:2;left:50%;top:16%;width:190px;height:58px;transform:translateX(-50%) rotate(7deg);border-radius:50%;border-top:10px solid #4e3c27;border-bottom:4px solid #a8895c;box-shadow:0 5px 7px #000,inset 0 4px 4px #d1ad70}
.guard:before,.guard:after{content:"";position:absolute;top:-13px;width:36px;height:30px;border-radius:50%;background:linear-gradient(135deg,#d4b17a,#342319 70%);border:2px solid #987447}.guard:before{left:-8px}.guard:after{right:-8px}
.cage{position:absolute;left:50%;top:-2%;width:105px;height:130px;transform:translateX(-50%);z-index:4}
.cage .spike{position:absolute;left:50%;top:0;width:3px;height:45px;background:linear-gradient(#d5e8b1,#4e6c36);transform-origin:bottom;box-shadow:0 0 8px #baff75}.cage .spike:nth-child(1){transform:translateX(-50%) rotate(-38deg)}.cage .spike:nth-child(2){transform:translateX(-50%) rotate(-19deg)}.cage .spike:nth-child(3){transform:translateX(-50%)}.cage .spike:nth-child(4){transform:translateX(-50%) rotate(19deg)}.cage .spike:nth-child(5){transform:translateX(-50%) rotate(38deg)}
.gem{position:absolute;left:50%;top:29px;width:43px;height:53px;transform:translateX(-50%) rotate(45deg);border-radius:8px 8px 10px 10px;background:linear-gradient(135deg,#e8ffbd,#a0ed58 25%,#315c22 58%,#0a1909 85%);border:2px solid #d2f8a1;box-shadow:0 0 12px 5px #b5ff7b,0 0 48px 24px #9aff4c8c;animation:gem 1.8s ease-in-out infinite}
.gem:after{content:"";position:absolute;inset:7px 12px;background:#e6ffbe;opacity:.55;filter:blur(5px)}
.runes{position:absolute;left:50%;top:44%;width:74px;height:180px;transform:translateX(-50%);color:#caff91;text-align:center;font:18px Georgia;line-height:2.2;text-shadow:0 0 10px #aaff66;opacity:.75}
.orbit{position:absolute;z-index:2;width:390px;height:150px;border:2px solid #c1ff8b77;border-radius:50%;transform:rotate(-22deg) rotateX(65deg);box-shadow:0 0 18px #b5ff6b;opacity:.45;animation:orbit 5s linear infinite}
.orbit.two{width:450px;height:190px;transform:rotate(52deg) rotateX(65deg);animation-direction:reverse;opacity:.25}
.burst{position:absolute;z-index:5;inset:8% 12%;pointer-events:none;opacity:0}.burst i{position:absolute;left:50%;top:50%;width:2px;height:100px;background:linear-gradient(transparent,#e4ffb2,transparent);transform-origin:50% 0;box-shadow:0 0 9px #baff70}
.burst i:nth-child(1){transform:rotate(0deg)}.burst i:nth-child(2){transform:rotate(45deg)}.burst i:nth-child(3){transform:rotate(90deg)}.burst i:nth-child(4){transform:rotate(135deg)}.burst i:nth-child(5){transform:rotate(180deg)}.burst i:nth-child(6){transform:rotate(225deg)}.burst i:nth-child(7){transform:rotate(270deg)}.burst i:nth-child(8){transform:rotate(315deg)}
.floor{position:absolute;bottom:7%;width:min(620px,95vw);height:120px;border-radius:50%;background:radial-gradient(ellipse,#9dff4b32,#6c9e3320 35%,transparent 70%);filter:blur(10px)}
.shard{position:absolute;width:5px;height:5px;background:#d8ffac;box-shadow:0 0 12px 4px #aaff6c;border-radius:50%;animation:float 4s linear infinite}.s1{left:15%;bottom:12%}.s2{left:28%;bottom:20%;animation-delay:-2s}.s3{right:19%;bottom:17%;animation-delay:-1s}.s4{right:29%;bottom:9%;animation-delay:-3s}
.controls{position:absolute;bottom:7%;z-index:9;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:0 12px}
button{cursor:pointer;border:1px solid #9fc777;background:linear-gradient(180deg,#263b23,#091109);color:#efffe0;padding:15px 21px;font-weight:800;font-size:11px;letter-spacing:.17em;box-shadow:0 0 22px #9cff4b25;border-radius:3px}button:active{transform:scale(.97)}button:hover{background:#38522e}
#status{position:absolute;bottom:3%;z-index:8;color:#a2b894;font-size:9px;letter-spacing:.2em;text-align:center}
.cast .burst{animation:burst .9s ease-out}.cast .wandAssembly{animation:raise .75s ease-out}.cast .gem{box-shadow:0 0 20px 10px #e8ffbd,0 0 90px 50px #a5ff57}.cast .rift{background:radial-gradient(circle,#e0ff9e33,#aaff5428 40%,transparent 72%)}
@keyframes turn{to{transform:rotate(360deg)}}@keyframes rift{50%{transform:scale(1.18);opacity:.7}}@keyframes halo{to{transform:rotateX(68deg) rotateZ(360deg)}}@keyframes gem{50%{transform:translateX(-50%) rotate(45deg) scale(1.13);filter:brightness(1.5)}}@keyframes orbit{to{transform:rotate(338deg) rotateX(65deg)}}@keyframes float{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-280px) translateX(25px);opacity:0}}@keyframes raise{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-38px) rotate(-8deg) scale(1.08)}100%{transform:translateY(0) rotate(0)}}@keyframes burst{0%{opacity:0;transform:scale(.35)}20%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
@media(max-width:540px){header{top:4%}.title{font-size:23px;letter-spacing:.16em}.tag{font-size:8px}.scene{height:70svh;min-height:420px}.wandAssembly{transform:scale(.82)}.orbit{width:290px}.orbit.two{width:340px}.controls{bottom:8%}button{padding:13px 15px;font-size:9px}#status{bottom:3%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main id="stage">
<header><div class="title">THE WAND OF DEATH</div><div class="tag">AN ANCIENT RELIC FORBIDDEN TO THE LIVING</div></header>
<div class="scene"><div class="rift"></div><div class="halo"></div><div class="orbit"></div><div class="orbit two"></div><div class="floor"></div>
<div class="wandAssembly"><div class="wand"></div><div class="handle"></div><div class="pommel"></div><div class="guard"></div><div class="cage"><i class="spike"></i><i class="spike"></i><i class="spike"></i><i class="spike"></i><i class="spike"></i><div class="gem"></div></div><div class="runes">ᚦ<br>ᛉ<br>ᚷ<br>ᛟ</div></div>
<div class="burst"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<i class="shard s1"></i><i class="shard s2"></i><i class="shard s3"></i><i class="shard s4"></i></div>
<div class="controls"><button id="cast">UNLEASH THE DEATH SPELL</button><button id="sound">SOUND: OFF</button></div><div id="status">THE GEM IS HUNGRY — THE WAND AWAITS</div>
</main><script>
(()=>{const stage=document.getElementById('stage'),cast=document.getElementById('cast'),sound=document.getElementById('sound'),status=document.getElementById('status');let enabled=false,ctx;
cast.addEventListener('click',()=>{stage.classList.remove('cast');void stage.offsetWidth;stage.classList.add('cast');status.textContent='THE DEATH SPELL HAS BEEN UNLEASHED';if(enabled)tone();setTimeout(()=>stage.classList.remove('cast'),1000)});
sound.addEventListener('click',()=>{enabled=!enabled;sound.textContent='SOUND: '+(enabled?'ON':'OFF');status.textContent=enabled?'THE RELIC HUMS WITH CURSED POWER':'SOUND MUTED';if(enabled)tone()});
function tone(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime;const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(118,t);o.frequency.exponentialRampToValueAtTime(29,t+1.1);f.type='lowpass';f.frequency.value=520;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+1.35);o.connect(f);f.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.4)}catch(e){status.textContent='AUDIO UNAVAILABLE'}}})();
</script></body></html>
