<body><main class="wrap"><header><span>TIKNATION · GIFT REBUILD LAB</span><b>THE LAST PASSENGER</b></header>
<section class="scene" id="scene"><div class="car" id="car"><div class="ceiling"></div><div class="floor"></div><div class="wall left"></div><div class="wall right"></div><div class="window one"></div><div class="window two"></div><div class="seat left"></div><div class="seat right"></div><div class="platform"></div><div class="door"></div><div class="tunnel-light"></div><div class="light"></div><div class="light"></div><div class="light"></div><div class="passenger" id="passenger"><div class="head"></div><div class="body"></div></div></div><div class="flash" id="flash"></div><div class="caption" id="caption">THE TRAIN HAS STOPPED. NOBODY GOT OFF.</div></section>
<div class="controls"><button id="trigger">▶ TRIGGER THE ARRIVAL</button><button class="secondary" id="reset">RESET</button><div class="note">PREVIEW ONLY · AUDIO STARTS AFTER YOU TAP TRIGGER · NOT YET CONNECTED TO THE LIVE GIFT CATALOG</div></div></main>
<script>
(()=>{const scene=document.getElementById('scene'),car=document.getElementById('car'),passenger=document.getElementById('passenger'),flash=document.getElementById('flash'),caption=document.getElementById('caption'),trigger=document.getElementById('trigger');let ctx=null,active=false,timers=[];
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t)}
function tone(freq,dur,gain,type='sine',endFreq=freq){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),ctx.currentTime+dur);g.gain.setValueAtTime(gain,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}
function rumble(dur=2){if(!ctx)return;const n=ctx.sampleRate*dur,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*.45;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=150;g.gain.setValueAtTime(.22,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);s.connect(f);f.connect(g);g.connect(ctx.destination);s.start();s.stop(ctx.currentTime+dur)}
function reset(){timers.forEach(clearTimeout);timers=[];active=false;scene.classList.remove('doors-open','shake');car.classList.remove('flicker');passenger.classList.remove('show','stare');flash.style.opacity=0;caption.textContent='THE TRAIN HAS STOPPED. NOBODY GOT OFF.';trigger.disabled=false}
function run(){if(active)return;active=true;trigger.disabled=true;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();}catch(e){}tone(48,3,.28,'sawtooth',34);rumble(3);caption.textContent='BRAKES SCREAM IN THE DARK';scene.classList.add('shake');later(()=>{scene.classList.remove('shake');scene.classList.add('doors-open');tone(110,1.8,.2,'triangle',45);caption.textContent='THE DOORS OPEN';},2300);later(()=>{passenger.classList.add('show');tone(180,2,.08,'sine',90);caption.textContent='SOMEONE IS STILL INSIDE';},4200);later(()=>{passenger.classList.add('stare');car.classList.add('flicker');tone(880,.12,.07,'square',110);tone(620,.18,.07,'square',90);caption.textContent='IT IS LOOKING RIGHT AT YOU';},6500);later(()=>{car.classList.remove('flicker');flash.style.opacity=.9;scene.classList.add('shake');tone(42,1.3,.55,'sawtooth',25);rumble(1.5);caption.textContent='';},8200);later(()=>{flash.style.opacity=0;scene.classList.remove('shake');scene.classList.remove('doors-open');passenger.classList.remove('show');tone(65,1.2,.2,'triangle',30);caption.textContent='THE TRAIN LEFT. THE PASSENGER DID NOT.';},9500);later(()=>{active=false;trigger.disabled=false;},12000)}
trigger.addEventListener('click',run);document.getElementById('reset').addEventListener('click',reset);
})();
</script></body></html>
