<div class="shade"></div><header><div class="eyebrow">TIKNATION · EPIC GIFTS · 3D REBUILD</div><h1>THE PHANTOM SHIPWRECK</h1><div class="sub">THE DEAD DO NOT SAIL ALONE</div></header><div id="hint">A LOST SHIP HAUNTS THE BLACK WATER</div><div class="controls"><button class="primary" id="awaken">AWAKEN THE DEEP</button><button id="sound">SOUND: OFF</button></div><div id="error">This preview needs WebGL enabled in your browser.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030b14);scene.fog=new THREE.FogExp2(0x07151d,.027);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,300);camera.position.set(13,9,19);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.appendChild(renderer.domElement);
const hemi=new THREE.HemisphereLight(0x9bbbc9,0x071016,1.1);scene.add(hemi);
const moon=new THREE.DirectionalLight(0x9bc8df,2.3);moon.position.set(-8,15,8);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);scene.add(moon);
const fill=new THREE.PointLight(0x39d7c0,28,22);fill.position.set(-2,3,0);scene.add(fill);
const lightning=new THREE.PointLight(0xb8e5ff,0,90);lightning.position.set(-9,12,-10);scene.add(lightning);
const mat=(color,rough=.8,metal=0)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
const darkWood=mat(0x211914),wood=mat(0x493022),edgeWood=mat(0x725039),iron=mat(0x202a2c,.45,.7),sailMat=new THREE.MeshStandardMaterial({color:0x77756b,roughness:1,side:THREE.DoubleSide});
const ship=new THREE.Group();scene.add(ship);
function box(parent,x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function rod(parent,a,b,r,m,rad=8){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),v=B.clone().sub(A);const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,v.length(),rad),m);o.position.copy(A.add(B).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize());o.castShadow=true;parent.add(o);return o}
function curve(parent,pts,r,m,segments=36){const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));const o=new THREE.Mesh(new THREE.TubeGeometry(c,segments,r,7,false),m);o.castShadow=true;parent.add(o);return o}
// Deep, tapered hull with a pointed bow and raised stern.
const rings=[[-6.2,.25,.12],[-5.4,.72,.62],[-3.5,1.05,.92],[0,1.13,1],[3.5,.98,.85],[5.1,.78,.7],[6,.48,.42]];
const verts=[],indices=[];for(const [x,w,y] of rings){verts.push(x,y,0,x,y-.32,w,x,y-.32,-w,x,y+.48,-w,x,y+.48,w)}
for(let i=0;i<rings.length-1;i++)for(let j=0;j<5;j++){const a=i*5+j,b=i*5+(j+1)%5,c=(i+1)*5+j,d=(i+1)*5+(j+1)%5;indices.push(a,c,b,b,c,d)}
const hullGeo=new THREE.BufferGeometry();hullGeo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));hullGeo.setIndex(indices);hullGeo.computeVertexNormals();const hull=new THREE.Mesh(hullGeo,new THREE.MeshStandardMaterial({color:0x302019,roughness:.92,side:THREE.DoubleSide}));hull.castShadow=true;hull.receiveShadow=true;ship.add(hull);
// Individual weathered hull planks on both sides.
for(let side of [-1,1])for(let row=0;row<5;row++){const y=-.16+row*.18;curve(ship,[[-5.65,y,side*.48],[-4.2,y-.08,side*.84],[-1.5,y-.1,side*1.03],[2.2,y-.06,side*.94],[4.8,y+.02,side*.68],[5.7,y+.15,side*.4]],.035,row%2?wood:edgeWood,42)}
// Deck, gunwales, rails and ribs.
box(ship,0,.42,0,10.5,.22,1.72,wood);for(let side of [-1,1]){curve(ship,[[-5.8,.62,side*.48],[-4,.62,side*.9],[0,.62,side*1.08],[4.5,.7,side*.78],[5.8,1.05,side*.43]],.12,edgeWood,40);for(let i=0;i<15;i++){const x=-5.2+i*.72;rod(ship,[x,.62,side*.87],[x,.98,side*.87],.045,edgeWood,6)}curve(ship,[[-5.3,.99,side*.87],[-2,.99,side*1.08],[2,.99,side*1.02],[5.5,1.28,side*.54]],.055,iron,36)}
for(let i=0;i<18;i++){const x=-4.8+i*.56;box(ship,x,.545,0,.48,.035,1.45,i%3?wood:edgeWood)}
// Raised forecastle and sterncastle.
box(ship,-4.75,1.0,0,1.65,.95,1.35,darkWood);box(ship,4.65,1.25,0,1.75,1.35,1.35,darkWood);for(let side of [-1,1]){box(ship,4.7,1.9,side*.48,1.4,.12,.12,edgeWood);for(let i=0;i<4;i++)box(ship,4.15+i*.35,1.85,side*.5,.09,.38,.09,edgeWood)}
// Masts, yards, cross spars, rigging and torn canvas.
const mastXs=[-2.8,0,2.7],mastHeights=[6.3,8.2,6.8];mastXs.forEach((mx,i)=>{const H=mastHeights[i];rod(ship,[mx,.55,0],[mx,H,0],.16,wood,12);rod(ship,[mx,H*.53,-2],[mx,H*.53,2],.09,edgeWood,10);rod(ship,[mx,H*.79,-1.65],[mx,H*.79,1.65],.075,edgeWood,10);
function sail(y,w,h){const g=new THREE.PlaneGeometry(w,h,12,8);const p=g.attributes.position;for(let k=0;k<p.count;k++){const xx=p.getX(k),yy=p.getY(k);p.setZ(k,-.22*Math.sin((xx/w+.5)*Math.PI)*Math.sin((yy/h+.5)*Math.PI)+.07*Math.sin(xx*4+yy*2))}g.computeVertexNormals();const s=new THREE.Mesh(g,sailMat);s.position.set(mx,y,0);s.castShadow=true;ship.add(s);return s}
sail(H*.67,i===1?3.25:2.8,1.65);sail(H*.4,i===1?3:2.5,1.4);
rod(ship,[mx,.8,-.1],[mx-1.8,H*.8,-.3],.025,iron,5);rod(ship,[mx,.8,.1],[mx+1.8,H*.8,.3],.025,iron,5);rod(ship,[mx,H*.53,-1.8],[mx,H*.9,-.1],.022,iron,5);rod(ship,[mx,H*.53,1.8],[mx,H*.9,.1],.022,iron,5);
});
for(let i=0;i<12;i++){const x=-5+i*.9;curve(ship,[[x,.8,-.9],[x*.55,3,-.7],[0,7,0]],.018,iron,18)}
// Torn pennant and ragged sail strips.
curve(ship,[[0,8.2,0],[.6,8.5,.1],[1.5,8.15,.2],[2.3,8.45,.3]],.035,mat(0x292e31),20);
for(let side of [-1,1])for(let i=0;i<8;i++){const nail=new THREE.Mesh(new THREE.SphereGeometry(.045,8,6),iron);nail.position.set(-5+i*1.35,.05,side*.72);ship.add(nail)}
// Cursed lanterns.
const lanterns=[];for(const p of [[-4,1.5,1],[4.9,2.1,-.65],[2,1.5,1]]){const g=new THREE.Group();g.position.set(...p);ship.add(g);box(g,0,0,0,.28,.4,.25,iron);const l=new THREE.PointLight(0x62ffd7,5,6);l.position.y=-.1;g.add(l);const orb=new THREE.Mesh(new THREE.SphereGeometry(.085,12,8),new THREE.MeshBasicMaterial({color:0x9dffe6}));g.add(orb);lanterns.push(l)}
// Sea serpent: long scaled body, raised neck, armored head, jaw, fangs and luminous eyes.
const beast=new THREE.Group();scene.add(beast);beast.position.set(3.5,0,3.5);
const bodyPts=[[-7,.3,1.8],[-5,.35,1.4],[-3,.45,1.1],[-1,.75,.8],[.5,1.4,.45],[1.4,2.3,.2],[1.7,3.25,.1],[2.5,3.75,.15],[3.5,3.4,.3],[4.1,2.5,.45]];
const bodyCurve=new THREE.CatmullRomCurve3(bodyPts.map(p=>new THREE.Vector3(...p)));const body=new THREE.Mesh(new THREE.TubeGeometry(bodyCurve,110,.48,14,false),mat(0x173c3b,.36,.25));body.castShadow=true;beast.add(body);
for(let i=0;i<34;i++){const u=.05+i*.026;const q=bodyCurve.getPoint(u),tan=bodyCurve.getTangent(u);const sc=new THREE.Mesh(new THREE.SphereGeometry(.19,8,6),mat(i%2?0x28635a:0x36766a,.42,.25));sc.position.copy(q);sc.position.y+=.27;sc.scale.set(.9,.45,.8);sc.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),tan);beast.add(sc)}
const head=new THREE.Group();head.position.set(3.55,3.45,.3);head.rotation.z=-.16;beast.add(head);
const skull=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),mat(0x244e48,.3,.25));skull.scale.set(1.25,.72,.82);skull.castShadow=true;head.add(skull);
const snout=new THREE.Mesh(new THREE.SphereGeometry(.65,20,14),mat(0x35675d,.34,.2));snout.position.set(.95,-.22,0);snout.scale.set(1.25,.48,.65);head.add(snout);
const jaw=new THREE.Mesh(new THREE.SphereGeometry(.62,18,12),mat(0x172d2b,.42,.15));jaw.position.set(.8,-.66,0);jaw.scale.set(1.2,.25,.6);head.add(jaw);
for(let s of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.16,14,10),new THREE.MeshStandardMaterial({color:0xffbd55,emissive:0xff6a16,emissiveIntensity:3}));eye.position.set(.15,.13,s*.72);head.add(eye);const pupil=new THREE.Mesh(new THREE.SphereGeometry(.055,10,8),mat(0x080b09));pupil.position.set(.22,.14,s*.83);head.add(pupil);rod(head,[-.35,.48,s*.48],[-.75,1.2,s*.62],.12,mat(0x426f63),10);rod(head,[.75,-.4,s*.4],[1.35,-.95,s*.48],.055,mat(0xe4d8b4),8)}
for(let i=0;i<5;i++){const fin=new THREE.Mesh(new THREE.ConeGeometry(.22,.75,5),mat(0x315d54));fin.position.set(-.7-i*.4,.65,0);fin.rotation.z=-.5;head.add(fin)}
// Serpent whiskers and curling sea tendrils.
for(let s of [-1,1])curve(head,[[1,-.2,s*.35],[1.6,-.05,s*.6],[2,.35,s*.8]],.035,mat(0x79b5a3),20);
for(let i=0;i<4;i++){const z=-1.1+i*.72;curve(beast,[[1,.1,z],[.5,-.7,z*1.3],[1.3,-1.4,z*1.5],[2.5,-1.1,z*1.6],[3,-.2,z*1.7]],.12,mat(0x214d49,.4,.18),35)}
// Dark animated ocean with layered wave normals.
const waterGeo=new THREE.PlaneGeometry(180,180,150,150);waterGeo.rotateX(-Math.PI/2);
const waterMat=new THREE.MeshStandardMaterial({color:0x092632,roughness:.24,metalness:.38,transparent:false});
const water=new THREE.Mesh(waterGeo,waterMat);water.position.y=-.45;water.receiveShadow=true;scene.add(water);const base=waterGeo.attributes.position.array.slice();
const waveGeo=new THREE.PlaneGeometry(180,180,80,80);waveGeo.rotateX(-Math.PI/2);const wave=new THREE.Mesh(waveGeo,new THREE.MeshStandardMaterial({color:0x123c47,roughness:.3,metalness:.3,transparent:true,opacity:.35,wireframe:false}));wave.position.y=-.42;scene.add(wave);
const moonDisc=new THREE.Mesh(new THREE.CircleGeometry(2.4,48),new THREE.MeshBasicMaterial({color:0x9bb8c1,transparent:true,opacity:.22}));moonDisc.position.set(-13,12,-35);moonDisc.lookAt(camera.position);scene.add(moonDisc);
const rainGeo=new THREE.BufferGeometry(),rainCount=900,rainPos=new Float32Array(rainCount*3);for(let i=0;i<rainCount;i++){rainPos[i*3]=(Math.random()-.5)*55;rainPos[i*3+1]=Math.random()*24;rainPos[i*3+2]=(Math.random()-.5)*55}rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xa8d6dc,size:.055,transparent:true,opacity:.42}));scene.add(rain);
const spray=new THREE.Group();scene.add(spray);for(let i=0;i<130;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.05,6,5),new THREE.MeshBasicMaterial({color:0x9bd5d3,transparent:true,opacity:.55}));p.userData={phase:Math.random()*6,x:(Math.random()-.5)*18,z:(Math.random()-.5)*10};spray.add(p)}
const stars=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({color:0x9ec8d2,size:.06}));const starArr=[];for(let i=0;i<170;i++)starArr.push((Math.random()-.5)*100,Math.random()*30+5,-Math.random()*80);stars.geometry.setAttribute('position',new THREE.Float32BufferAttribute(starArr,3));scene.add(stars);
camera.lookAt(0,2,0);let clock=new THREE.Clock(),elapsed=0,awake=false,soundOn=false,audioCtx=null,rumble=null;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);elapsed+=dt;const t=elapsed;
ship.position.y=Math.sin(t*.8)*.16;ship.rotation.z=Math.sin(t*.55)*.018;ship.rotation.x=Math.sin(t*.7)*.012;beast.position.y=Math.sin(t*1.15)*.16;beast.rotation.z=Math.sin(t*.6)*.035;head.rotation.y=Math.sin(t*1.4)*.12;head.rotation.x=Math.sin(t*1.1)*.06;
const pos=waterGeo.attributes.position;for(let i=0;i<pos.count;i++){const x=base[i*3],z=base[i*3+2];pos.setY(i, -.45+Math.sin(x*.22+t*1.1)*.17+Math.cos(z*.19-t*.8)*.13+Math.sin((x+z)*.12+t*.6)*.09)}pos.needsUpdate=true;waterGeo.computeVertexNormals();
const rp=rainGeo.attributes.position;for(let i=0;i<rainCount;i++){let y=rp.getY(i)-dt*17;if(y<-.6)y=24;rp.setY(i,y);rp.setX(i,rp.getX(i)-dt*1.5)}rp.needsUpdate=true;
spray.children.forEach(p=>{const q=p.userData;p.position.set(q.x+Math.sin(t*1.2+q.phase)*.8,-.2+Math.abs(Math.sin(t*1.8+q.phase))*1.1,q.z+Math.cos(t+q.phase)*.4)});
lanterns.forEach((l,i)=>l.intensity=4.5+Math.sin(t*4+i*2)*1.3);
lightning.intensity=Math.random()>.996?22:lightning.intensity*.86;if(awake){camera.position.x=13+Math.sin(t*.19)*1.5;camera.position.y=9+Math.sin(t*.33)*.35;camera.lookAt(0,2,0);fill.intensity=34+Math.sin(t*2)*8}
renderer.render(scene,camera)}
animate();
document.getElementById('awaken').addEventListener('click',()=>{awake=!awake;document.getElementById('hint').textContent=awake?'THE BEAST HAS RISEN BENEATH THE WRECK':'A LOST SHIP HAUNTS THE BLACK WATER';document.getElementById('awaken').textContent=awake?'CALM THE DEEP':'AWAKEN THE DEEP';if(awake){head.rotation.x=-.12;lightning.intensity=15}});
document.getElementById('sound').addEventListener('click',async()=>{soundOn=!soundOn;document.getElementById('sound').textContent='SOUND: '+(soundOn?'ON':'OFF');if(soundOn){try{audioCtx=audioCtx||new AudioContext();await audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();o.type='sawtooth';o.frequency.value=48;filter.type='lowpass';filter.frequency.value=105;g.gain.value=.035;o.connect(filter);filter.connect(g);g.connect(audioCtx.destination);o.start();rumble={o,g}}catch(e){}}else if(rumble){rumble.g.gain.setTargetAtTime(0,audioCtx.currentTime,.2);rumble.o.stop(audioCtx.currentTime+.8);rumble=null}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
