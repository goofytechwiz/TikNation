<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Storm God's Trident — Rebuilt Gift Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:14px;background:#02070d;color:#eafaff;font-family:system-ui,sans-serif}.shell{width:min(100%,1000px);overflow:hidden;border:1px solid #38546a;border-radius:20px;background:#071421;box-shadow:0 25px 90px #000}header{padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}.kicker{font-size:10px;letter-spacing:.2em;color:#9bc6d8}h1{font-size:clamp(19px,4vw,29px);margin:5px 0 0}.tag{font-size:10px;border:1px solid #547286;border-radius:30px;padding:6px 9px;white-space:nowrap}.stage{aspect-ratio:16/9;min-height:245px;position:relative;background:#06111b}canvas{display:block;width:100%;height:100%}.hint{position:absolute;left:13px;bottom:11px;font-size:10px;letter-spacing:.16em;color:#c5e2eb;text-shadow:0 2px 8px #000}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:15px}button{border:1px solid #6d91a5;border-radius:30px;padding:11px 19px;background:#123047;color:white;font-weight:750;cursor:pointer}button.primary{background:linear-gradient(120deg,#8c6328,#f0d38a);color:#17212a;border:0}.note{text-align:center;color:#94adba;font-size:11px;padding:0 16px 16px}
</style></head><body><main class="shell"><header><div><div class="kicker">TIKNATION · GIFT REBUILD LAB</div><h1>THE STORM GOD’S TRIDENT</h1></div><div class="tag">STANDALONE PREVIEW</div></header><div class="stage"><canvas id="scene" aria-label="Cinematic storm ocean and ornate golden trident"></canvas><div class="hint">THE SEA ANSWERS THE CALL</div></div><div class="controls"><button class="primary" id="replay">↻ REPLAY GIFT</button><button id="sound" aria-pressed="false">♫ SOUND: OFF</button></div><div class="note">Sound is opt-in. Standalone preview only — not yet in the live gift catalog.</div></main>
<script>
(()=>{const c=document.querySelector('canvas'),g=c.getContext('2d'),soundBtn=document.querySelector('#sound');let W,H,D,start=performance.now(),sound=false,played=false,ac;
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function size(){let r=c.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function line(pts,color,width,blur=0){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.strokeStyle=color;g.lineWidth=width;g.shadowColor=color;g.shadowBlur=blur;g.stroke();g.shadowBlur=0}
function lightning(x,y,depth){let p=[[x,y]],yy=y;while(yy<depth){yy+=R(12,25);p.push([p[p.length-1][0]+R(-24,24),Math.min(depth,yy)])}line(p,'rgba(167,239,255,.95)',2.1,17);line(p,'rgba(255,255,255,.9)',.65,5)}
function cloud(x,y,scale,t){g.save();g.translate(x,y);g.scale(scale,scale);for(let i=0;i<7;i++){let a=i/6;g.fillStyle='rgba(8,19,30,'+(.42+a*.055)+')';g.beginPath();g.ellipse((a-.5)*160,Math.sin(a*8+t*.15)*5,42,17+Math.sin(a*5)*6,0,0,Math.PI*2);g.fill()}g.restore()}
function sea(t){let horizon=H*.61;let grad=g.createLinearGradient(0,horizon,0,H);grad.addColorStop(0,'#1b586c');grad.addColorStop(.18,'#0b354b');grad.addColorStop(1,'#020d1d');g.fillStyle=grad;g.fillRect(0,horizon,W,H-horizon);
for(let k=0;k<5;k++){let y=horizon+(k*k+1)*H*.012;g.beginPath();for(let x=0;x<=W+4;x+=4){let yy=y+Math.sin(x*.012-t*(1.2+k*.13)+k)*2.3+Math.sin(x*.027+t*.7)*1.2;x?g.lineTo(x,yy):g.moveTo(x,yy)}g.strokeStyle='rgba(139,218,231,'+(0.18-k*.025)+')';g.lineWidth=1+k*.22;g.stroke()}
let swell=clamp((t-1.2)/1.8,0,1),cx=W*.52,cy=H*.65,base=H*.82;
if(swell>0){g.beginPath();g.moveTo(0,base);g.bezierCurveTo(W*.13,H*.62,W*.19,H*.46,W*.31,H*.57);g.bezierCurveTo(W*.39,H*.69,W*.38,H*.29,W*.53,H*.25);g.bezierCurveTo(W*.62,H*.19,W*.62,H*.48,W*.72,H*.45);g.bezierCurveTo(W*.84,H*.39,W*.88,H*.59,W, H*.65);g.lineTo(W,H);g.lineTo(0,H);g.closePath();let wg=g.createLinearGradient(0,H*.25,0,H*.9);wg.addColorStop(0,'#d9f9f7');wg.addColorStop(.08,'#66c8d4');wg.addColorStop(.25,'#176d84');wg.addColorStop(.65,'#08405c');wg.addColorStop(1,'#03182e');g.globalAlpha=swell;g.fillStyle=wg;g.shadowColor='#45b7d2';g.shadowBlur=22;g.fill();g.shadowBlur=0;g.strokeStyle='rgba(219,255,255,.9)';g.lineWidth=2.2;g.stroke();g.globalAlpha=1;
for(let i=0;i<18;i++){let x=W*(.22+i*.034)+Math.sin(t*2+i)*5;let y=H*(.59+Math.sin(i*2.1)*.1);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+R(-17,17),y- R(8,30),x+R(-22,22),y-R(22,54));g.strokeStyle='rgba(206,250,255,'+R(.2,.65)+')';g.lineWidth=R(1,3);g.stroke()}}
}
function trident(t){let appear=clamp(t/.9,0,1),impact=clamp((t-1.05)/.25,0,1),scale=Math.min(1,W/780);g.save();g.translate(W*.5,H*(.11+(1-appear)*.25));g.scale(scale,scale);g.rotate((1-appear)*-.1);let metal=g.createLinearGradient(-30,0,30,0);metal.addColorStop(0,'#4e3519');metal.addColorStop(.18,'#b57b2d');metal.addColorStop(.38,'#fff0b0');metal.addColorStop(.55,'#c28b3d');metal.addColorStop(.78,'#f9df8d');metal.addColorStop(1,'#60421f');
g.shadowColor='#e6bd68';g.shadowBlur=14;g.strokeStyle=metal;g.fillStyle=metal;g.lineCap='round';g.lineJoin='round';
// long forged shaft with engraved central ridge
g.lineWidth=13;g.beginPath();g.moveTo(0,-76);g.lineTo(0,184);g.stroke();g.lineWidth=2;g.strokeStyle='rgba(255,245,196,.85)';g.beginPath();g.moveTo(-2,-60);g.lineTo(-2,175);g.stroke();
// swept three-prong head
g.strokeStyle=metal;g.lineWidth=12;g.beginPath();g.moveTo(0,-45);g.bezierCurveTo(-18,-36,-23,-10,-22,7);g.bezierCurveTo(-22,24,-29,28,-38,11);g.moveTo(0,-45);g.lineTo(0,-112);g.moveTo(0,-45);g.bezierCurveTo(18,-36,23,-10,22,7);g.bezierCurveTo(22,24,29,28,38,11);g.stroke();
g.beginPath();g.moveTo(-38,11);g.quadraticCurveTo(-49,-8,-46,-34);g.lineTo(-35,-20);g.lineTo(-29,-48);g.moveTo(0,-112);g.lineTo(-9,-88);g.lineTo(0,-98);g.lineTo(9,-88);g.moveTo(38,11);g.quadraticCurveTo(49,-8,46,-34);g.lineTo(35,-20);g.lineTo(29,-48);g.stroke();
g.fillStyle='#f6d77e';g.beginPath();g.ellipse(0,52,15,9,0,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(0,112,7,17,0,0,Math.PI*2);g.fill();g.strokeStyle='#fff0b2';g.lineWidth=2;g.beginPath();g.moveTo(-8,179);g.lineTo(0,197);g.lineTo(8,179);g.stroke();g.shadowBlur=0;g.restore();
if(t>1.05){g.save();g.globalAlpha=1-impact*.8;g.strokeStyle='#b9faff';g.lineWidth=2;for(let i=0;i<3;i++){g.beginPath();g.ellipse(W*.5,H*.82,(t-1.05)*W*(.09+i*.035),Math.max(2,(t-1.05)*H*.025),0,0,Math.PI*2);g.stroke()}g.restore()}}
function rain(t){g.save();g.strokeStyle='rgba(164,215,232,.22)';g.lineWidth=.8;for(let i=0;i<150;i++){let x=(i*73+t*85)%W,y=(i*47+t*210)%(H*.8);g.beginPath();g.moveTo(x,y);g.lineTo(x-5,y+13);g.stroke()}g.restore()}
function frame(now){let t=(now-start)/1000;g.clearRect(0,0,W,H);let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#020711');sky.addColorStop(.48,'#102a3c');sky.addColorStop(1,'#071827');g.fillStyle=sky;g.fillRect(0,0,W,H);
for(let i=0;i<9;i++)cloud(W*(i/8),H*(.12+(i%3)*.1),.8+(i%3)*.3,t);
g.save();let flash=(Math.sin(t*2.7)> .985)?Math.random()*.24:0;g.fillStyle='rgba(190,235,255,'+flash+')';g.fillRect(0,0,W,H);g.restore();
if(t>1.15&&t<4.8&&Math.random()<.07)lightning(R(W*.08,W*.92),0,R(H*.35,H*.72));
sea(t);rain(t);trident(t);
if(t>1.25&&t<3.8&&Math.random()<.12)lightning(R(W*.18,W*.82),0,R(H*.4,H*.74));
if(t>4.6){g.fillStyle='rgba(230,249,255,.86)';g.font='700 '+Math.max(12,W*.024)+'px system-ui';g.textAlign='center';g.fillText('THE STORM HAS BEEN UNLEASHED',W/2,H*.12)}
requestAnimationFrame(frame)}
function soundFX(){if(!sound||played)return;played=true;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let n=ac.currentTime;function tone(f,d,type,v,delay){let o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,n+delay);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*.35),n+delay+d);a.gain.setValueAtTime(.001,n+delay);a.gain.linearRampToValueAtTime(v,n+delay+.06);a.gain.exponentialRampToValueAtTime(.001,n+delay+d);o.connect(a);a.connect(ac.destination);o.start(n+delay);o.stop(n+delay+d)}tone(78,1.7,'sawtooth',.12,0);tone(43,2.2,'sine',.2,1);tone(520,.5,'triangle',.045,1.1);tone(110,1.4,'sawtooth',.07,1.3)}catch(e){}}
function restart(){start=performance.now();played=false;soundFX()}document.querySelector('#replay').addEventListener('click',restart);soundBtn.addEventListener('click',()=>{sound=!sound;soundBtn.textContent='♫ SOUND: '+(sound?'ON':'OFF');soundBtn.setAttribute('aria-pressed',String(sound));if(sound){played=false;soundFX()}});requestAnimationFrame(frame);
})();
</script></body></html>
