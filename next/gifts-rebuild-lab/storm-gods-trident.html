<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storm God's Trident | TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#020811;color:#effaff;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:12px}.frame{width:min(100%,1060px);background:#071521;border:1px solid #34556a;border-radius:18px;overflow:hidden;box-shadow:0 25px 90px #000}header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}.eyebrow{font-size:10px;letter-spacing:.22em;color:#9bc7d9}h1{font-size:clamp(20px,4vw,30px);margin:4px 0}.tag{font-size:10px;border:1px solid #55798b;border-radius:30px;padding:6px 9px}.stage{position:relative;aspect-ratio:16/9;min-height:245px;background:#06111b}canvas{width:100%;height:100%;display:block}.caption{position:absolute;bottom:12px;left:15px;letter-spacing:.17em;font-size:10px;color:#d1f2fa;text-shadow:0 2px 8px #000}.actions{display:flex;justify-content:center;gap:10px;padding:15px;flex-wrap:wrap}button{cursor:pointer;border:1px solid #65879b;border-radius:30px;padding:11px 20px;background:#112e42;color:white;font-weight:750}button.primary{background:linear-gradient(120deg,#98703a,#f0d999);border:0;color:#19232b}.note{text-align:center;color:#8faab8;font-size:11px;padding:0 15px 16px}
</style></head><body><main class="frame"><header><div><div class="eyebrow">TIKNATION · GIFT REBUILD LAB</div><h1>THE STORM GOD’S TRIDENT</h1></div><span class="tag">STANDALONE PREVIEW</span></header><div class="stage"><canvas id="art" aria-label="Ornate golden trident above a turbulent ocean wave during a thunderstorm"></canvas><div class="caption">THE SEA ANSWERS THE CALL</div></div><div class="actions"><button class="primary" id="again">↻ REPLAY GIFT</button><button id="audio">♫ SOUND: OFF</button></div><div class="note">Sound is off until enabled. Standalone preview — not yet in the live gift catalog.</div></main>
<script>
(()=>{const c=document.querySelector('#art'),x=c.getContext('2d'),again=document.querySelector('#again'),audioBtn=document.querySelector('#audio');let W,H,D,t0=performance.now(),sound=false,heard=false,ac;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let r=c.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function poly(pts,fill,stroke,width=1){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=width;x.stroke()}}
function bolt(sx,sy,ex,ey,alpha=1){let pts=[[sx,sy]],n=9;for(let i=1;i<n;i++){let f=i/n;pts.push([sx+(ex-sx)*f+rand(-17,17),sy+(ey-sy)*f])}pts.push([ex,ey]);x.save();x.globalAlpha=alpha;x.shadowColor='#8ceaff';x.shadowBlur=18;x.strokeStyle='#d6faff';x.lineWidth=2.5;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.shadowBlur=0;x.strokeStyle='#fff';x.lineWidth=.7;x.stroke();x.restore()}
function sky(t){let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#030914');bg.addColorStop(.55,'#173346');bg.addColorStop(1,'#071b2b');x.fillStyle=bg;x.fillRect(0,0,W,H);
for(let j=0;j<8;j++){let cy=H*(.08+(j%4)*.1),cx=W*(j/7);x.save();x.translate(cx,cy);let cg=x.createRadialGradient(0,0,2,0,0,W*.22);cg.addColorStop(0,'rgba(5,13,24,.94)');cg.addColorStop(.65,'rgba(13,30,43,.72)');cg.addColorStop(1,'rgba(12,29,42,0)');x.fillStyle=cg;x.beginPath();x.ellipse(0,0,W*.22,H*.13,0,0,7);x.fill();x.restore()}
let glow=x.createRadialGradient(W*.56,H*.53,0,W*.56,H*.53,H*.5);glow.addColorStop(0,'rgba(128,222,239,.16)');glow.addColorStop(1,'rgba(1,9,17,0)');x.fillStyle=glow;x.fillRect(0,0,W,H);
if(t>1.1&&t<4.8&&Math.random()<.045){let sx=rand(W*.08,W*.9);bolt(sx,0,sx+rand(-60,60),H*rand(.28,.67),.9)}
}
function water(t){let horizon=H*.62;x.fillStyle='#09283b';x.fillRect(0,horizon,W,H-horizon);
for(let layer=0;layer<6;layer++){let y=horizon+layer*H*.055;x.beginPath();for(let px=0;px<=W+3;px+=4){let yy=y+Math.sin(px*.012-t*(1.2+layer*.12)+layer)*3+Math.sin(px*.029+t*.8)*1.4;px?x.lineTo(px,yy):x.moveTo(px,yy)}x.strokeStyle='rgba(144,221,238,'+(.2-layer*.022)+')';x.lineWidth=1.2+layer*.3;x.stroke()}
let grow=clamp((t-1.1)/1.7,0,1);if(grow<=0)return;
x.save();x.globalAlpha=grow;
let wave=x.createLinearGradient(0,H*.28,0,H*.92);wave.addColorStop(0,'#efffff');wave.addColorStop(.07,'#8de2e9');wave.addColorStop(.19,'#278ca4');wave.addColorStop(.48,'#0b5877');wave.addColorStop(1,'#03192d');
x.beginPath();x.moveTo(0,H*.84);x.bezierCurveTo(W*.12,H*.69,W*.17,H*.47,W*.31,H*.58);x.bezierCurveTo(W*.39,H*.67,W*.39,H*.27,W*.53,H*.24);x.bezierCurveTo(W*.64,H*.2,W*.63,H*.47,W*.72,H*.44);x.bezierCurveTo(W*.84,H*.37,W*.9,H*.59,W,H*.65);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fillStyle=wave;x.shadowColor='#5bd9ed';x.shadowBlur=24;x.fill();x.shadowBlur=0;x.strokeStyle='#d6ffff';x.lineWidth=2.3;x.stroke();
for(let k=0;k<24;k++){let px=W*(.19+k*.027),py=H*(.59+Math.sin(k*1.7)*.12);x.beginPath();x.moveTo(px,py);x.bezierCurveTo(px+rand(-20,20),py-20,px+rand(-20,20),py-35,px+rand(-25,25),py-rand(35,65));x.strokeStyle='rgba(224,255,255,'+rand(.22,.7)+')';x.lineWidth=rand(1,3);x.stroke()}
x.restore()}
function trident(t){let enter=clamp(t/.85,0,1),strike=clamp((t-1.03)/.24,0,1),s=Math.min(1,W/820);x.save();x.translate(W*.5,H*(.08+(1-enter)*.28));x.scale(s,s);x.rotate((1-enter)*-.12);
let metal=x.createLinearGradient(-34,0,34,0);metal.addColorStop(0,'#382719');metal.addColorStop(.13,'#8d5a25');metal.addColorStop(.29,'#f5d58a');metal.addColorStop(.42,'#fff4c9');metal.addColorStop(.57,'#a66c2d');metal.addColorStop(.78,'#f3d58a');metal.addColorStop(1,'#4a301c');
x.shadowColor='#e9bd66';x.shadowBlur=16;x.lineCap='round';x.lineJoin='round';x.strokeStyle=metal;x.fillStyle=metal;
// solid shaft and tapered butt cap
x.lineWidth=15;x.beginPath();x.moveTo(0,-82);x.lineTo(0,182);x.stroke();x.lineWidth=3;x.strokeStyle='rgba(255,245,204,.85)';x.beginPath();x.moveTo(-3,-65);x.lineTo(-3,165);x.stroke();
poly([[-8,175],[0,202],[8,175]],metal,'#f6d98c',1.5);
// heavy cast collar
x.fillStyle=metal;x.beginPath();x.ellipse(0,51,19,11,0,0,7);x.fill();x.strokeStyle='#fff0b4';x.lineWidth=2;x.beginPath();x.ellipse(0,51,19,11,0,0,7);x.stroke();
// three distinct curved prongs
x.strokeStyle=metal;x.lineWidth=15;x.beginPath();x.moveTo(0,-42);x.bezierCurveTo(-15,-38,-25,-19,-24,5);x.bezierCurveTo(-24,25,-34,31,-43,9);x.moveTo(0,-42);x.lineTo(0,-126);x.moveTo(0,-42);x.bezierCurveTo(15,-38,25,-19,24,5);x.bezierCurveTo(24,25,34,31,43,9);x.stroke();
poly([[-43,9],[-52,-25],[-39,-12],[-31,-55],[-23,-20]],metal,'#f6dc9c',1.2);poly([[-9,-119],[0,-146],[9,-119],[0,-127]],metal,'#fff0b2',1.2);poly([[43,9],[52,-25],[39,-12],[31,-55],[23,-20]],metal,'#f6dc9c',1.2);
// decorative engraved bands and gems
x.strokeStyle='#fff0b2';x.lineWidth=2;for(let yy of [-63,69,78,150]){x.beginPath();x.moveTo(-8,yy);x.lineTo(8,yy);x.stroke()}
x.fillStyle='#5ad9f1';x.shadowColor='#5ad9f1';x.shadowBlur=12;x.beginPath();x.arc(0,51,4.5,0,7);x.fill();x.shadowBlur=0;x.restore();
if(t>1.03){x.save();x.globalAlpha=1-strike*.85;x.strokeStyle='#d3fcff';x.lineWidth=2;for(let i=0;i<4;i++){x.beginPath();x.ellipse(W*.5,H*.83,(t-1.03)*W*(.07+i*.033),Math.max(2,(t-1.03)*H*.025),0,0,7);x.stroke()}x.restore()}}
function spray(t){if(t<1.2)return;x.save();for(let i=0;i<100;i++){let f=(i*37.7+t*48)%100/100,px=(i*83.1+Math.sin(t+i)*17)%W,py=H*(.48+f*.42);x.fillStyle='rgba(210,249,255,'+(1-f)*.38+')';x.beginPath();x.ellipse(px,py,1+f*1.8,2+f*4,-.25,0,7);x.fill()}x.restore()}
function rain(t){x.save();x.strokeStyle='rgba(177,218,235,.24)';x.lineWidth=.8;for(let i=0;i<180;i++){let px=(i*71+t*95)%W,py=(i*43+t*225)%(H*.84);x.beginPath();x.moveTo(px,py);x.lineTo(px-5,py+13);x.stroke()}x.restore()}
function render(now){let t=(now-t0)/1000;x.clearRect(0,0,W,H);sky(t);water(t);spray(t);rain(t);trident(t);if(t>4.4){x.fillStyle='#e4faff';x.font='700 '+Math.max(12,W*.023)+'px system-ui';x.textAlign='center';x.fillText('THE STORM HAS BEEN UNLEASHED',W/2,H*.13)}requestAnimationFrame(render)}
function soundFX(){if(!sound||heard)return;heard=true;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let n=ac.currentTime;function thump(f,d,v,delay,type){let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,n+delay);o.frequency.exponentialRampToValueAtTime(Math.max(28,f*.3),n+delay+d);g.gain.setValueAtTime(.001,n+delay);g.gain.linearRampToValueAtTime(v,n+delay+.04);g.gain.exponentialRampToValueAtTime(.001,n+delay+d);o.connect(g);g.connect(ac.destination);o.start(n+delay);o.stop(n+delay+d)}thump(68,1.8,.13,0,'sawtooth');thump(42,2.4,.2,1,'sine');thump(540,.5,.04,1.1,'triangle');thump(95,1.5,.08,1.3,'sawtooth')}catch(e){}}
function replay(){t0=performance.now();heard=false;soundFX()}again.addEventListener('click',replay);audioBtn.addEventListener('click',()=>{sound=!sound;audioBtn.textContent='♫ SOUND: '+(sound?'ON':'OFF');if(sound){heard=false;soundFX()}});requestAnimationFrame(render)})();
</script></body></html>
