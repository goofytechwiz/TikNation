<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THE WEEPING ANGEL · TikNation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0e;color:#eee;font-family:system-ui,sans-serif}#scene{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:18px;pointer-events:none;text-shadow:0 2px 12px #000}.top{display:flex;justify-content:space-between}.eyebrow{font-size:10px;letter-spacing:.22em;color:#c4b89f}.title{font-weight:900;letter-spacing:.15em;font-size:clamp(21px,4vw,32px)}#status{text-align:right;font-size:11px;letter-spacing:.1em}.foot{text-align:center;pointer-events:auto}.hint{font-size:12px;margin:0 0 12px}.buttons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.buttons button{border:1px solid #b3a58c;background:#17191d;color:#eee;padding:13px 17px;font-weight:800;letter-spacing:.1em;touch-action:manipulation}.buttons .primary{background:#d1c2a6;color:#17130d}#error{color:#ffb8a8;font-size:12px}
</style></head><body><div id="scene"></div><div class="hud"><div class="top"><div><div class="eyebrow">TIKNATION · HORROR GIFT LAB</div><div class="title">THE WEEPING ANGEL</div></div><div id="status">THE CHAPEL IS SILENT<br>3D PREVIEW · AUDIO OFF</div></div><div class="foot"><p class="hint" id="hint">A marble guardian waits in the ruined chapel.</p><div class="buttons"><button class="primary" id="go">UNLEASH THE ANGEL</button><button id="reset">RESET</button><button id="snd">SOUND: OFF</button><div id="error"></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{const host=document.getElementById('scene'),status=document.getElementById('status'),hint=document.getElementById('hint');if(!window.THREE){document.getElementById('error').textContent='3D library failed to load. Refresh when connected.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090d15);scene.fog=new THREE.Fog(0x090d15,9,24);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,80);camera.position.set(0,2.2,10.5);camera.lookAt(0,2.2,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9daec8,0x211a18,1.25));const moon=new THREE.DirectionalLight(0xc5d7ee,3.0);moon.position.set(-4,8,5);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);const warm=new THREE.PointLight(0xb88c59,45,14);warm.position.set(3,3,2);scene.add(warm);
const stone=new THREE.MeshStandardMaterial({color:0xaaa396,roughness:.92}),edge=new THREE.MeshStandardMaterial({color:0x706e69,roughness:.95}),dark=new THREE.MeshStandardMaterial({color:0x17191c,roughness:.8}),eye=new THREE.MeshStandardMaterial({color:0x050607,roughness:.25}),dust=new THREE.MeshStandardMaterial({color:0xc5bba9,roughness:1});
function mesh(geo,mat,parent,x,y,z,sx=1,sy=1,sz=1){let m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
const floor=mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x28272a,roughness:1}),scene,0,0,0);floor.rotation.x=-Math.PI/2;
for(let x of [-4.7,4.7]){mesh(new THREE.BoxGeometry(.6,7,.65),edge,scene,x,3,-1);mesh(new THREE.BoxGeometry(1,.25,1),stone,scene,x,6.6,-1)}
// distant pointed stained glass
const windowGroup=new THREE.Group();scene.add(windowGroup);windowGroup.position.set(0,4.1,-4.5);mesh(new THREE.PlaneGeometry(3.8,4.5),new THREE.MeshBasicMaterial({color:0x25465a}),windowGroup,0,0,0);for(let x of [-1.2,-.4,.4,1.2])mesh(new THREE.BoxGeometry(.045,4.5,.06),edge,windowGroup,x,0,.02);mesh(new THREE.BoxGeometry(3.8,.05,.06),edge,windowGroup,0,0,.02);
// statue pedestal and body
const statue=new THREE.Group();scene.add(statue);statue.position.set(0,0,0);
mesh(new THREE.BoxGeometry(2.2,.45,1.6),edge,statue,0,.23,0);mesh(new THREE.BoxGeometry(1.8,.18,1.3),stone,statue,0,.53,0);
const robe=mesh(new THREE.CylinderGeometry(.36,.72,2.45,12,1),stone,statue,0,1.85,0);robe.rotation.z=-.03;
mesh(new THREE.SphereGeometry(.57,24,18),stone,statue,0,2.85,0,1,.85,.72);
mesh(new THREE.CylinderGeometry(.17,.2,.4,12),stone,statue,0,3.35,0);
const head=new THREE.Group();statue.add(head);head.position.set(0,3.82,0);
mesh(new THREE.SphereGeometry(.43,32,24),stone,head,0,0,0,.82,1.15,.82);
mesh(new THREE.SphereGeometry(.44,24,16,0,Math.PI*2,0,Math.PI*.48),dark,head,0,.2,-.015,1.04,1.02,1.02);
for(let x of [-.16,.16]){mesh(new THREE.SphereGeometry(.09,16,12),edge,head,x,.04,.34,1,.55,.45);mesh(new THREE.SphereGeometry(.042,12,8),eye,head,x,.04,.39,1,.7,.5)}
mesh(new THREE.ConeGeometry(.095,.26,8),stone,head,0,-.08,.39);
mesh(new THREE.BoxGeometry(.18,.035,.035),dark,head,0,-.23,.365);
// wings built from 3D overlapping feather forms, hinged and animated
function makeWing(side){const pivot=new THREE.Group();statue.add(pivot);pivot.position.set(side*.36,3.0,-.12);const base=mesh(new THREE.SphereGeometry(.28,16,12),edge,pivot,side*.35,.12,-.08,1.1,1.5,.55);
for(let row=0;row<4;row++){for(let i=0;i<7-row;i++){let u=i/6,x=side*(.18+u*.95),y=.12-row*.22-u*.06;let feather=mesh(new THREE.CapsuleGeometry(.105,.72+(i*.045),5,8),row%2?stone:edge,pivot,x,y,-.04-row*.018,.72,1.0,.42);feather.rotation.z=side*(-.65-u*.4);feather.rotation.x=-.12;}}
for(let i=0;i<9;i++){let u=i/8;let f=mesh(new THREE.CapsuleGeometry(.12,1.25,5,10),i%2?stone:edge,pivot,side*(.48+u*.58),-.45-u*.48,-.12,.7,1.12,.42);f.rotation.z=side*(-.9-u*.52);f.rotation.x=-.12}
return pivot}
const left=makeWing(-1),right=makeWing(1);left.rotation.z=-.12;right.rotation.z=.12;
const dustGroup=new THREE.Group();scene.add(dustGroup);for(let i=0;i<85;i++){let p=mesh(new THREE.IcosahedronGeometry(.018+Math.random()*.035,0),dust,dustGroup,(Math.random()-.5)*7,Math.random()*5,(Math.random()-.5)*4);p.userData.v=(.2+Math.random()*.7)}
let started=0,active=false,audio=false,ac,master;function noise(duration,volume,low,high){if(!audio||!ac)return;let n=Math.floor(ac.sampleRate*duration),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.5);let s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.setValueAtTime(low,ac.currentTime);f.frequency.exponentialRampToValueAtTime(high,ac.currentTime+duration);f.Q.value=.7;g.gain.setValueAtTime(volume,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);s.connect(f).connect(g).connect(master);s.start();s.stop(ac.currentTime+duration)}
function tone(freq,duration,volume){if(!audio||!ac)return;let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.45,ac.currentTime+duration);g.gain.setValueAtTime(volume,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);o.connect(g).connect(master);o.start();o.stop(ac.currentTime+duration)}
function enable(){if(!ac){ac=new AudioContext();master=ac.createGain();master.gain.value=.8;master.connect(ac.destination)}ac.resume();audio=true;document.getElementById('snd').textContent='SOUND: ON'}
document.getElementById('snd').onclick=()=>{if(!audio)enable();else{audio=false;master.gain.setTargetAtTime(0,ac.currentTime,.04);document.getElementById('snd').textContent='SOUND: OFF'}};
document.getElementById('go').onclick=()=>{if(!audio)enable();if(active)return;active=true;started=performance.now();noise(2.8,.24,75,28);tone(54,3,.12);status.textContent='SOMETHING IS MOVING'};
document.getElementById('reset').onclick=()=>{active=false;left.rotation.z=-.12;right.rotation.z=.12;head.rotation.y=0;statue.position.set(0,0,0);hint.textContent='A marble guardian waits in the ruined chapel.';status.textContent='THE CHAPEL IS SILENT'};
function animate(t){requestAnimationFrame(animate);let e=active?(t-started)/1000:0;let open=active?THREE.MathUtils.clamp((e-1.4)/3.8,0,1):0;left.rotation.z=-.12-open*.78;right.rotation.z=.12+open*.78;head.rotation.y=active?THREE.MathUtils.clamp((e-2)/2,0,1)*.5:0;statue.position.z=active?-Math.min(.9,e*.12):0;warm.intensity=active&&e<5?Math.random()*38+8:45;
if(active&&e>1&&e<5){hint.textContent='The stone feathers grind apart as the wings unfold.';status.textContent='WINGS UNFOLDING';if(Math.random()<.025)noise(.8,.09,380,95)}
if(active&&e>5&&e<5.2){noise(1.7,.34,180,30);tone(38,1.8,.2);hint.textContent='The wings crash open. The chapel shakes.';status.textContent='THE ANGEL IS AWAKE'}
if(active&&e>5.2&&e<5.3){renderer.domElement.style.transform='translate(4px,-3px)'}
if(active&&e>5.4)renderer.domElement.style.transform='';
if(active&&e>10){active=false;hint.textContent='It has stopped moving. Its eyes remain fixed on you.';status.textContent='THE CHAPEL IS SILENT'}
dustGroup.children.forEach(p=>{p.position.y+=Math.sin(t*.0004+p.id)*.001*p.userData.v;if(p.position.y>5)p.position.y=.3});renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
