<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THE WEEPING ANGEL · TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#f1e8d9;font-family:system-ui,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;inset:0;z-index:20;pointer-events:auto;display:flex;flex-direction:column;justify-content:space-between;padding:18px;pointer-events:none}.head{display:flex;justify-content:space-between;text-shadow:0 2px 10px #000}.eyebrow{font-size:10px;letter-spacing:.22em;color:#c0ad8e}.title{font-size:clamp(20px,4vw,32px);font-weight:850;letter-spacing:.15em}.status{text-align:right;font-size:11px;letter-spacing:.12em;color:#d6c8b0}.foot{position:relative;z-index:30;pointer-events:auto;text-align:center}.hint{font-size:12px;margin:0 0 13px;text-shadow:0 2px 8px #000}.buttons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.buttons button{position:relative;z-index:31;pointer-events:auto;touch-action:manipulation;cursor:pointer;padding:13px 17px;background:#19191b;color:#eee1cd;border:1px solid #9c8d75;border-radius:3px;font-weight:800;letter-spacing:.1em}.buttons .primary{background:#d5c3a2;color:#15120d}.veil{position:absolute;inset:0;background:#020307;opacity:0;pointer-events:none}
</style></head><body><canvas id="c"></canvas><div class="veil" id="veil"></div><div class="hud"><div class="head"><div><div class="eyebrow">TIKNATION · HORROR GIFT LAB</div><div class="title">THE WEEPING ANGEL</div></div><div class="status" id="status">THE CHAPEL IS SILENT<br>PREVIEW · AUDIO OFF</div></div><div class="foot"><p class="hint" id="hint">A stone angel stands beneath the shattered stained glass.</p><div class="buttons"><button class="primary" id="go">UNLEASH THE ANGEL</button><button id="reset">RESET</button><button id="snd">SOUND: OFF</button></div></div></div>
<script>
(()=>{const c=document.getElementById('c'),g=c.getContext('2d'),veil=document.getElementById('veil'),status=document.getElementById('status'),hint=document.getElementById('hint');let W,H,dpr=1,phase=0,startTime=0,audio=false,ac,master,shake=0,shards=[],slam=false;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
function sound(f,d,v,type='sawtooth',end=f*.35){if(!audio||!ac)return;const now=ac.currentTime,n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),data=b.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.7);let src=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();src.buffer=b;filter.type='bandpass';filter.frequency.setValueAtTime(f,now);filter.frequency.exponentialRampToValueAtTime(Math.max(35,end),now+d);filter.Q.value=type==='square'?1.2:.55;gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(v,now+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+d);src.connect(filter).connect(gain).connect(master);src.start(now);src.stop(now+d+.02);let o=ac.createOscillator(),og=ac.createGain();o.type='sine';o.frequency.setValueAtTime(Math.max(24,f*.42),now);o.frequency.exponentialRampToValueAtTime(Math.max(22,end*.5),now+d);og.gain.setValueAtTime(v*.22,now);og.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(og).connect(master);o.start(now);o.stop(now+d+.02)}
function rumble(){if(!audio)return;let n=ac.sampleRate*.9,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);let s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=115;v.gain.setValueAtTime(.22,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.9);s.connect(f).connect(v).connect(master);s.start()}
function enable(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.8;master.connect(ac.destination)}ac.resume();audio=true;document.getElementById('snd').textContent='SOUND: ON'}
function start(){if(phase)return;phase=1;startTime=performance.now();slam=false;shards=[];status.innerHTML='IT HAS MOVED · DO NOT BLINK';hint.textContent='The lights stutter. The statue is closer.';if(audio){rumble();sound(74,2.8,.24,'sawtooth',31);sound(190,1.4,.12,'triangle',65)}}
document.getElementById('go').addEventListener('click',()=>{try{if(!audio)enable();start()}catch(e){status.textContent='START ERROR: '+e.message}});
document.getElementById('reset').addEventListener('click',()=>{phase=0;shards=[];shake=0;slam=false;veil.style.opacity=0;status.innerHTML='THE CHAPEL IS SILENT<br>PREVIEW · '+(audio?'AUDIO ON':'AUDIO OFF');hint.textContent='A stone angel stands beneath the shattered stained glass.'});
document.getElementById('snd').addEventListener('click',()=>{try{if(!audio)enable();else{audio=false;master.gain.setTargetAtTime(0,ac.currentTime,.04);document.getElementById('snd').textContent='SOUND: OFF'}}catch(e){status.textContent='AUDIO ERROR: '+e.message}});
window.addEventListener('error',e=>{status.textContent='PREVIEW ERROR: '+e.message});
function poly(points,fill,stroke='#393632',lw=2){g.beginPath();points.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function angel(el){let approach=Math.max(0,Math.min(1,(el-1)/5)),spread=Math.max(0,Math.min(1,(el-2.7)/2.6)),turn=Math.max(0,Math.min(1,(el-1.3)/1.8));let unit=Math.min(W/480,H/560)*(.76+.48*approach),floor=H*.86;
g.save();g.translate(W/2,floor+approach*18);g.scale(unit,unit);
 // Anatomically layered wings with individually sculpted flight feathers
for(let side of [-1,1]){g.save();g.translate(side*29,-255);g.rotate(side*(.04+spread*.42));const open=spread;let wing=g.createLinearGradient(0,-10,side*165,-160);wing.addColorStop(0,'#aaa294');wing.addColorStop(.42,'#77766f');wing.addColorStop(1,'#35383a');g.beginPath();g.moveTo(0,0);g.bezierCurveTo(side*32,-48,side*65,-82,side*112,-104);g.bezierCurveTo(side*(145+open*35),-132,side*(176+open*48),-181,side*(190+open*58),-213);g.bezierCurveTo(side*(182+open*50),-151,side*(164+open*45),-88,side*(130+open*34),-36);g.bezierCurveTo(side*92,2,side*42,17,0,0);g.closePath();g.fillStyle=wing;g.fill();g.strokeStyle='#d0c5b1';g.lineWidth=2;g.stroke();for(let j=0;j<11;j++){let u=j/10,ex=side*(65+u*(125+open*58)),ey=-45-u*(150+open*62),sx=side*(8+u*52),sy=-8-u*65;g.beginPath();g.moveTo(sx,sy);g.quadraticCurveTo(ex-side*12,ey+24,ex,ey);g.quadraticCurveTo(ex-side*9,ey+42,sx+side*8,sy+12);g.closePath();g.fillStyle=j%2?'#77766e':'#918b80';g.fill();g.strokeStyle='#c9bead';g.lineWidth=1.1;g.stroke();g.beginPath();g.moveTo(sx+side*3,sy+3);g.quadraticCurveTo((sx+ex)/2,(sy+ey)/2,ex-side*2,ey+17);g.strokeStyle='#ded2bd66';g.stroke()}for(let row=0;row<4;row++)for(let col=0;col<7-row;col++){let x=side*(12+col*12+row*5),y=-27-row*17-col*3;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+side*12,y-16,x+side*22,y-5);g.quadraticCurveTo(x+side*12,y+9,x,y);g.fillStyle=(row+col)%2?'#a39b8d':'#898478';g.fill();g.strokeStyle='#d0c5b3';g.lineWidth=.8;g.stroke()}g.restore()}
 // long carved robe and shoulders
let grad=g.createLinearGradient(-70,0,70,0);grad.addColorStop(0,'#34383a');grad.addColorStop(.45,'#aaa08f');grad.addColorStop(1,'#3b3b3a');
poly([[-38,-266],[-62,-224],[-50,-165],[-75,-4],[-49,8],[0,1],[49,8],[75,-4],[50,-165],[62,-224],[38,-266]],grad,'#d0c3ae',3);
for(let i=-2;i<=2;i++){g.strokeStyle='#ddd0ba66';g.lineWidth=3;g.beginPath();g.moveTo(i*12,-225);g.quadraticCurveTo(i*18,-125,i*15,0);g.stroke()}
 // Sculpted stone head, hood, cheekbones and readable facial structure
g.fillStyle='#8d877c';g.fillRect(-13,-296,26,39);let skin=g.createLinearGradient(-28,-350,28,-286);skin.addColorStop(0,'#c1b7a7');skin.addColorStop(.48,'#928a7e');skin.addColorStop(1,'#5f605f');g.fillStyle=skin;g.beginPath();g.moveTo(-24,-340);g.quadraticCurveTo(-31,-329,-25,-304);g.quadraticCurveTo(-17,-284,0,-283);g.quadraticCurveTo(19,-285,25,-307);g.quadraticCurveTo(30,-332,20,-348);g.quadraticCurveTo(0,-367,-20,-349);g.closePath();g.fill();g.strokeStyle='#d4cbbb';g.lineWidth=1.5;g.stroke();g.fillStyle='#303338';g.beginPath();g.moveTo(-31,-327);g.quadraticCurveTo(-43,-376,0,-374);g.quadraticCurveTo(43,-376,31,-327);g.lineTo(22,-340);g.quadraticCurveTo(0,-357,-22,-340);g.closePath();g.fill();g.strokeStyle='#a69b89';g.stroke();g.save();g.translate(turn*12,0);g.fillStyle='#514c46';g.beginPath();g.ellipse(-10,-326,7,4,0,0,Math.PI*2);g.ellipse(10,-326,7,4,0,0,Math.PI*2);g.fill();g.strokeStyle='#d1c6b5';g.lineWidth=2;g.beginPath();g.moveTo(-18,-332);g.quadraticCurveTo(-10,-338,-3,-332);g.moveTo(3,-332);g.quadraticCurveTo(10,-338,18,-332);g.stroke();g.fillStyle='#17191a';g.beginPath();g.ellipse(-10,-326,2.2,2.6,0,0,7);g.ellipse(10,-326,2.2,2.6,0,0,7);g.fill();g.strokeStyle='#5a554e';g.lineWidth=2;g.beginPath();g.moveTo(0,-323);g.lineTo(-2,-309);g.quadraticCurveTo(0,-305,4,-309);g.stroke();g.strokeStyle='#49413b';g.beginPath();g.moveTo(-7,-296);g.quadraticCurveTo(0,-293,8,-297);g.stroke();g.restore();
 // cracks carved across cheek and torso
g.strokeStyle='#272523';g.lineWidth=2;g.beginPath();g.moveTo(-20,-333);g.lineTo(-9,-319);g.lineTo(-16,-307);g.moveTo(24,-215);g.lineTo(8,-194);g.lineTo(15,-176);g.moveTo(-35,-95);g.lineTo(-14,-80);g.lineTo(-21,-62);g.stroke();
 // wing joint stone chips
for(let i=0;i<8;i++){g.fillStyle='#c1b7a5';g.fillRect(-43+i*12,-252+(i%3)*8,3,3)}
g.restore();return approach}
function draw(t){let el=phase?(t-startTime)/1000:0;g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86}
let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#080d16');bg.addColorStop(.65,'#252328');bg.addColorStop(1,'#07080b');g.fillStyle=bg;g.fillRect(0,0,W,H);
 // chapel walls and columns
g.fillStyle='#17191f';g.fillRect(W*.12,0,W*.76,H*.86);for(let side of [0,1]){let xx=side?W*.83:W*.17;g.fillStyle='#08090d';g.fillRect(xx-W*.035,0,W*.07,H*.86);g.fillStyle='#49434a';g.fillRect(xx-W*.006,0,W*.012,H*.86)}
 // pointed stained glass
let cx=W/2,gw=Math.min(W*.36,250),gh=Math.min(H*.36,230),gy=H*.06;g.save();g.translate(cx,gy);g.beginPath();g.moveTo(-gw/2,gh);g.lineTo(-gw/2,gh*.36);g.quadraticCurveTo(-gw*.4,-gh*.1,0,0);g.quadraticCurveTo(gw*.4,-gh*.1,gw/2,gh*.36);g.lineTo(gw/2,gh);g.closePath();g.clip();let glass=g.createLinearGradient(-gw/2,0,gw/2,gh);glass.addColorStop(0,'#244653');glass.addColorStop(.5,'#75544c');glass.addColorStop(1,'#263b53');g.fillStyle=glass;g.fillRect(-gw/2,0,gw,gh);for(let i=-2;i<=2;i++){g.strokeStyle='#b6a17d';g.lineWidth=4;g.beginPath();g.moveTo(i*gw/5,0);g.lineTo(i*gw/5,gh);g.stroke()}g.restore();
 // light shaft, altar and perspective floor
let light=g.createRadialGradient(cx,gy+gh,2,cx,gy+gh,W*.55);light.addColorStop(0,'#b7c8d044');light.addColorStop(1,'#b7c8d000');g.fillStyle=light;g.fillRect(0,0,W,H);let floor=H*.86;g.fillStyle='#3b3938';g.fillRect(0,floor,W,H-floor);for(let i=0;i<=16;i++){g.strokeStyle='#aaa08a26';g.beginPath();g.moveTo(cx,floor);g.lineTo(W*i/16,H);g.stroke()}g.fillStyle='#29292c';g.fillRect(cx-W*.19,floor-H*.08,W*.38,H*.08);
let approach=angel(el);
 // dust flecks and falling chips
for(let i=0;i<22;i++){let px=(i*83+t*.012)%W,py=(i*47+t*.02)%H;g.fillStyle='#ddd0b2';g.globalAlpha=.2;g.fillRect(px,py,2,2)}g.globalAlpha=1;
if(phase&&el>5.25&&!slam){slam=true;shake=24;for(let i=0;i<125;i++){let a=Math.random()*Math.PI*2,v=2+Math.random()*8;shards.push({x:cx+(Math.random()-.5)*95,y:H*.52+(Math.random()-.5)*145,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:1+Math.random()*5,life:1,rot:Math.random()*6})}if(audio){rumble();sound(58,2.4,.32,'sawtooth',29);sound(145,.9,.2,'square',48);sound(310,.35,.11,'triangle',90)}}
if(phase&&el>5.25){for(let p of shards){p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.life-=.009;g.save();g.translate(p.x,p.y);g.rotate(p.rot+=.1);g.globalAlpha=Math.max(0,p.life);g.fillStyle='#c9beaa';g.fillRect(-p.r,-p.r*.55,p.r*2,p.r);g.restore()}shards=shards.filter(p=>p.life>0)}
let flick=phase&&el>.8&&Math.sin(t*.04)>.65?Math.random()*.75:0;veil.style.opacity=flick;if(phase&&el>4.8&&el<5.5)veil.style.opacity=.35+Math.random()*.45;
if(phase&&el<2.7){hint.textContent='The lights flicker. The angel has changed position.';status.textContent='IT IS CLOSER'}else if(phase&&el<5.25){hint.textContent='Stone grinds as its wings unfold.';status.textContent='THE WINGS ARE OPENING'}else if(phase&&el<11){hint.textContent='The wings slam open. Stone fragments explode through the chapel.';status.textContent='THE ANGEL HAS AWAKENED'}
if(phase&&el>11){phase=0;shards=[];hint.textContent='It is still again. But now it faces you.';status.textContent='THE CHAPEL IS SILENT'}
g.restore();requestAnimationFrame(draw)}
requestAnimationFrame(draw);
})();
</script></body></html>
