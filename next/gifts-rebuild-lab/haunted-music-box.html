<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE HAUNTED MUSIC BOX — TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080c;color:#eee0c8;font-family:Georgia,serif}
#stage{position:relative;width:100%;height:100%;min-height:440px;background:radial-gradient(ellipse at 50% 62%,#41404a 0,#1a1b24 38%,#080a10 78%);isolation:isolate}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center}
h1{margin:clamp(20px,5vh,48px) 12px 8px;font-size:clamp(19px,4vw,34px);font-weight:400;letter-spacing:.24em;text-align:center;text-shadow:0 2px 18px #000}
.sub{font:10px Arial,sans-serif;letter-spacing:.34em;color:#c0ad8c;text-align:center}
.status{position:absolute;bottom:17%;font:10px Arial,sans-serif;letter-spacing:.28em;color:#d9c7e4;text-shadow:0 0 12px #c3a1e8;opacity:0;transition:opacity .6s;text-align:center}
.active .status{opacity:1}
.controls{position:absolute;bottom:4%;display:flex;gap:10px;pointer-events:auto}
button{border:1px solid #b89a68;background:linear-gradient(#28232a,#111117);color:#f0dfc1;padding:12px 18px;font-size:10px;letter-spacing:.16em;border-radius:2px;box-shadow:0 4px 18px #0009}
button:active{transform:translateY(1px)}
.note{position:absolute;bottom:1%;right:12px;font:9px Arial;color:#807b7a;letter-spacing:.08em}
@media(prefers-reduced-motion:reduce){.status{transition:none}}
</style></head>
<body><main id="stage"><canvas id="art"></canvas><div class="hud"><h1>THE HAUNTED MUSIC BOX</h1><div class="sub">A MELODY THAT SHOULD NEVER PLAY</div><div class="status" id="status">SHE WAS NEVER ALONE</div><div class="controls"><button id="replay">REPLAY HAUNTING</button><button id="sound">SOUND: OFF</button></div><div class="note">TAP REPLAY TO BEGIN</div></div></main>
<script>
(()=>{
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),status=document.getElementById('status');
let W=0,H=0,D=1,start=performance.now(),opened=0,haunt=0,soundOn=false,audio=null,raf=0;
const rand=(n)=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function resize(){D=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function poly(points,fill,stroke,lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill,blur=0){ctx.save();ctx.shadowColor=fill;ctx.shadowBlur=blur;ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function line(points,color,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function woodTexture(x,y,w,h,t){for(let i=0;i<90;i++){let yy=y+rand(i+3)*h,xx=x+rand(i+89)*w,len=10+rand(i+51)*w*.6;line([[xx,yy],[Math.min(x+w,xx+len),yy+(rand(i+12)-.5)*2]],'rgba(9,5,5,'+(.07+rand(i+18)*.11)+')',.5+rand(i+20)*1.3)}}
function drawRoom(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#080a11');g.addColorStop(.58,'#20212b');g.addColorStop(1,'#09090d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
let cx=W*.5;let beam=ctx.createRadialGradient(cx,H*.42,10,cx,H*.55,Math.min(W,H)*.62);beam.addColorStop(0,'rgba(211,178,121,.13)');beam.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=beam;ctx.fillRect(0,0,W,H);
for(let i=0;i<75;i++){let x=rand(i+4)*W,y=rand(i+100)*H*.65;ellipse(x,y,rand(i+300)*1.1,.8,'rgba(221,205,170,'+(.08+rand(i+500)*.18)+')')}
let floor=ctx.createLinearGradient(0,H*.72,0,H);floor.addColorStop(0,'#252027');floor.addColorStop(1,'#08090d');ctx.fillStyle=floor;ctx.fillRect(0,H*.72,W,H*.28);
}
function drawTable(cx,baseY,scale){let w=330*scale,h=24*scale,x=cx-w/2;ctx.save();ctx.shadowColor='#000';ctx.shadowBlur=28*scale;ctx.shadowOffsetY=13*scale;let g=ctx.createLinearGradient(0,baseY,0,baseY+h);g.addColorStop(0,'#755039');g.addColorStop(.18,'#38251f');g.addColorStop(1,'#100f14');rounded(x,baseY,w,h,4*scale,g,'#9b754c');ctx.restore();line([[x+12*scale,baseY+3*scale],[x+w-12*scale,baseY+3*scale]],'#d2ae7b88',1*scale)}
function drawBox(cx,by,s,t){
const bw=220*s,bh=112*s,x=cx-bw/2,y=by-bh;ctx.save();ctx.translate(0,Math.sin(t*.0015)*2*s);
ctx.shadowColor='#000';ctx.shadowBlur=24*s;ctx.shadowOffsetY=14*s;
let body=ctx.createLinearGradient(x,y,x+bw,y+bh);body.addColorStop(0,'#765036');body.addColorStop(.23,'#261a19');body.addColorStop(.52,'#563823');body.addColorStop(.8,'#1d171b');body.addColorStop(1,'#805633');
rounded(x,y,bw,bh,8*s,body,'#c29b60');ctx.shadowBlur=0;ctx.shadowOffsetY=0;
let inset=ctx.createLinearGradient(x,y,x+bw,y+bh);inset.addColorStop(0,'#bd9259');inset.addColorStop(.5,'#39271f');inset.addColorStop(1,'#d0a66b');rounded(x+8*s,y+8*s,bw-16*s,bh-16*s,5*s,'#261b1c',inset);
ctx.save();ctx.beginPath();ctx.roundRect(x+13*s,y+13*s,bw-26*s,bh-26*s,3*s);ctx.clip();woodTexture(x+13*s,y+13*s,bw-26*s,bh-26*s,t);
let front=ctx.createLinearGradient(0,y,0,y+bh);front.addColorStop(0,'#543827');front.addColorStop(.55,'#281b1c');front.addColorStop(1,'#120f14');ctx.fillStyle=front;ctx.fillRect(x+13*s,y+13*s,bw-26*s,bh-26*s);woodTexture(x+13*s,y+13*s,bw-26*s,bh-26*s,t+4);ctx.restore();
for(let i=0;i<4;i++){let yy=y+(23+i*19)*s;line([[x+17*s,yy],[x+bw-17*s,yy]],'rgba(208,167,105,.12)',.7*s)}
// ornamental brass corners and keyhole
for(let a of [[x+17*s,y+17*s,1,1],[x+bw-17*s,y+17*s,-1,1],[x+17*s,y+bh-17*s,1,-1],[x+bw-17*s,y+bh-17*s,-1,-1]]){line([[a[0],a[1]+a[3]*12*s],[a[0],a[1]],[a[0]+a[2]*12*s,a[1]]],'#d6b477',1.8*s)}
ellipse(cx,y+bh*.48,8*s,8*s,'#c5a36c',3*s);ellipse(cx,y+bh*.48,4*s,4*s,'#39271c');
line([[cx,y+bh*.48+4*s],[cx,y+bh*.48+13*s]],'#d0ae72',2*s);
// lid, pivoting up and back when opened
let ang=Math.min(1,opened)*1.78;ctx.save();ctx.translate(cx,y+5*s);ctx.rotate(-ang);
let lidG=ctx.createLinearGradient(-bw/2,-72*s,bw/2,0);lidG.addColorStop(0,'#6d4a2e');lidG.addColorStop(.4,'#251a1b');lidG.addColorStop(.7,'#634329');lidG.addColorStop(1,'#2a1c1b');
ctx.shadowColor='#000';ctx.shadowBlur=13*s;rounded(-bw/2,-76*s,bw,78*s,7*s,lidG,'#c29b60');ctx.shadowBlur=0;
rounded(-bw/2+9*s,-67*s,bw-18*s,59*s,4*s,'rgba(22,15,16,.65)','#b58b54');
ctx.save();ctx.translate(0,-38*s);ctx.rotate(Math.PI/4);ctx.strokeStyle='#d5b477';ctx.lineWidth=2*s;ctx.strokeRect(-22*s,-22*s,44*s,44*s);ctx.restore();
for(let i=0;i<5;i++)line([[-bw/2+18*s,-61*s+i*12*s],[bw/2-18*s,-61*s+i*12*s]],'rgba(216,177,115,.12)',.8*s);
ctx.restore();
if(opened>.08){let glow=ctx.createRadialGradient(cx,y-5*s,2,cx,y-15*s,90*s);glow.addColorStop(0,'rgba(210,173,226,.32)');glow.addColorStop(1,'rgba(112,82,145,0)');ctx.fillStyle=glow;ctx.fillRect(cx-110*s,y-120*s,220*s,125*s)}
ctx.restore();
}
function drawDancer(cx,by,s,t){if(opened<.25)return;let a=Math.min(1,(opened-.25)*2.3);ctx.save();ctx.translate(cx,by-112*s);ctx.scale(s*a,s*a);let rot=Math.sin(t*.0018)*.17;ctx.rotate(rot);
ellipse(0,0,17,4,'rgba(9,8,14,.5)');let metal=ctx.createLinearGradient(-9,0,9,0);metal.addColorStop(0,'#66505e');metal.addColorStop(.45,'#f0dfd2');metal.addColorStop(1,'#736078');
ctx.fillStyle=metal;ctx.beginPath();ctx.ellipse(0,-58,5,6,0,0,Math.PI*2);ctx.fill();line([[0,-51],[0,-23]],'#d9c8bd',5);line([[-1,-47],[-16,-34],[-27,-38]],'#cbb9ae',3);line([[1,-47],[15,-35],[25,-42]],'#cbb9ae',3);
let skirt=ctx.createLinearGradient(0,-31,0,-4);skirt.addColorStop(0,'#f0e4d9');skirt.addColorStop(.5,'#b9a7b6');skirt.addColorStop(1,'#716075');poly([[-4,-29],[4,-29],[20,-5],[11,-1],[-13,-1],[-20,-5]],skirt,'#e7d7ca',.8);
line([[-2,-5],[-6,25],[-15,40]],'#cfc0b8',3);line([[2,-5],[6,24],[18,34]],'#cfc0b8',3);ellipse(-15,41,5,2,'#d6c8b9');ellipse(19,35,5,2,'#d6c8b9');
ctx.restore()}
function drawGhost(cx,by,s,t){if(haunt<=0)return;let p=Math.min(1,haunt);ctx.save();ctx.translate(cx,by-250*s-Math.sin(t*.001)*9*s);ctx.globalAlpha=p*.88;ctx.shadowColor='#c6a5e9';ctx.shadowBlur=28*s;
let g=ctx.createRadialGradient(-10*s,-50*s,3*s,0,0,80*s);g.addColorStop(0,'#eee5ed');g.addColorStop(.25,'#b9a8c9');g.addColorStop(.6,'#75647f');g.addColorStop(1,'rgba(50,42,63,.08)');
ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-92*s);ctx.bezierCurveTo(58*s,-90*s,68*s,-20*s,49*s,22*s);ctx.quadraticCurveTo(65*s,57*s,36*s,45*s);ctx.quadraticCurveTo(13*s,73*s,-5*s,46*s);ctx.quadraticCurveTo(-36*s,72*s,-42*s,39*s);ctx.quadraticCurveTo(-69*s,10*s,-47*s,-42*s);ctx.quadraticCurveTo(-29*s,-88*s,0,-92*s);ctx.fill();
ctx.shadowBlur=8*s;ellipse(-17*s,-36*s,5*s,3*s,'#171320');ellipse(17*s,-36*s,5*s,3*s,'#171320');ellipse(-17*s,-36*s,2*s,1.4*s,'#f3e5ff');ellipse(17*s,-36*s,2*s,1.4*s,'#f3e5ff');
ctx.restore()}
function drawMist(cx,by,s,t){if(haunt<=0)return;ctx.save();ctx.globalAlpha=Math.min(.3,haunt*.22);for(let i=0;i<7;i++){let xx=cx+Math.sin(t*.0005+i*2)*90*s,yy=by-120*s-i*17*s;let gr=ctx.createRadialGradient(xx,yy,1,xx,yy,55*s);gr.addColorStop(0,'rgba(190,161,218,.26)');gr.addColorStop(1,'rgba(135,111,160,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(xx,yy,60*s,20*s,0,0,Math.PI*2);ctx.fill()}ctx.restore()}
function frame(now){let t=now-start;ctx.clearRect(0,0,W,H);drawRoom(t);let s=Math.min(W/520,H/700,1.18),cx=W*.5,tableY=H*.76;drawTable(cx,tableY,s);let by=tableY-5*s;drawMist(cx,by,s,t);drawGhost(cx,by,s,t);drawBox(cx,by,s,t);drawDancer(cx,by,s,t);for(let i=0;i<22;i++){if(haunt>.1){let q=(t*.0002+i/22)%1,x=cx+Math.sin(q*8+i)*70*s,y=by-80*s-q*180*s;ellipse(x,y,1.4*s,1.4*s,'rgba(215,190,241,'+(1-q)*.65+')',7*s)}}raf=requestAnimationFrame(frame)}
function play(){opened=0;haunt=0;stage.classList.remove('active');let now=performance.now();opened=0;setTimeout(()=>opened=1,550);setTimeout(()=>haunt=1,3700);setTimeout(()=>{haunt=0;opened=0;stage.classList.remove('active')},8500);setTimeout(()=>stage.classList.add('active'),3700);if(soundOn)music(); }
function music(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let seq=[523.25,659.25,783.99,659.25,587.33,440,392,523.25];seq.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;let when=audio.currentTime+i*.48;g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(.035,when+.03);g.gain.exponentialRampToValueAtTime(.0001,when+.42);o.connect(g);g.connect(audio.destination);o.start(when);o.stop(when+.45)});setTimeout(()=>{if(soundOn){let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=82;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.linearRampToValueAtTime(.055,audio.currentTime+.2);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+1.6);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+1.7)}},3700)}catch(e){}}
document.getElementById('replay').addEventListener('click',play);document.getElementById('sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent='SOUND: '+(soundOn?'ON':'OFF');if(soundOn)music()});
requestAnimationFrame(frame);play();
})();
</script></body></html>
