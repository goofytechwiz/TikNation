<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE HAUNTED MUSIC BOX · TikNation Gift Lab</title>
<style>
:root{color-scheme:dark;--gold:#d9ad61;--violet:#b18aff;--cyan:#8de9e7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 75%,#263044 0,#101522 42%,#070910 78%);font-family:Georgia,serif;color:#f4e8d0}
.stage{min-height:100vh;display:grid;place-items:center;position:relative;isolation:isolate}
.stars{position:absolute;inset:0;background-image:radial-gradient(#d8c5a0 1px,transparent 1px),radial-gradient(#8c9cae 1px,transparent 1px);background-size:83px 83px,137px 137px;background-position:0 0,35px 51px;opacity:.23}
.title{position:absolute;top:7%;text-align:center;letter-spacing:.28em;text-shadow:0 0 18px #c29a57;z-index:5}.title h1{font-size:clamp(22px,5vw,42px);font-weight:400;margin:0}.title p{font:10px Arial,sans-serif;letter-spacing:.35em;color:#b8a88f}
.pedestal{position:absolute;bottom:14%;width:min(78vw,480px);height:28px;border-radius:50%;background:radial-gradient(ellipse,#b58a4d88,#40304466 45%,transparent 72%);filter:blur(8px)}
.box{position:relative;width:240px;height:190px;transform-style:preserve-3d;animation:float 4s ease-in-out infinite;z-index:2}
.base{position:absolute;bottom:0;left:12px;width:216px;height:88px;background:linear-gradient(135deg,#583a25,#1b1720 35%,#8a6033 52%,#2b1b1b 75%,#61402b);border:3px solid #c29a57;box-shadow:0 18px 35px #000b,inset 0 0 25px #e2b65b44;border-radius:9px 9px 18px 18px}
.base:before{content:"";position:absolute;inset:9px;border:1px solid #d9b66e88;border-radius:5px}
.base:after{content:"✦";position:absolute;left:50%;top:23px;transform:translateX(-50%);font-size:29px;color:#e5c47c;text-shadow:0 0 12px #ffcf73}
.lid{position:absolute;left:12px;bottom:85px;width:216px;height:105px;transform-origin:bottom center;transform:rotateX(-5deg);transition:transform 1.2s cubic-bezier(.2,.8,.2,1);background:linear-gradient(145deg,#8c623b,#251b22 52%,#61402d);border:3px solid #d4ad66;border-radius:12px 12px 4px 4px;box-shadow:inset 0 0 24px #f6d18b33}
.lid:before{content:"";position:absolute;inset:10px;border:1px solid #e4c47c;border-radius:6px}
.lid:after{content:"";position:absolute;inset:20px 70px;border:2px solid #d9b66e;transform:rotate(45deg);box-shadow:0 0 13px #e4bd6a}
.open .lid{transform:rotateX(72deg) translateY(-5px)}
.inside{position:absolute;bottom:85px;left:20px;width:200px;height:95px;background:radial-gradient(ellipse,#a78acb99,#241c31 68%);opacity:0;transition:opacity .8s}
.open .inside{opacity:1}
.ballerina{position:absolute;bottom:85px;left:50%;width:10px;height:65px;transform:translateX(-50%) scale(0);transform-origin:bottom;z-index:4;transition:transform .8s .5s}
.open .ballerina{transform:translateX(-50%) scale(1)}
.head{position:absolute;top:0;left:2px;width:8px;height:8px;border-radius:50%;background:#e6d6bd;box-shadow:0 0 8px #fff}
.torso{position:absolute;top:9px;left:3px;width:5px;height:21px;background:linear-gradient(90deg,#d8c6a4,#806a8e);border-radius:5px}
.skirt{position:absolute;top:19px;left:-13px;width:31px;height:16px;background:linear-gradient(#eee1d0,#b5a1c5);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);filter:drop-shadow(0 0 5px #e8c9ff)}
.arm{position:absolute;top:12px;width:25px;height:3px;background:#d9c6a7;transform-origin:left;border-radius:4px}.arm.a{left:5px;transform:rotate(-40deg)}.arm.b{left:4px;transform:rotate(215deg)}
.leg{position:absolute;top:38px;width:3px;height:25px;background:#d9c6a7;transform-origin:top}.leg.a{left:4px;transform:rotate(12deg)}.leg.b{left:4px;transform:rotate(-28deg)}
.open .ballerina{animation:spin 3s linear infinite}
.ghost{position:absolute;bottom:185px;left:50%;width:110px;height:130px;transform:translateX(-50%) scale(.1);opacity:0;z-index:6;filter:drop-shadow(0 0 18px #ad8aff);transition:all 1.1s}
.ghost:before{content:"";position:absolute;inset:0 10px 0;background:radial-gradient(ellipse at 50% 36%,#e4d9f2 0 9%,#b7a4d9 10% 23%,#78649d 40%,#4c3b6b 68%,transparent 70%);border-radius:48% 48% 40% 40%;clip-path:polygon(50% 0,85% 15%,100% 50%,90% 78%,100% 100%,75% 88%,55% 100%,35% 88%,5% 100%,15% 73%,0 48%,15% 17%)}
.ghost:after{content:"";position:absolute;top:42px;left:36px;width:9px;height:6px;background:#171323;border-radius:50%;box-shadow:27px 0 #171323,0 0 8px #fff,27px 0 8px #fff}
.reveal .ghost{opacity:1;transform:translateX(-50%) scale(1);animation:ghostrise 2.4s ease-in-out infinite alternate}
.smoke{position:absolute;bottom:170px;left:50%;width:230px;height:170px;transform:translateX(-50%);opacity:0;z-index:3;background:radial-gradient(ellipse,#9b7acb66,transparent 68%);filter:blur(14px)}
.reveal .smoke{opacity:1;animation:smokepulse 2s ease-in-out infinite}
.spark{position:absolute;bottom:210px;left:50%;width:4px;height:4px;background:#e8d4ff;border-radius:50%;box-shadow:0 0 12px 3px #b58aff;opacity:0}
.reveal .spark{opacity:1;animation:spark 2.5s linear infinite}
.caption{position:absolute;bottom:25%;font:11px Arial,sans-serif;letter-spacing:.35em;color:#c4b1d9;opacity:0;transition:opacity .5s;z-index:7}.reveal .caption{opacity:1}
.controls{position:absolute;bottom:7%;display:flex;gap:12px;z-index:10}
button{background:#171521;border:1px solid #c6a66b;color:#f4e8d0;padding:12px 19px;border-radius:3px;letter-spacing:.15em;font-size:11px}button:active{transform:scale(.97)}
@keyframes float{50%{translate:0 -9px}}@keyframes spin{to{rotate:360deg}}@keyframes ghostrise{to{translate:0 -18px;scale:1.05}}@keyframes smokepulse{50%{transform:translateX(-50%) scale(1.25);opacity:.55}}@keyframes spark{0%{translate:-65px 25px;opacity:0}30%{opacity:1}100%{translate:70px -115px;opacity:0}}
@media(max-width:420px){.box{scale:.88}.caption{bottom:24%}.title{top:9%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
</style></head>
<body><main class="stage" id="stage"><div class="stars"></div>
<header class="title"><h1>THE HAUNTED MUSIC BOX</h1><p>A MELODY THAT SHOULD NEVER PLAY</p></header>
<div class="pedestal"></div><div class="box" id="box"><div class="inside"></div><div class="lid"></div><div class="base"></div><div class="ballerina"><i class="head"></i><i class="torso"></i><i class="skirt"></i><i class="arm a"></i><i class="arm b"></i><i class="leg a"></i><i class="leg b"></i></div></div>
<div class="smoke"></div><div class="ghost"></div><div class="spark"></div><div class="caption">SHE WAS NEVER ALONE</div>
<div class="controls"><button id="play">PLAY SEQUENCE</button><button id="sound">SOUND: OFF</button></div></main>
<script>
const stage=document.getElementById('stage'),play=document.getElementById('play'),sound=document.getElementById('sound');
let audio=false,ctx=null,osc=null,gain=null,timer=[];
function clear(){timer.forEach(clearTimeout);timer=[]}
function tone(freq,duration,volume=.035){if(!audio)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(volume,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration)}catch(e){}}
function sequence(){clear();stage.classList.remove('open','reveal');play.textContent='PLAYING…';tone(392,1.1,.025);timer.push(setTimeout(()=>{stage.classList.add('open');tone(523,1.5,.025)},700));timer.push(setTimeout(()=>tone(659,1.3,.02),1700));timer.push(setTimeout(()=>tone(440,1.7,.025),2700));timer.push(setTimeout(()=>{stage.classList.add('reveal');tone(110,2,.06)},4100));timer.push(setTimeout(()=>{stage.classList.remove('open','reveal');play.textContent='PLAY AGAIN';tone(73,.8,.04)},7600))}
play.addEventListener('click',sequence);sound.addEventListener('click',()=>{audio=!audio;sound.textContent='SOUND: '+(audio?'ON':'OFF');if(audio){tone(440,.2,.02)}});sequence();
</script></body></html>
