<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Haunted Music Box</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#e9d9bd}body{font-family:Georgia,serif}.scene{height:100%;position:relative;display:grid;place-items:center;isolation:isolate;background:radial-gradient(ellipse at 50% 67%,#34303a 0,#171820 35%,#090b12 73%)}.room{position:absolute;inset:0;background:linear-gradient(90deg,#0008,transparent 28%,transparent 72%,#0009),linear-gradient(0deg,#09090d 0 15%,transparent 50%);z-index:-1}.spot{position:absolute;top:-20%;left:50%;width:65vw;height:90vh;transform:translateX(-50%);background:radial-gradient(ellipse,#c4a36b18,transparent 68%);filter:blur(10px)}.heading{position:absolute;top:6%;width:100%;text-align:center;text-shadow:0 3px 20px #000}.heading h1{font-size:clamp(20px,4vw,34px);font-weight:400;letter-spacing:.24em;margin:0}.heading p{font:10px Arial;letter-spacing:.35em;color:#aa9b84;margin-top:12px}
.table{position:absolute;bottom:12%;width:min(88vw,620px);height:32px;background:linear-gradient(#49362c,#171216 55%,#08090c);border-top:2px solid #806044;box-shadow:0 25px 55px #000}.table:before{content:"";position:absolute;left:6%;right:6%;top:-10px;height:13px;border-radius:50%;background:#b28b5c33;filter:blur(8px)}
.box{position:absolute;bottom:calc(12% + 25px);width:min(64vw,330px);height:205px;perspective:900px;filter:drop-shadow(0 20px 20px #000b);animation:breath 5s ease-in-out infinite}.case{position:absolute;bottom:0;left:4%;width:92%;height:112px;border:2px solid #a47b4c;border-radius:7px 7px 13px 13px;background:repeating-linear-gradient(93deg,#271a17 0 8px,#3b2820 9px 13px,#201719 15px 20px);box-shadow:inset 0 0 18px #000, inset 0 0 3px #f2d19a,0 8px 20px #000}.case:before{content:"";position:absolute;inset:8px;border:1px solid #c49b61;border-radius:4px;box-shadow:inset 0 0 8px #000}.case:after{content:"";position:absolute;left:50%;top:24px;width:42px;height:42px;transform:translateX(-50%) rotate(45deg);border:2px solid #c5a16a;box-shadow:0 0 9px #d7b47755}.lock{position:absolute;z-index:5;left:50%;bottom:37px;transform:translateX(-50%);width:14px;height:22px;border-radius:3px;background:linear-gradient(90deg,#78502c,#e0bf7d,#74502f);border:1px solid #e7c987}
.lid{position:absolute;z-index:4;left:4%;bottom:108px;width:92%;height:93px;transform-origin:bottom;transform:rotateX(0deg);transition:transform 1.4s cubic-bezier(.2,.75,.2,1);border:2px solid #b48b54;border-radius:10px 10px 3px 3px;background:linear-gradient(160deg,#62432b,#261b1b 55%,#543522);box-shadow:inset 0 0 0 7px #30201b,inset 0 0 0 8px #b28a53,inset 0 0 22px #000}.lid:before{content:"";position:absolute;inset:15px 22%;border:1px solid #d4b77e;transform:rotate(45deg);opacity:.7}.lid:after{content:"";position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);border:1px solid #d4b77e;border-radius:50%;box-shadow:0 0 0 5px #38271e,0 0 0 6px #b48b54}.open .lid{transform:rotateX(-112deg)}
.inner{position:absolute;z-index:1;bottom:108px;left:9%;width:82%;height:92px;opacity:0;transition:opacity 1s;background:radial-gradient(ellipse at 50% 90%,#b9a0c4aa,#3a2c43 52%,#11121a 85%);box-shadow:inset 0 -20px 25px #000}.open .inner{opacity:1}
.dancer{position:absolute;z-index:3;bottom:108px;left:50%;width:60px;height:115px;transform:translateX(-50%) scale(.05);opacity:0;transition:all 1s .6s;filter:drop-shadow(0 0 8px #e2c7e8)}.open .dancer{opacity:1;transform:translateX(-50%) scale(1);animation:dance 5s linear infinite}.dancer .head{position:absolute;left:26px;top:0;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b6a7a4 60%,#4b4148)}.dancer .body{position:absolute;left:27px;top:10px;width:7px;height:31px;background:linear-gradient(90deg,#eee2d0,#716171,#ddd0c2);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}.dancer .tutu{position:absolute;left:9px;top:35px;width:43px;height:23px;background:linear-gradient(#eee5dc,#9d899d 75%,#e8d7d0);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}.dancer .arm{position:absolute;top:17px;left:29px;width:28px;height:3px;background:#cfc1b6;transform-origin:left;border-radius:4px}.dancer .arm.one{transform:rotate(-35deg)}.dancer .arm.two{transform:rotate(205deg)}.dancer .leg{position:absolute;left:29px;top:53px;width:3px;height:45px;background:#cbbdb3;transform-origin:top}.dancer .leg.one{transform:rotate(13deg)}.dancer .leg.two{transform:rotate(-26deg)}
.wraith{position:absolute;z-index:6;bottom:calc(12% + 215px);left:50%;width:150px;height:185px;transform:translate(-50%,45px) scale(.35);opacity:0;transition:all 1.5s;filter:drop-shadow(0 0 18px #b7a1d5)}.wraith:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#e6dce8 0 5%,#9f8cae 9%,#54495f 35%,#292632 65%,transparent 75%);clip-path:polygon(48% 0,67% 7%,82% 20%,91% 43%,100% 79%,79% 69%,71% 100%,50% 83%,26% 100%,22% 72%,0 85%,13% 47%,18% 23%,34% 8%)}.wraith:after{content:"";position:absolute;left:59px;top:54px;width:7px;height:4px;background:#eee5f5;border-radius:50%;box-shadow:24px 0 #eee5f5,0 0 9px #fff,24px 0 9px #fff}.reveal .wraith{opacity:.95;transform:translate(-50%,-20px) scale(1);animation:drift 3.5s ease-in-out infinite alternate}.mist{position:absolute;z-index:5;bottom:calc(12% + 170px);left:50%;width:260px;height:210px;transform:translateX(-50%);opacity:0;background:radial-gradient(ellipse,#9e8bb566,transparent 68%);filter:blur(18px);transition:opacity 1s}.reveal .mist{opacity:1;animation:mist 3s ease-in-out infinite alternate}
.controls{position:absolute;bottom:4%;display:flex;gap:10px;z-index:10}button{padding:12px 20px;color:#ead9b7;background:#171419;border:1px solid #a8895b;letter-spacing:.16em;font-size:10px;border-radius:2px}button:active{transform:scale(.97)}.status{position:absolute;bottom:20%;font:10px Arial;letter-spacing:.35em;color:#d5c2df;opacity:0;z-index:8}.reveal .status{opacity:1}
@keyframes breath{50%{translate:0 -5px}}@keyframes dance{0%,100%{rotate:0deg}25%{rotate:9deg}50%{rotate:-8deg}75%{rotate:5deg}}@keyframes drift{to{translate:0 -22px;scale:1.06}}@keyframes mist{to{transform:translateX(-50%) scale(1.25);opacity:.55}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="scene" id="scene"><div class="room"></div><div class="spot"></div><header class="heading"><h1>THE HAUNTED MUSIC BOX</h1><p>A MELODY THAT SHOULD NEVER PLAY</p></header><div class="table"></div><div class="box"><div class="inner"></div><div class="lid"></div><div class="case"><i class="lock"></i></div><div class="dancer"><i class="head"></i><i class="body"></i><i class="tutu"></i><i class="arm one"></i><i class="arm two"></i><i class="leg one"></i><i class="leg two"></i></div></div><div class="mist"></div><div class="wraith"></div><div class="status">SOMETHING IS STILL LISTENING</div><div class="controls"><button id="play">REPLAY HAUNTING</button><button id="sound">SOUND: OFF</button></div></main>
<script>
const scene=document.getElementById('scene'),play=document.getElementById('play'),sound=document.getElementById('sound');let enabled=false,ctx;const jobs=[];function note(f,d,v=.025){if(!enabled)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}function run(){jobs.forEach(clearTimeout);jobs.length=0;scene.classList.remove('open','reveal');play.textContent='SEQUENCE PLAYING';note(392,1);jobs.push(setTimeout(()=>{scene.classList.add('open');note(523,1.3)},700));jobs.push(setTimeout(()=>note(659,1.1),1800));jobs.push(setTimeout(()=>note(440,1.4),2800));jobs.push(setTimeout(()=>{scene.classList.add('reveal');note(98,2,.045)},4100));jobs.push(setTimeout(()=>{scene.classList.remove('open','reveal');play.textContent='REPLAY HAUNTING';note(73,.8,.035)},7800))}play.onclick=run;sound.onclick=()=>{enabled=!enabled;sound.textContent='SOUND: '+(enabled?'ON':'OFF');if(enabled)note(440,.25)};run();
</script></body></html>
