<style>

.sea{position:absolute;left:-8%;right:-8%;bottom:-3%;height:48%;background:linear-gradient(180deg,#174b5c 0,#092938 28%,#04121e 100%);clip-path:polygon(0 13%,8% 9%,16% 15%,24% 7%,32% 14%,40% 5%,48% 14%,56% 8%,64% 16%,72% 6%,80% 13%,88% 8%,100% 15%,100% 100%,0 100%)}

.wave.one{bottom:22%;transform:rotate(-2deg)}.wave.two{bottom:11%;animation-duration:13s;animation-direction:alternate-reverse;opacity:.7}.wave.three{bottom:2%;animation-duration:16s;opacity:.4}

.cliff{position:absolute;z-index:2;bottom:-2%;left:-5%;width:57%;height:49%;background:linear-gradient(125deg,#1a3038,#09151d 58%,#03080e);clip-path:polygon(0 25%,12% 21%,23% 28%,37% 13%,48% 17%,59% 5%,70% 14%,84% 2%,100% 11%,100% 100%,0 100%);filter:drop-shadow(20px -10px 20px #000)}

.light-beam{position:absolute;z-index:3;left:calc(32% + 95px);top:calc(77% - 333px);width:82vw;height:190px;transform-origin:0 50%;transform:rotate(0deg);background:linear-gradient(90deg,#f4ffffe8 0%,#d9ffff85 18%,#b8faff25 62%,transparent 100%);clip-path:polygon(0 46%,100% 0,100% 100%,0 54%);filter:blur(5px) drop-shadow(0 0 18px #bfffff99);opacity:0;pointer-events:none}

.tower{position:absolute;left:48px;bottom:0;width:95px;height:294px;background:linear-gradient(90deg,#293b42 0,#b9c9c5 20%,#f0eee0 49%,#aabbb8 78%,#34464c 100%);clip-path:polygon(23% 0,77% 0,100% 100%,0 100%);border-top:8px solid #263b43}

.door{position:absolute;bottom:0;left:81px;width:30px;height:58px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,#101d22,#40575a,#0c171c);border:2px solid #a6b9b3}
.window{position:absolute;left:83px;bottom:132px;width:25px;height:45px;border-radius:50% 50% 3px 3px;background:#07141c;border:3px solid #b8c8bf;box-shadow:inset 0 0 10px #b9ffff55}
.lantern{position:absolute;left:37px;bottom:292px;width:117px;height:83px;border:8px solid #354b53;border-bottom-width:6px;background:linear-gradient(90deg,#152a32aa,#b5faff26,#14252caa);box-shadow:inset 0 0 18px #c4ffff55,0 0 24px #bfffff33}
.lantern:before{content:"";position:absolute;left:-9px;right:-9px;top:-12px;height:12px;background:linear-gradient(90deg,#263b43,#8ca5a6,#263b43);border-radius:3px}
.lantern:after{content:"";position:absolute;left:-12px;right:-12px;bottom:-12px;height:10px;background:linear-gradient(90deg,#1b2d35,#849a9b,#1b2d35)}
.lens{position:absolute;left:50%;top:50%;width:17px;height:60px;transform:translate(-50%,-50%);transform-style:preserve-3d;animation:lens 3.2s linear infinite;opacity:.15;transition:opacity .5s}
.lens:before,.lens:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(90deg,#7cecff,#fff,#79e8ff);box-shadow:0 0 15px #bfffff,0 0 32px #7beeff}
.lens:after{transform:rotateY(90deg);opacity:.7}
.lantern.lit .lens{opacity:1}
@keyframes lens{to{transform:translate(-50%,-50%) rotateY(-360deg)}}
.roof{position:absolute;left:34px;bottom:367px;width:123px;height:35px;background:linear-gradient(90deg,#24373e,#91a7a5,#293e44);clip-path:polygon(50% 0,100% 100%,0 100%)}
.finial{position:absolute;left:91px;bottom:397px;width:8px;height:22px;background:#b9c7c1;border-radius:5px}
.ship{position:absolute;z-index:3;right:11%;bottom:26%;width:260px;height:150px;animation:drift 7s ease-in-out infinite alternate;filter:drop-shadow(0 0 20px #9defff35)}
@keyframes drift{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-13px) rotate(1deg)}}
.hull{position:absolute;bottom:0;left:0;width:100%;height:44px;background:linear-gradient(#1b303a,#050c12);clip-path:polygon(0 0,100% 0,83% 100%,17% 100%);border-top:2px solid #8aefff}
.mast{position:absolute;bottom:36px;left:50%;width:3px;height:116px;background:#172c36;box-shadow:0 0 6px #b3ffff55}
.sail{position:absolute;bottom:65px;left:calc(50% - 63px);width:62px;height:88px;background:linear-gradient(135deg,#d5ffffaa,#47798555 65%,#0b1b25aa);clip-path:polygon(100% 0,90% 88%,0 100%,20% 18%);border:1px solid #d6ffff55;filter:drop-shadow(0 0 8px #aaffff88);animation:sail 4s ease-in-out infinite alternate}
.sail.second{left:calc(50% + 4px);width:53px;height:69px;bottom:55px;transform:scaleX(-1);animation-delay:-2s}
@keyframes sail{to{transform:skewY(7deg) scaleX(.92);opacity:.55}}
.souls{position:absolute;bottom:35px;left:40%;width:120px;height:40px;background:radial-gradient(ellipse,#8ffaff55,transparent 70%);filter:blur(7px)}
.fog{position:absolute;z-index:5;left:-15%;right:-15%;height:22%;background:linear-gradient(90deg,transparent,#c9faff1c 25%,#c9faff28 50%,#c9faff0d 80%,transparent);filter:blur(16px);animation:fog 18s linear infinite}
.fog.a{bottom:27%}.fog.b{bottom:43%;opacity:.5;animation-duration:25s;animation-direction:reverse}
@keyframes fog{from{transform:translateX(-15%)}to{transform:translateX(15%)}}
.lightning{position:absolute;z-index:7;inset:0;background:#d8ffff;opacity:0;pointer-events:none}
.lightning.flash{animation:flash .55s ease-out}@keyframes flash{0%,100%{opacity:0}12%{opacity:.45}25%{opacity:.04}40%{opacity:.22}55%{opacity:0}}
.grain{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")}
.overlay{position:absolute;z-index:9;inset:auto 0 0;padding:40px 20px 24px;text-align:center;background:linear-gradient(transparent,#020910e8 45%,#020910)}
.eyebrow{font-size:10px;letter-spacing:.42em;color:#9eeeff;text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(27px,5vw,48px);letter-spacing:.16em;margin:0;text-shadow:0 0 24px #9cf8ff66;font-weight:650}
.sub{font-size:12px;letter-spacing:.12em;color:#b9d0d5;margin:10px 0 20px}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
button{appearance:none;border:1px solid #9defff8c;color:#eaffff;background:linear-gradient(135deg,#153c4bdf,#091b27ee);padding:13px 18px;border-radius:3px;font-size:10px;font-weight:800;letter-spacing:.18em;cursor:pointer;box-shadow:0 0 22px #6ceeff12;transition:.2s}
button:hover{background:#24586a;box-shadow:0 0 24px #75edff44;transform:translateY(-1px)}
button.primary{background:linear-gradient(120deg,#b8faff,#5fb7c7);color:#06151e;border-color:#dfffff}
.status{height:17px;margin-top:12px;font-size:10px;letter-spacing:.16em;color:#9bbdc5}
.note{position:relative;z-index:10;text-align:center;font-size:9px;letter-spacing:.12em;color:#68818a;padding:0 12px 18px;background:#020910}
@media(max-width:620px){.stage{min-height:650px;height:100svh}.lighthouse{left:16%;bottom:28%;transform:scale(.82);transform-origin:bottom left}.ship{right:-4%;bottom:30%;transform:scale(.76);transform-origin:bottom right}.moon{right:13%;top:13%;width:75px;height:75px}.light-beam{left:32%;width:85%;top:28%}.overlay{padding-bottom:22px}.top{padding:14px 13px;font-size:8px}button{padding:12px 13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style></head>
<body>
<div class="stage" id="stage">
<div class="sky"></div><div class="stars"></div><div class="moon"></div>
<div class="light-beam" id="beam"></div><div class="sea"></div>
<div class="wave one"></div><div class="wave two"></div><div class="wave three"></div>

</div>
<div class="ship"><div class="mast"></div><div class="sail"></div><div class="sail second"></div><div class="souls"></div><div class="hull"></div></div>
<div class="fog a"></div><div class="fog b"></div><div class="lightning" id="lightning"></div><div class="grain"></div>
<div class="top"><b>TIKNATION · GIFT LAB</b><span>LEGENDARY GIFT PREVIEW</span></div>

<div class="eyebrow">A signal from the forgotten coast</div>
<h1>PHANTOM LIGHTHOUSE</h1>

<div class="actions">
<button class="primary" id="awaken">AWAKEN THE LIGHT</button>
<button id="storm">SUMMON THE STORM</button>

</div>

</div></div>
<div class="note">INDEPENDENT VISUAL PREVIEW · SOUND STARTS ONLY AFTER YOU TAP</div>
<script>
(()=>{const $=id=>document.getElementById(id);let ctx=null,master=null,active=false;
function audio(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.24;master.connect(ctx.destination)}if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(freq,dur,type="sine",gain=.08,when=0){const c=audio(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime+when);g.gain.setValueAtTime(.0001,c.currentTime+when);g.gain.exponentialRampToValueAtTime(gain,c.currentTime+when+.12);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+when+dur);o.connect(g);g.connect(master);o.start(c.currentTime+when);o.stop(c.currentTime+when+dur+.05)}
function noise(dur,level,filterFreq){const c=audio(),n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,.35);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type="lowpass";f.frequency.value=filterFreq;g.gain.value=level;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start()}
function awaken(){audio();active=!active;$("lantern").classList.toggle("lit",active);$("beam").classList.toggle("on",active);if(active){$("status").textContent="THE LANTERN IS TURNING · THE PHANTOM SHIP HAS ANSWERED";tone(110,3,"sawtooth",.07);tone(164.8,3.4,"sine",.06,.08);tone(220,2.8,"sine",.04,.16);noise(3,.035,450);setTimeout(()=>{tone(392,1.8,"sine",.035);tone(523.25,2.2,"sine",.025,.3)},500)}else{$("status").textContent="THE LIGHT FADES · THE COAST FALLS QUIET";tone(196,1.2,"sine",.045);}}
$("awaken").addEventListener("click",awaken);
$("storm").addEventListener("click",()=>{audio();$("lightning").classList.remove("flash");void $("lightning").offsetWidth;$("lightning").classList.add("flash");$("status").textContent="THE SKY BREAKS OPEN · THUNDER ROLLS OVER THE SEA";noise(1.5,.19,170);tone(48,1.8,"sawtooth",.13,.04);tone(62,1.3,"triangle",.08,.12)});
$("reset").addEventListener("click",()=>{active=false;$("lantern").classList.remove("lit");$("beam").classList.remove("on");$("lightning").classList.remove("flash");$("status").textContent="THE COAST IS SILENT · THE LIGHT IS DORMANT";if(ctx&&master){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(.0,ctx.currentTime,.15);setTimeout(()=>{if(master)master.gain.setTargetAtTime(.24,ctx.currentTime,.5)},700)}});
})();
</script></body></html>
