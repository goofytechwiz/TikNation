<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Titanfall Colossus — 3D Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070c;color:#eafaff;font-family:system-ui,Arial}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 67%,#34444a 0,#17242c 34%,#050a11 76%)}
canvas{display:block;width:100%;height:100%}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#02060cf2 0%,transparent 34%,#02060c55 100%),radial-gradient(ellipse,transparent 32%,#02060caa 100%)}
header{position:absolute;top:4%;left:0;right:0;text-align:center;text-shadow:0 2px 15px #000}h1{margin:0;font-size:clamp(19px,4vw,38px);letter-spacing:.22em;font-weight:950}header p{font-size:9px;letter-spacing:.38em;color:#a9d5e0;margin:10px 0}
#status{position:absolute;left:0;right:0;bottom:100px;text-align:center;color:#b4d4dc;font-size:9px;letter-spacing:.2em;text-shadow:0 2px 8px #000}
.controls{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:8px}
button,a{background:#07121de8;border:1px solid #7edcf0;color:#eafaff;border-radius:30px;padding:12px 16px;font-size:10px;font-weight:850;letter-spacing:.1em;text-decoration:none}
button:active{transform:scale(.97)}#fallback{display:none;position:absolute;inset:40% 10% auto;text-align:center;color:#cceaf2}
</style></head><body><main id="stage"><div class="shade"></div><header><h1>TITANFALL COLOSSUS</h1><p>THE EARTH BREAKS. THE ANCIENT ONE RISES.</p></header><div id="status">3D CINEMATIC PREVIEW · DRAG TO LOOK AROUND</div><div id="fallback">The 3D scene couldn't load in this browser. Try refreshing with an internet connection.</div></main>
<div class="controls"><button id="sound">ENABLE CINEMATIC SOUND</button><button id="replay">REPLAY ENTRANCE</button><a href="../../live.html">BACK TO TIKNATION LIVE</a></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status');
try{
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x111b22,.025);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,180);camera.position.set(0,5.5,19);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;stage.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9dbbc7,0x10151a,2.0));
const key=new THREE.DirectionalLight(0xc5d5d8,3.2);key.position.set(-7,13,9);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const rim=new THREE.DirectionalLight(0x40c8ee,3.5);rim.position.set(8,7,-8);scene.add(rim);
const coreLight=new THREE.PointLight(0x36d9ff,0,13);coreLight.position.set(0,5.1,1.3);scene.add(coreLight);
const stone=new THREE.MeshStandardMaterial({color:0x59666a,roughness:.94,metalness:.18}),edge=new THREE.MeshStandardMaterial({color:0x303d43,roughness:.82,metalness:.35}),plate=new THREE.MeshStandardMaterial({color:0x829092,roughness:.78,metalness:.28}),dark=new THREE.MeshStandardMaterial({color:0x101c23,roughness:.7,metalness:.3}),glow=new THREE.MeshStandardMaterial({color:0x54e5ff,emissive:0x13bde9,emissiveIntensity:3,roughness:.3});
const titan=new THREE.Group();scene.add(titan);
function part(geo,mat,x,y,z,sx=1,sy=1,sz=1,rx=0,ry=0,rz=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.rotation.set(rx,ry,rz);m.castShadow=true;m.receiveShadow=true;titan.add(m);return m}
function rock(x,y,z,sx,sy,sz,mat=stone){return part(new THREE.DodecahedronGeometry(1,1),mat,x,y,z,sx,sy,sz,Math.random()*.12,Math.random()*.2,Math.random()*.12)}
// Massive articulated legs, feet and layered greaves
for(const side of [-1,1]){let x=side*1.02;
rock(x,.95,0,.72,1.15,.72,edge);rock(x,1.2,.12,.62,.92,.68,stone);
rock(x,.25,.25,.78,.3,1.0,plate);rock(x,.18,.82,.55,.45,.35,dark);
for(let j=0;j<3;j++)rock(x+side*(j-1)*.19,-.12,.68,.16,.27,.3,plate);
rock(x,2.05,0,.75,.25,.7,dark);
}
// torso silhouette and overlapping breastplate
rock(0,4.15,0,1.75,1.65,.88,edge);rock(0,4.3,.1,1.52,1.48,.82,stone);
rock(0,4.45,.72,1.22,1.02,.27,plate);rock(0,3.55,.82,1.08,.58,.25,dark);
rock(0,3.7,1.0,.72,.43,.12,edge);
for(let i=0;i<4;i++){rock(-.83+i*.55,4.15,1.0,.19,.58,.12,edge)}
// shoulder pauldrons and long segmented arms
for(const side of [-1,1]){const x=side*2.05;
rock(x,5.05,0,.95,.72,.85,plate);rock(x,5.1,.53,.72,.52,.22,edge);
rock(side*2.35,4.25,.05,.48,.92,.53,stone);rock(side*2.42,3.55,.16,.56,.68,.58,edge);
rock(side*2.46,2.92,.27,.46,.5,.46,plate);
for(let k=0;k<3;k++)rock(side*(2.25+k*.2),2.55,.45,.09,.24,.1,edge);
}
// neck, skull, brow, face and broken crown
rock(0,5.72,0,.64,.48,.57,dark);rock(0,6.42,0,.76,.83,.68,stone);
rock(0,6.55,.54,.66,.35,.24,plate);rock(0,6.12,.56,.6,.25,.2,edge);
rock(-.32,6.52,.75,.22,.12,.12,glow);rock(.32,6.52,.75,.22,.12,.12,glow);
rock(0,6.08,.7,.25,.12,.13,dark);
for(const side of [-1,1]){let horn=part(new THREE.ConeGeometry(.27,1.25,6),plate,side*.55,7.35,-.02,1,1,1,0,0,side*-.24);horn.rotation.z=side*-.3}
rock(0,7.12,0,.24,.45,.28,edge);
// Cracked luminous core recessed into chest
rock(0,4.25,1.12,.56,.67,.2,dark);const heart=part(new THREE.IcosahedronGeometry(.39,2),glow,0,4.27,1.31,1,1.12,.65);coreLight.position.set(0,4.3,2.2);
// Fine fissure paths across armor, with pulsing emissive seams
const crackMat=new THREE.MeshBasicMaterial({color:0x50dcf8});
function crack(points){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const line=new THREE.Mesh(new THREE.TubeGeometry(curve,.0+points.length*8,.018,5,false),crackMat);titan.add(line)}
crack([[-.1,5.0,1.0],[-.38,4.72,1.12],[-.17,4.48,1.28],[-.4,4.18,1.15],[-.18,3.9,1.15]]);
crack([[.1,4.95,1.0],[.38,4.68,1.13],[.2,4.4,1.3],[.43,4.12,1.12]]);
crack([[-2.5,4.7,.45],[-2.2,4.5,.62],[-2.35,4.2,.5]]);
// Ground, broken stone platform, glowing portal ring
const floor=new THREE.Mesh(new THREE.CircleGeometry(40,80),new THREE.MeshStandardMaterial({color:0x151d21,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.22;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(4.2,.09,12,100),new THREE.MeshBasicMaterial({color:0x36d7f5}));ring.rotation.x=Math.PI/2;ring.position.y=-.12;ring.scale.set(1,.45,1);scene.add(ring);
for(let i=0;i<20;i++){const a=i/20*Math.PI*2;const shard=new THREE.Mesh(new THREE.DodecahedronGeometry(.45,0),edge);shard.position.set(Math.cos(a)*4.5,-.05,Math.sin(a)*2.2);shard.rotation.set(Math.random(),Math.random(),Math.random());shard.scale.set(.7,1.8,.7);scene.add(shard)}
// Floating ash and debris
const dustGeo=new THREE.BufferGeometry(),count=650,positions=new Float32Array(count*3);for(let i=0;i<count;i++){positions[i*3]=(Math.random()-.5)*24;positions[i*3+1]=Math.random()*13;positions[i*3+2]=(Math.random()-.5)*18}dustGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xb9d4dc,size:.035,transparent:true,opacity:.48}));scene.add(dust);
// distant jagged ruined monoliths
for(let i=0;i<16;i++){const a=new THREE.Mesh(new THREE.ConeGeometry(.6+Math.random()*.9,3+Math.random()*5,5),edge);a.position.set((Math.random()-.5)*28,1.3,-7-Math.random()*8);a.rotation.z=(Math.random()-.5)*.3;scene.add(a)}
let start=performance.now(),sound=false,ctx=null,drag=false,lastX=0,turn=0,shake=0;
function reset(){start=performance.now();titan.position.y=-5.8;shake=0}
function audioCue(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=ctx||new AC();ctx.resume();const t=ctx.currentTime;
function rumble(at,dur,vol,cut){const n=ctx.sampleRate*dur|0,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.8);const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(vol,at+.15);g.gain.exponentialRampToValueAtTime(.0001,at+dur);s.connect(f);f.connect(g);g.connect(ctx.destination);s.start(at);s.stop(at+dur)}
function thud(at,freq,vol){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,at);o.frequency.exponentialRampToValueAtTime(25,at+.9);g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(vol,at+.025);g.gain.exponentialRampToValueAtTime(.0001,at+1.2);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+1.25)}
rumble(t,5.5,.5,180);rumble(t+.7,3.5,.28,700);thud(t+2.1,62,.75);thud(t+3.2,55,.8);thud(t+4.25,48,.9);rumble(t+4.6,1.8,.32,1800)}
document.querySelector('#sound').onclick=()=>{sound=!sound;document.querySelector('#sound').textContent=sound?'CINEMATIC SOUND: ON':'ENABLE CINEMATIC SOUND';if(sound)audioCue()};
document.querySelector('#replay').onclick=()=>{reset();if(sound)audioCue()};
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){turn+=(e.clientX-lastX)*.006;lastX=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>drag=false);
function animate(now){requestAnimationFrame(animate);const p=Math.min(1,(now-start)/5600),rise=1-Math.pow(1-Math.max(0,Math.min(1,(p-.08)/.58)),3);titan.position.y=-5.8+rise*5.8;titan.rotation.y=turn+Math.sin(now*.00025)*.035;titan.rotation.z=Math.sin(now*.0007)*.008*rise;titan.position.x=Math.sin(now*.0006)*.05;heart.scale.setScalar(1+Math.sin(now*.004)*.055);glow.emissiveIntensity=2.2+Math.sin(now*.003)*.8;coreLight.intensity=rise*(5+Math.sin(now*.003)*2);ring.material.opacity=.5+Math.sin(now*.002)*.3;dust.rotation.y=now*.000025;camera.position.x=Math.sin(now*.00018)*.22;camera.lookAt(0,3.4,0);renderer.render(scene,camera);status.textContent=p<.7?'AN ANCIENT COLOSSUS IS BREAKING THROUGH THE RUINS': 'THE COLOSSUS HAS AWAKENED · DRAG TO LOOK AROUND'}
requestAnimationFrame(animate);reset();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){document.querySelector('#fallback').style.display='block';status.textContent='3D SCENE UNAVAILABLE';}
</script></body></html>
