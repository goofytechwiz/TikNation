<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Titanfall Colossus — Cinematic Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#edf7ff;font-family:system-ui,Arial}
#world{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,#34414a 0,#19232d 34%,#070c13 78%);overflow:hidden}
#scene{width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse,transparent 35%,#02050bc9 100%),linear-gradient(0deg,#02050bd9,transparent 38%,#02050b66)}
.title{position:absolute;top:4%;width:100%;text-align:center;font-size:clamp(15px,2.8vw,27px);font-weight:950;letter-spacing:.23em;text-shadow:0 3px 12px #000,0 0 22px #8ceaff}.title small{display:block;margin-top:8px;font-size:9px;letter-spacing:.34em;color:#9bc4d1}

</style></head><body><main id="world"><canvas id="scene"></canvas><div class="vignette"></div><div class="title">TITANFALL COLOSSUS<small>AN ANCIENT GIANT WAKES BENEATH THE EARTH</small></div></main>
<div class="controls"><div id="hint">CINEMATIC ENTRANCE · SOUND IS OFF UNTIL ENABLED</div><button id="sound">ENABLE CINEMATIC SOUND</button><button id="replay">REPLAY ENTRANCE</button><a href="../../live.html">BACK TO TIKNATION LIVE</a></div>
<script>
(()=>{const c=document.querySelector('#scene'),g=c.getContext('2d');let w=0,h=0,dpr=1,start=performance.now(),audio=null,sound=false,raf=0;
function resize(){dpr=Math.min(devicePixelRatio||1,1.7);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a);
function polygon(points,fill,stroke='#111a20',sw=5){g.beginPath();points.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.lineWidth=sw;g.strokeStyle=stroke;g.stroke()}}
function rock(x,y,rx,ry,light='#89949a',dark='#26333c'){let q=g.createLinearGradient(x-rx,y-ry,x+rx,y+ry);q.addColorStop(0,light);q.addColorStop(.38,'#56636b');q.addColorStop(1,dark);g.fillStyle=q;g.beginPath();g.moveTo(x-rx*.85,y-ry*.55);g.lineTo(x-rx*.25,y-ry);g.lineTo(x+rx*.75,y-ry*.7);g.lineTo(x+rx,y+ry*.15);g.lineTo(x+rx*.3,y+ry);g.lineTo(x-rx*.75,y+ry*.7);g.closePath();g.fill();g.strokeStyle='#101a22';g.lineWidth=Math.max(2,rx*.09);g.stroke();g.save();g.globalAlpha=.25;g.strokeStyle='#d2dadd';g.lineWidth=2;g.beginPath();g.moveTo(x-rx*.55,y-ry*.45);g.lineTo(x-rx*.08,y-ry*.8);g.lineTo(x+rx*.36,y-ry*.53);g.stroke();g.restore()}
function limb(x,y,scale,angle){g.save();g.translate(x,y);g.rotate(angle);g.scale(scale,scale);rock(0,0,42,92);rock(0,105,50,72,'#75828a','#1b2932');rock(0,184,36,35,'#4c5a62','#111b22');for(let i=0;i<3;i++)rock(-24+i*23,220,11,32,'#68757b','#17222a');g.restore()}
function draw(t){const p=Math.min(1,(t-start)/5600),rise=Math.max(0,Math.min(1,(p-.12)/.48)),settle=Math.max(0,1-(p-.62)*2.5);g.clearRect(0,0,w,h);
let sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#080e19');sky.addColorStop(.48,'#28343d');sky.addColorStop(1,'#080e14');g.fillStyle=sky;g.fillRect(0,0,w,h);
// distant ruined ridge and smoke
for(let i=0;i<8;i++){let x=i*w/7;polygon([[x,h*.68],[x+w*.07,h*(.48+rand(0,.06))],[x+w*.13,h*.68],[x+w*.18,h*.55],[x+w*.25,h*.72],[x+w*.25,h]],'#18242c',null)}
for(let i=0;i<20;i++){let x=(i*137+t*.008)%w,y=h*.25+(i*71% (h*.35));g.fillStyle='rgba(170,190,195,.025)';g.beginPath();g.ellipse(x,y,80+i%5*25,20+i%4*12,0,0,7);g.fill()}
let ground=g.createLinearGradient(0,h*.7,0,h);ground.addColorStop(0,'#4b5355');ground.addColorStop(1,'#080d12');g.fillStyle=ground;g.fillRect(0,h*.7,w,h*.3);
// fissure and blast light
g.save();g.translate(w/2,h*.79);g.scale(1+rise*.8,1);g.strokeStyle='#71dcf3';g.lineWidth=3;g.shadowBlur=30;g.shadowColor='#4bdfff';g.beginPath();g.ellipse(0,0,w*.17*(.2+rise),h*.035*(.2+rise),0,0,Math.PI*2);g.stroke();g.restore();
let s=Math.min(w/950,h/760)*1.08,base=h*.84+((1-rise)*h*.18);let bob=rise>0&&rise<1?Math.sin(t*.009)*4:Math.sin(t*.001)*2;
g.save();g.translate(w/2,base+bob);g.scale(s,s);g.globalAlpha=Math.min(1,rise*2.5);
// giant shadow
g.fillStyle='#020609aa';g.beginPath();g.ellipse(0,12,255,34,0,0,7);g.fill();
// legs with articulated plates
limb(-83,-165,1,0);limb(83,-165,1,0);
rock(-83,43,61,25,'#8a969b','#17232b');rock(83,43,61,25,'#8a969b','#17232b');
// broad armored torso
polygon([[-145,-410],[-105,-475],[0,-500],[105,-475],[145,-410],[128,-220],[78,-150],[-78,-150],[-128,-220]],'#4c5b63','#101a22',13);
polygon([[-125,-408],[-85,-458],[0,-474],[85,-458],[125,-408],[90,-335],[0,-300],[-90,-335]],'#829097','#1b2a33',8);
polygon([[-105,-310],[0,-350],[105,-310],[88,-190],[0,-160],[-88,-190]],'#273640','#111b22',8);
polygon([[-46,-298],[0,-329],[46,-298],[38,-224],[0,-196],[-38,-224]],'#06121a','#a2b8bf',5);
g.shadowColor='#59e5ff';g.shadowBlur=24;let core=g.createRadialGradient(0,-264,2,0,-264,42);core.addColorStop(0,'#fff');core.addColorStop(.25,'#a4f5ff');core.addColorStop(.6,'#25c9ec');core.addColorStop(1,'#08759a');g.fillStyle=core;g.beginPath();g.arc(0,-264,34+Math.sin(t*.006)*3,0,7);g.fill();g.shadowBlur=0;
// shoulders and arms
rock(-160,-415,66,66,'#a1a9aa','#26343c');rock(160,-415,66,66,'#a1a9aa','#26343c');
limb(-205,-330,1.12,Math.sin(t*.0007)*.035);limb(205,-330,1.12,-Math.sin(t*.0007)*.035);
// head and crown
polygon([[-67,-495],[-56,-558],[0,-598],[56,-558],[67,-495],[38,-455],[-38,-455]],'#68767c','#101b22',9);
polygon([[-46,-535],[-27,-560],[0,-570],[27,-560],[46,-535],[34,-505],[0,-490],[-34,-505]],'#182832','#a5b4b8',5);
g.shadowColor='#8cecff';g.shadowBlur=16;g.fillStyle='#a7f4ff';g.fillRect(-36,-532,23,7);g.fillRect(13,-532,23,7);g.shadowBlur=0;
polygon([[-45,-575],[-80,-635],[-26,-604],[0,-661],[26,-604],[80,-635],[45,-575]],'#6d7b80','#19252c',8);
// rock texture flecks, scars and seams
for(let i=0;i<105;i++){let x=rand(-155,155),y=rand(-460,-155);g.fillStyle=i%3?'#d5e0e055':'#050d13aa';g.beginPath();g.ellipse(x,y,rand(1,5),rand(1,8),rand(-1,1),0,7);g.fill()}
g.strokeStyle='#7fe9fa';g.lineWidth=2.5;g.shadowColor='#39d7f6';g.shadowBlur=10;g.beginPath();g.moveTo(-4,-460);g.lineTo(-19,-420);g.lineTo(5,-385);g.lineTo(-10,-340);g.lineTo(0,-300);g.lineTo(-17,-268);g.stroke();g.beginPath();g.moveTo(5,-385);g.lineTo(36,-370);g.lineTo(27,-340);g.stroke();g.shadowBlur=0;
g.restore();
// debris blast at arrival
if(p>.48&&p<.9){for(let i=0;i<36;i++){let a=i*2.399,dist=(p-.48)*520;let x=w/2+Math.cos(a)*dist*(.6+(i%4)*.2),y=h*.8+Math.sin(a)*dist*.45-(p-.48)*160;g.fillStyle=i%2?'#899398':'#313e45';g.save();g.translate(x,y);g.rotate(a);g.fillRect(-3,-3,rand(4,13),rand(4,12));g.restore()}}
if(p<1){g.fillStyle='rgba(160,225,240,'+(Math.max(0,1-Math.abs(p-.52)*12)*.17)+')';g.fillRect(0,0,w,h)}
// drifting dust motes
for(let i=0;i<45;i++){let x=(i*97+t*.012*(i%2?1:-1))%w,y=(i*53+t*.007)%h;g.fillStyle='rgba(211,228,230,.25)';g.beginPath();g.arc(x,y,1+(i%3),0,7);g.fill()}
raf=requestAnimationFrame(draw)}
function noise(ctx,when,dur,vol,cutoff,q=0.7){let n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(1,n,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++){let fade=Math.pow(1-i/n,1.7);a[i]=(Math.random()*2-1)*fade}let src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),gain=ctx.createGain();src.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(cutoff,when);f.Q.value=q;gain.gain.setValueAtTime(.0001,when);gain.gain.linearRampToValueAtTime(vol,when+.12);gain.gain.exponentialRampToValueAtTime(.0001,when+dur);src.connect(f);f.connect(gain);gain.connect(ctx.destination);src.start(when);src.stop(when+dur)}
function sub(ctx,when,freq,dur,vol){let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,when);o.frequency.exponentialRampToValueAtTime(Math.max(18,freq*.55),when+dur);g.gain.setValueAtTime(.0001,when);g.gain.linearRampToValueAtTime(vol,when+.08);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(ctx.destination);o.start(when);o.stop(when+dur)}
function cinematicSound(){let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();audio.resume();let t=audio.currentTime;
// subterranean stone movement, not musical synth tones
noise(audio,t,5.2,.42,240,.4);sub(audio,t,38,4.8,.5);
noise(audio,t+.55,3.8,.32,680,.8);noise(audio,t+1.1,3.1,.23,1250,.6);
[2.15,3.25,4.3].forEach((x,i)=>{let at=t+x;noise(audio,at,1.35,.52,420,.8);noise(audio,at+.025,.8,.3,1700,.7);sub(audio,at,54-i*5,1.9,.7);});
noise(audio,t+2.65,2.2,.38,95,.7);sub(audio,t+2.65,31,2.4,.65);
noise(audio,t+4.65,2.4,.2,3400,.5);
}
function replay(){start=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);if(sound)cinematicSound()}
document.querySelector('#sound').onclick=()=>{sound=!sound;document.querySelector('#sound').textContent=sound?'CINEMATIC SOUND: ON':'ENABLE CINEMATIC SOUND';if(sound)cinematicSound()};
document.querySelector('#replay').onclick=replay;raf=requestAnimationFrame(draw);
})();
</script></body></html>
