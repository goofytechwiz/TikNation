<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;color:#eafaff;font-family:system-ui,Arial}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 76%,#25465c,#101c2c 38%,#02050c);isolation:isolate}
.sky{position:absolute;inset:0;background:linear-gradient(#050a18,#17263a 55%,#101b29);animation:flash 6s steps(1,end) infinite}
.moon{position:absolute;width:clamp(90px,15vw,180px);aspect-ratio:1;left:50%;top:7%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,#e9faff,#8db6c9 48%,#37566b 78%);box-shadow:0 0 35px 12px #7bdcff44,0 0 180px 65px #58c7ff24}
.ground{position:absolute;left:-15%;right:-15%;bottom:-12%;height:43%;background:linear-gradient(#34414c,#111b27 35%,#050912);clip-path:polygon(0 24%,12% 13%,22% 22%,36% 4%,49% 20%,61% 8%,78% 22%,90% 10%,100% 25%,100% 100%,0 100%)}
.rift{position:absolute;left:50%;bottom:13%;width:min(76vw,820px);height:25%;transform:translateX(-50%);border:4px solid #7deaff;border-radius:50%;box-shadow:0 0 22px #44d9ff,0 0 80px #16b9ff99,inset 0 0 35px #38caff;animation:rift 2.8s ease-out infinite}
.giant{position:absolute;z-index:4;left:50%;bottom:8%;width:min(88vw,900px);height:min(82vh,740px);transform:translateX(-50%);filter:drop-shadow(0 25px 30px #000e);animation:rise 2.1s cubic-bezier(.14,.78,.2,1) both}
.body{transform-origin:50% 90%;animation:settle 1.2s 2.1s ease-out both}.armL{transform-box:fill-box;transform-origin:78% 18%;animation:left 2.4s 2s ease-in-out both}.armR{transform-box:fill-box;transform-origin:22% 18%;animation:right 2.4s 2s ease-in-out both}.core{transform-box:fill-box;transform-origin:center;animation:core 1.6s 2.4s ease-in-out infinite}
.crack{fill:none;stroke:#8cecff;stroke-width:8;stroke-linecap:round;filter:url(#glow);stroke-dasharray:240;stroke-dashoffset:240;animation:crack 1.1s 2.5s ease-out forwards}
.lightning{position:absolute;inset:0;background:#c5f5ff;opacity:0;pointer-events:none;animation:lightning 5.8s 2.2s steps(1,end) infinite}
.fog{position:absolute;z-index:5;left:-20%;right:-20%;bottom:2%;height:27%;background:radial-gradient(ellipse at 25% 50%,#a8d8e82e,transparent 45%),radial-gradient(ellipse at 75% 60%,#8bbdd52b,transparent 48%);filter:blur(14px);animation:fog 8s ease-in-out infinite alternate}
.debris{position:absolute;z-index:6;top:69%;width:var(--s);height:var(--s);background:linear-gradient(145deg,#9eabb2,#303c48 70%);clip-path:polygon(50% 0,100% 36%,76% 100%,12% 82%,0 24%);animation:debris var(--t) cubic-bezier(.1,.75,.2,1) var(--d) both}
header{position:absolute;z-index:8;left:0;right:0;top:3%;text-align:center;color:#eafaff;font-weight:1000;letter-spacing:.18em;font-size:clamp(17px,3vw,29px);text-shadow:0 0 18px #54dfff,0 3px 18px #000;animation:title 1s 2.4s both}
header small{display:block;margin-top:8px;color:#9beeff;font-size:clamp(9px,1.5vw,13px);letter-spacing:.3em}
.panel{position:fixed;z-index:10;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
button,a{border:1px solid #7deaff;background:#071723eF;color:#eafaff;border-radius:30px;padding:12px 18px;font-weight:800;font-size:11px;letter-spacing:.1em;text-decoration:none;backdrop-filter:blur(12px)}
button:active,a:active{transform:scale(.97)}.label{width:100%;text-align:center;font-size:10px;letter-spacing:.18em;color:#b7e9f5;text-shadow:0 2px 9px #000}
@keyframes rise{0%{transform:translate(-50%,75%) scale(.55);opacity:0}45%{opacity:1}72%{transform:translate(-50%,-3%) scale(1.04)}100%{transform:translate(-50%,0) scale(1)}}
@keyframes settle{0%{transform:translateY(-8px)}35%{transform:translateY(12px)}65%{transform:translateY(-4px)}100%{transform:translateY(0)}}
@keyframes left{0%{transform:rotate(38deg)}45%{transform:rotate(-14deg)}70%{transform:rotate(8deg)}100%{transform:rotate(0)}}@keyframes right{0%{transform:rotate(-38deg)}45%{transform:rotate(14deg)}70%{transform:rotate(-8deg)}100%{transform:rotate(0)}}
@keyframes core{0%,100%{opacity:.7;transform:scale(.92)}50%{opacity:1;transform:scale(1.18)}}@keyframes crack{to{stroke-dashoffset:0}}
@keyframes rift{0%{opacity:0;transform:translateX(-50%) scale(.25)}40%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.35)}}
@keyframes lightning{0%,76%,78%,80%,100%{opacity:0}77%{opacity:.35}79%{opacity:.1}}@keyframes fog{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
@keyframes debris{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15) rotate(480deg)}}
@keyframes title{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}@keyframes flash{0%,87%,89%,91%,100%{filter:none}88%,90%{filter:brightness(1.6)}}

<script>
let audio=null,enabled=false;
function noise(ctx,at,duration,volume,low,high){const length=Math.floor(ctx.sampleRate*duration),buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();src.buffer=buffer;filter.type="lowpass";filter.frequency.setValueAtTime(low,at);filter.frequency.exponentialRampToValueAtTime(high,at+duration*.9);gain.gain.setValueAtTime(.0001,at);gain.gain.linearRampToValueAtTime(volume,at+.18);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);src.connect(filter);filter.connect(gain);gain.connect(ctx.destination);src.start(at);src.stop(at+duration)}
function tone(ctx,at,freq,duration,volume,type){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,at);gain.gain.setValueAtTime(.0001,at);gain.gain.linearRampToValueAtTime(volume,at+.025);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(at);osc.stop(at+duration)}
function playSound(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audio=audio||new C();audio.resume();const t=audio.currentTime;noise(audio,t,4.5,.27,190,42);noise(audio,t+.45,3.4,.12,1450,115);[2,2.7,3.4].forEach((d,i)=>{noise(audio,t+d,.72,.25-i*.03,720,75);tone(audio,t+d,[58,49,42][i],1,.3,"sawtooth");tone(audio,t+d+.04,[92,78,66][i],.7,.12,"triangle")});[.9,2.35].forEach((d,i)=>{tone(audio,t+d,i?44:68,1.65,.15,"sawtooth");tone(audio,t+d+.12,i?118:165,1.1,.055,"triangle")});[3.85,4.15,4.45,4.75].forEach((d,i)=>tone(audio,t+d,[220,330,440,660][i],.62,.08,"sine"))}
function replay(){const stage=document.querySelector("#stage");stage.classList.remove("replay");void stage.offsetWidth;stage.classList.add("replay");document.querySelectorAll(".giant,.rift,.crack,.core,.armL,.armR").forEach(el=>{el.style.animation="none";void el.getBoundingClientRect();el.style.animation=""});}
document.querySelector("#sound").addEventListener("click",()=>{enabled=!enabled;document.querySelector("#sound").textContent=enabled?"SOUND: ON":"SOUND: OFF";if(enabled)playSound()});
document.querySelector("#replay").addEventListener("click",()=>{replay();if(enabled)playSound()});
for(let i=0;i<32;i++){const shard=document.createElement("i");shard.className="debris";shard.style.setProperty("--s",(7+(i%6)*4)+"px");shard.style.setProperty("--t",(1.5+(i%5)*.35)+"s");shard.style.setProperty("--d",(2.05+(i%8)*.035)+"s");shard.style.setProperty("--dx",((i%2?1:-1)*(65+(i%7)*45))+"px");shard.style.setProperty("--dy",(-110-(i%6)*45)+"px");shard.style.left=(8+(i*29)%84)+"%";document.querySelector("#stage").appendChild(shard);}
