<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE DRAGON'S HEART — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#3a2118 0,#17101a 48%,#07070d 100%);color:#fff2e7;font-family:system-ui,sans-serif}
main{width:min(100%,920px);padding:18px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.34em;color:#e6a77b}.title{font-size:clamp(30px,6vw,58px);letter-spacing:.14em;margin:8px 0;text-shadow:0 0 25px #ff792c88}.sub{font-size:12px;letter-spacing:.18em;color:#d2a88e}
.stage{height:min(65vh,540px);min-height:350px;position:relative;margin:10px auto;overflow:hidden;isolation:isolate}
.backglow{position:absolute;left:50%;top:48%;width:380px;height:380px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ff8c323d,transparent 68%);filter:blur(15px)}
.ground{position:absolute;bottom:8%;left:50%;width:60%;height:38px;transform:translateX(-50%);background:radial-gradient(ellipse,#ff8d3740,transparent 70%);filter:blur(8px)}
.egg{position:absolute;left:50%;top:53%;width:190px;height:250px;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 24px #000b);z-index:3}
.egg svg{width:100%;height:100%;overflow:visible}.egg-shell{transform-origin:50% 52%}
.dragon{position:absolute;left:50%;top:48%;width:min(82vw,430px);height:340px;transform:translate(-50%,-40%) scale(.45);opacity:0;z-index:4;filter:drop-shadow(0 0 16px #ff7b2b88)}
.dragon svg{width:100%;height:100%;overflow:visible}
.wing{transform-box:fill-box;transform-origin:12% 82%}.wing.right{transform-origin:88% 82%}
.stage.hatch .egg{animation:eggshake .55s .2s ease-in-out 3}
.stage.hatch .egg-shell.left{animation:splitL .85s 1.6s ease-in forwards}
.stage.hatch .egg-shell.right{animation:splitR .85s 1.6s ease-in forwards}
.stage.hatch .dragon{animation:emerge 1.2s 1.9s cubic-bezier(.2,.8,.2,1) forwards}
.stage.hatch .wing{animation:flap .62s 3.15s ease-in-out 4 alternate}
.stage.hatch .heart{animation:beat .7s 2.8s ease-in-out 4}
.stage.hatch .backglow{animation:ignite 2s 1.8s ease-out forwards}
@keyframes eggshake{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-52%,-50%) rotate(-4deg)}75%{transform:translate(-48%,-50%) rotate(4deg)}}
@keyframes splitL{to{transform:translate(-75px,55px) rotate(-28deg);opacity:0}}
@keyframes splitR{to{transform:translate(75px,55px) rotate(28deg);opacity:0}}
@keyframes emerge{0%{opacity:0;transform:translate(-50%,-34%) scale(.38)}70%{opacity:1;transform:translate(-50%,-58%) scale(1.08)}100%{opacity:1;transform:translate(-50%,-52%) scale(1)}}
@keyframes flap{to{transform:rotate(-35deg) scaleY(.78)}}
@keyframes beat{0%,100%{filter:drop-shadow(0 0 5px #ffb43b)}50%{filter:drop-shadow(0 0 22px #fff1a0)}}
@keyframes ignite{to{opacity:1;filter:blur(23px);transform:translate(-50%,-50%) scale(1.28)}}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{padding:13px 22px;border:1px solid #ffb36f;background:#26170f;color:#fff2e7;font-weight:750;letter-spacing:.14em;cursor:pointer;border-radius:3px}button:hover{background:#4a2817;box-shadow:0 0 22px #ff853e77}.note{font-size:11px;color:#b49b8a;margin-top:12px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main><div class="eyebrow">TIKNATION • LEGENDARY GIFT</div><h1 class="title">THE DRAGON'S HEART</h1><div class="sub">A LEGEND AWAKENS</div>

<div class="controls"><button id="hatch">HATCH THE DRAGON</button><button id="sound" aria-pressed="false">SOUND: OFF</button></div><div class="note">Standalone gift preview • Sound is a simple synthesized hatch effect</div></main>
<script>
const stage=document.getElementById('stage'),hatch=document.getElementById('hatch'),sound=document.getElementById('sound');let audioOn=false,ctx;
function play(){stage.classList.remove('hatch');void stage.offsetWidth;stage.classList.add('hatch');if(audioOn){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const now=ctx.currentTime;const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(130,now);o.frequency.exponentialRampToValueAtTime(48,now+1.5);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.16,now+.12);g.gain.exponentialRampToValueAtTime(.0001,now+1.7);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+1.7)}catch(e){}}}
hatch.addEventListener('click',play);sound.addEventListener('click',()=>{audioOn=!audioOn;sound.textContent='SOUND: '+(audioOn?'ON':'OFF');sound.setAttribute('aria-pressed',String(audioOn))});play();
</script></body></html>
