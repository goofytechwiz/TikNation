*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#293a31 0,#10191b 48%,#05090d 100%);color:#f5f5e9;font-family:system-ui,sans-serif;overflow:hidden}main{width:min(100%,980px);padding:16px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.34em;color:#b9d68d}.title{font-size:clamp(30px,6vw,58px);letter-spacing:.14em;margin:6px 0;text-shadow:0 0 25px #8de26d88}.sub{font-size:12px;letter-spacing:.2em;color:#b3c4a6}.stage{height:min(67vh,570px);min-height:360px;position:relative;margin:10px auto;overflow:hidden;isolation:isolate}.mist{position:absolute;inset:20% 5% 5%;background:radial-gradient(ellipse,#9eea7330,transparent 68%);filter:blur(18px)}.platform{position:absolute;bottom:7%;left:50%;transform:translateX(-50%);width:58%;height:65px;background:linear-gradient(180deg,#66705b,#252c29 55%,#111819);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);border-top:2px solid #b5c58b}.egg{position:absolute;left:50%;top:52%;width:168px;height:220px;transform:translate(-50%,-50%);z-index:2;filter:drop-shadow(0 12px 22px #000)}.egg svg{width:100%;height:100%}.creature{position:absolute;left:50%;top:48%;width:min(96vw,700px);height:470px;transform:translate(-50%,-45%) scale(.18);opacity:0;z-index:4;filter:drop-shadow(0 8px 18px #000) drop-shadow(0 0 22px #a2ee6b88)}.creature svg{width:100%;height:100%;overflow:visible}.wing{transform-box:fill-box;transform-origin:50% 95%}.wing.left{transform-origin:95% 90%}.wing.right{transform-origin:5% 90%}.stage.go .egg{animation:shake .45s .15s ease-in-out 3}.stage.go .egg .crack{animation:crack .7s 1.25s forwards}.stage.go .creature{animation:burst 1.15s 1.55s cubic-bezier(.15,.8,.2,1) forwards}.stage.go .wing{animation:spread .75s 2.7s ease-out forwards,beatwing .65s 3.5s ease-in-out 4 alternate}.stage.go .chest{animation:pulse .6s 2.7s ease-in-out 6}.stage.go .mist{animation:mistglow 2s 1.5s forwards}
@keyframes shake{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-53%,-50%) rotate(-5deg)}75%{transform:translate(-47%,-50%) rotate(5deg)}}@keyframes crack{to{opacity:0;transform:scale(1.5)}}@keyframes burst{0%{opacity:0;transform:translate(-50%,-28%) scale(.18)}65%{opacity:1;transform:translate(-50%,-57%) scale(1.05)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes spread{to{transform:rotate(0deg) scale(1)}}@keyframes beatwing{to{transform:rotate(-7deg) scaleY(.88)}}@keyframes pulse{50%{filter:drop-shadow(0 0 32px #fff6a3);transform:scale(1.28)}}@keyframes mistglow{to{opacity:1;filter:blur(26px)}}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{padding:13px 22px;border:1px solid #c3e58d;background:#17251a;color:#f5ffe8;font-weight:750;letter-spacing:.14em;cursor:pointer;border-radius:3px}button:hover{background:#2a472b;box-shadow:0 0 22px #8fe76e77}.note{font-size:11px;color:#a7b6a1;margin-top:12px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}

<script>const stage=document.getElementById('stage'),hatch=document.getElementById('hatch'),sound=document.getElementById('sound');let enabled=false,ctx;function trigger(){stage.classList.remove('go');void stage.offsetWidth;stage.classList.add('go');if(enabled){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(38,t+1.6);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.17,t+.09);g.gain.exponentialRampToValueAtTime(.0001,t+1.8);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.8)}catch(e){}}}hatch.addEventListener('click',trigger);sound.addEventListener('click',()=>{enabled=!enabled;sound.textContent='SOUND: '+(enabled?'ON':'OFF');sound.setAttribute('aria-pressed',String(enabled))});trigger();</script></body></html>
