<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE DRAGON'S HEART — Rebuild 2</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#3b2619 0,#17121a 52%,#06070c 100%);color:#fff1df;font-family:system-ui,sans-serif;overflow:hidden}main{width:min(100%,960px);padding:18px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.34em;color:#efb17b}.title{font-size:clamp(30px,6vw,58px);letter-spacing:.14em;margin:7px 0;text-shadow:0 0 24px #ff843b99}.sub{font-size:12px;letter-spacing:.18em;color:#d5b197}.stage{height:min(66vh,560px);min-height:360px;position:relative;margin:8px auto;overflow:hidden;isolation:isolate}.glow{position:absolute;left:50%;top:48%;width:420px;height:420px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffb33c38,transparent 68%);filter:blur(14px)}.rock{position:absolute;bottom:9%;left:50%;width:290px;height:78px;transform:translateX(-50%);background:linear-gradient(160deg,#776052,#29212a 48%,#100f18);clip-path:polygon(10% 15%,27% 0,78% 4%,95% 22%,100% 100%,0 100%);border-top:2px solid #c78b54}.egg{position:absolute;left:50%;top:53%;width:176px;height:232px;transform:translate(-50%,-50%);z-index:3;filter:drop-shadow(0 14px 25px #000b)}.egg svg{width:100%;height:100%;overflow:visible}.dragon{position:absolute;left:50%;top:47%;width:min(94vw,590px);height:410px;transform:translate(-50%,-42%) scale(.35);opacity:0;z-index:4;filter:drop-shadow(0 0 15px #ff8b37a0)}.dragon svg{width:100%;height:100%;overflow:visible}.wing{transform-box:fill-box;transform-origin:15% 88%}.wing.r{transform-origin:85% 88%}.stage.play .egg{animation:shake .5s .2s ease-in-out 3}.stage.play .shell.l{animation:openL .9s 1.5s ease-in forwards}.stage.play .shell.r{animation:openR .9s 1.5s ease-in forwards}.stage.play .dragon{animation:emerge 1.2s 1.7s cubic-bezier(.2,.8,.2,1) forwards}.stage.play .wing{animation:flap .55s 3s ease-in-out 5 alternate}.stage.play .pulse{animation:heart .65s 2.8s ease-in-out 5}.stage.play .glow{animation:ignite 2s 1.8s forwards}@keyframes shake{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-52%,-50%) rotate(-4deg)}75%{transform:translate(-48%,-50%) rotate(4deg)}}@keyframes openL{to{transform:translate(-76px,50px) rotate(-34deg);opacity:0}}@keyframes openR{to{transform:translate(76px,50px) rotate(34deg);opacity:0}}@keyframes emerge{0%{opacity:0;transform:translate(-50%,-27%) scale(.35)}65%{opacity:1;transform:translate(-50%,-57%) scale(1.06)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes flap{to{transform:rotate(-30deg) scaleY(.8)}}@keyframes heart{50%{filter:drop-shadow(0 0 25px #fff2a5);transform:scale(1.15)}}@keyframes ignite{to{opacity:1;filter:blur(24px);transform:translate(-50%,-50%) scale(1.25)}}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{padding:13px 22px;border:1px solid #ffc17a;background:#29190f;color:#fff2e7;font-weight:750;letter-spacing:.14em;cursor:pointer;border-radius:3px}button:hover{background:#52301b;box-shadow:0 0 22px #ff853e77}.note{font-size:11px;color:#b49b8a;margin-top:12px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main><div class="eyebrow">TIKNATION • LEGENDARY GIFT</div><h1 class="title">THE DRAGON'S HEART</h1><div class="sub">REBUILD 2 · THE HATCHING</div><div class="stage" id="stage"><div class="glow"></div><div class="rock"></div>

<script>const stage=document.getElementById('stage'),hatch=document.getElementById('hatch'),sound=document.getElementById('sound');let on=false,ctx;function run(){stage.classList.remove('play');void stage.offsetWidth;stage.classList.add('play');if(on){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+1.8);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.1);g.gain.exponentialRampToValueAtTime(.0001,t+1.8);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.8)}catch(e){}}}hatch.addEventListener('click',run);sound.addEventListener('click',()=>{on=!on;sound.textContent='SOUND: '+(on?'ON':'OFF');sound.setAttribute('aria-pressed',String(on))});run();</script></body></html>
