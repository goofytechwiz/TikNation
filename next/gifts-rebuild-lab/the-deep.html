<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03121b">
<title>THE DEEP · TikNation Gift Rebuild Lab</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020a10;color:#e7f8ff;font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:100%;height:100%;min-height:420px;overflow:hidden;background:linear-gradient(#03131d,#052638 46%,#01070c);isolation:isolate}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 15%,#0009 76%,#000 120%)}
.hud{position:absolute;z-index:2;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:12px;color:#b8d9e7;font:10px/1.5 monospace;letter-spacing:.17em;text-shadow:0 2px 6px #000;text-transform:uppercase}
.hud span:last-child{text-align:right}
.caption{position:absolute;z-index:2;top:23%;left:8%;right:8%;text-align:center;font:clamp(23px,5vw,52px)/1.1 Georgia,serif;letter-spacing:.22em;color:#e8faff;text-shadow:0 0 24px #8beaff88;opacity:0;transition:opacity .6s}
.status{position:absolute;z-index:2;left:18px;bottom:84px;color:#c0dce7;font:10px monospace;letter-spacing:.13em;text-shadow:0 2px 5px #000}
.controls{position:absolute;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);width:calc(100% - 28px);display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
button{appearance:none;min-height:42px;padding:11px 15px;border:1px solid #5b91a4;background:#061722eF;color:#e9faff;font:700 10px monospace;letter-spacing:.12em;cursor:pointer}
button.primary{border-color:#a8edff;background:linear-gradient(#174355,#09212d);box-shadow:0 0 22px #64dfff22}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
button:active:not(:disabled){transform:translateY(1px)}
@media(max-width:560px){.hud{top:12px;left:12px;right:12px;font-size:9px}.status{left:12px;bottom:78px}.controls{bottom:12px}.controls button{padding:10px 11px;font-size:9px}.caption{top:26%}}
@media(prefers-reduced-motion:reduce){.caption{transition:none}}
</style>
</head>
<body>
<main class="stage" id="stage">
<canvas id="ocean" aria-label="Animated deep ocean creature gift preview"></canvas>
<div class="vignette"></div>
<div class="hud"><span>TikNation · Gift Rebuild Lab</span><span>ABYSSAL CAM · LIVE FEED</span></div>
<div class="caption" id="caption">SOMETHING IS BELOW</div>
<div class="status" id="status" aria-live="polite">DEPTH: 1,200 M · SONAR STANDBY</div>
<div class="controls">
<button class="primary" id="trigger">▶ RELEASE THE DEEP</button>
<button id="sound">SOUND: ON</button>
<button id="reset">RESET</button>
</div>
</main>
<script>
(()=>{
const canvas=document.getElementById('ocean'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),status=document.getElementById('status'),caption=document.getElementById('caption'),trigger=document.getElementById('trigger'),soundButton=document.getElementById('sound'),resetButton=document.getElementById('reset');
let w=0,h=0,dpr=1,raf=0,runId=0,phase='idle',started=0,soundOn=true,audioCtx=null,master=null,particles=[],lastFrame=0;
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){dpr=Math.min(window.devicePixelRatio||1,1.6);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);makeParticles();draw(performance.now())}
function makeParticles(){particles=Array.from({length:Math.min(100,Math.round(w*h/11000))},()=>({x:Math.random()*w,y:Math.random()*h,r:.5+Math.random()*2,v:.12+Math.random()*.45,a:.12+Math.random()*.32,phase:Math.random()*6.28}))}
function audio(){if(!soundOn)return null;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx){audioCtx=new AC();master=audioCtx.createGain();master.gain.value=.42;master.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}catch(e){return null}}
function tone(freq,duration,gain=.08,endFreq=0,type='sine',delay=0){const a=audio();if(!a)return;try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,t);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(18,endFreq),t+duration);f.type='lowpass';f.frequency.value=620;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+duration+.04)}catch(e){}}
function noise(duration,gain=.08,filter=700){const a=audio();if(!a)return;try{const n=Math.floor(a.sampleRate*duration),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();s.buffer=b;f.type='lowpass';f.frequency.value=filter;g.gain.value=gain;s.connect(f);f.connect(g);g.connect(master);s.start()}catch(e){}}
function creature(x,y,scale,angle,glow){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);
ctx.shadowColor='#061018';ctx.shadowBlur=28;
const grad=ctx.createLinearGradient(0,-55,0,55);grad.addColorStop(0,'#263e49');grad.addColorStop(.5,'#091923');grad.addColorStop(1,'#02070b');
ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(-105,-10);ctx.bezierCurveTo(-58,-62,34,-59,93,-15);ctx.bezierCurveTo(115,0,100,28,61,38);ctx.bezierCurveTo(8,65,-69,35,-105,-10);ctx.fill();
ctx.fillStyle='#020609';ctx.beginPath();ctx.moveTo(-82,-4);ctx.lineTo(-145,-48);ctx.lineTo(-124,0);ctx.lineTo(-151,39);ctx.closePath();ctx.fill();
ctx.fillStyle='#0b1d27';ctx.beginPath();ctx.moveTo(-5,-35);ctx.lineTo(18,-78);ctx.lineTo(33,-33);ctx.closePath();ctx.fill();
ctx.beginPath();ctx.moveTo(26,34);ctx.lineTo(54,77);ctx.lineTo(64,26);ctx.closePath();ctx.fill();
ctx.shadowBlur=0;ctx.fillStyle='#c4f7ff';ctx.globalAlpha=glow;ctx.beginPath();ctx.ellipse(68,-9,5,2.3,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
ctx.strokeStyle='#9ceeff';ctx.globalAlpha=.13;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(38,-20);ctx.quadraticCurveTo(66,-2,87,10);ctx.stroke();
ctx.restore()}
function draw(now){
 const t=now/1000;ctx.clearRect(0,0,w,h);
 const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#071c28');bg.addColorStop(.38,'#073047');bg.addColorStop(.72,'#031722');bg.addColorStop(1,'#01060a');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 const surf=ctx.createLinearGradient(0,0,0,h*.3);surf.addColorStop(0,'#a5edff2c');surf.addColorStop(1,'#2d9cb000');ctx.fillStyle=surf;ctx.fillRect(0,0,w,h*.3);
 for(let i=0;i<12;i++){const y=h*(.06+i*.022)+Math.sin(t*.7+i)*3;ctx.strokeStyle='rgba(135,218,240,'+(.035-i*.0015)+')';ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=w;x+=14){const yy=y+Math.sin(x*.012+t*1.2+i)*3; if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.stroke()}
 const elapsed=phase==='idle'?0:Math.max(0,(now-started)/1000);
 const intensity=phase==='breach'?1:phase==='approach'?.55:phase==='circle'?.32:0;
 if(phase!=='idle'){
  const sonarX=w*.5,sonarY=h*.62;ctx.strokeStyle='rgba(130,226,255,'+(.12+Math.sin(t*2)*.04)+')';ctx.lineWidth=1;ctx.beginPath();ctx.arc(sonarX,sonarY,36+(t*28)%190,0,Math.PI*2);ctx.stroke();
  if(phase==='circle'||phase==='approach'){const a=t*1.1;const x=w*.5+Math.cos(a)*w*.26,y=h*.62+Math.sin(a)*h*.13;creature(x,y,Math.min(w,h)/620*(phase==='approach'?1.3:1),a+.12,.55)}
  if(phase==='breach'){const p=Math.min(1,Math.max(0,(elapsed-0.1)/1.4)),ease=1-Math.pow(1-p,3),x=w*.5,y=h*.84-ease*h*.64;ctx.save();ctx.globalAlpha=Math.min(1,p*2);ctx.fillStyle='#9ceeff';ctx.shadowColor='#64dfff';ctx.shadowBlur=45;ctx.beginPath();ctx.ellipse(w*.5,h*.86,w*.25*ease,10+18*ease,0,0,Math.PI*2);ctx.fill();ctx.restore();creature(x,y,Math.min(w,h)/420*(.4+ease*.95),-.1,.9);
   for(let i=0;i<46;i++){const a=i*2.399,dist=(p*180+(i%7)*13);const px=w*.5+Math.cos(a)*dist,py=h*.76+Math.sin(a)*dist*.55;ctx.fillStyle='rgba(178,240,255,'+(.55*(1-p*.3))+')';ctx.beginPath();ctx.arc(px,py,1+(i%4)*1.2,0,Math.PI*2);ctx.fill()}
  }
 }
 for(const p of particles){p.y-=p.v*(phase==='breach'?2.4:1);if(p.y< -5){p.y=h+5;p.x=Math.random()*w}ctx.fillStyle='rgba(185,235,255,'+(p.a*(phase==='breach'?1.8:1))+')';ctx.beginPath();ctx.arc(p.x+Math.sin(t+p.phase)*2,p.y,p.r,0,Math.PI*2);ctx.fill()}
 if(phase==='breach'){const flash=Math.max(0,1-(elapsed-.08)*2.6);if(flash>0){ctx.fillStyle='rgba(195,244,255,'+(flash*.24)+')';ctx.fillRect(0,0,w,h)}}
 if(!reduced)raf=requestAnimationFrame(draw);
}
function setPhase(p){phase=p;stage.dataset.phase=p}
function reset(){runId++;cancelAnimationFrame(raf);setPhase('idle');caption.style.opacity='0';status.textContent='DEPTH: 1,200 M · SONAR STANDBY';trigger.disabled=false;trigger.textContent='▶ RELEASE THE DEEP';draw(performance.now());if(!reduced)raf=requestAnimationFrame(draw)}
const wait=(ms,id)=>new Promise(resolve=>setTimeout(()=>resolve(id===runId),ms));
async function run(){if(trigger.disabled)return;const id=++runId;trigger.disabled=true;trigger.textContent='EVENT IN PROGRESS';started=performance.now();setPhase('circle');status.textContent='SONAR CONTACT · MOVING BELOW';tone(58,2.8,.12,30,'sine');tone(420,.7,.025,180,'sine',.2);noise(.8,.025,420);
 if(!await wait(2100,id))return;setPhase('approach');status.textContent='MASSIVE BODY · CLOSING IN';caption.textContent='IT KNOWS YOU ARE HERE';caption.style.opacity='1';tone(42,2.2,.18,24,'sine');noise(1.2,.045,320);
 if(!await wait(2100,id))return;setPhase('breach');status.textContent='SURFACE BREACH · IMPACT IMMINENT';caption.textContent='THE DEEP';tone(76,1.8,.24,25,'sawtooth');noise(1.6,.16,1200);tone(880,.5,.06,120,'sine',.05);
 if(!await wait(2200,id))return;caption.style.opacity='0';status.textContent='CONTACT LOST · DEPTH UNKNOWN';trigger.disabled=false;trigger.textContent='↻ PLAY AGAIN'}
trigger.addEventListener('click',run);resetButton.addEventListener('click',reset);soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.textContent='SOUND: '+(soundOn?'ON':'OFF');if(master&&audioCtx)master.gain.setTargetAtTime(soundOn?.42:0,audioCtx.currentTime,.05)});
window.addEventListener('resize',resize);resize();if(!reduced)raf=requestAnimationFrame(draw);
})();
</script>
</body>
</html>
