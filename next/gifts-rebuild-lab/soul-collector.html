<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE SOUL COLLECTOR — Rebuild 2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#05090e;color:#edf8ff;font-family:Georgia,serif}body{overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#203c4b 0,#101d29 36%,#05080e 78%)}
.scene{height:100svh;min-height:520px;position:relative;display:grid;place-items:center;overflow:hidden;isolation:isolate}
h1{position:absolute;top:4vh;margin:0;letter-spacing:.25em;font-size:clamp(18px,3vw,29px);font-weight:normal;text-shadow:0 0 22px #72dcff88}.tag{position:absolute;top:calc(4vh + 42px);font:10px Arial;letter-spacing:.3em;color:#9ab9c9}
.backlight{position:absolute;top:13%;width:min(68vw,500px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#9aeaff22,transparent 68%);filter:blur(8px)}
.stage{position:relative;width:min(96vw,760px);height:min(70vh,590px);display:grid;place-items:center}
.entity{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:330px;height:475px;filter:drop-shadow(0 20px 25px #000);animation:drift 4s ease-in-out infinite}
.cloak{position:absolute;left:50%;top:104px;transform:translateX(-50%);width:270px;height:355px;background:linear-gradient(90deg,#05090e 0,#182b38 20%,#314754 48%,#142631 74%,#05090e 100%);clip-path:polygon(31% 0,69% 0,86% 21%,100% 100%,0 100%,14% 21%);border-top:1px solid #7896a6}
.cloak:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(95deg,transparent 0 16px,#b4e2ee0a 17px 19px,transparent 20px 34px);clip-path:inherit}
.hood{position:absolute;left:50%;top:5px;transform:translateX(-50%);width:152px;height:177px;background:linear-gradient(100deg,#05090e,#243c4b 43%,#080e16 80%);clip-path:polygon(50% 0,86% 17%,100% 52%,85% 92%,50% 100%,15% 92%,0 52%,14% 17%);filter:drop-shadow(0 0 10px #9de8ff22)}
.hood:after{content:"";position:absolute;inset:22px 23px 9px;background:linear-gradient(130deg,#020407,#0a1118);clip-path:polygon(50% 0,100% 30%,76% 100%,24% 100%,0 30%)}
.face{position:absolute;top:78px;left:50%;transform:translateX(-50%);width:68px;height:67px;background:#010306;clip-path:polygon(8% 0,92% 0,100% 58%,50% 100%,0 58%);z-index:2}
.eye{position:absolute;top:105px;width:15px;height:5px;background:#c5f7ff;box-shadow:0 0 8px 5px #4cdcff,0 0 25px 10px #36bfff66;z-index:3;animation:glint 2s infinite}.eye.a{left:127px}.eye.b{right:127px}
.shoulder{position:absolute;top:139px;width:118px;height:93px;background:linear-gradient(140deg,#080f17,#425a68 45%,#0a1119);border:1px solid #587989;border-radius:55% 50% 20% 20%;z-index:2}.shoulder.a{left:8px;transform:rotate(12deg)}.shoulder.b{right:8px;transform:rotate(-12deg)}
.arm{position:absolute;top:182px;width:43px;height:175px;border-radius:24px;background:linear-gradient(90deg,#060a10,#5b7280 48%,#111e28);z-index:3;transform-origin:top center}
.arm.a{left:42px;transform:rotate(34deg)}.arm.b{right:42px;transform:rotate(-52deg)}
.hand{position:absolute;top:320px;width:65px;height:85px;background:linear-gradient(90deg,#08111a,#8aa4ad 45%,#101a23);clip-path:polygon(22% 0,78% 0,100% 63%,83% 100%,68% 62%,51% 100%,34% 62%,17% 100%,0 62%);z-index:4}
.hand.a{left:17px;transform:rotate(22deg)}.hand.b{right:3px;transform:rotate(-28deg)}
.core{position:absolute;z-index:5;left:50%;top:225px;transform:translateX(-50%);width:72px;height:88px;border-radius:48% 52% 54% 46%;background:radial-gradient(ellipse,#fff 0,#c5f9ff 12%,#4fd9ff 29%,#0d4a70 55%,#06111c 78%);box-shadow:0 0 24px 9px #4ddaff99,0 0 80px 28px #279dce55;animation:beat 2s ease-in-out infinite}
.core:after{content:"";position:absolute;inset:-17px;border:1px solid #9deeff8c;border-radius:50%;animation:ring 2s ease-out infinite}
.soul{position:absolute;z-index:6;width:23px;height:34px;border-radius:50% 50% 44% 44%;background:radial-gradient(ellipse,#fff 0,#d5ffff 17%,#65e2ff 43%,#248bbd00 78%);filter:drop-shadow(0 0 10px #5cdfff);opacity:0;animation:orbit 5s ease-in-out infinite}
.soul:after{content:"";position:absolute;left:50%;top:23px;width:2px;height:21px;background:linear-gradient(#70e8ff,transparent);transform:rotate(12deg)}
.s1{left:12%;top:32%;--tx:175px;--ty:125px;animation-delay:0s}.s2{right:12%;top:23%;--tx:-160px;--ty:170px;animation-delay:1.2s}.s3{left:20%;top:64%;--tx:110px;--ty:-145px;animation-delay:2.4s}.s4{right:19%;top:59%;--tx:-100px;--ty:-140px;animation-delay:3.6s}
.orbit{position:absolute;left:50%;top:49%;width:330px;height:330px;transform:translate(-50%,-50%);border:1px solid #8adfff28;border-radius:50%;box-shadow:0 0 55px #4db8e91c,inset 0 0 40px #4db8e911}
.ground{position:absolute;bottom:11%;width:420px;height:55px;border-radius:50%;background:radial-gradient(ellipse,#64dfff2c,transparent 70%);filter:blur(12px)}
.controls{position:absolute;bottom:7vh;display:flex;gap:12px;z-index:8}button{background:#0c1a24;border:1px solid #70b4ca;color:#e9faff;padding:13px 21px;letter-spacing:.14em;font-size:11px;cursor:pointer;border-radius:2px}button:hover{background:#1a3544;box-shadow:0 0 20px #69dfff44}.note{position:absolute;bottom:3vh;font:10px Arial;letter-spacing:.2em;color:#89a7b5}
.scene.collect .arm.b{animation:reach .85s ease-in-out}.scene.collect .core{box-shadow:0 0 38px 17px #a4f5ff,0 0 120px 45px #37c7ff}.scene.collect .soul{animation-duration:1.45s}
@keyframes drift{50%{margin-top:-10px}}@keyframes beat{50%{transform:translateX(-50%) scale(1.13)}}@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.8);opacity:0}}@keyframes orbit{0%,12%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:1}82%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(.7)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.1)}}@keyframes reach{0%{transform:rotate(-52deg)}55%{transform:rotate(-86deg)}100%{transform:rotate(-52deg)}}@keyframes glint{50%{opacity:.5;filter:brightness(.7)}}@media(max-width:520px){.entity{transform:translateX(-50%) scale(.78);top:5%}.stage{height:62vh}.orbit{width:245px;height:245px}.controls{bottom:8vh}button{padding:12px 14px;font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main class="scene" id="scene">
<h1>THE SOUL COLLECTOR</h1><div class="tag">THE LAST GATHERER · TIKNATION GIFT LAB</div><div class="backlight"></div>
<div class="stage"><div class="orbit"></div><div class="entity">
<div class="hood"></div><div class="face"></div><i class="eye a"></i><i class="eye b"></i><div class="shoulder a"></div><div class="shoulder b"></div><div class="cloak"></div><div class="arm a"></div><div class="arm b"></div><div class="hand a"></div><div class="hand b"></div><div class="core"></div>
</div><i class="soul s1"></i><i class="soul s2"></i><i class="soul s3"></i><i class="soul s4"></i></div><div class="ground"></div>
<div class="controls"><button id="collect">COLLECT THE SOULS</button><button id="sound">SOUND: OFF</button></div><div class="note">THE HAND REACHES · SOULS ARE DRAWN IN · THE CORE FEEDS</div></main>
<script>
const scene=document.getElementById('scene'),collect=document.getElementById('collect'),sound=document.getElementById('sound');let enabled=false,ctx;
collect.addEventListener('click',()=>{scene.classList.remove('collect');void scene.offsetWidth;scene.classList.add('collect');if(enabled){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(520,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(52,ctx.currentTime+1.3);g.gain.setValueAtTime(.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.35);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+1.35)}catch(e){}}setTimeout(()=>scene.classList.remove('collect'),1600)});
sound.addEventListener('click',()=>{enabled=!enabled;sound.textContent='SOUND: '+(enabled?'ON':'OFF')});
</script></body></html>
