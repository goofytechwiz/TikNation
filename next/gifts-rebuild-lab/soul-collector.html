<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE SOUL COLLECTOR — Rebuild 3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#03070d;color:#effaff;font-family:Georgia,serif}body{overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#183a4a 0,#0a1823 42%,#03060b 82%)}
.scene{height:100svh;min-height:520px;position:relative;display:grid;place-items:center;overflow:hidden;isolation:isolate}
h1{position:absolute;top:4vh;margin:0;letter-spacing:.25em;font-size:clamp(18px,3vw,29px);font-weight:normal;text-shadow:0 0 24px #6edfff}.tag{position:absolute;top:calc(4vh + 42px);font:10px Arial;letter-spacing:.3em;color:#91b8c8}
.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#70ddff13,transparent 52%);pointer-events:none}
.art{width:min(95vw,700px);height:min(73vh,620px);position:relative;display:grid;place-items:center}
svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 18px 28px #000)}
.cloak{fill:url(#cloak);stroke:#607e8f;stroke-width:1.2}.seam{fill:none;stroke:#9bb6c1;stroke-opacity:.25;stroke-width:2}
.skull{fill:url(#bone);stroke:#7b9ca9;stroke-width:1.4}.dark{fill:#03080d}.eye{fill:#aaf5ff;filter:url(#glow)}
.hand{fill:url(#bone);stroke:#73919c;stroke-width:2;stroke-linejoin:round}
.soul{fill:url(#soul);filter:url(#glow);transform-box:fill-box;transform-origin:center;animation:spiral 4s ease-in-out infinite}
.soul:nth-of-type(2){animation-delay:1.1s}.soul:nth-of-type(3){animation-delay:2.2s}
.orb{fill:url(#orb);stroke:#c7faff;stroke-width:2;filter:url(#glow);transform-origin:350px 340px;animation:pulse 1.8s ease-in-out infinite}
.energy{fill:none;stroke:#73dfff;stroke-width:2;stroke-opacity:.55;transform-origin:350px 340px;animation:expand 2s ease-out infinite}
.smoke{fill:none;stroke:#72cde8;stroke-opacity:.2;stroke-width:17;stroke-linecap:round;filter:blur(8px);animation:smoke 5s ease-in-out infinite}
.controls{position:absolute;bottom:7vh;display:flex;gap:12px;z-index:5}button{background:#0b1a24;border:1px solid #73b8cb;color:#eafaff;padding:13px 21px;letter-spacing:.14em;font-size:11px;cursor:pointer;border-radius:2px}button:hover{background:#1b3948;box-shadow:0 0 22px #5bdcff44}.note{position:absolute;bottom:3vh;font:10px Arial;letter-spacing:.2em;color:#88a9b8}
.scene.collect .orb{animation:flare .85s ease-out}.scene.collect .soul{animation-duration:1.2s}.scene.collect .hand.left{animation:grip .8s ease-out}.scene.collect .hand.right{animation:grip .8s ease-out}
@keyframes pulse{50%{transform:scale(1.16);filter:brightness(1.4) drop-shadow(0 0 25px #8ef4ff)}}@keyframes expand{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.9);opacity:0}}@keyframes spiral{0%,8%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:1}80%{opacity:1;transform:translate(var(--x),var(--y)) scale(.65)}100%{opacity:0;transform:translate(0,0) scale(.05)}}@keyframes smoke{50%{stroke-opacity:.38;transform:translateY(-12px)}}@keyframes flare{50%{filter:brightness(2.2) drop-shadow(0 0 55px #5ceaff);transform:scale(1.35)}}@keyframes grip{50%{transform:translateY(18px) rotate(-7deg)}}
@media(max-width:520px){.art{width:110vw;height:66vh;margin-left:-5vw}.controls{bottom:8vh}button{padding:12px 14px;font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main class="scene" id="scene">
<h1>THE SOUL COLLECTOR</h1><div class="tag">THE LAST GATHERER · TIKNATION GIFT LAB</div>
<div class="art">
<svg viewBox="0 0 700 610" role="img" aria-label="A towering skeletal wraith in a torn cloak, holding a brilliant blue soul orb as spirits spiral into it">
<defs>
<linearGradient id="cloak" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050a11"/><stop offset=".43" stop-color="#304c5b"/><stop offset=".72" stop-color="#10232f"/><stop offset="1" stop-color="#03070c"/></linearGradient>
<linearGradient id="bone" x1="0" x2="1"><stop stop-color="#435968"/><stop offset=".5" stop-color="#d1e5e5"/><stop offset="1" stop-color="#435563"/></linearGradient>
<radialGradient id="soul"><stop stop-color="#fff"/><stop offset=".35" stop-color="#9cf4ff"/><stop offset="1" stop-color="#3bb8e8" stop-opacity="0"/></radialGradient>
<radialGradient id="orb"><stop stop-color="#fff"/><stop offset=".22" stop-color="#b9fbff"/><stop offset=".5" stop-color="#39c8ef"/><stop offset="1" stop-color="#075079"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path class="smoke" d="M95 510 Q35 420 120 350 T95 170 M600 510 Q670 420 580 340 T610 160 M210 560 Q150 470 210 390 M500 560 Q560 460 500 390"/>
<!-- ragged cloak -->
<path class="cloak" d="M278 185 Q235 208 205 272 L158 520 L195 493 L203 565 L240 523 L265 580 L290 515 L330 584 L353 510 L388 575 L415 510 L454 557 L463 492 L510 529 L488 345 Q478 230 420 187Z"/>
<path class="seam" d="M280 200 Q250 330 258 520 M420 202 Q455 330 438 520 M350 205 L350 510"/>
<!-- hood and skull -->
<path class="cloak" d="M262 200 Q250 75 350 55 Q450 75 438 200 L410 254 L290 254Z"/>
<path class="skull" d="M302 130 Q350 91 398 130 L390 197 Q382 230 350 239 Q318 230 310 197Z"/>
<path class="dark" d="M310 163 L340 170 L330 190 L309 186Z M390 163 L360 170 L370 190 L391 186Z"/>
<path class="eye" d="M314 171 L337 176 L328 183 L313 180Z M386 171 L363 176 L372 183 L387 180Z"/>
<path class="dark" d="M343 195 L357 195 L350 214Z"/>
<path class="seam" d="M330 218 Q350 227 370 218"/>
<!-- ribs -->
<path class="seam" stroke-width="5" d="M285 275 Q350 310 415 275 M278 303 Q350 342 422 303 M270 334 Q350 373 430 334 M280 365 Q350 400 420 365"/>
<!-- arms -->
<path class="cloak" d="M268 230 Q225 250 194 314 L235 343 Q275 305 305 286Z M432 230 Q475 248 515 305 L475 344 Q440 306 397 285Z"/>
<!-- left skeletal hand reaching -->
<g class="hand left"><path d="M205 320 L182 350 L155 371 L143 360 L172 330 L190 300Z M155 371 L123 393 L111 383 L143 360 M143 360 L119 353 L106 339 L116 330 L145 348 M172 330 L161 302 L166 285 L178 288 L183 315 M187 322 L190 294 L201 282 L211 291 L201 326"/></g>
<!-- right arm and hand presenting orb -->
<g class="hand right"><path d="M490 312 L516 330 L550 338 L561 326 L529 304 L509 281Z M550 338 L582 355 L592 344 L561 326 M561 326 L586 312 L605 296 L597 286 L566 309 M529 304 L541 278 L538 260 L526 262 L515 290 M512 298 L507 270 L495 259 L486 270 L498 304"/></g>
<!-- souls and orb -->
<circle class="orb" cx="350" cy="340" r="38"/>
<circle class="energy" cx="350" cy="340" r="57"/><circle class="energy" cx="350" cy="340" r="75" style="animation-delay:1s"/>
<circle class="soul" cx="95" cy="250" r="23" style="--x:210px;--y:65px"/>
<circle class="soul" cx="600" cy="225" r="25" style="--x:-210px;--y:90px"/>
<circle class="soul" cx="155" cy="440" r="20" style="--x:155px;--y:-115px"/>
<circle class="soul" cx="550" cy="470" r="22" style="--x:-160px;--y:-120px"/>
</svg>
</div>
<div class="controls"><button id="collect">COLLECT THE SOULS</button><button id="sound">SOUND: OFF</button></div><div class="note">SKELETAL HANDS REACH · SPIRITS SPIRAL · THE ORB CONSUMES</div>
</main><script>
const scene=document.getElementById('scene'),collect=document.getElementById('collect'),sound=document.getElementById('sound');let enabled=false,ctx;
collect.addEventListener('click',()=>{scene.classList.remove('collect');void scene.offsetWidth;scene.classList.add('collect');if(enabled){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(380,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(48,ctx.currentTime+1.25);g.gain.setValueAtTime(.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.3);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+1.3)}catch(e){}}setTimeout(()=>scene.classList.remove('collect'),1500)});
sound.addEventListener('click',()=>{enabled=!enabled;sound.textContent='SOUND: '+(enabled?'ON':'OFF')});
</script></body></html>
