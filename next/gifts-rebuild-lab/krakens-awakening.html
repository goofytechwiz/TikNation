<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The Kraken's Awakening</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04111b;color:#e9faff;font-family:system-ui,sans-serif}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 32%,#02081299 100%),linear-gradient(#04101c55,transparent 40%,#02081288)}header{position:fixed;top:env(safe-area-inset-top,12px);left:0;right:0;text-align:center;padding:16px 10px 0;text-shadow:0 2px 12px #00101c;pointer-events:none}.kicker{font-size:10px;letter-spacing:.34em;color:#8addec;font-weight:700}h1{font:500 clamp(24px,5vw,43px) Georgia,serif;letter-spacing:.05em;margin:5px 0}.sub{font-size:10px;letter-spacing:.16em;color:#b5cdd4}.controls{position:fixed;bottom:calc(17px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 10px}button{border:1px solid #8deaff88;background:#041e2bdc;color:#effcff;border-radius:30px;padding:12px 17px;font-size:10px;font-weight:800;letter-spacing:.1em;backdrop-filter:blur(10px)}button.primary{background:linear-gradient(135deg,#0c6172,#173b60);border-color:#9befff}#hint{position:fixed;bottom:calc(73px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:10px;letter-spacing:.13em;color:#b3d4db;text-shadow:0 2px 8px #000;pointer-events:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#04111b;color:#b5eaf3;letter-spacing:.2em;font-size:11px;z-index:5;transition:opacity .5s}#loading.off{opacity:0;pointer-events:none}#err{display:none;position:fixed;top:50%;left:8%;right:8%;text-align:center;color:#ffd6c8;font-size:13px}@media(max-width:520px){h1{font-size:26px}button{padding:11px 14px}}
</style></head><body>
<div id="scene"></div><div class="vignette"></div><header><div class="kicker">TIKNATION · EPIC GIFTS</div><h1>THE KRAKEN'S AWAKENING</h1><div class="sub">THE DEEP HAS CLAIMED ITS SHIP</div></header><div id="hint">A SHADOW MOVES BENEATH THE SURFACE</div><div class="controls"><button class="primary" id="rise">AWAKEN THE KRAKEN</button><button id="sound">SOUND: OFF</button></div><div id="loading">SUMMONING THE DEEP…</div><div id="err"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.getElementById('scene'),loading=document.getElementById('loading');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x061725);scene.fog=new THREE.FogExp2(0x071c2a,.012);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,500);camera.position.set(0,15,43);camera.lookAt(0,3,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bc9dc,0x071018,1.5));const moon=new THREE.DirectionalLight(0xb9e5ff,2.6);moon.position.set(-15,25,12);moon.castShadow=true;scene.add(moon);const rim=new THREE.PointLight(0x168ca8,32,70);rim.position.set(12,8,-15);scene.add(rim);const lanternLight=new THREE.PointLight(0xffa45e,18,28);lanternLight.position.set(0,7,4);scene.add(lanternLight);
// Layered animated ocean surface
const waterGeo=new THREE.PlaneGeometry(260,260,150,150);waterGeo.rotateX(-Math.PI/2);const pos=waterGeo.attributes.position;const base=Float32Array.from(pos.array);const waterMat=new THREE.MeshPhysicalMaterial({color:0x07364a,roughness:.19,metalness:.34,clearcoat:1,clearcoatRoughness:.12,reflectivity:.9,side:THREE.DoubleSide});const water=new THREE.Mesh(waterGeo,waterMat);water.position.y=0;water.receiveShadow=true;scene.add(water);
const horizon=new THREE.Mesh(new THREE.PlaneGeometry(280,65),new THREE.MeshBasicMaterial({color:0x0a2030,transparent:true,opacity:.6}));horizon.position.set(0,23,-95);scene.add(horizon);
// Large timber sailing ship
const ship=new THREE.Group();scene.add(ship);ship.position.set(0,0,-2.4);
const timber=new THREE.MeshStandardMaterial({color:0x4b2b1c,roughness:.78}),trim=new THREE.MeshStandardMaterial({color:0x8a6040,roughness:.7}),iron=new THREE.MeshStandardMaterial({color:0x171e23,roughness:.55,metalness:.65}),canvas=new THREE.MeshStandardMaterial({color:0xc8bea5,roughness:.95,side:THREE.DoubleSide});
const hull=new THREE.Mesh(new THREE.CapsuleGeometry(1,8.6,8,16),timber);hull.rotation.z=Math.PI/2;hull.scale.set(1.05,.86,1.25);hull.position.y=-.72;hull.castShadow=true;hull.receiveShadow=true;ship.add(hull);
const keel=new THREE.Mesh(new THREE.BoxGeometry(9,.35,1.1),iron);keel.position.y=-1.25;ship.add(keel);
const deck=new THREE.Mesh(new THREE.BoxGeometry(10,.28,4.1),trim);deck.position.y=.08;deck.castShadow=true;deck.receiveShadow=true;ship.add(deck);
for(let i=0;i<19;i++){const plank=new THREE.Mesh(new THREE.BoxGeometry(.035,.025,3.95),iron);plank.position.set(-4.75+i*.53,.235,0);ship.add(plank)}
for(const z of [-1.92,1.92]){const rail=new THREE.Mesh(new THREE.BoxGeometry(9.8,.42,.16),timber);rail.position.set(0,.5,z);ship.add(rail);for(let x=-4.55;x<4.6;x+=.55){const post=new THREE.Mesh(new THREE.BoxGeometry(.12,.62,.14),trim);post.position.set(x,.48,z);ship.add(post)}}
const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.3,1.35,1.8),timber);cabin.position.set(-2.8,.88,0);ship.add(cabin);const roof=new THREE.Mesh(new THREE.ConeGeometry(1.7,.8,4),iron);roof.position.set(-2.8,1.92,0);roof.rotation.y=Math.PI/4;ship.add(roof);
function mast(x,h){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.13,.2,h,12),trim);pole.position.set(x,.2+h/2,0);pole.castShadow=true;ship.add(pole);const yard=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,5.5,8),iron);yard.rotation.z=Math.PI/2;yard.position.set(x,.2+h*.68,0);ship.add(yard);const sail=new THREE.Mesh(new THREE.PlaneGeometry(4.5,h*.48),canvas);sail.position.set(x,.2+h*.42,.15);ship.add(sail);const sailBack=new THREE.Mesh(new THREE.PlaneGeometry(4.5,h*.48),canvas);sailBack.position.set(x,.2+h*.42,-.15);sailBack.rotation.y=Math.PI;ship.add(sailBack)}
mast(-.8,10.5);mast(2.3,8.2);
for(const x of [-4,4]){const lamp=new THREE.Mesh(new THREE.SphereGeometry(.17,12,10),new THREE.MeshBasicMaterial({color:0xffbd69}));lamp.position.set(x,.9,1.8);ship.add(lamp)}
// Kraken rises in front of the bow, with eight distinct curling arms
const kraken=new THREE.Group();scene.add(kraken);kraken.position.set(-1.2,-5.9,8.7);
const skin=new THREE.MeshStandardMaterial({color:0x543b42,roughness:.48,metalness:.06}),skinLight=new THREE.MeshStandardMaterial({color:0x80616a,roughness:.52}),sucker=new THREE.MeshStandardMaterial({color:0xd6b8a3,roughness:.62});
const mantle=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),skin);mantle.scale.set(1.55,2.35,1.3);mantle.position.set(0,2.5,0);mantle.castShadow=true;kraken.add(mantle);
const face=new THREE.Mesh(new THREE.SphereGeometry(1,28,20),skinLight);face.scale.set(1.48,1.3,1.2);face.position.set(0,1.05,1.05);kraken.add(face);
for(const x of [-.48,.48]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.18,16,12),new THREE.MeshStandardMaterial({color:0xe3c99c,roughness:.25,emissive:0x321a08,emissiveIntensity:.3}));eye.position.set(x,1.35,2.08);kraken.add(eye);const pupil=new THREE.Mesh(new THREE.SphereGeometry(.08,12,10),new THREE.MeshBasicMaterial({color:0x08090b}));pupil.position.set(x,1.35,2.23);kraken.add(pupil)}
const arms=[];for(let i=0;i<8;i++){const a=i*Math.PI/4;const root=new THREE.Group();root.position.set(Math.cos(a)*.75,.15,Math.sin(a)*.65);kraken.add(root);const points=[];const len=7.5+(i%3)*.65;for(let j=0;j<=24;j++){const t=j/24;points.push(new THREE.Vector3(Math.cos(a)*t*len,Math.sin(t*Math.PI)*.95-t*1.05,Math.sin(a)*t*len+Math.sin(t*4+i)*.32))}const curve=new THREE.CatmullRomCurve3(points);const arm=new THREE.Mesh(new THREE.TubeGeometry(curve,72,.34,12,false),skin);arm.castShadow=true;root.add(arm);for(let j=3;j<20;j++){const t=j/24,p=curve.getPoint(t),tan=curve.getTangent(t),side=new THREE.Vector3(-tan.z,0,tan.x).normalize();for(const s of [-1,1]){const cup=new THREE.Mesh(new THREE.TorusGeometry(.105,.032,6,12),sucker);cup.position.copy(p).addScaledVector(side,s*.235);cup.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),tan.clone().negate());root.add(cup)}}arms.push({root,a})}
// Sea spray and rain
const spray=new THREE.Group();scene.add(spray);const sprayMat=new THREE.MeshBasicMaterial({color:0xa6d9df,transparent:true,opacity:.48});for(let i=0;i<110;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.025+Math.random()*.05,6,5),sprayMat);p.position.set((Math.random()-.5)*27,.08+Math.random()*.3,(Math.random()-.5)*25);spray.add(p)}
const rainN=520,rainPos=new Float32Array(rainN*3);for(let i=0;i<rainN;i++){rainPos[i*3]=(Math.random()-.5)*75;rainPos[i*3+1]=Math.random()*34;rainPos[i*3+2]=(Math.random()-.5)*70}const rainGeo=new THREE.BufferGeometry();rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0x9ac4d3,size:.055,transparent:true,opacity:.42}));scene.add(rain);
let rise=0,target=0,audio=null,osc=null,gain=null,soundOn=false;document.getElementById('rise').addEventListener('click',()=>{target=1;document.getElementById('hint').textContent='THE KRAKEN RISES FROM THE ABYSS'});document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;document.getElementById('sound').textContent='SOUND: '+(soundOn?'ON':'OFF');if(soundOn){audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();osc=audio.createOscillator();gain=audio.createGain();const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=100;osc.type='sawtooth';osc.frequency.value=36;gain.gain.value=.0001;osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start();gain.gain.setTargetAtTime(.045,audio.currentTime,.6)}else if(gain){gain.gain.setTargetAtTime(.0001,audio.currentTime,.3);setTimeout(()=>{try{osc.stop()}catch(e){}},1200)}});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();rise+=(target-rise)*.012;const p=waterGeo.attributes.position;for(let i=0;i<p.count;i++){const x=base[i*3],z=-base[i*3+1];p.array[i*3+2]=base[i*3+2]+Math.sin(x*.19+t*.72)*.17+Math.sin(z*.31-t*.9)*.11+Math.sin((x+z)*.085+t*.48)*.2}p.needsUpdate=true;waterGeo.computeVertexNormals();kraken.position.y=-5.9+rise*6.1+Math.sin(t*.65)*.12;kraken.rotation.z=Math.sin(t*.42)*.035;kraken.rotation.y=Math.sin(t*.3)*.08;ship.position.y=Math.sin(t*.7)*.13;ship.rotation.z=Math.sin(t*.55)*.016;ship.rotation.x=Math.sin(t*.43)*.012;arms.forEach((a,i)=>{a.root.rotation.x=Math.sin(t*.8+i)*.12;a.root.rotation.z=Math.cos(t*.65+i*1.3)*.11+rise*.06});const arr=rainGeo.attributes.position.array;for(let i=0;i<rainN;i++){arr[i*3+1]-=.23;if(arr[i*3+1]<0){arr[i*3+1]=32;arr[i*3]=(Math.random()-.5)*75;arr[i*3+2]=(Math.random()-.5)*70}}rainGeo.attributes.position.needsUpdate=true;spray.rotation.y=t*.025;renderer.render(scene,camera)}animate();
loading.classList.add('off');setTimeout(()=>loading.remove(),650);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){loading.classList.add('off');document.getElementById('err').style.display='block';document.getElementById('err').textContent='The scene could not load on this device. '+e.message;console.error(e)}
</script></body></html>
