<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>THE HAUNTED HOTEL · TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050608;color:#e9e4da;font-family:Georgia,serif;overflow:hidden}.app{height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 10%,#24201c,#050608 70%)}header{height:45px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font:10px/1.2 system-ui;letter-spacing:.19em;color:#b7aa96}header strong{color:#e5cba0;font-weight:600}.view{position:relative;flex:1;min-height:0;overflow:hidden;background:#08090b}canvas{display:block;width:100%;height:100%}.hud{position:absolute;left:0;right:0;bottom:13px;text-align:center;font:10px system-ui;letter-spacing:.2em;color:#d5c9b7;text-shadow:0 2px 8px #000;pointer-events:none;padding:0 12px}.flash{position:absolute;inset:0;background:#fff3d8;opacity:0;pointer-events:none}.controls{flex:none;background:#090b0d;border-top:1px solid #34302a;padding:12px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{background:linear-gradient(#4b3b2b,#1d1915);border:1px solid #a58a66;color:#f4e6ce;padding:12px 17px;border-radius:3px;font:700 11px system-ui;letter-spacing:.13em}button.secondary{background:#151719;border-color:#596067;color:#c7cbd0}button:disabled{opacity:.5}.note{width:100%;text-align:center;font:9px system-ui;letter-spacing:.08em;color:#778087}.shake{animation:shake .11s infinite}@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}100%{transform:translate(0,0)}}@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style></head><body><main class="app"><header><span>TIKNATION · GIFT REBUILD LAB</span><strong>THE HAUNTED HOTEL</strong></header><section class="view" id="view"><canvas id="scene" aria-label="A haunted hotel corridor with an elevator"></canvas><div class="flash" id="flash"></div><div class="hud" id="caption">ROOM 13 IS WAITING FOR YOU</div></section><section class="controls"><button id="trigger">▶ UNLOCK THE HOTEL</button><button class="secondary" id="reset">RESET</button><div class="note">STANDALONE PREVIEW · AUDIO STARTS AFTER TAP · NOT CONNECTED TO LIVE GIFT CATALOG</div></section></main>
<script>
(()=>{const canvas=document.getElementById('scene'),c=canvas.getContext('2d'),view=document.getElementById('view'),caption=document.getElementById('caption'),flash=document.getElementById('flash'),trigger=document.getElementById('trigger');let W=0,H=0,dpr=1,phase=0,start=0,shake=0,flashAmt=0,door=0,figure=0,chand=0,lamps=1,ctx=null,raf=0,timers=[],active=false;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=view.clientWidth;H=view.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);c.setTransform(dpr,0,0,dpr,0,0)}new ResizeObserver(resize).observe(view);resize();
function poly(points,fill,stroke){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function glow(x,y,r,col){let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function draw(t){if(!W||!H)return;let w=W,h=H,shakeX=shake?(Math.random()-.5)*shake:0,shakeY=shake?(Math.random()-.5)*shake:0;c.save();c.translate(shakeX,shakeY);c.clearRect(-10,-10,w+20,h+20);
let bg=c.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#141414');bg.addColorStop(.55,'#27221d');bg.addColorStop(1,'#090a0b');c.fillStyle=bg;c.fillRect(0,0,w,h);
let vanX=w*.5,vanY=h*.36,side=w*.12;
poly([[0,0],[w,0],[w*.82,h*.2],[w*.18,h*.2]],'#171717');poly([[0,0],[w*.18,h*.2],[w*.18,h*.76],[0,h]],'#211c18');poly([[w,0],[w*.82,h*.2],[w*.82,h*.76],[w,h]],'#211c18');poly([[0,h],[w,h],[w*.82,h*.76],[w*.18,h*.76]],'#211b17');
poly([[w*.18,h*.2],[w*.82,h*.2],[w*.82,h*.76],[w*.18,h*.76]],'#181a1b');
let carpet=c.createLinearGradient(0,h*.72,0,h);carpet.addColorStop(0,'#38251f');carpet.addColorStop(.5,'#241814');carpet.addColorStop(1,'#100d0c');poly([[w*.18,h*.76],[w*.82,h*.76],[w,h],[0,h]],carpet);poly([[w*.47,h*.76],[w*.53,h*.76],[w*.61,h],[w*.39,h]],'#6b4735');c.globalAlpha=.25;for(let i=0;i<12;i++){let y=h*.77+i*i*h*.002;c.strokeStyle='#b28a68';c.lineWidth=1;c.beginPath();c.moveTo(w*.18-(i*2),y);c.lineTo(w*.82+(i*2),y);c.stroke()}c.globalAlpha=1;
// wall paneling and picture frames
for(let s of [-1,1]){let x0=s<0?0:w*.82,x1=s<0?w*.18:w;for(let i=0;i<4;i++){let y=h*(.25+i*.13),xx=s<0?x0+i*w*.025:x1-i*w*.025;c.strokeStyle='#594535';c.lineWidth=2;c.strokeRect(xx,y,w*.12,h*.085);c.strokeStyle='#171311';c.strokeRect(xx+4,y+4,w*.12-8,h*.085-8);poly([[xx+12,y+12],[xx+w*.12-12,y+12],[xx+w*.12-12,y+h*.085-12],[xx+12,y+h*.085-12]],'#26201b');glow(xx+w*.06,y+h*.04,w*.07,'rgba(180,122,70,.12)')}}
 // far elevator frame
let ex=w*.385,ey=h*.205,ew=w*.23,eh=h*.55;poly([[ex-w*.025,ey-h*.018],[ex+ew+w*.025,ey-h*.018],[ex+ew+w*.025,ey+eh+h*.025],[ex-w*.025,ey+eh+h*.025]],'#77664f','#a18a68');poly([[ex,ey],[ex+ew,ey],[ex+ew,ey+eh],[ex,ey+eh]],'#080b0d','#b9a17d');let open=door;let gap=ew*open*.48;poly([[ex,ey],[ex+ew/2-gap,ey],[ex+ew/2-gap,ey+eh],[ex,ey+eh]],'#262b2c','#5e625e');poly([[ex+ew/2+gap,ey],[ex+ew,ey],[ex+ew,ey+eh],[ex+ew/2+gap,ey+eh]],'#202526','#5e625e');if(open>.05){let ix=ex+ew/2-gap,iw=2*gap;let dark=c.createLinearGradient(ix,ey,ix+iw,ey);dark.addColorStop(0,'#030506');dark.addColorStop(.5,'#12191b');dark.addColorStop(1,'#020304');c.fillStyle=dark;c.fillRect(ix,ey,iw,eh);glow(w*.5,h*.47,w*.18,'rgba(175,190,181,.16)')}
// silhouette inside elevator
if(figure>0){let fx=w*.5,fy=ey+eh*.7,scale=.3+figure*.7;c.save();c.globalAlpha=Math.min(1,figure);c.translate(fx,fy);c.scale(scale,scale);c.fillStyle='#030405';c.beginPath();c.ellipse(0,-eh*.29,ew*.12,eh*.13,0,0,Math.PI*2);c.fill();poly([[-ew*.13,-eh*.2],[ew*.13,-eh*.2],[ew*.2,eh*.22],[-ew*.2,eh*.22]],'#050607');c.restore()}
// sconces
for(let s of [-1,1])for(let i=0;i<3;i++){let x=s<0?w*(.09+i*.025):w*(.91-i*.025),y=h*(.28+i*.15);let flick=lamps*(.88+.12*Math.sin(t*9+i*3));glow(x,y,w*.14,'rgba(207,145,76,'+(0.12*flick)+')');c.fillStyle='#8b6846';c.fillRect(x-5,y-12,10,24);c.fillStyle='#e7c38b';c.fillRect(x-3,y-9,6,13);}
// chandelier
let cx=w*.5,cy=h*.13+Math.sin(chand)*h*.028,sw=Math.sin(chand)*.15;c.save();c.translate(cx,cy);c.rotate(sw);c.strokeStyle='#a28a67';c.lineWidth=2;c.beginPath();c.moveTo(0,-h*.12);c.lineTo(0,0);c.stroke();c.fillStyle='#594b37';c.beginPath();c.ellipse(0,0,w*.095,h*.018,0,0,Math.PI*2);c.fill();for(let i=-2;i<=2;i++){let x=i*w*.035;c.strokeStyle='#9a805d';c.beginPath();c.moveTo(0,0);c.lineTo(x,h*.025);c.stroke();glow(x, h*.028,w*.05,'rgba(235,180,102,.2)');c.fillStyle='#f1ce91';c.beginPath();c.ellipse(x,h*.028,4,8,0,0,Math.PI*2);c.fill()}c.restore();
// subtle grain specks
for(let i=0;i<55;i++){let x=(i*97+t*3)%w,y=(i*53+t*7)%h;c.fillStyle='rgba(220,205,180,'+(.025+Math.random()*.025)+')';c.fillRect(x,y,1,1)}
let vign=c.createRadialGradient(w/2,h*.48,w*.1,w/2,h*.48,w*.7);vign.addColorStop(0,'transparent');vign.addColorStop(1,'rgba(0,0,0,.72)');c.fillStyle=vign;c.fillRect(0,0,w,h);c.restore();raf=requestAnimationFrame(draw)}
raf=requestAnimationFrame(draw);
function later(fn,ms){let id=setTimeout(fn,ms);timers.push(id)}
function tone(f,d,g,type='sine',end=f){if(!ctx)return;let o=ctx.createOscillator(),a=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(1,end),ctx.currentTime+d);a.gain.setValueAtTime(g,ctx.currentTime);a.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(a);a.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}
function noise(d,gain,low=300){if(!ctx)return;let b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;let s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=low;g.gain.setValueAtTime(gain,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);s.connect(f);f.connect(g);g.connect(ctx.destination);s.start();s.stop(ctx.currentTime+d)}
function reset(){timers.forEach(clearTimeout);timers=[];active=false;door=0;figure=0;chand=0;lamps=1;shake=0;flashAmt=0;flash.style.opacity=0;caption.textContent='ROOM 13 IS WAITING FOR YOU';trigger.disabled=false;view.classList.remove('shake')}
function run(){if(active)return;active=true;trigger.disabled=true;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}caption.textContent='THE HOTEL IS WAKING UP';tone(42,3,.22,'sawtooth',30);noise(3,.12,110);chand=1.8;later(()=>{caption.textContent='SOMEONE IS MOVING UPSTAIRS';lamps=.2;noise(.8,.18,900);tone(72,1.2,.15,'triangle',38)},1800);later(()=>{caption.textContent='ROOM 13 HAS OPENED';lamps=1;noise(.25,.2,1400);tone(170,.5,.1,'metallic',65)},3300);later(()=>{caption.textContent='THE ELEVATOR IS COMING';tone(55,2,.25,'sawtooth',35);noise(2,.18,180);door=.35},4800);later(()=>{door=1;figure=.08;caption.textContent='THE ELEVATOR IS EMPTY…';tone(110,1.5,.15,'triangle',60)},6200);later(()=>{figure=1;caption.textContent='NO. IT ISN’T.';tone(520,.2,.08,'sine',180);tone(430,.2,.08,'sine',120)},7600);later(()=>{caption.textContent='';view.classList.add('shake');shake=5;lamps=.12;noise(1.4,.35,1800);tone(38,1.5,.5,'sawtooth',24);flash.style.opacity=.7},8900);later(()=>{flash.style.opacity=0;view.classList.remove('shake');shake=0;door=0;figure=0;lamps=1;caption.textContent='THE ELEVATOR CLOSED. THE FOOTSTEPS DID NOT STOP.';tone(65,1.8,.18,'triangle',28)},10300);later(()=>{active=false;trigger.disabled=false},12500)}
trigger.addEventListener('click',run);document.getElementById('reset').addEventListener('click',reset);window.addEventListener('pagehide',()=>cancelAnimationFrame(raf));
})();
</script></body></html>
