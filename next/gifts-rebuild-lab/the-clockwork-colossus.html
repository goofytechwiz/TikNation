<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikNation · The Clockwork Colossus</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#f4ead8;font-family:Arial,sans-serif}#scene{height:100%;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#8b674244,transparent 42%),linear-gradient(#172331,#46515a 58%,#10171c)}.moon{position:absolute;right:13%;top:9%;width:78px;height:78px;border-radius:50%;background:#d7c6a0;box-shadow:0 0 55px #d7c6a077}.city{position:absolute;bottom:16%;height:38%;width:100%;display:flex;align-items:end;gap:5px}.building{flex:1;min-width:12px;background:linear-gradient(90deg,#101820,#344049,#121a20);border-top:2px solid #667078;position:relative}.building:after{content:"";position:absolute;inset:12px 6px;background:repeating-linear-gradient(90deg,transparent 0 12px,#e2a85b88 13px 16px),repeating-linear-gradient(0deg,transparent 0 17px,#e2a85b66 18px 21px)}.ground{position:absolute;bottom:0;height:18%;width:100%;background:linear-gradient(#353b3d,#090d10);border-top:3px solid #78674e}.titan{position:absolute;z-index:2;bottom:13%;left:50%;width:min(54vw,380px);height:min(70vh,570px);transform:translateX(-50%);animation:stride 2.8s ease-in-out infinite}.head{position:absolute;top:2%;left:35%;width:30%;height:16%;border:6px solid #687276;border-radius:38% 38% 22% 22%;background:linear-gradient(120deg,#b5a27a,#354148 60%,#121a20);box-shadow:inset 0 0 20px #000}.head:after{content:"";position:absolute;left:20%;right:20%;top:52%;height:7px;background:#ffb044;box-shadow:0 0 18px 5px #ff9b32}.torso{position:absolute;top:19%;left:20%;width:60%;height:43%;border:8px solid #707a7c;border-radius:22%;background:repeating-linear-gradient(90deg,#202a30 0 17px,#8a8068 18px 23px,#303a3e 24px 39px);box-shadow:inset 0 0 30px #000}.core{position:absolute;left:35%;top:24%;width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff5c9 0 8%,#f3a63f 24%,#713817 55%,#10171b 70%);box-shadow:0 0 24px 10px #e88e32aa;animation:pulse 1.5s infinite}.gear{position:absolute;top:38%;width:26%;aspect-ratio:1;border:9px dotted #c1a875;border-radius:50%;background:#1b2429;animation:spin 7s linear infinite}.gear.a{left:0}.gear.b{right:0;animation-direction:reverse}.arm{position:absolute;top:25%;width:18%;height:45%;border:8px solid #778083;border-radius:30%;background:repeating-linear-gradient(0deg,#263239 0 17px,#9a8a69 18px 24px);transform-origin:50% 7%;animation:arms 1.7s infinite alternate}.arm.a{left:4%}.arm.b{right:4%;animation-delay:-.8s}.leg{position:absolute;top:59%;width:22%;height:36%;border:8px solid #697477;border-radius:15%;background:repeating-linear-gradient(90deg,#273239 0 15px,#8d7b5a 16px 22px);transform-origin:50% 0;animation:legs 1.7s infinite alternate}.leg.a{left:26%}.leg.b{right:26%;animation-delay:-.8s}.foot{position:absolute;bottom:0;left:-20%;width:140%;height:18%;border:6px solid #778083;background:#28343a;border-radius:22%}.smoke{position:absolute;bottom:18%;left:46%;width:190px;height:150px;background:radial-gradient(ellipse,#c0c2bd66,transparent 70%);filter:blur(14px);animation:smoke 3s infinite alternate}.hud{position:absolute;z-index:4;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.15em;color:#e6d8bd}.panel{position:absolute;z-index:5;bottom:14px;left:0;right:0;text-align:center;padding:12px}h1{font-size:clamp(25px,5.5vw,48px);letter-spacing:.12em;margin:0 0 8px;text-shadow:0 3px 18px #000}#status{font-size:11px;letter-spacing:.16em;color:#f1b96c;min-height:16px}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}button{background:#17232b;color:#f6e8ce;border:1px solid #b39465;border-radius:3px;padding:12px 17px;font-weight:bold;letter-spacing:.07em}.note{font-size:10px;color:#b9c0c1;margin-top:9px}.flash{position:absolute;inset:0;z-index:3;background:#ffe3b5;opacity:0;pointer-events:none}#scene.hit{animation:shake .42s}#scene.hit .flash{animation:flash .45s}@keyframes stride{0%,100%{transform:translateX(-50%) translateY(0) scale(.95)}50%{transform:translateX(-50%) translateY(-8px) scale(1.02)}}@keyframes legs{to{transform:rotate(12deg)}}@keyframes arms{to{transform:rotate(-8deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{filter:brightness(1.8);box-shadow:0 0 35px 15px #e88e32bb}}@keyframes smoke{to{transform:translate(50px,-24px) scale(1.25);opacity:.45}}@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}@keyframes flash{0%{opacity:.7}100%{opacity:0}}@media(max-width:600px){.titan{width:76vw;height:62vh;bottom:16%}.moon{width:58px;height:58px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main id="scene"><div class="moon"></div><div class="city" id="city"></div><div class="smoke"></div><div class="titan"><div class="head"></div><div class="torso"><div class="core"></div><div class="gear a"></div><div class="gear b"></div></div><div class="arm a"></div><div class="arm b"></div><div class="leg a"><div class="foot"></div></div><div class="leg b"><div class="foot"></div></div></div><div class="ground"></div><div class="flash"></div><div class="hud"><span>TIKNATION · GIFT REBUILD LAB</span><span>PREVIEW · NOT LIVE</span></div><div class="panel"><h1>THE CLOCKWORK COLOSSUS</h1><div id="status">DISTANT METAL THUNDER · APPROACHING</div><div class="controls"><button id="trigger">▶ TRIGGER EVENT</button><button id="sound">SOUND: OFF</button><button id="reset">RESET</button></div><div class="note">Preview only · Viewer stays in place · Tap trigger to begin</div></div></main><script>
const city=document.getElementById('city');for(let i=0;i<19;i++){let b=document.createElement('div');b.className='building';b.style.height=(25+Math.random()*70)+'%';city.appendChild(b)}
const scene=document.getElementById('scene'),status=document.getElementById('status'),trigger=document.getElementById('trigger'),sound=document.getElementById('sound');let timers=[],ctx=null,enabled=false,run=0;
function tone(f,d,type='sawtooth',vol=.04,delta=0){if(!enabled)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,ctx.currentTime);if(delta)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+delta),ctx.currentTime+d);g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function impact(){scene.classList.remove('hit');void scene.offsetWidth;scene.classList.add('hit');tone(48,.8,'sawtooth',.13,-25);tone(90,.5,'triangle',.08,-45)}
function later(fn,ms,id){timers.push(setTimeout(()=>{if(id===run)fn()},ms))}
function reset(){run++;timers.forEach(clearTimeout);timers=[];trigger.disabled=false;scene.classList.remove('hit');status.textContent='DISTANT METAL THUNDER · APPROACHING'}
function start(){reset();let id=run;trigger.disabled=true;status.textContent='THE CITY SHUDDERS · GEARS ENGAGING';tone(58,1.6,'sawtooth',.05,20);later(()=>{status.textContent='COLOSSUS DETECTED · 300 METERS';tone(110,1,'square',.03,-30)},1600,id);later(()=>{status.textContent='PISTON DRIVE · CLOSING DISTANCE';tone(72,1.3,'sawtooth',.07,15)},3200,id);later(()=>{status.textContent='IMPACT WARNING';impact()},4900,id);later(()=>{status.textContent='THE COLOSSUS HAS ARRIVED';impact()},5700,id);later(()=>{status.textContent='EVENT COMPLETE · READY TO REPLAY';trigger.disabled=false},7000,id)}
trigger.addEventListener('click',start);document.getElementById('reset').addEventListener('click',reset);sound.addEventListener('click',()=>{enabled=!enabled;sound.textContent='SOUND: '+(enabled?'ON':'OFF');if(enabled)tone(170,.12,'sine',.025)});
</script></body></html>
