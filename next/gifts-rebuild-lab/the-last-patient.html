<script>
(()=>{let ctx=null,master=null,nodes=[],beepTimer=null,heartTimer=null,starting=false;
const status=()=>document.getElementById('status');
const toggle=()=>document.getElementById('soundToggle');
function stop(){if(beepTimer)clearInterval(beepTimer);if(heartTimer)clearInterval(heartTimer);beepTimer=heartTimer=null;const old=ctx;ctx=null;master=null;nodes=[];if(old)old.close().catch(()=>{});toggle().textContent='SOUND ON';status().textContent='SOUND OFF'}
function tone(freq,type,volume,filterFreq){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;let last=o;if(filterFreq){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=filterFreq;o.connect(f);last=f}last.connect(g);g.gain.value=volume;g.connect(master);o.start();nodes.push(o)}
function beep(){if(!ctx||!master||ctx.state!=='running')return;const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(660,t+.11);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.24,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.24);o.connect(g);g.connect(master);o.start(t);o.stop(t+.26)}
function heartbeat(){if(!ctx||!master||ctx.state!=='running')return;const t=ctx.currentTime;for(const [offset,frequency] of [[0,68],[.18,54]]){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(frequency,t+offset);o.frequency.exponentialRampToValueAtTime(frequency*.68,t+offset+.16);g.gain.setValueAtTime(.0001,t+offset);g.gain.exponentialRampToValueAtTime(.19,t+offset+.018);g.gain.exponentialRampToValueAtTime(.0001,t+offset+.23);o.connect(g);g.connect(master);o.start(t+offset);o.stop(t+offset+.25)}}
async function start(){if(starting)return;starting=true;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC){status().textContent='THIS BROWSER DOES NOT SUPPORT WEB AUDIO';return}if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=.78;master.connect(ctx.destination);tone(110,'sawtooth',.055,520);tone(120,'sine',.035);tone(240,'sine',.012);tone(196,'triangle',.018,700)}await ctx.resume();if(ctx.state!=='running'){status().textContent='AUDIO BLOCKED · TAP SOUND ON AGAIN';return}if(!beepTimer){beep();heartbeat();beepTimer=setInterval(beep,3400);heartTimer=setInterval(heartbeat,2600)}toggle().textContent='SOUND ON ✓';status().textContent='WARD 09 AUDIO ACTIVE · HUM + MONITOR + HEARTBEAT'}catch(e){console.error(e);status().textContent='AUDIO ERROR · TAP SOUND ON AGAIN'}finally{starting=false}}
window.startWardAudio=start;window.stopWardAudio=stop;
toggle().addEventListener('click',()=>{if(ctx&&ctx.state==='running')stop();else start()});
document.getElementById('unlock').addEventListener('click',start);
})();
</script>
