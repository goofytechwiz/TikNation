<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE DEMONIC PUPPETEER · TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#090909;color:#eee;font:15px/1.4 system-ui;display:grid;place-items:center;padding:16px}.lab{width:min(900px,100%)}.eyebrow{color:#b89a70;font-size:11px;letter-spacing:.2em}h1{font-size:clamp(26px,6vw,44px);letter-spacing:.09em;margin:6px 0}.sub,.note{color:#a6a29b;font-size:13px}.scene{height:min(66vh,570px);min-height:400px;margin-top:14px;position:relative;overflow:hidden;border:1px solid #39342d;border-radius:12px;background:radial-gradient(ellipse at 50% 45%,#37312a,#171513 50%,#070707 100%);perspective:700px}.curtain{position:absolute;inset:0;background:linear-gradient(90deg,#160f0d 0 12%,transparent 20% 80%,#160f0d 90%),repeating-linear-gradient(90deg,#211512,#211512 28px,#2a1b17 31px,#1a100e 48px);opacity:.65;mask-image:linear-gradient(90deg,#000,transparent 24% 76%,#000)}.spot{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 28%,#e8d9b022,transparent 50%)}.strings{position:absolute;top:0;left:50%;height:25%;width:1px;background:#9d927e;box-shadow:-55px 0 #8a806e,55px 0 #8a806e}.puppet{position:absolute;left:50%;bottom:9%;width:230px;height:350px;transform:translateX(-50%);opacity:0;filter:drop-shadow(0 18px 14px #000)}.head{position:absolute;left:76px;top:12px;width:78px;height:98px;border-radius:46% 46% 43% 43%;background:radial-gradient(ellipse at 36% 24%,#f1e9d7,#b9ad98 52%,#62594d);box-shadow:inset -9px -7px 12px #29241f}.head:before{content:"";position:absolute;left:13px;top:47px;width:52px;height:31px;border-bottom:3px solid #33211e;border-radius:50%;background:linear-gradient(transparent 60%,#241b18 62%)}.crack{position:absolute;top:18px;left:48px;width:2px;height:40px;background:#5e5145;transform:rotate(22deg);box-shadow:3px 15px #665a4b}.eye{position:absolute;top:39px;width:10px;height:8px;border-radius:50%;background:#171513;box-shadow:0 0 8px #a43b2b}.eye:after{content:"";display:block;width:3px;height:3px;border-radius:50%;background:#e3c9a0;margin:2px}.eye.one{left:17px}.eye.two{right:17px}.neck{position:absolute;top:104px;left:108px;width:14px;height:23px;background:#8b806e}.torso{position:absolute;top:122px;left:65px;width:100px;height:115px;background:linear-gradient(90deg,#221b19,#65564a 48%,#211917);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);border:1px solid #89765e}.button{position:absolute;top:155px;left:112px;width:7px;height:7px;border-radius:50%;background:#b49b70;box-shadow:0 22px #b49b70,0 44px #b49b70}.arm{position:absolute;top:127px;width:17px;height:112px;background:linear-gradient(90deg,#241c18,#9a8871,#342720);border-radius:8px;transform-origin:top}.arm:after{content:"";position:absolute;bottom:-12px;left:2px;width:14px;height:26px;background:#9c8a70;border-radius:40%}.left{left:70px;transform:rotate(25deg)}.right{right:65px;transform:rotate(-25deg)}.leg{position:absolute;top:226px;width:21px;height:105px;background:linear-gradient(90deg,#211a17,#8a7863,#2a211c);transform-origin:top}.leg.l{left:91px;transform:rotate(7deg)}.leg.r{right:91px;transform:rotate(-7deg)}.scene.show .puppet{opacity:1;animation:lower 1.8s ease-out forwards}.scene.show .left{animation:jerkL .9s 2s infinite alternate}.scene.show .right{animation:jerkR 1.1s 2.2s infinite alternate}.scene.break .strings{opacity:0}.scene.break .puppet{animation:breakfree .65s ease-in forwards}.scene.lunge .puppet{animation:lunge .55s ease-in forwards}.caption{position:absolute;bottom:16px;width:100%;text-align:center;letter-spacing:.22em;font-size:11px;color:#d6c9ad;text-shadow:0 2px 7px #000}

</style></head><body><main class="lab"><div class="eyebrow">TIKNATION · GIFT REBUILD LAB</div><h1>THE DEMONIC PUPPETEER</h1><div class="sub">The strings are moving. The puppeteer is nowhere to be seen.</div>
<div class="scene" id="scene"><div class="curtain"></div><div class="spot"></div><div class="strings"></div><div class="puppet"><div class="head"><i class="eye one"></i><i class="eye two"></i><i class="crack"></i></div><div class="neck"></div><div class="torso"></div><i class="button"></i><div class="arm left"></div><div class="arm right"></div><div class="leg l"></div><div class="leg r"></div></div><div class="caption" id="caption">A PERFORMANCE FOR ONE</div></div>

<script>
const s=document.getElementById('scene'),c=document.getElementById('caption'),t=document.getElementById('trigger'),b=document.getElementById('sound');let audio=false,ctx=null,ts=[];
function tone(f,d,v,w='sawtooth',delay=0){if(!audio)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type=w;o.frequency.setValueAtTime(f,ctx.currentTime+delay);o.frequency.exponentialRampToValueAtTime(Math.max(28,f*.35),ctx.currentTime+delay+d);g.gain.setValueAtTime(.0001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(v,ctx.currentTime+delay+.04);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+d);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+d+.02)}catch(e){}}
function reset(){ts.forEach(clearTimeout);ts=[];s.classList.remove('show','break','lunge');c.textContent='A PERFORMANCE FOR ONE';t.disabled=false;t.textContent='BEGIN THE PERFORMANCE'}
t.onclick=()=>{reset();void s.offsetWidth;s.classList.add('show');t.disabled=true;tone(95,3,.13,'triangle');c.textContent='THE STRINGS TIGHTEN';ts.push(setTimeout(()=>{c.textContent='ITS EYES ARE FOLLOWING YOU';tone(460,.12,.09,'square');tone(390,.12,.08,'square',.16)},2300));ts.push(setTimeout(()=>{s.classList.add('break');c.textContent='THE STRINGS... HAVE SNAPPED';tone(42,1.5,.25);tone(780,.15,.08,'square',.08)},4700));ts.push(setTimeout(()=>{s.classList.add('lunge');c.textContent='YOUR TURN TO SCREAM';tone(32,1,.28);},5900));ts.push(setTimeout(()=>{t.disabled=false;t.textContent='PLAY AGAIN'},6800))};
b.onclick=()=>{audio=!audio;b.textContent='SOUND: '+(audio?'ON':'OFF');if(audio){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();tone(160,.2,.07,'triangle')}};document.getElementById('reset').onclick=reset;
</script></body></html>
