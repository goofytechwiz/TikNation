<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THE FEATHERED OMEN · Rebuild 4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070b;color:#edf1ef;font-family:Arial,sans-serif}
#stage{position:relative;width:100%;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#27343c 0,#0c151b 44%,#020507 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.brand{position:absolute;top:6%;width:100%;text-align:center;z-index:2;letter-spacing:.32em;font-size:10px;color:#c2d0d09c;pointer-events:none}
.brand b{display:block;margin-top:12px;font-size:clamp(25px,6vw,55px);letter-spacing:.14em;color:#f1f4f2;text-shadow:0 0 28px #d6e4e455}
.status{position:absolute;bottom:calc(max(28px,env(safe-area-inset-bottom)) + 70px);width:100%;text-align:center;z-index:2;color:#c5d0d09c;font-size:10px;letter-spacing:.18em;pointer-events:none}
.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));width:100%;display:flex;justify-content:center;gap:12px;z-index:3;padding:0 12px}
button{min-width:145px;padding:15px 18px;border:1px solid #b6c7c77a;background:#101a20;color:#eef3f2;font-weight:bold;letter-spacing:.14em;font-size:10px;border-radius:2px;cursor:pointer}
button.primary{background:#d9e4e2;color:#101619;border-color:#d9e4e2}
</style></head><body><main id="stage"><canvas id="scene"></canvas>
<div class="brand">TIKNATION · LEGENDARY GIFT<b>THE FEATHERED OMEN</b></div>
<div class="status" id="status">THE STORM IS GATHERING</div>
<div class="controls"><button class="primary" id="trigger">SUMMON THE OMEN</button><button id="sound">SOUND: OFF</button></div></main>
<script>
(()=>{
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),trigger=document.getElementById('trigger'),sound=document.getElementById('sound');
let W=0,H=0,dpr=1,active=false,start=0,feathers=[],rain=[],lightning=0,audioOn=false,audioCtx=null,last=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);rain=Array.from({length:Math.max(80,Math.floor(W*H/4200))},()=>({x:Math.random()*W,y:Math.random()*H,v:4+Math.random()*8,l:8+Math.random()*16}));}
addEventListener('resize',resize);resize();
const lerp=(a,b,t)=>a+(b-a)*t;
function path(points,fill,stroke=null,width=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}}
function feather(x,y,len,w,angle,color,alpha=1){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.globalAlpha=alpha;const g=ctx.createLinearGradient(-w/2,0,w/2,len);g.addColorStop(0,'#080e13');g.addColorStop(.45,color);g.addColorStop(1,'#070b0f');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-w*.65,len*.25,-w*.55,len*.78,0,len);ctx.bezierCurveTo(w*.55,len*.78,w*.65,len*.25,0,0);ctx.fill();ctx.strokeStyle='#a5b3b5';ctx.globalAlpha*=.2;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(0,len*.92);ctx.stroke();ctx.restore();}
function wing(side,flap){ctx.save();ctx.scale(side,1);ctx.rotate(flap);const grad=ctx.createLinearGradient(0,-30,0,150);grad.addColorStop(0,'#44535b');grad.addColorStop(.35,'#1d2a31');grad.addColorStop(1,'#060b0f');path([[0,0],[45,-22],[115,-65],[205,-104],[310,-142],[282,-98],[350,-115],[302,-54],[365,-58],[300,-8],[345,8],[250,24],[160,34],[70,25]],grad,'#82919855',1);
for(let i=0;i<15;i++){const t=i/14;feather(42+t*255,-12-t*100,95+t*65,22,-.18-t*.23,'#3c4b53',.95);}
for(let i=0;i<13;i++){const t=i/12;feather(30+t*205,8+t*1,78,20,-.35-t*.08,'#25343b',.9);}
ctx.restore();}
function raven(cx,cy,scale,flap,headTurn=0){ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
ctx.shadowColor='#000';ctx.shadowBlur=30;ctx.shadowOffsetY=16;
wing(-1,flap);wing(1,-flap);
const body=ctx.createRadialGradient(-20,-15,8,0,20,100);body.addColorStop(0,'#3b4a52');body.addColorStop(.4,'#17232a');body.addColorStop(1,'#05090d');
ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,22,52,83,-.12,0,Math.PI*2);ctx.fill();
for(let i=0;i<9;i++)feather(-34+i*8,57,75,15,(i-4)*.055,'#17232a',.9);
ctx.save();ctx.translate(headTurn,0);ctx.fillStyle='#111a20';ctx.beginPath();ctx.ellipse(0,-73,34,38,-.12,0,Math.PI*2);ctx.fill();
const sheen=ctx.createLinearGradient(-28,-100,24,-45);sheen.addColorStop(0,'#68777d');sheen.addColorStop(.35,'#1b282f');sheen.addColorStop(1,'#080d11');ctx.fillStyle=sheen;ctx.beginPath();ctx.ellipse(-3,-77,31,34,-.1,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#b79a69';ctx.beginPath();ctx.moveTo(17,-77);ctx.lineTo(92,-64);ctx.lineTo(21,-52);ctx.closePath();ctx.fill();ctx.fillStyle='#38372f';ctx.beginPath();ctx.moveTo(86,-64);ctx.lineTo(24,-59);ctx.lineTo(48,-46);ctx.closePath();ctx.fill();
ctx.fillStyle='#070a0c';ctx.beginPath();ctx.ellipse(9,-83,10,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e7c78c';ctx.beginPath();ctx.arc(13,-83,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#080a0b';ctx.beginPath();ctx.arc(14,-83,1.8,0,Math.PI*2);ctx.fill();ctx.restore();
ctx.shadowBlur=0;ctx.strokeStyle='#343b3e';ctx.lineWidth=5;for(let s of [-1,1]){ctx.beginPath();ctx.moveTo(s*19,85);ctx.lineTo(s*20,115);ctx.stroke();ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s*20,115);ctx.lineTo(s*35,121);ctx.moveTo(s*20,115);ctx.lineTo(s*12,125);ctx.moveTo(s*20,115);ctx.lineTo(s*22,128);ctx.stroke();}
ctx.restore();}
function drawStorm(t){const bg=ctx.createRadialGradient(W*.5,H*.52,10,W*.5,H*.52,Math.max(W,H)*.75);bg.addColorStop(0,'#34424a');bg.addColorStop(.34,'#16232b');bg.addColorStop(1,'#020508');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
for(let i=0;i<5;i++){const x=W*(.5+Math.sin(t*.12+i*1.7)*.36),y=H*(.36+i*.1);const g=ctx.createRadialGradient(x,y,4,x,y,W*.35);g.addColorStop(0,'#9eafb31b');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
ctx.save();ctx.translate(W/2,H*.54);ctx.rotate(t*.035);ctx.strokeStyle='#b8cbd014';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(0,0,W*(.18+i*.07),H*(.1+i*.04),0,0,Math.PI*1.8);ctx.lineWidth=1;ctx.stroke();}ctx.restore();
ctx.strokeStyle='#b8cbd04a';ctx.lineWidth=1;for(const r of rain){ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-2,r.y+r.l);ctx.stroke();r.y+=r.v;r.x-=.8;if(r.y>H){r.y=-20;r.x=Math.random()*W;}}
if(lightning>0){ctx.fillStyle='rgba(219,235,241,'+(lightning*.32)+')';ctx.fillRect(0,0,W,H);lightning=Math.max(0,lightning-.08);}
}
function animate(now){requestAnimationFrame(animate);const t=now/1000;if(!last)last=now;const dt=Math.min(.04,(now-last)/1000);last=now;drawStorm(t);
if(active){const p=Math.min(1,(t-start)/2.3),ease=1-Math.pow(1-p,3),scale=lerp(.05,Math.min(W/760,H/470)*1.08,ease),cy=lerp(H*1.22,H*.52,ease);raven(W/2,cy,scale,Math.sin(t*5.5)*.26,Math.sin(t*.8)*4);if(p>.78&&Math.random()<.16)lightning=.9;}
else if(!reduced){raven(W/2,H*.53,Math.min(W/760,H/470)*.9,Math.sin(t*2.2)*.07,Math.sin(t*.35)*2);}
for(let i=feathers.length-1;i>=0;i--){const f=feathers[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=70*dt;f.rot+=f.spin*dt;f.life-=dt;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.globalAlpha=Math.max(0,Math.min(1,f.life));feather(0,0,f.len,f.w,0,'#43515a',1);ctx.restore();if(f.life<=0)feathers.splice(i,1);}
}
function burst(){for(let i=0;i<65;i++){const a=Math.random()*Math.PI*2,s=120+Math.random()*440;feathers.push({x:W/2+(Math.random()-.5)*80,y:H*.53+(Math.random()-.5)*55,vx:Math.cos(a)*s,vy:Math.sin(a)*s-90,spin:(Math.random()-.5)*9,rot:Math.random()*6,len:24+Math.random()*32,w:8+Math.random()*9,life:2.4+Math.random()*1.8});}}
function rumble(){if(!audioOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(48,t);o.frequency.exponentialRampToValueAtTime(24,t+2);f.type='lowpass';f.frequency.value=110;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+2.3);o.connect(f).connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+2.4);}catch(e){}}
trigger.addEventListener('click',()=>{active=true;start=performance.now()/1000;burst();lightning=1;status.textContent='THE RAVEN DESCENDS';trigger.disabled=true;rumble();setTimeout(()=>{status.textContent='WINGS OF THE TEMPEST';lightning=1;},2300);setTimeout(()=>{active=false;trigger.disabled=false;status.textContent='THE OMEN IS WATCHING';},6200);});
sound.addEventListener('click',()=>{audioOn=!audioOn;sound.textContent='SOUND: '+(audioOn?'ON':'OFF');if(audioOn)rumble();});
requestAnimationFrame(animate);
})();
</script></body></html>
