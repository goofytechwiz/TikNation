<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THE FEATHERED OMEN · Rebuild 7</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020609;color:#edf1ef;font-family:Arial,sans-serif}
#stage{position:relative;width:100%;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 56%,#34434b 0,#111d24 42%,#020507 100%)}
#storm{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.brand{position:absolute;top:6%;width:100%;text-align:center;z-index:4;letter-spacing:.32em;font-size:10px;color:#d0dcddaa;pointer-events:none}
.brand b{display:block;margin-top:12px;font-size:clamp(25px,6vw,55px);letter-spacing:.14em;color:#f1f4f2;text-shadow:0 0 28px #d6e4e455}
.bird-wrap{position:absolute;inset:17% 0 17%;z-index:2;display:grid;place-items:center;opacity:1;transform:translateY(0) scale(1);transition:opacity .7s}
model-viewer{width:min(94vw,760px);height:100%;background:transparent;--poster-color:transparent;--progress-bar-color:#aabcc3;filter:drop-shadow(0 24px 26px #000b)}
.bird-wrap.summon{animation:arrival 2.5s cubic-bezier(.16,.75,.25,1) both}
@keyframes arrival{0%{opacity:0;transform:translateY(42vh) scale(.24) rotate(-9deg)}65%{opacity:1;transform:translateY(-2vh) scale(1.08) rotate(2deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
.status{position:absolute;bottom:calc(max(28px,env(safe-area-inset-bottom)) + 70px);width:100%;text-align:center;z-index:4;color:#c5d0d09c;font-size:10px;letter-spacing:.18em;pointer-events:none}
.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));width:100%;display:flex;justify-content:center;gap:12px;z-index:5;padding:0 12px}
button{min-width:145px;padding:15px 18px;border:1px solid #b6c7c77a;background:#101a20;color:#eef3f2;font-weight:bold;letter-spacing:.14em;font-size:10px;border-radius:2px;cursor:pointer}
button.primary{background:#d9e4e2;color:#101619;border-color:#d9e4e2}
.feather{position:absolute;z-index:3;width:5px;height:38px;border-radius:100% 0 100% 0;background:linear-gradient(90deg,#080d11,#829096,#111a20);opacity:0;pointer-events:none}
.feather.fly{animation:featherFly 2.4s ease-out both}
@keyframes featherFly{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--spin))}}
#flash{position:absolute;inset:0;z-index:3;background:#e4f1f5;opacity:0;pointer-events:none}
#flash.bolt{animation:bolt .45s ease-out}
@keyframes bolt{0%,100%{opacity:0}12%{opacity:.58}30%{opacity:.05}52%{opacity:.35}70%{opacity:0}}
@media(prefers-reduced-motion:reduce){.bird-wrap.summon,.feather.fly,#flash.bolt{animation:none}.bird-wrap{opacity:1}}
</style></head><body><main id="stage"><canvas id="storm"></canvas>
<div class="brand">TIKNATION · LEGENDARY GIFT<b>THE FEATHERED OMEN</b></div>
<div class="bird-wrap" id="birdWrap"><model-viewer id="raven" src="https://cdn.3dassets.dev/assets/28082/v1/model.glb" alt="Detailed 3D model of a common raven with glossy black feather ranks, heavy chisel-shaped bill, shaggy throat feathers and wedge-shaped tail" camera-controls auto-rotate auto-rotate-delay="0" rotation-per-second="18deg" camera-orbit="0deg 76deg 2.3m" field-of-view="28deg" camera-target="0m 0.27m 0m" exposure="1.35" shadow-intensity="1" environment-image="neutral" interaction-prompt="none"></model-viewer></div>
<div id="flash"></div><div class="status" id="status">THE STORM IS GATHERING</div>
<div class="controls"><button class="primary" id="trigger">SUMMON THE OMEN</button><button id="sound">SOUND: OFF</button></div></main>
<script>
(()=>{const canvas=document.getElementById('storm'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),trigger=document.getElementById('trigger'),sound=document.getElementById('sound'),wrap=document.getElementById('birdWrap'),raven=document.getElementById('raven'),flash=document.getElementById('flash');let W=0,H=0,rain=[],audioOn=false,audioCtx=null,last=0,stormTime=0;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);rain=Array.from({length:Math.max(80,Math.floor(W*H/4200))},()=>({x:Math.random()*W,y:Math.random()*H,v:4+Math.random()*8,l:8+Math.random()*16}));}addEventListener('resize',resize);resize();
function frame(now){requestAnimationFrame(frame);const t=now/1000,dt=Math.min(.04,(now-last)/1000||.016);last=now;const bg=ctx.createRadialGradient(W*.5,H*.52,10,W*.5,H*.52,Math.max(W,H)*.75);bg.addColorStop(0,'#34434b');bg.addColorStop(.38,'#15232b');bg.addColorStop(1,'#020508');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H*.54);ctx.rotate(t*.035);ctx.strokeStyle='#b8cbd014';for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(0,0,W*(.18+i*.07),H*(.1+i*.04),0,0,Math.PI*1.8);ctx.lineWidth=1;ctx.stroke();}ctx.restore();ctx.strokeStyle='#b8cbd04a';ctx.lineWidth=1;for(const r of rain){ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-2,r.y+r.l);ctx.stroke();r.y+=r.v;r.x-=.8;if(r.y>H){r.y=-20;r.x=Math.random()*W;}}}
function featherBurst(){for(let i=0;i<42;i++){const el=document.createElement('i');el.className='feather fly';el.style.left=(W*.5+(Math.random()-.5)*90)+'px';el.style.top=(H*.52+(Math.random()-.5)*70)+'px';el.style.setProperty('--dx',((Math.random()-.5)*W*.9)+'px');el.style.setProperty('--dy',((Math.random()-.5)*H*.85)+'px');el.style.setProperty('--spin',(Math.random()*900-450)+'deg');el.style.animationDelay=(Math.random()*.45)+'s';document.getElementById('stage').appendChild(el);setTimeout(()=>el.remove(),3200);}}
function rumble(){if(!audioOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(48,t);o.frequency.exponentialRampToValueAtTime(24,t+2);f.type='lowpass';f.frequency.value=110;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+2.3);o.connect(f).connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+2.4);}catch(e){}}
trigger.addEventListener('click',()=>{wrap.classList.remove('summon');void wrap.offsetWidth;wrap.classList.add('summon');featherBurst();flash.classList.remove('bolt');void flash.offsetWidth;flash.classList.add('bolt');status.textContent='THE RAVEN DESCENDS';rumble();raven.cameraOrbit='0deg 76deg 2.0m';setTimeout(()=>{status.textContent='THE OMEN IS WATCHING';raven.cameraOrbit='0deg 76deg 2.3m';},2600);});
sound.addEventListener('click',()=>{audioOn=!audioOn;sound.textContent='SOUND: '+(audioOn?'ON':'OFF');if(audioOn)rumble();});
raven.addEventListener('error',()=>{status.textContent='3D MODEL FAILED TO LOAD — CHECK CONNECTION';});raven.addEventListener('load',()=>{status.textContent='THE RAVEN IS WATCHING';});
requestAnimationFrame(frame);
})();</script></body></html>
