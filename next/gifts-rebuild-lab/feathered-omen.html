<style>

</head><body><main id="stage"><canvas id="view"></canvas><div class="haze"></div>
<div class="brand">TIKNATION · LEGENDARY GIFT<b>THE FEATHERED OMEN</b></div>
<div class="status" id="status">A LIVING SHADOW IN THE TEMPEST</div>

<script type="module">
import * as THREE from 'three';
const canvas=document.querySelector('#view'),stage=document.querySelector('#stage'),status=document.querySelector('#status'),trigger=document.querySelector('#trigger'),soundButton=document.querySelector('#sound'),error=document.querySelector('#error');
let scene,camera,renderer,bird,leftWing,rightWing,feathers=[],rain=[],flashLight,clock=new THREE.Clock(),started=false,burstAt=-1,audioOn=false,audioCtx=null;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mat(color,rough=.68,metal=.12){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,side:THREE.DoubleSide})}
function featherGeo(length,width,curve=0){
 const shape=new THREE.Shape();shape.moveTo(0,0);shape.bezierCurveTo(-width*.35,length*.22,-width*.52,length*.72,curve,length);shape.bezierCurveTo(width*.52,length*.72,width*.35,length*.22,0,0);
 const g=new THREE.ShapeGeometry(shape,8);const p=g.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i),x=p.getX(i);p.setZ(i,.045*Math.sin(y/length*Math.PI)+.018*(1-Math.abs(x)/width));}g.computeVertexNormals();return g;
}
function makeFeather(parent,len,w,color,x,y,z,rot,scale=1){
 const group=new THREE.Group();group.position.set(x,y,z);group.rotation.z=rot;group.scale.setScalar(scale);
 const mesh=new THREE.Mesh(featherGeo(len,w,(Math.random()-.5)*w*.16),mat(color,.58,.18));mesh.castShadow=true;mesh.receiveShadow=true;group.add(mesh);
 const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.004,.012,len*.92,5),mat('#a6afb0',.75,.1));shaft.position.set(0,len*.46,.06);shaft.rotation.x=Math.PI/2;shaft.scale.set(.42,1,.42);group.add(shaft);parent.add(group);return group;
}
function makeWing(side){
 const pivot=new THREE.Group();pivot.position.set(side*.34,.15,0);bird.add(pivot);
 const bone=new THREE.Mesh(new THREE.BufferGeometry(),mat('#10181e')); // structural base is assembled below
 const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.83,5,10),mat('#10171d'));upper.rotation.z=side*-.82;upper.position.set(side*.55,.18,0);upper.scale.set(.8,1,.55);pivot.add(upper);
 const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.095,.83,5,10),mat('#0c1318'));arm.rotation.z=side*-.45;arm.position.set(side*1.15,.05,0);arm.scale.set(.75,1,.55);pivot.add(arm);
 const primaries=new THREE.Group();primaries.position.set(side*1.48,.04,-.015);pivot.add(primaries);
 for(let i=0;i<13;i++){const t=i/12;makeFeather(primaries,1.0+t*.48,.18,'#111a21',side*(.12+t*.72),-.05-t*.25,-.015,side*(.22+t*.42),.9);}
 const secondaries=new THREE.Group();secondaries.position.set(side*.48,.1,.055);pivot.add(secondaries);
 for(let i=0;i<15;i++){const t=i/14;makeFeather(secondaries,.9,.17,i%3===0?'#25323a':'#19242c',side*t*.95,-.1-t*.18,.01,side*(.36+t*.18),.9);}
 for(let i=0;i<8;i++){const t=i/7;makeFeather(pivot,.55,.13,'#303c43',side*(.12+t*.15),.22+t*.055,.075,side*.8,.8);}
 return pivot;
}
function createBird(){
 bird=new THREE.Group();scene.add(bird);bird.position.set(0,.2,0);
 const bodyMat=mat('#111a20',.45,.22),dark=mat('#080e13',.5,.18),sheen=mat('#293841',.42,.26);
 const body=new THREE.Mesh(new THREE.SphereGeometry(.56,32,24),bodyMat);body.scale.set(.8,1.32,1.65);body.rotation.x=.08;body.castShadow=true;bird.add(body);
 const chest=new THREE.Mesh(new THREE.SphereGeometry(.43,28,20),sheen);chest.position.set(0,-.17,.48);chest.scale.set(.83,1.15,.85);bird.add(chest);
 const neck=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.52,8,16),dark);neck.position.set(0,.4,.58);neck.rotation.x=-.28;bird.add(neck);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,32,24),bodyMat);head.position.set(0,.77,.7);head.scale.set(1,.92,1.15);head.castShadow=true;bird.add(head);
 const beakGeo=new THREE.ConeGeometry(.17,.76,5);const beak=new THREE.Mesh(beakGeo,mat('#242a2b',.34,.32));beak.rotation.x=-Math.PI/2;beak.rotation.z=Math.PI;beak.position.set(0,.65,1.12);beak.scale.set(.78,.8,.72);bird.add(beak);
 const hook=new THREE.Mesh(new THREE.ConeGeometry(.075,.25,5),mat('#101416'));hook.position.set(0,.48,1.39);hook.rotation.x=Math.PI/2;bird.add(hook);
 for(const s of [-1,1]){
  const eyeSocket=new THREE.Mesh(new THREE.SphereGeometry(.09,16,12),dark);eyeSocket.position.set(s*.235,.82,.92);bird.add(eyeSocket);
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,16,12),new THREE.MeshStandardMaterial({color:'#e1b96f',emissive:'#9c6725',emissiveIntensity:1.3,roughness:.25}));eye.position.set(s*.265,.835,.99);bird.add(eye);
  const pupil=new THREE.Mesh(new THREE.SphereGeometry(.018,12,8),mat('#030506',.1));pupil.position.set(s*.27,.835,1.025);bird.add(pupil);
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(.035,.027,.48,8),mat('#30373a'));leg.position.set(s*.2,-.62,.25);bird.add(leg);
  const foot=new THREE.Group();foot.position.set(s*.2,-.85,.35);bird.add(foot);
  for(let j=-1;j<=1;j++){const toe=new THREE.Mesh(new THREE.CylinderGeometry(.018,.026,.22,7),mat('#343b3c'));toe.position.set(j*.065,-.05,.04);toe.rotation.x=Math.PI/2;toe.rotation.z=j*.28;foot.add(toe);const claw=new THREE.Mesh(new THREE.ConeGeometry(.018,.1,6),mat('#a08a62'));claw.position.set(j*.065,-.06,.15);claw.rotation.x=Math.PI/2;foot.add(claw);}
 }
 // overlapping contour plumage across shoulders and back
 for(let row=0;row<5;row++)for(let i=0;i<9;i++){const s=i<4?-1:1,idx=i<4?i:8-i;makeFeather(bird,.62-row*.045,.15,row%2?'#1a252c':'#26343b',s*(.18+idx*.075),.34-row*.14,-.25+row*.12,s*.45,.82);}
 leftWing=makeWing(-1);rightWing=makeWing(1);
 for(let i=0;i<8;i++)makeFeather(bird,.52,.12,'#10171d',(Math.random()-.5)*.42,-.45,-.72-i*.045,(Math.random()-.5)*.3,.9);
}
function init(){
 scene=new THREE.Scene();scene.fog=new THREE.FogExp2('#0a131b',.035);
 camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100);camera.position.set(0,2.1,10.6);camera.lookAt(0,.05,0);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
 scene.add(new THREE.HemisphereLight('#a8bac8','#080b10',2.0));
 const key=new THREE.DirectionalLight('#d5e0e5',3.1);key.position.set(-4,7,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
 const rim=new THREE.DirectionalLight('#52748a',3.4);rim.position.set(5,2,-5);scene.add(rim);
 flashLight=new THREE.PointLight('#d8e7f0',0,18);flashLight.position.set(0,5,-2);scene.add(flashLight);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#080e13',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-3.5;floor.receiveShadow=true;scene.add(floor);
 // rain streaks in layered depth
 const rainGeo=new THREE.BufferGeometry(),positions=new Float32Array(1800*3);for(let i=0;i<1800;i++){positions[i*3]=(Math.random()-.5)*24;positions[i*3+1]=Math.random()*13-2;positions[i*3+2]=(Math.random()-.5)*18;}rainGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));const rainMat=new THREE.PointsMaterial({color:'#aabdc7',size:.025,transparent:true,opacity:.35});const rainField=new THREE.Points(rainGeo,rainMat);scene.add(rainField);rain.push({geo:rainGeo,field:rainField});
 createBird();bird.scale.setScalar(.001);bird.position.y=-2.5;
 window.addEventListener('resize',resize);animate();
}
function resize(){if(!camera||!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
function burst(){for(let i=0;i<95;i++){const geo=featherGeo(.18+Math.random()*.34,.055);const m=new THREE.Mesh(geo,mat(i%3?'#111c23':'#3b4a52',.58,.16));m.position.set((Math.random()-.5)*1.8,Math.random()*.7,(Math.random()-.5)*.8);scene.add(m);const a=Math.random()*Math.PI*2,d=2+Math.random()*7;feathers.push({m,v:new THREE.Vector3(Math.cos(a)*d,Math.random()*4+1,Math.sin(a)*d),r:new THREE.Vector3(Math.random()*8,Math.random()*8,Math.random()*8),life:3+Math.random()*2});}}
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.04);if(bird){if(started){const progress=Math.min(1,(t-startTime)/2.5);bird.scale.setScalar(.001+progress*.92);bird.position.y=-2.5+progress*2.65;bird.position.z=Math.sin(t*1.1)*.08;const flap=Math.sin(t*5.2);leftWing.rotation.z=-.08+flap*.34;rightWing.rotation.z=.08-flap*.34;leftWing.rotation.x=flap*.12;rightWing.rotation.x=-flap*.12;bird.rotation.y=Math.sin(t*.55)*.1;bird.rotation.x=Math.sin(t*.9)*.025;}}
 for(const p of rain){const a=p.geo.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)-dt*8;if(y< -3)y=10;a.setY(i,y);}a.needsUpdate=true;p.field.position.x=Math.sin(t*.18)*.4;}
 for(let i=feathers.length-1;i>=0;i--){const f=feathers[i];f.m.position.addScaledVector(f.v,dt);f.v.y-=dt*1.7;f.m.rotation.x+=f.r.x*dt;f.m.rotation.y+=f.r.y*dt;f.life-=dt;if(f.life<=0){scene.remove(f.m);f.m.geometry.dispose();feathers.splice(i,1);}}
 flashLight.intensity=Math.max(0,flashLight.intensity-dt*32);if(renderer)renderer.render(scene,camera);}
let startTime=0;
function playRumble(){if(!audioOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(54,now);o.frequency.exponentialRampToValueAtTime(25,now+2.4);f.type='lowpass';f.frequency.value=95;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.14,now+.18);g.gain.exponentialRampToValueAtTime(.0001,now+2.5);o.connect(f).connect(g).connect(audioCtx.destination);o.start(now);o.stop(now+2.6)}catch(e){}}
trigger.addEventListener('click',()=>{if(started)return;started=true;startTime=clock.getElapsedTime();trigger.disabled=true;status.textContent='THE RAVEN DESCENDS';burst();flashLight.intensity=12;playRumble();setTimeout(()=>{flashLight.intensity=18;status.textContent='WINGS OF THE TEMPEST';},2600);setTimeout(()=>{trigger.disabled=false;started=false;status.textContent='THE OMEN IS WATCHING';},7200)});
soundButton.addEventListener('click',()=>{audioOn=!audioOn;soundButton.textContent='SOUND: '+(audioOn?'ON':'OFF');if(audioOn)playRumble();});
try{init()}catch(e){error.style.display='block';console.error(e)}
</script></body></html>
