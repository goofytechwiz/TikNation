<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE FEATHERED OMEN · TikNation Gift Lab</title>
<style>
:root{color-scheme:dark;--cyan:#a9d8dc;--gold:#c9a36b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050709;color:#e9eeee;font-family:Arial,Helvetica,sans-serif}
body{min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 58%,#263039 0,#11171d 31%,#070a0d 66%,#020304 100%)}
.stage{position:relative;min-height:100svh;display:grid;place-items:center;isolation:isolate;overflow:hidden}
.stars,.mist,.feathers{position:absolute;inset:-20%;pointer-events:none}
.stars{opacity:.45;background-image:radial-gradient(1px 1px at 20% 30%,#c7d5d5 50%,transparent 100%),radial-gradient(1px 1px at 70% 18%,#c7d5d5 50%,transparent 100%),radial-gradient(1px 1px at 82% 68%,#c7d5d5 50%,transparent 100%),radial-gradient(1px 1px at 35% 78%,#c7d5d5 50%,transparent 100%);background-size:260px 230px}
.mist{background:linear-gradient(180deg,transparent 42%,#a6b5b51a 54%,transparent 68%);filter:blur(22px);transform:translateX(-70%);opacity:0}
.ring{position:absolute;width:min(72vw,650px);aspect-ratio:1;border:1px solid #c3d4d41c;border-radius:50%;box-shadow:0 0 70px #a4c4d40c,inset 0 0 60px #a4c4d40b;opacity:.3}
.ring:before,.ring:after{content:"";position:absolute;inset:8%;border:1px solid #c3d4d410;border-radius:50%}.ring:after{inset:18%}
.bird{position:relative;width:min(88vw,780px);height:min(58vh,500px);min-height:300px;display:grid;place-items:center;filter:drop-shadow(0 22px 35px #000);transform:translateY(9vh) scale(.64);opacity:0;z-index:3}
.bird svg{width:100%;height:100%;overflow:visible}
.wingL,.wingR{transform-box:fill-box;transform-origin:50% 85%;transition:transform 1.15s cubic-bezier(.16,.8,.2,1)}
.wingL{transform:rotate(-8deg) scaleY(.72)}.wingR{transform:rotate(8deg) scaleY(.72)}
.body{filter:drop-shadow(0 0 18px #b5d0d022)}
.eye{opacity:0;filter:drop-shadow(0 0 8px #e3c48a)}
.ground{position:absolute;bottom:15%;width:min(60vw,470px);height:36px;border-radius:50%;background:#000;filter:blur(18px);opacity:0;z-index:2}
.flash{position:absolute;inset:0;background:#d9e2df;opacity:0;z-index:8;pointer-events:none}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 20vw 5vw #000;pointer-events:none;z-index:7}
.title{position:absolute;top:8%;text-align:center;z-index:9;letter-spacing:.34em;font-size:clamp(11px,2vw,15px);color:#c4d0d0a6}
.title strong{display:block;margin-top:12px;font-size:clamp(26px,6vw,54px);letter-spacing:.17em;color:#edf1ed;text-shadow:0 0 24px #c4d6d633}
.controls{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));z-index:12;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:0 16px}
button{border:1px solid #b6c7c75a;background:#10171bd9;color:#eaf0ef;padding:14px 22px;letter-spacing:.16em;font-size:11px;font-weight:700;cursor:pointer;border-radius:2px;min-width:150px}
button.primary{background:#d8e1df;color:#111719;border-color:#d8e1df}button:disabled{opacity:.5;cursor:wait}
.note{position:absolute;bottom:calc(max(24px,env(safe-area-inset-bottom)) + 64px);font-size:10px;letter-spacing:.12em;color:#a9b6b68c;text-align:center;z-index:10}
.feather{position:absolute;width:9px;height:27px;background:linear-gradient(90deg,#080b0d,#59646a 48%,#111619);border-radius:100% 0 100% 0;opacity:0;filter:drop-shadow(0 0 4px #a6b8b51a)}
.stage.go .bird{animation:arrival 2.6s cubic-bezier(.14,.7,.2,1) forwards}
.stage.go .ground{animation:groundIn 2.6s forwards}
.stage.go .mist{animation:mistMove 5s 1.1s ease-in-out forwards}
.stage.go .ring{animation:ringPulse 5s ease-in-out infinite}
.stage.go .wingL{animation:wingSpread 1.4s 2.7s cubic-bezier(.2,.8,.2,1) forwards}
.stage.go .wingR{animation:wingSpreadR 1.4s 2.7s cubic-bezier(.2,.8,.2,1) forwards}
.stage.go .eye{animation:eyeOn .3s 3.3s forwards}
.stage.go .feather{animation:fall 3.2s var(--d,0s) ease-out forwards}
.stage.go .flash{animation:impact .55s 3.95s ease-out}
@keyframes arrival{0%{opacity:0;transform:translateY(18vh) scale(.32)}45%{opacity:1;transform:translateY(-2vh) scale(1.08)}65%{transform:translateY(1vh) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes groundIn{to{opacity:.75;transform:scale(1.35)}}
@keyframes mistMove{0%{opacity:0;transform:translateX(-70%)}30%,75%{opacity:.8}100%{opacity:0;transform:translateX(70%)}}
@keyframes ringPulse{50%{transform:scale(1.08);opacity:.7}}
@keyframes wingSpread{to{transform:rotate(-28deg) scaleY(1.2)}}
@keyframes wingSpreadR{to{transform:rotate(28deg) scaleY(1.2)}}
@keyframes eyeOn{to{opacity:1}}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}15%{opacity:.9}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.15)}}
@keyframes impact{0%{opacity:0}20%{opacity:.55}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style></head>
<body><main class="stage" id="stage">
<div class="stars"></div><div class="ring"></div><div class="mist"></div><div class="ground"></div>
<div class="title">TIKNATION · LEGENDARY GIFT<strong>THE FEATHERED OMEN</strong></div>
<div class="bird" aria-label="A dark raven with wings spread">
<svg viewBox="0 0 900 520" role="img" aria-hidden="true">
<defs><linearGradient id="plume" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#53616a"/><stop offset=".32" stop-color="#1b252b"/><stop offset=".72" stop-color="#080c10"/><stop offset="1" stop-color="#303c42"/></linearGradient><linearGradient id="edge" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#83949a"/><stop offset="1" stop-color="#11171b"/></linearGradient></defs>
<g class="wingL" fill="url(#plume)" stroke="#738187" stroke-opacity=".23" stroke-width="2">
<path d="M455 260 C360 190 230 100 30 42 C82 111 110 158 142 193 C91 183 52 172 8 153 C75 235 145 277 218 302 C158 302 111 294 65 281 C145 356 250 383 365 354 L455 315Z"/>
<path d="M390 282 Q235 148 53 70 Q160 194 282 290Z" fill="url(#edge)"/>
<path d="M365 310 Q198 240 96 211 Q220 321 363 338Z"/>
</g>
<g class="wingR" fill="url(#plume)" stroke="#738187" stroke-opacity=".23" stroke-width="2">
<path d="M445 260 C540 190 670 100 870 42 C818 111 790 158 758 193 C809 183 848 172 892 153 C825 235 755 277 682 302 C742 302 789 294 835 281 C755 356 650 383 535 354 L445 315Z"/>
<path d="M510 282 Q665 148 847 70 Q740 194 618 290Z" fill="url(#edge)"/>
<path d="M535 310 Q702 240 804 211 Q680 321 537 338Z"/>
</g>
<g class="body">
<path d="M375 270 Q402 204 456 199 Q520 203 546 274 Q529 355 458 387 Q384 355 375 270Z" fill="url(#plume)"/>
<path d="M411 229 Q425 150 468 133 Q513 151 520 229 Q491 259 456 258 Q428 254 411 229Z" fill="#11191e"/>
<path d="M490 173 L581 193 L500 211Z" fill="#a18b65"/><path d="M574 193 L500 203 L535 217Z" fill="#514632"/>
<path d="M427 182 Q451 164 474 181 Q451 196 427 182Z" fill="#05090b"/>
<circle class="eye" cx="458" cy="181" r="5" fill="#e4c78e"/>
<path d="M424 349 Q458 395 497 347 Q476 425 450 464 Q433 407 424 349Z" fill="#0a0e11"/>
</g>
<g fill="#6f7c82" opacity=".22"><path d="M393 279l-60 45 65-22M507 279l60 45-65-22M411 306l-70 32 74-12M489 306l70 32-74-12"/></g>
</svg></div>
<div class="flash"></div><div class="vignette"></div><div class="feathers" id="feathers"></div>
<div class="note" id="status">A SHADOW HAS FOUND ITS WAY HERE</div>
<div class="controls"><button class="primary" id="trigger">TRIGGER GIFT</button><button id="sound">SOUND: OFF</button></div>
</main>
<script>
const stage=document.getElementById('stage'),trigger=document.getElementById('trigger'),sound=document.getElementById('sound'),status=document.getElementById('status'),feathers=document.getElementById('feathers');
let audio=false,ctx=null,playing=false;
function plumeBurst(){feathers.innerHTML='';for(let i=0;i<38;i++){const f=document.createElement('i');f.className='feather';const angle=Math.random()*Math.PI*2,dist=180+Math.random()*430;f.style.left=(45+Math.random()*10)+'%';f.style.top=(42+Math.random()*15)+'%';f.style.setProperty('--x',(Math.cos(angle)*dist)+'px');f.style.setProperty('--y',(Math.sin(angle)*dist+160)+'px');f.style.setProperty('--r',(Math.random()*700-350)+'deg');f.style.setProperty('--d',(Math.random()*.9)+'s');feathers.appendChild(f)}}
function rumble(){if(!audio)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const now=ctx.currentTime;const osc=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();osc.type='sawtooth';osc.frequency.setValueAtTime(48,now);osc.frequency.exponentialRampToValueAtTime(25,now+1.8);filter.type='lowpass';filter.frequency.value=105;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.18,now+.15);gain.gain.exponentialRampToValueAtTime(.0001,now+2.4);osc.connect(filter).connect(gain).connect(ctx.destination);osc.start(now);osc.stop(now+2.5);const noise=ctx.createBufferSource(),buffer=ctx.createBuffer(1,ctx.sampleRate*1.2,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);noise.buffer=buffer;const ng=ctx.createGain();ng.gain.setValueAtTime(.0001,now);ng.gain.exponentialRampToValueAtTime(.11,now+.08);ng.gain.exponentialRampToValueAtTime(.0001,now+1.2);noise.connect(ng).connect(ctx.destination);noise.start(now)}catch(e){status.textContent='SOUND UNAVAILABLE IN THIS BROWSER'}}
trigger.addEventListener('click',()=>{if(playing)return;playing=true;trigger.disabled=true;stage.classList.remove('go');void stage.offsetWidth;plumeBurst();stage.classList.add('go');status.textContent='THE OMEN HAS ARRIVED';rumble();setTimeout(()=>{playing=false;trigger.disabled=false;status.textContent='THE SHADOWS ARE WAITING';},6500)});
sound.addEventListener('click',()=>{audio=!audio;sound.textContent='SOUND: '+(audio?'ON':'OFF');if(audio){rumble();}});
</script></body></html>
