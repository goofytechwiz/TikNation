<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THE FEATHERED OMEN · Rebuild 21</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a11;color:#f1f5f6;font-family:Arial,sans-serif}
#stage{position:relative;width:100%;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#40576a 0,#172632 43%,#050a11 100%)}
.moon{position:absolute;width:min(54vw,310px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 34%,#f6f4df,#b7c4c4 58%,#657b86 100%);box-shadow:0 0 55px #d8e9f477;left:50%;top:43%;transform:translate(-50%,-50%);opacity:.8}
.brand{position:absolute;top:5%;width:100%;text-align:center;z-index:5;letter-spacing:.3em;font-size:10px;color:#d0dcdd}
.brand b{display:block;margin-top:10px;font-size:clamp(24px,6vw,48px);letter-spacing:.13em;color:#fff;text-shadow:0 0 25px #d6e4e477}
.bird{position:absolute;left:50%;top:47%;width:min(88vw,520px);height:auto;transform:translate(-50%,-50%);filter:drop-shadow(0 15px 16px #000b);z-index:3;overflow:visible}
.body{fill:#080d14;stroke:#455563;stroke-width:2}.feather{fill:#111c29;stroke:#536a7c;stroke-width:1.4}
.wingL,.wingR{transform-box:fill-box;transform-origin:50% 88%;animation:flap .62s ease-in-out infinite alternate}
.wingR{animation-delay:-.31s}
@keyframes flap{from{transform:rotate(-9deg) scaleY(.92)}to{transform:rotate(27deg) scaleY(1.06)}}
#flash{position:absolute;inset:0;background:#edf7ff;opacity:0;pointer-events:none;z-index:4}
#flash.bolt{animation:bolt .48s ease-out}
@keyframes bolt{0%,100%{opacity:0}10%{opacity:.65}24%{opacity:.03}45%{opacity:.32}65%{opacity:0}}
.status{position:absolute;bottom:calc(max(24px,env(safe-area-inset-bottom)) + 74px);width:100%;text-align:center;z-index:6;font-size:11px;letter-spacing:.14em;color:#e4ecef}
.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:100%;display:flex;justify-content:center;gap:10px;padding:0 12px;z-index:7}
button{min-height:54px;min-width:145px;border:1px solid #d4e0e6;background:#e4edf0;color:#111a20;font-weight:bold;font-size:10px;letter-spacing:.12em;border-radius:3px;touch-action:manipulation}
button+button{background:#111d27;color:#f2f6f8}
.featherFx{position:absolute;width:7px;height:34px;border-radius:100% 0 100% 0;background:linear-gradient(90deg,#070b12,#a4bdce,#101a24);z-index:5;animation:scatter 2s ease-out forwards;pointer-events:none}
@keyframes scatter{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){.wingL,.wingR{animation-duration:1.8s}.featherFx,#flash.bolt{animation:none}}
</style></head><body><main id="stage"><div class="moon"></div>
<div class="brand">TIKNATION · LEGENDARY GIFT<b>THE FEATHERED OMEN</b></div>
<svg class="bird" viewBox="0 0 600 390" role="img" aria-label="A raven flapping its wings in front of the moon">
<defs><linearGradient id="black" x2="0.8" y2="1"><stop stop-color="#34495a"/><stop offset=".45" stop-color="#101b27"/><stop offset="1" stop-color="#03070c"/></linearGradient></defs>
<g class="wingL"><path class="feather" fill="url(#black)" d="M292 205 C230 170 156 82 28 58 C75 123 100 191 170 231 C104 207 68 205 18 186 C83 271 176 290 280 245Z"/><path class="feather" d="M267 210 Q164 130 65 91 Q150 179 267 226Z"/><path class="feather" d="M252 222 Q150 199 70 204 Q164 253 260 239Z"/></g>
<g class="wingR"><path class="feather" fill="url(#black)" d="M308 205 C370 170 444 82 572 58 C525 123 500 191 430 231 C496 207 532 205 582 186 C517 271 424 290 320 245Z"/><path class="feather" d="M333 210 Q436 130 535 91 Q450 179 333 226Z"/><path class="feather" d="M348 222 Q450 199 530 204 Q436 253 340 239Z"/></g>
<path class="body" fill="url(#black)" d="M250 208 Q284 166 330 190 Q359 209 351 254 Q332 290 285 276 Q247 257 250 208Z"/>
<path class="body" d="M322 196 Q342 145 389 131 Q418 126 431 145 Q426 170 393 182 L353 224Z"/>
<path fill="#080c12" stroke="#637b8a" stroke-width="2" d="M414 139 L477 150 L422 160Z"/>
<circle cx="406" cy="143" r="4.5" fill="#e8c86a"/><circle cx="407" cy="143" r="1.8" fill="#090b0e"/>
<path class="body" d="M270 251 Q220 280 160 322 Q239 310 306 279Z"/>
<path class="body" d="M298 267 L290 300 L305 285 L317 303 L316 273Z"/>
<path class="feather" d="M264 223 Q215 203 185 177 Q229 221 267 242Z"/>
</svg>
<div id="flash"></div><div class="status" id="status">THE RAVEN IS IN FLIGHT</div>
<div class="controls"><button type="button" id="summon">SUMMON THE OMEN</button><button type="button" id="sound">SOUND: OFF</button></div></main>
<script>
(()=>{const stage=document.getElementById('stage'),status=document.getElementById('status'),flash=document.getElementById('flash'),summon=document.getElementById('summon'),sound=document.getElementById('sound');let on=false,ctx=null;
function rumble(){if(!on)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(65,t);o.frequency.exponentialRampToValueAtTime(32,t+1.4);f.type='lowpass';f.frequency.value=140;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.1);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(f).connect(g).connect(ctx.destination);o.start();o.stop(t+1.7)}catch(e){status.textContent='SOUND UNAVAILABLE'}}
summon.addEventListener('click',()=>{flash.classList.remove('bolt');void flash.offsetWidth;flash.classList.add('bolt');for(let i=0;i<16;i++){const p=document.createElement('i');p.className='featherFx';p.style.left='50%';p.style.top='48%';p.style.setProperty('--x',((Math.random()-.5)*innerWidth*.8)+'px');p.style.setProperty('--y',((Math.random()-.5)*innerHeight*.7)+'px');p.style.setProperty('--r',(Math.random()*720-360)+'deg');stage.appendChild(p);setTimeout(()=>p.remove(),2100)}status.textContent='THE RAVEN DESCENDS';rumble()});
sound.addEventListener('click',()=>{on=!on;sound.textContent='SOUND: '+(on?'ON':'OFF');status.textContent=on?'SOUND ENABLED':'SOUND MUTED';if(on)rumble()});
})();
</script></body></html>
