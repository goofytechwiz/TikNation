<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THE FEATHERED OMEN · Rebuild 2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030609;color:#e8eeee;font-family:Arial,sans-serif}
#stage{position:relative;width:100%;height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 62%,#26343d 0,#101a21 32%,#05090d 72%)}
.sky{position:absolute;inset:-30%;background:repeating-radial-gradient(ellipse at 48% 55%,transparent 0 70px,#a9bdc20b 72px 74px,transparent 77px 140px);animation:skyturn 22s linear infinite}
.cloud{position:absolute;inset:-20%;opacity:.55;background:radial-gradient(ellipse at 20% 45%,#75858b22,transparent 35%),radial-gradient(ellipse at 80% 30%,#89969b20,transparent 32%),radial-gradient(ellipse at 50% 85%,#aab8bd26,transparent 35%);filter:blur(24px);animation:cloud 8s ease-in-out infinite alternate}
.lightning{position:absolute;inset:0;background:#dce9ed;opacity:0;mix-blend-mode:screen;z-index:5;pointer-events:none}
.cyclone{position:absolute;left:50%;top:54%;width:min(90vw,780px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid #b9cbd01a;border-radius:50%;box-shadow:0 0 90px #a4c5d31b,inset 0 0 90px #a4c5d30b}
.cyclone:before,.cyclone:after{content:"";position:absolute;inset:9%;border:1px solid #b9cbd018;border-radius:50%;transform:rotateX(68deg) scaleY(.6)}.cyclone:after{inset:22%;border-color:#d2dfe21c}
.raven{position:absolute;width:min(94vw,850px);height:min(65vh,570px);left:50%;top:51%;transform:translate(-50%,-50%) scale(.1) translateY(100vh);opacity:0;z-index:4;filter:drop-shadow(0 25px 30px #000)}
.raven svg{width:100%;height:100%;overflow:visible}
.wl,.wr{transform-box:fill-box;transform-origin:50% 90%}.wl{transform:rotate(-24deg) scaleY(.72)}.wr{transform:rotate(24deg) scaleY(.72)}
#stage.run .raven{animation:flyin 2.6s cubic-bezier(.13,.76,.22,1) forwards}
#stage.run .wl{animation:spreadL 1s 2.55s cubic-bezier(.2,.8,.2,1) forwards}
#stage.run .wr{animation:spreadR 1s 2.55s cubic-bezier(.2,.8,.2,1) forwards}
#stage.run .cyclone{animation:cyclone 6s linear infinite}
#stage.run .cloud{animation:cloudrush 5s ease-out forwards}
.feathers{position:absolute;inset:0;z-index:6;pointer-events:none}
.feather{position:absolute;width:8px;height:30px;border-radius:100% 0 100% 0;background:linear-gradient(90deg,#080d11,#87949a 50%,#121a20);box-shadow:0 0 8px #b4c5c52b;opacity:0}
#stage.run .feather{animation:featherfly var(--dur) var(--delay) cubic-bezier(.12,.55,.35,1) forwards}
.brand{position:absolute;top:7%;width:100%;text-align:center;z-index:8;letter-spacing:.32em;font-size:10px;color:#b8c9c99c}
.brand b{display:block;margin-top:13px;font-size:clamp(25px,6vw,56px);letter-spacing:.14em;color:#f1f4f2;text-shadow:0 0 28px #d6e4e455}
.status{position:absolute;bottom:calc(max(28px,env(safe-area-inset-bottom)) + 72px);width:100%;text-align:center;z-index:8;color:#c5d0d09c;font-size:10px;letter-spacing:.18em}
.controls{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));width:100%;display:flex;justify-content:center;gap:12px;z-index:9;padding:0 12px}
button{min-width:145px;padding:15px 18px;border:1px solid #b6c7c77a;background:#101a20;color:#eef3f2;font-weight:bold;letter-spacing:.14em;font-size:10px;border-radius:2px}
button.primary{background:#d9e4e2;color:#101619;border-color:#d9e4e2}button:disabled{opacity:.5}
@keyframes skyturn{to{transform:rotate(360deg)}}@keyframes cloud{to{transform:translate(3%,-4%) scale(1.15)}}@keyframes cloudrush{to{transform:translate(-12%,8%) scale(1.4);opacity:.8}}
@keyframes flyin{0%{opacity:0;transform:translate(-50%,-30%) scale(.12) translateY(80vh)}50%{opacity:1;transform:translate(-50%,-54%) scale(1.16)}72%{transform:translate(-50%,-48%) scale(.95)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes spreadL{to{transform:rotate(-5deg) scaleY(1.18)}}@keyframes spreadR{to{transform:rotate(5deg) scaleY(1.18)}}
@keyframes cyclone{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes featherfly{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.4)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.2)}}
#stage.flash .lightning{animation:bolt .48s ease-out} @keyframes bolt{0%,100%{opacity:0}12%{opacity:.7}28%{opacity:.08}44%{opacity:.45}60%{opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><main id="stage"><div class="sky"></div><div class="cloud"></div><div class="cyclone"></div>
<div class="brand">TIKNATION · LEGENDARY GIFT<b>THE FEATHERED OMEN</b></div>
<div class="raven"><svg viewBox="0 0 900 560" aria-hidden="true">
<defs><linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68777d"/><stop offset=".25" stop-color="#25323a"/><stop offset=".62" stop-color="#080d12"/><stop offset="1" stop-color="#34434a"/></linearGradient><linearGradient id="feather" x2="0" y2="1"><stop stop-color="#718087"/><stop offset=".55" stop-color="#182229"/><stop offset="1" stop-color="#05090d"/></linearGradient></defs>
<g class="wl" fill="url(#black)" stroke="#829198" stroke-opacity=".22" stroke-width="2"><path d="M449 265Q292 142 22 35Q92 132 144 190Q75 164 9 150Q89 255 220 306Q140 301 62 277Q183 383 357 361L455 320Z"/><path d="M385 277Q238 154 58 69Q185 219 340 326Z" fill="url(#feather)"/><path d="M365 317Q202 257 100 216Q225 335 367 349Z"/><path d="M326 342Q208 319 148 293Q245 375 357 368Z"/></g>
<g class="wr" fill="url(#black)" stroke="#829198" stroke-opacity=".22" stroke-width="2"><path d="M451 265Q608 142 878 35Q808 132 756 190Q825 164 891 150Q811 255 680 306Q760 301 838 277Q717 383 543 361L445 320Z"/><path d="M515 277Q662 154 842 69Q715 219 560 326Z" fill="url(#feather)"/><path d="M535 317Q698 257 800 216Q675 335 533 349Z"/><path d="M574 342Q692 319 752 293Q655 375 543 368Z"/></g>
<path d="M374 262Q383 191 450 170Q518 190 531 267Q523 355 456 397Q387 355 374 262Z" fill="url(#black)"/>
<path d="M406 224Q410 133 463 111Q521 141 511 231Q486 260 455 260Q424 257 406 224Z" fill="#111b21"/>
<path d="M489 161L592 190L498 210Z" fill="#b79a6a"/><path d="M589 190L498 202L548 219Z" fill="#4b4234"/>
<path d="M425 174Q451 154 476 174Q454 193 425 174Z" fill="#030608"/><circle cx="457" cy="174" r="6" fill="#e8c989"/>
<path d="M420 355Q455 398 497 351Q480 436 453 486Q433 422 420 355Z" fill="#080d11"/>
<g fill="#65757c" opacity=".34"><path d="M401 280l-77 47 82-22M511 280l77 47-82-22M390 311l-73 40 78-14M522 311l73 40-78-14"/></g>
</svg></div><div class="feathers" id="feathers"></div><div class="lightning"></div>
<div class="status" id="status">THE SKY HAS GONE SILENT</div><div class="controls"><button class="primary" id="trigger">SUMMON THE OMEN</button><button id="sound">SOUND: OFF</button></div></main>
<script>
const stage=document.getElementById('stage'),trigger=document.getElementById('trigger'),sound=document.getElementById('sound'),status=document.getElementById('status'),field=document.getElementById('feathers');let enabled=false,busy=false,ctx;
function burst(){field.innerHTML='';for(let i=0;i<55;i++){let e=document.createElement('i');e.className='feather';let a=Math.random()*Math.PI*2,d=160+Math.random()*560;e.style.left=(42+Math.random()*16)+'%';e.style.top=(42+Math.random()*15)+'%';e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+120+'px');e.style.setProperty('--rot',(Math.random()*900-450)+'deg');e.style.setProperty('--delay',Math.random()*.8+'s');e.style.setProperty('--dur',(2.4+Math.random()*1.6)+'s');field.appendChild(e)}}
function soundHit(){if(!enabled)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(62,t);o.frequency.exponentialRampToValueAtTime(28,t+2);f.type='lowpass';f.frequency.value=140;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.12);g.gain.exponentialRampToValueAtTime(.0001,t+2.5);o.connect(f).connect(g).connect(ctx.destination);o.start(t);o.stop(t+2.6)}catch(e){status.textContent='AUDIO IS NOT AVAILABLE'} }
trigger.onclick=()=>{if(busy)return;busy=true;trigger.disabled=true;stage.classList.remove('run','flash');void stage.offsetWidth;burst();stage.classList.add('run');status.textContent='WINGS OF THE STORM';soundHit();setTimeout(()=>stage.classList.add('flash'),2600);setTimeout(()=>{busy=false;trigger.disabled=false;status.textContent='THE OMEN IS WATCHING';},6200)};
sound.onclick=()=>{enabled=!enabled;sound.textContent='SOUND: '+(enabled?'ON':'OFF');if(enabled)soundHit()};
</script></body></html>
