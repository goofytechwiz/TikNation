<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090712">
<title>TikNation · Phantom Showtime</title>
<style>
:root{color-scheme:dark;--gold:#f4d18a;--violet:#a98cff;--ink:#090712}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#29203d 0,#100d1d 48%,#07060d 100%);color:#fff;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden}
main{width:min(1100px,100%);margin:auto;padding:22px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#c6badc;font-size:.75rem;letter-spacing:.16em;font-weight:800}.top a{color:var(--gold);text-decoration:none}
h1{font-size:clamp(2.4rem,8vw,5.4rem);line-height:.9;letter-spacing:-.06em;margin:28px 0 12px;text-align:center;text-shadow:0 4px 35px #b38cff66}h1 span{color:var(--gold)}.sub{text-align:center;color:#c4bbd2;margin:0 auto 24px;max-width:650px}
.stage{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:16/9;min-height:270px;border:1px solid #5e4b75;border-radius:20px;background:linear-gradient(#11101d 0%,#21172b 45%,#08070d 100%);box-shadow:0 25px 80px #000b,inset 0 0 55px #000}
.backdrop{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,#78618c55,transparent 42%),linear-gradient(90deg,#130b1b,#25152c 50%,#130b1b)}
.proscenium{position:absolute;inset:0 0 auto;height:18%;background:linear-gradient(#4a2038,#1a0d1b);clip-path:polygon(0 0,100% 0,94% 100%,6% 100%);box-shadow:0 12px 20px #000}
.curtain{position:absolute;z-index:5;top:0;bottom:0;width:17%;background:repeating-linear-gradient(90deg,#310d22 0 12px,#57152e 15px 27px,#260a1c 32px 43px);filter:drop-shadow(0 0 14px #000);animation:curtain 7s ease-in-out infinite alternate}
.curtain.left{left:0;clip-path:polygon(0 0,100% 0,83% 100%,0 100%)}.curtain.right{right:0;transform:scaleX(-1);clip-path:polygon(0 0,100% 0,83% 100%,0 100%)}
@keyframes curtain{from{width:17%}to{width:13%}}
.beam{position:absolute;z-index:1;top:0;width:36%;height:100%;opacity:.45;filter:blur(3px);transform-origin:50% 0;mix-blend-mode:screen}.beam.one{left:19%;background:linear-gradient(180deg,#fff1c8aa,transparent 85%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);animation:sweep 5s ease-in-out infinite alternate}.beam.two{right:19%;background:linear-gradient(180deg,#b69affaa,transparent 85%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);animation:sweep 6s ease-in-out infinite alternate-reverse}
@keyframes sweep{to{transform:rotate(9deg) scaleX(1.12);opacity:.7}}
.haze{position:absolute;z-index:2;inset:52% -10% 0;background:radial-gradient(ellipse,#c6b2db38,transparent 65%);filter:blur(18px);animation:haze 5s ease-in-out infinite alternate}@keyframes haze{to{transform:translateX(7%) scale(1.15);opacity:.55}}
.floor{position:absolute;z-index:2;bottom:0;left:12%;right:12%;height:23%;background:linear-gradient(#49314a,#100d16 75%);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);border-top:2px solid #d6b78c55}
.disco{position:absolute;z-index:3;top:13%;left:50%;width:35px;height:35px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 30% 25%,#fff,#e4d8ff 18%,#8b72a7 45%,#282034 72%);box-shadow:0 0 24px #e9d6ff99;animation:spin 8s linear infinite}@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}
.performers{position:absolute;z-index:4;bottom:15%;left:50%;width:46%;height:53%;transform:translateX(-50%);display:flex;justify-content:center;align-items:end;gap:7%}
.dancer{position:relative;width:22%;height:100%;filter:drop-shadow(0 0 12px #d6c1ff55);animation:dance 1.8s ease-in-out infinite alternate;transform-origin:50% 90%}
.dancer:nth-child(2){height:88%;animation-delay:-.7s}.dancer:nth-child(3){height:96%;animation-delay:-1.2s}
.head{position:absolute;top:0;left:35%;width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2e7db,#9c8b91 55%,#312333);box-shadow:0 0 9px #fff5}
.body{position:absolute;top:18%;left:27%;width:46%;height:40%;background:linear-gradient(90deg,#19131f,#b6a5b5 45%,#251c2b);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%);border-radius:25%}
.coat{position:absolute;top:48%;left:8%;width:84%;height:48%;background:linear-gradient(90deg,#17111d,#746174 48%,#17111d);clip-path:polygon(28% 0,72% 0,100% 100%,0 100%)}
.arm{position:absolute;top:22%;left:6%;width:18%;height:42%;background:linear-gradient(#b8aab6,#312536);border-radius:50%;transform:rotate(24deg);transform-origin:top}
.arm.r{left:77%;transform:rotate(-30deg);animation:arm 1.1s ease-in-out infinite alternate}
@keyframes arm{to{transform:rotate(-75deg)}}@keyframes dance{to{transform:rotate(7deg) translateY(-7px)}}
.audience{position:absolute;z-index:6;bottom:0;left:0;right:0;height:14%;background:radial-gradient(ellipse at 50% 100%,#050409 0 50%,transparent 70%);clip-path:polygon(0 35%,5% 10%,10% 40%,15% 0,20% 35%,25% 10%,30% 40%,35% 5%,40% 40%,45% 0,50% 40%,55% 5%,60% 40%,65% 0,70% 35%,75% 5%,80% 40%,85% 0,90% 35%,95% 10%,100% 40%,100% 100%,0 100%)}
.flash{position:absolute;z-index:7;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flash 8s infinite}@keyframes flash{0%,91%,94%,100%{opacity:0}92%{opacity:.5}93%{opacity:0}}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.controls button{border:1px solid #78628f;background:#20172c;color:#fff;border-radius:999px;padding:12px 19px;font:inherit;font-weight:750;cursor:pointer}.controls button.primary{background:linear-gradient(110deg,#8b6bba,#c29c65);border:0;color:#160f1d}.caption{text-align:center;color:#c9bed4;font-size:.9rem;min-height:26px}.fine{text-align:center;color:#81778e;font-size:.75rem;margin-top:24px}
@media(max-width:600px){main{padding:16px 12px 35px}.stage{aspect-ratio:4/3;min-height:250px}.performers{width:60%;height:48%;gap:5%}.curtain{width:20%}.curtain.left{clip-path:polygon(0 0,100% 0,83% 100%,0 100%)}.curtain.right{width:20%}.beam{width:45%}.floor{left:7%;right:7%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main>
<div class="top"><span>TIKNATION · LIVE GIFT PREVIEW</span><a href="../gifts/">← GIFT GALLERY</a></div>
<h1>PHANTOM <span>SHOWTIME</span></h1>
<p class="sub">The curtain rises on a performance from the other side. Tap the stage to begin the show.</p>
<section class="stage" id="stage" aria-label="Animated supernatural theatre stage">
<div class="backdrop"></div><div class="proscenium"></div><div class="beam one"></div><div class="beam two"></div><div class="haze"></div><div class="disco"></div>
<div class="performers" aria-hidden="true">
<div class="dancer"><i class="head"></i><i class="body"></i><i class="coat"></i><i class="arm"></i><i class="arm r"></i></div>
<div class="dancer"><i class="head"></i><i class="body"></i><i class="coat"></i><i class="arm"></i><i class="arm r"></i></div>
<div class="dancer"><i class="head"></i><i class="body"></i><i class="coat"></i><i class="arm"></i><i class="arm r"></i></div>
</div><div class="floor"></div><div class="curtain left"></div><div class="curtain right"></div><div class="audience"></div><div class="flash"></div>
</section>
<div class="controls"><button class="primary" id="start">▶ START THE SHOW</button><button id="stop">■ STOP</button></div>
<p class="caption" id="caption" aria-live="polite">The theatre is waiting in silence…</p>
<p class="fine">Concept preview only. This does not send a gift, charge coins, or connect to TikNation LIVE gifting.</p>
</main>
<script>
const start=document.getElementById('start'),stop=document.getElementById('stop'),caption=document.getElementById('caption'),stage=document.getElementById('stage');let ctx=null,playing=false,loop=null;
function tone(freq,duration,type='sine',gain=.04,delay=0){if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime+delay);g.gain.setValueAtTime(.0001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(gain,ctx.currentTime+delay+.04);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+duration);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+duration+.05)}
function startShow(){if(playing)return;playing=true;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();caption.textContent='The phantom orchestra begins…';tone(110,.9,'sawtooth',.025);tone(220,1.4,'sine',.035,.15);tone(440,.7,'triangle',.025,.55);tone(659,.9,'sine',.02,1.1);loop=setInterval(()=>{tone(164,.65,'triangle',.018);tone(247,.7,'sine',.014,.25);},1800);stage.animate([{filter:'brightness(.7)'},{filter:'brightness(1.25)'},{filter:'brightness(1)'}],{duration:1800,iterations:1});}
function stopShow(){playing=false;if(loop)clearInterval(loop);loop=null;caption.textContent='The curtain falls. The theatre is silent again.';if(ctx){tone(98,.55,'sine',.025);}}
start.addEventListener('click',startShow);stop.addEventListener('click',stopShow);stage.addEventListener('click',startShow);
</script></body></html>
