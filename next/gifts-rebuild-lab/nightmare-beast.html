<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE NIGHTMARE BEAST · TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#07090a;color:#eee;font:15px/1.4 system-ui;display:grid;place-items:center;padding:14px}.wrap{width:min(940px,100%)}.tag{font-size:11px;letter-spacing:.22em;color:#9ba6a1}h1{font-size:clamp(28px,6vw,46px);letter-spacing:.1em;margin:5px 0}.desc,.note{color:#a3aaa5;font-size:13px}.scene{height:min(68vh,590px);min-height:420px;margin-top:14px;position:relative;overflow:hidden;border:1px solid #333c3a;border-radius:12px;background:radial-gradient(ellipse at 50% 58%,#36413b 0,#151d1a 38%,#060808 80%);isolation:isolate}.backlight{position:absolute;top:9%;left:50%;width:310px;height:340px;transform:translateX(-50%);background:radial-gradient(ellipse,#c1c6ad22,transparent 67%)}.ground{position:absolute;bottom:0;left:-10%;width:120%;height:24%;background:linear-gradient(#1d2420,#070909 75%);border-top:1px solid #59605844}.fog{position:absolute;bottom:10%;left:-25%;width:150%;height:25%;background:radial-gradient(ellipse,#c3cbb322,transparent 68%);filter:blur(18px);animation:fog 8s ease-in-out infinite alternate}.beast{position:absolute;left:50%;bottom:11%;width:330px;height:365px;transform:translateX(-50%) scale(.75);transform-origin:bottom;opacity:0;filter:drop-shadow(0 12px 16px #000)}.torso{position:absolute;left:86px;top:135px;width:165px;height:190px;background:radial-gradient(ellipse at 50% 28%,#62685c,#202722 64%,#090e0c);clip-path:polygon(19% 0,78% 0,100% 65%,83% 100%,58% 82%,45% 100%,12% 84%,0 43%)}.head{position:absolute;left:111px;top:56px;width:112px;height:132px;background:radial-gradient(ellipse at 45% 25%,#798073,#303b33 55%,#111714);clip-path:polygon(20% 0,80% 0,100% 40%,82% 88%,50% 100%,15% 88%,0 38%);z-index:3}.jaw{position:absolute;left:126px;top:139px;width:83px;height:61px;background:linear-gradient(#202722,#090c0b);clip-path:polygon(0 0,100% 0,80% 100%,62% 70%,50% 100%,35% 70%,18% 100%);z-index:4}.teeth{position:absolute;left:139px;top:145px;width:58px;height:18px;background:repeating-li </style></head><body><main class="wrap"><div class="tag">TIKNATION · GIFT REBUILD LAB</div><h1>THE NIGHTMARE BEAST</h1><div class="desc">Something enormous is crawling out of the dark.</div>
<section class="scene" id="scene"><div class="backlight"></div><div class="fog"></div><div class="ground"></div><div class="beast"><div class="horn h1"></div><div class="horn h2"></div><div class="torso"></div><div class="head"></div><div class="eye e1"></div><div class="eye e2"></div><div class="jaw"></div><div class="teeth"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div><div class="caption" id="caption">DON'T MOVE. IT CAN HEAR YOU.</div></section>
<div class="controls"><button class="primary" id="trigger">AWAKEN THE BEAST</button><button id="sound">SOUND: OFF</button><button id="reset">RESET</button></div><p class="note">Standalone preview only — not connected to the live TikNation gift catalog. Tap SOUND to enable generated audio.</p></main>
<script>
const scene=document.getElementById('scene'),caption=document.getElementById('caption'),trigger=document.getElementById('trigger'),sound=document.getElementById('sound');let audio=false,ctx=null,timers=[];
function tone(freq,duration,volume,type='sawtooth',delay=0){if(!audio)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime+delay);o.frequency.exponentialRampToValueAtTime(Math.max(24,freq*.38),ctx.currentTime+delay+duration);g.gain.setValueAtTime(.0001,ctx.currentTime+delay);g.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+delay+.05);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+delay+duration);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+duration+.03)}catch(e){}}
function reset(){timers.forEach(clearTimeout);timers=[];scene.classList.remove('reveal','charge','flash');caption.textContent="DON'T MOVE. IT CAN HEAR YOU.";trigger.disabled=false;trigger.textContent='AWAKEN THE BEAST'}
trigger.onclick=()=>{reset();void scene.offsetWidth;scene.classList.add('reveal');trigger.disabled=true;tone(48,3,.2,'sawtooth');caption.textContent='A SHAPE IS MOVING IN THE DARK';timers.push(setTimeout(()=>{caption.textContent='TWO EYES OPEN IN THE BLACK';tone(155,.7,.12,'triangle');tone(170,.7,.12,'triangle',.2)},2300));timers.push(setTimeout(()=>{scene.classList.add('flash');caption.textContent='IT HAS FOUND YOU';tone(72,1.1,.2);},4300));timers.push(setTimeout(()=>{scene.classList.add('charge');caption.textContent='RUN.';tone(34,1.4,.3,'sawtooth');tone(58,.8,.2,'square',.12)},5700));timers.push(setTimeout(()=>{trigger.disabled=false;trigger.textContent='AWAKEN AGAIN'},6800))};
sound.onclick=()=>{audio=!audio;sound.textContent='SOUND: '+(audio?'ON':'OFF');if(audio){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();tone(110,.2,.07,'triangle')}};document.getElementById('reset').onclick=reset;
</script></body></html>
