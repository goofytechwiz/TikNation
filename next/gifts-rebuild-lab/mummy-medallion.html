<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The Curse of the Mummy's Medallion</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100b08;color:#fff1d4;font-family:system-ui,sans-serif}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 25%,#080503aa 100%),linear-gradient(#10090455,transparent 45%,#08050399)}header{position:fixed;top:env(safe-area-inset-top,10px);left:0;right:0;text-align:center;padding:15px 8px 0;text-shadow:0 2px 15px #000;pointer-events:none}.tag{font-size:10px;letter-spacing:.32em;color:#e5bd70;font-weight:800}h1{font:500 clamp(22px,4.7vw,42px) Georgia,serif;letter-spacing:.045em;margin:6px 0}.sub{font-size:10px;letter-spacing:.16em;color:#d9c59d}.controls{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 10px}button{border:1px solid #d5a94e99;background:#21170de0;color:#fff1d4;border-radius:30px;padding:12px 17px;font-size:10px;font-weight:800;letter-spacing:.1em;backdrop-filter:blur(10px)}button.primary{background:linear-gradient(135deg,#76501c,#3b2711);border-color:#f1cb77}#hint{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:10px;letter-spacing:.13em;color:#e5c990;text-shadow:0 2px 8px #000;pointer-events:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#100b08;color:#e9c77d;letter-spacing:.2em;font-size:11px;z-index:5;transition:opacity .5s}#loading.off{opacity:0;pointer-events:none}#err{display:none;position:fixed;top:50%;left:8%;right:8%;text-align:center;color:#ffd6c8;font-size:13px}@media(max-width:520px){h1{font-size:24px}button{padding:11px 13px}}
</style></head><body>
<div id="scene"></div><div class="shade"></div><header><div class="tag">TIKNATION · EPIC GIFTS</div><h1>THE CURSE OF THE MUMMY'S MEDALLION</h1><div class="sub">SOME TREASURES SHOULD REMAIN BURIED</div></header><div id="hint">THE MEDALLION HAS BEEN DISTURBED</div><div class="controls"><button class="primary" id="curse">BREAK THE SEAL</button><button id="sound">SOUND: OFF</button></div><div id="loading">ENTERING THE ANCIENT TOMB…</div><div id="err"></div>
<script>
document.getElementById('curse').addEventListener('click',()=>{document.getElementById('hint').textContent='THE ANCIENT CURSE HAS BEEN UNLEASHED';document.getElementById('curse').textContent='THE SEAL IS BROKEN';});
document.getElementById('sound').addEventListener('click',()=>{document.getElementById('sound').textContent='SOUND: ENABLED';});
</script>
<script type="module">
const host=document.getElementById('scene'),loading=document.getElementById('loading');
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x21150c);scene.fog=new THREE.FogExp2(0x28190d,.022);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,300);camera.position.set(0,8.5,27);camera.lookAt(0,4,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8c58d,0x160c07,1.35));
const key=new THREE.DirectionalLight(0xffd69a,2.1);key.position.set(-8,18,12);key.castShadow=true;scene.add(key);
const goldLight=new THREE.PointLight(0xffa82e,42,28);goldLight.position.set(0,4,5);scene.add(goldLight);
const torchL=new THREE.PointLight(0xff7020,24,22);torchL.position.set(-9,5,1);scene.add(torchL);const torchR=new THREE.PointLight(0xff7020,24,22);torchR.position.set(9,5,-2);scene.add(torchR);
const stone=new THREE.MeshStandardMaterial({color:0x80613c,roughness:.96}),sandstone=new THREE.MeshStandardMaterial({color:0xb18a55,roughness:.93}),darkStone=new THREE.MeshStandardMaterial({color:0x342315,roughness:1}),gold=new THREE.MeshStandardMaterial({color:0xd9a83e,metalness:.82,roughness:.22}),goldDark=new THREE.MeshStandardMaterial({color:0x68451b,metalness:.7,roughness:.32}),linen=new THREE.MeshStandardMaterial({color:0xc8b68f,roughness:1}),linenShadow=new THREE.MeshStandardMaterial({color:0x77664c,roughness:1}),gem=new THREE.MeshPhysicalMaterial({color:0x16c9b4,metalness:.3,roughness:.16,emissive:0x087d70,emissiveIntensity:.7,clearcoat:1});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshStandardMaterial({color:0x49321e,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.15;floor.receiveShadow=true;scene.add(floor);
// Massive tomb walls and ceiling ribs
const back=new THREE.Mesh(new THREE.BoxGeometry(32,17,1.2),darkStone);back.position.set(0,8,-8);back.receiveShadow=true;scene.add(back);
for(const x of [-15,15]){const side=new THREE.Mesh(new THREE.BoxGeometry(1.2,17,18),stone);side.position.set(x,8,0);scene.add(side)}
const ceiling=new THREE.Mesh(new THREE.BoxGeometry(31,1,18),darkStone);ceiling.position.set(0,16.5,0);scene.add(ceiling);
for(let x=-13;x<=13;x+=4.3){const pilaster=new THREE.Mesh(new THREE.BoxGeometry(.8,15,.9),sandstone);pilaster.position.set(x,7.5,-7.25);scene.add(pilaster);const cap=new THREE.Mesh(new THREE.BoxGeometry(1.5,.6,1.3),goldDark);cap.position.set(x,14.8,-7.2);scene.add(cap)}
// Ancient carved wall panels
for(let i=0;i<7;i++){const panel=new THREE.Mesh(new THREE.BoxGeometry(2.6,5,.16),sandstone);panel.position.set(-12.5+i*4.15,8.5,-7.28);scene.add(panel);for(let k=0;k<3;k++){const glyph=new THREE.Mesh(new THREE.BoxGeometry(.14,1.4,.08),goldDark);glyph.position.set(-13.2+i*4.15+k*.65,8.5,-7.16);glyph.rotation.z=(k-1)*.12;scene.add(glyph)}}
function pillar(x,z){const base=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.2,.65,8),darkStone);base.position.set(x,.2,z);scene.add(base);const col=new THREE.Mesh(new THREE.CylinderGeometry(.72,.86,10,10),sandstone);col.position.set(x,5.5,z);col.castShadow=true;scene.add(col);const capital=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.05,.9,8),goldDark);capital.position.set(x,10.9,z);scene.add(capital)}
pillar(-11,3);pillar(11,3);
// Sarcophagus on a raised stone platform
const tomb=new THREE.Group();scene.add(tomb);tomb.position.set(0,.2,-.2);
const plinth=new THREE.Mesh(new THREE.BoxGeometry(8.8,1,5.2),darkStone);plinth.position.y=.5;plinth.castShadow=true;plinth.receiveShadow=true;tomb.add(plinth);
const baseBox=new THREE.Mesh(new THREE.BoxGeometry(7.7,1.35,4.2),goldDark);baseBox.position.y=1.65;tomb.add(baseBox);
const coffin=new THREE.Mesh(new THREE.BoxGeometry(7.35,1.25,3.85),sandstone);coffin.position.y=2.75;coffin.castShadow=true;tomb.add(coffin);
const lidGroup=new THREE.Group();lidGroup.position.set(0,3.42,-1.75);tomb.add(lidGroup);
const lid=new THREE.Mesh(new THREE.BoxGeometry(7.8,.8,4.35),goldDark);lid.position.set(0,0,1.9);lid.castShadow=true;lidGroup.add(lid);
const lidFace=new THREE.Mesh(new THREE.BoxGeometry(7.1,.18,3.7),gold);lidFace.position.set(0,.48,1.9);lidGroup.add(lidFace);
for(let i=0;i<9;i++){const stripe=new THREE.Mesh(new THREE.BoxGeometry(.14,.08,3.35),goldDark);stripe.position.set(-3.25+i*.81,.59,1.9);lidGroup.add(stripe)}
// Mummy body built as wrapped, articulated form
const mummy=new THREE.Group();scene.add(mummy);mummy.position.set(0,2.3,0);mummy.rotation.x=-.12;
function ellipsoid(parent,mat,x,y,z,sx,sy,sz){const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,16),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;parent.add(m);return m}
ellipsoid(mummy,linen,0,1.2,0,1.12,1.45,.55);ellipsoid(mummy,linen,0,3.05,.03,.72,.9,.62);ellipsoid(mummy,linen,0,4.15,.05,.63,.72,.58);
ellipsoid(mummy,linenShadow,0,4.25,.48,.48,.28,.18);
for(const side of [-1,1]){const arm=new THREE.Group();arm.position.set(side*.85,2.9,0);arm.rotation.z=side*.45;mummy.add(arm);ellipsoid(arm,linen,side*.2,-.62,.02,.32,.95,.34);ellipsoid(arm,linen,side*.38,-1.42,.15,.27,.8,.3);const leg=new THREE.Group();leg.position.set(side*.48,.25,0);mummy.add(leg);ellipsoid(leg,linen,0,-.55,.02,.39,1.05,.4);ellipsoid(leg,linen,side*.08,-1.35,.4,.42,.32,.72)}
// Layered bandage strips wrap torso, head and limbs
for(let i=0;i<15;i++){const y=.25+i*.19;const wrap=new THREE.Mesh(new THREE.TorusGeometry(.83-i*.012,.075,7,36),linenShadow);wrap.position.set(0,y,0);wrap.scale.set(1.12,.78,.62);wrap.rotation.x=Math.PI/2; mummy.add(wrap)}
for(let i=0;i<9;i++){const band=new THREE.Mesh(new THREE.TorusGeometry(.55-i*.018,.06,7,32),linenShadow);band.position.set(0,3.7+i*.11,.06);band.scale.set(1,1,.9);mummy.add(band)}
// Gold collar and cursed medallion
const collar=new THREE.Mesh(new THREE.TorusGeometry(.78,.15,10,48),gold);collar.position.set(0,3.48,.55);collar.rotation.x=Math.PI/2.3;collar.scale.set(1.15,.85,1);mummy.add(collar);
const medallion=new THREE.Group();scene.add(medallion);medallion.position.set(0,5.8,4.6);
const disk=new THREE.Mesh(new THREE.CylinderGeometry(.78,.78,.16,48),gold);disk.rotation.x=Math.PI/2;medallion.add(disk);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.62,.075,10,48),goldDark);medallion.add(ring);
const center=new THREE.Mesh(new THREE.CircleGeometry(.52,48),goldDark);center.position.z=.095;medallion.add(center);
const scarab=new THREE.Mesh(new THREE.SphereGeometry(.34,24,18),gem);scarab.scale.set(.82,1.2,.48);scarab.position.z=.17;medallion.add(scarab);
for(let i=0;i<12;i++){const ray=new THREE.Mesh(new THREE.BoxGeometry(.07,.32,.08),gold);const a=i*Math.PI/6;ray.position.set(Math.cos(a)*.43,Math.sin(a)*.43,.15);ray.rotation.z=a;medallion.add(ray)}
const chain=new THREE.Mesh(new THREE.TorusGeometry(1.02,.055,8,48,Math.PI),goldDark);chain.position.y=.85;medallion.add(chain);
// Floating sand and glowing dust
const dustN=650,dustPos=new Float32Array(dustN*3);for(let i=0;i<dustN;i++){dustPos[i*3]=(Math.random()-.5)*32;dustPos[i*3+1]=Math.random()*16;dustPos[i*3+2]=(Math.random()-.5)*25}const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xe6bd78,size:.045,transparent:true,opacity:.58}));scene.add(dust);
const sparks=new THREE.Group();scene.add(sparks);for(let i=0;i<34;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.035,6,5),new THREE.MeshBasicMaterial({color:0x54ffe5}));p.position.set((Math.random()-.5)*5,Math.random()*8+1,3+Math.random()*3);sparks.add(p)}
// Torch bowls and flame glow
for(const x of [-9,9]){const stand=new THREE.Mesh(new THREE.CylinderGeometry(.22,.42,2.3,8),darkStone);stand.position.set(x,1.2,1.5);scene.add(stand);const flame=new THREE.Mesh(new THREE.ConeGeometry(.28,1.1,12),new THREE.MeshBasicMaterial({color:0xff9b32}));flame.position.set(x,2.85,1.5);scene.add(flame)}
let awakening=0,target=0,audio=null,osc=null,gain=null,soundOn=false;
document.getElementById('curse').addEventListener('click',()=>{target=1;document.getElementById('hint').textContent='THE ANCIENT CURSE HAS BEEN UNLEASHED';});
document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;document.getElementById('sound').textContent='SOUND: '+(soundOn?'ON':'OFF');if(soundOn){audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();osc=audio.createOscillator();gain=audio.createGain();const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=95;osc.type='sawtooth';osc.frequency.value=42;gain.gain.value=.0001;osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start();gain.gain.setTargetAtTime(.045,audio.currentTime,.5)}else if(gain){gain.gain.setTargetAtTime(.0001,audio.currentTime,.25);setTimeout(()=>{try{osc.stop()}catch(e){}},1000)}});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();awakening+=(target-awakening)*.012;lidGroup.position.x=-awakening*5.2;lidGroup.rotation.z=-awakening*.06;mummy.position.y=2.3+awakening*2.1+Math.sin(t*.8)*.045;mummy.rotation.z=Math.sin(t*.4)*.025;medallion.position.y=5.8+Math.sin(t*1.3)*.22+awakening*.8;medallion.rotation.y=t*.45;medallion.rotation.z=Math.sin(t*.7)*.12;goldLight.intensity=35+Math.sin(t*5)*7+awakening*25;torchL.intensity=22+Math.sin(t*8)*4;torchR.intensity=22+Math.sin(t*7.2)*5;const arr=dustGeo.attributes.position.array;for(let i=0;i<dustN;i++){arr[i*3]+=.003*Math.sin(t+i);arr[i*3+1]+=.008;if(arr[i*3+1]>16)arr[i*3+1]=0}dustGeo.attributes.position.needsUpdate=true;sparks.rotation.y=t*.28;sparks.children.forEach((p,i)=>{p.position.y+=Math.sin(t*1.7+i)*.002;p.material.opacity=.4+.5*(.5+.5*Math.sin(t*3+i))});renderer.render(scene,camera)}
animate();loading.classList.add('off');setTimeout(()=>loading.remove(),650);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){loading.classList.add('off');document.getElementById('err').style.display='block';document.getElementById('err').textContent='The tomb could not load on this device. '+e.message;console.error(e)}
</script></body></html>
