<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#100a06"><title>The Curse of the Mummy's Medallion</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100a06;color:#f5dfb0;font-family:Georgia,serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 25%,#08050399 100%),linear-gradient(#10090455,transparent 40%,#080503bb)}header{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;text-align:center;padding:14px 10px;text-shadow:0 3px 12px #000;pointer-events:none}.eyebrow{font:800 9px system-ui;letter-spacing:.32em;color:#e4bd70}h1{font-weight:500;font-size:clamp(20px,4vw,38px);letter-spacing:.045em;margin:7px 0}.sub{font:10px system-ui;letter-spacing:.18em;color:#d6bd91}#hint{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:800 10px system-ui;letter-spacing:.16em;color:#f2d08c;text-shadow:0 2px 8px #000;pointer-events:none;padding:0 10px}.controls{position:fixed;bottom:calc(17px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 10px}button{border:1px solid #d5a94e;background:#21170deF;color:#fff0d0;border-radius:30px;padding:13px 17px;font:800 10px system-ui;letter-spacing:.1em;cursor:pointer;touch-action:manipulation}button.primary{background:linear-gradient(135deg,#86591d,#38240e);box-shadow:0 0 22px #e5a83a44}button:active{transform:scale(.96)}@media(max-width:520px){h1{font-size:22px}button{padding:12px 13px}}
</style></head><body>
<canvas id="art"></canvas><div class="vignette"></div><header><div class="eyebrow">TIKNATION · EPIC GIFTS</div><h1>THE CURSE OF THE MUMMY'S MEDALLION</h1><div class="sub">SOME TREASURES SHOULD REMAIN BURIED</div></header><div id="hint">THE MEDALLION HAS BEEN DISTURBED</div><div class="controls"><button class="primary" id="curse">BREAK THE SEAL</button><button id="sound">SOUND: OFF</button></div>
<script>
(()=>{
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');let W=0,H=0,D=1,broken=false,progress=0,sound=false,audio=null,osc=null,gain=null;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}
function glow(x,y,r,color){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
function text(s,x,y,size,color){ctx.font='bold '+size+'px Georgia';ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(s,x,y)}
function draw(t){const scale=Math.min(W/900,H/620),cx=W/2,top=H*.13,base=H*.87;ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(cx,0);ctx.scale(scale,scale);ctx.translate(-450,0);
const floorY=base/scale;
// chamber backdrop with converging perspective
let wall=ctx.createLinearGradient(0,top,0,base);wall.addColorStop(0,'#28190f');wall.addColorStop(.6,'#624326');wall.addColorStop(1,'#1a1009');rect(-300,top/scale,1500,(base-top)/scale,wall);
poly([[0,top/scale],[220,top/scale+30],[220,floorY],[0,floorY]],'#382515');poly([[900,top/scale],[680,top/scale+30],[680,floorY],[900,floorY]],'#382515');
poly([[220,top/scale+30],[680,top/scale+30],[900,floorY], [0,floorY]],'#6b4a29');
for(let i=0;i<7;i++){let x=245+i*68;rect(x,top/scale+38,3,(floorY-top/scale)*.58,'#9b7445');rect(x+4,top/scale+38,1,(floorY-top/scale)*.58,'#2b1b10')}
for(let y=top/scale+55;y<floorY-35;y+=54){ctx.strokeStyle='#a17b4c66';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(220,y);ctx.lineTo(680,y);ctx.stroke()}
for(let i=0;i<12;i++){let x=238+i*37;ctx.strokeStyle='#d4ad6c77';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,top/scale+60);ctx.lineTo(x+5,top/scale+83);ctx.lineTo(x-3,top/scale+105);ctx.stroke();ellipse(x+12,top/scale+132,4,7,'#c39a5e')}
// columns
for(let x of [115,785]){rect(x-27,top/scale+25,54,floorY-top/scale-20,'#25170e');rect(x-22,top/scale+35,44,floorY-top/scale-25,'#9b7447');for(let k=0;k<8;k++)rect(x-20+k*5,top/scale+40,2,floorY-top/scale-35,'#d0a66a');rect(x-40,top/scale+18,80,16,'#c09252');rect(x-34,floorY-10,68,18,'#2a1a0e')}
// torch sconces
for(let x of [170,730]){rect(x-8,top/scale+160,16,85,'#24170e');poly([[x-19,top/scale+160],[x,top/scale+126],[x+19,top/scale+160]],'#9a6330');glow(x,top/scale+122,90,'#ff8c2c55');ellipse(x,top/scale+123,8,20,'#ff9b38');ellipse(x,top/scale+117,4,12,'#ffe5a0')}
// raised tomb base
let tombY=floorY-150;poly([[170,tombY+60],[730,tombY+60],[780,tombY+130],[120,tombY+130]],'#21150d','#b28a4d');poly([[190,tombY],[710,tombY],[730,tombY+65],[170,tombY+65]],'#9a7442','#e1b96d');poly([[205,tombY+8],[695,tombY+8],[710,tombY+56],[190,tombY+56]],'#4a2d16','#d5a34c');
for(let i=0;i<12;i++){rect(215+i*40,tombY+14,2,35,'#d8b56c');}
// coffin and lid sliding aside on activation
let lidShift=progress*260;
poly([[230-lidShift,tombY-82],[670-lidShift,tombY-82],[715-lidShift,tombY+4],[185-lidShift,tombY+4]],'#b48a4b','#f0ca77');poly([[245-lidShift,tombY-70],[655-lidShift,tombY-70],[686-lidShift,tombY-7],[214-lidShift,tombY-7]],'#593916','#e5bd6a');for(let i=0;i<8;i++)rect(250-lidShift+i*50,tombY-61,3,48,'#d8ad5c');
poly([[245,tombY-75],[655,tombY-75],[685,tombY-8],[215,tombY-8]],'#6b4b27','#c69b57');
// cinematic full-size mummy emerging from the sarcophagus
let rise=progress*105, mx=450,my=tombY-330-rise;
// Enlarge the whole creature around its chest so it dominates the tomb scene
ctx.save();ctx.translate(mx,my+48);ctx.scale(2.0,2.0);ctx.translate(-mx,-(my+48));
ellipse(mx,my+225,125,26,'#100904bb');
// dangling wrapped legs and broad feet, visible below the torso
for(let side of [-1,1]){
  let lx=mx+side*27;
  ctx.strokeStyle='#8a7554';ctx.lineWidth=43;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(lx,my+128);ctx.quadraticCurveTo(lx+side*8,my+184,lx+side*5,my+222);ctx.stroke();
  ctx.strokeStyle='#d7c6a0';ctx.lineWidth=34;ctx.beginPath();ctx.moveTo(lx,my+130);ctx.lineTo(lx+side*5,my+218);ctx.stroke();
  ctx.strokeStyle='#786044';ctx.lineWidth=5;for(let k=0;k<6;k++){ctx.beginPath();ctx.moveTo(lx-16,my+145+k*9);ctx.lineTo(lx+17,my+153+k*9);ctx.stroke()}
  ellipse(lx+side*9,my+237,29,12,'#bca782');
  for(let k=0;k<4;k++){ctx.strokeStyle=k%2?'#e4d4b2':'#806747';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(lx+side*(-8+k*5),my+229);ctx.lineTo(lx+side*(-10+k*5),my+247);ctx.stroke()}
}
ellipse(mx,my+133,120,25,'#100904aa');
let bodyGrad=ctx.createLinearGradient(mx-65,my+5,mx+65,my+155);bodyGrad.addColorStop(0,'#ead9b4');bodyGrad.addColorStop(.48,'#b5a07a');bodyGrad.addColorStop(1,'#625039');
ctx.beginPath();ctx.moveTo(mx-43,my+3);ctx.quadraticCurveTo(mx-76,my+38,mx-65,my+119);ctx.quadraticCurveTo(mx-53,my+163,mx-34,my+170);ctx.lineTo(mx+36,my+170);ctx.quadraticCurveTo(mx+64,my+147,mx+65,my+91);ctx.quadraticCurveTo(mx+73,my+28,mx+40,my+2);ctx.closePath();ctx.fillStyle=bodyGrad;ctx.fill();
ellipse(mx,my-48,44,53,'#c8b58e');ellipse(mx-3,my-48,35,45,'#d8c7a2');
ctx.save();ctx.beginPath();ctx.ellipse(mx,my-48,44,53,0,0,Math.PI*2);ctx.clip();
for(let j=0;j<12;j++){let yy=my-91+j*8;ctx.strokeStyle=j%2?'#766044':'#ead9b6';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(mx-53,yy+5);ctx.quadraticCurveTo(mx,yy-8,mx+54,yy+5);ctx.stroke();ctx.strokeStyle='#4c3925';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(mx-48,yy+9);ctx.quadraticCurveTo(mx,yy-3,mx+48,yy+9);ctx.stroke()}
ctx.restore();
// narrow dark eye opening between old wrappings, with faint amber eyes
poly([[mx-24,my-52],[mx-8,my-57],[mx+1,my-52],[mx+22,my-57],[mx+27,my-49],[mx+5,my-43],[mx-17,my-44]],'#26180f');
ellipse(mx-13,my-49,3,2,'#c98b35');ellipse(mx+14,my-50,3,2,'#c98b35');
ctx.strokeStyle='#59432c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(mx-20,my-29);ctx.quadraticCurveTo(mx,my-20,mx+19,my-31);ctx.stroke();
// torso bandages, diagonally wound with frayed edges and aged stains
ctx.save();ctx.beginPath();ctx.moveTo(mx-67,my+1);ctx.lineTo(mx+67,my+1);ctx.lineTo(mx+69,my+170);ctx.lineTo(mx-69,my+170);ctx.closePath();ctx.clip();
for(let j=0;j<17;j++){let yy=my+7+j*10;ctx.strokeStyle=j%2?'#766247':'#e4d4b2';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(mx-82,yy+20);ctx.lineTo(mx+82,yy-20);ctx.stroke();ctx.strokeStyle='#59452f88';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(mx-82,yy+24);ctx.lineTo(mx+82,yy-16);ctx.stroke()}
for(let j=0;j<8;j++){ellipse(mx-35+j*10,my+35+(j%3)*29,4,7,'#80634344')}
ctx.restore();
// shoulder and arm silhouettes
for(let side of [-1,1]){ctx.save();ctx.translate(mx+side*49,my+22);ctx.rotate(side*(.42-progress*.32));let arm=ctx.createLinearGradient(-16,0,18,0);arm.addColorStop(0,'#665039');arm.addColorStop(.35,'#e0cfaa');arm.addColorStop(1,'#8c7654');ctx.strokeStyle=arm;ctx.lineWidth=30;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(side*24,38,side*34,67);ctx.lineTo(side*27,103);ctx.stroke();ctx.strokeStyle='#f0dfbd';ctx.lineWidth=5;for(let k=0;k<7;k++){ctx.beginPath();ctx.moveTo(side*(-13+k*4),8+k*2);ctx.lineTo(side*(22+k*3),91+k*2);ctx.stroke()}ctx.strokeStyle='#59452e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(side*25,48);ctx.lineTo(side*42,63);ctx.stroke();
// curled fingers
for(let f=0;f<4;f++){ctx.strokeStyle=f%2?'#b9a47f':'#e1d0ab';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(side*(27+f*3),101);ctx.quadraticCurveTo(side*(39+f*4),115,side*(31+f*4),124);ctx.stroke()}
ctx.restore()}
// hanging torn linen strips
for(let i=0;i<6;i++){let x=mx-46+i*18;ctx.strokeStyle=i%2?'#e2d1ad':'#786347';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,my+82);ctx.quadraticCurveTo(x-9,my+117,x+((i%2)*13-6),my+151+(i%3)*8);ctx.stroke()}
// layered collar
poly([[mx-47,my-1],[mx-30,my+24],[mx+30,my+24],[mx+47,my-1],[mx+32,my+6],[mx,my+17],[mx-32,my+6]],'#d6a63e','#f4d78b');
ctx.restore(); // end enlarged mummy character
// medallion hovering forward
let medX=mx+175,medY=my+55-Math.sin(t*1.6)*8-progress*65;glow(medX,medY,105,'#00e9cf66');ellipse(medX,medY,34,39,'#c99b3e');ellipse(medX,medY,27,32,'#62451b');ellipse(medX,medY,18,24,'#14cbb4');ellipse(medX-6,medY-7,5,9,'#b4fff0');for(let i=0;i<12;i++){let a=i*Math.PI/6;ctx.strokeStyle='#f2ce73';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(medX+Math.cos(a)*37,medY+Math.sin(a)*42);ctx.lineTo(medX+Math.cos(a)*48,medY+Math.sin(a)*53);ctx.stroke()}
ctx.strokeStyle='#d4ad5d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(medX,medY-44,48,Math.PI,Math.PI*2);ctx.stroke();
// foreground sand ripples and drifting dust
for(let i=0;i<40;i++){let x=(i*83+t*9)%900,y=(i*47+Math.sin(t+i)*8+floorY*.78);ellipse(x,y,1.5+(i%3),1.5,'#e7c58b88')}
if(progress>.05){glow(medX,medY,180,'#05d8c755');for(let i=0;i<28;i++){let a=i*2.4+t*1.2,r=45+((i*19+t*20)%105);ellipse(medX+Math.cos(a)*r,medY+Math.sin(a)*r,2,2,'#70fff0')}}
ctx.restore();
}
let last=0;function frame(ts){let dt=Math.min((ts-last)/1000,.05);last=ts;if(broken)progress=Math.min(1,progress+dt*.22);draw(ts/1000);requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.getElementById('curse').addEventListener('click',()=>{broken=true;document.getElementById('hint').textContent='THE SEAL IS BROKEN · THE MUMMY AWAKENS';document.getElementById('curse').textContent='THE CURSE IS UNLEASHED';});
document.getElementById('sound').addEventListener('click',()=>{sound=!sound;document.getElementById('sound').textContent='SOUND: '+(sound?'ON':'OFF');if(sound){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();osc=audio.createOscillator();gain=audio.createGain();let filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=110;osc.type='sawtooth';osc.frequency.value=48;gain.gain.value=.035;osc.connect(filter);filter.connect(gain);gain.connect(audio.destination);osc.start()}catch(e){}}else if(osc){try{osc.stop()}catch(e){}osc=null}});
})();
</script></body></html>
