<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>THE LAST LIGHT · TikNation Gift Rebuild Lab</title>
<style>
:root{color-scheme:dark;--cyan:#9ceeff;--red:#ff3434}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030407;color:#eaf5ff;font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center}
.stage{position:relative;width:100%;height:100%;min-height:420px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 62%,#19212a 0,#080c12 42%,#020307 100%)}
.room{position:absolute;inset:0;background:linear-gradient(180deg,#070b12 0 13%,transparent 13%),linear-gradient(90deg,#030509 0 8%,transparent 8% 92%,#030509 92%),linear-gradient(180deg,transparent 0 65%,#080b10 65%);perspective:900px}
.backwall{position:absolute;inset:12% 9% 20%;background:linear-gradient(180deg,#1a222c,#0b1018 78%);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);border:1px solid #34404a;box-shadow:inset 0 0 90px #000}
.floor{position:absolute;left:-10%;right:-10%;bottom:-10%;height:43%;background:linear-gradient(180deg,#111923,#05070b 75%);transform:perspective(420px) rotateX(17deg);transform-origin:top;box-shadow:inset 0 18px 35px #000}
.ceiling{position:absolute;top:0;left:8%;right:8%;height:16%;background:linear-gradient(180deg,#151c25,#080b10);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.lightbar{position:absolute;top:14%;left:20%;width:60%;height:3px;background:#d8f6ff;box-shadow:0 0 12px 4px #8bdcff,0 0 70px 24px #8bdcff55;opacity:.9;transition:opacity .4s}
.panels{position:absolute;inset:16% 15% 25%;display:flex;justify-content:space-between;pointer-events:none}
.panel{width:10%;height:100%;border:1px solid #38434d;background:linear-gradient(90deg,#111923,#222b34,#0b1119);box-shadow:inset 0 0 22px #000}
.door{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);width:min(24vw,230px);height:43%;min-width:130px;background:linear-gradient(90deg,#090c12,#242c35 48%,#090c12);border:5px solid #111821;box-shadow:0 0 0 2px #48525a, inset 0 0 28px #000;transform-origin:center bottom}
.door:before{content:"";position:absolute;inset:7% 8%;border:2px solid #45505a;box-shadow:inset 0 0 25px #000}
.handle{position:absolute;right:13%;top:54%;width:8px;height:8px;border-radius:50%;background:#b7c5cc;box-shadow:0 0 7px #fff}
.lamp{position:absolute;width:15px;height:15px;border-radius:50%;background:#e8faff;box-shadow:0 0 9px 5px #a8eaff,0 0 45px 18px #8bdcff66;top:20%;transition:opacity .2s,filter .2s}
.lamp.a{left:23%}.lamp.b{left:48%}.lamp.c{right:23%}
.beam{position:absolute;top:20%;width:25%;height:52%;background:linear-gradient(180deg,#c4f5ff25,transparent);filter:blur(8px);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transition:opacity .25s}
.beam.a{left:18%}.beam.b{left:37%}.beam.c{right:18%}
.shadow{position:absolute;left:50%;bottom:21%;width:90px;height:190px;transform:translateX(-50%) scale(.3);transform-origin:bottom;opacity:0;transition:transform 1.8s cubic-bezier(.2,.7,.1,1),opacity .7s;filter:drop-shadow(0 0 22px #000)}
.shadow .head{position:absolute;left:24px;top:0;width:44px;height:56px;border-radius:48% 48% 35% 35%;background:#010204}
.shadow .body{position:absolute;left:5px;top:42px;width:80px;height:145px;background:linear-gradient(90deg,#010204,#090d13 50%,#010204);clip-path:polygon(34% 0,66% 0,85% 15%,100% 100%,0 100%,15% 15%)}
.shadow .eyes{position:absolute;top:28px;left:33px;width:25px;height:4px;background:#e8fbff;box-shadow:0 0 9px 4px #d5f8ff;opacity:0;transition:opacity .2s}
.flicker{position:absolute;inset:0;background:#d8f4ff;opacity:0;pointer-events:none}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 160px 55px #000;pointer-events:none}
.scan{position:absolute;inset:0;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#cceeff 4px,transparent 5px);pointer-events:none}
.hud{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:12px;color:#b6c9d5;font:11px/1.4 monospace;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 1px 4px #000}
.hud span:last-child{text-align:right}
.caption{position:absolute;left:0;right:0;bottom:14%;text-align:center;font:clamp(22px,4vw,46px)/1.1 Georgia,serif;letter-spacing:.2em;color:#e8f7ff;text-shadow:0 0 22px #9ceeff88;opacity:0;transition:opacity .5s}
.status{position:absolute;left:18px;bottom:18px;color:#a9c0cc;font:10px monospace;letter-spacing:.14em}
.controls{position:absolute;z-index:5;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;justify-content:center;width:calc(100% - 28px);flex-wrap:wrap}
button{appearance:none;border:1px solid #527080;background:#07121bdc;color:#eafaff;padding:12px 16px;font:700 11px monospace;letter-spacing:.12em;cursor:pointer;min-height:42px}
button.primary{border-color:#9ceeff;background:linear-gradient(180deg,#12313e,#07151d);box-shadow:0 0 18px #8bdcff24}
button:active{transform:translateY(1px)}button:focus-visible{outline:2px solid white;outline-offset:3px}
.stage.running .lightbar{opacity:.1}
.stage.blackout .lightbar,.stage.blackout .lamp,.stage.blackout .beam{opacity:0}
.stage.blackout .shadow{opacity:1;transform:translateX(-50%) scale(1)}
.stage.reveal .shadow{transform:translateX(-50%) scale(1.34)}
.stage.reveal .shadow .eyes{opacity:1}
.stage.hit{animation:shake .28s linear 2}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-5px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
@media(max-width:560px){.hud{font-size:9px;top:12px;left:12px;right:12px}.controls{bottom:12px}.controls button{padding:10px 12px;font-size:10px}.status{bottom:76px;left:12px}.caption{bottom:23%}.door{width:36vw}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="The Last Light horror gift preview">
 <div class="room"><div class="ceiling"></div><div class="backwall"></div><div class="floor"></div><div class="panels"><i class="panel"></i><i class="panel"></i><i class="panel"></i></div>
 <div class="lightbar"></div><i class="lamp a"></i><i class="lamp b"></i><i class="lamp c"></i><i class="beam a"></i><i class="beam b"></i><i class="beam c"></i>
 <div class="door"><i class="handle"></i></div><div class="shadow" id="shadow"><i class="head"></i><i class="body"></i><i class="eyes"></i></div></div>
 <div class="flicker" id="flicker"></div><div class="vignette"></div><div class="scan"></div>
 <div class="hud"><span>TikNation · Gift Rebuild Lab</span><span>CAM 04 · LIVE FEED</span></div>
 <div class="caption" id="caption">THE LAST LIGHT</div>
 <div class="status" id="status" aria-live="polite">SYSTEM READY · LIGHTS STABLE</div>
 <div class="controls"><button class="primary" id="trigger">▶ TRIGGER THE LAST LIGHT</button><button id="sound">SOUND: ON</button><button id="reset">RESET</button></div>
</main>
<script>
(()=>{
const stage=document.getElementById('stage'),status=document.getElementById('status'),caption=document.getElementById('caption'),flicker=document.getElementById('flicker'),trigger=document.getElementById('trigger'),soundButton=document.getElementById('sound'),resetButton=document.getElementById('reset');
let runId=0,soundOn=true,ctx=null,master=null;
const wait=(ms,id)=>new Promise(resolve=>setTimeout(()=>resolve(id===runId),ms));
function audio(){
 if(!soundOn)return null;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=.48;master.connect(ctx.destination)}
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  return ctx;
 }catch(e){return null}
}
function tone(freq,duration,type='sawtooth',gain=.08,endFreq=null,delay=0){
 const c=audio();if(!c)return;
 try{const now=c.currentTime+delay,o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,now);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),now+duration);f.type='lowpass';f.frequency.value=900;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.04);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(f);f.connect(g);g.connect(master);o.start(now);o.stop(now+duration+.03)}catch(e){}
}
function staticBurst(duration=.35,gain=.06){
 const c=audio();if(!c)return;
 try{const n=Math.floor(c.sampleRate*duration),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();s.buffer=b;f.type='lowpass';f.frequency.value=1800;g.gain.value=gain;s.connect(f);f.connect(g);g.connect(master);s.start()}catch(e){}
}
function flash(opacity,duration=100){flicker.style.opacity=String(opacity);setTimeout(()=>flicker.style.opacity='0',duration)}
function reset(){
 runId++;stage.className='stage';caption.style.opacity='0';flicker.style.opacity='0';status.textContent='SYSTEM READY · LIGHTS STABLE';trigger.disabled=false;trigger.textContent='▶ TRIGGER THE LAST LIGHT';
}
async function run(){
 if(trigger.disabled)return;const id=++runId;trigger.disabled=true;stage.className='stage running';caption.style.opacity='0';status.textContent='POWER FLUCTUATION DETECTED';
 const c=audio();if(c){tone(92,1.5,'sawtooth',.09,38);staticBurst(.22,.035)}
 for(let i=0;i<3;i++){if(!await wait(620,id))return;const lamp=document.querySelectorAll('.lamp')[i],beam=document.querySelectorAll('.beam')[i];lamp.style.opacity='0';beam.style.opacity='0';status.textContent=['LIGHT CIRCUIT 01 · OFFLINE','LIGHT CIRCUIT 02 · OFFLINE','LIGHT CIRCUIT 03 · OFFLINE'][i];tone(125, .22,'square',.07,42);staticBurst(.12,.04);flash(.22,65)}
 if(!await wait(500,id))return;stage.classList.add('blackout');status.textContent='TOTAL POWER LOSS';tone(48,2.2,'sine',.22,25);staticBurst(.55,.055);flash(.7,120);
 if(!await wait(1450,id))return;status.textContent='MOVEMENT DETECTED · DOORWAY';tone(54,1.4,'sawtooth',.09,31);stage.classList.add('reveal');caption.style.opacity='1';
 if(!await wait(1250,id))return;flash(.9,90);stage.classList.add('hit');tone(38,1.2,'sine',.34,22);staticBurst(.32,.08);status.textContent='SUBJECT AT CAMERA · SIGNAL LOST';
 if(!await wait(1300,id))return;stage.classList.remove('hit');stage.classList.add('blackout');caption.style.opacity='0';status.textContent='FEED TERMINATED';trigger.disabled=false;trigger.textContent='↻ PLAY AGAIN';
}
trigger.addEventListener('click',run);resetButton.addEventListener('click',reset);
soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.textContent='SOUND: '+(soundOn?'ON':'OFF');if(!soundOn&&master)master.gain.setTargetAtTime(0,ctx.currentTime,.04);else if(soundOn&&master)master.gain.setTargetAtTime(.48,ctx.currentTime,.04)});
})();
</script>
</body>
</html>
