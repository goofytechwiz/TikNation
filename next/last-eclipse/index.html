<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050407">
<title>The Last Eclipse — TikNation Gift Preview</title>
<style>
:root{color-scheme:dark;--gold:#ffb45b;--ice:#a8d9ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050407;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 25%,rgba(0,0,0,.18) 65%,rgba(0,0,0,.82) 100%)}
.hud{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand,.status{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#c6c2ca}
.brand b{color:#ffbf79;font-weight:800}
.status{border:1px solid #ffffff25;border-radius:99px;padding:9px 12px;background:#09080dbb}
.center{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);text-align:center;width:min(90vw,520px);text-shadow:0 2px 22px #000}
.kicker{font-size:10px;letter-spacing:.42em;color:#ffd19d;text-transform:uppercase}
h1{font-size:clamp(28px,6vw,58px);letter-spacing:.12em;margin:9px 0 5px;font-weight:800}
.sub{font-size:12px;letter-spacing:.16em;color:#c4bdc2;text-transform:uppercase}
.controls{display:flex;justify-content:center;gap:10px;margin-top:20px;pointer-events:auto}
button{border:1px solid #ffca8b88;background:linear-gradient(180deg,#42291d,#160f11);color:#fff;border-radius:999px;padding:13px 20px;font-weight:750;letter-spacing:.12em;font-size:10px;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 28px #0009}
button.secondary{border-color:#ffffff42;background:#101016d9}
button:active{transform:scale(.97)}
.note{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.14em;color:#aaa2aa;text-transform:uppercase}
@media(max-height:560px){.center{top:82%}h1{font-size:28px}.sub{font-size:9px}.controls{margin-top:10px}.hud{padding-top:12px;padding-bottom:12px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Animated cosmic eclipse gift preview"></canvas><div class="shade"></div>
<div class="hud">
 <div class="top"><div class="brand"><b>TIKNATION</b> / GIFT PREVIEW</div><div class="status" id="status">SINGULARITY FORMING</div></div>
 <div class="center"><div class="kicker">A celestial event</div><h1>THE LAST ECLIPSE</h1><div class="sub">When the light goes out, the universe answers</div>
 <div class="controls"><button id="play">Play gift</button><button class="secondary" id="mute">Sound off</button></div></div>
 <div class="note">Preview only · Not added to the live gift catalog</div>
</div>
<script>
(()=>{
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const status=document.getElementById('status'),play=document.getElementById('play'),mute=document.getElementById('mute');
let w=0,h=0,dpr=1,t=0,playing=true,sound=false,audio=null,stars=[],embers=[],debris=[];
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.floor(w*h/4200)},()=>({x:rand(0,w),y:rand(0,h),r:rand(.35,1.5),p:rand(0,6.28)}));}
function spawn(){const cx=w*.5,cy=h*.43,rx=Math.min(w*.29,h*.31);for(let i=0;i<3;i++){const a=rand(0,Math.PI*2),r=rand(rx*.9,rx*1.85);embers.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r*.45,vx:-Math.cos(a)*rand(.3,1.6),vy:-Math.sin(a)*rand(.2,.9),life:rand(35,110),max:110,size:rand(.5,2.5)});}if(embers.length>950)embers.splice(0,embers.length-950);}
function drawRing(cx,cy,R,phase){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(-.16);ctx.scale(1,.34);
 for(let layer=0;layer<5;layer++){ctx.beginPath();ctx.ellipse(0,0,R*(1.02+layer*.085),R*(.28+layer*.018),0,0,Math.PI*2);ctx.strokeStyle=layer%2?'rgba(255,118,48,.10)':'rgba(255,192,112,.17)';ctx.lineWidth=R*(.045-layer*.005);ctx.shadowBlur=26;ctx.shadowColor='#ff7b35';ctx.stroke();}
 for(let i=0;i<520;i++){const a=i/520*Math.PI*2+phase*(i%3===0?1:-.55),rr=R*rand(1.03,1.38),x=Math.cos(a)*rr,y=Math.sin(a)*rr;const hot=Math.sin(a*7+phase*2)>.35;ctx.fillStyle=hot?'rgba(255,226,174,.82)':'rgba(255,102,46,.38)';ctx.fillRect(x,y,rand(1,3),rand(1,2));}
 ctx.restore();
}
function draw(){
 if(!playing)return;
 t+=.012;ctx.fillStyle='#050407';ctx.fillRect(0,0,w,h);
 const bg=ctx.createRadialGradient(w*.5,h*.42,5,w*.5,h*.42,Math.max(w,h)*.8);bg.addColorStop(0,'#17101a');bg.addColorStop(.48,'#090810');bg.addColorStop(1,'#020205');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 for(const s of stars){const tw=.45+.55*Math.sin(t*1.7+s.p);ctx.fillStyle='rgba(222,220,235,'+(tw*.65)+')';ctx.fillRect(s.x,s.y,s.r,s.r);}
 const cx=w*.5,cy=h*.43,R=Math.min(w*.19,h*.205,145);
 if(Math.random()<.72)spawn();
 drawRing(cx,cy,R,t);
 // Luminous corona behind the event horizon
 const corona=ctx.createRadialGradient(cx,cy,R*.72,cx,cy,R*1.28);corona.addColorStop(0,'rgba(255,225,178,0)');corona.addColorStop(.72,'rgba(255,145,69,.06)');corona.addColorStop(.91,'rgba(255,180,100,.55)');corona.addColorStop(1,'rgba(255,91,38,0)');ctx.fillStyle=corona;ctx.beginPath();ctx.arc(cx,cy,R*1.34,0,Math.PI*2);ctx.fill();
 // Event horizon and gravitational lens glow
 const halo=ctx.createRadialGradient(cx,cy,R*.72,cx,cy,R*1.12);halo.addColorStop(0,'#030205');halo.addColorStop(.72,'#050309');halo.addColorStop(.88,'rgba(13,9,17,.96)');halo.addColorStop(.97,'rgba(255,183,112,.75)');halo.addColorStop(1,'rgba(255,110,55,0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,R*1.13,0,Math.PI*2);ctx.fill();
 const core=ctx.createRadialGradient(cx-R*.22,cy-R*.25,1,cx,cy,R);core.addColorStop(0,'#09070d');core.addColorStop(.65,'#020205');core.addColorStop(1,'#000');ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,R*.91,0,Math.PI*2);ctx.fill();
 // Hot fragments bend around the dark center
 for(let i=embers.length-1;i>=0;i--){const p=embers[i];p.x+=p.vx;p.y+=p.vy;p.life--;const alpha=Math.max(0,p.life/p.max);ctx.fillStyle='rgba(255,174,104,'+(alpha*.8)+')';ctx.shadowBlur=12;ctx.shadowColor='#ff7d3c';ctx.beginPath();ctx.arc(p.x,p.y,p.size*alpha,0,Math.PI*2);ctx.fill();if(p.life<=0)embers.splice(i,1);}
 ctx.shadowBlur=0;
 // Brief gravitational flare
 if(Math.sin(t*.7)>.94){ctx.fillStyle='rgba(255,194,137,.055)';ctx.fillRect(0,0,w,h);}
 requestAnimationFrame(draw);
}
function startSound(){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(48,now);o.frequency.exponentialRampToValueAtTime(19,now+3.2);f.type='lowpass';f.frequency.value=180;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.16,now+.6);g.gain.exponentialRampToValueAtTime(.0001,now+4);o.connect(f).connect(g).connect(audio.destination);o.start(now);o.stop(now+4);}catch(e){}}
play.addEventListener('click',()=>{if(!playing){playing=true;requestAnimationFrame(draw);}t=0;embers=[];status.textContent='ECLIPSE IGNITION';startSound();setTimeout(()=>{status.textContent='EVENT HORIZON ACTIVE';},1500);});
mute.addEventListener('click',()=>{sound=!sound;mute.textContent=sound?'Sound on':'Sound off';if(sound)startSound();});
addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script>
</body></html>
