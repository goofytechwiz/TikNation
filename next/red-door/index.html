<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080608">
<title>THE RED DOOR — TikNation Gift Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080608;color:#f4ece8;font-family:Georgia,serif}
#world{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#322326 0,#191519 38%,#08080b 78%);perspective:900px}
#floor{position:absolute;left:-20%;right:-20%;bottom:-14%;height:48%;transform:rotateX(65deg);transform-origin:bottom;background:repeating-linear-gradient(90deg,#191418 0 2px,#282025 3px 95px),repeating-linear-gradient(0deg,transparent 0 72px,#09090c 73px 76px);box-shadow:0 -20px 60px #000}
#hall{position:absolute;inset:0;background:linear-gradient(90deg,#08080b 0,#242027 16%,#151319 50%,#242027 84%,#08080b 100%);clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);opacity:.8}
#doorFrame{position:absolute;left:50%;top:9%;height:69%;width:min(47vw,380px);transform:translateX(-50%);background:linear-gradient(90deg,#09080a,#4b3735 8%,#171115 17%,#09080b 90%);padding:15px 15px 0;box-shadow:0 0 65px #000,0 0 90px #8d1c2b22;transition:filter .6s}
#door{position:relative;width:100%;height:100%;transform-origin:left center;transform-style:preserve-3d;background:linear-gradient(90deg,#260e16,#541b27 18%,#2d101a 48%,#170c12 100%);border:9px solid #24151a;box-shadow:inset 0 0 0 3px #95636a55,inset 0 0 40px #000b,12px 0 25px #000;transition:transform 1.45s cubic-bezier(.2,.7,.1,1)}
#door:before{content:"";position:absolute;inset:8% 10%;border:5px solid #170c12;box-shadow:inset 0 0 0 2px #8a555a66}
#door:after{content:"";position:absolute;left:50%;top:12%;bottom:12%;width:4px;background:#130a0e;box-shadow:0 0 0 2px #a76a7040}
.panel{position:absolute;left:13%;right:13%;height:28%;border:5px solid #160b10;box-shadow:inset 0 0 0 2px #8c545d55,inset 0 0 20px #0008}
.panel.one{top:16%}.panel.two{bottom:16%}
#knob{position:absolute;right:13%;top:49%;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4d99d,#956b37 48%,#24160e);box-shadow:0 0 13px #d6a35a88}
#under{position:absolute;z-index:2;left:50%;bottom:22%;width:42%;height:4px;transform:translateX(-50%);background:#000;box-shadow:0 0 0 #000;transition:all .7s}
#glow{position:absolute;z-index:1;left:50%;bottom:20%;width:0;height:55%;transform:translateX(-50%);background:linear-gradient(0deg,#e3273b99,#c51d3233 55%,transparent);filter:blur(22px);opacity:0;transition:all 1.1s}
#shadow{position:absolute;z-index:3;left:50%;bottom:19%;width:0;height:0;transform:translateX(-50%);background:#050407;clip-path:polygon(42% 0,58% 0,70% 17%,78% 30%,100% 100%,0 100%,22% 30%,30% 17%);filter:blur(3px);opacity:0;transition:all 1.2s}
#dust{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 25% 40%,#d7a9a522 0 1px,transparent 2px),radial-gradient(circle at 74% 60%,#d7a9a522 0 1px,transparent 2px);background-size:67px 83px;opacity:.45}
#blackout{position:absolute;z-index:8;inset:0;background:#020203;opacity:0;pointer-events:none;transition:opacity .7s}
header,footer{position:fixed;z-index:10;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;font:800 10px Arial,sans-serif;letter-spacing:.2em;color:#e4d6d3}
footer{bottom:0;justify-content:center;color:#aa9999;font-size:9px}
.pill{border:1px solid #ffffff35;border-radius:30px;padding:8px 12px;background:#080608aa}
.controls{position:fixed;z-index:11;left:50%;bottom:8%;transform:translateX(-50%);width:min(92%,560px);text-align:center;text-shadow:0 2px 20px #000}
.kicker{font:800 10px Arial,sans-serif;letter-spacing:.35em;color:#e18a91}
h1{font:900 clamp(40px,9vw,78px)/.9 Arial,sans-serif;letter-spacing:.04em;margin:10px 0}
.desc{font:700 10px Arial,sans-serif;letter-spacing:.2em;color:#d5c5c1}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:1px solid #b86b72;border-radius:30px;padding:14px 22px;background:linear-gradient(145deg,#782631,#310f19);color:#fff;font:900 11px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 30px #0009}
button.alt{background:#111015;border-color:#ffffff55}button:disabled{opacity:.5}
.note{font:9px Arial,sans-serif;color:#bcaeae;margin-top:9px;letter-spacing:.08em}
#message{position:fixed;z-index:9;left:50%;top:42%;transform:translate(-50%,-50%);font:900 clamp(30px,8vw,76px) Arial,sans-serif;letter-spacing:.16em;color:#f5d8d8;text-shadow:0 0 25px #d32140;opacity:0;white-space:nowrap}
#world.open #door{transform:rotateY(-72deg)}#world.open #glow{width:55%;opacity:1}#world.open #under{width:48%;box-shadow:0 0 45px 16px #d6203b88}#world.open #shadow{width:27%;height:55%;opacity:.95}
@media(max-width:600px){#doorFrame{width:68vw;height:57%;top:12%}.controls{bottom:8%}header{padding:13px;font-size:8px}.light{display:none}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style></head>
<body>
<div id="world"><div id="hall"></div><div id="floor"></div><div id="doorFrame"><div id="door"><div class="panel one"></div><div class="panel two"></div><div id="knob"></div></div></div><div id="glow"></div><div id="under"></div><div id="shadow"></div><div id="dust"></div><div id="message">DON'T LOOK BACK</div><div id="blackout"></div></div>
<header><span>TIKNATION / GIFT PREVIEW</span><span class="pill" id="status">WAITING</span></header>
<section class="controls"><div class="kicker">SOME DOORS SHOULD STAY CLOSED</div><h1>THE RED DOOR</h1><div class="desc">A HAUNTING CINEMATIC GIFT EXPERIENCE</div><div class="actions"><button id="trigger">Knock three times</button><button class="alt" id="sound">Test the knock</button></div><div class="note">Sound starts after tapping · No autoplay · Preview only</div></section>
<footer>NEW GIFT CONCEPT · NOT IN THE LIVE CATALOG</footer>
<div id="blackout"></div>
<script>
(()=>{const world=document.getElementById('world'),status=document.getElementById('status'),trigger=document.getElementById('trigger'),message=document.getElementById('message'),blackout=document.getElementById('blackout');let audio=null,busy=false;
function ctx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function knock(){try{const a=ctx(),t=a.currentTime;const o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type='triangle';o.frequency.setValueAtTime(105,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);f.type='lowpass';f.frequency.value=360;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.7,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(f).connect(g).connect(a.destination);o.start(t);o.stop(t+.21);const b=a.createOscillator(),bg=a.createGain();b.type='sine';b.frequency.value=54;bg.gain.setValueAtTime(.001,t);bg.gain.exponentialRampToValueAtTime(.35,t+.01);bg.gain.exponentialRampToValueAtTime(.001,t+.16);b.connect(bg).connect(a.destination);b.start(t);b.stop(t+.17)}catch(e){status.textContent='AUDIO UNAVAILABLE'}}
function run(){if(busy)return;busy=true;ctx();trigger.disabled=true;status.textContent='THREE KNOCKS';world.classList.remove('open');message.style.opacity=0;blackout.style.opacity=0;let i=0;const hit=()=>{knock();i++;if(i<3)setTimeout(hit,520);else setTimeout(openDoor,800)};hit()}
function openDoor(){status.textContent='IT IS OPENING';world.classList.add('open');setTimeout(()=>{message.style.opacity=1;status.textContent='SOMETHING IS THERE'},1100);setTimeout(()=>{blackout.style.opacity=1;status.textContent='SIGNAL LOST'},2900);setTimeout(()=>{blackout.style.opacity=0;world.classList.remove('open');message.style.opacity=0;status.textContent='WAITING';trigger.disabled=false;busy=false},3900)}
trigger.addEventListener('click',run);document.getElementById('sound').addEventListener('click',()=>{knock();status.textContent='KNOCK TEST'});})();
</script></body></html>
