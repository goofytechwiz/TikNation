name: TikNation community controls checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/community-controls-magic-layout]

permissions:
  contents: read

jobs:
  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every tracked Edge Function
        run: |
          set -euo pipefail
          mapfile -t functions < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -type f | sort)
          if [ "${#functions[@]}" -eq 0 ]; then
            echo "No Edge Function entrypoints found."
            exit 1
          fi
          # Continue after failures so every function is checked and the full failure list is visible.
          failed=0
          for function in "${functions[@]}"; do
            echo "Type-checking ${function}"
            if ! deno check "${function}"; then
              failed=1
            fi
          done
          exit "$failed"
  browser-script-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript in every HTML and JS file
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          class InlineScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.blocks = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attributes = dict(attrs)
                      script_type = (attributes.get("type") or "").split(";")[0].strip().lower()
                      is_javascript = not script_type or script_type in {
                          "module", "text/javascript", "application/javascript"
                      }
                      self.current = [] if "src" not in attributes and is_javascript else None

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      source = "".join(self.current).strip()
                      if source:
                          self.blocks.append(source)
                      self.current = None

          out = Path("/tmp/tiknation-inline-scripts")
          out.mkdir(exist_ok=True)
          checked = []
          html_pages = [
              page for page in Path(".").rglob("*.html")
              if not any(part.startswith(".") or part in {"node_modules", "vendor"} for part in page.parts)
          ]
          for page in html_pages:
              parser = InlineScriptParser()
              parser.feed(page.read_text(encoding="utf-8"))
              for index, source in enumerate(parser.blocks):
                  path = out / f"{page.as_posix().replace('/', '_')}-{index}.js"
                  path.write_text(source, encoding="utf-8")
                  checked.append(path)

          checked.extend(
              path for path in Path(".").rglob("*.js")
              if not any(part.startswith(".") or part in {"node_modules", "vendor"} for part in path.parts)
          )
          if not checked:
              raise SystemExit("No JavaScript files found to check.")
          for path in checked:
              print(f"Checking {path}")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"JavaScript syntax passed for {len(checked)} files across {len(html_pages)} HTML pages.")
          PY

            printf '%s\n' "${functions[@]}" | grep '/tiknation-live/index.ts

