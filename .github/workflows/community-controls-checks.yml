name: TikNation community controls checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/community-controls-magic-layout]

permissions:
  contents: read

jobs:
  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Live Edge Function
        run: deno check supabase/functions/tiknation-live/index.ts
      - name: Type-check community notification Edge Function
        run: deno check supabase/functions/tiknation-community-notifications/index.ts
  browser-script-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          class InlineScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.blocks = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attributes = dict(attrs)
                      self.current = [] if "src" not in attributes else None

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      source = "".join(self.current).strip()
                      if source:
                          self.blocks.append(source)
                      self.current = None

          out = Path("/tmp/tiknation-inline-scripts")
          out.mkdir(exist_ok=True)
          checked = []
          for page in (Path("index.html"), Path("live.html")):
              parser = InlineScriptParser()
              parser.feed(page.read_text(encoding="utf-8"))
              for index, source in enumerate(parser.blocks):
                  path = out / f"{page.stem}-{index}.js"
                  path.write_text(source, encoding="utf-8")
                  checked.append(path)

          checked.extend(Path(".").glob("*.js"))
          if not checked:
              raise SystemExit("No JavaScript files found to check.")
          for path in checked:
              print(f"Checking {path}")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"JavaScript syntax passed for {len(checked)} files.")
          PY
