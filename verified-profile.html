<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikNation — Verified Profile</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 0%,rgba(0,200,255,.12),transparent 35%),
        linear-gradient(180deg,#07070d,#0b0b14);
}

.container{
    width:min(700px,92%);
    margin:60px auto;
}

.profile{
    padding:35px;
    border-radius:28px;
    background:rgba(20,20,35,.75);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 70px rgba(0,0,0,.45);
}

.avatar{
    width:100px;
    height:100px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    font-weight:900;
    background:linear-gradient(135deg,#8d63ff,#00c8ff);
    margin-bottom:20px;
}

h1{
    margin:0 0 8px;
    font-size:34px;
}

.username{
    color:#9999aa;
    margin-bottom:20px;
}

.verification-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin:4px 0 18px;
    padding:9px 15px;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
}

.founder{
    color:#ffd84d;
    background:rgba(255,216,77,.09);
    border:1px solid rgba(255,216,77,.35);
    box-shadow:0 0 25px rgba(255,216,77,.1);
}

.verified{
    color:#55d9ff;
    background:rgba(0,200,255,.09);
    border:1px solid rgba(0,200,255,.35);
    box-shadow:0 0 25px rgba(0,200,255,.1);
}

.bio{
    color:#aaaabb;
    line-height:1.6;
}

.status{
    margin-top:25px;
    padding:18px;
    border-radius:18px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
}

.back{
    display:inline-block;
    margin-top:25px;
    color:#55d9ff;
    text-decoration:none;
}

.error{
    color:#ff6b7a;
}
</style>
</head>

<body>

<div class="container">
    <div class="profile" id="profile">
        Loading profile...
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://mekzfezaefcimxncklfj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Cr0ssF3pEz5lE08KwvyacQ_dKC2IUbQ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


async function loadVerifiedProfile(){

    const params =
        new URLSearchParams(window.location.search);

    const username =
        params.get("username") || "TikNationStudio";

    const container =
        document.getElementById("profile");

    const { data, error } =
        await supabaseClient
            .from("verification_applications")
            .select("username,category,presence,reason,status")
            .eq("username",username)
            .eq("status","verified")
            .order("created_at",{ascending:false})
            .limit(1)
            .maybeSingle();

    if(error){

        console.error(error);

        container.innerHTML = `
            <h1>Profile Error</h1>
            <p class="error">
                Unable to load this profile.
            </p>
        `;

        return;
    }

    if(!data){

        container.innerHTML = `
            <h1>Profile Not Verified</h1>
            <p class="bio">
                This creator does not currently have an approved verification record.
            </p>

            <a class="back" href="index.html">
                ← Back to TikNation
            </a>
        `;

        return;
    }

    const initial =
        username.charAt(0).toUpperCase();

    let badge = "";

    if(username === "TikNationStudio"){

        badge = `
            <div class="verification-badge founder">
                🟡 FOUNDER MARK
            </div>
        `;

    }else{

        badge = `
            <div class="verification-badge verified">
                🔵 VERIFIED CREATOR
            </div>
        `;
    }

    container.innerHTML = `

        <div class="avatar">
            ${initial}
        </div>

        <h1>
            ${username}
        </h1>

        ${badge}

        <div class="username">
            @${username}
        </div>

        <p class="bio">
            ${data.presence || "TikNation creator."}
        </p>

        <div class="status">

            <strong>
                Verification Status
            </strong>

            <p class="bio">
                ✓ Verified by TikNation
            </p>

            <p class="bio">
                Category: ${data.category || "Creator"}
            </p>

        </div>

        <a class="back" href="index.html">
            ← Back to TikNation
        </a>

    `;
}


loadVerifiedProfile();

</script>

</body>
</html>
