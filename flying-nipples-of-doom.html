<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flying Nipples of Doom — TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100516;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.hud{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(16px,4vh,34px) 14px calc(18px + env(safe-area-inset-bottom));pointer-events:none;text-align:center}
.brand{font-size:clamp(22px,6vw,42px);line-height:1;font-weight:1000;letter-spacing:.045em;color:#fff1e9;text-shadow:0 3px 0 #7e164c,0 0 14px #ff3e78,0 0 34px #ff6a32}
.sub{margin-top:9px;font-size:10px;letter-spacing:.28em;color:#ffc5d4}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;pointer-events:auto}
button{border:2px solid #ff9cb8;background:linear-gradient(180deg,#632044,#270d2d);color:white;border-radius:999px;padding:13px 19px;font-weight:950;letter-spacing:.08em;box-shadow:0 5px 0 #16091c,0 0 24px #ff367c77}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #16091c}
.hint{margin-top:12px;font-size:10px;letter-spacing:.13em;color:#f8c8d7}
</style></head>
<body><canvas id="scene"></canvas><div class="hud"><div><div class="brand">THE FLYING NIPPLES<br>OF DOOM</div><div class="sub">TIKNATION • CHAOS CLASS: LEGENDARY</div></div><div><div class="controls"><button id="sound">SOUND: OFF</button><button id="launch">RELEASE THE DOOM</button></div><div class="hint">TWO WINGED MENACES. ZERO GOOD INTENTIONS.</div></div></div>
<script>
(()=> {
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
let W=0,H=0,D=1,time=0,last=0,attackStart=-1,shots=[],bits=[],audio=null,soundOn=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function background(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#160821');g.addColorStop(.55,'#42102e');g.addColorStop(1,'#100817');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 glow(W*.5,H*.53,Math.max(W,H)*.58,'rgba(255,38,111,.23)');
 for(let i=0;i<75;i++){let x=(i*197.3+time*.012*(i%3+1))%W,y=(i*113.7)%H;ctx.fillStyle='rgba(255,220,235,'+(.25+(i%4)*.13)+')';ctx.fillRect(x,y,1.5,1.5)}
 // distant comic-book storm rings
 ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='#ff8bb4';ctx.lineWidth=2;
 for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(W/2,H*.53,Math.min(W,H)*(.25+i*.11),Math.min(W,H)*(.12+i*.07),-.12,0,Math.PI*2);ctx.stroke()}ctx.restore();
}
function wing(x,y,s,side,flap){
 ctx.save();ctx.translate(x,y);ctx.scale(side,1);ctx.rotate(flap);
 ctx.fillStyle='#35102f';ctx.strokeStyle='#ff739b';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*.18,-s*.78,s*.95,-s*.7);ctx.quadraticCurveTo(s*.82,-s*.17,s*.58,s*.12);ctx.quadraticCurveTo(s*.27,s*.28,0,0);ctx.fill();ctx.stroke();
 ctx.strokeStyle='#a83c70';ctx.lineWidth=2;
 for(let i=1;i<=3;i++){ctx.beginPath();ctx.moveTo(s*.08,0);ctx.quadraticCurveTo(s*.38,-s*(.2+i*.12),s*(.9-i*.1),-s*(.68-i*.13));ctx.stroke()}
 ctx.restore();
}
function monster(x,y,r,side,idx){
 const bob=Math.sin(time*.0028+idx*2.1)*r*.075;
 const flap=Math.sin(time*.018+idx*1.7)*.58;
 ctx.save();ctx.translate(x,y+bob);
 // Wide leathery wings attached to the sides of the pink flying character.
 wing(-r*.63,-r*.08,r*1.03,-1,flap);
 wing(r*.63,-r*.08,r*1.03,1,-flap);
 glow(0,r*.76,r*1.02,'rgba(0,0,0,.42)');
 // Distinct soft, heart-ish silhouette with a broad rounded lower edge.
 const body=ctx.createRadialGradient(-r*.34,-r*.48,r*.025,0,0,r*1.16);
 body.addColorStop(0,'#fff0e5');
 body.addColorStop(.19,idx?'#ffc4b8':'#ffd0dc');
 body.addColorStop(.52,idx?'#f69a9f':'#f59ab6');
 body.addColorStop(.83,idx?'#d85b7d':'#d65c89');
 body.addColorStop(1,'#762044');
 ctx.fillStyle=body;ctx.beginPath();
 ctx.moveTo(0,-r*.84);
 ctx.bezierCurveTo(r*.52,-r*.98,r*.98,-r*.52,r*.91,r*.08);
 ctx.bezierCurveTo(r*.87,r*.72,r*.42,r*.99,0,r*.96);
 ctx.bezierCurveTo(-r*.42,r*.99,-r*.87,r*.72,-r*.91,r*.08);
 ctx.bezierCurveTo(-r*.98,-r*.52,-r*.52,-r*.98,0,-r*.84);
 ctx.closePath();ctx.fill();ctx.strokeStyle='#ffb5c7';ctx.lineWidth=3;ctx.stroke();
 // Funny little eyes sit well above the central feature.
 for(const s of [-1,1]){
  ctx.fillStyle='#fff9ed';ctx.beginPath();ctx.ellipse(s*r*.24,-r*.48,r*.105,r*.14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#32102a';ctx.beginPath();ctx.arc(s*r*.26,-r*.46,r*.052,0,Math.PI*2);ctx.fill();
 }
 // Broad, clearly visible areola: concentric warm pink rings and subtle skin shading.
 const cy=r*.13;
 ctx.save();ctx.translate(0,cy);
 const shadow=ctx.createRadialGradient(0,r*.05,r*.08,0,r*.05,r*.72);
 shadow.addColorStop(0,'rgba(100,20,54,.38)');shadow.addColorStop(1,'rgba(100,20,54,0)');
 ctx.fillStyle=shadow;ctx.beginPath();ctx.ellipse(0,r*.05,r*.7,r*.59,0,0,Math.PI*2);ctx.fill();
 const areola=ctx.createRadialGradient(-r*.12,-r*.12,r*.025,0,0,r*.59);
 areola.addColorStop(0,'#f7b5b0');areola.addColorStop(.36,'#e98796');
 areola.addColorStop(.76,'#d76582');areola.addColorStop(1,'#b8436d');
 ctx.fillStyle=areola;ctx.beginPath();ctx.ellipse(0,0,r*.59,r*.48,-.04,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,222,219,.82)';ctx.lineWidth=3;ctx.stroke();
 // Pronounced raised tip, drawn with a cast shadow and bright curved highlight.
 ctx.fillStyle='rgba(99,22,53,.28)';ctx.beginPath();ctx.ellipse(r*.035,r*.17,r*.29,r*.32,.08,0,Math.PI*2);ctx.fill();
 const tip=ctx.createRadialGradient(-r*.105,-r*.12,r*.012,0,r*.015,r*.34);
 tip.addColorStop(0,'#ffe4d7');tip.addColorStop(.32,'#ffc1b8');
 tip.addColorStop(.72,'#ef8b9b');tip.addColorStop(1,'#bd4d72');
 ctx.fillStyle=tip;ctx.beginPath();ctx.ellipse(0,r*.015,r*.285,r*.335,-.08,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#ffd2cb';ctx.lineWidth=2.5;ctx.stroke();
 ctx.strokeStyle='rgba(255,255,240,.8)';ctx.lineWidth=3;ctx.beginPath();
 ctx.arc(-r*.035,-r*.035,r*.19,Math.PI*1.12,Math.PI*1.78);ctx.stroke();
 ctx.restore();
 // A tiny mischievous smile below the eyes.
 ctx.strokeStyle='#762044';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-r*.23,r*.09,.18,Math.PI-.18);ctx.stroke();
 // Launch glow is centred exactly on the protruding tip.
 glow(0,cy+r*.34,r*.2,'rgba(255,255,190,.55)');
 ctx.restore();
}
function spawnBurst(x,y,color,n=30){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*7;bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:35+Math.random()*35,color,r:2+Math.random()*4})}}
function launch(){
 attackStart=performance.now();shots=[];
 const r=Math.min(W,H)*.19,gap=Math.min(W,H)*.23,y=H*.52;
 for(let side of [-1,1])shots.push({x:W/2+side*gap,y:y+r*.47,vx:side*.9,vy:7,life:1,side});
 spawnBurst(W/2,H*.25,'#ffdc8c',38);if(soundOn)blastSound();
}
function drawShots(){
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx;s.y+=s.vy;s.life-=.012;
  ctx.save();ctx.globalCompositeOperation='lighter';glow(s.x,s.y,40,'rgba(66,255,174,.65)');
  const g=ctx.createRadialGradient(s.x-5,s.y-7,1,s.x,s.y,18);g.addColorStop(0,'#fff');g.addColorStop(.3,'#caffdf');g.addColorStop(.7,'#35ffad');g.addColorStop(1,'rgba(0,210,120,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,19,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(183,255,218,.8)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(s.x,s.y-10);ctx.lineTo(s.x-s.vx*3,s.y-50);ctx.stroke();ctx.restore();
  if(s.y>H*.82||s.life<=0){spawnBurst(s.x,s.y,'#70ffc0',26);shots.splice(i,1)}
 }
}
function frame(now){const dt=Math.min(40,now-last||16);last=now;time+=dt;background();
 const r=Math.min(W,H)*.18,gap=Math.min(W,H)*.235,enter=attackStart<0?0:clamp((now-attackStart)/550,0,1),ease=1-Math.pow(1-enter,3);
 const bob=Math.sin(time*.002)*8;
 monster(W/2-gap*ease,H*.52+bob,r, -1,0);monster(W/2+gap*ease,H*.52-bob,r,1,1);
 if(attackStart>=0&&now-attackStart>900&&now-attackStart<2900&&shots.length===0&&now-attackStart<1150){
  for(let side of [-1,1])shots.push({x:W/2+side*gap,y:H*.52+r*.47,vx:side*.9,vy:7,life:1,side});
 }
 drawShots();
 for(let i=bits.length-1;i>=0;i--){let b=bits[i];b.x+=b.vx;b.y+=b.vy;b.vx*=.98;b.vy=b.vy*.98+.12;b.life--;ctx.globalAlpha=Math.max(0,b.life/60);ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();if(b.life<=0)bits.splice(i,1)}
 ctx.globalAlpha=1;
 if(attackStart>=0&&now-attackStart>3400){attackStart=-1;shots=[]}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function enableSound(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();audio.resume();soundOn=true;document.getElementById('sound').textContent='SOUND: ON'}
function blastSound(){if(!audio)return;const now=audio.currentTime;
 const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(170,now);osc.frequency.exponentialRampToValueAtTime(38,now+.48);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.3,now+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+.58);osc.connect(gain).connect(audio.destination);osc.start(now);osc.stop(now+.6);
 const n=Math.floor(audio.sampleRate*.22),buf=audio.createBuffer(1,n,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);
 const src=audio.createBufferSource(),filter=audio.createBiquadFilter(),g=audio.createGain();src.buffer=buf;filter.type='lowpass';filter.frequency.value=1100;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.22,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+.24);src.connect(filter).connect(g).connect(audio.destination);src.start(now)}
document.getElementById('sound').addEventListener('click',enableSound);
document.getElementById('launch').addEventListener('click',launch);
})();
</script></body></html>
