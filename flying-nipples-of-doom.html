<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flying Nipples of Doom — TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100516;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.hud{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(16px,4vh,34px) 14px calc(18px + env(safe-area-inset-bottom));pointer-events:none;text-align:center}
.brand{font-size:clamp(22px,6vw,42px);line-height:1;font-weight:1000;letter-spacing:.045em;color:#fff1e9;text-shadow:0 3px 0 #7e164c,0 0 14px #ff3e78,0 0 34px #ff6a32}
.sub{margin-top:9px;font-size:10px;letter-spacing:.28em;color:#ffc5d4}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;pointer-events:auto}
button{border:2px solid #ff9cb8;background:linear-gradient(180deg,#632044,#270d2d);color:white;border-radius:999px;padding:13px 19px;font-weight:950;letter-spacing:.08em;box-shadow:0 5px 0 #16091c,0 0 24px #ff367c77}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #16091c}
.hint{margin-top:12px;font-size:10px;letter-spacing:.13em;color:#f8c8d7}
</style></head>
<body><canvas id="scene"></canvas><div class="hud"><div><div class="brand">THE FLYING NIPPLES<br>OF DOOM</div><div class="sub">TIKNATION • CHAOS CLASS: LEGENDARY</div></div><div><div class="controls"><button id="sound">SOUND: OFF</button><button id="launch">RELEASE THE DOOM</button></div><div class="hint">TWO WINGED MENACES. ZERO GOOD INTENTIONS.</div></div></div>
<script>
(()=> {
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
let W=0,H=0,D=1,time=0,last=0,attackStart=-1,shots=[],bits=[],audio=null,soundOn=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();
function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function background(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#160821');g.addColorStop(.55,'#42102e');g.addColorStop(1,'#100817');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 glow(W*.5,H*.53,Math.max(W,H)*.58,'rgba(255,38,111,.23)');
 for(let i=0;i<75;i++){let x=(i*197.3+time*.012*(i%3+1))%W,y=(i*113.7)%H;ctx.fillStyle='rgba(255,220,235,'+(.25+(i%4)*.13)+')';ctx.fillRect(x,y,1.5,1.5)}
 // distant comic-book storm rings
 ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle='#ff8bb4';ctx.lineWidth=2;
 for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(W/2,H*.53,Math.min(W,H)*(.25+i*.11),Math.min(W,H)*(.12+i*.07),-.12,0,Math.PI*2);ctx.stroke()}ctx.restore();
}
function wing(x,y,s,side,flap){
 ctx.save();ctx.translate(x,y);ctx.scale(side,1);ctx.rotate(flap);
 // Thick, jointed bat wing with a leathery membrane and curved finger bones.
 const membrane=ctx.createLinearGradient(0,-s*.65,0,s*.3);
 membrane.addColorStop(0,'#6f2948');membrane.addColorStop(.55,'#35152f');membrane.addColorStop(1,'#1b1024');
 ctx.fillStyle=membrane;ctx.strokeStyle='#bd6680';ctx.lineWidth=2.4;
 ctx.beginPath();ctx.moveTo(0,0);
 ctx.quadraticCurveTo(s*.16,-s*.48,s*.27,-s*.78);
 ctx.quadraticCurveTo(s*.42,-s*.69,s*.48,-s*.36);
 ctx.quadraticCurveTo(s*.72,-s*.72,s*.91,-s*.69);
 ctx.quadraticCurveTo(s*.88,-s*.27,s*.72,-s*.08);
 ctx.quadraticCurveTo(s*.83,s*.16,s*.56,s*.23);
 ctx.quadraticCurveTo(s*.32,s*.2,0,0);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.strokeStyle='rgba(226,139,158,.72)';ctx.lineWidth=Math.max(1.4,s*.018);
 const fingers=[[.27,-.76],[.48,-.35],[.91,-.67],[.72,-.08],[.56,.2]];
 for(const p of fingers){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*.18,-s*.15,s*p[0],s*p[1]);ctx.stroke()}
 ctx.strokeStyle='rgba(255,205,208,.16)';ctx.lineWidth=1;
 for(let i=0;i<8;i++){const xx=s*(.16+i*.085);ctx.beginPath();ctx.moveTo(xx,-s*.08);ctx.quadraticCurveTo(xx+s*.1,-s*.23,xx+s*.18,-s*.4);ctx.stroke()}
 ctx.restore();
}
function monster(x,y,r,side,idx){
 const bob=Math.sin(time*.0028+idx*2.1)*r*.035,flap=Math.sin(time*.018+idx*1.7)*.24;
 ctx.save();ctx.translate(x,y+bob);
 wing(-r*.67,-r*.08,r*1.12,-1,flap);wing(r*.67,-r*.08,r*1.12,1,-flap);
 // A sculpted practical-effects creature prop: irregular silhouette, layered flesh tones,
 // soft subsurface glow and hand-finished surface texture. No face or cartoon features.
 glow(0,r*.7,r*1.12,'rgba(0,0,0,.62)');
 ctx.save();ctx.shadowColor='rgba(0,0,0,.62)';ctx.shadowBlur=r*.28;ctx.shadowOffsetY=r*.16;
 const flesh=ctx.createRadialGradient(-r*.34,-r*.48,r*.025,r*.02,r*.08,r*1.16);
 flesh.addColorStop(0,'#ffe4d6');flesh.addColorStop(.18,idx?'#efb8a9':'#f3b7ad');
 flesh.addColorStop(.43,idx?'#d9918e':'#df9998');flesh.addColorStop(.72,'#b96a78');flesh.addColorStop(1,'#542238');
 ctx.fillStyle=flesh;ctx.beginPath();
 ctx.moveTo(-r*.72,-r*.47);
 ctx.bezierCurveTo(-r*.5,-r*.91,r*.36,-r*.96,r*.72,-r*.49);
 ctx.bezierCurveTo(r*.99,-r*.13,r*.84,r*.55,r*.48,r*.79);
 ctx.bezierCurveTo(r*.17,r*.99,-r*.33,r*.91,-r*.62,r*.65);
 ctx.bezierCurveTo(-r*.95,r*.35,-r*.99,-r*.12,-r*.72,-r*.47);ctx.closePath();ctx.fill();
 ctx.restore();
 // Subtle mottling, pores and fine creases follow the uneven sculpted surface.
 ctx.save();ctx.beginPath();ctx.ellipse(0,0,r*.86,r*.91,0,0,Math.PI*2);ctx.clip();
 for(let i=0;i<250;i++){
  const a=i*2.39996,rad=Math.sqrt((i*53%251)/251)*r*.79;
  const px=Math.cos(a)*rad,py=Math.sin(a)*rad;
  ctx.fillStyle=i%4===0?'rgba(255,235,219,.13)':'rgba(94,31,52,.09)';
  ctx.beginPath();ctx.ellipse(px,py,1+(i%3)*.5,.7+(i%4)*.28,a,.0,Math.PI*2);ctx.fill();
 }
 for(let i=0;i<13;i++){
  const a=i*2.4,rr=r*(.47+(i%3)*.07);
  ctx.strokeStyle='rgba(104,37,59,.14)';ctx.lineWidth=1.1;
  ctx.beginPath();ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
  ctx.quadraticCurveTo(Math.cos(a+.13)*(rr-r*.045),Math.sin(a+.13)*(rr-r*.045),Math.cos(a+.2)*(rr-r*.08),Math.sin(a+.2)*(rr-r*.08));ctx.stroke();
 }
 const softLight=ctx.createRadialGradient(-r*.38,-r*.5,0,-r*.22,-r*.25,r*.88);
 softLight.addColorStop(0,'rgba(255,249,232,.35)');softLight.addColorStop(1,'rgba(255,249,232,0)');
 ctx.fillStyle=softLight;ctx.fillRect(-r,-r,r*2,r*2);ctx.restore();
 // Broad, softly blended central disk with natural variation rather than graphic rings.
 const cy=r*.08;
 ctx.save();ctx.translate(0,cy);
 const halo=ctx.createRadialGradient(0,0,r*.13,0,0,r*.64);
 halo.addColorStop(0,'rgba(116,35,62,.04)');halo.addColorStop(.7,'rgba(132,43,68,.25)');halo.addColorStop(1,'rgba(91,26,48,0)');
 ctx.fillStyle=halo;ctx.beginPath();ctx.ellipse(0,0,r*.64,r*.55,-.04,0,Math.PI*2);ctx.fill();
 const disk=ctx.createRadialGradient(-r*.17,-r*.2,r*.02,0,0,r*.52);
 disk.addColorStop(0,'#f1c0ad');disk.addColorStop(.3,'#d9948e');disk.addColorStop(.7,'#c77a82');disk.addColorStop(1,'#a64e68');
 ctx.fillStyle=disk;ctx.beginPath();ctx.ellipse(0,0,r*.49,r*.405,-.07,0,Math.PI*2);ctx.fill();
 for(let i=0;i<48;i++){
  const a=i*2.39996,rr=r*(.18+(i%7)*.034);
  ctx.strokeStyle=i%2?'rgba(255,226,208,.18)':'rgba(92,29,51,.13)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr*.82);
  ctx.quadraticCurveTo(Math.cos(a+.08)*(rr+r*.025),Math.sin(a+.08)*(rr+r*.025)*.82,Math.cos(a+.14)*(rr+r*.055),Math.sin(a+.14)*(rr+r*.055)*.82);ctx.stroke();
 }
 // Raised central tip: layered contour, contact shadow and a moist-looking specular highlight.
 ctx.fillStyle='rgba(75,20,43,.29)';ctx.beginPath();ctx.ellipse(r*.025,r*.12,r*.215,r*.24,.06,0,Math.PI*2);ctx.fill();
 const tip=ctx.createRadialGradient(-r*.09,-r*.12,r*.012,0,r*.025,r*.27);
 tip.addColorStop(0,'#ffe6d7');tip.addColorStop(.28,'#efb9a9');tip.addColorStop(.68,'#d88989');tip.addColorStop(1,'#a64d67');
 ctx.fillStyle=tip;ctx.beginPath();ctx.ellipse(0,r*.02,r*.205,r*.25,-.08,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,239,221,.58)';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(-r*.035,-r*.04,r*.15,Math.PI*1.12,Math.PI*1.78);ctx.stroke();
 ctx.restore();
 // Clearly side-facing cannon: long barrel visibly sticks out horizontally.
 ctx.save();ctx.translate(0,cy+r*.015);ctx.rotate(idx===0?-Math.PI/2:Math.PI/2);
 const mount=ctx.createRadialGradient(-r*.025,-r*.04,1,0,0,r*.23);
 mount.addColorStop(0,'#f4d4c0');mount.addColorStop(.58,'#8b5260');mount.addColorStop(1,'#3a1c31');
 ctx.fillStyle=mount;ctx.beginPath();ctx.ellipse(0,0,r*.235,r*.205,0,0,Math.PI*2);ctx.fill();
 const metal=ctx.createLinearGradient(-r*.12,-r*.18,r*.12,-r*.18);
 metal.addColorStop(0,'#fff0c7');metal.addColorStop(.2,'#b8c4c9');metal.addColorStop(.48,'#596b7a');metal.addColorStop(.72,'#d2d8d3');metal.addColorStop(1,'#34404e');
 // Long, narrow barrel runs outward along the rotated local negative-Y axis.
 ctx.fillStyle=metal;ctx.beginPath();
 ctx.moveTo(-r*.105,-r*.07);ctx.lineTo(-r*.105,-r*.285);
 ctx.quadraticCurveTo(-r*.105,-r*.325,0,-r*.325);
 ctx.quadraticCurveTo(r*.105,-r*.325,r*.105,-r*.285);
 ctx.lineTo(r*.105,-r*.07);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#f4e4c7';ctx.lineWidth=2;
 ctx.beginPath();ctx.ellipse(0,-r*.285,r*.112,r*.055,0,0,Math.PI*2);ctx.stroke();
 const muzzle=ctx.createRadialGradient(-r*.02,-r*.30,1,0,-r*.285,r*.105);
 muzzle.addColorStop(0,'#020711');muzzle.addColorStop(.72,'#17202c');muzzle.addColorStop(1,'#75838a');
 ctx.fillStyle=muzzle;ctx.beginPath();ctx.ellipse(0,-r*.285,r*.085,r*.043,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.8;
 ctx.beginPath();ctx.ellipse(0,-r*.285,r*.112,r*.055,0,Math.PI*1.05,Math.PI*1.9);ctx.stroke();
 ctx.restore();
 // Rim lighting and small wing-root folds visually seat the wings into the body.
 ctx.strokeStyle='rgba(255,190,187,.38)';ctx.lineWidth=2.2;ctx.beginPath();ctx.ellipse(0,0,r*.83,r*.89,0,-2.35,-.72);ctx.stroke();
 ctx.restore();
}
function spawnBurst(x,y,color,n=30){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*7;bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:35+Math.random()*35,color,r:2+Math.random()*4})}}
function launch(){
 attackStart=performance.now();shots=[];
 const r=Math.min(W,H)*.19,gap=Math.min(W,H)*.17,y=H*.52;
 for(let side of [-1,1])shots.push({x:W/2+side*gap,y:y+r*.08,vx:side*.9,vy:7,life:1,side});
 spawnBurst(W/2,H*.25,'#ffdc8c',38);if(soundOn){cannonSound(0);cannonSound(145);}
}
function drawShots(){
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx;s.y+=s.vy;s.life-=.012;
  ctx.save();ctx.globalCompositeOperation='lighter';glow(s.x,s.y,40,'rgba(66,255,174,.65)');
  const g=ctx.createRadialGradient(s.x-5,s.y-7,1,s.x,s.y,18);g.addColorStop(0,'#fff');g.addColorStop(.3,'#caffdf');g.addColorStop(.7,'#35ffad');g.addColorStop(1,'rgba(0,210,120,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,19,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(183,255,218,.8)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(s.x,s.y-10);ctx.lineTo(s.x-s.vx*3,s.y-50);ctx.stroke();ctx.restore();
  if(s.y>H*.82||s.life<=0){spawnBurst(s.x,s.y,'#70ffc0',26);shots.splice(i,1)}
 }
}
function frame(now){const dt=Math.min(40,now-last||16);last=now;time+=dt;background();
 const r=Math.min(W,H)*.18,gap=Math.min(W,H)*.17,enter=attackStart<0?1:clamp((now-attackStart)/550,0,1),ease=1-Math.pow(1-enter,3);
 const bob=Math.sin(time*.002)*8;
 monster(W/2-gap*ease,H*.52+bob,r, -1,0);monster(W/2+gap*ease,H*.52-bob,r,1,1);
 if(attackStart>=0&&now-attackStart>900&&now-attackStart<2900&&shots.length===0&&now-attackStart<1150){
  for(let side of [-1,1])shots.push({x:W/2+side*gap,y:H*.52+r*.08,vx:side*.9,vy:7,life:1,side});
 }
 drawShots();
 for(let i=bits.length-1;i>=0;i--){let b=bits[i];b.x+=b.vx;b.y+=b.vy;b.vx*=.98;b.vy=b.vy*.98+.12;b.life--;ctx.globalAlpha=Math.max(0,b.life/60);ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();if(b.life<=0)bits.splice(i,1)}
 ctx.globalAlpha=1;
 if(attackStart>=0&&now-attackStart>3400){attackStart=-1;shots=[]}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function enableSound(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();audio.resume();soundOn=true;document.getElementById('sound').textContent='SOUND: ON'}
function cannonSound(delayMs=0){
 if(!audio)return;
 const t=audio.currentTime+delayMs/1000;
 // New sound design: mechanical cock, explosive crack, heavy bass impact and gritty tail.
 const master=audio.createGain();master.gain.setValueAtTime(.82,t);master.connect(audio.destination);
 function osc(type,f0,f1,dur,peak,when=0){
  const o=audio.createOscillator(),g=audio.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t+when);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+when+dur);
  g.gain.setValueAtTime(.0001,t+when);g.gain.exponentialRampToValueAtTime(peak,t+when+.003);
  g.gain.exponentialRampToValueAtTime(.0001,t+when+dur);
  o.connect(g).connect(master);o.start(t+when);o.stop(t+when+dur+.02);
 }
 function blastNoise(dur,peak,low,high,when=0){
  const n=Math.floor(audio.sampleRate*dur),b=audio.createBuffer(1,n,audio.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const src=audio.createBufferSource(),hp=audio.createBiquadFilter(),lp=audio.createBiquadFilter(),g=audio.createGain();
  src.buffer=b;hp.type='highpass';hp.frequency.setValueAtTime(low,t+when);
  lp.type='lowpass';lp.frequency.setValueAtTime(high,t+when);
  g.gain.setValueAtTime(.0001,t+when);g.gain.exponentialRampToValueAtTime(peak,t+when+.002);
  g.gain.exponentialRampToValueAtTime(.0001,t+when+dur);
  src.connect(hp).connect(lp).connect(g).connect(master);src.start(t+when);
 }
 osc('square',180,65,.045,.13);
 osc('triangle',125,42,.34,.58,.035);
 osc('sine',58,25,.48,.62,.035);
 blastNoise(.16,.52,750,9000,.038);
 blastNoise(.38,.25,55,900,.055);
 osc('sawtooth',310,52,.22,.13,.075);
 osc('square',1250,260,.065,.075,.012);
 blastNoise(.22,.09,1800,6500,.16);
 setTimeout(()=>{try{master.disconnect()}catch(e){}},900);
}
document.getElementById('sound').addEventListener('click',enableSound);
document.getElementById('launch').addEventListener('click',launch);
})();
</script></body></html>
