<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>The Flying Nipples of Doom — TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08050b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:manipulation}.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 16px calc(22px + env(safe-area-inset-bottom));text-align:center}.title{font-weight:1000;letter-spacing:.09em;font-size:clamp(23px,6vw,46px);text-shadow:0 3px 24px #f20b4c,0 0 40px #ff5c20}.sub{font-size:11px;letter-spacing:.25em;color:#ffb5c7}.controls{display:flex;gap:10px;pointer-events:auto;flex-wrap:wrap;justify-content:center}.controls button{border:1px solid #ff7997;background:#190b16;color:white;border-radius:999px;padding:13px 18px;font-weight:800;letter-spacing:.08em;box-shadow:0 0 22px #f20b4c55}.hint{font-size:10px;color:#d8aeb9;letter-spacing:.12em;margin-top:9px}
</style></head><body><canvas id="c"></canvas><div class="hud"><div><div class="title">THE FLYING NIPPLES OF DOOM</div><div class="sub">LEGENDARY CHAOS GIFT • TIKNATION</div></div><div><div class="controls"><button id="sound">ENABLE SOUND</button><button id="launch">UNLEASH DOOM</button></div><div class="hint">TAP UNLEASH DOOM TO RELIVE THE ATTACK</div></div></div>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let w,h,dpr,t=0,phase=0,last=0,particles=[],audio=null,sound=false;
function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
function burst(cx,cy,n,color){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*8;particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40+Math.random()*55,r:1+Math.random()*5,color})}}
function orb(cx,cy,r,ang){x.save();x.translate(cx,cy);x.rotate(ang); // wing flaps
for(let side of [-1,1]){x.save();x.scale(side,1);let flap=Math.sin(t*.018+side)*.34;x.rotate(flap);x.fillStyle='#4d182b';x.beginPath();x.moveTo(r*.58,-r*.15);x.quadraticCurveTo(r*1.35,-r*.95,r*1.8,-r*.42);x.quadraticCurveTo(r*1.55,r*.05,r*.68,r*.3);x.closePath();x.fill();x.strokeStyle='#a94a62';x.lineWidth=3;x.stroke();for(let k=0;k<4;k++){x.beginPath();x.moveTo(r*.75,-r*.05+k*r*.09);x.quadraticCurveTo(r*1.2,-r*.4+k*r*.1,r*1.65,-r*.38+k*r*.06);x.strokeStyle='#9e435b';x.lineWidth=1;x.stroke()}x.restore()}
let g=x.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r*1.1);g.addColorStop(0,'#e99a91');g.addColorStop(.24,'#a64d58');g.addColorStop(.58,'#54202f');g.addColorStop(.86,'#210d19');g.addColorStop(1,'#09050b');x.fillStyle=g;x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.fill();
x.save();x.globalAlpha=.3;x.strokeStyle='#f3a49a';for(let i=0;i<18;i++){let a=i*Math.PI/9;x.beginPath();x.ellipse(Math.cos(a)*r*.57,Math.sin(a)*r*.57,r*.23,r*.055,a,0,Math.PI*2);x.stroke()}x.restore();
let core=x.createRadialGradient(-r*.08,-r*.1,1,0,0,r*.42);core.addColorStop(0,'#fff3bd');core.addColorStop(.18,'#ffb34e');core.addColorStop(.5,'#e83243');core.addColorStop(1,'#3a091a');x.fillStyle=core;x.beginPath();x.arc(0,0,r*.32,0,Math.PI*2);x.fill();x.strokeStyle='#ff9a79';x.lineWidth=r*.045;x.beginPath();x.arc(0,0,r*.4,0,Math.PI*2);x.stroke();x.restore()}
function background(){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#080610');g.addColorStop(.55,'#220b20');g.addColorStop(1,'#050309');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<90;i++){let sx=(i*173.3)%w,sy=(i*97.7)%h;x.fillStyle='rgba(255,190,210,'+(0.2+((i%5)/8))+')';x.fillRect(sx,sy,1.3,1.3)}let glow=x.createRadialGradient(w/2,h*.55,5,w/2,h*.55,Math.max(w,h)*.65);glow.addColorStop(0,'rgba(180,20,62,.25)');glow.addColorStop(1,'transparent');x.fillStyle=glow;x.fillRect(0,0,w,h)}
function frame(now){let dt=Math.min(40,now-last||16);last=now;t+=dt;background();let p=phase===0?0:Math.min(1,(now-phase)/3600);if(phase){let ease=p*p*(3-2*p),r=Math.min(w,h)*(.075+ease*.24),y=h*.52+(1-ease)*-h*.2;let gap=r*.92;orb(w/2-gap,y,r,Math.sin(t*.004)*.08);orb(w/2+gap,y,r,Math.sin(t*.004+1)*-.08);if(p>.82&&p<.84){burst(w/2,h*.52,100,'#ffb45f');burst(w/2,h*.52,80,'#ff315f')}if(p>=1){phase=0;burst(w/2,h*.52,24,'#ff8c62')}}else{let r=Math.min(w,h)*.12;orb(w*.38,h*.52+Math.sin(t*.002)*15,r,Math.sin(t*.003)*.1);orb(w*.62,h*.52+Math.cos(t*.002)*15,r,-Math.sin(t*.003)*.1)}
particles=particles.filter(a=>a.life-->0);for(let a of particles){a.x+=a.vx;a.y+=a.vy;a.vx*=.985;a.vy=a.vy*.985+.04;x.globalAlpha=Math.max(0,a.life/80);x.fillStyle=a.color;x.beginPath();x.arc(a.x,a.y,a.r,0,Math.PI*2);x.fill()}x.globalAlpha=1;if(phase&&p>.78){x.fillStyle='rgba(255,220,210,'+(.35*Math.random())+')';x.fillRect(0,0,w,h)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
function enableAudio(){if(audio)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=new A();audio.resume();sound=true;document.getElementById('sound').textContent='SOUND ENABLED'}
function noise(duration,frequency,gain){if(!audio)return;let n=Math.floor(audio.sampleRate*duration),b=audio.createBuffer(1,n,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,.6);let s=audio.createBufferSource();s.buffer=b;let f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=frequency;let g=audio.createGain();g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(gain,audio.currentTime+.12);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+duration);s.connect(f).connect(g).connect(audio.destination);s.start()}
function launch(){phase=performance.now();if(!audio)return;noise(3.8,480,.34);setTimeout(()=>noise(2.3,130,.65),2300);let o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.setValueAtTime(58,audio.currentTime);o.frequency.exponentialRampToValueAtTime(24,audio.currentTime+2.7);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.42,audio.currentTime+2.3);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+3.4);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+3.5)}
document.getElementById('sound').onclick=()=>{enableAudio()};document.getElementById('launch').onclick=()=>{if(sound)launch();else{phase=performance.now();}};})();
</script></body></html>
