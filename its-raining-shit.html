<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10251e"><title>Christmas Poo Parade! — TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07140f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#315b3c 0,#173626 42%,#07140f 100%)}
.glow{position:absolute;inset:-15%;background:radial-gradient(ellipse at 50% 58%,#e8a84b33 0,transparent 42%),radial-gradient(ellipse at 15% 18%,#c52c3930 0,transparent 28%),radial-gradient(ellipse at 85% 18%,#2c9a6b35 0,transparent 30%);animation:glow 7s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.08);filter:hue-rotate(12deg)}}
.garland{position:absolute;top:-24px;left:-5%;width:110%;height:95px;border-bottom:4px solid #173d2b;border-radius:0 0 50% 50%;filter:drop-shadow(0 4px 5px #0008)}
.bulb{position:absolute;top:40px;width:12px;height:19px;border-radius:50%;background:#ffdf72;box-shadow:0 0 12px 5px #ffdf7270;animation:blink 1.3s infinite alternate}
.bulb:nth-child(2n){background:#f56b65;box-shadow:0 0 12px 5px #f56b6570;animation-delay:.4s}.bulb:nth-child(3n){background:#7de7a6;box-shadow:0 0 12px 5px #7de7a670;animation-delay:.8s}
@keyframes blink{to{opacity:.45;filter:brightness(.65)}}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;z-index:3;top:env(safe-area-inset-top,10px);left:0;right:0;text-align:center;padding:16px 12px;text-shadow:0 3px 14px #000}
.eyebrow{font-size:10px;letter-spacing:.32em;color:#ffe2a2;font-weight:900}.title{font-size:clamp(27px,7vw,48px);font-weight:1000;letter-spacing:-.045em;line-height:.98;margin:7px 0;color:#fff3d6}.sub{font-size:12px;color:#e0f3e3}
.controls{position:absolute;z-index:5;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 12px}
button{border:1px solid #fff7;border-radius:999px;padding:13px 17px;color:#fff;font-weight:900;letter-spacing:.03em;background:linear-gradient(180deg,#476d51,#1d4934);box-shadow:0 8px 24px #0008;touch-action:manipulation}
button.primary{background:linear-gradient(180deg,#d84c42,#8b211f);border-color:#ffb3a2}
.hint{position:absolute;z-index:4;bottom:83px;left:0;right:0;text-align:center;color:#fff0c8;font-size:11px;text-shadow:0 2px 6px #000}
.snow{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff9 1px,transparent 1.5px);background-size:55px 55px,83px 83px;background-position:0 0,23px 17px;opacity:.24;animation:snow 12s linear infinite}
@keyframes snow{to{background-position:0 360px,23px 377px}}
</style></head>
<body><main id="stage"><div class="glow"></div><div class="garland" id="garland"></div><canvas id="fx"></canvas><div class="snow"></div>
<div class="hud"><div class="eyebrow">TIKNATION HOLIDAY GIFT LAB</div><div class="title">IT'S RAINING<br>SHIT! 💩</div><div class="sub">A full-on brown weather event.</div></div>
<div class="hint" id="hint">Tap to unleash the storm.</div>
<div class="controls"><button id="sound">🔇 SOUND OFF</button><button class="primary" id="launch">💩 MAKE IT RAIN</button></div></main>
<script>
(()=>{const c=document.getElementById('fx'),ctx=c.getContext('2d'),hint=document.getElementById('hint'),garland=document.getElementById('garland');let w=0,h=0,dpr=1,things=[],snow=[],running=false,soundOn=false,audio=null,last=0,raf=0,mascotX=0,mascotY=0;
for(let i=0;i<22;i++){const b=document.createElement('i');b.className='bulb';b.style.left=(i*4.8+1)+'%';b.style.animationDelay=(Math.random()*1.4)+'s';garland.appendChild(b)}
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);mascotX=w*.5;mascotY=h*.55}addEventListener('resize',resize);resize();
function emoji(x,y,size,rot,alpha=1){
ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(size/54,size/54);
// A single soft, tapered, curved turd — not a pile of round lobes.
const body=ctx.createLinearGradient(-22,-18,22,22);
body.addColorStop(0,'#d49a5b');body.addColorStop(.16,'#b8783f');body.addColorStop(.42,'#8b4c27');body.addColorStop(.72,'#633018');body.addColorStop(1,'#35170d');
ctx.shadowColor='#0009';ctx.shadowBlur=7;ctx.shadowOffsetY=5;
ctx.fillStyle=body;ctx.strokeStyle='#3a1a0d';ctx.lineWidth=2.1;ctx.lineJoin='round';
ctx.beginPath();
ctx.moveTo(-23,15);
ctx.bezierCurveTo(-28,7,-24,-2,-15,-5);
ctx.bezierCurveTo(-7,-8,1,-7,6,-12);
ctx.bezierCurveTo(11,-17,8,-25,14,-29);
ctx.bezierCurveTo(21,-34,29,-28,26,-20);
ctx.bezierCurveTo(24,-12,17,-7,14,-1);
ctx.bezierCurveTo(10,8,18,14,13,22);
ctx.bezierCurveTo(7,31,-12,29,-20,22);
ctx.bezierCurveTo(-22,20,-23,18,-23,15);
ctx.closePath();ctx.fill();ctx.stroke();
ctx.shadowColor='transparent';
// Soft rounded underside and a single wet highlight following the curve.
const underside=ctx.createLinearGradient(0,5,0,29);
underside.addColorStop(0,'#55271300');underside.addColorStop(1,'#24100899');
ctx.fillStyle=underside;ctx.fill();
ctx.strokeStyle='#f4c58b99';ctx.lineWidth=3.2;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(-17,9);ctx.bezierCurveTo(-17,1,-8,-1,-1,-1);ctx.bezierCurveTo(8,-2,13,-10,17,-19);ctx.stroke();
ctx.strokeStyle='#32160c88';ctx.lineWidth=3.5;
ctx.beginPath();ctx.moveTo(15,3);ctx.quadraticCurveTo(21,11,14,17);ctx.stroke();
ctx.restore()}
function draw(t){ctx.clearRect(0,0,w,h);for(let i=0;i<snow.length;i++){const p=snow[i];p.y+=p.v;p.x+=Math.sin(t*.001+p.phase)*.25;if(p.y>h+5){p.y=-5;p.x=Math.random()*w}ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}
// Character removed: only falling turds fill the scene.
for(let i=things.length-1;i>=0;i--){const p=things[i];p.x+=p.vx;p.y+=p.vy;p.rot+=p.spin;p.vy+=.045;p.life-=.003;if(p.y>h+60||p.life<=0){things.splice(i,1);continue}emoji(p.x,p.y,p.size,p.rot,Math.min(1,p.life))}
if(running&&t-last>8000){running=false;hint.textContent='The storm has passed. For now.'}raf=requestAnimationFrame(draw)}
function chime(freq,when,duration=.32){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.09,when+.018);g.gain.exponentialRampToValueAtTime(.0001,when+duration);o.connect(g);g.connect(audio.destination);o.start(when);o.stop(when+duration)}
function jingle(){if(!audio)return;const now=audio.currentTime;[659,784,988,784,880,1047].forEach((f,i)=>chime(f,now+i*.14,.28))}
function plop(){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(125,audio.currentTime);o.frequency.exponentialRampToValueAtTime(42,audio.currentTime+.22);g.gain.setValueAtTime(.22,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.24);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.25)}
document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;if(soundOn){audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();jingle();document.getElementById('sound').textContent='🔊 SOUND ON'}else document.getElementById('sound').textContent='🔇 SOUND OFF'});
document.getElementById('launch').addEventListener('click',()=>{running=true;last=performance.now();hint.textContent="IT'S A POO-NAMI! 💩";for(let i=0;i<44;i++){things.push({x:Math.random()*w,y:-Math.random()*h*.7,size:24+Math.random()*48,vx:(Math.random()-.5)*3,vy:3+Math.random()*5,rot:Math.random()*6,spin:(Math.random()-.5)*.09,life:1})}if(soundOn){jingle();setTimeout(plop,550);setTimeout(plop,1150)}});
for(let i=0;i<95;i++)snow.push({x:Math.random()*w,y:Math.random()*h,v:.35+Math.random()*.9,r:.5+Math.random()*1.5,phase:Math.random()*6});
cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);
})();
</script></body></html>
