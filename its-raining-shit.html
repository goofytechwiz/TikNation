<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10251e"><title>Christmas Poo Parade! — TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07140f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#315b3c 0,#173626 42%,#07140f 100%)}
.glow{position:absolute;inset:-15%;background:radial-gradient(ellipse at 50% 58%,#e8a84b33 0,transparent 42%),radial-gradient(ellipse at 15% 18%,#c52c3930 0,transparent 28%),radial-gradient(ellipse at 85% 18%,#2c9a6b35 0,transparent 30%);animation:glow 7s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.08);filter:hue-rotate(12deg)}}
.garland{position:absolute;top:-24px;left:-5%;width:110%;height:95px;border-bottom:4px solid #173d2b;border-radius:0 0 50% 50%;filter:drop-shadow(0 4px 5px #0008)}
.bulb{position:absolute;top:40px;width:12px;height:19px;border-radius:50%;background:#ffdf72;box-shadow:0 0 12px 5px #ffdf7270;animation:blink 1.3s infinite alternate}
.bulb:nth-child(2n){background:#f56b65;box-shadow:0 0 12px 5px #f56b6570;animation-delay:.4s}.bulb:nth-child(3n){background:#7de7a6;box-shadow:0 0 12px 5px #7de7a670;animation-delay:.8s}
@keyframes blink{to{opacity:.45;filter:brightness(.65)}}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;z-index:3;top:env(safe-area-inset-top,10px);left:0;right:0;text-align:center;padding:16px 12px;text-shadow:0 3px 14px #000}
.eyebrow{font-size:10px;letter-spacing:.32em;color:#ffe2a2;font-weight:900}.title{font-size:clamp(27px,7vw,48px);font-weight:1000;letter-spacing:-.045em;line-height:.98;margin:7px 0;color:#fff3d6}.sub{font-size:12px;color:#e0f3e3}
.controls{position:absolute;z-index:5;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 12px}
button{border:1px solid #fff7;border-radius:999px;padding:13px 17px;color:#fff;font-weight:900;letter-spacing:.03em;background:linear-gradient(180deg,#476d51,#1d4934);box-shadow:0 8px 24px #0008;touch-action:manipulation}
button.primary{background:linear-gradient(180deg,#d84c42,#8b211f);border-color:#ffb3a2}
.hint{position:absolute;z-index:4;bottom:83px;left:0;right:0;text-align:center;color:#fff0c8;font-size:11px;text-shadow:0 2px 6px #000}
.snow{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff9 1px,transparent 1.5px);background-size:55px 55px,83px 83px;background-position:0 0,23px 17px;opacity:.24;animation:snow 12s linear infinite}
@keyframes snow{to{background-position:0 360px,23px 377px}}
</style></head>
<body><main id="stage"><div class="glow"></div><div class="garland" id="garland"></div><canvas id="fx"></canvas><div class="snow"></div>
<div class="hud"><div class="eyebrow">TIKNATION HOLIDAY GIFT LAB</div><div class="title">THE CHRISTMAS<br>POO PARADE! 🎄</div><div class="sub">A jolly little holiday surprise. Oh, fudge.</div></div>
<div class="hint" id="hint">Meet the holiday troublemaker. Tap to start the parade!</div>
<div class="controls"><button id="sound">🔇 SOUND OFF</button><button class="primary" id="launch">🎁 UNLEASH THE POO</button></div></main>
<script>
(()=>{const c=document.getElementById('fx'),ctx=c.getContext('2d'),hint=document.getElementById('hint'),garland=document.getElementById('garland');let w=0,h=0,dpr=1,things=[],snow=[],running=false,soundOn=false,audio=null,last=0,raf=0,mascotX=0,mascotY=0;
for(let i=0;i<22;i++){const b=document.createElement('i');b.className='bulb';b.style.left=(i*4.8+1)+'%';b.style.animationDelay=(Math.random()*1.4)+'s';garland.appendChild(b)}
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);mascotX=w*.5;mascotY=h*.55}addEventListener('resize',resize);resize();
function roundedLobe(x,y,rx,ry,rot,light,dark){
ctx.save();ctx.translate(x,y);ctx.rotate(rot);const g=ctx.createRadialGradient(-rx*.38,-ry*.48,1,rx*.12,ry*.18,rx*1.42);g.addColorStop(0,light);g.addColorStop(.22,'#a36a3d');g.addColorStop(.56,'#754322');g.addColorStop(.82,'#4a2918');g.addColorStop(1,dark);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-rx*.9,ry*.08);ctx.bezierCurveTo(-rx*1.16,-ry*.48,-rx*.52,-ry*1.08,rx*.04,-ry*.92);ctx.bezierCurveTo(rx*.55,-ry*1.22,rx*1.14,-ry*.62,rx*.91,-ry*.05);ctx.bezierCurveTo(rx*1.22,ry*.48,rx*.52,ry*1.13,-rx*.12,ry*.91);ctx.bezierCurveTo(-rx*.72,ry*1.08,-rx*1.16,ry*.57,-rx*.9,ry*.08);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#29160d88';ctx.lineWidth=1.3;ctx.stroke();const sheen=ctx.createRadialGradient(-rx*.38,-ry*.45,0,-rx*.2,-ry*.25,rx*.9);sheen.addColorStop(0,'#f2d2a677');sheen.addColorStop(.28,'#e5b98738');sheen.addColorStop(1,'#dca66a00');ctx.fillStyle=sheen;ctx.beginPath();ctx.ellipse(-rx*.18,-ry*.25,rx*.67,ry*.34,-.42,0,Math.PI*2);ctx.fill();for(let i=0;i<16;i++){const px=Math.sin(i*17.31+rx)*rx*.72,py=Math.cos(i*9.17+ry)*ry*.62;ctx.fillStyle=i%3===0?'#26150c33':'#e4b17a24';ctx.beginPath();ctx.ellipse(px,py,1.1,.65,.3,0,Math.PI*2);ctx.fill()}ctx.restore()}
function mascot(x,y,scale,tilt=0){
ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(scale,scale);
// Mr. Hankey-inspired South Park cut-paper silhouette: simple, chunky and instantly readable.
ctx.save();ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,61,62,12,0,0,Math.PI*2);ctx.fill();ctx.restore();
// little brown arms, held out in his familiar cheerful greeting
ctx.strokeStyle='#80502b';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-37,17);ctx.quadraticCurveTo(-62,1,-70,-19);ctx.moveTo(37,17);ctx.quadraticCurveTo(62,1,70,-19);ctx.stroke();
function glove(x,y){ctx.fillStyle='#f4eee1';ctx.strokeStyle='#9a8d7c';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(x-7,y-5,4,0,Math.PI*2);ctx.arc(x+7,y-5,4,0,Math.PI*2);ctx.fill();ctx.stroke()}
glove(-72,-22);glove(72,-22);
// signature tapered, stacked poop shape
const body=ctx.createLinearGradient(-48,-50,46,45);body.addColorStop(0,'#b98243');body.addColorStop(.38,'#98602f');body.addColorStop(.78,'#75421f');body.addColorStop(1,'#4e2b18');
ctx.fillStyle=body;ctx.strokeStyle='#4a2918';ctx.lineWidth=2.5;ctx.beginPath();
ctx.moveTo(-49,48);ctx.bezierCurveTo(-65,30,-54,7,-36,2);ctx.bezierCurveTo(-49,-15,-34,-35,-15,-33);ctx.bezierCurveTo(-22,-54,-5,-69,12,-61);ctx.bezierCurveTo(28,-55,30,-40,25,-29);ctx.bezierCurveTo(49,-25,56,-5,42,11);ctx.bezierCurveTo(58,28,49,48,29,52);ctx.bezierCurveTo(8,62,-28,60,-49,48);ctx.closePath();ctx.fill();ctx.stroke();
// simple warm highlight and small speckles, retaining the flat TV cutout feel
ctx.fillStyle='#d6a36355';ctx.beginPath();ctx.ellipse(-22,7,17,26,-.35,0,Math.PI*2);ctx.fill();
for(let i=0;i<10;i++){const px=Math.sin(i*8.3)*34,py=Math.cos(i*4.7)*29+12;ctx.fillStyle='#3e241522';ctx.beginPath();ctx.arc(px,py,1.3,0,Math.PI*2);ctx.fill()}
// classic big white eyes and black pupils
ctx.fillStyle='#fff8e9';ctx.strokeStyle='#4a2918';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(-13,-20,10,13,-.08,0,Math.PI*2);ctx.ellipse(13,-20,10,13,.08,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.fillStyle='#17100b';ctx.beginPath();ctx.arc(-10,-19,3.8,0,Math.PI*2);ctx.arc(16,-19,3.8,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#4b2818';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-23,-37);ctx.quadraticCurveTo(-14,-42,-6,-37);ctx.moveTo(7,-37);ctx.quadraticCurveTo(16,-42,24,-36);ctx.stroke();
// wide, unmistakable friendly grin
ctx.fillStyle='#2b170f';ctx.beginPath();ctx.moveTo(-22,1);ctx.quadraticCurveTo(0,-4,22,1);ctx.quadraticCurveTo(18,26,0,26);ctx.quadraticCurveTo(-18,25,-22,1);ctx.fill();
ctx.fillStyle='#fff1dc';ctx.beginPath();ctx.moveTo(-16,3);ctx.quadraticCurveTo(0,8,16,3);ctx.quadraticCurveTo(10,11,0,11);ctx.quadraticCurveTo(-10,11,-16,3);ctx.fill();
// red Santa cap with white trim and pom-pom
const hat=ctx.createLinearGradient(-25,-91,28,-48);hat.addColorStop(0,'#f24c42');hat.addColorStop(1,'#a91620');ctx.fillStyle=hat;ctx.strokeStyle='#6e171c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-31,-47);ctx.quadraticCurveTo(-28,-80,31,-82);ctx.quadraticCurveTo(16,-65,19,-46);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle='#fff5e7';ctx.strokeStyle='#cfc4b4';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(-6,-48,34,8,-.04,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(33,-81,8,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.restore()}
function emoji(x,y,size,rot,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(rot);ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💩',0,0);ctx.restore()}
function draw(t){ctx.clearRect(0,0,w,h);for(let i=0;i<snow.length;i++){const p=snow[i];p.y+=p.v;p.x+=Math.sin(t*.001+p.phase)*.25;if(p.y>h+5){p.y=-5;p.x=Math.random()*w}ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}
mascotY=h*.56+Math.sin(t*.002)*7;mascot(mascotX,mascotY,Math.min(w/410,1.12),Math.sin(t*.0015)*.035);
for(let i=things.length-1;i>=0;i--){const p=things[i];p.x+=p.vx;p.y+=p.vy;p.rot+=p.spin;p.vy+=.045;p.life-=.003;if(p.y>h+60||p.life<=0){things.splice(i,1);continue}emoji(p.x,p.y,p.size,p.rot,Math.min(1,p.life))}
if(running&&t-last>8000){running=false;hint.textContent='The parade is over. Merry Christmas, you filthy animal.'}raf=requestAnimationFrame(draw)}
function chime(freq,when,duration=.32){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.09,when+.018);g.gain.exponentialRampToValueAtTime(.0001,when+duration);o.connect(g);g.connect(audio.destination);o.start(when);o.stop(when+duration)}
function jingle(){if(!audio)return;const now=audio.currentTime;[659,784,988,784,880,1047].forEach((f,i)=>chime(f,now+i*.14,.28))}
function plop(){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(125,audio.currentTime);o.frequency.exponentialRampToValueAtTime(42,audio.currentTime+.22);g.gain.setValueAtTime(.22,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.24);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.25)}
document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;if(soundOn){audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();jingle();document.getElementById('sound').textContent='🔊 SOUND ON'}else document.getElementById('sound').textContent='🔇 SOUND OFF'});
document.getElementById('launch').addEventListener('click',()=>{running=true;last=performance.now();hint.textContent='HO HO HOLY CRAP! 💩';for(let i=0;i<44;i++){things.push({x:Math.random()*w,y:-Math.random()*h*.7,size:24+Math.random()*48,vx:(Math.random()-.5)*3,vy:3+Math.random()*5,rot:Math.random()*6,spin:(Math.random()-.5)*.09,life:1})}if(soundOn){jingle();setTimeout(plop,550);setTimeout(plop,1150)}});
for(let i=0;i<95;i++)snow.push({x:Math.random()*w,y:Math.random()*h,v:.35+Math.random()*.9,r:.5+Math.random()*1.5,phase:Math.random()*6});
cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);
})();
</script></body></html>
