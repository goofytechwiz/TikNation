<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101321"><title>It's Raining Shit! — TikNation Gift Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101321;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 105%,#34404a 0,#171d2a 48%,#090d18 100%);overflow:hidden}.storm{position:absolute;inset:-10% -20% 35%;filter:drop-shadow(0 18px 20px #0009);background:radial-gradient(ellipse at 15% 55%,#626a78 0 13%,transparent 34%),radial-gradient(ellipse at 37% 40%,#333c4d 0 19%,transparent 39%),radial-gradient(ellipse at 64% 45%,#596171 0 17%,transparent 37%),radial-gradient(ellipse at 85% 55%,#283142 0 20%,transparent 42%);animation:clouds 8s ease-in-out infinite alternate}@keyframes clouds{to{transform:translateX(5%) scale(1.05)}}.lightning{position:absolute;inset:0;background:#dbeaff;opacity:0;pointer-events:none}.flash{animation:flash .45s ease-out}@keyframes flash{0%{opacity:.8}12%{opacity:.1}25%{opacity:.65}100%{opacity:0}}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;z-index:3;top:env(safe-area-inset-top,12px);left:0;right:0;text-align:center;padding:18px 12px;pointer-events:none;text-shadow:0 3px 12px #000}.eyebrow{font-size:11px;letter-spacing:.32em;color:#b9d8ef;font-weight:800}.title{font-size:clamp(27px,7vw,52px);font-weight:1000;letter-spacing:-.04em;line-height:1.02;margin:7px 0}.sub{font-size:12px;color:#d2d8e1}.controls{position:absolute;z-index:5;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 14px}.controls button{border:1px solid #a6c8e866;border-radius:999px;padding:14px 20px;color:#fff;font-weight:900;letter-spacing:.04em;background:linear-gradient(180deg,#526b80,#253446);box-shadow:0 8px 24px #0008;touch-action:manipulation}.controls button.primary{background:linear-gradient(180deg,#d8a44c,#8e4b23);border-color:#ffe0a0}.hint{position:absolute;z-index:4;bottom:85px;left:0;right:0;text-align:center;color:#d4dce8;font-size:11px;text-shadow:0 2px 6px #000}.splat{position:absolute;z-index:4;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,#6b472b00 15%,#5a3b25bb 16%,#8a603e 20%,#4a3429cc 22%,transparent 37%);transform:scale(.2)}.splat.show{animation:splat .8s ease-out}@keyframes splat{0%{opacity:0;transform:scale(.2)}20%{opacity:.9;transform:scale(1.3)}100%{opacity:0;transform:scale(1.7)}}.badge{position:absolute;z-index:4;top:18px;right:14px;background:#111a;color:#dbe9f6;border:1px solid #ffffff33;border-radius:20px;padding:6px 10px;font-size:10px;letter-spacing:.12em}
</style></head><body><main id="stage"><div class="storm"></div><div class="lightning" id="bolt"></div><canvas id="fx"></canvas><div class="hud"><div class="eyebrow">TIKNATION GIFT LAB</div><div class="title">IT'S RAINING<br>SHIT!</div><div class="sub">A forecast of absolutely terrible proportions.</div></div><div class="badge">⚡ STORM WARNING</div><div class="splat" id="splat"></div><div class="hint" id="hint">Tap SOUND ON, then unleash the storm.</div><div class="controls"><button id="sound">🔇 SOUND OFF</button><button class="primary" id="launch">☔ MAKE IT RAIN</button></div></main>
<script>
(()=>{const c=document.getElementById('fx'),ctx=c.getContext('2d'),bolt=document.getElementById('bolt'),splat=document.getElementById('splat'),hint=document.getElementById('hint');let w=0,h=0,dpr=1,items=[],active=false,soundOn=false,audio=null,last=0,raf=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function poop(x,y,s,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.shadowColor='#120d0a';ctx.shadowBlur=9;let g=ctx.createLinearGradient(-18,-30,20,22);g.addColorStop(0,'#bd9164');g.addColorStop(.35,'#80512f');g.addColorStop(.72,'#50301e');g.addColorStop(1,'#26170f');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-17,15);ctx.bezierCurveTo(-23,6,-15,-2,-7,-3);ctx.bezierCurveTo(-15,-14,-3,-21,5,-13);ctx.bezierCurveTo(14,-24,24,-14,17,-4);ctx.bezierCurveTo(28,7,18,17,9,17);ctx.closePath();ctx.fill();ctx.strokeStyle='#d7b08a66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-5,4,8,3.5,5.7);ctx.stroke();ctx.restore()}
function draw(t){ctx.clearRect(0,0,w,h);for(let i=items.length-1;i>=0;i--){let p=items[i];p.x+=p.vx;p.y+=p.vy;p.rot+=p.spin;p.vy+=.035;if(p.y>h+45){items.splice(i,1);continue}poop(p.x,p.y,p.s,p.rot)}if(active&&Math.random()<.22){items.push({x:Math.random()*w,y:-35,s:.45+Math.random()*.75,vx:(Math.random()-.5)*1.8,vy:3+Math.random()*4,rot:Math.random(),spin:(Math.random()-.5)*.08})}if(active&&t-last>7800){active=false;hint.textContent='The storm has passed. Unfortunately, the evidence remains.'}raf=requestAnimationFrame(draw)}
function noise(duration,filterFreq,gain){if(!audio)return;let n=Math.floor(audio.sampleRate*duration),buf=audio.createBuffer(1,n,audio.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);let src=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();src.buffer=buf;f.type='lowpass';f.frequency.value=filterFreq;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);src.connect(f);f.connect(g);g.connect(audio.destination);src.start()}
function tone(freq,end,dur,type='sine',vol=.12){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(25,end),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function thunder(){if(!audio)return;noise(1.5,260,.32);tone(75,35,1.4,'sawtooth',.12);setTimeout(()=>noise(.8,180,.16),220)}
function splatSound(){if(!audio)return;noise(.23,850,.3);tone(115,48,.32,'triangle',.16);tone(520,180,.08,'sine',.05)}
function toggleSound(){soundOn=!soundOn;if(soundOn){audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();noise(.45,320,.12);document.getElementById('sound').textContent='🔊 SOUND ON'}else document.getElementById('sound').textContent='🔇 SOUND OFF'}
document.getElementById('sound').addEventListener('click',toggleSound);
function flash(){bolt.classList.remove('flash');void bolt.offsetWidth;bolt.classList.add('flash')}
function launch(){active=true;last=performance.now();hint.textContent='INCOMING! TAKE COVER!';flash();if(soundOn)thunder();for(let i=0;i<95;i++)items.push({x:Math.random()*w,y:-Math.random()*h*.8,s:.45+Math.random()*.9,vx:(Math.random()-.5)*2,vy:4+Math.random()*6,rot:Math.random(),spin:(Math.random()-.5)*.09});setTimeout(()=>{splat.classList.remove('show');void splat.offsetWidth;splat.classList.add('show');if(soundOn)splatSound()},2300);setTimeout(()=>{flash();if(soundOn){thunder();setTimeout(splatSound,250)}},4100);setTimeout(()=>{splat.classList.remove('show');void splat.offsetWidth;splat.classList.add('show');if(soundOn)splatSound()},5200)}
document.getElementById('launch').addEventListener('click',launch);cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);
})();
</script></body></html>
