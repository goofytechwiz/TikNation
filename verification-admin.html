<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TikNation — Verification Command Center</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at 50% 0%, rgba(100,80,220,.25), transparent 45%),
    linear-gradient(180deg, #08070f, #040409);
}

.page {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 28px 18px 60px;
}

.back {
  display: inline-block;
  margin-bottom: 25px;
  color: #bdb8ff;
  text-decoration: none;
  font-size: 14px;
}

.badge {
  display: inline-block;
  padding: 7px 12px;
  border: 1px solid rgba(130,120,255,.4);
  border-radius: 999px;
  color: #c8c4ff;
  background: rgba(100,90,220,.12);
  font-size: 12px;
  letter-spacing: 1.5px;
  font-weight: bold;
}

h1 {
  margin: 18px 0 10px;
  font-size: clamp(38px, 8vw, 62px);
}

.subtitle {
  max-width: 720px;
  margin: 0 0 30px;
  color: #aaa7b8;
  line-height: 1.6;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 35px;
}

.stat {
  padding: 18px;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 16px;
  background: rgba(255,255,255,.035);
}

.stat-number {
  font-size: 28px;
  font-weight: bold;
}

.stat-label {
  margin-top: 5px;
  color: #858293;
  font-size: 12px;
}

.section-title {
  margin-bottom: 15px;
  font-size: 22px;
}

.application {
  margin-bottom: 18px;
  padding: 22px;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 20px;
  background: rgba(255,255,255,.035);
}

.application-top {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  align-items: flex-start;
}

.username {
  font-size: 21px;
  font-weight: bold;
}

.meta {
  margin-top: 6px;
  color: #8f8b9c;
  font-size: 13px;
}

.status {
  display: inline-block;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}

.status.pending {
  color: #ffe59a;
  background: rgba(255,210,70,.12);
  border: 1px solid rgba(255,210,70,.25);
}

.status.verified {
  color: #bfffd8;
  background: rgba(60,220,130,.1);
  border: 1px solid rgba(60,220,130,.25);
}

.status.denied {
  color: #ffcaca;
  background: rgba(255,70,70,.1);
  border: 1px solid rgba(255,70,70,.25);
}

.info {
  margin-top: 18px;
}

.info-label {
  margin-bottom: 5px;
  color: #777384;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.info-text {
  color: #d8d5df;
  line-height: 1.55;
  font-size: 14px;
}

.link {
  color: #aaa2ff;
  word-break: break-all;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

button {
  padding: 11px 15px;
  border: 0;
  border-radius: 10px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.approve {
  background: #267b50;
}

.deny {
  background: #8b3030;
}

.details {
  background: #333044;
}

button:disabled {
  opacity: .55;
  cursor: wait;
}

.empty {
  padding: 30px;
  border: 1px dashed rgba(255,255,255,.12);
  border-radius: 18px;
  color: #888494;
  text-align: center;
}

#message {
  display: none;
  margin-bottom: 22px;
  padding: 14px;
  border-radius: 12px;
  font-size: 14px;
}

#message.success {
  display: block;
  color: #bfffd8;
  background: rgba(60,220,130,.1);
}

#message.error {
  display: block;
  color: #ffd0d0;
  background: rgba(255,70,70,.1);
}

@media (max-width: 650px) {
  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .application-top {
    flex-direction: column;
  }

  .actions {
    flex-direction: column;
  }

  button {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="page">

  <a class="back" href="index.html">← TikNation</a>

  <div class="badge">TIKNATION • COMMAND CENTER</div>

  <h1>Verification Center</h1>

  <p class="subtitle">
    Review creator verification requests, recognize outstanding creators,
    and protect the authenticity of the TikNation community.
  </p>

  <div id="message"></div>

  <div class="stats">

    <div class="stat">
      <div id="pendingCount" class="stat-number">0</div>
      <div class="stat-label">Pending</div>
    </div>

    <div class="stat">
      <div id="verifiedCount" class="stat-number">0</div>
      <div class="stat-label">Verified Creators</div>
    </div>

    <div class="stat">
      <div id="recognitionCount" class="stat-number">0</div>
      <div class="stat-label">Creator Recognition</div>
    </div>

    <div class="stat">
      <div id="deniedCount" class="stat-number">0</div>
      <div class="stat-label">Denied</div>
    </div>

  </div>

  <div class="section-title">
    Applications
  </div>

  <div id="applications">
    <div class="empty">
      Loading verification applications...
    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://mekzfezaefcimxncklfj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Cr0ssF3pEz5lE08KwvyacQ_dKC2IUbQ";

const applications =
  document.getElementById("applications");

const message =
  document.getElementById("message");

function showMessage(text, type) {

  message.className = type;
  message.textContent = text;

}

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function formatDate(value) {

  if (!value) return "Unknown";

  return new Date(value).toLocaleString();

}

async function loadApplications() {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/verification_applications" +
      "?select=*" +
      "&order=created_at.desc",
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data?.message ||
        "Unable to load applications."
      );

    }

    renderApplications(data);

  } catch (error) {

    console.error(error);

    applications.innerHTML =
      '<div class="empty">' +
      'Unable to load verification applications.' +
      '</div>';

    showMessage(
      "The verification applications could not be loaded.",
      "error"
    );

  }

}

function renderApplications(data) {

  const pending =
    data.filter(app =>
      app.status === "pending"
    ).length;

  const verified =
    data.filter(app =>
      app.status === "verified"
    ).length;

  const denied =
    data.filter(app =>
      app.status === "denied"
    ).length;

  document.getElementById("pendingCount")
    .textContent = pending;

  document.getElementById("verifiedCount")
    .textContent = verified;

  document.getElementById("recognitionCount")
    .textContent = verified;

  document.getElementById("deniedCount")
    .textContent = denied;

  if (!data.length) {

    applications.innerHTML =
      '<div class="empty">' +
      'No verification applications yet.' +
      '</div>';

    return;

  }

  applications.innerHTML =
    data.map(app => {

      const status =
        app.status || "pending";

      return `
        <div class="application">

          <div class="application-top">

            <div>
              <div class="username">
                ${escapeHtml(app.username)}
              </div>

              <div class="meta">
                ${escapeHtml(app.category)}
                • Submitted ${formatDate(app.created_at)}
              </div>
            </div>

            <div class="status ${escapeHtml(status)}">
              ${escapeHtml(status.toUpperCase())}
            </div>

          </div>

          <div class="info">

            <div class="info-label">
              Presence
            </div>

            <div class="info-text">
              ${escapeHtml(app.presence)}
            </div>

          </div>

          <div class="info">

            <div class="info-label">
              Recognition Reason
            </div>

            <div class="info-text">
              ${escapeHtml(app.reason)}
            </div>

          </div>

          ${
            app.supporting_links
            ? `
              <div class="info">

                <div class="info-label">
                  Supporting Link
                </div>

                <div class="info-text link">
                  ${escapeHtml(app.supporting_links)}
                </div>

              </div>
            `
            : ""
          }

          <div class="actions">

            ${
              status === "pending"
              ? `
                <button
                  class="approve"
                  onclick="updateStatus('${app.id}', 'verified')"
                >
                  ✓ Approve
                </button>

                <button
                  class="deny"
                  onclick="updateStatus('${app.id}', 'denied')"
                >
                  ✕ Deny
                </button>
              `
              : ""
            }

            <button
              class="details"
              onclick="viewDetails('${app.id}')"
            >
              View Details
            </button>

          </div>

        </div>
      `;

    }).join("");

}

async function updateStatus(id, status) {

  const buttons =
    document.querySelectorAll(
      `button[onclick*="${id}"]`
    );

  buttons.forEach(button => {
    button.disabled = true;
  });

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/verification_applications" +
      "?id=eq." +
      encodeURIComponent(id),
      {
        method: "PATCH",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json",
          "Prefer":
            "return=representation"
        },

        body: JSON.stringify({
          status: status
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data?.message ||
        "Unable to update application."
      );

    }

    showMessage(
      status === "verified"
        ? "Application approved."
        : "Application denied.",
      "success"
    );

    await loadApplications();

  } catch (error) {

    console.error(error);

    showMessage(
      "The application could not be updated.",
      "error"
    );

    buttons.forEach(button => {
      button.disabled = false;
    });

  }

}

function viewDetails(id) {

  const application =
    window.__applications?.find(
      app => app.id === id
    );

  if (!application) return;

  alert(
    "TikNation Verification Application\n\n" +
    "Username: " + application.username + "\n" +
    "Category: " + application.category + "\n" +
    "Status: " + application.status + "\n\n" +
    "Presence:\n" +
    application.presence + "\n\n" +
    "Reason:\n" +
    application.reason
  );

}

const originalRender =
  renderApplications;

renderApplications = function(data) {

  window.__applications = data;

  originalRender(data);

};

loadApplications();

</script>

</body>
</html>
