<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a1c"><title>THE LAST TRAIN · TikNation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172526;color:#fff;font-family:Georgia,serif}canvas{display:block;width:100%;height:100%;touch-action:pan-y}
header{position:fixed;z-index:2;top:env(safe-area-inset-top,0px);left:0;right:0;text-align:center;padding:13px 8px;pointer-events:none;text-shadow:0 2px 12px #000}.eyebrow{font:10px Arial;letter-spacing:.4em;color:#f4d18b}.title{font-size:clamp(27px,7vw,52px);letter-spacing:.14em;margin:4px 0}.sub{font:9px Arial;letter-spacing:.25em}
#status{position:fixed;z-index:2;bottom:calc(77px + env(safe-area-inset-bottom,0px));left:8px;right:8px;text-align:center;font:10px Arial;letter-spacing:.13em;color:#ffedc9;text-shadow:0 2px 8px #000}
.controls{position:fixed;z-index:3;bottom:calc(13px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px}.controls button{border:1px solid #e2bd72;background:rgba(12,27,27,.94);color:#fff2ce;border-radius:28px;padding:12px 18px;font:10px Arial;letter-spacing:.13em}
</style></head><body>
<header><div class="eyebrow">TIKNATION · LEGENDARY GIFT</div><div class="title">THE LAST TRAIN</div><div class="sub">ONE FINAL JOURNEY</div></header>
<div id="status">A DISTANT STEAM WHISTLE ECHOES</div><div class="controls"><button id="replay">↻ REPLAY</button><button id="sound">♫ ENABLE SOUND</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
(()=>{
const status=document.getElementById('status');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;document.body.insertBefore(renderer.domElement,document.querySelector('header'));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eaaa0);scene.fog=new THREE.Fog(0x9eaaa0,34,115);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,180);camera.position.set(0,5.3,18);camera.lookAt(0,2.3,-2);
scene.add(new THREE.HemisphereLight(0xe5f0e5,0x35413a,2.0));
const sun=new THREE.DirectionalLight(0xffe1a8,3.1);sun.position.set(-8,15,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const fill=new THREE.PointLight(0xffc76e,0,12);fill.position.set(0,3,4);scene.add(fill);
const mat=(color,metalness=0,roughness=.55)=>new THREE.MeshStandardMaterial({color,metalness,roughness});
const green=mat(0x08734f,.72,.28),greenDark=mat(0x073c30,.65,.34),brass=mat(0xd5a64e,.8,.25),red=mat(0x70251f,.55,.38),black=mat(0x101716,.55,.35),steel=mat(0x555e5a,.8,.32),glass= new THREE.MeshStandardMaterial({color:0xffc45e,emissive:0xff9f24,emissiveIntensity:1.5,roughness:.25});
function mesh(geo,material,parent,x=0,y=0,z=0){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const ground=mesh(new THREE.PlaneGeometry(180,180),mat(0x34453e),scene,0,-.15,-35);ground.rotation.x=-Math.PI/2;
const moon=mesh(new THREE.SphereGeometry(2.2,32,24),mat(0xe8dba9,0,.9),scene,17,16,-45);
const trackMat=mat(0x484a45,.8,.42), sleeperMat=mat(0x493b2d);
for(let x of [-1.45,1.45]){let rail=mesh(new THREE.BoxGeometry(.13,.16,100),steel,scene,x,.08,-36);rail.position.z=-36}
for(let z=12;z>-88;z-=1.6)mesh(new THREE.BoxGeometry(4.1,.16,.48),sleeperMat,scene,0,.02,z);
for(let side of [-1,1])for(let i=0;i<26;i++){let z=-5-i*3.2,x=side*(7+Math.sin(i*.7)*1.1);let trunk=mesh(new THREE.CylinderGeometry(.13,.22,3.4,7),mat(0x453b2d),scene,x,1.5,z);let crown=mesh(new THREE.ConeGeometry(1.7,5,8),mat(i%2?0x29463b:0x345343),scene,x,5,z);crown.castShadow=true}
const trainRoot=new THREE.Group();scene.add(trainRoot);
const engine=new THREE.Group();trainRoot.add(engine);
// tender and passenger coaches behind locomotive
function coach(z){const group=new THREE.Group();group.position.z=z;trainRoot.add(group);mesh(new THREE.BoxGeometry(3.7,2.7,4.3),red,group,0,2.1,0);mesh(new THREE.BoxGeometry(3.85,.13,4.4),brass,group,0,3.48,0);for(let x of [-1.15,-.4,.4,1.15]){mesh(new THREE.BoxGeometry(.48,.9,.06),glass,group,x,2.55,2.17)}for(let x of [-1.2,1.2]){let w=mesh(new THREE.CylinderGeometry(.48,.48,.22,32),black,group,x,.75,1.2);w.rotation.z=Math.PI/2;let hub=mesh(new THREE.CylinderGeometry(.17,.17,.24,24),brass,group,x,.75,1.2);hub.rotation.z=Math.PI/2;let w2=mesh(new THREE.CylinderGeometry(.48,.48,.22,32),black,group,x,.75,-1.2);w2.rotation.z=Math.PI/2}return group}
coach(-6);coach(-11);coach(-16);
// locomotive boiler axis along Z, front faces viewer (+Z)
mesh(new THREE.BoxGeometry(4.3,1.25,4.5),greenDark,engine,0,1.05,0);
const boiler=mesh(new THREE.CylinderGeometry(1.35,1.35,4.8,48),green,engine,0,2.35,.15);boiler.rotation.x=Math.PI/2;
mesh(new THREE.CylinderGeometry(1.43,1.43,.22,48),brass,engine,0,2.35,2.45);
const face= new THREE.Group();face.position.set(0,2.35,2.59);engine.add(face);
mesh(new THREE.CircleGeometry(1.22,64),black,face,0,0,.015);
const rim=mesh(new THREE.TorusGeometry(1.24,.095,14,64),brass,face,0,0,.05);
const eyes=[];
for(let x of [-.46,.46]){mesh(new THREE.SphereGeometry(.29,32,24),brass,face,x,.32,.11);const eye=mesh(new THREE.SphereGeometry(.225,32,24),mat(0x080f10,.1,.15),face,x,.32,.19);const pupil=mesh(new THREE.SphereGeometry(.115,24,16),glass,face,x,.32,.31);mesh(new THREE.SphereGeometry(.045,16,12),mat(0xffffff,0,.1),face,x-.045,.39,.4);eyes.push({eye,pupil})}
const brows=[];for(let x of [-.46,.46]){const b=mesh(new THREE.BoxGeometry(.58,.09,.12),brass,face,x,.72,.16);brows.push(b)}
const smile=mesh(new THREE.TorusGeometry(.42,.055,12,40,Math.PI),brass,face,0,-.43,.15);smile.rotation.z=Math.PI;
const chimney=mesh(new THREE.CylinderGeometry(.32,.4,.95,32),black,engine,0,4.02,.65);mesh(new THREE.CylinderGeometry(.43,.43,.12,32),brass,engine,0,4.52,.65);
const dome=mesh(new THREE.SphereGeometry(.43,32,24),brass,engine,0,3.68,-.65);dome.scale.y=.65;
mesh(new THREE.BoxGeometry(1.2,.25,.5),brass,engine,0,3.55,2.65);
const lamp=mesh(new THREE.SphereGeometry(.35,24,20),glass,engine,0,3.3,2.85);const lampLight=new THREE.PointLight(0xffbd56,4,12);lampLight.position.set(0,3.3,4);engine.add(lampLight);
const wheels=[];for(let x of [-1.55,1.55])for(let z of [-1.45,0,1.45]){const w=mesh(new THREE.CylinderGeometry(.67,.67,.22,40),black,engine,x,.72,z);w.rotation.z=Math.PI/2;const hub=mesh(new THREE.CylinderGeometry(.22,.22,.25,32),brass,engine,x,.72,z);hub.rotation.z=Math.PI/2;wheels.push(w)}
// connecting rods
for(let x of [-1.68,1.68]){const rod=mesh(new THREE.BoxGeometry(.12,.12,3.1),brass,engine,x,.72,0)}
// smoke puffs
const smokeMat=new THREE.MeshStandardMaterial({color:0x777d78,transparent:true,opacity:.32,roughness:1});const puffs=[];
for(let i=0;i<9;i++){const p=mesh(new THREE.SphereGeometry(.35+Math.random()*.22,16,12),smokeMat,scene,0,0,0);p.visible=false;puffs.push(p)}
const fireMat=new THREE.MeshStandardMaterial({color:0xff6a19,emissive:0xff3d08,emissiveIntensity:1.8,transparent:true,opacity:.8});
const flames=[];for(let i=0;i<5;i++){const f=mesh(new THREE.ConeGeometry(.3,.95,12),fireMat,scene,(i-2)*.48,.4,2.2);f.visible=false;flames.push(f)}
const sparks=[];const sparkMat=mat(0xffbd58,.1,.2);for(let i=0;i<75;i++){const s=mesh(new THREE.SphereGeometry(.045,8,8),sparkMat,scene);s.visible=false;sparks.push(s)}
const trainAudio=new Audio('https://sfxjar.com/audio/3016.mp3'),whistleAudio=new Audio('https://sfxjar.com/audio/3015.mp3'),boomAudio=new Audio('https://assets.sfx.woven.video/sfx/explosion.wav');[trainAudio,whistleAudio,boomAudio].forEach(a=>{a.preload='auto';a.volume=.8});
let sound=false,start=performance.now(),stage=0,exploded=false;
function play(a,v){if(!sound)return;a.pause();a.currentTime=0;a.volume=v;const p=a.play();if(p?.catch)p.catch(()=>{})}
function stop(a){a.pause();a.currentTime=0}
function reset(){[trainAudio,whistleAudio,boomAudio].forEach(stop);start=performance.now();stage=0;exploded=false;trainRoot.visible=true;trainRoot.position.set(0,0,-9);trainRoot.scale.setScalar(.58);trainRoot.rotation.set(0,0,0);engine.visible=true;flames.forEach(f=>f.visible=false);sparks.forEach(s=>s.visible=false);puffs.forEach(p=>p.visible=false);fill.intensity=0;status.textContent='A DISTANT STEAM WHISTLE ECHOES'}
document.getElementById('replay').onclick=reset;document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'♫ SOUND ON':'♫ ENABLE SOUND'};
function impact(){exploded=true;stage=4;status.textContent='THE ENGINE IS WRECKED — ITS FACE IS STILL ALIVE';play(boomAudio,1);fill.intensity=5;for(let i=0;i<sparks.length;i++){const s=sparks[i];s.visible=true;s.position.set((Math.random()-.5)*3,1+Math.random()*3,3+Math.random()*2);s.userData.v=new THREE.Vector3((Math.random()-.5)*.12,Math.random()*.15,.04+Math.random()*.12)}for(let i=0;i<puffs.length;i++){puffs[i].visible=true;puffs[i].position.set((Math.random()-.5)*2,3+Math.random()*1.5,1+Math.random()*2)}for(let i=0;i<flames.length;i++){flames[i].visible=true;flames[i].position.set((i-2)*.55,.5,2.1)}}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))}addEventListener('resize',resize);
function animate(now){requestAnimationFrame(animate);const t=(now-start)/1000;const dt=Math.min(.04,(now-(animate.last||now))/1000);animate.last=now;
if(t>1.4&&stage===0){stage=1;status.textContent='THE STEAM WHISTLE ECHOES THROUGH THE WOODS';play(whistleAudio,.85)}
if(t>2.5&&stage===1){stage=2;status.textContent='STEEL WHEELS CLATTER DOWN THE TRACK';play(trainAudio,.72)}
if(t<8.1){const approach=Math.max(0,Math.min(1,(t-2.2)/5.9));trainRoot.position.z=-9+approach*7.5;trainRoot.scale.setScalar(.58+approach*.48);trainRoot.position.y=Math.sin(t*13)*.025;wheels.forEach((w,i)=>w.rotation.x=t*5*(i%2?1:-1));face.rotation.y=Math.sin(t*1.6)*.025}
if(t>8.1&&!exploded)impact();
if(exploded){trainRoot.position.z=-1.5;trainRoot.position.y=-.04;trainRoot.rotation.x=.025;face.rotation.y=Math.sin(t*1.7)*.055;face.rotation.x=Math.sin(t*2.1)*.025;eyes.forEach((e,i)=>{const blink=Math.pow(Math.max(0,Math.cos(t*2.2+i*.03)),28);e.eye.scale.y=1-.88*blink;e.pupil.position.x=(i===0?-.46:.46)+Math.sin(t*1.1)*.035});brows.forEach((b,i)=>b.rotation.z=Math.sin(t*1.8+i)*.035);
sparks.forEach(s=>{if(s.visible){s.position.addScaledVector(s.userData.v,dt*60);s.userData.v.y-=.003*dt*60;if(s.position.y<.15){s.visible=false}}});
puffs.forEach((p,i)=>{if(p.visible){p.position.y+=dt*(.25+i*.035);p.scale.multiplyScalar(1+dt*.13);if(p.position.y>7){p.position.y=3;p.scale.setScalar(1)}}});
flames.forEach((f,i)=>{f.scale.y=.75+Math.sin(t*7+i)*.24;f.position.y=.5+Math.sin(t*5+i)*.08});fill.intensity=1.8+Math.sin(t*3)*.35}
renderer.render(scene,camera)}
reset();requestAnimationFrame(animate);
})();
</script></body></html>
