<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03030a"><title>SOLARIS · TikNation Mythic Gift</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03030a;color:#fff;font-family:Georgia,serif}

</style></head><body><main id="scene"><div class="stars"></div><div class="nebula"></div><div class="planet"></div><div class="sun"></div><div class="flare"></div><div class="horizon"></div><div class="meteor" id="meteor"></div><div class="blast" id="blast"></div><div class="ring" id="ring"></div><div class="flash" id="flash"></div><div class="debris" id="debris"></div>

<script>(()=>{const $=id=>document.getElementById(id);let ctx=null,on=false,t=[];function later(fn,ms){t.push(setTimeout(fn,ms))}function tone(f,d,type='sine',v=.1,slide=0){if(!ctx||!on)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),ctx.currentTime+d);g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}function rumble(){if(!ctx||!on)return;const n=ctx.createBufferSource(),b=ctx.createBuffer(1,ctx.sampleRate*2.5,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length)**2;n.buffer=b;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=115;const g=ctx.createGain();g.gain.value=.55;n.connect(f);f.connect(g);g.connect(ctx.destination);n.start()}function play(){t.forEach(clearTimeout);t=[];['meteor','blast','ring','flash','debris'].forEach(id=>$(id).classList.remove('go'));$('status').textContent='THE SUN BEGINS TO FLICKER…';void $('scene').offsetWidth;later(()=>{$('status').textContent='A SHADOW CROSSES THE CORONA';tone(72,2.2,'sine',.12,-35)},1100);later(()=>{$('status').textContent='A SOLAR FLARE TEARS ACROSS THE SKY';tone(190,1.4,'sawtooth',.09,180)},2400);later(()=>{$('meteor').classList.add('go');$('status').textContent='INCOMING…';tone(95,2.3,'triangle',.18,-55)},3100);later(()=>{$('blast').classList.add('go');$('ring').classList.add('go');$('flash').classList.add('go');$('debris').classList.add('go');$('status').textContent='THE HEAVENS ERUPT';rumble();tone(42,2.6,'sawtooth',.3,-20)},5200);later(()=>{$('status').textContent='SOLARIS — A NEW STAR IS BORN';tone(520,1.2,'sine',.12,-300);tone(260,1.8,'triangle',.1,-160)},7600)}$('sound').onclick=async()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();on=!on;$('sound').textContent=on?'♫ SOUND ON':'♫ ENABLE SOUND';if(on)tone(260,.2)};$('replay').onclick=play;play()})();</script></body></html>
