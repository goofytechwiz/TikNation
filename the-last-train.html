<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020b12"><title>THE DEEP ONE · TikNation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b12;color:#e9f8f8;font-family:Georgia,serif}
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#071827 0%,#183846 34%,#0a2934 56%,#031018 100%)}
.sky{position:absolute;inset:0;background:radial-gradient(ellipse at 52% 22%,#a6c9c7 0,#5c8990 13%,#234955 31%,transparent 57%)}
.moon{position:absolute;left:calc(50% - 65px);top:8%;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7ffff,#b9d1ca 60%,#779a9a);box-shadow:0 0 70px #9bd3d5aa}
.cloud{position:absolute;inset:0;background:linear-gradient(175deg,transparent 20%,#06131c77 34%,transparent 43%),radial-gradient(ellipse at 20% 22%,#071a25aa 0 13%,transparent 31%),radial-gradient(ellipse at 82% 15%,#081c29aa 0 16%,transparent 33%)}
.cliffs{position:absolute;left:-4%;right:-4%;bottom:25%;height:32%;background:linear-gradient(115deg,#091a22,#20343a 38%,#071821 72%);clip-path:polygon(0 50%,8% 35%,16% 46%,26% 15%,34% 40%,46% 30%,55% 48%,68% 8%,78% 38%,88% 18%,100% 42%,100% 100%,0 100%);filter:drop-shadow(0 -8px 20px #000)}
.ocean{position:absolute;left:-10%;right:-10%;bottom:-12%;height:52%;background:repeating-linear-gradient(177deg,transparent 0 13px,#8bb4b044 14px,#173b47 16px,transparent 19px 34px),linear-gradient(#16404b,#04131c 78%);border-radius:50% 50% 0 0/8% 10% 0 0;animation:water 5s ease-in-out infinite alternate}
@keyframes water{to{transform:translateY(-9px) scaleX(1.02)}}
#beast{position:absolute;z-index:4;width:min(94vw,880px);height:min(78vh,680px);left:50%;top:43%;transform:translate(-50%,110%) scale(.8);opacity:0;filter:drop-shadow(0 20px 35px #000)}
#beast.rise{animation:emerge 3.5s cubic-bezier(.16,.72,.18,1) forwards}
@keyframes emerge{0%{transform:translate(-50%,110%) scale(.8);opacity:0}45%{opacity:1}100%{transform:translate(-50%,-8%) scale(1);opacity:1}}
svg{width:100%;height:100%;overflow:visible}
.tentacle{fill:none;stroke:url(#skin);stroke-width:54;stroke-linecap:round;stroke-linejoin:round;filter:url(#rough)}
.tentacleShade{fill:none;stroke:#031b22;stroke-width:66;stroke-linecap:round;opacity:.62}
.sucker{fill:#b7d5c2;stroke:#173b3d;stroke-width:5;opacity:.78}
.bodyline{fill:none;stroke:#b1d1c3;stroke-width:3;opacity:.22}
#beast.rise .leftA{animation:curlA 3s 2.1s ease-in-out both;transform-origin:280px 390px}
#beast.rise .rightA{animation:curlB 3s 2.1s ease-in-out both;transform-origin:600px 390px}
@keyframes curlA{to{transform:rotate(-9deg) translate(-15px,-15px)}}@keyframes curlB{to{transform:rotate(9deg) translate(15px,-15px)}}
.eyeglow{fill:#d9ffdb;filter:url(#glow);opacity:0}
#beast.rise .eyeglow{animation:ignite 1.1s 2.8s forwards}
@keyframes ignite{to{opacity:1}}
.splash{position:absolute;z-index:6;left:50%;bottom:18%;width:10px;height:10px;border:3px solid #d8ffff;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}
.splash.hit{animation:shock 1.5s ease-out 3.4s 2}
@keyframes shock{to{width:115vw;height:70vh;opacity:0;border-width:1px}}
.flash{position:absolute;z-index:7;inset:0;background:#dffcff;opacity:0;pointer-events:none}.flash.on{animation:flash .6s 3.3s}
@keyframes flash{0%,40%,100%{opacity:0}12%,55%{opacity:.58}}
.mist{position:absolute;z-index:5;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 66%,#c9f8f477,transparent 38%),radial-gradient(ellipse at 20% 76%,#a5e6e655,transparent 32%);filter:blur(12px);pointer-events:none}.mist.on{animation:mist 4s 3s forwards}@keyframes mist{30%{opacity:.9}100%{opacity:.24;transform:translateY(-35px)}}
.hud{position:absolute;z-index:10;top:env(safe-area-inset-top,10px);left:0;right:0;text-align:center;padding:15px 10px;text-shadow:0 2px 14px #000;pointer-events:none}
.kicker{font:700 10px Arial,sans-serif;letter-spacing:.4em;color:#a8d5d0}.title{font-size:clamp(25px,6vw,46px);letter-spacing:.12em;margin:8px 0}.sub{font:10px Arial,sans-serif;letter-spacing:.2em;color:#c2d9d6}
#status{position:absolute;z-index:10;bottom:76px;left:0;right:0;text-align:center;font:10px Arial,sans-serif;letter-spacing:.18em;color:#c8e8e4;text-shadow:0 2px 8px #000}
.controls{position:absolute;z-index:12;bottom:calc(15px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px}
button{border:1px solid #a6d8d1aa;background:#061c27e8;color:#f0ffff;border-radius:28px;padding:12px 18px;font:700 10px Arial,sans-serif;letter-spacing:.12em}
@media(max-height:520px){#beast{height:82vh;width:min(80vw,700px);top:38%}.hud{padding:4px}.title{font-size:24px}.controls{bottom:5px}#status{bottom:57px}}
</style></head><body><main id="scene"><div class="sky"></div><div class="moon"></div><div class="cloud"></div><div class="cliffs"></div><div class="ocean"></div>
<svg id="beast" viewBox="0 0 880 680" role="img" aria-label="A colossal ancient sea monster rising from the ocean">

<radialGradient id="head" cx="35%" cy="22%"><stop stop-color="#9bb9a7"/><stop offset=".28" stop-color="#547d75"/><stop offset=".66" stop-color="#1a4448"/><stop offset="1" stop-color="#061c26"/></radialGradient>

<path d="M335 320 Q355 175 415 112 M375 365 Q400 190 445 88 M520 110 Q570 205 550 345 M555 150 Q600 260 565 350" class="bodyline" stroke-width="8"/>

<g class="sucker"><circle cx="280" cy="400" r="9"/><circle cx="250" cy="380" r="8"/><circle cx="220" cy="355" r="8"/><circle cx="190" cy="333" r="7"/><circle cx="160" cy="322" r="7"/><circle cx="600" cy="400" r="9"/><circle cx="630" cy="380" r="8"/><circle cx="660" cy="355" r="8"/><circle cx="690" cy="333" r="7"/><circle cx="720" cy="322" r="7"/><circle cx="270" cy="475" r="8"/><circle cx="235" cy="490" r="8"/><circle cx="200" cy="510" r="7"/><circle cx="610" cy="475" r="8"/><circle cx="645" cy="490" r="8"/><circle cx="680" cy="510" r="7"/></g>
</svg>
<div class="mist" id="mist"></div><div class="splash" id="splash"></div><div class="flash" id="flash"></div>
<header class="hud"><div class="kicker">TIKNATION · ORIGINAL MYTHIC GIFT</div><div class="title">THE DEEP ONE</div><div class="sub">THE SEA HAS A KING</div></header><div id="status">THE WATER BEGINS TO TURN…</div>
<div class="controls"><button id="sound">♫ ENABLE SOUND</button><button id="replay">↻ SUMMON AGAIN</button></div></main>
<script>(()=>{const $=id=>document.getElementById(id);let ctx=null,on=false,t=[];function later(fn,ms){t.push(setTimeout(fn,ms))}function tone(f,d,type='sine',v=.1,slide=0){if(!ctx||!on)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),ctx.currentTime+d);g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}function boom(){if(!ctx||!on)return;let n=ctx.createBufferSource(),b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length)**2;n.buffer=b;let f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=130;let g=ctx.createGain();g.gain.value=.6;n.connect(f);f.connect(g);g.connect(ctx.destination);n.start()}function play(){t.forEach(clearTimeout);t=[];$('beast').classList.remove('rise');['splash','flash','mist'].forEach(id=>$(id).classList.remove('hit','on'));$('status').textContent='THE WATER BEGINS TO TURN…';void $('beast').offsetWidth;later(()=>{ $('status').textContent='A MASSIVE SHADOW PASSES BELOW';boom()},700);later(()=>{$('status').textContent='THE FIRST TENTACLES BREAK THE SURFACE';tone(58,2,'sawtooth',.14,-28)},1800);later(()=>{$('beast').classList.add('rise');$('status').textContent='THE DEEP ONE RISES';tone(43,2.8,'triangle',.25,-17);tone(95,2,'sine',.13,-55)},2400);later(()=>{$('status').textContent='TWO EYES IGNITE IN THE DARK';tone(430,.8,'sine',.1,-180);tone(520,.8,'sine',.1,-220)},5100);later(()=>{$('flash').classList.add('on');$('splash').classList.add('hit');$('mist').classList.add('on');$('status').textContent='THE SEA HAS A KING';boom();tone(45,2,'sawtooth',.3,-22)},5900)}$('sound').onclick=async()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();on=!on;$('sound').textContent=on?'♫ SOUND ON':'♫ ENABLE SOUND';if(on)tone(260,.2)};$('replay').onclick=play;play()})();</script></body></html>
