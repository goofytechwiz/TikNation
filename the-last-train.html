<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b12"><title>THE LAST TRAIN · TikNation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b12;color:#fff;font-family:Georgia,serif}#world{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#101c2a 0%,#26303a 46%,#090d13 100%)}
.moon{position:absolute;width:clamp(65px,12vw,125px);height:clamp(65px,12vw,125px);border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff7dc,#d7c6a0 55%,#796f60);right:14%;top:13%;box-shadow:0 0 45px #e4d4ad88,0 0 110px #9ab4d455}
.haze{position:absolute;inset:34% -10% 0;background:linear-gradient(transparent,#9aa5ae22 45%,#02050a 100%);filter:blur(8px)}
.ridge{position:absolute;bottom:25%;width:60%;height:46%;background:#101923;clip-path:polygon(0 100%,0 55%,18% 30%,29% 48%,45% 10%,58% 50%,72% 22%,100% 65%,100% 100%)}.ridge.left{left:-8%}.ridge.right{right:-8%;transform:scaleX(-1);background:#151b23}
.pines{position:absolute;bottom:22%;left:0;right:0;height:38%;background:repeating-linear-gradient(90deg,transparent 0 4.2%,#080f16 4.3% 4.8%,transparent 4.9% 7.2%);clip-path:polygon(0 100%,0 65%,3% 28%,6% 70%,10% 12%,14% 76%,18% 25%,22% 70%,27% 10%,31% 75%,35% 30%,39% 78%,44% 14%,48% 72%,53% 22%,57% 76%,62% 12%,67% 78%,72% 25%,77% 72%,82% 9%,87% 74%,92% 24%,96% 70%,100% 35%,100% 100%);opacity:.92}
.track{position:absolute;bottom:-4%;left:50%;width:120%;height:55%;transform:translateX(-50%);background:linear-gradient(180deg,#111820,#07090d);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}.rail{position:absolute;bottom:-5%;height:54%;width:7px;background:linear-gradient(90deg,#353b40,#a4a9a9,#343a40);transform-origin:bottom}.rail.a{left:calc(50% - 14vw);transform:rotate(10deg)}.rail.b{right:calc(50% - 14vw);transform:rotate(-10deg)}
.sleepers{position:absolute;bottom:-2%;left:50%;width:100%;height:50%;transform:translateX(-50%);background:repeating-linear-gradient(0deg,transparent 0 5%,#51463a 5.2% 6.5%,transparent 6.8% 11%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);opacity:.75}
.tunnel{position:absolute;left:50%;top:34%;width:min(52vw,390px);height:39%;transform:translateX(-50%);border:clamp(12px,2.5vw,24px) solid #3b4148;border-bottom:0;border-radius:48% 48% 0 0;background:radial-gradient(ellipse at 50% 85%,#030509 0 42%,#090e15 72%,#202833 100%);box-shadow:0 0 0 5px #151b23,0 0 30px #000 inset,0 0 45px #0008}
.tunnel:before{content:"";position:absolute;inset:-14px -14px auto;height:14px;background:repeating-linear-gradient(90deg,#7b684f 0 5px,#252a30 5px 18px);border-radius:100% 100% 0 0}
.train{position:absolute;z-index:4;left:50%;bottom:17%;width:min(62vw,410px);height:min(48vh,350px);transform:translate(-50%,0) scale(.16);transform-origin:50% 100%;opacity:0;filter:drop-shadow(0 10px 16px #000)}
.running .train{animation:approach 6.2s cubic-bezier(.18,.62,.23,1) forwards}
@keyframes approach{0%{opacity:0;transform:translate(-50%,0) scale(.16)}8%{opacity:1}100%{opacity:1;transform:translate(-50%,0) scale(1.12)}}
.engine{position:absolute;left:50%;bottom:0;width:64%;height:58%;transform:translateX(-50%);background:linear-gradient(90deg,#090d13,#242c34 18%,#070b10 50%,#242c34 82%,#090d13);border:5px solid #9b733d;border-bottom:12px solid #171b20;border-radius:16px 16px 10px 10px;box-shadow:inset 0 0 24px #000,0 0 20px #ff9e3c33}
.boiler{position:absolute;left:50%;bottom:24%;width:56%;height:48%;transform:translateX(-50%);border-radius:48% 48% 16% 16%;background:linear-gradient(90deg,#10161d,#681f20 22%,#9b3025 48%,#551a1c 78%,#10161d);border:5px solid #b38a4c;box-shadow:inset 0 8px 18px #ffb65a33}
.front{position:absolute;left:50%;bottom:21%;width:43%;height:31%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 40%,#e8dfc9 0 43%,#8d754f 45%,#181b20 55%,#07090d 67%);border:5px solid #c59a53;box-shadow:0 0 22px #ffad4b55}
.eye{position:absolute;top:31%;width:16%;height:24%;background:#fff4dc;border-radius:50%;box-shadow:inset 0 -4px 5px #9a8c73}.eye:after{content:"";position:absolute;width:40%;height:55%;background:#111820;border-radius:50%;left:35%;top:28%}.eye.one{left:26%}.eye.two{right:26%}
.mouth{position:absolute;left:41%;top:66%;width:18%;height:8%;background:#171014;border-radius:50%;box-shadow:0 0 0 2px #a88760}
.stack{position:absolute;left:43%;bottom:69%;width:15%;height:24%;background:linear-gradient(90deg,#080c11,#a27643,#171a20);border:3px solid #b88b4a;border-radius:8px 8px 0 0}
.headlight{position:absolute;left:50%;bottom:13%;width:14%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:#fff1bc;box-shadow:0 0 18px 9px #ffc15c,0 0 80px 30px #ff9e3b77}
.wheel{position:absolute;bottom:-5%;width:19%;aspect-ratio:1;border:7px solid #090d12;border-radius:50%;background:repeating-conic-gradient(#b18a4c 0 5deg,#242a30 5deg 45deg);box-shadow:0 0 0 3px #b18a4c;animation:spin .35s linear infinite}.wheel.w1{left:13%}.wheel.w2{right:13%}@keyframes spin{to{transform:rotate(360deg)}}
.carriages{position:absolute;left:50%;bottom:51%;width:66%;height:20%;transform:translateX(-50%);display:flex;gap:3%;justify-content:center}.car{flex:1;background:linear-gradient(#222b34,#571d20 25%,#751f21 80%,#161b20);border:3px solid #9c7845;border-radius:8px 8px 0 0;box-shadow:inset 0 0 15px #000}.car:after{content:"";display:block;margin:18% auto;width:70%;height:35%;background:repeating-linear-gradient(90deg,#ffc66c 0 13%,#2a1a12 13% 23%);box-shadow:0 0 14px #ffb64c}
.smoke{position:absolute;left:49%;bottom:82%;width:30%;height:22%;border-radius:50%;background:#c4cbd055;filter:blur(15px);animation:smoke 1s ease-in-out infinite alternate}@keyframes smoke{to{transform:translate(-15px,-35px) scale(1.4);opacity:.35}}
.hud{position:fixed;z-index:8;top:env(safe-area-inset-top,0px);left:0;right:0;text-align:center;padding:17px 8px;pointer-events:none;text-shadow:0 2px 12px #000}.kicker{font:10px Arial;letter-spacing:.42em;color:#efb76d}.title{font-size:clamp(27px,7vw,56px);letter-spacing:.16em;color:#fff0d9;margin:5px}.sub{font:9px Arial;letter-spacing:.3em;color:#d0d7df}#status{position:fixed;z-index:8;bottom:95px;left:0;right:0;text-align:center;font:10px Arial;letter-spacing:.17em;color:#ffe0b6;padding:0 15px;text-shadow:0 2px 10px #000}
.controls{position:fixed;z-index:20;bottom:calc(15px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px}.controls button{border:1px solid #bd925a;border-radius:3px;background:#111923ee;color:#ffebce;padding:13px 18px;font:10px Arial;letter-spacing:.14em}
#blast{position:fixed;z-index:12;inset:-20%;opacity:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,#fff9d8 0 5%,#ffe36c 8%,#ff7b22 17%,#e52c0a 29%,#30110b 48%,transparent 68%);mix-blend-mode:screen}
.exploding #blast{animation:detonate 1.7s ease-out both}@keyframes detonate{0%{opacity:0;transform:scale(.04)}8%{opacity:1;transform:scale(1.8)}22%{opacity:1;transform:scale(1.25)}55%{opacity:.72;transform:scale(1.65)}100%{opacity:0;transform:scale(2.1)}}
#flash{position:fixed;z-index:13;inset:0;background:#fff5d9;opacity:0;pointer-events:none}.exploding #flash{animation:flash .35s ease-out}@keyframes flash{0%,100%{opacity:0}12%{opacity:1}}
#sparks{position:fixed;z-index:14;inset:0;pointer-events:none}.spark{position:absolute;left:50%;top:53%;width:4px;height:4px;border-radius:50%;background:#ffe5a0;box-shadow:0 0 12px 4px #ff7c25;animation:fly 1.2s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}
#status.done{color:#ffca87}
@media(max-height:500px){.hud{padding:5px}.title{font-size:25px}.sub{display:none}.train{height:48vh}#status{bottom:65px}.controls{bottom:4px}}
</style></head><body>
<div id="world"><div class="moon"></div><div class="ridge left"></div><div class="ridge right"></div><div class="pines"></div><div class="tunnel"></div><div class="haze"></div><div class="track"></div><div class="rail a"></div><div class="rail b"></div><div class="sleepers"></div>
<div class="train" id="train"><div class="smoke"></div><div class="carriages"><div class="car"></div><div class="car"></div><div class="car"></div></div><div class="engine"><div class="boiler"></div><div class="stack"></div><div class="front"><i class="eye one"></i><i class="eye two"></i><i class="mouth"></i></div><div class="headlight"></div><i class="wheel w1"></i><i class="wheel w2"></i></div></div></div>
<div class="hud"><div class="kicker">TIKNATION · ORIGINAL MYTHIC GIFT</div><div class="title">THE LAST TRAIN</div><div class="sub">WHEN THE NIGHT COMES ALIVE</div></div>
<div id="status">A LIGHT APPEARS IN THE DISTANCE</div><div id="blast"></div><div id="flash"></div><div id="sparks"></div>
<div class="controls"><button id="replay">↻ REPLAY</button><button id="sound">♫ ENABLE SOUND</button></div>
<script>
(()=>{const body=document.body,status=document.getElementById('status'),train=document.getElementById('train'),soundButton=document.getElementById('sound'),sparks=document.getElementById('sparks');let audioCtx=null,master=null,soundOn=false,timers=[],engineOsc=[],engineNoise=null,runId=0;
function later(fn,ms,id){const t=setTimeout(()=>{if(id===runId)fn()},ms);timers.push(t)}
function audioReady(){if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.9;master.connect(audioCtx.destination)}return audioCtx.resume()}
function note(freq,wave,level,duration,slide){const o=audioCtx.createOscillator(),g=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();o.type=wave;o.frequency.setValueAtTime(freq,audioCtx.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,audioCtx.currentTime+duration);filter.type='lowpass';filter.frequency.value=wave==='sawtooth'?1800:700;g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.linearRampToValueAtTime(level,audioCtx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(filter);filter.connect(g);g.connect(master);o.start();o.stop(audioCtx.currentTime+duration+.04)}
function whistle(){if(!soundOn)return;const now=audioCtx.currentTime;[392,494,587].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),filt=audioCtx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(f,now);o.frequency.linearRampToValueAtTime(f*.92,now+2.3);filt.type='lowpass';filt.frequency.value=1250;g.gain.setValueAtTime(.001,now);g.gain.linearRampToValueAtTime(.11-i*.02,now+.2);g.gain.setValueAtTime(.11-i*.02,now+1.8);g.gain.exponentialRampToValueAtTime(.001,now+2.6);o.connect(filt);filt.connect(g);g.connect(master);o.start(now);o.stop(now+2.7)});note(180,'sawtooth',.12,1.8,145)}
function engineStart(){if(!soundOn)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();o.type='sawtooth';o.frequency.value=48;f.type='lowpass';f.frequency.value=220;g.gain.value=.16;o.connect(f);f.connect(g);g.connect(master);o.start();engineOsc.push(o,g,f);const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.55;const n=audioCtx.createBufferSource(),nf=audioCtx.createBiquadFilter(),ng=audioCtx.createGain();n.buffer=buffer;n.loop=true;nf.type='lowpass';nf.frequency.value=330;ng.gain.value=.12;n.connect(nf);nf.connect(ng);ng.connect(master);n.start();engineNoise=n}
function stopEngine(){engineOsc.forEach(x=>{try{x.stop&&x.stop()}catch(e){}});engineOsc=[];if(engineNoise){try{engineNoise.stop()}catch(e){}engineNoise=null}}
function boom(){if(!soundOn)return;const len=audioCtx.sampleRate*2.7,buffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<len;i++){const t=i/audioCtx.sampleRate;data[i]=(Math.random()*2-1)*Math.pow(1-t/2.7,2.1)}const n=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();n.buffer=buffer;f.type='lowpass';f.frequency.setValueAtTime(150,audioCtx.currentTime);f.frequency.exponentialRampToValueAtTime(35,audioCtx.currentTime+2.5);g.gain.setValueAtTime(1.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+2.6);n.connect(f);f.connect(g);g.connect(master);n.start();note(55,'sawtooth',.75,1.7,25);note(95,'triangle',.4,1.1,38)}
function makeSparks(){sparks.innerHTML='';for(let i=0;i<85;i++){const s=document.createElement('i');s.className='spark';const a=Math.random()*Math.PI*2,d=100+Math.random()*Math.max(innerWidth,innerHeight)*.65;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');s.style.animationDelay=(Math.random()*.12)+'s';sparks.appendChild(s)}}
function start(){runId++;const id=runId;timers.forEach(clearTimeout);timers=[];stopEngine();body.classList.remove('running','exploding');void body.offsetWidth;body.classList.add('running');train.style.animation='none';void train.offsetWidth;train.style.animation='';status.classList.remove('done');status.textContent='A LIGHT APPEARS IN THE DISTANCE';sparks.innerHTML='';later(()=>{status.textContent='THE WHISTLE CUTS THROUGH THE STORM';if(soundOn)whistle()},1100,id);later(()=>{status.textContent='THE ENGINE ROARS OUT OF THE TUNNEL';if(soundOn)engineStart()},2700,id);later(()=>{status.textContent='IT IS COMING STRAIGHT AT YOU'},4400,id);later(()=>{body.classList.add('exploding');status.textContent='THE LAST TRAIN — FINAL IMPACT';status.classList.add('done');makeSparks();if(soundOn)boom();stopEngine();train.style.opacity='0'},6250,id);later(()=>{status.textContent='THE NIGHT WILL NEVER BE THE SAME';},8200,id)}
document.getElementById('replay').addEventListener('click',start);soundButton.addEventListener('click',async()=>{try{soundOn=true;await audioReady();master.gain.setTargetAtTime(.9,audioCtx.currentTime,.02);soundButton.textContent='♫ SOUND ON';note(220,'sine',.35,.22,160);start()}catch(e){soundButton.textContent='♫ TAP TO ENABLE SOUND';status.textContent='SOUND COULD NOT START — TAP AGAIN'}});start();})();
</script></body></html>
