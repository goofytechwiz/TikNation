<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#243b3c"><title>THE LAST TRAIN · TikNation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#263d40;color:#fff;font-family:Georgia,serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:pan-y}
header{position:fixed;z-index:2;top:env(safe-area-inset-top,0px);left:0;right:0;text-align:center;padding:13px 8px;text-shadow:0 2px 10px #10191c;pointer-events:none}.eyebrow{font:10px Arial;letter-spacing:.38em;color:#f3d18c}.title{font-size:clamp(27px,7vw,54px);letter-spacing:.14em;margin:4px 0}.sub{font:9px Arial;letter-spacing:.25em;color:#fff}
#status{position:fixed;z-index:2;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:8px;right:8px;text-align:center;font:10px Arial;letter-spacing:.13em;color:#fff2ce;text-shadow:0 2px 8px #172324}
.controls{position:fixed;z-index:3;bottom:calc(13px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px}.controls button{border:1px solid #e2bd72;background:#152b2d;color:#fff2ce;border-radius:28px;padding:12px 18px;font:10px Arial;letter-spacing:.13em}
</style></head><body>
<canvas id="scene"></canvas><header><div class="eyebrow">TIKNATION · LEGENDARY GIFT</div><div class="title">THE LAST TRAIN</div><div class="sub">ONE FINAL JOURNEY</div></header>
<div id="status">A DISTANT WHISTLE CUTS THROUGH THE NIGHT</div><div class="controls"><button id="replay">↻ REPLAY</button><button id="sound">♫ ENABLE SOUND</button></div>
<script>
(()=>{
const c=document.getElementById('scene'),g=c.getContext('2d'),status=document.getElementById('status');
let W,H,D=1,start=0,phase=0,sound=false,blast=[],smoke=[],wreck=false,last=0;
const train=new Audio('https://sfxjar.com/audio/3016.mp3'),whistle=new Audio('https://sfxjar.com/audio/3015.mp3'),boom=new Audio('https://assets.sfx.woven.video/sfx/explosion.wav');
[train,whistle,boom].forEach(a=>{a.preload='auto';a.volume=.8});
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();
function play(a,v){if(!sound)return;a.pause();a.currentTime=0;a.volume=v;const p=a.play();if(p?.catch)p.catch(()=>{})}
function stop(a){a.pause();a.currentTime=0}
function reset(){[train,whistle,boom].forEach(stop);start=performance.now();phase=0;wreck=false;blast=[];smoke=[];status.textContent='A DISTANT WHISTLE CUTS THROUGH THE NIGHT'}
document.getElementById('replay').onclick=reset;
document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'♫ SOUND ON':'♫ ENABLE SOUND'};
function path(points,fill,stroke='#182322',lw=2){g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.stroke()}}
function background(t){
let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8ba4a0');sky.addColorStop(.45,'#aeb6a3');sky.addColorStop(1,'#485d54');g.fillStyle=sky;g.fillRect(0,0,W,H);
g.fillStyle='rgba(255,231,170,.72)';g.beginPath();g.arc(W*.78,H*.22,Math.min(W,H)*.065,0,Math.PI*2);g.fill();
for(let i=0;i<36;i++){let x=i*W/35,base=H*.66+(i%3)*8,h=H*(.15+(i%5)*.035);g.fillStyle=i%2?'#29443b':'#355247';g.fillRect(x-4,base-h*.4,8,h*.4);path([[x-35,base-h*.2],[x,base-h],[x+35,base-h*.2]],i%2?'#29443b':'#355247',null);path([[x-28,base-h*.55],[x,base-h*1.2],[x+28,base-h*.55]],'#203b34',null)}
g.fillStyle='#293c39';g.fillRect(0,H*.68,W,H*.32);
g.strokeStyle='#d3c6a3';g.lineWidth=5;g.beginPath();g.moveTo(W*.35,H);g.lineTo(W*.48,H*.67);g.moveTo(W*.65,H);g.lineTo(W*.52,H*.67);g.stroke();
for(let i=0;i<18;i++){let q=i/18,y=H*.69+q*q*H*.3,hw=5+q*W*.3;g.strokeStyle='#574b3d';g.lineWidth=3;g.beginPath();g.moveTo(W/2-hw,y);g.lineTo(W/2+hw,y);g.stroke()}
}
function trainDraw(t,damaged){
const s=Math.min(W/330,H/570)*1.12,cx=W*.5,cy=H*.76;
g.save();g.translate(cx,cy);g.scale(s,s);
const bob=damaged?0:Math.sin(t*8)*2;g.translate(0,bob);
const body='#087b53',dark='#064c3a',gold='#e6bd67';
/* rear passenger coaches */
for(let i=2;i>=0;i--){let y=-145-i*43;path([[-104,y],[-95,y-58],[95,y-58],[104,y]],i%2?'#8f302a':'#a53b31','#351d1a',3);g.fillStyle=gold;g.fillRect(-96,y-57,192,5);for(let k=-2;k<=2;k++){g.fillStyle='#f5cf7d';g.fillRect(k*34-8,y-44,16,25)}}
/* engine body */
path([[-126,-20],[-117,-124],[-91,-153],[91,-153],[117,-124],[126,-20]],body,'#073c2d',4);
path([[-111,-124],[-95,-166],[95,-166],[111,-124]],'#9b2f29','#391a17',3);
g.fillStyle=gold;g.fillRect(-99,-169,198,7);
g.fillStyle='#073b2e';g.fillRect(-119,-44,238,20);g.fillStyle=gold;g.fillRect(-122,-25,244,7);
/* smokebox and brass rim */
let rg=g.createRadialGradient(-18,-135,4,0,-130,92);rg.addColorStop(0,'#59645c');rg.addColorStop(.55,'#172c27');rg.addColorStop(.86,'#0b1715');rg.addColorStop(1,'#d3a957');
g.fillStyle=rg;g.beginPath();g.ellipse(0,-126,83,72,0,0,Math.PI*2);g.fill();g.strokeStyle=gold;g.lineWidth=8;g.stroke();
/* face eyes: always bright and prominent */
const blink=Math.pow(Math.max(0,Math.cos(t*2.2)),22),ey=-145;
for(const x of [-29,29]){g.fillStyle='#f0ca7a';g.beginPath();g.ellipse(x,ey,21,23,0,0,Math.PI*2);g.fill();g.fillStyle='#101b18';g.beginPath();g.ellipse(x,ey,16,18*(1-.9*blink),0,0,Math.PI*2);g.fill();if(blink<.8){g.fillStyle='#ffcf68';g.beginPath();g.arc(x+Math.sin(t*1.4)*3,ey,9,0,Math.PI*2);g.fill();g.fillStyle='#fff8dc';g.beginPath();g.arc(x-3,ey-5,3.5,0,Math.PI*2);g.fill()}g.strokeStyle='#f0cf86';g.lineWidth=5;g.beginPath();g.moveTo(x-19,ey-24);g.quadraticCurveTo(x,ey-34,x+18,ey-23);g.stroke()}
g.strokeStyle='#f3d18a';g.lineWidth=5;g.beginPath();g.moveTo(-25,-91);g.quadraticCurveTo(0,-(damaged?77:86+Math.sin(t*3)*3),25,-91);g.stroke();
/* chimney and headlamp */
path([[-24,-192],[-20,-231],[20,-231],[24,-192]],'#162522',gold,4);g.fillStyle=gold;g.fillRect(-28,-235,56,8);
let lamp=g.createRadialGradient(0,-184,1,0,-184,38);lamp.addColorStop(0,'#fff7ce');lamp.addColorStop(.35,'#ffd36b');lamp.addColorStop(1,'rgba(255,190,70,0)');g.fillStyle=lamp;g.beginPath();g.arc(0,-184,38,0,Math.PI*2);g.fill();
/* wheels */
for(let x of [-82,-25,25,82]){g.fillStyle='#111a18';g.beginPath();g.arc(x,-5,22,0,Math.PI*2);g.fill();g.strokeStyle=gold;g.lineWidth=5;g.stroke();g.strokeStyle='#b7a06b';g.lineWidth=3;g.beginPath();g.moveTo(x-14,-5);g.lineTo(x+14,-5);g.moveTo(x,-19);g.lineTo(x,9);g.stroke()}
if(damaged){/* clearly visible broken front plate, not a black overlay */g.strokeStyle='#d69a42';g.lineWidth=5;g.beginPath();g.moveTo(-75,-57);g.lineTo(-45,-40);g.lineTo(-16,-54);g.moveTo(16,-48);g.lineTo(48,-35);g.lineTo(77,-59);g.stroke()}
g.restore();
}
function explode(){wreck=true;status.textContent='THE ENGINE IS WRECKED — BUT ITS FACE IS STILL ALIVE';[train,whistle].forEach(stop);play(boom,1);for(let i=0;i<105;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*5;blast.push({x:W/2,y:H*.71,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,age:0,life:35+Math.random()*35,r:2+Math.random()*5})}for(let i=0;i<12;i++)smoke.push({x:W/2+(Math.random()-.5)*90,y:H*.69,vx:(Math.random()-.5)*.35,vy:-.5-Math.random()*.8,age:0,life:160,r:10+Math.random()*12})}
function effects(dt){
for(const p of blast){p.age+=dt*60;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.1*dt*60;g.globalAlpha=Math.max(0,1-p.age/p.life);g.fillStyle=p.age%2?'#ff9b32':'#ffe0a0';g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill()}blast=blast.filter(p=>p.age<p.life);
for(const p of smoke){p.age+=dt*60;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.r+=.1;g.globalAlpha=.22*Math.max(0,1-p.age/p.life);g.fillStyle='#465452';g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill()}smoke=smoke.filter(p=>p.age<p.life);
g.globalAlpha=1;
/* small contained flames below the face, never a full-screen flash */
for(let i=0;i<3;i++){let x=W/2+(i-1)*35,y=H*.83+Math.sin(performance.now()/130+i)*4;let f=g.createRadialGradient(x,y,1,x,y,24);f.addColorStop(0,'rgba(255,226,119,.8)');f.addColorStop(.5,'rgba(255,103,27,.65)');f.addColorStop(1,'rgba(180,35,8,0)');g.fillStyle=f;g.beginPath();g.ellipse(x,y,13,25,0,0,Math.PI*2);g.fill()}
}
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.04,(now-last)/1000||.016);last=now;let t=(now-start)/1000;background(t);
if(t>1.5&&phase===0){phase=1;status.textContent='THE STEAM WHISTLE ECHOES THROUGH THE WOODS';play(whistle,.8)}
if(t>2.4&&phase===1){phase=2;status.textContent='THE LOCOMOTIVE THUNDERS DOWN THE TRACK';play(train,.7)}
if(t>7.8&&phase===2){phase=3;status.textContent='THE FINAL IMPACT';}
if(t>8.15&&phase===3){phase=4;explode()}
trainDraw(t,wreck);
if(wreck)effects(dt);
}
reset();requestAnimationFrame(frame);
})();
</script></body></html>
