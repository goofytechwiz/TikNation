<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02030a"><title>SOLARIS · TikNation Mythic Gift</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:#fff;font-family:Georgia,serif}#sky{position:fixed;inset:0;width:100%;height:100%;display:block}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 35%,#02030a55 75%,#010208 120%)}.hud{position:fixed;z-index:3;top:env(safe-area-inset-top,8px);left:0;right:0;text-align:center;padding:14px 8px;text-shadow:0 2px 18px #000}.kicker{font:700 9px Arial,sans-serif;letter-spacing:.4em;color:#ffc49b}.title{font-size:clamp(29px,7vw,52px);letter-spacing:.2em;margin:7px 0;color:#fff4e9}.sub{font:10px Arial,sans-serif;letter-spacing:.24em;color:#e9b99d}#status{position:fixed;z-index:3;bottom:76px;left:0;right:0;text-align:center;font:10px Arial,sans-serif;letter-spacing:.19em;color:#ffe0c8;text-shadow:0 2px 12px #000;padding:0 12px}.controls{position:fixed;z-index:4;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px}button{border:1px solid #e9a77caa;background:#170e13e8;color:#fff1e6;border-radius:30px;padding:12px 17px;font:700 10px Arial,sans-serif;letter-spacing:.12em;backdrop-filter:blur(8px)}button:active{transform:scale(.97)}@media(max-height:480px){.hud{padding:3px}.title{font-size:25px}.controls{bottom:4px}#status{bottom:55px}}
</style></head><body><canvas id="sky"></canvas><div class="vignette"></div>
<header class="hud"><div class="kicker">TIKNATION · ORIGINAL MYTHIC GIFT</div><div class="title">SOLARIS</div><div class="sub">WHEN THE STARS GO DARK</div></header>
<div id="status">THE SUN BEGINS TO FLICKER…</div><div class="controls"><button id="sound">♫ ENABLE SOUND</button><button id="replay">↻ RELIVE THE EVENT</button></div>
<script>
(()=>{const canvas=document.getElementById('sky'),c=canvas.getContext('2d'),status=document.getElementById('status');let W,H,D,stars=[],dust=[],start=performance.now(),audio=null,sound=false,timers=[];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';c.setTransform(D,0,0,D,0,0);stars=Array.from({length:260},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.25+.2,a:Math.random()*.65+.2,p:Math.random()*7}));dust=Array.from({length:170},()=>({a:Math.random()*Math.PI*2,r:Math.random(),s:Math.random()*1.5+.3}));}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a);
function glow(x,y,r,col){let g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function draw(now){let t=(now-start)/1000, cx=W*.5,cy=H*.445,R=Math.min(W*.205,H*.255,190),impact=Math.max(0,Math.min(1,(t-5.2)/1.2));
c.clearRect(0,0,W,H);let bg=c.createRadialGradient(cx,cy,2,cx,cy,Math.max(W,H)*.8);bg.addColorStop(0,'#241a20');bg.addColorStop(.4,'#0b1020');bg.addColorStop(1,'#01030a');c.fillStyle=bg;c.fillRect(0,0,W,H);
for(let s of stars){let tw=.65+.35*Math.sin(t*1.4+s.p);c.globalAlpha=s.a*tw;c.fillStyle='#e5eaff';c.beginPath();c.arc(s.x,s.y,s.r,0,Math.PI*2);c.fill()}c.globalAlpha=1;
glow(W*.18,H*.42,W*.28,'#6b303322');glow(W*.82,H*.32,W*.3,'#293c7228');
// distant planet, textured terminator
let px=W*.82,py=H*.77,pr=Math.min(W*.22,H*.26);let pg=c.createRadialGradient(px-pr*.35,py-pr*.45,pr*.08,px,py,pr);pg.addColorStop(0,'#aa8c78');pg.addColorStop(.42,'#5d4b50');pg.addColorStop(.78,'#202637');pg.addColorStop(1,'#050914');c.fillStyle=pg;c.beginPath();c.arc(px,py,pr,0,Math.PI*2);c.fill();c.save();c.beginPath();c.arc(px,py,pr,0,Math.PI*2);c.clip();for(let i=0;i<65;i++){let x=px+rand(-pr,pr),y=py+rand(-pr,pr);c.fillStyle=i%2?'#d2a78a12':'#070d1b28';c.beginPath();c.ellipse(x,y,rand(3,16),rand(1,5),rand(0,6),0,Math.PI*2);c.fill()}c.restore();
// solar corona with irregular plasma tongues
glow(cx,cy,R*3.2,'#c84e2d26');glow(cx,cy,R*2.2,'#ed713b22');
c.save();c.translate(cx,cy);c.rotate(t*.012);
for(let i=0;i<520;i++){let a=i/520*Math.PI*2, len=R*rand(.12,.43),base=R*rand(1.02,1.18);c.strokeStyle=i%3?'#ff9a55':'#ffe0a0';c.globalAlpha=rand(.08,.4);c.lineWidth=rand(.5,2.1);c.beginPath();c.moveTo(Math.cos(a)*base,Math.sin(a)*base);c.quadraticCurveTo(Math.cos(a+.035)* (base+len*.6),Math.sin(a+.035)*(base+len*.6),Math.cos(a+rand(-.025,.025))*(base+len),Math.sin(a+rand(-.025,.025))*(base+len));c.stroke()}
c.globalAlpha=1;c.restore();
// bright ragged corona ring
for(let i=0;i<180;i++){let a=i/180*Math.PI*2,rr=R*(1.045+Math.sin(i*2.37+t*.7)*.022+Math.sin(i*.41)*.018);c.strokeStyle=i%4?'#ff8a45':'#ffe0a1';c.globalAlpha=.3+Math.random()*.35;c.lineWidth=rand(1,3);c.beginPath();c.arc(cx,cy,rr,a,a+.035);c.stroke()}c.globalAlpha=1;
// black solar disc with subtle limb
let sg=c.createRadialGradient(cx-R*.22,cy-R*.28,R*.05,cx,cy,R*1.02);sg.addColorStop(0,'#010105');sg.addColorStop(.82,'#030309');sg.addColorStop(.97,'#10090d');sg.addColorStop(1,'#5b2119');c.fillStyle=sg;c.beginPath();c.arc(cx,cy,R,0,Math.PI*2);c.fill();c.strokeStyle='#ffb36c';c.globalAlpha=.55;c.lineWidth=1.2;c.beginPath();c.arc(cx,cy,R*1.012,0,Math.PI*2);c.stroke();c.globalAlpha=1;
// foreground jagged horizon
let hy=H*.84;c.fillStyle='#080c17';c.beginPath();c.moveTo(0,H);c.lineTo(0,hy+18);for(let x=0;x<=W;x+=W/18)c.lineTo(x,hy+rand(-10,18));c.lineTo(W,H);c.closePath();c.fill();glow(cx,hy,W*.4,'#d75a3030');
// meteor streak from upper left toward horizon impact
if(t>3.1&&t<6.7){let q=Math.min(1,(t-3.1)/2.7),mx=W*(-.12+q*1.0),my=H*(.08+q*.68);let tail=c.createLinearGradient(mx-W*.34,my-H*.23,mx,my);tail.addColorStop(0,'transparent');tail.addColorStop(.65,'#ff9b50aa');tail.addColorStop(1,'#fff8df');c.strokeStyle=tail;c.lineWidth=5+q*3;c.shadowColor='#ff8846';c.shadowBlur=22;c.beginPath();c.moveTo(mx-W*.34,my-H*.23);c.lineTo(mx,my);c.stroke();c.shadowBlur=0;glow(mx,my,28+q*24,'#ff9b4c66');}
// impact ring and debris
if(t>5.2){let q=Math.min(1,(t-5.2)/2.8),ix=W*.79,iy=H*.76;c.save();c.globalAlpha=(1-q)*.85;c.strokeStyle='#ffd0a0';c.lineWidth=2;c.beginPath();c.arc(ix,iy,10+q*Math.max(W,H)*.55,0,Math.PI*2);c.stroke();c.restore();glow(ix,iy,Math.max(0,110*(1-q)),'#fff0c477');for(let d of dust){let a=d.a+t*.22,rr=(q*420*d.r);let x=ix+Math.cos(a)*rr,y=iy+Math.sin(a)*rr*.6;c.fillStyle=d.r>.7?'#fff0c9':'#ff9a58';c.globalAlpha=(1-q)*.8;c.fillRect(x,y,d.s,d.s)}c.globalAlpha=1;if(t>5.2&&t<5.85){c.fillStyle='rgba(255,230,200,'+(.45*(1-(t-5.2)/.65))+')';c.fillRect(0,0,W,H)}}
requestAnimationFrame(draw)}
requestAnimationFrame(draw);
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function noise(duration,volume,startFreq,endFreq,delay=0,mode='lowpass',texture='white'){
 if(!audio||!sound)return;
 const length=Math.max(1,Math.floor(audio.sampleRate*duration)),buffer=audio.createBuffer(1,length,audio.sampleRate),data=buffer.getChannelData(0);
 let brown=0;
 for(let i=0;i<length;i++){const white=Math.random()*2-1;brown=(brown*.975)+(white*.025);data[i]=texture==='brown'?brown*5:white;}
 const src=audio.createBufferSource();src.buffer=buffer;
 const filter=audio.createBiquadFilter();filter.type=mode;filter.frequency.setValueAtTime(startFreq,audio.currentTime+delay);filter.frequency.exponentialRampToValueAtTime(Math.max(25,endFreq),audio.currentTime+delay+duration);filter.Q.value=mode==='bandpass'?0.65:0.25;
 const gain=audio.createGain(),now=audio.currentTime+delay;
 gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(volume,now+Math.min(.9,duration*.28));gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
 src.connect(filter);filter.connect(gain);gain.connect(audio.destination);src.start(now);src.stop(now+duration);
}
function crackle(duration,count,volume,delay=0){
 if(!audio||!sound)return;
 for(let i=0;i<count;i++){const at=delay+Math.random()*duration;noise(.035+Math.random()*.11,volume*(.35+Math.random()*.65),1800+Math.random()*2600,700+Math.random()*900,at,'highpass');}
}
function play(){
 clearTimers();start=performance.now();status.textContent='THE SUN BEGINS TO FLICKER…';
 later(()=>{status.textContent='A SHADOW CROSSES THE CORONA';noise(2.8,.16,150,48,0,'lowpass','brown');noise(2.4,.035,420,170,0,'bandpass')},1100);
 later(()=>{status.textContent='A SOLAR FLARE TEARS ACROSS THE SKY';noise(2.7,.13,260,1900,0,'bandpass');noise(2.2,.10,700,110,0,'lowpass','brown');crackle(2.3,24,.035,.25)},2400);
 later(()=>{status.textContent='INCOMING…';noise(3.2,.17,1200,95,0,'lowpass');noise(2.8,.14,170,38,.08,'lowpass','brown')},3100);
 later(()=>{status.textContent='THE HEAVENS ERUPT';noise(4.5,.42,180,32,0,'lowpass','brown');noise(3.8,.19,950,130,0,'lowpass');noise(2.5,.11,2400,420,.04,'bandpass');crackle(3.8,78,.055,.08)},5200);
 later(()=>{status.textContent='SOLARIS — A NEW STAR IS BORN';noise(3.8,.12,520,90,0,'lowpass','brown');noise(3.2,.045,3200,1100,.2,'highpass');crackle(2.8,34,.025,.25)},7800);
}
document.getElementById('sound').onclick=async()=>{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();sound=!sound;document.getElementById('sound').textContent=sound?'♫ SOUND ON':'♫ ENABLE SOUND';if(sound){noise(2.2,.07,180,65,0,'lowpass','brown');}};
document.getElementById('replay').onclick=play;play();
})();
</script></body></html>
