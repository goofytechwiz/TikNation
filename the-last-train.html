<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>THE LAST TRAIN · TikNation Legendary Gift</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:#f5e7c9;font-family:Georgia,serif}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;text-align:center;padding:19px 10px 0;pointer-events:none;text-shadow:0 2px 18px #000;z-index:3}.eyebrow{font:10px Arial,sans-serif;letter-spacing:.42em;color:#d5b779}.title{font-size:clamp(28px,7vw,62px);letter-spacing:.15em;margin:5px 0}.sub{font:9px Arial,sans-serif;letter-spacing:.3em;color:#c1c8d0}
#status{position:fixed;z-index:3;bottom:calc(82px + env(safe-area-inset-bottom,0px));left:10px;right:10px;text-align:center;font:10px Arial,sans-serif;letter-spacing:.22em;color:#e5c98c;text-shadow:0 2px 12px #000}
.controls{position:fixed;z-index:4;bottom:calc(17px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 12px}.controls button{border:1px solid #a98b55;background:rgba(8,12,18,.86);color:#f4e4c1;border-radius:30px;padding:12px 18px;font:10px Arial,sans-serif;letter-spacing:.14em;backdrop-filter:blur(12px)}.controls button:active{background:#594327}
#flash{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 52%,#fff9df 0%,#ffc05b 18%,rgba(255,88,22,.55) 42%,transparent 72%);mix-blend-mode:screen}
#shock{position:fixed;z-index:2;pointer-events:none;left:50%;top:53%;width:10vmin;height:10vmin;border:5px solid rgba(255,211,143,.9);border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;box-shadow:0 0 35px #ff8b32,inset 0 0 25px #ffb75b}
@media(max-height:520px){.top{padding-top:5px}.title{font-size:25px}.controls{bottom:5px}#status{bottom:58px}}
</style>
</head>
<body>
<div id="stage"></div><div id="flash"></div><div id="shock"></div>
<header class="top"><div class="eyebrow">TIKNATION · LEGENDARY GIFT</div><div class="title">THE LAST TRAIN</div><div class="sub">IT'S COMING FOR YOU</div></header>
<div id="status">DISTANT WHEELS RATTLE OVER THE TRACKS</div>
<div class="controls"><button id="replay">↻ REPLAY</button><button id="sound">♫ ENABLE SOUND</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const mount=document.getElementById('stage'),status=document.getElementById('status'),flash=document.getElementById('flash'),shock=document.getElementById('shock');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101722);scene.fog=new THREE.FogExp2(0x17212b,.012);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);camera.position.set(0,3.25,14);camera.lookAt(0,2.4,-13);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.28;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc5d7e8,0x211711,1.65));
const moon=new THREE.DirectionalLight(0xa9c8e4,2.7);moon.position.set(-8,13,-20);moon.castShadow=true;scene.add(moon);
const fireLight=new THREE.PointLight(0xff6b24,0,35,1.6);fireLight.position.set(0,3,10);scene.add(fireLight);
const M=(c,metal=0,rough=.65,em=0)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough,emissive:c,emissiveIntensity:em});
const iron=M(0x171c22,.86,.28),emerald=M(0x075b43,.72,.27),black=M(0x080b0f,.55,.4),brass=M(0xc29a4e,.82,.23),wine=M(0x431b1b,.42,.42),glow=new THREE.MeshStandardMaterial({color:0xffd49a,emissive:0xffa13d,emissiveIntensity:3,roughness:.2});
function box(p,w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function cylinder(p,r1,r2,len,m,x,y,z,rx=0,rz=0,seg=24){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,seg),m);o.position.set(x,y,z);o.rotation.set(rx,0,rz);o.castShadow=true;p.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,160),M(0x11161b));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.18,-42);ground.receiveShadow=true;scene.add(ground);
// Rails and ties lead directly toward the viewer
for(let z=-110;z<20;z+=2.05)box(scene,4.8,.17,.42,M(0x302820),0,-.08,z);
for(const x of [-1.42,1.42])box(scene,.17,.2,132,M(0x55585b,.8,.38),x,.02,-44);
// A deep stone tunnel and forest silhouette
const stone=M(0x343b42,.12,.9),tunnel=new THREE.Group();scene.add(tunnel);tunnel.position.z=-55;
box(tunnel,13,1.1,2.4,stone,0,7.1,0);box(tunnel,3.1,7.2,2.4,stone,-4.8,3.55,0);box(tunnel,3.1,7.2,2.4,stone,4.8,3.55,0);
const arch=new THREE.Mesh(new THREE.TorusGeometry(3.3,.58,14,48,Math.PI),stone);arch.position.set(0,3.6,-.2);arch.rotation.z=Math.PI;arch.scale.y=1.12;tunnel.add(arch);
box(tunnel,6.3,6.5,.25,M(0x020407),0,3.25,-1.1);
const treeMat=M(0x101a20),bark=M(0x211c18);
for(let i=0;i<95;i++){let x=(Math.random()-.5)*54;if(Math.abs(x)<3.3)continue;let z=-105+Math.random()*110,h=4+Math.random()*8;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.27,h*.32,7),bark);trunk.position.set(x,h*.16,z);scene.add(trunk);for(let j=0;j<3;j++){const cone=new THREE.Mesh(new THREE.ConeGeometry(1.5-j*.3,h*.38,8),treeMat);cone.position.set(x,h*.32+j*h*.2,z);scene.add(cone)}}
// Build a heavy, detailed steam locomotive facing the camera
const train=new THREE.Group();scene.add(train);train.position.set(0,0,-46);
const loco=new THREE.Group();train.add(loco);
box(loco,3.05,1.55,4.2,emerald,0,1.42,-.45);box(loco,2.35,1.45,1.7,wine,0,2.88,-1.55);box(loco,2.5,.13,1.85,brass,0,3.65,-1.55);
cylinder(loco,1.12,1.12,3.65,emerald,0,2.48,1.15,Math.PI/2);
for(const z of [-.1,.7,1.5,2.25])cylinder(loco,1.145,1.145,.13,brass,0,2.48,z,Math.PI/2);
cylinder(loco,.31,.36,1.12,black,0,3.75,1.55);cylinder(loco,.4,.43,.42,brass,0,4.47,1.55);cylinder(loco,.22,.22,.35,black,0,4.86,1.55);
for(const side of [-1,1]){
 for(let z=-2;z<2.6;z+=.42)for(let y=1.15;y<3.3;y+=.42)cylinder(loco,.045,.045,.07,brass,side*1.54,y,z,0,Math.PI/2,8);
 for(const z of [-1.55,.45,2]){cylinder(loco,.78,.78,.24,black,side*1.58,.82,z,0,Math.PI/2,32);cylinder(loco,.2,.2,.27,brass,side*1.6,.82,z,0,Math.PI/2,20);for(let a=0;a<8;a++){const spoke=box(loco,.07,1.13,.07,brass,side*1.72,.82,z);spoke.rotation.z=a*Math.PI/4;spoke.scale.y=.58}}
 box(loco,.12,1.05,.15,brass,side*1.62,1.02,.35);
}
for(const x of [-.72,.72]){box(loco,.56,.56,.09,glow,x,3.05,-1.12);box(loco,.7,.11,.15,brass,x,3.38,-1.12)}
// Large front lamp, protective cage and metal cowcatcher
cylinder(loco,.52,.52,.48,brass,0,3.45,3.05,Math.PI/2);cylinder(loco,.37,.37,.1,glow,0,3.45,3.32,Math.PI/2);
// Subtle living face on the smokebox: brass-rimmed eyes, warm pupils and a moving blink
const faceEyes=[];
for(const x of [-.39,.39]){
 const rim=new THREE.Mesh(new THREE.SphereGeometry(.205,20,16),brass);rim.position.set(x,2.78,3.12);rim.scale.set(1,.78,.32);loco.add(rim);
 const socket=new THREE.Mesh(new THREE.SphereGeometry(.155,20,16),black);socket.position.set(x,2.78,3.205);socket.scale.set(1,.8,.42);loco.add(socket);
 const pupil=new THREE.Mesh(new THREE.SphereGeometry(.082,18,14),glow);pupil.position.set(x,2.78,3.275);loco.add(pupil);
 const glint=new THREE.Mesh(new THREE.SphereGeometry(.027,10,8),new THREE.MeshBasicMaterial({color:0xffffff}));glint.position.set(x-.022,2.815,3.302);loco.add(glint);
 faceEyes.push({rim,socket,pupil,glint});
}
const browMat=M(0x142a23,.68,.32);
for(const x of [-.39,.39]){const brow=box(loco,.48,.075,.09,browMat,x,3.035,3.16);brow.rotation.z=x<0?-.13:.13;}
const smileCurve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(-.28,2.13,3.19),new THREE.Vector3(0,1.98,3.27),new THREE.Vector3(.28,2.13,3.19));
const smile=new THREE.Mesh(new THREE.TubeGeometry(smileCurve,18,.035,8,false),brass);loco.add(smile);
const lamp=new THREE.SpotLight(0xffd59d,240,95,.52,.42,1);lamp.position.set(0,3.5,3.5);lamp.target.position.set(0,2,-30);loco.add(lamp,lamp.target);
const catcher=new THREE.Group();loco.add(catcher);catcher.position.set(0,.5,3.15);box(catcher,2.65,.18,.8,black,0,0,.35);
for(let i=0;i<11;i++){const rail=box(catcher,.07,.95,.1,brass,-1.22+i*.244,-.3,.62);rail.rotation.x=-.38}
const carriages=[];
for(let i=0;i<3;i++){const car=new THREE.Group();train.add(car);car.position.set(0,0,-5.5-i*5.3);box(car,2.8,2.2,4.8,wine,0,1.55,0);box(car,2.9,.18,4.95,iron,0,2.72,0);for(const side of [-1,1]){box(car,.1,1.7,4.4,brass,side*1.42,1.6,0);for(let z=-1.7;z<=1.8;z+=1.1){box(car,.06,.75,.55,glow,side*1.48,1.9,z);box(car,.08,.1,.65,brass,side*1.51,2.31,z)}}for(const z of [-1.55,1.55])for(const x of [-.95,.95])cylinder(car,.47,.47,.18,black,x,.5,z,0,Math.PI/2,20);carriages.push(car)}
const wheels=[];for(const side of [-1,1])for(const z of [-1.55,.45,2]){const p=new THREE.Group();p.position.set(side*1.6,.82,z);loco.add(p);wheels.push(p)}
// A 3D blast cloud: expanding hot core, shockwave and hundreds of embers
const blast=new THREE.Group();scene.add(blast);blast.visible=false;blast.position.set(0,2.7,11.8);
const core=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),new THREE.MeshBasicMaterial({color:0xffd18b,transparent:true,opacity:0,depthWrite:false}));blast.add(core);
const hot=new THREE.Mesh(new THREE.SphereGeometry(.66,28,22),new THREE.MeshBasicMaterial({color:0xff4b16,transparent:true,opacity:0,depthWrite:false}));blast.add(hot);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.075,12,72),new THREE.MeshBasicMaterial({color:0xffdfac,transparent:true,opacity:0,depthWrite:false}));ring.rotation.x=.35;blast.add(ring);
const aftermath=new THREE.Group();scene.add(aftermath);aftermath.position.set(0,0,11.5);
const fireMats=[0xff5a16,0xff9b22,0xffd05a].map(c=>new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0,depthWrite:false}));
const aftermathFlames=[];
for(let i=0;i<9;i++){const flame=new THREE.Mesh(new THREE.ConeGeometry(.42+(i%3)*.12,1.8+(i%4)*.35,9),fireMats[i%3]);flame.position.set((i-4)*.72,.75+(i%2)*.12,(i%3-1)*.5);flame.rotation.z=(i-4)*.07;aftermath.add(flame);aftermathFlames.push(flame);}
const smokeMat=new THREE.MeshBasicMaterial({color:0x35383b,transparent:true,opacity:0,depthWrite:false});
const aftermathSmoke=[];
for(let i=0;i<7;i++){const puff=new THREE.Mesh(new THREE.SphereGeometry(.85+(i%3)*.22,12,10),smokeMat);puff.position.set((i-3)*.78,2.5+(i%3)*.5,-.4);aftermath.add(puff);aftermathSmoke.push(puff);}
const particles=[];const pGeo=new THREE.SphereGeometry(.1,6,6);
function burst(count,color,speed,life,size,origin=new THREE.Vector3(0,2.7,11.8)){for(let i=0;i<count;i++){const mesh=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95,depthWrite:false}));mesh.position.copy(origin);mesh.scale.setScalar(size*(.5+Math.random()));scene.add(mesh);const v=new THREE.Vector3((Math.random()-.5)*speed,Math.random()*speed*.85,(Math.random()-.5)*speed);particles.push({mesh,v,life,age:0})}}
let start=performance.now(),t=0,phase=0,exploded=false,blastAge=0,shake=0,lookX=0,lookY=0,drag=false,lastX=0,lastY=0;
let soundOn=false,trainStarted=false;
const trainSample=new Audio('https://sfxjar.com/audio/3016.mp3');
const whistleSample=new Audio('https://sfxjar.com/audio/3015.mp3');
const blastSample=new Audio('https://assets.sfx.woven.video/sfx/explosion.wav');
[trainSample,whistleSample,blastSample].forEach(a=>{a.preload='auto';a.volume=.9});
trainSample.loop=false;
function playClip(a,volume=1){if(!soundOn)return;a.pause();a.currentTime=0;a.volume=volume;const p=a.play();if(p&&p.catch)p.catch(()=>{});}
function stopTrain(){trainSample.pause();trainSample.currentTime=0;trainStarted=false;}
function enableSound(){soundOn=true;document.getElementById('sound').textContent='♫ SOUND ON';}
function trainWhistle(){playClip(whistleSample,.9)}
function startTrainSound(){if(!soundOn||trainStarted)return;trainStarted=true;trainSample.volume=.68;trainSample.playbackRate=1;const p=trainSample.play();if(p&&p.catch)p.catch(()=>{trainStarted=false;});}
function boom(){if(!soundOn)return;stopTrain();playClip(blastSample,1);}
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;if(!soundOn){[trainSample,whistleSample,blastSample].forEach(a=>{a.pause();a.currentTime=0});trainStarted=false;document.getElementById('sound').textContent='♫ ENABLE SOUND';}else{document.getElementById('sound').textContent='♫ SOUND ON';}};
function reset(){start=performance.now();t=0;phase=0;exploded=false;blastAge=0;train.visible=true;train.position.set(0,0,-46);train.scale.setScalar(1);blast.visible=false;aftermath.visible=false;aftermathFlames.forEach(f=>f.material.opacity=0);smokeMat.opacity=0;flash.style.opacity='0';shock.style.opacity='0';shock.style.transform='translate(-50%,-50%) scale(.1)';status.textContent='DISTANT WHEELS RATTLE OVER THE TRACKS';particles.forEach(p=>{scene.remove(p.mesh);p.mesh.material.dispose()});particles.length=0;;[trainSample,whistleSample,blastSample].forEach(a=>{a.pause();a.currentTime=0});trainStarted=false;}
document.getElementById('replay').onclick=reset;
function triggerBlast(){exploded=true;train.visible=false;blast.visible=true;blastAge=0;blast.scale.setScalar(.15);core.material.opacity=.98;hot.material.opacity=1;ring.material.opacity=1;burst(240,0xff6a1e,9,3.2,.22);burst(145,0xffd28b,7,2.2,.12);burst(110,0x343a42,4.2,4.6,.32);burst(70,0x8c3320,5,3.4,.2);fireLight.intensity=240;flash.style.opacity='1';shock.style.opacity='1';shake=1;boom()}
function animate(now){requestAnimationFrame(animate);t=(now-start)/1000;
if(t<2.3){train.position.z=-46+t*.8}
else if(t<6.6){const u=(t-2.3)/4.3;train.position.z=-44.2+u*u*30}
else if(t<8.15){const u=(t-6.6)/1.55;train.position.z=-14.2+u*24;train.scale.setScalar(1+u*.2)}
else if(!exploded){triggerBlast()}
if(t>1.8&&phase===0){phase=1;status.textContent='A POWERFUL STEAM WHISTLE ECHOES THROUGH THE FOREST';if(soundOn)trainWhistle()}
if(t>2.35&&phase===1){phase=2;status.textContent='STEEL WHEELS CLATTER AND POUND DOWN THE TRACK';startTrainSound()}
if(t>6.1&&phase===2){phase=3;status.textContent='THE LOCOMOTIVE ROARS CLOSER — FASTER, LOUDER';if(soundOn)trainSample.volume=1;}
if(exploded&&phase===3){phase=4;status.textContent='IMPACT! THE LAST TRAIN ERUPTS IN FIRE AND STEEL'}
if(exploded){blastAge+=.016;const u=Math.min(1,blastAge/1.55);blast.scale.setScalar(.15+u*8);core.material.opacity=Math.max(0,1-blastAge/1.5);hot.material.opacity=Math.max(0,1-blastAge/1.05);ring.scale.setScalar(.2+u*7);ring.material.opacity=Math.max(0,1-blastAge/1.9);flash.style.opacity=String(Math.max(0,.95-blastAge*2.7));shock.style.opacity=String(Math.max(0,1-blastAge/1.8));shock.style.transform='translate(-50%,-50%) scale('+(.1+u*13)+')';fireLight.intensity=Math.max(0,240-blastAge*100);shake=Math.max(0,1-blastAge/1.7)}
// Expressive but restrained eye motion and periodic blinks continue through the entire scene
const blink=.12+Math.pow(Math.max(0,Math.cos(t*1.7)),42)*.88;
faceEyes.forEach((e,i)=>{e.socket.scale.y=.8*blink;e.pupil.scale.y=blink;e.glint.visible=blink>.42;e.pupil.position.x=[-.39,.39][i]+Math.sin(t*.9+i*.4)*.018;});
if(exploded){aftermath.visible=true;aftermathFlames.forEach((f,i)=>{const flicker=.82+.18*Math.sin(t*13+i*2.1);f.scale.set(1,flicker,1);f.material.opacity=.68+.2*Math.sin(t*9+i);f.rotation.z=Math.sin(t*5+i)*.12;});aftermathSmoke.forEach((p,i)=>{const cycle=(t*.28+i*.137)%1;p.position.y=2.1+cycle*5.5;p.position.x=(i-3)*.78+Math.sin(t*.7+i)*.22;p.scale.setScalar(.7+cycle*1.3);smokeMat.opacity=.18;});}
wheels.forEach((w,i)=>w.rotation.x=t*7);carriages.forEach((c,i)=>c.position.y=Math.sin(t*10-i)*.025);
if(exploded&&blastAge>1.1&&Math.random()<.6)burst(2,0xff9a36,2.5,1.6,.12);
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=.016;p.mesh.position.addScaledVector(p.v,.016);p.v.y-=.004;p.v.multiplyScalar(.992);p.mesh.material.opacity=Math.max(0,.95-p.age/p.life);if(p.age>p.life){scene.remove(p.mesh);p.mesh.material.dispose();particles.splice(i,1)}}
const sx=(Math.random()-.5)*shake*.55,sy=(Math.random()-.5)*shake*.42;camera.position.x+=(lookX*.38+sx-camera.position.x)*.045;camera.position.y+=(3.25+lookY*.18+sy-camera.position.y)*.045;camera.lookAt(lookX*.15,2.4+lookY*.1,-13);renderer.render(scene,camera)}
requestAnimationFrame(animate);
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;lookX=Math.max(-5,Math.min(5,lookX-(e.clientX-lastX)*.018));lookY=Math.max(-3,Math.min(3,lookY+(e.clientY-lastY)*.014));lastX=e.clientX;lastY=e.clientY});
renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
reset();
</script>
