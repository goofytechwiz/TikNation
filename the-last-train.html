<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050914"><title>THE TITAN AWAKENS · TikNation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:#f5ead8;font-family:Georgia,serif}#scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 37%,#34465a 0,#172637 33%,#080f1b 70%,#03060c 100%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 18%,#dce8f5 50%,transparent 60%),radial-gradient(1px 1px at 72% 12%,#fff 50%,transparent 60%),radial-gradient(2px 2px at 88% 32%,#c9d8ed 50%,transparent 60%),radial-gradient(1px 1px at 34% 24%,#fff 50%,transparent 60%),radial-gradient(1px 1px at 61% 29%,#fff 50%,transparent 60%);opacity:.65}
.moon{position:absolute;right:13%;top:12%;width:clamp(70px,13vw,140px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffde9,#c5d0d5 54%,#6b7b8c);box-shadow:0 0 55px #b9d9f566,0 0 130px #75a9d344}
.mountains{position:absolute;inset:28% -10% 0;background:#111d2b;clip-path:polygon(0 45%,10% 30%,18% 51%,29% 12%,40% 49%,51% 5%,64% 48%,75% 20%,86% 47%,100% 18%,100% 100%,0 100%)}.mountains.back{inset:38% -10% 0;background:#1d2b38;opacity:.65;clip-path:polygon(0 30%,14% 12%,28% 42%,44% 9%,57% 40%,74% 5%,90% 35%,100% 16%,100% 100%,0 100%)}
.ground{position:absolute;bottom:-5%;left:-10%;width:120%;height:43%;background:linear-gradient(#25313a,#0a1119 55%,#03060a);clip-path:polygon(0 18%,18% 7%,34% 19%,51% 0,70% 14%,86% 5%,100% 20%,100% 100%,0 100%)}
.ruins{position:absolute;bottom:23%;left:8%;width:84%;height:30%;border-bottom:12px solid #0a1119;opacity:.75}
.ruins:before,.ruins:after{content:"";position:absolute;bottom:0;width:12%;height:100%;background:linear-gradient(90deg,#0a1118,#39434a,#0a1118);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}.ruins:before{left:10%}.ruins:after{right:10%}
.colossus{position:absolute;z-index:4;left:50%;bottom:12%;width:min(70vw,430px);height:min(62vh,510px);transform:translate(-50%,0) scale(.38);transform-origin:50% 100%;opacity:0;filter:drop-shadow(0 12px 22px #000)}
.awake .colossus{animation:rise 4.5s cubic-bezier(.2,.72,.2,1) forwards}@keyframes rise{0%{opacity:0;transform:translate(-50%,20%) scale(.38)}12%{opacity:1}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.body{position:absolute;left:50%;bottom:0;width:62%;height:64%;transform:translateX(-50%);background:linear-gradient(90deg,#171e23,#667078 22%,#303a40 49%,#6b7378 78%,#111920);clip-path:polygon(22% 0,78% 0,100% 28%,86% 100%,14% 100%,0 28%);border:3px solid #89939a;box-shadow:inset 0 0 40px #000}
.chest{position:absolute;left:50%;bottom:22%;width:45%;height:35%;transform:translateX(-50%);background:linear-gradient(135deg,#3b464b,#111a20 52%,#59636a);clip-path:polygon(10% 0,90% 0,100% 75%,50% 100%,0 75%);border:2px solid #89979e}
.crack{position:absolute;left:50%;bottom:36%;width:3px;height:26%;background:#7feaff;box-shadow:0 0 10px 4px #42caff,0 0 28px 8px #2b8dff;transform:rotate(18deg);opacity:0}
.awake .crack{animation:ignite .8s 3.8s forwards}@keyframes ignite{to{opacity:1}}
.head{position:absolute;left:50%;bottom:62%;width:40%;height:28%;transform:translateX(-50%);background:linear-gradient(90deg,#11191f,#657078 28%,#343e45 70%,#10171d);clip-path:polygon(18% 0,82% 0,100% 40%,82% 100%,18% 100%,0 40%);border:3px solid #89959b}
.crest{position:absolute;left:50%;bottom:83%;width:55%;height:18%;transform:translateX(-50%);background:linear-gradient(#9ca6aa,#39454c);clip-path:polygon(0 100%,18% 0,32% 75%,50% 0,68% 75%,82% 0,100% 100%)}
.eye{position:absolute;top:42%;width:22%;height:9%;background:#73eaff;box-shadow:0 0 10px 5px #2bcaff,0 0 34px 12px #188dff;border-radius:40%}.eye.left{left:17%}.eye.right{right:17%}
.arm{position:absolute;bottom:5%;width:22%;height:60%;background:linear-gradient(90deg,#10171c,#59646a,#1c252b);clip-path:polygon(25% 0,85% 8%,100% 100%,0 100%)}.arm.left{left:2%;transform:rotate(13deg)}.arm.right{right:2%;transform:rotate(-13deg)}
.fist{position:absolute;bottom:0;width:20%;height:15%;background:linear-gradient(135deg,#69747a,#182128);border-radius:22% 22% 35% 35%;border:2px solid #87949a}.fist.left{left:0}.fist.right{right:0}
.rune{position:absolute;width:5px;height:70px;background:#7be9ff;box-shadow:0 0 15px 5px #3ac9ff;opacity:0;animation:runePulse 1.2s infinite alternate}.rune.r1{left:29%;top:43%;transform:rotate(30deg)}.rune.r2{right:29%;top:43%;transform:rotate(-30deg)}.rune.r3{left:49%;top:68%;height:48px}@keyframes runePulse{to{opacity:.9;filter:brightness(1.8)}}
.shockwave{position:absolute;z-index:6;left:50%;bottom:11%;width:20px;height:20px;border:4px solid #a6edff;border-radius:50%;transform:translate(-50%,50%) scale(.1);opacity:0;box-shadow:0 0 24px #4bd8ff}
.awake .shockwave{animation:wave 1.5s 4.3s ease-out forwards}@keyframes wave{0%{opacity:1;transform:translate(-50%,50%) scale(.1)}100%{opacity:0;transform:translate(-50%,50%) scale(42)}}
.lightning{position:absolute;z-index:2;inset:0;opacity:0;background:linear-gradient(115deg,transparent 48%,#dffaff 49%,#75d9ff 49.2%,transparent 50%);filter:drop-shadow(0 0 15px #72dfff)}
.awake .lightning{animation:storm .8s 3.4s 2}@keyframes storm{0%,100%{opacity:0}20%{opacity:.85}40%{opacity:.1}60%{opacity:.65}}
.hud{position:fixed;z-index:9;top:env(safe-area-inset-top,0px);left:0;right:0;text-align:center;padding:18px 10px;text-shadow:0 2px 15px #000}.kicker{font:10px Arial;letter-spacing:.42em;color:#80ddf6}.title{font-size:clamp(29px,7vw,58px);letter-spacing:.15em;margin:6px;color:#f1f7fa}.sub{font:9px Arial;letter-spacing:.28em;color:#b5cbd6}
#status{position:fixed;z-index:9;bottom:95px;left:0;right:0;text-align:center;font:10px Arial;letter-spacing:.17em;color:#a8eaff;text-shadow:0 2px 12px #000;padding:0 12px}
.controls{position:fixed;z-index:20;bottom:calc(15px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px}.controls button{border:1px solid #6dcce8;border-radius:3px;background:#0b1721ee;color:#d9f7ff;padding:13px 18px;font:10px Arial;letter-spacing:.14em}
#flash{position:fixed;z-index:12;inset:0;background:#e4fbff;opacity:0;pointer-events:none}.awake #flash{animation:flash .32s 3.5s}@keyframes flash{0%,100%{opacity:0}15%{opacity:.85}}
#embers{position:fixed;inset:0;z-index:8;pointer-events:none}.ember{position:absolute;left:50%;top:62%;width:4px;height:4px;border-radius:50%;background:#baf5ff;box-shadow:0 0 12px 4px #3acaff;animation:fly 1.7s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}
@media(max-height:520px){.hud{padding:5px}.title{font-size:25px}.sub{display:none}.colossus{height:52vh}#status{bottom:65px}.controls{bottom:4px}}
</style></head><body><div id="scene"><div class="stars"></div><div class="moon"></div><div class="mountains back"></div><div class="mountains"></div><div class="ruins"></div><div class="ground"></div><div class="lightning"></div>
<div class="colossus"><div class="body"></div><div class="arm left"></div><div class="arm right"></div><div class="fist left"></div><div class="fist right"></div><div class="chest"></div><div class="crack"></div><div class="head"><div class="eye left"></div><div class="eye right"></div><div class="crest"></div></div><i class="rune r1"></i><i class="rune r2"></i><i class="rune r3"></i></div><div class="shockwave"></div></div>
<div class="hud"><div class="kicker">TIKNATION · ORIGINAL MYTHIC GIFT</div><div class="title">THE TITAN AWAKENS</div><div class="sub">AN ANCIENT POWER STIRS BENEATH THE MOUNTAIN</div></div><div id="status">THE MOUNTAIN BEGINS TO SHAKE</div><div id="flash"></div><div id="embers"></div>
<div class="controls"><button id="replay">↻ REPLAY</button><button id="sound">♫ ENABLE SOUND</button></div>
<script>
(()=>{const body=document.body,status=document.getElementById('status'),embers=document.getElementById('embers'),soundBtn=document.getElementById('sound');let ctx=null,master=null,on=false,ids=[],run=0;
function audio(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination)}return ctx.resume()}
function osc(freq,type,vol,dur,end){const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);if(end)o.frequency.exponentialRampToValueAtTime(end,ctx.currentTime+dur);f.type='lowpass';f.frequency.value=type==='sawtooth'?500:900;g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.linearRampToValueAtTime(vol,ctx.currentTime+.12);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(f);f.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+dur+.05)}
function rumble(){if(!on)return;const n=ctx.createBufferSource(),b=ctx.createBuffer(1,ctx.sampleRate*2.8,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);n.buffer=b;const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='lowpass';f.frequency.value=135;g.gain.value=1.1;n.connect(f);f.connect(g);g.connect(master);n.start();osc(42,'sawtooth',.5,2.1,23);osc(76,'triangle',.28,1.4,30)}
function growl(){if(!on)return;osc(92,'sawtooth',.2,1.9,38);osc(47,'triangle',.28,2.4,29);osc(160,'sawtooth',.09,1.5,70)}
function scatter(){embers.innerHTML='';for(let i=0;i<90;i++){const e=document.createElement('i');e.className='ember';const a=Math.random()*Math.PI*2,d=90+Math.random()*Math.max(innerWidth,innerHeight)*.6;e.style.setProperty('--x',Math.cos(a)*d+'px');e.style.setProperty('--y',Math.sin(a)*d+'px');e.style.animationDelay=Math.random()*.2+'s';embers.appendChild(e)}}
function later(fn,ms,id){ids.push(setTimeout(()=>{if(id===run)fn()},ms))}
function start(){run++;const id=run;ids.forEach(clearTimeout);ids=[];body.classList.remove('awake');void body.offsetWidth;body.classList.add('awake');embers.innerHTML='';status.textContent='THE MOUNTAIN BEGINS TO SHAKE';later(()=>{status.textContent='STONE CRACKS… SOMETHING IS WAKING';if(on)rumble()},1200,id);later(()=>{status.textContent='ANCIENT EYES IGNITE IN THE DARK';if(on)growl()},3200,id);later(()=>{status.textContent='THE TITAN RISES';if(on){osc(220,'sawtooth',.16,1.6,65);osc(110,'triangle',.22,1.8,36)}scatter()},4300,id);later(()=>{status.textContent='THE EARTH SHATTERS';if(on)rumble();scatter()},5100,id);later(()=>{status.textContent='THE TITAN HAS AWAKENED';},7300,id)}
document.getElementById('replay').addEventListener('click',start);soundBtn.addEventListener('click',async()=>{try{on=true;await audio();osc(220,'sine',.3,.25,150);soundBtn.textContent='♫ SOUND ON · REPLAY';start()}catch(e){soundBtn.textContent='♫ TAP TO ENABLE SOUND'}});start();
})();
</script></body></html>
