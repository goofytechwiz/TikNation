function reset(){elapsed=0;phase=0;exploded=false;started=performance.now();whistlePlayed=false;train.visible=true;train.position.z=-53;ticket.visible=false;ticket.position.set(0,2,-13);shockRings.forEach(x=>scene.remove(x.mesh));shockRings=[];debris.forEach(x=>scene.remove(x.mesh));debris=[];flash.style.opacity=0;screenHit.style.opacity=0;screenHit.style.transform='scale(1.15)';camera.fov=48;camera.updateProjectionMatrix();warm.intensity=45;stopAudio();status.textContent='A HEADLIGHT GLOWS DEEP INSIDE THE TUNNEL'}
document.getElementById('replay').addEventListener('click',reset);
document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;if(soundOn){audioSetup();soundCtx.resume();document.getElementById('sound').textContent='♫ SOUND ON';playWhistle();if(phase>=2&&phase<4)startEngine()}else{stopAudio();document.getElementById('sound').textContent='♫ ENABLE SOUND'}});
function animate(now){requestAnimationFrame(animate);elapsed=(now-started)/1000;const t=elapsed;
if(t<1.15){train.position.z=-53;train.position.y=0;train.scale.setScalar(1);camera.fov=48}
else if(t<6.35&&!exploded){const p=(t-1.15)/5.2;const eased=p*p*p;train.position.z=-53+65.2*eased;const closeIn=Math.max(0,(p-.62)/.38);train.scale.setScalar(1+closeIn*1.45);camera.fov=48-closeIn*13;camera.updateProjectionMatrix();train.position.y=Math.sin(t*19)*.055}
else if(!exploded){train.position.z=12.2;train.scale.setScalar(2.45);camera.fov=31;camera.updateProjectionMatrix();train.position.y=0}
if(t>1.0&&phase===0){phase=1;status.textContent='THE WHISTLE ECHOES THROUGH THE TUNNEL';playWhistle()}
if(t>1.65&&phase===1){phase=2;status.textContent='THE BLACK LOCOMOTIVE RUSHES OUT OF THE TUNNEL';startEngine()}
if(t>3.0&&phase===2){phase=3;status.textContent='IT IS RACING STRAIGHT INTO THE SCREEN'}
if(engineOn&&soundCtx){const approach=Math.max(0,Math.min(1,(t-1.65)/4.7));const swell=.65+approach*1.7;if(trackClackGain)trackClackGain.gain.setTargetAtTime(.085*swell,soundCtx.currentTime,.12);if(trackRushGain)trackRushGain.gain.setTargetAtTime(.055*swell,soundCtx.currentTime,.16);}
if(t>6.35&&!exploded){explode();}
// Natural eye tracking, expressive brows, occasional blinks and a speaking/whistling mouth
const blinkA=Math.pow(Math.max(0,Math.cos(t*.73+1.1)),90),blinkB=Math.pow(Math.max(0,Math.cos(t*.73+1.1)),90);
eyes.forEach((eye,i)=>{eye.scale.y=.82*(1-.94*(i===0?blinkA:blinkB));});
pupils.forEach((p,i)=>{p.position.x=(i===0?-.32:.32)+Math.sin(t*.85)*.035;p.position.y=.105+Math.sin(t*1.4)*.018;});
brows.forEach((b,i)=>{b.position.y=.27+Math.sin(t*1.2+i*.5)*.025;b.rotation.z=(i===0?-.12:Math.PI+.12)+Math.sin(t*.8)*.07;});
const talk=(Math.sin(t*5.1)+Math.sin(t*2.7))*.5;mouth.scale.y=.055+Math.max(0,talk)*.16;mouthInner.scale.y=.012+Math.max(0,talk)*.045;
faceGroup.rotation.y=Math.sin(t*.48)*.045;faceGroup.rotation.x=Math.sin(t*.9)*.025;
wheels.forEach((w)=>w.rotation.x=t*3.8);cars.forEach((c,i)=>{c.position.y=Math.sin(t*5-i)*.015});
if(Math.random()<.65&&t>1.3&&t<11){const e=steamEmitters[Math.floor(Math.random()*steamEmitters.length)].clone();e.add(train.position);burst(e,2,0xc6d0d5,.4,2.4,.18)}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=.016;p.m.position.addScaledVector(p.v,.016);p.v.y+=.003;p.m.material.opacity=Math.max(0,.65-p.age/p.life);p.m.scale.multiplyScalar(1.004);if(p.age>p.life){scene.remove(p.m);p.m.material.dispose();particles.splice(i,1)}}
const targetX=lookX*.35,targetY=4.5+lookY*.18;camera.position.x+=(targetX-camera.position.x)*.045;camera.position.y+=(targetY-camera.position.y)*.045;camera.position.z=14;
const impactAge=exploded?(now-impactTime)/1000:0;const shake=exploded?Math.max(0,1-impactAge/1.65):0;
const shakeX=(Math.sin(now*.071)+Math.sin(now*.133))*1.55*shake;
const shakeY=(Math.cos(now*.083)+Math.sin(now*.157))*1.15*shake;
camera.position.x+=shakeX;camera.position.y+=shakeY;
const aimZ=exploded?train.position.z+2.4:Math.min(-8,train.position.z+2.4);
const aimY=exploded?2.7:2.1;
camera.lookAt(lookX*.12+shakeX*1.8,aimY+lookY*.1+shakeY*1.8,aimZ);
if(exploded){const age=impactAge;flash.style.opacity=String(Math.max(0,1-age*2.7));flash.style.background='radial-gradient(circle at 50% 52%, #fff9df 0%, #ffd08a 22%, #ff7a24 48%, rgba(30,8,0,0) 100%)';screenHit.style.opacity=String(Math.max(0,1-age*1.5));screenHit.style.transform='scale('+(1+age*.2)+')';warm.intensity=Math.max(0,220-age*95);if(age>.18)train.visible=false}
for(let i=shockRings.length-1;i>=0;i--){const r=shockRings[i];r.age+=.016;r.mesh.scale.setScalar(1+r.age*8);r.mesh.material.opacity=Math.max(0,.95-r.age*.8);if(r.age>1.2){scene.remove(r.mesh);r.mesh.geometry.dispose();r.mesh.material.dispose();shockRings.splice(i,1)}}
for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.age+=.016;d.mesh.position.addScaledVector(d.v,.016);d.v.y-=.11;d.mesh.rotation.x+=.12;d.mesh.rotation.z+=.09;if(d.age>2.2){scene.remove(d.mesh);d.mesh.geometry.dispose();d.mesh.material.dispose();debris.splice(i,1)}}
renderer.render(scene,camera)}

requestAnimationFrame(animate);
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;lookX=Math.max(-5,Math.min(5,lookX-(e.clientX-lastX)*.018));lookY=Math.max(-3,Math.min(3,lookY+(e.clientY-lastY)*.014));lastX=e.clientX;lastY=e.clientY});
renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
reset();
</script>
</body></html>
