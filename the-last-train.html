<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03111b"><title>ABYSSAL · TikNation Mythic Gift</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03111b;color:#effaff;font-family:Georgia,serif}
#scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#31576a 0,#102d3b 35%,#04141f 72%,#01080e 100%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(#c5efff 1px,transparent 1.8px),radial-gradient(#8bcde2 1px,transparent 2px);background-size:83px 91px,137px 127px;background-position:10px 12px,55px 38px;opacity:.42}
.moon{position:absolute;width:clamp(90px,18vw,180px);height:clamp(90px,18vw,180px);border-radius:50%;left:calc(50% - 7vw);top:8%;background:radial-gradient(circle at 35% 35%,#f4ffff,#a9e4e9 48%,#548b9a 75%,#315361);box-shadow:0 0 35px #9defff,0 0 110px #4ab7d0;opacity:.9}
.horizon{position:absolute;left:-10%;right:-10%;height:35%;bottom:18%;background:linear-gradient(180deg,#0d3545aa,#041923);clip-path:polygon(0 36%,10% 25%,22% 34%,36% 19%,50% 32%,65% 17%,79% 33%,90% 22%,100% 35%,100% 100%,0 100%)}
.sea{position:absolute;left:-20%;right:-20%;height:42%;bottom:-12%;background:repeating-linear-gradient(176deg,transparent 0 16px,#3e91a4 17px,#0a3949 20px,transparent 24px 42px),linear-gradient(#0b4355,#03131d 72%);border-radius:48% 52% 0 0/12% 15% 0 0;animation:sea 4s ease-in-out infinite alternate}
@keyframes sea{to{transform:translateY(-12px) scaleX(1.025)}}
.ship{position:absolute;z-index:2;bottom:24%;left:12%;width:18%;height:10%;background:linear-gradient(#152d37,#030b10);clip-path:polygon(0 0,100% 0,82% 78%,18% 78%);filter:drop-shadow(0 0 8px #071016);opacity:.9}
.ship:before{content:"";position:absolute;left:45%;top:-100%;width:3px;height:120%;background:#c3e5e9}
.ship:after{content:"";position:absolute;left:46%;top:-94%;width:34%;height:55%;background:#b8dce0;clip-path:polygon(0 0,100% 50%,0 100%)}
.kraken{position:absolute;z-index:4;left:50%;top:47%;width:min(76vw,650px);height:min(66vh,530px);transform:translate(-50%,100%) scale(.65);opacity:0;filter:drop-shadow(0 20px 35px #000)}
.kraken.rise{animation:rise 3.1s cubic-bezier(.15,.7,.18,1) forwards}
@keyframes rise{0%{transform:translate(-50%,100%) scale(.65);opacity:0}65%{opacity:1}100%{transform:translate(-50%,-4%) scale(1);opacity:1}}
.mantle{position:absolute;left:30%;top:7%;width:40%;height:48%;border-radius:48% 48% 40% 40% / 58% 58% 35% 35%;background:radial-gradient(ellipse at 35% 22%,#91b9ad 0,#477e79 19%,#174b4d 45%,#082b34 75%,#03151d);border:2px solid #75b7ae55;box-shadow:inset -20px -15px 30px #010b12,inset 12px 8px 22px #b2e7cf55,0 0 55px #36d3c455}
.mantle:before{content:"";position:absolute;inset:12% 14%;border-radius:50%;background:repeating-linear-gradient(105deg,transparent 0 16px,#a3d7c51e 17px 20px,transparent 22px 34px);filter:blur(1px)}
.eye{position:absolute;top:42%;width:10%;height:5%;border-radius:50%;background:#c9fff3;box-shadow:0 0 12px 5px #70ffdf,0 0 34px 13px #1affc6;animation:blink 5s infinite}
.eye.one{left:29%}.eye.two{right:29%}
@keyframes blink{0%,46%,51%,100%{transform:scaleY(1)}48%,49%{transform:scaleY(.08)}}
.beak{position:absolute;left:44%;top:51%;width:12%;height:14%;background:linear-gradient(130deg,#b5d6c2,#214e4a 65%,#061c22);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 0 8px #a4ffe0)}
.tentacle{position:absolute;top:36%;width:23%;height:76%;border:clamp(17px,3.2vw,31px) solid #16494a;border-top-color:#6aa89a;border-bottom-color:#041b24;border-radius:50% 50% 48% 48%;box-shadow:inset 4px 0 9px #a8ddbd66,0 0 13px #31bba955;transform-origin:50% 0}
.tentacle:after{content:"";position:absolute;inset:8px;border-radius:inherit;border-left:7px dotted #b5f4cf88;filter:drop-shadow(0 0 5px #72ffdc)}
.t1{left:5%;transform:rotate(37deg);animation:curl1 2.7s 2.2s ease-in-out both}.t2{left:23%;transform:rotate(13deg);animation:curl2 2.9s 2.2s ease-in-out both}.t3{right:23%;transform:rotate(-13deg);animation:curl3 2.9s 2.2s ease-in-out both}.t4{right:5%;transform:rotate(-37deg);animation:curl4 2.7s 2.2s ease-in-out both}
@keyframes curl1{from{translate:0 90px;rotate:15deg}to{translate:-20px 0;rotate:-5deg}}@keyframes curl2{from{translate:0 100px;rotate:12deg}to{translate:-12px -5px;rotate:-8deg}}@keyframes curl3{from{translate:0 100px;rotate:-12deg}to{translate:12px -5px;rotate:8deg}}@keyframes curl4{from{translate:0 90px;rotate:-15deg}to{translate:20px 0;rotate:5deg}}
.splash{position:absolute;z-index:5;left:50%;bottom:18%;width:8px;height:8px;border:3px solid #bafff5;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}
.splash.hit{animation:shock 1.2s ease-out 3.2s 2}
@keyframes shock{0%{width:8px;height:8px;opacity:1}100%{width:110vw;height:70vh;opacity:0;border-width:1px}}
.lightning{position:absolute;z-index:6;inset:0;background:#d7ffff;opacity:0;pointer-events:none}.lightning.flash{animation:flash .55s 3.1s ease-out}
@keyframes flash{0%,40%,70%,100%{opacity:0}10%,55%{opacity:.6}}
.particles{position:absolute;z-index:6;inset:0;pointer-events:none;background-image:radial-gradient(circle,#baffef 1px,transparent 2px),radial-gradient(circle,#54d9d2 2px,transparent 3px);background-size:71px 83px,113px 97px;opacity:0}.particles.on{animation:drift 5s 3s ease-out forwards}
@keyframes drift{0%{opacity:0;transform:translateY(80px)}30%{opacity:.9}100%{opacity:.1;transform:translateY(-110px)}}
.hud{position:absolute;z-index:10;top:env(safe-area-inset-top,12px);left:0;right:0;text-align:center;padding:18px 12px;pointer-events:none;text-shadow:0 2px 14px #000}
.kicker{font:700 10px Arial,sans-serif;letter-spacing:.42em;color:#9ee9e3}.title{font-size:clamp(25px,6vw,48px);letter-spacing:.11em;margin:8px 0;color:#f1ffff}.sub{font:11px Arial,sans-serif;letter-spacing:.2em;color:#a7d6d5}
.controls{position:absolute;z-index:12;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px;padding:0 12px}
button{border:1px solid #8cebe0aa;background:#062733dd;color:#eaffff;border-radius:30px;padding:12px 18px;font:700 11px Arial,sans-serif;letter-spacing:.12em;backdrop-filter:blur(8px)}
#status{position:absolute;z-index:10;bottom:78px;left:0;right:0;text-align:center;font:10px Arial,sans-serif;letter-spacing:.2em;color:#b5e9e5;text-shadow:0 2px 8px #000}
@media(max-height:520px){.kraken{height:75vh;width:min(70vw,600px);top:40%}.hud{padding:7px}.title{font-size:25px}.controls{bottom:8px}#status{bottom:62px}}
</style></head>
<body><main id="scene">
<div class="stars"></div><div class="moon"></div><div class="horizon"></div><div class="ship"></div><div class="sea"></div>
<div class="kraken" id="kraken"><div class="tentacle t1"></div><div class="tentacle t2"></div><div class="tentacle t3"></div><div class="tentacle t4"></div><div class="mantle"><i class="eye one"></i><i class="eye two"></i><i class="beak"></i></div></div>
<div class="splash" id="splash"></div><div class="lightning" id="lightning"></div><div class="particles" id="particles"></div>
<header class="hud"><div class="kicker">TIKNATION · ORIGINAL MYTHIC GIFT</div><div class="title">ABYSSAL</div><div class="sub">SOMETHING ANCIENT IS RISING</div></header>
<div id="status">THE OCEAN FALLS SILENT…</div>
<div class="controls"><button id="sound">♫ ENABLE SOUND</button><button id="replay">↻ SUMMON AGAIN</button></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let audio=null,enabled=false,timers=[];
function clear(){timers.forEach(clearTimeout);timers=[]}
function tone(freq,dur,type='sine',gain=.08,slide=0){if(!audio||!enabled)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),audio.currentTime+dur);g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function rumble(){if(!enabled)return;const n=audio.createBufferSource(),len=audio.sampleRate*2.5,b=audio.createBuffer(1,len,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);n.buffer=b;const f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=150;const g=audio.createGain();g.gain.value=.55;n.connect(f);f.connect(g);g.connect(audio.destination);n.start()}
function play(){clear();$('kraken').className='kraken';$('splash').className='splash';$('lightning').className='lightning';$('particles').className='particles';$('status').textContent='THE OCEAN FALLS SILENT…';void $('kraken').offsetWidth;timers.push(setTimeout(()=>{$('status').textContent='A SHADOW MOVES BELOW THE SURFACE';rumble()},450));timers.push(setTimeout(()=>{$('status').textContent='TENTACLES BREAK THE WATER';tone(58,2,'sawtooth',.15,-35)},1500));timers.push(setTimeout(()=>{$('kraken').classList.add('rise');tone(42,2.4,'triangle',.25,-18);tone(110,1.5,'sine',.1,-65)},2100));timers.push(setTimeout(()=>{$('status').textContent='THE DEEP HAS OPENED ITS EYES';tone(520,.7,'sine',.1,-250);tone(660,.9,'sine',.08,-300)},4000));timers.push(setTimeout(()=>{$('lightning').classList.add('flash');$('splash').classList.add('hit');$('particles').classList.add('on');$('status').textContent='THE ABYSSAL HAS AWAKENED';rumble();tone(48,1.8,'sawtooth',.32,-25)},4900))}
$('sound').addEventListener('click',async()=>{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();await audio.resume();enabled=!enabled;$('sound').textContent=enabled?'♫ SOUND ON':'♫ ENABLE SOUND';if(enabled)tone(260,.2,'sine',.06);});$('replay').addEventListener('click',play);play();
})();
</script></body></html>
