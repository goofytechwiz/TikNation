<style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const mount=document.getElementById('stage'),status=document.getElementById('status'),flash=document.getElementById('flash'),cracks=document.getElementById('cracks');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070d17);scene.fog=new THREE.FogExp2(0x101a28,.018);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,220);camera.position.set(0,5.3,17);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bb7d4,0x171018,1.05));
const moon=new THREE.DirectionalLight(0x91b8e8,2.4);moon.position.set(-12,18,-30);moon.castShadow=true;scene.add(moon);
const ambient=new THREE.PointLight(0x3477a8,12,70);ambient.position.set(0,8,-30);scene.add(ambient);
const brass=new THREE.MeshStandardMaterial({color:0xb07b3c,metalness:.78,roughness:.3}),iron=new THREE.MeshStandardMaterial({color:0x111820,metalness:.86,roughness:.29}),black=new THREE.MeshStandardMaterial({color:0x05090e,metalness:.55,roughness:.38}),crimson=new THREE.MeshStandardMaterial({color:0x4a1719,metalness:.42,roughness:.42}),goldGlass=new THREE.MeshStandardMaterial({color:0xffc36b,emissive:0xff8b27,emissiveIntensity:2.4,roughness:.2}),stone=new THREE.MeshStandardMaterial({color:0x303b49,roughness:.95});
function block(parent,w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cylinder(parent,r1,r2,len,m,x,y,z,rx=0,rz=0){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,28),m);o.position.set(x,y,z);o.rotation.set(rx,0,rz);o.castShadow=true;parent.add(o);return o}
const floor=block(scene,100,.4,170,new THREE.MeshStandardMaterial({color:0x111923,roughness:1}),0,-.5,-42);
const railMat=new THREE.MeshStandardMaterial({color:0x65717b,metalness:.85,roughness:.28});
for(const x of [-1.45,1.45])block(scene,.18,.22,150,railMat,x,-.16,-39);
for(let z=-115;z<25;z+=1.65)block(scene,4.5,.18,.38,new THREE.MeshStandardMaterial({color:0x33271f,roughness:1}),0,-.22,z);
// New environment: broken stone cut, iron signal gantries, lamps and storm-lit pines
for(let side of [-1,1]){
 for(let i=0;i<17;i++){const z=-105+i*6.5,h=5+Math.random()*8,x=side*(7+Math.random()*8);const cliff=block(scene,2+Math.random()*3,h,5+Math.random()*5,stone,x,h/2-0.3,z);cliff.rotation.z=(Math.random()-.5)*.12}
 for(let i=0;i<12;i++){const z=-95+i*8,x=side*(5.5+Math.random()*5),h=4+Math.random()*5;const trunk=cylinder(scene,.12,.22,h*.45,new THREE.MeshStandardMaterial({color:0x211d1b}),x,h*.22,z);for(let j=0;j<3;j++){const cone=new THREE.Mesh(new THREE.ConeGeometry(1.5-j*.3,h*.36,7),new THREE.MeshStandardMaterial({color:0x101e27,roughness:1}));cone.position.set(x,h*.4+j*h*.2,z);scene.add(cone)}}
}
for(let z=-82;z<-8;z+=22){for(let side of [-1,1]){const post=block(scene,.22,5,.22,iron,side*4.8,2.4,z);block(scene,10,.18,.2,iron,0,4.85,z);const lamp=new THREE.PointLight(0xff9a45,5,13,2);lamp.position.set(side*4.5,4.2,z);scene.add(lamp);const globe=new THREE.Mesh(new THREE.SphereGeometry(.18,12,12),goldGlass);globe.position.copy(lamp.position);scene.add(globe)}}
// Tunnel portal with a deep black throat and illuminated stone ribs
const portal=new THREE.Group();portal.position.set(0,0,-49);scene.add(portal);
block(portal,11,1,2.2,stone,0,7.1,0);block(portal,2.1,7,2.2,stone,-4.4,3.5,0);block(portal,2.1,7,2.2,stone,4.4,3.5,0);
const arch=new THREE.Mesh(new THREE.TorusGeometry(3.15,.52,14,48,Math.PI),stone);arch.position.set(0,3.5,-.05);arch.rotation.z=Math.PI;arch.scale.y=1.12;portal.add(arch);
block(portal,6.2,6.3,.25,new THREE.MeshBasicMaterial({color:0x02050a}),0,3.2,-.5);
for(let i=0;i<6;i++){const rib=block(portal,.09,6.3,.13,brass,-2.5+i,3.2,.16);rib.material=brass}
// Locomotive: rebuilt proportions, front plate, smokestack, side rods, animated face
const train=new THREE.Group();scene.add(train);train.position.set(0,0,-66);
const loco=new THREE.Group();train.add(loco);
block(loco,2.9,1.7,4.8,iron,0,1.55,-.35);block(loco,2.25,1.65,1.7,crimson,0,3.12,-1.55);block(loco,2.45,.16,1.85,brass,0,3.98,-1.55);
cylinder(loco,1.08,1.08,3.7,iron,0,2.65,1.15,Math.PI/2);cylinder(loco,1.01,1.01,.18,brass,0,2.65,3.03,Math.PI/2);cylinder(loco,.83,.83,.13,black,0,2.65,3.18,Math.PI/2);
const face=new THREE.Group();face.position.set(0,2.65,3.27);loco.add(face);
const faceWhite=new THREE.MeshStandardMaterial({color:0xe9e2d2,roughness:.3}),eyeDark=new THREE.MeshStandardMaterial({color:0x080c12});
const eyes=[],pupils=[],brows=[];
for(const x of [-.34,.34]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.2,20,16),faceWhite);eye.scale.set(1,.84,.4);eye.position.set(x,.13,.04);face.add(eye);eyes.push(eye);const pupil=new THREE.Mesh(new THREE.SphereGeometry(.085,16,12),eyeDark);pupil.position.set(x,.12,.19);face.add(pupil);pupils.push(pupil);const brow=new THREE.Mesh(new THREE.TorusGeometry(.22,.045,8,22,Math.PI),brass);brow.position.set(x,.3,.03);brow.rotation.z=x<0?-.1:Math.PI+.1;face.add(brow);brows.push(brow)}
const mouth=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),eyeDark);mouth.position.set(0,-.28,.08);mouth.scale.set(.22,.06,.04);face.add(mouth);
cylinder(loco,.32,.38,1.2,black,0,3.9,1.5);cylinder(loco,.45,.45,.5,brass,0,4.7,1.5);cylinder(loco,.25,.25,.38,black,0,5.15,1.5);
const headlamp=cylinder(loco,.38,.42,.5,brass,0,3.55,3.05,Math.PI/2);cylinder(loco,.28,.28,.1,goldGlass,0,3.55,3.34,Math.PI/2);
const headLight=new THREE.SpotLight(0xffc477,170,65,.38,.55,1.2);headLight.position.set(0,3.6,3.5);headLight.target.position.set(0,1,-15);loco.add(headLight,headLight.target);
const wheels=[],rods=[];
for(const side of [-1,1]){for(const z of [-1.65,.25,1.95]){const w=cylinder(loco,.77,.77,.24,black,side*1.5,.82,z,0,Math.PI/2);wheels.push(w);cylinder(loco,.18,.18,.28,brass,side*1.52,.82,z,0,Math.PI/2);for(let k=0;k<8;k++){const spoke=block(loco,.065,1.1,.07,brass,side*1.66,.82,z);spoke.rotation.z=k*Math.PI/4;wheels.push(spoke)}}const rod=block(loco,.11,.13,4.2,brass,side*1.67,.82,.2);rods.push(rod)}
for(const x of [-.75,.75]){block(loco,.58,.58,.1,goldGlass,x,3.18,-1.15);block(loco,.7,.12,.18,brass,x,3.53,-1.15)}
const cars=[];
for(let n=0;n<3;n++){const car=new THREE.Group();train.add(car);car.position.z=-5.8-n*5.5;block(car,2.8,2.05,5,crimson,0,1.62,0);block(car,2.92,.18,5.12,iron,0,2.72,0);block(car,2.85,.14,5.05,brass,0,.55,0);for(const side of [-1,1]){block(car,.09,1.65,4.7,brass,side*1.42,1.7,0);for(let z=-1.7;z<=1.8;z+=1.15)block(car,.08,.68,.65,goldGlass,side*1.48,1.9,z)}for(let z of [-1.7,1.7])for(let x of [-1,1])cylinder(car,.43,.43,.2,black,x,.48,z,0,Math.PI/2);cars.push(car)}
// Floating embers, smoke and rain
const particles=[];function puff(origin,count,color,speed,life,size){for(let i=0;i<count;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(size*(.45+Math.random()),6,6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));m.position.copy(origin);scene.add(m);particles.push({m,v:new THREE.Vector3((Math.random()-.5)*speed,Math.random()*speed,(Math.random()-.5)*speed),life,age:0})}}
const rainGeo=new THREE.BufferGeometry(),rainCount=800,rainPos=new Float32Array(rainCount*3);for(let i=0;i<rainCount;i++){rainPos[i*3]=(Math.random()-.5)*55;rainPos[i*3+1]=Math.random()*22;rainPos[i*3+2]=-100+Math.random()*115}rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0x9ebbd1,size:.045,transparent:true,opacity:.4}));scene.add(rain);
let soundOn=false,ctx=null,master=null,engine=[],engineOn=false,whistleDone=false,elapsed=0,started=performance.now(),exploded=false,impactAt=0,phase=0;
function audio(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.85;master.connect(ctx.destination)}
function tone(freq,type,gain,duration,slide){const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ctx.currentTime+duration);f.type='lowpass';f.frequency.value=type==='sawtooth'?1700:650;g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.linearRampToValueAtTime(gain,ctx.currentTime+.12);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.connect(f);f.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+duration+.03)}
function whistle(){if(!soundOn||!ctx||whistleDone)return;whistleDone=true;tone(390,'sawtooth',.18,2.7,350);tone(520,'sawtooth',.16,2.7,475);tone(780,'sawtooth',.09,2.7,710);const n=ctx.createBufferSource(),b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.2;n.buffer=b;const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.frequency.value=1050;g.gain.value=.055;n.connect(f);f.connect(g);g.connect(master);n.start();n.stop(ctx.currentTime+1.8)}
function engineStart(){if(!soundOn||!ctx||engineOn)return;engineOn=true;const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type='triangle';o.frequency.value=43;f.type='lowpass';f.frequency.value=155;g.gain.value=.24;o.connect(f);f.connect(g);g.connect(master);o.start();engine.push(o,g,f);const n=ctx.createBufferSource(),buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.5;n.buffer=buf;n.loop=true;const nf=ctx.createBiquadFilter(),ng=ctx.createGain();nf.type='lowpass';nf.frequency.value=380;ng.gain.value=.13;n.connect(nf);nf.connect(ng);ng.connect(master);n.start();engine.push(n,nf,ng)}
function engineStop(){engineOn=false;engine.forEach(x=>{try{if(x.stop)x.stop()}catch(e){}});engine=[]}
function boom(){if(!soundOn||!ctx)return;const n=ctx.createBufferSource(),b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++){const t=i/ctx.sampleRate;d[i]=(Math.random()*2-1)*Math.pow(1-t/2,2)}n.buffer=b;const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='lowpass';f.frequency.value=180;g.gain.value=.9;n.connect(f);f.connect(g);g.connect(master);n.start();tone(78,'sawtooth',.5,1.1,25)}
function reset(){elapsed=0;started=performance.now();exploded=false;phase=0;whistleDone=false;train.visible=true;train.position.set(0,0,-66);train.rotation.set(0,0,0);train.scale.setScalar(1);flash.style.opacity=0;cracks.style.opacity=0;status.textContent='A LIGHT APPEARS IN THE DISTANCE';engineStop()}
function impact(){if(exploded)return;exploded=true;phase=4;impactAt=performance.now();engineStop();status.textContent='THE LAST TRAIN — FINAL IMPACT';boom();const p=new THREE.Vector3(0,2.5,train.position.z+3.3);puff(p,260,0xff7b27,9,2.6,.17);puff(p,180,0x9da7b2,2.2,5,.3);puff(p,120,0xffd58a,6,2,.1);const light=new THREE.PointLight(0xff7b28,240,45,2);light.position.copy(p);scene.add(light);setTimeout(()=>scene.remove(light),1300)}
document.getElementById('replay').addEventListener('click',reset);
document.getElementById('sound').addEventListener('click',async()=>{soundOn=!soundOn;const b=document.getElementById('sound');if(soundOn){audio();await ctx.resume();b.textContent='♫ SOUND ON';whistleDone=false;whistle();if(elapsed>2&&!exploded)engineStart()}else{engineStop();b.textContent='♫ ENABLE SOUND'}});
function animate(now){requestAnimationFrame(animate);const t=(now-started)/1000;elapsed=t;
if(t<1.2){train.position.set(0,0,-66);train.rotation.set(0,0,0)}
else if(t<7&&!exploded){const p=Math.min(1,(t-1.2)/5.8),ease=p*p*(3-2*p);train.position.z=-66+75*ease;train.position.x=Math.sin(t*2.2)*(.05+p*.25);train.position.y=Math.sin(t*18)*(.025+p*.06);train.rotation.z=Math.sin(t*2.7)*(.008+p*.025);train.rotation.y=Math.sin(t*1.6)*(.01+p*.035)}
else if(!exploded){train.position.set(0,0,9);train.rotation.set(0,0,0)}
if(t>1.05&&phase===0){phase=1;status.textContent='THE WHISTLE CUTS THROUGH THE STORM';whistle()}
if(t>2.0&&phase===1){phase=2;status.textContent='THE ENGINE ROARS OUT OF THE TUNNEL';engineStart()}
if(t>4.0&&phase===2){phase=3;status.textContent='IT IS COMING STRAIGHT AT YOU'}
if(t>7&&!exploded)impact();
const spin=5+Math.min(1,Math.max(0,(t-1.2)/5.8))*15;wheels.forEach((w,i)=>w.rotation.x=t*spin*(i%2?1:-1));rods.forEach((r,i)=>r.position.y=.82+Math.sin(t*spin)*.12);cars.forEach((c,i)=>{c.position.y=Math.sin(t*4.5-i)*.035;c.rotation.z=Math.sin(t*2-i)*.009});
eyes.forEach((e,i)=>{e.scale.y=.84*(.94+.06*Math.sin(t*2+i))});pupils.forEach((p,i)=>{p.position.x=(i===0?-.34:.34)+Math.sin(t*.9)*.035});mouth.scale.y=.06+Math.max(0,Math.sin(t*5))*.13;face.rotation.y=Math.sin(t*.45)*.045;
if(t>1.25&&t<7&&!exploded&&Math.random()<.85)puff(new THREE.Vector3((Math.random()-.5)*1.4,4.9,train.position.z+1.2),2,0xbfc9d1,.45,2,.12);
const pos=rain.geometry.attributes.position;for(let i=0;i<rainCount;i++){pos.array[i*3+1]-=.28;if(pos.array[i*3+1]<0)pos.array[i*3+1]=20}pos.needsUpdate=true;
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=.016;p.m.position.addScaledVector(p.v,.016);p.v.y+=.002;p.m.material.opacity=Math.max(0,.75-p.age/p.life);if(p.age>p.life){scene.remove(p.m);p.m.geometry.dispose();p.m.material.dispose();particles.splice(i,1)}}
const impactAge=exploded?(now-impactAt)/1000:0;const shake=exploded?Math.max(0,1-impactAge/1.8):Math.max(0,Math.min(1,(t-6.1)/.8))*.07;const sx=(Math.sin(now*.071)+Math.sin(now*.13))*1.3*shake,sy=(Math.cos(now*.08)+Math.sin(now*.15))*1.0*shake;
camera.position.x+=(sx-camera.position.x)*.22;camera.position.y+=(5.3+sy-camera.position.y)*.06;camera.position.z=17;camera.lookAt(sx*.7,2.1+sy,-19);
if(exploded){flash.style.opacity=String(Math.max(0,1-impactAge*2.6));cracks.style.opacity=String(Math.max(0,1-impactAge*1.3));if(impactAge>.2)train.visible=false}
renderer.render(scene,camera)}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});reset();
</script></body></html>
