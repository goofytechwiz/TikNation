<script type="module">

for(let i=0;i<10;i++){const p=box(tunnel,.13,.13,1.7,brass,-5.1+i*1.13,6.9,.4);p.rotation.z=(i-4.5)*.025}

box(loco,2.25,.12,1.7,brass,0,3.73,-1.4);
cyl(loco,1.05,1.05,3.1,iron,0,2.55,1.25,Math.PI/2);
cyl(loco,.97,.97,.18,brass,0,2.55,2.88,Math.PI/2);
cyl(loco,.82,.82,.1,dark,0,2.55,2.99,Math.PI/2);
cyl(loco,.66,.66,.12,glass,0,2.55,3.07,Math.PI/2);
cyl(loco,.28,.34,1.1,dark,0,3.75,1.6);

for(let i=0;i<9;i++){const bar=box(cow,.07,.9,.09,brass,-1.1+i*.275,-.32,.62);bar.rotation.x=-.35}
// Boiler bands and rivets
for(const z of [-.1,.65,1.45,2.25]){const band=cyl(loco,1.07,1.07,.12,brass,0,2.55,z,Math.PI/2);band.material=brass}
for(const side of [-1,1]){
 for(let z=-1.9;z<2.6;z+=.45)for(let y=1.1;y<3.2;y+=.45){const riv=cyl(loco,.045,.045,.06,brass,side*1.405,y,z,0,Math.PI/2,8)}
 // large driving wheels
 for(const z of [-1.45,.45,1.9]){const wheel=cyl(loco,.76,.76,.22,dark,side*1.48,.83,z,0,Math.PI/2,32);const hub=cyl(loco,.19,.19,.25,brass,side*1.49,.83,z,0,Math.PI/2,20);for(let a=0;a<8;a++){const spoke=box(loco,.07,1.1,.08,brass,side*1.62,.83,z);spoke.rotation.z=a*Math.PI/4;spoke.scale.y=.58}}
 box(loco,.1,1.05,.12,brass,side*1.52,1.05,.3);
}
// Headlamp hood and cowling
cyl(loco,.42,.42,.48,brass,0,3.55,3.02,Math.PI/2);cyl(loco,.3,.3,.1,glass,0,3.55,3.3,Math.PI/2);
const headLight=new THREE.SpotLight(0xffd59a,100,48,.42,.5,1.2);headLight.position.set(0,3.55,3.4);headLight.target.position.set(0,1,-10);loco.add(headLight,headLight.target);
const wheels=[];
for(const side of [-1,1])for(const z of [-1.45,.45,1.9]){const pivot=new THREE.Group();pivot.position.set(side*1.5,.83,z);loco.add(pivot);wheels.push(pivot)}
// Cab windows and roof
for(const x of [-.7,.7]){box(loco,.55,.55,.08,glass,x,3.05,-1.05);box(loco,.68,.1,.16,brass,x,3.37,-1.05)}
// Passenger carriages behind locomotive, each with lit windows
const cars=[];
for(let c=0;c<3;c++){const car=new THREE.Group();train.add(car);car.position.set(0,0,-5.1-c*5.2);
box(car,2.65,2.15,4.7,red,0,1.65,0);box(car,2.75,.18,4.85,iron,0,2.82,0);box(car,2.7,.15,4.85,brass,0,.56,0);
for(const side of [-1,1]){box(car,.12,1.65,4.3,brass,side*1.34,1.7,0);for(let z=-1.65;z<=1.7;z+=1.1){box(car,.06,.7,.58,glass,side*1.405,2.0,z);box(car,.08,.09,.68,brass,side*1.44,2.39,z);}}
for(const z of [-1.5,1.5])for(const x of [-.95,.95]){cyl(car,.48,.48,.18,dark,x,.52,z,0,Math.PI/2,24);cyl(car,.13,.13,.2,brass,x,.52,z,0,Math.PI/2,12)}
cars.push(car)}
// Distant pine silhouettes
const treeMat=mat(0x101b20),trunkMat=mat(0x211c18);
for(let i=0;i<100;i++){const x=(Math.random()-.5)*48;if(Math.abs(x)<3)continue;const z=-100+Math.random()*105;const h=3+Math.random()*7;const t=new THREE.Mesh(new THREE.CylinderGeometry(.12,.25,h*.3,6),trunkMat);t.position.set(x,h*.15,z);scene.add(t);for(let j=0;j<3;j++){const cone=new THREE.Mesh(new THREE.ConeGeometry(1.2-j*.25,h*.42,7),treeMat);cone.position.set(x,h*.3+j*h*.22,z);cone.castShadow=true;scene.add(cone)}}
const moonDisc=new THREE.Mesh(new THREE.SphereGeometry(2,24,24),new THREE.MeshBasicMaterial({color:0xc7d4d9}));moonDisc.position.set(-13,15,-58);scene.add(moonDisc);
// Steam and spark particles
const particles=[];const particleGeo=new THREE.SphereGeometry(.12,6,6);
function burst(origin,count,color,speed,life,size){for(let i=0;i<count;i++){const m=new THREE.Mesh(particleGeo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.7}));m.position.copy(origin);m.scale.setScalar(size*(.5+Math.random()));scene.add(m);particles.push({m,v:new THREE.Vector3((Math.random()-.5)*speed,Math.random()*speed,(Math.random()-.5)*speed),life,age:0})}}
const steamEmitters=[new THREE.Vector3(0,4.9,1.6),new THREE.Vector3(-1.1,2.3,2.8),new THREE.Vector3(1.1,2.3,2.8)];
// Floating golden ticket
const ticket=new THREE.Group();scene.add(ticket);ticket.position.set(0,2,-13);ticket.visible=false;
const paper=new THREE.Mesh(new THREE.BoxGeometry(1.25,.04,.62),new THREE.MeshStandardMaterial({color:0xd8b76c,metalness:.25,roughness:.4}));ticket.add(paper);
const ticketEdge=new THREE.EdgesGeometry(new THREE.BoxGeometry(1.25,.05,.62));ticket.add(new THREE.LineSegments(ticketEdge,new THREE.LineBasicMaterial({color:0xffe5a1})));
for(const x of [-.4,.4]){const seal=new THREE.Mesh(new THREE.CircleGeometry(.09,16),new THREE.MeshBasicMaterial({color:0x765126}));seal.rotation.x=-Math.PI/2;seal.position.set(x,.03,0);ticket.add(seal)}
const whistleAudio=new Audio('https://sfxjar.com/audio/3015.mp3');
const boomAudio=new Audio('https://assets.sfx.woven.video/sfx/explosion.wav');
[whistleAudio,boomAudio].forEach(a=>{a.preload='auto';a.volume=.9});
let soundCtx=null,master=null,engineNodes=[],engineOn=false;
let elapsed=0,phase=0,started=performance.now(),soundOn=false,drag=false,lastX=0,lastY=0,lookX=0,lookY=0;
function audioSetup(){if(soundCtx)return;soundCtx=new (window.AudioContext||window.webkitAudioContext)();master=soundCtx.createGain();master.gain.value=1.35;master.connect(soundCtx.destination)}
function startEngine(){if(!soundOn||!soundCtx||engineOn)return;engineOn=true;
 const rumble=soundCtx.createOscillator(),rumbleGain=soundCtx.createGain(),rumbleFilter=soundCtx.createBiquadFilter();
 rumble.type='triangle';rumble.frequency.value=48;rumbleFilter.type='lowpass';rumbleFilter.frequency.value=145;rumbleGain.gain.value=.34;rumble.connect(rumbleFilter);rumbleFilter.connect(rumbleGain);rumbleGain.connect(master);rumble.start();engineNodes.push(rumble,rumbleGain,rumbleFilter);
 const length=2*soundCtx.sampleRate,buffer=soundCtx.createBuffer(1,length,soundCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*.7;
 const noise=soundCtx.createBufferSource(),low=soundCtx.createBiquadFilter(),noiseGain=soundCtx.createGain(),pulse=soundCtx.createOscillator(),pulseGain=soundCtx.createGain();noise.buffer=buffer;noise.loop=true;low.type='lowpass';low.frequency.value=260;noiseGain.gain.value=.22;pulse.type='sine';pulse.frequency.value=3.2;pulseGain.gain.value=.10;pulse.connect(pulseGain);pulseGain.connect(noiseGain.gain);noise.connect(low);low.connect(noiseGain);noiseGain.connect(master);noise.start();pulse.start();engineNodes.push(noise,low,noiseGain,pulse,pulseGain);const buzz=soundCtx.createOscillator(),buzzFilter=soundCtx.createBiquadFilter(),buzzGain=soundCtx.createGain();buzz.type='square';buzz.frequency.value=82;buzzFilter.type='lowpass';buzzFilter.frequency.value=190;buzzGain.gain.value=.055;buzz.connect(buzzFilter);buzzFilter.connect(buzzGain);buzzGain.connect(master);buzz.start();engineNodes.push(buzz,buzzFilter,buzzGain);
}
function stopEngine(){engineOn=false;engineNodes.forEach(n=>{try{if(n.stop)n.stop()}catch(e){}});engineNodes=[]}
function playWhistle(){if(!soundOn||!soundCtx)return;whistleAudio.pause();whistleAudio.currentTime=0;const p=whistleAudio.play();if(p&&p.catch)p.catch(()=>{});const now=soundCtx.currentTime;[370,493,740].forEach((f,i)=>{const o=soundCtx.createOscillator(),g=soundCtx.createGain(),filter=soundCtx.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*.91,now+2.8);filter.type='lowpass';filter.frequency.value=1800;g.gain.setValueAtTime(.001,now);g.gain.linearRampToValueAtTime(i===2?.12:.24,now+.18);g.gain.setValueAtTime(i===2?.12:.24,now+2.1);g.gain.exponentialRampToValueAtTime(.001,now+3.2);o.connect(filter);filter.connect(g);g.connect(master);o.start(now);o.stop(now+3.25)})}
function stopAudio(){stopEngine();[whistleAudio,boomAudio].forEach(a=>{a.pause();a.currentTime=0})}
function playBoom(){if(!soundOn)return;boomAudio.pause();boomAudio.currentTime=0;const p=boomAudio.play();if(p&&p.catch)p.catch(()=>{})}
let exploded=false;
const flash=document.getElementById('impactFlash');let impactTime=0;function explode(){if(exploded)return;exploded=true;phase=4;impactTime=performance.now();stopEngine();status.textContent='ONE FINAL THUNDEROUS DEPARTURE';playBoom();warm.intensity=180;const origin=new THREE.Vector3(0,2.1,train.position.z+3.0);burst(origin,150,0xff8a32,5.2,2.1,.2);burst(new THREE.Vector3(0,3.1,train.position.z+2.1),95,0x9da4a8,1.25,4.4,.38);burst(new THREE.Vector3(0,1.1,train.position.z+3.2),90,0xffd17a,3.8,1.8,.13);burst(new THREE.Vector3(0,2.4,train.position.z+2.7),55,0x171b20,1.6,3.8,.32)}
function reset(){elapsed=0;phase=0;exploded=false;started=performance.now();train.position.z=-53;ticket.visible=false;ticket.position.set(0,2,-13);stopAudio();status.textContent='A HEADLIGHT GLOWS DEEP INSIDE THE TUNNEL'}
document.getElementById('replay').addEventListener('click',reset);
document.getElementById('sound').addEventListener('click',()=>{soundOn=!soundOn;if(soundOn){audioSetup();soundCtx.resume();document.getElementById('sound').textContent='♫ SOUND ON';if(phase===0){phase=1;status.textContent='THE HEADLIGHTS EMERGE FROM THE FOG';playWhistle()}else if(phase===1)playWhistle();if(phase>=2&&phase<3)startEngine()}else{stopAudio();document.getElementById('sound').textContent='♫ ENABLE SOUND'}});
function animate(now){requestAnimationFrame(animate);elapsed=(now-started)/1000;const t=elapsed;
if(t<1.5){train.position.z=-53;train.position.y=0}
else if(t<10.5){const p=(t-1.5)/9;const eased=p*p*(3-2*p);train.position.z=-53+15*eased;train.position.y=Math.sin(t*7)*.018}
else{train.position.z=-38;train.position.y=0}
if(t>1.2&&phase===0){phase=1;status.textContent='THE WHISTLE ECHOES FROM DEEP WITHIN THE TUNNEL';playWhistle()}
if(t>4&&phase===1){phase=2;status.textContent='THE BLACK LOCOMOTIVE BEGINS TO EMERGE';startEngine()}
if(t>8&&phase===2){phase=3;status.textContent='THE ENGINE BURSTS INTO THE MOONLIT NIGHT'}
wheels.forEach((w)=>w.rotation.x=t*3.8);cars.forEach((c,i)=>{c.position.y=Math.sin(t*5-i)*.015});
if(Math.random()<.65&&t>1.3&&t<11){const e=steamEmitters[Math.floor(Math.random()*steamEmitters.length)].clone();e.add(train.position);burst(e,2,0xc6d0d5,.4,2.4,.18)}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=.016;p.m.position.addScaledVector(p.v,.016);p.v.y+=.003;p.m.material.opacity=Math.max(0,.65-p.age/p.life);p.m.scale.multiplyScalar(1.004);if(p.age>p.life){scene.remove(p.m);p.m.material.dispose();particles.splice(i,1)}}
const targetX=lookX*.5,targetY=4.5+lookY*.28;camera.position.x+=(targetX-camera.position.x)*.035;camera.position.y+=(targetY-camera.position.y)*.035;camera.position.z=14;camera.lookAt(lookX*.2,1.2+lookY*.15,-30);renderer.render(scene,camera)}

requestAnimationFrame(animate);
